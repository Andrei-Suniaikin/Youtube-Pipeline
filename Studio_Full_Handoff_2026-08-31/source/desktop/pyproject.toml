[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "videostudio-semantic-montage"
version = "0.2.0.dev2"
description = "Portable production-v2 semantic donor-video montage runner"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy==2.3.5",
  "Pillow==11.3.0",
  "requests==2.34.2",
  "PyYAML==6.0.3",
  "opencv-python==4.14.0.94",
  "scenedetect==0.7",
  "torch==2.13.0",
  "open-clip-torch==3.3.0",
  "edge-tts==7.2.7",
]

[project.scripts]
semantic-montage = "semantic_montage.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["semantic_montage*"]

