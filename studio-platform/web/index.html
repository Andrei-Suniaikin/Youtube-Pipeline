    // раскрывается на месте. «Кнопка выше» словами заставляла её искать глазами.
    app.append($(`<div class="card">${emptyBox({
      why: 'Каналов ещё нет — студии не для кого работать.',
      means: 'Канал — это расписание выходов, пресет и профиль заливки. Без него '
           + 'ссылку на донора поставить некуда.',
      href: '#/channels', id: 'ch-first', act: 'Завести первый канал'})}</div>`));
    const first = app.querySelector('#ch-first');
    if (first) first.onclick = ev => {
      ev.preventDefault();
      bar.querySelector('#newch').click();
    };
    return;
  }
  const cls = c => c.status === 'active' ? 'active'
                 : c.status === 'paused' ? 'paused'
                 : c.status === 'problem' ? 'problem' : '';
  const panel = channelSieve(d.channels, stats, list => draw(list));
  app.append(panel.el);
  const grid = $('<div class="chgrid"></div>').firstElementChild;
  app.append(grid);

  // ── Режим выбора (владелец 30.09.2026: «как в айфоне в галерее — кнопка "Выбрать",
  // и потом уже выбор действия с этими карточками»). Работает ПОВЕРХ отбора: «выбрать
  // все отобранные» берёт то, что сейчас в сетке, а не все каналы вообще.
  let picking = false;
  const picked = new Set();     // id отмеченных, строками: data-атрибут даёт строку
  let shown = [];               // что сейчас в сетке — на это и работает «выбрать все»
  const bulk = $(`<div class="bulkbar" id="bulkbar" hidden>
    <div class="bulkrow">
      <span id="b-count">ничего не выбрано</span>
      <button class="ghost small" id="b-all">выбрать все отобранные</button>
      <button class="ghost small" id="b-none">снять выбор</button>
      <span class="bulksep"></span>
      <button class="small b-act" data-act="paused">Поставить на паузу</button>
      <button class="small b-act" data-act="active">Вернуть в работу</button>
      <button class="small b-act" data-act="archived">Убрать в архив</button>
      <button class="small b-act" data-act="tag_add">Проставить тег</button>
      <button class="small b-act" data-act="tag_remove">Снять тег</button>
      <button class="small b-act" data-act="channel_preset">Назначить пресет</button>
      <button class="ghost small" id="b-off">Готово</button>
    </div>
    <div class="note muted bnote">Удалить каналы пачкой нельзя: удаление необратимо и
      у канала с историей не проходит вовсе. Массовый безопасный шаг — архив: канал
      перестаёт работать, а прошлое и настройки остаются на месте.</div>
  </div>`).firstElementChild;
  app.append(bulk);
  const countBox = bulk.querySelector('#b-count');
  const pickBtn = bar.querySelector('#pickmode');

  pickBtn.onclick = () => setPicking(!picking);
  bulk.querySelector('#b-off').onclick = () => setPicking(false);
  bulk.querySelector('#b-none').onclick = () => { picked.clear(); draw(shown); };
  bulk.querySelector('#b-all').onclick = () => {
    // Только отобранные: тот, кого отбор скрыл, человеку сейчас не виден, и молча
    // менять его — значит сделать не то, что он видел на экране.
    for (const c of shown) picked.add(String(c.id));
    draw(shown);
  };
  bulk.querySelectorAll('.b-act').forEach(b => b.onclick = () => askThenRun(b.dataset.act));

  draw(panel.apply());
  return;

  function setPicking(on){
    picking = on;
    if (!on) picked.clear();
    pickBtn.textContent = on ? 'Отменить выбор' : 'Выбрать';
    bulk.hidden = !on;
    grid.classList.toggle('picking', on);
    draw(shown);
  }

  function pickCount(){
    const n = picked.size;
    countBox.textContent = n
      ? `выбрано ${n} ${plural(n, 'канал', 'канала', 'каналов')}`
      : 'ничего не выбрано';
    bulk.querySelectorAll('.b-act').forEach(b => { b.disabled = !n; });
  }

  function draw(list){
    shown = list;
    // Отмеченный канал, которого отбор больше не показывает, из выбора уходит: иначе
    // действие задело бы канал, которого человек на экране уже не видит.
    const видно = new Set(list.map(c => String(c.id)));
    for (const id of [...picked]) if (!видно.has(id)) picked.delete(id);
    grid.innerHTML = list.map(c => `
    <div class="chcard ${cls(c)}${picking && picked.has(String(c.id)) ? ' on' : ''}"
      data-id="${c.id}" tabindex="0"
      ${picking ? `role="checkbox" aria-checked="${picked.has(String(c.id))}"`
                : 'role="link"'}
      aria-label="Канал ${esc(c.name)}">
      ${picking ? '<span class="chmark">✓</span>' : ''}
      ${supplyCorner(c.supply)}
      <h3>${esc(c.name)}</h3>
      <div class="meta">${esc(c.handle || '—')} · ${esc(c.lang)}</div>
      <div class="meta" style="margin-top:7px">
        ${c.per_day} ${c.per_day === 1 ? 'выход' : 'выхода'} в неделю · горизонт ${c.horizon_days} дн
      </div>
      <div class="meta">готовим за ${c.lead_days} дн ·
        ${c.has_profile ? 'профиль есть' : '<span style="color:var(--bad)">профиля нет</span>'}</div>
      ${tileStats(stats[c.id])}
      <div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">
        <span class="pill ${
          c.status === 'active' ? 's-done' : c.status === 'problem' ? 's-error' : 's-idle'
        }">${esc(CH_STATUS[c.status] || c.status)}</span>
        ${c.has_uc ? '' : '<span class="pill s-error">ID пустой</span>'}
        ${c.has_cover_preset === false
          ? '<span class="pill s-error" title="выпуски этого канала встанут на обложке">нет пресета обложек</span>'
          : ''}
        ${c.has_text_preset === false
          ? '<span class="pill s-queued" title="сценарий пишется на умолчаниях рерайта: без ведущего и стиля канала">нет пресета текста</span>'
          : ''}
        ${supplyPill(c.supply)}
      </div>
    </div>`).join('');
    if (!list.length){
      grid.innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty">
        Ни один канал не подошёл. Смягчите поиск или сбросьте отборы.</div></div>`;
    }
    grid.querySelectorAll('.chcard').forEach(el => {
      // Главная ловушка режима выбора: привычный клик по карточке не должен уносить со
      // страницы посреди выбора — уход стирает всё отмеченное, и человек начинает
      // заново. Поэтому в режиме выбора тот же клик отмечает, а не ведёт в канал.
      const hit = () => {
        if (picking){ mark(el); return; }
        location.hash = '#/channel/' + el.dataset.id;
      };
      el.onclick = hit;
      el.onkeydown = ev => {
        if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); hit(); }
      };
    });
    pickCount();
  }

  function mark(el){
    const id = el.dataset.id;
    if (picked.has(id)) picked.delete(id); else picked.add(id);
    el.classList.toggle('on', picked.has(id));
    el.setAttribute('aria-checked', String(picked.has(id)));
    pickCount();
  }

  // Спросить то, без чего действие не выполнить (тег, пресет), и подтвердить то, чего
  // человек не ждёт увидеть массовым (архив).
  function askThenRun(act){
    const n = picked.size;
    if (!n){ toast('Сначала отметьте каналы'); return; }
    const каналов = `${n} ${plural(n, 'канал', 'канала', 'каналов')}`;
    if (act === 'tag_add' || act === 'tag_remove'){
      const known = [...new Set(d.channels.flatMap(c => c.tags || []))]
        .sort((a, b) => a.localeCompare(b, 'ru'));
      const add = act === 'tag_add';
      modal(add ? 'Проставить тег' : 'Снять тег',
        `<div class="fldrow"><label>Тег</label>
           <input id="b-tag" list="b-tags" style="width:240px" placeholder="ww2">
           <datalist id="b-tags">${known.map(t =>
             `<option value="${esc(t)}"></option>`).join('')}</datalist></div>
         <div class="note muted">${каналов}. ${add
           ? 'Тег добавится к тем, что на канале уже стоят — ничего не сотрётся.'
           : 'Снимется только этот тег, остальные останутся.'}</div>`,
        {ok: 'Применить', onOk: async (body, close) => {
          const tag = body.querySelector('#b-tag').value.trim();
          if (!tag) throw new Error('впишите тег');
          close();
          await runBulk(act, {tag});
        }});
      return;
    }
    if (act === 'channel_preset'){
      pickPreset(каналов);
      return;
    }
    if (act === 'archived'){
      confirmModal('Убрать в архив',
        `Убрать в архив ${каналов}? В архиве канал перестаёт работать, но история и `
        + 'настройки остаются — вернуть его в работу можно тем же списком.',
        () => runBulk(act, {}));
      return;
    }
    runBulk(act, {});
  }

  async function pickPreset(каналов){
    let list = [];
    try{ list = (await api('/ui/channel-presets')).presets || []; }
    catch(e){ toast(e.message); return; }
    // Первым пунктом — пустая заготовка, а НЕ «снять с пресета». Разбор 30.09.2026:
    // раньше первым и потому выбранным по умолчанию стояло снятие, кнопка называлась
    // «Назначить», подтверждения не было — и человек, нажавший «Назначить» не глядя,
    // разом снимал пресет со всех отмеченных каналов. Вернуть это одним действием
    // нельзя: какой канал на каком пресете сидел, система после снятия не помнит.
    const m = modal('Назначить пресет канала',
      `<div class="fldrow"><label>Пресет</label>
         <select id="b-preset" style="width:260px">
           <option value="">— выберите пресет —</option>${list.map(p =>
             `<option value="${p.id}">${esc(p.name)}</option>`).join('')}
           <option value="off">— снять с пресета —</option></select></div>
       <div class="note muted">${каналов}. Пока канал сидит на пресете, перекрытые
         поля приходят из пресета, и правка пресета меняет их у всех сразу.</div>`,
      {ok: 'Назначить', onOk: async (body, close) => {
        const val = body.querySelector('#b-preset').value;
        if (!val){
          // Окно закрывать не за что: выбора не было. Кнопку возвращаем в запертое
          // состояние — общий обработчик окна включает её обратно в любом случае.
          setTimeout(sync, 0);
          return;
        }
        if (val === 'off'){
          close();
          // Снятие спрашиваем отдельно и с числом: это потеря настроек, а не смена.
          return confirmModal('Снять пресет?',
            `${каналов} перестанут брать настройки из пресета и останутся со своими. `
            + `Вернуть одним действием не получится: чей это был пресет, система не помнит.`,
            () => runBulk('channel_preset', {preset_id: null}));
        }
        close();
        await runBulk('channel_preset', {preset_id: Number(val)});
      }});
    // Пока пресет не выбран, «Назначить» заперта: кнопка, которая на пустом выборе
    // что-то делает, и есть та ловушка, из-за которой затевалась эта правка.
    const pick = m.el.querySelector('#b-preset');
    const ok = m.el.querySelector('.m-ok');
    const sync = () => { if (ok) ok.disabled = !pick.value; };
    pick.addEventListener('change', sync);
    sync();
  }

  async function runBulk(act, extra){
    const ids = [...picked].map(Number);
    // Кнопки действий гасим на время запроса: второй клик по «на паузу» пока идёт
    // первый — это второй проход по тем же каналам и второй ответ про один результат.
    bulk.querySelectorAll('.b-act').forEach(b => { b.disabled = true; });
    let out;
    try{
      out = await post('/ui/channels/bulk', Object.assign({ids, action: act}, extra));
    }catch(e){
      // Отказ всему запросу — отмеченное не тронуто, и выбор остаётся как был:
      // человеку нужно исправить причину и нажать снова, а не отмечать заново.
      toast(e.message);
      pickCount();
      return;
    }
    // Итог называем поимённо. «Сделано 18, не вышло у двух» без имён отправляет
    // человека искать эти два вручную по всему списку.
    const parts = [`${out.action}: сделано ${out.done.length}`];
    if (out.same.length) parts.push(`менять было нечего у ${out.same.join(', ')}`);
    if (out.failed.length) parts.push('не вышло — '
      + out.failed.map(f => `${f.name}: ${f.why}`).join('; '));
    parts.push('денег это не тратит');
    toast(parts.join(' · '), out.failed.length ? 'warn' : 'ok');
    // Список перечитываем, а страницу не перерисовываем: режим выбора и отбор остаются
    // на месте. Отмеченными оставляем только те, у кого не вышло, — их видно, и повтор
    // идёт ровно по ним, а не по всей пачке второй раз.
    try{
      const fresh = await api('/ui/channels');
      d.channels.length = 0;
      d.channels.push(...fresh.channels);
      panel.refill();
    }catch(e){ toast(e.message); }
    picked.clear();
    for (const f of out.failed) picked.add(String(f.id));
    draw(panel.apply());
  }
}

// Календарь месяцами: в каждом дне справа сверху — сколько роликов подтверждённо
// вышло. Лента по слотам остаётся ниже: сетка отвечает «сколько и когда», лента —
// «что именно».
function monthGrid(byDay, tz){
  const days = Object.keys(byDay).sort();
  if (!days.length) return $('<div></div>');
  const box = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Календарь <span class="muted"
      style="font-weight:400;text-transform:none;letter-spacing:0">· ${esc(tz)}</span></div>
    <div id="months"></div></div>`);
  const months = {};
  for (const d of days) months[d.slice(0, 7)] = true;
  const out = [];
  for (const m of Object.keys(months).sort()){
    const [y, mm] = m.split('-').map(Number);
    const first = new Date(Date.UTC(y, mm - 1, 1));
    const total = new Date(Date.UTC(y, mm, 0)).getUTCDate();
    // Понедельник первым: в русском календаре неделя начинается с него.
    const shift = (first.getUTCDay() + 6) % 7;
    const cells = [];
    for (let i = 0; i < shift; i++) cells.push('<div class="day out"></div>');
    for (let dnum = 1; dnum <= total; dnum++){
      const key = `${m}-${String(dnum).padStart(2, '0')}`;
      const b = byDay[key];
      // Подтверждённый выход и просто назначенный срок — два разных числа, а не одно
      // (ТЗ §11). Раньше сетка считала «вышло» по `done`, то есть по подтверждённому
      // расписанию: месяц выглядел выпущенным целиком ещё до того, как хоть один
      // ролик проверили. Яркое число — факт (`public`), бледное — только замысел.
      const out_ = b ? (b.public || 0) : 0;
      const done = b ? (b.done || 0) : 0;
      const bad = b ? b.missed : 0;
      // Остановленный выход (`blocked`) сервер присылал всегда, а сетка его не читала:
      // остановленный день выглядел как свободный, хотя под сеткой горело «остановлен: 2».
      // «Идёт» и «запланировано» стояли одной точкой цвета действия — теперь у каждого
      // свой знак и цвет состояния, как в строках под сеткой (CAL_CLS). Проверка облика
      // 22.09.2026.
      const stop = b ? (b.blocked || 0) : 0;
      const run = b ? (b.running || 0) : 0;
      const plan = b ? (b.planned || 0) : 0;
      const said = b ? [out_ && `вышло публично: ${out_}`,
        done && `назначено, выход не подтверждён: ${done}`,
        stop && `остановлено: ${stop}`,
        run && `идёт: ${run}`, plan && `запланировано: ${plan}`,
        bad && `пропущено: ${bad}`].filter(Boolean).join(', ') : '';
      const mark = out_ ? `<span class="cnt">${out_}</span>`
        : stop ? '<span class="cnt bad">!</span>'
        : done ? `<span class="cnt plan">${done}→</span>`
        : run ? '<span class="cnt run">◐</span>'
        : plan ? '<span class="cnt plan">·</span>'
        : bad ? '<span class="cnt bad">—</span>' : '';
      cells.push(`<div class="day ${b ? '' : 'out'} ${bad ? 'miss' : ''} ${
        stop ? 'blocked' : ''}"${said ? ` title="${esc(said)}"` : ''}>
        <span class="n">${dnum}</span>${mark}</div>`);
    }
    out.push(`<div class="mon"><div class="mname">${new Date(Date.UTC(y, mm - 1, 1))
      .toLocaleString('ru-RU', {month: 'long', year: 'numeric', timeZone: 'UTC'})}</div>
      <div class="dow">${['пн','вт','ср','чт','пт','сб','вс']
        .map(x => `<span>${x}</span>`).join('')}</div>
      <div class="grid7">${cells.join('')}</div></div>`);
  }
  box.querySelector('#months').innerHTML = out.join('');
  return box;
}

async function channelReleases(id, d){
  app.append(monthGrid(d.by_day || {}, d.tz || ''));

  const counts = Object.entries(d.counts)
    .map(([k, n]) => `<span class="pill ${CAL_CLS[k]}">${CAL_TITLE[k]}: ${n}</span>`).join(' ');
  app.append($(`<div class="toolbar">${counts}
    ${d.waiting_without_slot ? `<span class="pill s-queued">без даты ждут:
      ${d.waiting_without_slot}</span>` : ''}</div>`));

  // Ссылки, которые уже поставлены, но даты не получили: раньше о них говорило только
  // число в плашке, и посмотреть, что за ролик поставлен, было негде (жалоба владельца
  // 18.09.2026). Дата появится сама, как только у канала будет расписание, — выпуск
  // заводит движок, поэтому здесь только показать и убрать лишнее.
  const waiting = d.waiting_items || [];
  if (waiting.length){
    const card = $(`<div class="card">
      <div class="sec">Ждут даты ${hintDot('Дата назначится сама, как только у канала '
        + 'появится расписание: очередь раскладывает ссылки по свободным выходам.')}</div>
      <table><thead><tr><th>Ролик</th><th>Поставлен</th><th style="width:90px"></th>
        </tr></thead><tbody>${waiting.map(w => `<tr data-id="${w.id}">
        <td><div style="font-weight:600">${esc(w.title || 'название неизвестно')}</div>
            <div class="muted"><a href="${esc(w.url)}" target="_blank" rel="noopener"
              >${esc(w.url)}</a></div>
            ${w.note ? `<div class="note muted">${esc(w.note)}</div>` : ''}</td>
        <td class="muted">${when(w.created)}</td>
        <td><button class="ghost small pl-del">Убрать</button></td></tr>`).join('')}
      </tbody></table>
      </div>`);
    app.append(card);
    card.querySelectorAll('button.pl-del').forEach(b => b.onclick = () => {
      const id = b.closest('tr').dataset.id;
      confirmInline(b, 'Убрать ссылку из плана?', async () => {
        b.disabled = true;
        try{ await post(`/ui/plan/${id}/cancel`); await render(); }
        catch(e){ b.disabled = false; toast(e.message); }
      });
    });
  }

  // Флоу создания: ссылки встают в ближайшие свободные слоты. Это и есть «залить
  // видосы» — дальше конвейер делает их сам по расписанию канала.
  //
  // Чего не хватает каналу — показываем ДО нажатия. Поставить ссылку заранее можно и
  // без этого (кнопку не блокируем), но молча принять ссылку, которая не выйдет из
  // очереди, — это то, на чём 17.09 споткнулся владелец: канал без расписания,
  // пресета и профиля принимал ссылку и ничего не объяснял.
  const ch = d.channel || {};
  const lacks = [
    !ch.uc && 'нет ID YouTube — выпуски не заводятся',
    !Object.keys(ch.schedule || {}).length && 'нет расписания — ссылки встанут без даты',
    !ch.preset_vsgen_id && 'не выбран пресет — выпуску нечем делать озвучку и кадры',
    !(ch.presets || {}).cover && 'не выбран пресет обложек — выпуски встанут на обложке',
    !ch.profile_id && 'не выбран профиль AdsPower — заливать нечем',
    !ch.host_id && 'не выбрана машина заливки',
  ].filter(Boolean);
  // Выйдет, но не таким, как задумано (03.10.2026): без пресета текста рерайт пишет на
  // своих умолчаниях — без ведущего и стиля канала. Это не «не выйдет», поэтому отдельно.
  const worse = [
    !(ch.presets || {}).rewrite && 'не выбран пресет текста — сценарий пишется на умолчаниях '
      + 'рерайта, без ведущего и стиля канала',
  ].filter(Boolean);
  const add = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Поставить ролики</div>
    <div class="secbody">
    ${lacks.length ? `<div class="note bad" style="margin-bottom:10px">Ролик с этого
      канала сейчас не выйдет: ${lacks.map(esc).join('; ')}.
      <a href="#/channel/${encodeURIComponent(id)}/nastroyki">Настроить канал →</a></div>` : ''}
    ${worse.length ? `<div class="note warn" style="margin-bottom:10px">Ролик выйдет, но не
      таким, как задуман: ${worse.map(esc).join('; ')}.
      <a href="#/channel/${encodeURIComponent(id)}/nastroyki">Настроить канал →</a></div>` : ''}
    <textarea id="lk" rows="4" style="width:100%"
      placeholder="ссылки на доноров, по одной в строке — разложатся по свободным датам"></textarea>
    <div style="margin-top:10px"><button id="prev" class="small">Показать, что будет</button>
      <button id="go" class="small" style="margin-left:8px" disabled>Поставить</button></div>
    <div id="pv"></div></div></div>`);
  app.append(add);
  const pv = add.querySelector('#pv');
  const fmt = v => {
    const t = new Date(v);
    return isNaN(t) ? String(v)
      : t.toLocaleString('ru-RU', {weekday: 'short', day: '2-digit', month: '2-digit',
                                   hour: '2-digit', minute: '2-digit'});
  };
  add.querySelector('#prev').onclick = async () => {
    const pb = add.querySelector('#prev');
    pb.disabled = true;
    pv.innerHTML = '';
    try{
      const out = await post('/ui/links/preview',
                             {channel_id: Number(id), links: add.querySelector('#lk').value});
      // Ответ — `placed` (даты слотов), `queued` (сколько без даты), `skipped` (дубли).
      // Раньше здесь читалось несуществующее `items`: предпросмотр всегда писал «ничего
      // не разобрано», и «Поставить» не включалась никогда.
      const placed = out.placed || [], skipped = out.skipped || [], queued = out.queued || 0;
      const parts = [];
      if (placed.length) parts.push(`<b>Встанет на даты:</b> ${placed.map(v => esc(fmt(v))).join(', ')}`);
      if (queued) parts.push(`<b>Без даты:</b> ${queued} — в расписании нет свободных выходов
        на ${esc(String((out.channel || {}).horizon_days ?? ''))} дн вперёд; встанут, когда
        выходы освободятся`);
      if (skipped.length) parts.push(`<b>Пропустятся как дубли:</b> ${skipped.map(esc).join(', ')}`);
      pv.innerHTML = `<div class="note muted" style="margin-top:10px">${
        parts.join('<br>') || 'ничего не разобрано — вставьте ссылки на YouTube'}</div>
        <div id="pv-donors"></div>`;
      add.querySelector('#go').disabled = !(placed.length || queued);
      // Даты показаны — теперь ролики. Отдельным запросом: он ходит в сеть через
      // выходы субтитров, и на мёртвом туннеле это десятки секунд. Склеить его с
      // датами значило бы держать пустой экран всё это время.
      checkDonors(pv.querySelector('#pv-donors'), Number(id), out.fresh || []);
    }catch(e){ pv.innerHTML = ''; toast(e.message); }
    finally{ pb.disabled = false; }
  };
  add.querySelector('#go').onclick = async () => {
    const b = add.querySelector('#go');
    b.disabled = true;
    try{
      const out = await post('/ui/links', {channel_id: Number(id),
                                           links: add.querySelector('#lk').value});
      const n = (out.placed || []).length, q = out.queued || 0;
      toast(`Поставлено: на даты ${n}, без даты ${q}`, 'ok');
      await render();
    }catch(e){ toast(e.message); b.disabled = false; }
  };

  if (!d.calendar.length){
    // Причину берём из САМОГО расписания, а не из пустого календаря. Разбор 30.09.2026:
    // раньше здесь стояло только «расписание не задано», и канал с заданным расписанием,
    // у которого лента пуста по другой причине (горизонт короче ближайшего выхода,
    // история не показана, все слоты впереди окна), получал прямую неправду — а человек
    // шёл править то, что и так в порядке.
    const есть = Object.keys((d.channel || {}).schedule || {}).length > 0;
    app.append($(`<div class="card">${emptyBox(есть ? {
      why: 'Выходов в этом окне нет, хотя расписание задано.',
      means: 'Лента показывает выходы за выбранный отрезок. Ближайший может быть '
           + 'дальше горизонта канала — тогда он появится, когда подойдёт срок.',
      href: `#/channel/${encodeURIComponent(id)}/nastroyki`,
      act: 'Посмотреть расписание и горизонт'} : {
      why: 'Расписание не задано — выходов у канала нет.',
      means: 'Поставить ссылку можно и сейчас, но даты она не получит и из очереди '
           + 'не выйдет: очередь раскладывает ссылки по выходам расписания.',
      href: `#/channel/${encodeURIComponent(id)}/nastroyki`,
      act: 'Задать расписание'})}</div>`));
    return;
  }
  app.append(calendarFeed(d));
  if ((d.uploads || []).length) app.append(uploadsCard(d.uploads, d.video_stats));
  app.append($(`<div class="note muted" style="margin-top:10px">
    <a href="#/releases">Все выпуски по всем каналам →</a></div>`));
}

/* ────────── предпросмотр ссылок: что за ролики за ними стоят (C4) ────────── */

/* Вердикт проверки донора. Состояний четыре, и четвёртое — не украшение: «не смогли
   проверить» и «донор плохой» это разные вещи, а первое случается ровно тогда, когда
   лёг туннель субтитров. Покрасить его как отказ значит отправить владельца
   выбрасывать исправные ссылки вместо того, чтобы поднять выход. */
const DONOR_CLS   = {ok:'s-done', warn:'s-queued', reject:'s-error', unknown:'s-idle'};
const DONOR_TITLE = {ok:'годится', warn:'с оговоркой', reject:'не годится',
                     unknown:'не смогли проверить'};
const DONOR_DOT   = {ok:'✓', warn:'!', reject:'✗', unknown:'?'};

/* Что делать с «не смогли проверить» — у каждой причины свой ответ. Одной общей
   строкой они неразличимы, и тогда владелец ждёт полчаса там, где надо поднимать
   туннель, — или наоборот, лезет в туннель, когда достаточно подождать. */
const DONOR_FAIL_ACT = {
  exits_quota: 'пройдёт само: выходы упёрлись в квоту YouTube, позже проверится',
  exit_dead:   'само не пройдёт: туннель выхода не отвечает — нужен владелец',
  budget:      'не успели за отведённое время — нажмите «Показать, что будет» ещё раз',
  over_limit:  'в пачке больше ссылок, чем проверяется за раз — разбейте на части',
  off:         'проверка субтитров выключена настройкой',
  no_lib:      'на сервере нет библиотеки расшифровок — чинится на сервере',
  ours:        'сбой на нашей стороне — про ролик мы ничего не узнали',
  no_net:      'в сети не спрашивали, а в кэше этого ролика нет',
  not_checked: 'субтитры не проверяли',
};

/* Субтитры: три ответа, а не два. `has_subs === null` — «не проверяли», и писать
   вместо него «субтитров нет» нельзя: по этой строке человек решает, выбрасывать
   ссылку или платить за неё. */
function donorSubsText(d){
  if (d.has_subs === true) return `субтитры есть · ${d.chars} знаков`;
  if (d.has_subs === false) return 'субтитров нет';
  return 'субтитры не проверяли';
}

/* Длина: измеренная — числом, посчитанная из знаков — только как оценка. Показать
   оценку как факт значит отклонять ролики по догадке. */
function donorLengthText(d){
  if (!d.minutes) return '';
  const mins = Math.round(d.minutes);
  return d.length_from === 'оценка по знакам'
    ? `≈ ${mins} мин — оценка по знакам, длину не измеряли`
    : `${mins} мин`;
}

/* Отдельный запрос про ролики: даты уже на экране, ожидание названо вслух и
   ограничено сервером по часам. Ошибка отвечает на три вопроса — что упало, потрачены
   ли деньги, что нажать. */
async function checkDonors(box, channelId, urls){
  if (!box || !urls.length) return;
  box.innerHTML = `<div class="note muted" style="margin-top:10px">Проверяем ролики:
    есть ли субтитры и сколько в них знаков. Это до полуминуты и денег не тратит.</div>`;
  let out;
  try{ out = await post('/ui/links/check', {channel_id: channelId, urls}); }
  catch(e){
    box.innerHTML = `<div class="note bad" style="margin-top:10px">Проверить ролики не
      удалось: ${esc(e.message)}. Денег это не стоило — проверка бесплатна, и в план
      ничего не записано. Ссылки можно ставить кнопкой «Поставить»: про сами ролики мы
      ничего плохого не узнали.</div>`;
    return;
  }
  if (!box.isConnected) return;          // ушли с экрана, пока проверяли
  box.innerHTML = donorsHtml(out);
}

function donorsHtml(out){
  const list = out.donors || [];
  if (!list.length) return '';
  const sum = out.donor_summary || {};
  const unknown = list.filter(d => d.verdict === 'unknown');
  const quota = unknown.filter(d => d.reason === 'exits_quota').length;
  const dead  = unknown.filter(d => d.reason === 'exit_dead').length;
  const rejects = list.filter(d => d.verdict === 'reject').length;
  const head = [
    sum.ok    ? `годятся: ${sum.ok}` : '',
    sum.warn  ? `с оговоркой: ${sum.warn}` : '',
    sum.reject ? `не годятся: ${sum.reject}` : '',
    sum.unknown ? `не смогли проверить: ${sum.unknown}` : '',
  ].filter(Boolean).join(' · ');
  return `<div class="card" style="margin-top:12px">
    <div class="sec">Что за ролики${head ? ` — ${esc(head)}` : ''}</div>
    ${list.map(d => `<div class="stage">
      <div class="dot ${DONOR_CLS[d.verdict] || 's-idle'}">${DONOR_DOT[d.verdict] || '?'}</div>
      <div class="body">
        <div class="name">${esc(d.title || 'название не добыли')}
          <span class="pill ${DONOR_CLS[d.verdict] || 's-idle'}"
                style="margin-left:8px">${esc(DONOR_TITLE[d.verdict] || d.verdict)}</span></div>
        <div class="facts">${[
            esc(donorSubsText(d)),
            esc(donorLengthText(d)),
            d.lang_ru ? esc(d.lang_ru) : '',
            d.cached ? 'из кэша, в сеть не ходили' : '',
          ].filter(Boolean).join(' · ')}</div>
        <div class="note muted"><a href="${esc(d.url)}" target="_blank"
          rel="noopener">${esc(d.url)}</a></div>
        <div class="note ${d.verdict === 'reject' ? 'bad' : 'muted'}">${esc(d.why || '')}</div>
        ${d.verdict === 'unknown' && DONOR_FAIL_ACT[d.reason]
          ? `<div class="note muted">${esc(DONOR_FAIL_ACT[d.reason])}</div>` : ''}
        ${(d.warns || []).length > 1 ? `<div class="note muted">${
          d.warns.map(w => esc(w.why)).join('<br>')}</div>` : ''}
      </div></div>`).join('')}
    <div class="secbody">
      ${dead ? `<div class="note bad">Туннель выхода субтитров не отвечает:
        ${dead} ${dead === 1 ? 'ссылку' : 'ссылок'} проверить не смогли. Ждать
        бесполезно — выход поднимает владелец. Ставить их можно: про сами ролики мы
        ничего плохого не узнали.</div>` : ''}
      ${quota ? `<div class="note muted">Выходы субтитров упёрлись в квоту YouTube:
        ${quota} ${quota === 1 ? 'ссылка' : 'ссылок'} не проверены. Это проходит само —
        повторите предпросмотр позже.</div>` : ''}
      ${rejects ? `<div class="note bad">Проверка советует, а не запрещает: ${rejects}
        отклонённых ${rejects === 1 ? 'ссылка встанет' : 'ссылок встанут'} в план, если
        нажать «Поставить». Уберите их из поля, если платить за них не нужно.</div>` : ''}
      ${out.duplicates ? `<div class="note muted">Одна и та же ссылка встречается в
        пачке несколько раз: повторов ${out.duplicates}, проверены они по одному разу.
        Строк поэтому меньше, чем ссылок в поле, — это не пропуск. В план повтор тоже
        встанет один раз: канал не платит дважды за один ролик.</div>` : ''}
      ${out.timed_out ? `<div class="note muted">Проверка не уложилась в
        ${Math.round(out.wall_sec || 0)} с и была остановлена — что успели, показано
        выше. Обычно так выглядит мёртвый выход субтитров: посмотрите плитку «Выходы
        субтитров» в разделе Профиль → Админ.</div>` : ''}
      <div class="note muted">${esc(out.donor_note || '')}</div>
    </div></div>`;
}

// Заливка на YouTube. Кнопки «залить ещё раз» здесь нет намеренно: начиная со стадии
// «файл ушёл в форму» повторная заливка запрещена навсегда — второй заход создаст на
// канале дубль. Разрешено только найти начатый ролик и довести его, и это делает сам
// заливщик. Экран показывает состояние, а не предлагает недопустимое действие.
/* Просмотры ролика приписываются к строке заливки по идентификатору. Числа нет —
   строки нет: у только что залитого ролика просмотров ещё не спрашивали, и «0
   просмотров» было бы неправдой, а не отсутствием данных. */
function videoViews(st){
  if (!st || st.views === null || st.views === undefined) return '';
  const grew = (st.delta === null || st.delta === undefined) ? ''
    : ` <span class="delta ${st.delta > 0 ? 'up' : ''}">${
        st.delta > 0 ? '+' + bigNum(st.delta) : bigNum(st.delta)}</span>
        <span class="muted">за неделю</span>`;
  return `<b>${bigNum(st.views)}</b> ${plural(st.views, 'просмотр', 'просмотра',
    'просмотров')}${grew}`;
}

function uploadsCard(rows, byVideo){
  return $(`<div class="card" style="margin-top:16px">
    <div class="sec">Заливка на YouTube ${hintDot('Вердикт читается из состояния строки '
      + 'в YouTube Studio, а не из текста на странице: для запланированного ролика '
      + 'Studio пишет «Video published».')}</div>
    ${rows.map(u => `<div class="stage">
      <div class="dot ${u.verdict === 'scheduled' || u.verdict === 'published' ? 's-done'
                      : u.error ? 's-error'
                      : u.phase_rank >= 2 ? 's-running' : 's-queued'}">${
        u.verdict === 'scheduled' || u.verdict === 'published' ? '✓'
        : u.error ? '!' : u.phase_rank >= 2 ? '↑' : '·'}</div>
      <div class="body">
        <div class="name">${u.url
          ? `<a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.title)}</a>`
          : esc(u.title)}</div>
        <div class="upsteps">${u.phases.map(f =>
          `<span class="upstep ${f.done ? 'on' : ''}" title="${esc(f.title)}"></span>`).join('')}
          <span class="muted" style="font-size:12px">${esc(u.phase_title)}</span></div>
        ${videoViews((byVideo || {})[u.video_id])
          ? `<div class="facts">${videoViews((byVideo || {})[u.video_id])}</div>` : ''}
        <div class="facts">${[
            u.verdict_title && ('вердикт: ' + u.verdict_title),
            u.video_id && ('ролик ' + u.video_id),
            u.visibility && ('видимость: ' + u.visibility),
            u.schedule_iso && ('выход: ' + u.schedule_iso),
          ].filter(Boolean).map(esc).join(' · ') || '—'}</div>
        ${u.no_reupload ? `<div class="note muted">файл уже у YouTube —
          повторная заливка запрещена, только продолжение начатого</div>` : ''}
        ${u.error ? `<div class="note bad">${esc(u.error)}</div>` : ''}
      </div></div>`).join('')}
  </div>`);
}

async function viewChannel(id){
  const d = await api('/ui/channels/' + encodeURIComponent(id) + '?history=14');
  const c = d.channel;

  app.innerHTML = '';
  app.append($(`<a class="back" href="#/channels">← ко всем каналам</a>
    <h1>${esc(c.name)}</h1>
    <p class="sub">${[c.handle, c.lang, c.niche].filter(Boolean).map(esc).join(' · ')}</p>
    ${c.uc ? '' : `<span class="pill s-error">ID пустой — выпуски на этом канале
      не заводятся. Вписать во вкладке «Настройки» ниже — один раз</span>`}`));
  const мало = ((await attention()).low_supply || []).find(x => String(x.id) === String(id));
  if (мало) app.append($(`<div class="attnbar" id="ch-low"><b>!</b> Мало доноров:
    ${esc(мало.text)}. ${whyTipHtml('Что делать?', lowSupplyTip(мало.text,
      ATTN.supply_min_days))}</div>`));
  app.append(channelTopLine(d));

  // Две вкладки: «Ролики» — то, чем занимаются каждый день, «Настройки» — то, что
  // трогают раз в месяц. Ролики первыми: канал открывают, чтобы посмотреть выпуски,
  // а не расписание.
  const tab = (location.hash.split('/')[3] || 'roliki');
  const tabs = $(`<div class="subtabs">
    <a href="#/channel/${encodeURIComponent(id)}/roliki"
       class="${tab === 'roliki' ? 'on' : ''}">Ролики</a>
    <a href="#/channel/${encodeURIComponent(id)}/statistika"
       class="${tab === 'statistika' ? 'on' : ''}">Статистика</a>
    <a href="#/channel/${encodeURIComponent(id)}/nastroyki"
       class="${tab === 'nastroyki' ? 'on' : ''}">Настройки</a></div>`);
  app.append(tabs);

  if (tab === 'roliki'){ await channelReleases(id, d); return; }
  if (tab === 'statistika'){ channelStatsTab(id, d); return; }

  // Сводка убрана (доработка §5, Дополнение 16.09): расписание, часовой пояс,
  // горизонт, «заранее», машина и профиль — те же поля, что и в форме ниже, а
  // машина с профилем в форме редактируемые, а не для чтения, так что дублировать
  // их отдельной плашкой незачем. Форма видна сразу, без кнопки «Настроить».
  const head = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec"><span id="statusbtns"></span></div>
    <div id="editbox" class="secbody"></div></div>`);
  app.append(head);
  wireChannelEdit(head, c, d.channel_preset || {});
}


/* ────────── канал в цифрах: подписчики, просмотры, ролики (25.09.2026) ──────────

   YouTube отдаёт только «сколько сейчас» — прироста в его ответе нет вовсе. Всё, что
   здесь написано словами «за 7 дней», взято из наших собственных ежедневных снимков,
   и поэтому у молодого канала прирост честно неизвестен, а не равен нулю: ноль значил
   бы «не изменилось», а это разные вещи.

   Чего тут нет и не будет: времени просмотра, CTR обложки, удержания, дохода. Они не
   публичны, их отдаёт только Analytics API по согласию владельца канала. Показать
   вместо них просмотры и назвать это аналитикой — врать экраном.                     */

function bigNum(v){
  if (v === null || v === undefined) return '—';
  return Number(v).toLocaleString('ru-RU');
}

function deltaText(v, span){
  // «Не знаем» и «не изменилось» выглядят по-разному. Первое — короткий ряд наблюдений,
  // и об этом надо сказать, а не нарисовать ноль.
  if (v === null || v === undefined)
    return `<span class="muted">за ${span} дн — ещё наблюдаем</span>`;
  if (!v) return `<span class="muted">без изменений за ${span} дн</span>`;
  const cls = v > 0 ? 'up' : 'down';
  return `<span class="delta ${cls}">${v > 0 ? '+' : '−'}${bigNum(Math.abs(v))}</span>
    <span class="muted">за ${span} дн</span>`;
}

function sparkline(series, field){
  const pts = series.filter(r => r[field] !== null && r[field] !== undefined);
  if (pts.length < 3) return '';        // две точки — не линия, а обещание линии
  const vals = pts.map(r => Number(r[field]));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const w = 96, h = 26, pad = 2;
  const x = i => pad + i * (w - 2 * pad) / (vals.length - 1);
  // Плоский ряд (всё выросло на ноль) делит на ноль — держим линию посередине.
  const y = v => hi === lo ? h / 2
    : h - pad - (v - lo) * (h - 2 * pad) / (hi - lo);
  const dpath = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"
    style="vertical-align:middle;margin-left:6px"><path d="${dpath}" fill="none"
    stroke="var(--run)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function channelStatsCard(id, st){
  const has = !!st.day;
  const rows = has ? `
    <div class="statgrid">
      <div><div class="statnum">${st.hidden ? '<span class="muted">скрыты</span>'
        : bigNum(st.subs)}</div>
        <div class="meta">подписчиков ${st.hidden ? '' : sparkline(st.series || [], 'subs')}</div>
        <div class="meta">${deltaText(st.hidden ? null : (st.delta['7'] || {}).subs, 7)}</div></div>
      <div><div class="statnum">${bigNum(st.views)}</div>
        <div class="meta">просмотров ${sparkline(st.series || [], 'views')}</div>
        <div class="meta">${deltaText((st.delta['7'] || {}).views, 7)}</div></div>
      <div><div class="statnum">${bigNum(st.videos)}</div>
        <div class="meta">роликов на канале</div>
        <div class="meta">${deltaText((st.delta['28'] || {}).videos, 28)}</div></div>
    </div>
    <div class="note muted" style="margin-top:10px">Снимок ${esc(st.day)}. Это публичные
      числа YouTube: время просмотра, CTR и удержание публичными не бывают.</div>`
    : `<div class="empty">${st.key
        ? 'Снимков ещё нет — первый появится ближайшей ночью либо по кнопке справа.'
        : 'Нет ключа YouTube Data API — спрашивать числа нечем. Ключ бесплатный, ' +
          'заводится в Google Cloud; класть в настройки студии.'}</div>`;
  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Канал в цифрах ${hintDot(
      'Подписчики, просмотры и число роликов — публичные счётчики YouTube. ' +
      'Прирост считается по нашим ежедневным снимкам, поэтому у нового канала ' +
      'он появляется не сразу.')}
      <button class="ghost small" id="refresh" style="float:right;margin-top:-4px"
        ${st.key ? '' : 'disabled'}>Обновить</button></div>
    <div class="secbody" id="body">${rows}</div></div>`);
  card.querySelector('#refresh').onclick = async () => {
    const b = card.querySelector('#refresh');
    b.disabled = true;
    try{
      const out = await post('/ui/channels/stats/refresh', {});
      const run = out.run || {};
      toast(run.why || `Обновлено каналов: ${run.saved}`, run.why ? '' : 'ok');
      if (!run.why) await render();
    }catch(e){ toast(e.message); }
    finally{ b.disabled = false; }
  };
  return card;
}


/* ────────── вкладка «Статистика»: публичные числа и подробные ──────────

   Владелец 28.09.2026: «в канале сделать вкладку стату, по дефолту отображать то, что
   без ключа, а если ключ есть — показывать подробную».

   Сверху всегда публичное: подписчики, просмотры, ролики. Ниже — либо подробное (время
   просмотра, досмотренность, подписчики), либо объяснение, как его включить. Пустой
   таблицы «пока нет данных» тут нет ни в одном состоянии: человеку либо показывают
   числа, либо говорят, чего именно не хватает и что с этим сделать.                 */

function hours(minutes){
  if (minutes === null || minutes === undefined) return '—';
  const h = Number(minutes) / 60;
  return h >= 100 ? bigNum(Math.round(h)) : h.toFixed(1).replace('.', ',');
}

function mmss(sec){
  if (sec === null || sec === undefined) return '—';
  const s = Math.round(Number(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function since(now_, was_, fmt){
  /* Число рядом с тем же числом за прошлый такой же отрезок. Без сравнения «за 28 дней
     столько-то» не отвечает на единственный вопрос, который задают: лучше или хуже. */
  if (now_ === null || now_ === undefined) return '<span class="muted">—</span>';
  if (was_ === null || was_ === undefined || !was_)
    return `<span class="muted">не с чем сравнить</span>`;
  const diff = Number(now_) - Number(was_);
  if (!diff) return '<span class="muted">как в прошлый раз</span>';
  const pct = Math.round(diff / Math.abs(Number(was_)) * 100);
  return `<span class="delta ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : '−'}${
    fmt(Math.abs(diff))}</span> <span class="muted">(${diff > 0 ? '+' : '−'}${
    Math.abs(pct)}% к прошлым 28 дн)</span>`;
}

/* Инструкция оператору. Каждая строка здесь стоит денег и времени: ошибка в ней
   повторяется столько раз, сколько каналов (сверено по документации Google 01.10.2026).

   Про ДВА права. Пара `yt-analytics.readonly` + `youtube.readonly` — это МИНИМАЛЬНЫЙ
   по привилегиям набор, удовлетворяющий требованию `reports.query`. Складывается он из
   двух мест документации, и одной фразой нигде не записан:

     · врезка на странице метода и запись журнала изменений от 18.06.2018 требуют
       `youtube.readonly` прямым текстом («must have access to»);
     · таблица «Authorization» НИЖЕ на той же странице требует «at least one of»
       аналитических прав, и `youtube.readonly` в ней не упомянут вовсе.

   Google на этой странице противоречит сам себе: оба примера кода там просят ОДИН
   `yt-analytics.readonly`, а машинный discovery-документ печатает всем восьми методам
   один и тот же API-уровневый набор из пяти прав, не говоря, сколько из них нужно.
   Поэтому ни одна клиентская библиотека не предупредит: токен выдастся, а отчёт может
   не прийти. Пара — это ставка, которая верна при любом чтении.

   Другие удовлетворяющие наборы есть (одного широкого `youtube` формально хватает), но
   все они дают право ЗАПИСИ в канал. На сотне чужих каналов это хуже, поэтому берём
   пару только для чтения.

   Список прав надо зафиксировать ДО сбора согласий: расширить уже выданное согласие
   нельзя, только собрать заново по каждому каналу. Денежные метрики сюда не
   добавляем — это не только новое согласие, но и 403 на каналах вне YPP.

   Про ВЫБОР КАНАЛА. Токен действует за один канал — тот, что выбран при входе. Если у
   гугл-аккаунта несколько каналов, Google показывает попап выбора; при включённом
   «Больше не спрашивать» попап не придёт, и токен уедет на канал по умолчанию — то
   есть в карточку встанет чужая статистика. Проверка принадлежности у нас живым
   запросом (`pub_analytics.verify`), так что чужой токен получит отказ сразу, а не
   месяцем позже, — но лучше выбрать правильно с первого раза.

   Про ОДНО СОГЛАСИЕ НА КАНАЛ. Сократить это нельзя: роли в YouTube Studio («Права
   доступа к каналу») для API не работают вовсе, а Brand Account держит максимум один
   канал. «Авторизоваться один раз на всю сеть» умеет только партнёрский Content
   Owner/CMS, и в наш расклад он не помещается.                                       */
function analyticsHowTo(id){
  return `<div class="note muted" style="margin-top:12px;line-height:1.7">
    Токен берётся <b>внутри того профиля AdsPower, где залогинен этот канал</b> — из
    обычного браузера гугл-аккаунт канала входить не должен.
    <br>1. Открыть в профиле служебную страницу Google OAuth Playground.
    <br>2. В настройках (шестерёнка) включить «Use your own OAuth credentials» и вписать
    наши Client ID и Client secret приложения — те, что заданы на странице «Ключи».
    <br>3. Запросить <b>оба</b> доступа: <code>yt-analytics.readonly</code>
    <b>и</b> <code>youtube.readonly</code>. Без второго отчёт не придёт, хотя токен
    выдастся. Галочки на экране согласия <b>не снимать</b> — согласие дробное, и снятая
    галочка даёт рабочий с виду токен, который не отвечает.
    <br>4. Если Google спросит, <b>какой канал</b> — выбрать именно этот. Токен работает
    за один канал, и выбранный по ошибке даст статистику другого.
    <br>5. На экране «приложение не проверено» развернуть «Дополнительно» и продолжить.
    <br>6. Обменять код и скопировать <b>refresh token</b> — это и есть строка ниже.
    <br>Токен хранится закрыто и наружу не показывается: видно только последние четыре
    знака. Принадлежность каналу проверяется сразу живым запросом — если токен не от
    этого канала, он не сохранится.</div>`;
}

function analyticsNumbers(a){
  const now_ = (a.totals || {}).now || {}, was = (a.totals || {}).was || {};
  const ctrKnown = now_.impressions !== null && now_.impressions !== undefined;
  return `
    <div class="statgrid">
      <div><div class="statnum">${bigNum(now_.views)}</div>
        <div class="meta">просмотров за 28 дн</div>
        <div class="meta">${since(now_.views, was.views, bigNum)}</div></div>
      <div><div class="statnum">${hours(now_.minutes)}</div>
        <div class="meta">часов просмотра</div>
        <div class="meta">${since(now_.minutes, was.minutes, v => hours(v))}</div></div>
      <div><div class="statnum">${now_.avg_pct === null || now_.avg_pct === undefined
          ? '—' : Math.round(now_.avg_pct) + '%'}</div>
        <div class="meta">досмотрено, средняя ${mmss(now_.avg_sec)}</div>
        <div class="meta">${since(now_.avg_pct, was.avg_pct, v => Math.round(v) + '%')}</div></div>
      <div><div class="statnum">${now_.subs_net > 0 ? '+' : ''}${bigNum(now_.subs_net)}</div>
        <div class="meta">подписчиков за 28 дн</div>
        <div class="meta">${bigNum(now_.subs_gained)} пришло, ${
          bigNum(now_.subs_lost)} ушло</div></div>
    </div>
    <div class="note muted" style="margin-top:12px">
      ${ctrKnown
        ? `Показов превью: <b>${bigNum(now_.impressions)}</b>`
        : `Показы превью и CTR обложки этим путём не приходят — их отдаёт другой сервис
           Google, суточными выгрузками. Пока не подключено.`}
      · отрезок ${esc(now_.from || '')} — ${esc(now_.to || '')}
    </div>`;
}

/* ────────── ключ канала: поле, кнопка и гайд рядом, в любом состоянии ──────────

   Владелец 01.10.2026: «нужно в каждом канале на уровне ключа выводить гайд, как
   сделать этот ключ».

   Раньше гайд показывался ТОЛЬКО у неподключённого канала. Хуже всего это выходило в
   единственном месте, где он по-настоящему нужен: когда согласие умерло. Карточка
   говорила «доступ перестал работать — нужен новый токен», и на этом всё: ни поля,
   чтобы вписать новый, ни инструкции, где его взять. Человек оставался с диагнозом и
   без инструмента.

   Поэтому блок один и тот же на все три состояния, и он всегда на месте:
     · не подключён — поле и гайд раскрыты;
     · согласие умерло — то же, и красной строкой сказано, почему;
     · работает — поле и гайд свёрнуты, чтобы не мешали, но доступны одним щелчком
       (ключ меняют не только когда он умер: канал мог переехать на другой аккаунт).  */
function analyticsKeyBlock(id, acc){
  const connected = !!acc.connected;
  const dead = acc.state === 'dead';
  // Раскрыт тогда, когда ключ нужен прямо сейчас. У работающего канала — свёрнут.
  const open = (!connected || dead) ? ' open' : '';
  // 09.10.2026: основной путь — кнопка, окно согласия Google и возврат к нам. Вставка
  // токена из OAuth Playground осталась запасной, свёрнутой ниже.
  return `<details class="keyblock" style="margin-top:12px"${open}>
    <summary style="cursor:pointer;font-weight:600;font-size:13px">${
      connected ? (dead ? 'Подключить канал заново' : 'Переподключить канал')
                : 'Подключить канал'}</summary>
    ${acc.client === false ? `<div class="note bad" style="margin-top:10px">
      Сначала впишите Client ID и Client secret приложения Google на странице
      «Ключи» (в начале списка общих ключей) — без них подключать нечем.</div>` : ''}
    <div style="margin-top:10px"><button id="google">${
      connected ? 'Переподключить через Google' : 'Подключить через Google'}</button></div>
    <div class="note muted" style="margin-top:10px;line-height:1.7">
      Нажимать <b>внутри профиля AdsPower, где залогинен этот канал</b>. Google спросит
      аккаунт — выбрать владельца канала; если спросит канал — именно этот. На экране
      согласия <b>оставить обе галочки</b>. Экран «приложение не проверено» —
      «Дополнительно» → продолжить. После «Разрешить» студия сама проверит, что доступ
      выдан этим каналом, и заберёт статистику.</div>
    <details style="margin-top:12px">
      <summary style="cursor:pointer;font-size:12px" class="muted">Вставить токен вручную
        (OAuth Playground)</summary>
      <div style="margin-top:10px">
        <input id="tok" style="width:100%;font-family:var(--mono);font-size:12px"
          placeholder="refresh token из OAuth Playground" autocomplete="off"></div>
      <div style="margin-top:10px"><button id="on" class="small ghost">${
        connected ? 'Заменить' : 'Подключить'}</button></div>
      ${analyticsHowTo(id)}
    </details>
  </details>`;
}

/* Итог подключения кнопкой: Google вернул человека на /oauth/callback, тот — сюда, с
   итогом в адресе (`?oauth=ok|err&msg=…`). Показать и убрать из адреса, чтобы
   обновление страницы не повторяло сообщение. */
function oauthReturnNotice(){
  let q;
  try { q = new URLSearchParams(location.search); } catch(e) { return; }
  const st = q.get('oauth');
  if (!st) return;
  toast(q.get('msg') || (st === 'ok' ? 'Канал подключён' : 'Подключить не вышло'),
        st === 'ok' ? 'ok' : undefined);
  try { history.replaceState(null, '', location.pathname + location.hash); } catch(e) {}
}

function channelStatsTab(id, d){
  app.append(channelStatsCard(id, d.stats || {}));
  const a = d.analytics || {};
  const acc = a.access || {};
  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Подробная статистика ${hintDot(
      'Время просмотра, досмотренность и подписчики. Эти числа YouTube отдаёт только ' +
      'владельцу канала, поэтому канал подключается отдельно — своим токеном.')}
      ${acc.connected ? `<button class="ghost small" id="off"
        style="float:right;margin-top:-4px">Отключить</button>
        <button class="ghost small" id="upd"
        style="float:right;margin-top:-4px;margin-right:8px">Обновить</button>` : ''}</div>
    <div class="secbody" id="body"></div></div>`);
  const body = card.querySelector('#body');

  if (acc.connected && a.days){
    body.innerHTML = analyticsNumbers(a) +
      `<div class="note muted" style="margin-top:8px">История с ${esc(a.first)} —
       ${a.days} ${plural(a.days, 'день', 'дня', 'дней')} наблюдений.
       ${acc.state === 'dead' ? '<b style="color:var(--bad)">Доступ перестал работать: ' +
         esc(acc.error || '') + ' — нужен новый ключ, поле ниже.</b>' : ''}</div>`
      + analyticsKeyBlock(id, acc);
  } else if (acc.connected){
    body.innerHTML = `<div class="empty">Канал подключён, но чисел ещё нет.
      ${acc.error ? esc(acc.error) : 'Нажмите «Обновить» — первая выгрузка забирает год.'}</div>`
      + analyticsKeyBlock(id, acc);
  } else {
    body.innerHTML = `
      <div class="note muted">Без подключения видно только то, что выше: это публичные
        счётчики YouTube. Время просмотра, досмотренность и приход подписчиков публичными
        не бывают — их отдаёт лишь владелец канала, своим согласием.</div>`
      + analyticsKeyBlock(id, acc);
  }
  app.append(card);

  const on = card.querySelector('#on');
  if (on) on.onclick = async () => {
    on.disabled = true;
    try{
      const out = await post(`/ui/channels/${encodeURIComponent(id)}/analytics`,
                             {token: card.querySelector('#tok').value});
      toast(acc.connected
        ? `Ключ заменён, забрано дней: ${out.loaded_days}`
        : `Подключено, забрано дней: ${out.loaded_days}`, 'ok');
      await render();
    }catch(e){ toast(e.message); on.disabled = false; }
  };
  const g = card.querySelector('#google');
  if (g) g.onclick = async () => {
    g.disabled = true;
    try{
      const out = await post(`/ui/channels/${encodeURIComponent(id)}/analytics/google`, {});
      location.href = out.url;
    }catch(e){ toast(e.message); g.disabled = false; }
  };
  const off = card.querySelector('#off');
  if (off) off.onclick = () => confirmModal('Отключить подробную статистику?',
    'Доступ будет отозван и у Google. Уже собранные числа останутся — их не теряем.',
    async () => {
      try{
        await api(`/ui/channels/${encodeURIComponent(id)}/analytics`, {method: 'DELETE'});
        toast('Отключено', 'ok');
        await render();
      }catch(e){ toast(e.message); }
    });
  const upd = card.querySelector('#upd');
  if (upd) upd.onclick = async () => {
    upd.disabled = true;
    try{
      const out = await post(`/ui/channels/${encodeURIComponent(id)}/analytics/refresh`, {});
      toast(`Обновлено суток: ${out.days}`, 'ok');
      await render();
    }catch(e){ toast(e.message); upd.disabled = false; }
  };
}


/* ────────── строка сверху: подписчики, просмотры, часы просмотра ──────────

   Владелец 28.09.2026: «надо чтобы на страницу канала сверху выводились просмотры,
   подписчики и часы просмотра».

   Три числа приходят из РАЗНЫХ мест, и это видно в поведении строки. Подписчики и
   просмотры — публичные, их даёт ключ студии. Часы просмотра публичными не бывают
   вовсе: их отдаёт только владелец канала своим согласием, поэтому у неподключённого
   канала на этом месте не ноль и не прочерк, а приглашение подключить.

   Нет ни одного числа — строки нет совсем: пустая полоса из трёх прочерков занимает
   место и не отвечает ни на один вопрос.                                            */

function channelTopLine(d){
  const st = d.stats || {}, an = d.analytics || {};
  const deep = (an.totals || {}).now || {};
  const parts = [];
  if (st.day && !st.hidden && st.subs !== null && st.subs !== undefined)
    parts.push(`<b>${bigNum(st.subs)}</b> ${plural(st.subs, 'подписчик', 'подписчика',
      'подписчиков')}`);
  else if (st.day && st.hidden)
    parts.push(`<span class="muted">подписчики скрыты владельцем канала</span>`);
  if (st.day && st.views !== null && st.views !== undefined)
    parts.push(`<b>${bigNum(st.views)}</b> ${plural(st.views, 'просмотр', 'просмотра',
      'просмотров')}`);
  const haveHours = deep.minutes !== null && deep.minutes !== undefined;
  if (haveHours)
    parts.push(`<b>${hours(deep.minutes)}</b> ч просмотра
      <span class="muted">за 28 дн</span>`);
  else
    parts.push(`<a href="#/channel/${encodeURIComponent(d.channel.id)}/statistika"
      class="muted">часы просмотра — подключить →</a>`);
  // Прячем строку, только если показывать НЕЧЕГО: ни публичного снимка, ни часов.
  // Раньше здесь пряталось и то, что есть: у канала без ключа студии, но с подключённой
  // подробной статистикой, часы просмотра пропадали вместе со строкой.
  if (!st.day && !haveHours) return $('<div></div>');
  return $(`<div class="topline">${parts.join('<span class="sep">·</span>')}</div>`);
}


/* ────────── длинные списки ищутся, а не листаются (владелец 30.09.2026) ──────────

   «Пробегись по дропдаунам и, если там больше 5 айтемов, сделай ещё быстрый поиск».

   Устройство выбрано так, чтобы НИЧЕГО не переписывать в сорока трёх местах, где эти
   списки заводятся и читаются. Родной <select> остаётся в странице и остаётся
   источником правды: он просто становится невидимым, а поверх него рисуется кнопка со
   списком и полем поиска. Любой существующий код, который делает `.value`, ставит
   `.value` или слушает `change`, продолжает работать слово в слово.

   Почему не «заменить select на свой компонент»: пятьдесят два профиля AdsPower, пресеты,
   голоса и модели живут в разных экранах, и каждая замена — это шанс потерять обработчик.
   Обёртка ничего не отнимает.

   Что сознательно НЕ трогаем:
     • списки с множественным выбором — они рисуются столбиком, там и так всё видно;
     • списки короче порога — поиск по трём строкам мешает, а не помогает;
     • выключенные списки — искать в том, чего нельзя выбрать, незачем.                */

const SFIND_FROM = 6;          // «больше пяти» — то есть с шестого пункта

function sfindLabel(sel){
  const one = sel.selectedOptions && sel.selectedOptions[0];
  return one ? one.textContent.trim() : '';
}

function sfindClose(){
  const pop = document.getElementById('sfind-pop');
  if (!pop) return;
  const owner = pop._owner;
  pop.remove();
  if (owner){
    owner.setAttribute('aria-expanded', 'false');
    owner.focus();
  }
}

function sfindOpen(box){
  sfindClose();
  const sel = box.querySelector('select');
  const btn = box.querySelector('button');
  // Подпись освежаем ПЕРЕД показом списка: значение могли поставить программно, а такая
  // запись события `change` не шлёт, и кнопка осталась бы с прежним именем. Человек
  // открыл бы список и увидел выбранным одно, а на кнопке — другое.
  btn.textContent = sfindLabel(sel) || '— не выбрано —';
  const opts = [...sel.options];
  const pop = document.createElement('div');
  pop.className = 'sfind-pop';
  pop.id = 'sfind-pop';
  pop._owner = btn;
  pop.innerHTML = `<input type="search" autocomplete="off" spellcheck="false"
      placeholder="поиск — начните печатать" aria-label="Поиск по списку">
    <ul class="sfind-list" role="listbox"></ul>`;
  const find = pop.querySelector('input');
  const list = pop.querySelector('ul');

  let shown = [];
  const draw = () => {
    const q = find.value.trim().toLowerCase();
    shown = opts.filter(o => !q || o.textContent.toLowerCase().includes(q));
    if (!shown.length){
      list.innerHTML = `<li class="sfind-none" role="presentation">ничего не нашлось</li>`;
      return;
    }
    list.innerHTML = shown.map((o, i) => `<li role="option" data-i="${i}"
      aria-selected="${o.selected ? 'true' : 'false'}"
      ${o.disabled ? 'aria-disabled="true"' : ''}
      class="${o.selected ? 'cur' : ''}">${esc(o.textContent)}</li>`).join('');
    // Подсвечен либо выбранный, либо первый подходящий: стрелка вниз должна вести
    // откуда-то, а не из пустоты.
    const at = Math.max(0, shown.findIndex(o => o.selected));
    mark(q ? 0 : at);
  };
  const mark = i => {
    [...list.children].forEach((li, n) => li.classList.toggle('on', n === i));
    const on = list.children[i];
    if (on && on.scrollIntoView) on.scrollIntoView({block: 'nearest'});
  };
  const active = () => [...list.children].findIndex(li => li.classList.contains('on'));
  const take = i => {
    const opt = shown[i];
    if (!opt || opt.disabled) return;
    if (sel.value !== opt.value){
      sel.value = opt.value;
      // Ровно то событие, которого ждут уже написанные обработчики. Без него выбор
      //бы  менялся на экране и никуда не доходил.
      sel.dispatchEvent(new Event('change', {bubbles: true}));
    }
    btn.textContent = sfindLabel(sel) || '— не выбрано —';
    sfindClose();
  };

  find.addEventListener('input', draw);
  find.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      ev.preventDefault();
      const n = list.children.length;
      if (!n) return;
      const step = ev.key === 'ArrowDown' ? 1 : -1;
      mark((active() + step + n) % n);
    } else if (ev.key === 'Enter'){
      ev.preventDefault();
      take(active());
    } else if (ev.key === 'Escape'){
      ev.preventDefault();
      sfindClose();
    }
  });
  list.addEventListener('click', ev => {
    const li = ev.target.closest('li[data-i]');
    if (li) take(Number(li.dataset.i));
  });

  document.body.append(pop);
  const r = btn.getBoundingClientRect();
  pop.style.width = Math.max(r.width, 240) + 'px';
  pop.style.left = Math.min(r.left, innerWidth - pop.offsetWidth - 8) + 'px';
  // Не помещается снизу — открываем вверх: список из полусотни строк иначе уезжает за
  // нижний край, и человек ищет его прокруткой всей страницы.
  const below = innerHeight - r.bottom;
  pop.style.top = (below > 300 || below > r.top ? r.bottom + 4
                   : Math.max(8, r.top - pop.offsetHeight - 4)) + 'px';
  draw();
  find.focus();
  btn.setAttribute('aria-expanded', 'true');
}

function wireSearchableSelects(root){
  const where = root && root.querySelectorAll ? root : document;
  for (const sel of where.querySelectorAll('select:not([data-sfind])')){
    if (sel.multiple || sel.options.length < SFIND_FROM){ continue; }
    sel.setAttribute('data-sfind', '1');
    const box = document.createElement('div');
    box.className = 'sfind';
    // Ширину задаёт сам список: у большинства она проставлена стилем на месте объявления
    // («width:230px», «min-width:280px»), и обёртка обязана её унаследовать, иначе
    // аккуратно расставленные поля разъедутся.
    // Ширину меряем, а не угадываем по строке стиля: у половины списков она задана
    // классом (`.fld select{width:100%}`), инлайна там нет вовсе, и обёртка сжалась бы
    // по содержимому — поля в карточках разъехались бы. Меряем ДО того, как спрячем
    // список: спрятанный уже ничего не покажет.
    const wide = sel.parentNode.clientWidth
                 && sel.offsetWidth >= sel.parentNode.clientWidth - 2;
    box.style.display = wide ? 'block' : 'inline-block';
    box.style.width = wide ? '100%' : (sel.style.width || '');
    box.style.minWidth = sel.style.minWidth || '';
    box.style.marginTop = sel.style.marginTop || '';
    box.style.marginBottom = sel.style.marginBottom || '';
    sel.parentNode.insertBefore(box, sel);
    box.append(sel);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    btn.textContent = sfindLabel(sel) || '— не выбрано —';
    btn.disabled = sel.disabled;
    btn.onclick = () => { btn.disabled ? null : sfindOpen(box); };
    box.append(btn);
    // Значение меняют и снаружи — формой, сбросом, соседним полем. `change` при этом
    // приходит не всегда (программная запись .value его не шлёт), поэтому подпись
    // освежаем и по событию, и при каждом открытии списка.
    sel.addEventListener('change', () => {
      btn.textContent = sfindLabel(sel) || '— не выбрано —';
      btn.disabled = sel.disabled;
    });
    // А вот ЗАПЕРЕТЬ список снаружи можно только присвоением `disabled`, и события оно
    // не шлёт вовсе. Без этого наблюдателя кнопка оставалась живой над запертым списком:
    // человек видел единственный работающий орган управления, менял им выбор — и экран
    // показывал одно, а на сервер уже ушло другое. Нашлось на раскладке ссылок
    // (30.09.2026): карточка после постановки показывала не тот канал, на который
    // ссылка встала, а ошибка канала в этой системе необратима.
    new MutationObserver(() => {
      btn.disabled = sel.disabled;
      if (sel.disabled) sfindClose();     // запертый список не должен остаться открытым
    }).observe(sel, {attributes: true, attributeFilter: ['disabled']});
  }
}

// Экраны дорисовываются частями и после ответов сервера, поэтому одного вызова после
// render() не хватит: наблюдатель ловит и то, что появилось позже.
const SFIND_WATCH = new MutationObserver(list => {
  for (const m of list){
    for (const node of m.addedNodes){
      if (node.nodeType === 1) wireSearchableSelects(node);
    }
  }
});

function sfindWatch(){
  const app = document.getElementById('app');
  if (app) SFIND_WATCH.observe(app, {childList: true, subtree: true});
  addEventListener('click', ev => {
    const pop = document.getElementById('sfind-pop');
    if (pop && !pop.contains(ev.target) && !ev.target.closest('.sfind')) sfindClose();
  }, true);
  addEventListener('keydown', ev => { if (ev.key === 'Escape') sfindClose(); });
}


/* ────────── поиск и разбор списка каналов (владелец 30.09.2026) ──────────

   «Двадцать каналов нормально, а когда будет 150, будет тяжело». Поэтому здесь поиск
   по названию, отборы по нише, языку, состоянию и тегу, и порядок — в том числе по
   запасу, потому что на сотне каналов первый вопрос не «какие есть», а «кому нечего
   выпускать завтра».

   Всё считается в браузере, на уже полученном списке: сто каналов — это десятки
   килобайт, и второй поход на сервер за каждой буквой поиска сделал бы экран медленнее,
   а не быстрее.

   Выбор запоминается. Оператор возвращается на этот экран десятки раз за смену, и
   каждый раз заново отмечать «только польские, только проблемные» — это и есть та
   работа руками, ради устранения которой всё затевалось.                             */

const SIEVE_KEY = 'vs.channels.sieve';

function supplyPill(sup){
  // «Не знаем» и «нечего выпускать» — разные вещи. Первое значит «нет расписания, судить
  // не по чему», и красным его красить нельзя: канал не сломан, он просто не настроен.
  if (!sup) return '';
  if (!sup.known) return '<span class="pill s-idle">запас неизвестен</span>';
  // Меньше порога тревоги — «!» и подсказка, что делать (владелец 09.10.2026).
  // «!» стоит в углу карточки (supplyCorner, 11.10.2026), в плашке остаются слова.
  if (sup.low) return `<span class="pill s-error whytip" tabindex="0" data-hint="${esc(
    lowSupplyTip(sup.text, sup.min_days))}">мало доноров${sup.items
      ? ` · ${Math.floor(sup.days || 0)} дн` : ''}</span>`;
  if (!sup.items) return '<span class="pill s-error">запаса нет</span>';
  const d = Math.floor(sup.days || 0);
  if (d < 3) return `<span class="pill s-queued">запас ${d} дн</span>`;
  return `<span class="pill s-idle">запас ${d} дн</span>`;
}

function supplyCorner(sup){
  if (!sup || !sup.known || !sup.low) return '';
  return `<span class="attn corner whytip" tabindex="0" data-hint="${esc(
    lowSupplyTip(sup.text, sup.min_days))}">!</span>`;
}

function lowSupplyTip(text, min){
  return `Донорских ссылок не хватает: ${text || 'ближайший выход пустой'}. `
    + `Порог — ${min} дн (тот же, что у тревоги; правится в «Админ»).\n\n`
    + 'Кто чинит: оператор канала.\n\nЧто делать: вставить ссылки на доноров на '
    + 'экране канала — они сами разложатся по свободным выходам.';
}

function sieveSaved(){
  try { return JSON.parse(localStorage.getItem(SIEVE_KEY) || '{}') || {}; }
  catch (e){ return {}; }
}

function sieveSave(v){
  try { localStorage.setItem(SIEVE_KEY, JSON.stringify(v)); } catch (e){ /* приват */ }
}

const CH_SORTS = [
  ['name',   'по названию'],
  ['supply', 'сначала без запаса'],
  ['lang',   'по языку'],
  ['niche',  'по нише'],
  ['status', 'по состоянию'],
  ['per_day', 'по числу выходов'],
];

function channelSieve(all, stats, onChange){
  const было = sieveSaved();
  const st = {q: было.q || '', lang: было.lang || '', niche: было.niche || '',
              status: было.status || '', tag: было.tag || '', sort: было.sort || 'name'};
  const uniq = (key) => [...new Set(all.map(c => c[key]).filter(Boolean))].sort(
    (a, b) => String(a).localeCompare(String(b), 'ru'));
  // Функцией, а не разовым списком: массовая простановка тега (кнопка «Выбрать» на этом
  // же экране) заводит теги на ходу, и отбор обязан их увидеть, не дожидаясь
  // перезагрузки страницы.
  const tags = () => [...new Set(all.flatMap(c => c.tags || []))].sort(
    (a, b) => a.localeCompare(b, 'ru'));

  const opts = (list, cur, пусто) =>
    `<option value="">${пусто}</option>` + list.map(v =>
      `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join('');

  const el = $(`<div class="card sieve" style="margin-bottom:16px"><div class="secbody">
    <div class="sieve-row">
      <input id="s-q" type="search" placeholder="поиск по названию, хэндлу или ID"
             value="${esc(st.q)}" style="flex:1 1 260px;min-width:200px">
      <select id="s-lang" style="width:150px">${opts(uniq('lang'), st.lang, 'любой язык')}</select>
      <select id="s-niche" style="width:190px">${opts(uniq('niche'), st.niche, 'любая ниша')}</select>
      <select id="s-status" style="width:170px">${
        `<option value="">любое состояние</option>` + Object.entries(CH_STATUS).map(([k, v]) =>
          `<option value="${esc(k)}"${k === st.status ? ' selected' : ''}>${esc(v)}</option>`
        ).join('')}</select>
      <select id="s-tag" style="width:160px">${opts(tags(), st.tag, 'любой тег')}</select>
      <select id="s-sort" style="width:200px">${CH_SORTS.map(([k, v]) =>
        `<option value="${k}"${k === st.sort ? ' selected' : ''}>${esc(v)}</option>`
      ).join('')}</select>
      <button id="s-off" class="ghost small">Сбросить</button>
    </div>
    <div class="note muted" id="s-count" style="margin-top:8px"></div>
  </div></div>`).firstElementChild;

  const count = el.querySelector('#s-count');

  const apply = () => {
    const q = st.q.trim().toLowerCase();
    let list = all.filter(c => {
      if (st.lang && c.lang !== st.lang) return false;
      if (st.niche && c.niche !== st.niche) return false;
      if (st.status && c.status !== st.status) return false;
      if (st.tag && !(c.tags || []).includes(st.tag)) return false;
      if (!q) return true;
      // Ищем по тому, чем канал зовут в жизни: название, хэндл и сам ID. По ID — потому
      // что в письмах и таблицах канал чаще приходит именно строкой UC….
      return [c.name, c.handle, c.uc, c.niche].filter(Boolean)
        .some(v => String(v).toLowerCase().includes(q));
    });
    const days = c => (c.supply && c.supply.known) ? (c.supply.days || 0) : Infinity;
    const by = {
      name: (a, b) => a.name.localeCompare(b.name, 'ru'),
      // Сначала те, кому нечего выпускать: это и есть работа на сегодня. Каналы без
      // расписания уезжают в конец — про них ответ «не знаем», а не «всё плохо».
      supply: (a, b) => days(a) - days(b) || a.name.localeCompare(b.name, 'ru'),
      lang: (a, b) => (a.lang || '').localeCompare(b.lang || '', 'ru')
                      || a.name.localeCompare(b.name, 'ru'),
      niche: (a, b) => (a.niche || '').localeCompare(b.niche || '', 'ru')
                       || a.name.localeCompare(b.name, 'ru'),
      status: (a, b) => (a.status || '').localeCompare(b.status || '')
                        || a.name.localeCompare(b.name, 'ru'),
      per_day: (a, b) => (b.per_day || 0) - (a.per_day || 0)
                         || a.name.localeCompare(b.name, 'ru'),
    };
    list = list.slice().sort(by[st.sort] || by.name);
    const отобрано = list.length, всего = all.length;
    count.textContent = отобрано === всего
      ? `${всего} ${plural(всего, 'канал', 'канала', 'каналов')}`
      : `${отобрано} из ${всего} — остальные скрыты отбором`;
    return list;
  };

  const touch = () => { sieveSave(st); onChange(apply()); };
  const bind = (id, key) => {
    const node = el.querySelector(id);
    if (!node) return;
    node.addEventListener(node.tagName === 'INPUT' ? 'input' : 'change', () => {
      st[key] = node.value;
      touch();
    });
  };
  bind('#s-q', 'q'); bind('#s-lang', 'lang'); bind('#s-niche', 'niche');
  bind('#s-status', 'status'); bind('#s-tag', 'tag'); bind('#s-sort', 'sort');
  el.querySelector('#s-off').onclick = () => {
    for (const k of ['q', 'lang', 'niche', 'status', 'tag']) st[k] = '';
    st.sort = 'name';
    el.querySelectorAll('input,select').forEach(n => { n.value = ''; });
    const srt = el.querySelector('#s-sort');
    if (srt) srt.value = 'name';
    touch();
  };
  // Пересобрать списки значений по текущему `all`. Нужно после массового действия: оно
  // могло завести новый тег или сменить состояние каналов, а отбор, показывающий
  // прошлый набор значений, врёт о том, что на экране есть.
  const refill = () => {
    const fill = (id, list, пусто) => {
      const node = el.querySelector(id);
      if (!node) return;
      const был = node.value;
      node.innerHTML = opts(list, был, пусто);
      // Значение могло исчезнуть вместе с последним каналом, который его носил: тогда
      // отбор снимаем, иначе сетка останется пустой без причины, названной словами.
      if (node.value !== был) st[id.slice(3)] = node.value;
    };
    fill('#s-lang', uniq('lang'), 'любой язык');
    fill('#s-niche', uniq('niche'), 'любая ниша');
    fill('#s-tag', tags(), 'любой тег');
    sieveSave(st);
  };
  return {el, apply, refill};
}

function calendarFeed(d){
  // Черта «сейчас» между прошлым и будущим: без неё пропуск и свободный слот
  // выглядят одинаково, а это разные вещи.
  //
  // Порядок (18.09.2026, жалоба владельца): сверху — ближайший будущий выход, ниже
  // черта «сейчас», под ней прошлое свежим вперёд. Сервер отдаёт ленту по возрастанию
  // (web/app.py `_calendar`) — и человек первым делом видел прошлогоднее, а не то,
  // что происходит сейчас. Сортируем в представлении: порядок сервера нужен его же
  // расчётам (счётчики, сетка по дням, «за горизонтом»).
  const future = d.calendar.filter(r => !r.past).slice().reverse();
  const past = d.calendar.filter(r => r.past).slice().reverse();
  const rows = [];
  let drawn = false;
  // «Сейчас» — своё время браузера, а не серверное `r.past`: строка календаря может
  // полежать в ответе секунды и минуты, пока человек листает экран, а честная подпись
  // «загружен»/«назначен» (пункт 1 владельца, 22.09.2026) обязана дать тот же ответ,
  // что дал бы новый запрос в ту же секунду.
  const nowSec = Date.now() / 1000;
  for (const r of [...future, ...past]){
    if (r.past && !drawn){ rows.push('<div class="today"><span>сейчас</span></div>'); drawn = true; }
    const when_ = new Date(r.at * 1000).toLocaleString('ru-RU',
      {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    // `done` ≠ «опубликовано» (CLAUDE.md, инвариант 22.09.2026 — жалоба владельца):
    // статус `pub_releases.status='done'` проверяет только расписание, а не то, что
    // ролик реально вышел на YouTube. Пока собственный слот ещё не наступил, ссылка на
    // youtu.be была бы обещанием, которое мы не проверяли, — ведём на донора и
    // подписываем честно: «загружен, выйдет …», не «вышел». Мутация-проверка: убери
    // `slotPassed` из `useYoutube` — тест с future-слотом начнёт видеть youtu.be и
    // подпись про прошедший срок раньше времени и упадёт.
    const confirmed = r.state === 'public';       // поздняя проверка увидела ролик
    const scheduled = r.state === 'done';         // только расписание, выход не проверен
    const slotPassed = r.at <= nowSec;
    const useYoutube = (confirmed || (scheduled && slotPassed)) && r.video_id;
    const link = useYoutube ? `https://youtu.be/${esc(r.video_id)}` : (r.donor_url || '');
    // Куда ведёт ссылка не всегда видно по одному названию (Issue 3 ревью 22.09.2026):
    // до слота и после него текст-ссылка выглядит одинаково, хотя ведёт в разные
    // места. `title` — всплывающая подсказка при наведении, тот же приём, что и у
    // соседних подписей строки, ничего не меняет в видимом тексте самой ссылки.
    const linkTitle = !link ? '' : (useYoutube
      ? 'Ссылка на YouTube' : 'Ссылка на донора (оригинал ролика)');
    // Название — всегда название донора; ссылка донора как подпись — только если
    // название добыть не удалось (пункт 1 владельца). Мутация-проверка: поменяй
    // местами `r.donor_title || r.donor_url` — тест на «название-ссылка» перестанет
    // отличать реальное название от голой ссылки.
    const title = r.donor_title || r.donor_url || (r.state === 'missed'
      ? 'ролика не было' : 'свободен — сюда встанет следующая ссылка');
    // Четыре разные подписи вместо прежних двух — ровно три состояния ТЗ §11 плюс
    // промежуточное «залит, но срок ещё не настал»:
    //   «файл готов, выйдет …»       — материалы готовы, ролика на YouTube ещё нет;
    //   «загружен, выйдет …»         — файл уже у YouTube, срок в будущем;
    //   «назначен на …, выход ещё не подтверждён» — срок ПРОШЁЛ, а проверки не было;
    //   «вышел публично — подтверждено» — `pub_verify` увидел ролик публичным.
    // Прежде последние две были одним словом «опубликован», и различал их календарь
    // часами: слот прошёл — значит вышло. Часы идут независимо от YouTube; так экран
    // объявлял выпущенными ролики, оставшиеся приватными.
    // `done` ≠ «опубликовано» касается и подписи БЕЗ `video_id` (Issue 2 ревью
    // 22.09.2026): расписание могло подтвердиться раньше, чем ролик вообще залит —
    // тогда до слота нет ни «вышел», ни «загружен» (заливки ещё не было).
    // Мутация-проверка: сделай `confirmed` равным `scheduled && slotPassed` — строка
    // с непроверенным выходом снова скажет «вышел публично», и тест упадёт.
    const statusText = confirmed
      ? 'вышел публично — подтверждено'
      : scheduled
        ? (slotPassed ? `назначен на ${when_}, выход ещё не подтверждён`
           : (r.video_id ? `загружен, выйдет ${when_}`
              : `файл готов, выйдет ${when_}`))
        : CAL_TITLE[r.state];
    // Клик по строке — только когда есть куда вести (пункт 1, «честно показать»):
    // `planned` без `project_id` не кликается вовсе, а не ведёт в никуда. Мутация-
    // проверка: замени условие на `!!r.release_id` — строка без проекта, но с чужим
    // release_id, снова станет ложно кликабельной.
    const clickable = !!r.project_id;
    rows.push(`<div class="cal ${r.past ? 'past' : ''} ${r.state === 'missed' ? 'miss' : ''} ${clickable ? 'clickable' : ''}"
        ${clickable ? `data-project="${esc(r.project_id)}" tabindex="0" role="link"
          aria-label="Открыть проект${r.project_name ? ' ' + esc(r.project_name) : ''}"` : ''}>
      <time>${when_}</time>
      <div class="dot ${CAL_CLS[r.state]}">${CAL_DOT[r.state]}</div>
      <div class="what">
        ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener" title="${esc(linkTitle)}"
            style="font-weight:600">${esc(title)}</a>`
               : `<span style="font-weight:${r.state === 'free' ? '400' : '600'}">${esc(title)}</span>`}
        <div class="muted" style="font-size:12.5px">
          ${esc(statusText)}${r.phase_title ? ' · ' + esc(r.phase_title) : ''}
          ${r.project_name ? ' · ' + esc(r.project_name) : ''}
          ${r.beyond_horizon ? ' · за горизонтом канала' : ''}
        </div>
        ${blockNote(r)}
      </div></div>`);
  }
  if (!drawn) rows.push('<div class="today"><span>сейчас</span></div>');
  const card = $(`<div class="card">${rows.join('')}</div>`);
  // Клик по строке ведёт в проект (замена безусловной `#/release/<id>`, пункт 1) —
