  // тем же паттерном доступности, что у `.chcard` (tabindex/role/Enter/Space,
  // :756). Клик по самой ссылке названия — своё дело ссылки, строка его не перехватывает.
  card.querySelectorAll('.cal.clickable').forEach(el => {
    const go = () => { location.hash = '#/project/' + el.dataset.project; };
    el.onclick = ev => { if (ev.target.closest('a')) return; go(); };
    // Issue 1 ревью 22.09.2026: keydown на ссылке названия всплывает до строки —
    // если не отсеять его так же, как отсеивает onclick, Enter/Space на самой
    // ссылке уводили бы в проект вместо перехода по ссылке (донор/YouTube), и с
    // клавиатуры ссылку было бы не открыть вовсе. Реагируем только на события,
    // цель которых — сама строка (единственный фокусируемый узел без вложенных
    // ссылок), а не всплывшие от `<a>` внутри неё. Мутация-проверка: замени
    // условие обратно на голое `ev.key === 'Enter' || ev.key === ' '` без
    // `ev.target === el` — тест с Enter на самой ссылке снова начнёт уводить
    // в проект вместо открытия ссылки.
    el.onkeydown = ev => {
      if (ev.target !== el) return;
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); go(); }
    };
  });
  return card;
}


/* ────────────────────── сквозная очередь трёх сервисов ────────────────────── */

/* ───────────── пауза очереди: состояние словами и сухой прогон (A5) ───────────── */

/* Владелец полтора месяца смотрел на стоящие выпуски и не мог ответить ни на один
   человеческий вопрос: что остановлено, с какого времени, кем и что это держит.
   Рубильник — одно поле в базе, а экран говорил только «ждём». Фразы сюда приходят
   готовыми из кабинета: считать их второй раз в браузере значит завести вторые
   правила, которые разойдутся с теми, по которым шедулер на самом деле отказывает.

   Кнопки «снять паузу» здесь нет намеренно. Снятие живёт в админ-панели кабинета:
   две кнопки в разных местах — это два места, откуда конвейер отпускают вслепую,
   а именно так в августе и случился залп. Пульт показывает числа. */
function schedulerCard(sch){
  // 21.09.2026: «поставил озвучку ничего не сделалось, лог пуст». Задача честно стояла
  // `queued` девять часов, и взять её было некому: стенд поднят через dev/run.sh, где
  // исполнитель выключен нарочно. Пустой лог при этом не улика поломки, а её отсутствие —
  // логу неоткуда взяться, если задача не начиналась. Экран обязан сказать это словами,
  // иначе человек чинит то, что не сломано.
  sch = sch || {};
  if (!sch.known || sch.on) return null;     // всё работает — молчим, экран про работу
  // Одной строкой заголовка, без отдельной полосы «шапки» карточки: предупреждение
  // стоит на каждом экране проекта и очереди и не должно отодвигать работу вниз.
  // Успокаивающая фраза — только если причина сама её не говорит: сервер пишет
  // «поставленное никуда не денется», и второй раз то же самое — шум.
  const calm = /не денется|не потеряется/.test(sch.why || '') ? ''
    : `<div class="note muted">Поставленное не потеряется: оно стоит в очереди и
          начнётся само, как только появится исполнитель.</div>`;
  return $(`<div class="card alert-wait" style="margin-bottom:16px">
    <div class="stage">
      <div class="dot s-queued">⏸</div>
      <div class="body">
        <div class="name">Задачи никто не выполняет</div>
        <div class="facts">${esc(sch.why)}</div>
        ${calm}
      </div>
    </div></div>`);
}

function pauseCard(p){
  p = p || {};
  if (p.read_error)
    return $(`<div class="card"><div class="sec">Пауза очереди</div>
      <div class="secbody"><div class="note bad">Состояние паузы прочитать не удалось:
        ${esc(p.read_error)}. Денег это не стоило — читается только состояние.
        Список задач ниже настоящий, но сказать, выдаются ли новые, сейчас нечем.
        Обновите страницу.</div></div></div>`);
  if (!p.paused) return null;          // пауза не стоит — молчим, экран и так про работу

  // Хвост про то, что правило пришло из прежней боевой системы, с экрана снят: откуда
  // правило взялось — история разработки, а у паузы человеку нужен только факт, что
  // чужой профиль тоже встал.
  const card = $(`<div class="card">
    <div class="sec">Выдача новых задач остановлена</div>
    <div class="stage">
      <div class="dot s-queued">⏸</div>
      <div class="body">
        ${(p.lines || []).map(l => `<div class="facts">${esc(l)}</div>`).join('')}
        ${p.blocks_my_texts ? `<div class="note">Пока на паузе хоть один канал
          промптов, новые тексты не заказываются ни в одном профиле.</div>` : ''}
      </div>
    </div>
    <div class="secbody">
      ${(p.targets || []).length ? `<div class="note muted" style="margin-bottom:10px"
          >Прежде чем снимать — посмотрите, сколько уйдёт в работу в первую же
          секунду:</div>
        <div>${p.targets.map(t => `<button class="ghost small pause-dry"
          data-target="${esc(t.key)}" style="margin:0 8px 8px 0"
          >${esc(t.title)}: что будет?</button>`).join('')}</div>` : ''}
      <div class="note muted">${esc(p.where_to_resume || '')}</div>
    </div></div>`);

  card.querySelectorAll('button.pause-dry').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{
      const dry = await api('/ui/queue-pause/dry-run?target='
                            + encodeURIComponent(b.dataset.target));
      // Окно, а не alert: текст длинный, и его читают, а не «ОК»-ают.
      modal('Сухой прогон: ' + (dry.title || ''),
            `<div class="facts" style="white-space:pre-wrap">${esc(dry.text || '')}</div>
             <div class="note muted" style="margin-top:12px">${esc(dry.note || '')}</div>`,
            {ok: 'Понятно', onOk: (body, close) => close()});
    }catch(e){
      toast('Прогон не сделан: ' + e.message
            + '. Денег это не стоило и паузу не тронуло — прогон только читает. '
            + 'Обновите страницу и попробуйте ещё раз.');
    }finally{ b.disabled = false; }
  });
  return card;
}

/* ───────────── оплачено, но не забрано (A4) ───────────── */

/* 146 выпусков стояли с оплаченным и не забранным текстом, потому что такого списка
   не существовало. Экран отвечает на один вопрос: за что деньги уже ушли. Подбор
   рядом — это НЕ заказ: он спрашивает статус уже оплаченной задачи и скачивает
   готовый файл. Кнопки «заказать заново» здесь нет и быть не должно — повтор это
   вторые деньги за тот же текст, и решает это человек, а не экран. */
const PAID_SRC = {job: 'номер из нашей строки о заказе',
                  calls: 'номер из журнала оплат — своя строка потерялась'};
let PAID_POLL = 0;

async function viewPaidTexts(){
  const d = await api('/ui/paid-texts');
  app.innerHTML = '';
  app.append($(`<a class="back" href="#/queue">← к очереди</a>
    <h1>Оплачено, но не забрано ${hintDot(
      'Выпуски, за текст которых рерайту уже заплачено, а текста у нас нет.')}</h1>`));

  const run = $(`<div class="card">
    <div class="sec">Забрать готовое ${hintDot('За одно нажатие опрашивается до '
      + d.batch + ' задач; на неотвечающей задаче ответ ждём до 30 секунд, поэтому '
      + 'проход идёт в фоне и показывает, сколько уже опрошено.')}</div>
    <div class="secbody">
      <div class="note">${esc(d.free || '')}</div>
      <div style="margin-top:12px">
        <button id="pt-go">Забрать оплаченное (денег не тратит)</button></div>
      <div id="pt-state"></div>
    </div></div>`);
  app.append(run);
  const box = run.querySelector('#pt-state');
  paintCollect(box, d.collect || {}, d.reasons || {});
  run.querySelector('#pt-go').onclick = async () => {
    const b = run.querySelector('#pt-go');
    b.disabled = true;
    try{
      const st = await post('/ui/paid-texts/collect', {limit: d.batch});
      paintCollect(box, st, d.reasons || {});
      pollCollect(box, d.reasons || {});
    }catch(e){
      b.disabled = false;
      box.innerHTML = `<div class="note bad">Подбор не запустился: ${esc(e.message)}.
        Денег это не стоило — проход ничего не заказывает. Обновите страницу
        и попробуйте ещё раз.</div>`;
    }
  };
  if ((d.collect || {}).running){
    run.querySelector('#pt-go').disabled = true;
    pollCollect(box, d.reasons || {});
  }

  if (!d.rows.length){
    app.append($(`<div class="card"><div class="empty">
      Выпусков с оплаченным и не забранным текстом нет.</div></div>`));
    return;
  }

  app.append($(`<div class="card"><table><thead><tr>
      <th>Выпуск</th><th>Канал</th><th>Задача у рерайта</th><th>Ждём</th>
    </tr></thead><tbody>${d.rows.map(r => `<tr>
      <td><div style="font-weight:600">${esc(r.donor_title || 'название неизвестно')}</div>
          <div class="muted" style="font-size:12px">
            <a href="#/release/${encodeURIComponent(r.release_id)}"
              >${esc(r.release_id)}</a></div></td>
      <td>${esc(r.ch_name || '—')}<div class="muted">${esc(r.lang || '')}</div></td>
      <td><span class="mono">${esc(String(r.job_id))}</span>
          <div class="muted" style="font-size:12px">${esc(PAID_SRC[r.src] || r.src)}</div></td>
      <td class="muted">${esc(ago(Math.round(r.waiting_sec || 0)))}</td>
    </tr>`).join('')}</tbody></table>
    <div class="secbody"><div class="note muted">${esc(d.how || '')}</div>
      <div class="note muted">Выпуск, у которого пропала задача текста, из этого
        списка уходит: забирать нечего, и повтор заказа — это вторые деньги, решает
        человек. Искать такие надо среди выпусков на фазе «заведён»:
        <a href="#/releases">все выпуски →</a></div></div>
  </div>`));
}

/* Ожидание показывается честно: сколько опрошено из скольких и кого спрашиваем прямо
   сейчас. Молчащая кнопка на проходе, который думает минуты, неотличима от зависшего
   пульта — а нажать её второй раз означает ждать вдвое дольше. */
function paintCollect(box, st, reasons){
  if (!st || (!st.running && !st.res && !st.error)){ box.innerHTML = ''; return; }
  if (st.error){
    box.innerHTML = `<div class="note bad">Проход прервался: ${esc(st.error)}.
      Деньги на этом не тратились — он только спрашивает и скачивает. Нажмите
      «Забрать оплаченное» ещё раз.</div>`;
    return;
  }
  if (st.running){
    box.innerHTML = `<div class="note">Идёт подбор: опрошено ${st.done} из ${st.total},
      забрано ${st.taken}. Ждём уже ${esc(ago(st.elapsed))}.
      ${st.current ? 'Сейчас спрашиваем: ' + esc(st.current) + '.' : ''}
      Окно можно не держать открытым — проход идёт на сервере.</div>`;
    return;
  }
  const r = st.res || {};
  const by = Object.entries(r.by_reason || {})
    .map(([k, n]) => `${esc(reasons[k] || k)}: ${n}`).join(' · ');
  box.innerHTML = `<div class="note ${r.stopped ? 'bad' : ''}">
      Проход закончен: забрано текстов ${r.taken || 0} из ${r.checked || 0} опрошенных.
      ${by ? '<br>' + by : ''}
      ${r.stopped ? `<br>Обход прекращён: ${esc(r.stopped)}. Это значит, что остальные
        НЕ опрошены, а не «всё забрано».` : ''}
      ${r.left ? `<br>Осталось ${r.left} — нажмите «Забрать оплаченное» ещё раз.` : ''}
      ${r.taken ? '<br>Список ниже показывает состояние на момент открытия экрана: '
        + 'забранные из него уходят, обновите страницу, чтобы перечитать.' : ''}
    </div>
    ${(r.items || []).length ? `<table style="margin-top:10px"><tbody>${
      r.items.map(i => `<tr><td>${esc(i.channel || '')}
        <div class="muted mono" style="font-size:11px">${esc(i.release_id)}</div></td>
        <td>${esc(reasons[i.result] || i.result)}
        ${i.chars ? `<div class="muted">${i.chars} знаков</div>` : ''}
        ${i.note ? `<div class="note muted">${esc(i.note)}</div>` : ''}</td>
      </tr>`).join('')}</tbody></table>` : ''}`;
}

// Сколько неудач опроса ПОДРЯД терпим молча. Одна — обычное мигание связи, про неё
// говорить незачем. Молчать бесконечно нельзя: опрос — единственный источник правды на
// этом экране, и «идёт подбор» без опроса это просто враньё. Четыре попытки по 2 с ≈
// восемь секунд тишины — столько переживает переключение сети, но не больше.
const PAID_POLL_TRIES = 4;

function pollCollect(box, reasons){
  const hashAtStart = location.hash;
  clearTimeout(PAID_POLL);
  let misses = 0;
  const unlock = () => {
    const b = document.getElementById('pt-go');
    if (b) b.disabled = false;
  };
  const tick = async () => {
    if (location.hash !== hashAtStart || !box.isConnected) return;
    let st;
    try{ st = await api('/ui/paid-texts/collect'); }
    catch(e){
      if (location.hash !== hashAtStart || !box.isConnected) return;
      // Сессия истекла — это не «опрос сломался», а «войдите снова»: тот же уход на
      // экран входа, что и во всём остальном пульте. Раньше 401 проглатывался молча.
      if (e instanceof NeedLogin){ ME = null; return viewLogin(''); }
      // Связь мигнула — тик надо ПЕРЕПЛАНИРОВАТЬ здесь. Раньше `catch` выходил из tick
      // до `setTimeout`, то есть одна-единственная неудача убивала цепочку навсегда:
      // экран до конца сессии показывал «Идёт подбор: опрошено 0 из 25», хотя проход
      // давно кончился, а кнопка оставалась заблокированной — включает её только
      // успешная ветка этого же тика.
      if (++misses < PAID_POLL_TRIES){ PAID_POLL = setTimeout(tick, 2000); return; }
      box.innerHTML = `<div class="note bad">Состояние подбора не читается:
        ${esc(e.message)} (неудач подряд: ${misses}). Денег это не стоило — сам проход
        идёт на сервере и этим окном не держится. Обновите страницу, чтобы перечитать
        состояние.</div>`;
      unlock();
      return;
    }
    if (location.hash !== hashAtStart || !box.isConnected) return;
    misses = 0;                    // ответ пришёл — счёт неудач начинается заново
    paintCollect(box, st, reasons);
    if (st.running) PAID_POLL = setTimeout(tick, 2000);
    else unlock();
  };
  PAID_POLL = setTimeout(tick, 2000);
}

const SVC_TITLE = {vsgen:'Видео', rewrite:'Текст', cover:'Обложки', release:'Выпуск'};

/* Чьи это задачи. Различие не косметическое: у соседей (Текст, Обложки) стадия и
   причина отказа лежат в ИХ логе, за которым пульт ходит отдельным запросом и по
   бюджету показа — там пусто значит «мы не спросили» (`reason_pending`). У задач
   кабинета и у выпусков спрашивать некого: их этап и ошибку пишет наш же воркер в нашу
   базу, и `web/app.py` (`_fill_neighbour_details` ходит только к соседям) признак
   «не дочитано» им не ставит НИКОГДА. Значит, одна и та же пустота в строке значит
   разное, и подписывать её одним словом — врать про одну из половин. */
const OWN_SERVICE = new Set(['vsgen', 'release']);

let QFILTER = {service:'', channel:'', state:'', since:''};

/* Строка очереди объясняет себя сама (20.09.2026, жалоба владельца).
   Он поставил задачу текста, увидел «просто задачу в очереди, даже без названия» и
   решил, что всё повисло. В это время задача шла четвёртую минуту, а до неё была
   упавшая — с причиной «сеть недоступна». Ни того, ни другого экран не показывал:
   в строке стоял номер, а стадия и причина лежали в колонке состояния, куда взгляд
   доходит последним. Поэтому ИМЯ, СТАДИЯ и СКОЛЬКО УЖЕ ИДЁТ стоят вместе, в одной
   клетке: именно они отличают «идёт» от «висит».
   Фразу времени (`age_text`) собирает сервер — здесь её не пересчитывают, иначе две
   формулировки одного и того же начнут расходиться. */
function taskCellHtml(r){
  const who = [r.channel && esc(r.channel), r.lang && esc(r.lang),
               r.user && esc(r.user)].filter(Boolean).join(' · ');
  // Стадия пустая по двум РАЗНЫМ причинам (см. OWN_SERVICE), и обе надо назвать
  // своими словами. «Ничего не написано» человек читает как «ничего не происходит», а
  // это неправда в обоих случаях: у соседа мы стадию не спросили, у своей задачи воркер
  // её ещё не записал. Раньше вторая половина показывала ровно пустоту — признак
  // «не дочитано» своим задачам не ставят, и подписывать их им было бы враньём.
  const stage = r.stage ? esc(r.stage)
    : (r.reason_pending ? '<span class="muted">стадия не дочитана</span>'
       : (OWN_SERVICE.has(r.service) && r.state === 'running'
          ? '<span class="muted">этап не записан</span>' : ''));
  const age = r.age_text ? `<span class="muted">${esc(r.age_text)}</span>` : '';
  // Порядок строк в клетке — это порядок вопросов человека: что за задача, что с ней
  // происходит сейчас, и только потом всё остальное. Объяснение имени длинное и на
  // экране повторяется у каждой такой задачи; стоя вторым, оно отодвигало бы стадию
  // и время на третье место — то самое, ради чего правка и делалась.
  // Почему имя не из ролика — короткой пометкой в строке «кто», а объяснение под знаком
  // вопроса. Целой фразой оно стояло в КАЖДОЙ такой строке, и в очереди из полусотни
  // задач одна и та же фраза занимала больше места, чем сами задачи (жалоба владельца
  // 21.09.2026 «перегружен»). Во всех трёх случаях сервера — ссылка донора, имя
  // проекта, номер задачи — показано не название ролика; это пометка и говорит.
  return `<div style="font-weight:600">${esc(r.title)}</div>
    ${(stage || age) ? `<div class="qnow">${stage}${
      stage && age ? '<span class="muted">·</span>' : ''}${age}</div>` : ''}
    <div class="muted" style="font-size:12px">${
      who || `<span class="mono">${esc(r.id)}</span>`}${r.title_why
      ? ` · <span class="tsrc">это не название ролика</span>${hintDot(r.title_why)}`
      : ''}</div>`;
}

/* Причина — словами и в том же месте, где состояние. Три разных ответа, которые
   нельзя путать: причина известна, предупреждение при успехе, причину НЕ ДОЧИТАЛИ.
   Последнее — не «причины нет»: сосед её отдаёт, это мы не стали спрашивать (бюджет
   показа, см. `details`). Ради этой честности вся правка и делалась. */
function whyHtml(r){
  if (r.block && r.block.kind) return `<div class="note" style="color:var(--ink)"
    ><span class="blktag ${esc(r.block.kind)}">${esc(r.block.tag)}</span> ${
    whyTipHtml(r.block.title, blockTip(r, r.error))}</div>`;
  if (r.error) return `<div class="note bad">${esc(r.error)}</div>`;
  if (r.warning) return `<div class="note warn">${esc(r.warning)}</div>`;
  if (r.reason_pending)
    return `<div class="note muted">${r.state === 'error'
      ? 'причина не дочитана' : 'подробности не дочитаны'}</div>`;
  // Своя задача, кончившаяся ошибкой без единого слова причины. Дочитывать тут нечего
  // и не у кого: текст ошибки пишет наш же воркер, и пусто значит «не записал». Это
  // третий ответ, а не четвёртый вид молчания: «не дочитали» сказать нельзя (признак
  // своим не ставят), а промолчать — значит отдать человеку пустую клетку, которую он
  // прочтёт как «причины нет».
  if (OWN_SERVICE.has(r.service) && r.state === 'error')
    return `<div class="note muted">причина не записана</div>`;
  return '';
}

async function viewQueue(){
  const q = new URLSearchParams(Object.entries(QFILTER).filter(([,v]) => v)).toString();
  // Состояние рубильника читается вместе с очередью и отдельной неудачей: «задач нет»
  // и «выдача задач остановлена» — разные ответы, и путать их нельзя.
  const [d, pause] = await Promise.all([
    api('/ui/queue' + (q ? '?' + q : '')),
    api('/ui/queue-pause').catch(e => ({read_error: e.message})),
  ]);

  app.innerHTML = '';
  app.append($(`<h1>Очередь ${hintDot('Всё, что сейчас делается, в одном списке.')}</h1>
    <p class="sub"><a href="#/paid-texts">Оплачено, но не забрано →</a></p>`));

  // Порядок намеренный: «некому брать» важнее «выдача приостановлена» — при
  // выключенном исполнителе пауза вообще ни на что не влияет.
  const sc = schedulerCard(d.scheduler);
  if (sc) app.append(sc);
  const pc = pauseCard(pause);
  if (pc) app.append(pc);

  app.append($(`<div class="toolbar">${d.services.map(s => `
    <span class="pill ${s.ok ? 's-done' : 's-error'}" title="${esc(s.error)}">
      ${esc(s.title)}: ${s.ok ? s.count : 'нет связи'}</span>`).join('')}</div>`));

  const bar = $(`<div class="toolbar">
    <select id="q-svc"><option value="">все сервисы</option>${d.services.map(s =>
      `<option value="${esc(s.key)}" ${QFILTER.service === s.key ? 'selected' : ''}
        >${esc(s.title)}</option>`).join('')}</select>
    <select id="q-ch"><option value="">все каналы</option>${d.channels.map(c =>
      `<option value="${c.id}" ${QFILTER.channel == c.id ? 'selected' : ''}
        >${esc(c.name)}</option>`).join('')}</select>
    <select id="q-st"><option value="">любое состояние</option>${d.states.map(x =>
      `<option value="${esc(x.key)}" ${QFILTER.state === x.key ? 'selected' : ''}
        >${esc(x.title)}</option>`).join('')}</select>
    <select id="q-since"><option value="">за всё время</option>${d.periods.map(x =>
      `<option value="${esc(x.key)}" ${QFILTER.since === x.key ? 'selected' : ''}
        >${esc(x.title)}</option>`).join('')}</select>
    <span style="flex:1"></span>
    <span class="muted">${d.shown === d.total ? `задач ${d.total}`
      : `показано ${d.shown} из ${d.total}`}</span>
  </div>`);
  app.append(bar);
  const bindQ = (id, key) => bar.querySelector(id).onchange = e => {
    QFILTER[key] = e.target.value; render();
  };
  bindQ('#q-svc','service'); bindQ('#q-ch','channel');
  bindQ('#q-st','state'); bindQ('#q-since','since');

  const down = d.services.filter(s => !s.ok);
  if (down.length) app.append($(`<div class="err">${down.map(s =>
    `${esc(s.title)} — ${esc(s.error)}`).join('<br>')}<br>
    <span style="opacity:.75">Это не «задач нет», а «спросить не удалось».</span></div>`));

  if (!d.rows.length){
    // Пустых мест здесь три, и различать их обязательно. Часть строк приходит от
    // хранилищ текстов и обложек: если хоть одно не ответило, мы НЕ ЗНАЕМ, есть ли за
    // ним задачи, и называть это «задач нет» — врать экраном. Второй случай — отборы:
    // задачи есть, просто не эти, и чинится это снятием отборов, а не заведением
    // работы. И только третий — настоящая пустота, у которой своё действие.
    const filtered = Object.values(QFILTER).some(Boolean);
    app.append($(`<div class="card">${
      down.length
        ? emptyUnknown('Список неполный: часть хранилищ не ответила.',
            'Сколько задач за ними — мы не знаем. Это не «задач нет».')
        : filtered
        ? emptyBox({why: 'Под выбранные отборы ни одна задача не подошла.',
            means: 'Задачи в студии есть — просто не эти.',
            href: '#/queue', id: 'q-clear', act: 'Снять отборы'})
        : emptyBox({why: 'Очередь пуста — прямо сейчас ничего не делается.',
            means: 'Так и должно быть, когда всё сделано: работа появляется, как '
                 + 'только на канал поставлены ссылки на доноров.',
            href: '#/channels', act: 'Поставить ролики на канал'})
    }</div>`));
    // Отборы живут в памяти страницы, а адрес у них один и тот же — на переход по
    // ссылке браузер события не пришлёт. Поэтому снимаем их руками.
    const clr = app.querySelector('#q-clear');
    if (clr) clr.onclick = ev => {
      ev.preventDefault();
      for (const k of Object.keys(QFILTER)) QFILTER[k] = '';
      render();
    };
    return;
  }

  // Сколько строк остались без дочитанной причины (`details`). Говорим это ОДИН раз
  // над списком, а не в каждой строке: «не дочитали» — свойство показа целиком.
  // Счёт — только про задачи СОСЕДЕЙ, и подпись теперь так и говорит. Раньше она
  // обещала «у остальных помечено» про весь список, а своим задачам признак
  // «не дочитано» не ставят вовсе (см. OWN_SERVICE) — то есть подпись отвечала и за те
  // строки, про которые не знала ничего.
  // Последняя фраза подписи — не про отсутствие пометки, а про смысл пустой клетки:
  // у Видео и Выпусков пусто значит «кабинет не записал», у соседей — «не дочитали».
  // Без неё два разных пустых места на одном экране читались бы одинаково.
  const det = d.details || {};
  if (det.needed > det.asked)
    app.append($(`<div class="note muted" id="q-details" style="margin:-8px 0 14px">Подробности
      задач Текста и Обложек дочитаны у ${det.asked} задач из ${det.needed} (за один показ
      спрашиваем не больше ${det.budget}). У остальных стадия и причина помечены
      «не дочитано» — это не «причины нет». У Видео и Выпусков дочитывать нечего: их этап
      и причину пишет сама студия, и пустое место там значит «не записано».</div>`));

  const card = $(`<div>${queueBodyHtml(d.rows)}</div>`);
  app.append(card);
  wireActions(card);
  wireReleaseDrop(card);
  wireReasonFolds(card);
  wireGroupRetry(card);
}

function queueRowHtml(r, of){
  return `
      <tr class="${of ? 'grp-item' : ''}" ${of ? `data-of="${esc(of)}" hidden` : ''}>
        <td><span class="pill s-idle">${esc(SVC_TITLE[r.service] || r.service)}</span></td>
        <td>${taskCellHtml(r)}</td>
        <td>${esc(r.kind_title || r.kind || '—')}
            ${r.provider ? `<div class="muted">${esc(r.provider)}</div>` : ''}</td>
        <td class="st"><span class="pill ${STATE_CLS[r.state]}">${STATE_TITLE[r.state]}</span>
            ${r.progress != null ? `<div class="bar"><i style="width:${
              Math.round(r.progress * 100)}%"></i></div>` : ''}
            ${whyHtml(r)}
            ${jobLogBtnHtml(r.service, r.id, r.state)}</td>
        <td class="muted when">${when(r.created)}</td>
        <td class="acts">${actions(r)}</td>
      </tr>`;
}

/* Тело очереди: задачи одной причины — своей карточкой сверху, остальные — общей
   карточкой под ними (владелец 06.10.2026: «на странице очередь та же проблема, что
   была с выпусками, ошибочные склеены» — заголовок группы в общей таблице сливался с
   обычными строками под ним; выпуски так же разведены 03.10, см. список выпусков).

   В ключ группы, кроме самой причины, входит всё, что заголовок рисует ОДНО на всех:
   сервис (его плашка), состояние (его плашка) и наличие «повторить» (действие на
   группу). Склеить под одной плашкой строки с разной судьбой значило бы соврать про
   половину из них — а лишняя группа не врёт ни про одну.

   Клетку «Создана» группа не занимает вовсе: у сорока строк сорок разных времён, и
   любое одно число на всех было бы выдумкой. Раскрытие показывает настоящие. */
function queueBodyHtml(rows){
  const THEAD = of => `<thead><tr ${of ? `data-of="${esc(of)}" hidden` : ''}>
    <th>Сервис</th><th>Задача</th><th>Этап</th><th>Состояние</th><th>Создана</th>
    <th class="acts"></th></tr></thead>`;
  const groups = groupByReason(rows, r => (r.block && r.block.kind) ? blockLabel(r) : r.error,
      r => [r.service, r.state, canRetry(r) ? 'retry' : ''].join('|'), 'qg');
  groups.forEach(g => { g.tip = blockTip(g.rows[0], g.rows[0].error); });
  const singles = groups.filter(g => g.rows.length < 2).map(g => g.rows[0]);
  const many = groups.filter(g => g.rows.length >= 2);
  // Сначала то, что упало, потом ждущее, потом идущее.
  const RANK = {error: 0, blocked: 0, queued: 1};
  many.sort((a, b) => (RANK[a.rows[0].state] ?? 2) - (RANK[b.rows[0].state] ?? 2));
  const cards = many.map(g => {
    const r0 = g.rows[0], n = g.rows.length;
    const count = `${n} ${r0.service === 'release'
      ? plural(n, 'выпуск', 'выпуска', 'выпусков')
      : plural(n, 'задача', 'задачи', 'задач')}`;
    const label = 'Повторить все — ' + count;
    const bad = RANK[r0.state] === 0;
    return `<div class="card grpcard ${bad ? '' : 'pending'}" data-grp="${esc(g.id)}">
      <div class="grpbar"><div class="qgbar">
        <span class="pill s-idle">${esc(SVC_TITLE[r0.service] || r0.service)}</span>
        ${groupHeadHtml(g, count, ` <span class="pill ${
          STATE_CLS[r0.state]}">${STATE_TITLE[r0.state]}</span>`)}
        ${canRetry(r0)
          ? `<button class="iconbtn retry-all" data-grp="${esc(g.id)}"
               data-count="${esc(count)}" title="${esc(label)}"
               aria-label="${esc(label)}">${ICON.retry}</button>` : ''}
      </div></div>
      <table>${THEAD(g.id)}<tbody>${g.rows.map(r => queueRowHtml(r, g.id)).join('')}</tbody></table>
    </div>`;
  });
  const rest = singles.length ? `<div class="card">
      ${cards.length ? `<div class="restcap">Остальные задачи — ${singles.length}</div>` : ''}
      <table>${THEAD('')}<tbody>${singles.map(r => queueRowHtml(r, '')).join('')}</tbody></table>
    </div>` : '';
  return cards.join('') + rest;
}

/* Повтор всей группы. Одиночное «повторить» спрашивает молча, а здесь вопрос
   обязателен, и обязательно С ЧИСЛОМ: внутри задачи есть оплачиваемые вызовы, и сорок
   повторов — это сорок оплат. Число и есть цена решения, поэтому оно в заголовке
   вопроса, а не в мелком тексте под ним. */
function wireGroupRetry(root){
  root.querySelectorAll('button.retry-all').forEach(b => {
    b.onclick = () => {
      const count = b.dataset.count;
      const jobs = [...root.querySelectorAll(`tr[data-of="${b.dataset.grp}"]`)]
        .map(tr => tr.querySelector('button.act[data-act="retry"]')).filter(Boolean);
      confirmModal(`Повторить ${count}?`,
        `Каждая задача пойдёт заново, и платные вызовы внутри неё будут оплачены ещё `
        + `раз — всего ${count}. Уже потраченное не вернётся. Причина у всех одна: если `
        + `она не устранена, повтор упрётся в неё снова и деньги уйдут впустую.`,
        async () => {
        b.disabled = true;
        // По одной, а не залпом: залп из сорока запросов сосед обрывает на середине, и
        // тогда неизвестно, какие задачи ушли в работу, — то есть неизвестно, за что
        // уже заплачено.
        let ok = 0, refused = '';
        for (const el of jobs){
          const {service, id} = el.dataset;
          try{
            await post(`/ui/actions/${encodeURIComponent(service)}/${
              encodeURIComponent(id)}/retry`);
            ok++;
          }catch(e){ refused = refused || e.message; }
        }
        // Сколько ушло и сколько нет — словами. Молчаливая перерисовка на вопрос «за
        // что я заплатил» не отвечает.
        toast(refused
          ? `Отправлено на повтор ${ok} из ${jobs.length}; остальные отказали: ${refused}`
          : `Отправлено на повтор: ${ok}`, refused ? 'bad' : 'ok');
        await render();
      });
    };
  });
}

/* Кнопка показывается только там, где действие имеет смысл: отменить можно то, что
   ещё идёт, повторить — то, что уже упало. Кнопка, которая всегда есть и через раз
   отвечает «нельзя», обучает не нажимать её вовсе. */
function actions(r){
  // Слово живёт в `title`: значок молча — это ребус, а подпись рядом со значком снова
  // раздувает колонку. `aria-label` — то же слово для чтения вслух.
  const btn = (act, icon, title, danger) =>
    `<button class="iconbtn act${danger ? ' bad' : ''}" title="${esc(title)}"
             aria-label="${esc(title)}" data-service="${esc(r.service)}"
             data-id="${esc(r.id)}" data-act="${act}">${ICON[icon]}</button>`;
  // Выпуск — не задача сервиса: отменять и повторять у него нечего, его ведёт движок.
  // Что с ним можно сделать руками — убрать из очереди целиком (18.09.2026).
  if (r.service === 'release'){
    return `<a class="iconbtn" title="Открыть" aria-label="Открыть"
              href="#/release/${encodeURIComponent(r.release_id)}">${ICON.open}</a>
            ${r.plan_item_id ? `<button class="iconbtn bad rel-del" title="Убрать"
              aria-label="Убрать" data-plan="${r.plan_item_id}">${ICON.remove}</button>` : ''}`;
  }
  if (r.state === 'running' || r.state === 'queued')
    return btn('cancel', 'cancel', 'Отменить', true);
  if (canRetry(r)) return btn('retry', 'retry', 'Повторить');
  return '';
}

// Одно правило на двоих: кнопка в строке и кнопка «повторить всю группу». Посчитанное
// второй раз, оно разойдётся — и группа предложит повтор там, где строки его не дают.
// Выпуск сюда не попадает: его ведёт движок, повторять у него нечего.
function canRetry(r){
  return r.service !== 'release' && (r.state === 'error' || r.status === 'cancelled');
}

function wireActions(root){
  root.querySelectorAll('button.act').forEach(b => {
    b.onclick = async () => {
      const {service, id, act} = b.dataset;
      b.disabled = true;
      // Внутри кнопки значок, а не слово, поэтому сохраняем и возвращаем разметку:
      // `textContent` стёр бы <svg> и вернул пустую кнопку.
      const was = b.innerHTML;
      b.innerHTML = '…';
      try{
        await post(`/ui/actions/${encodeURIComponent(service)}/${encodeURIComponent(id)}/${act}`);
        await render();
      }catch(e){
        b.disabled = false;
        b.innerHTML = was;
        // Отказ сервиса — это ответ, а не сбой экрана: показываем его словами рядом
        // с той строкой, к которой он относится. Место — колонка состояния: колонка
        // значков узкая и постоянной ширины, длинная фраза в ней переносилась бы по
        // одному слову и растягивала строку — ровно то, от чего уходили.
        const row = b.closest('tr');
        const cell = (row && row.querySelector('td.st')) || b.parentElement;
        // Одна строка отказа на кнопку, а не по строке на каждое нажатие (04.10.2026:
        // восемь одинаковых «retry available only…» столбиком).
        let box = cell.querySelector(':scope > .note.bad.act-err');
        if (!box){
          box = document.createElement('div');
          box.className = 'note bad act-err';
          cell.appendChild(box);
        }
        box.textContent = e.message;
      }
    };
  });
}

  /* Предпросмотр считает та же раскладка, что и постановка, — в откатываемой

  peek.onclick = async () => {

        ${p.placed.length ? `<h3>Встанет на выходы</h3><ul>${
          p.placed.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
        ${p.queued ? `<h3>Без даты</h3><ul><li>${p.queued} шт. — в горизонте
          ${p.channel.horizon_days} дн свободных выходов не осталось</li></ul>` : ''}

          p.skipped.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
        <div class="note muted">${esc(p.note)}. Ничего пока не записано.</div>
      </div>`;
    }catch(e){

    }finally{ peek.disabled = false; }

  btn.onclick = async () => {
    errBox.innerHTML = ''; resBox.innerHTML = ''; btn.disabled = true;
    try{
      const out = await post('/ui/links', payload());
      const block = (title, items) => items.length
        ? `<h3>${title}</h3><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : '';

    }catch(e){

    }finally{ btn.disabled = false; }
  };
}

/* Имя в шапке — это и есть вход в профиль (владелец 20.09.2026: «профиль перенести при
   нажатии на логин в топбаре»). Оно же носит id вкладки `tab-profile`: подсветку раздела
   ставит render() по той же таблице ROUTES, что и остальным вкладкам, — второй механизм
   подсветки заводить не нужно. */
/* Восклицательные знаки в верхней панели (владелец 09.10.2026): «Каналы» — если у
   каналов мало донорских ссылок, «Выпуски» — если есть выпуски в разборе. Один запрос
   на обе вкладки; держим ответ минуту, чтобы переходы между экранами не дёргали сервер. */
let ATTN = null, ATTN_AT = 0;
async function attention(force){
  if (!force && ATTN && Date.now() - ATTN_AT < 60000) return ATTN;
  try { ATTN = await api('/ui/attention'); ATTN_AT = Date.now(); }
  catch (e){ if (e instanceof NeedLogin) throw e; ATTN = ATTN || {}; }
  return ATTN;
}
function attnBadges(){
  const a = ATTN || {};
  const put = (id, n, tip) => {
    const tab = document.getElementById(id);
    if (!tab) return;
    let el = tab.querySelector('.attn');
    if (!n){ if (el) el.remove(); return; }
    if (!el){ el = document.createElement('span'); el.className = 'attn whytip';
              el.tabIndex = 0; tab.append(el); }
    el.textContent = '!';
    el.dataset.hint = tip;
  };
  const low = a.low_supply || [];
  put('tab-channels', low.length, `Мало донорских ссылок — ${low.length} ${plural(low.length,
      'канал', 'канала', 'каналов')} (запас меньше ${a.supply_min_days} дн):\n`
    + low.slice(0, 12).map(x => `· ${x.name}: ${x.text}`).join('\n')
    + (low.length > 12 ? `\nи ещё ${low.length - 12}` : '')
    + '\n\nКто чинит: оператор канала — вставить ссылки на доноров на экране канала.');
  put('tab-releases', a.blocked || 0, `В разборе ${a.blocked} ${plural(a.blocked || 0,
      'выпуск', 'выпуска', 'выпусков')}:\n`
    + (a.blocked_sides || []).map(s => `· ${s.tag}: ${s.count}${s.who ? ' — чинит ' + s.who : ''}`)
      .join('\n'));
}
function refreshAttention(force){
  attention(force).then(attnBadges).catch(() => {});
}
setInterval(() => { if (ME) refreshAttention(true); }, 60000);

/* Материалы прямо в строке этапа — ТЗ §14 просит на каждом этапе не статус, а сам
   результат: миниатюры кадров, плеер озвучки, готовые файлы сборки. Ссылки ведут
   в кабинет: он проверяет, что путь не выводит за пределы проекта, и умеет отдавать
   уменьшенные копии по ?w=. */
/* Миниатюра с кнопкой «переделать». Один кадр вместо всего этапа: повтор этапа
   целиком переделывает и то, что получилось, а это уже оплаченная работа. */
function thumb(src, full, name, height, pid){
  // href и target остаются: обычный клик перехватит просмотрщик (wireLightbox), а
  // ctrl-клик и «открыть в новой вкладке» продолжат работать как у всякой ссылки.
  return `<span class="thumb"><a href="${full}" target="_blank" title="${esc(name)}"
    data-full="${full}" data-name="${esc(name)}"
    ><img src="${src}" loading="lazy" style="height:${height}px"></a>${pid
    ? `<button class="again" data-regen="image" data-pid="${esc(pid)}"
         data-name="${esc(name)}">переделать</button>` : ''}</span>`;
}

function lightbox(items, start){
  // Смотреть кадры вкладками — значит потерять место, где ты был. Здесь тот же <dialog>,
  // что у остальных окон: Esc и клик по фону закрывают его сами, без нашего кода.
  let i = Math.max(0, Math.min(start | 0, items.length - 1));
  const dlg = $(`<dialog class="lb">
    <img alt="">
    <div class="lbbar">
      <button class="lb-prev" title="Предыдущая (←)">‹</button>
      <span class="lb-num"></span>
      <span class="lbname"></span>
      <button class="lb-next" title="Следующая (→)">›</button>
      <a class="lb-dl" download style="color:inherit;text-decoration:underline">скачать</a>
      <button class="lb-x" title="Закрыть (Esc)">×</button>
    </div></dialog>`).firstElementChild;
  document.body.append(dlg);
  const img = dlg.querySelector('img');
  const paint = () => {
    const it = items[i];
    img.src = it.full; img.alt = it.name;
    dlg.querySelector('.lb-num').textContent = `${i + 1} / ${items.length}`;
    dlg.querySelector('.lbname').textContent = it.name;
    const dl = dlg.querySelector('.lb-dl');
    dl.href = it.full; dl.setAttribute('download', it.name.split('/').pop());
    const many = items.length > 1;
    dlg.querySelector('.lb-prev').style.visibility = many ? '' : 'hidden';
    dlg.querySelector('.lb-next').style.visibility = many ? '' : 'hidden';
  };
  const step = d => { i = (i + d + items.length) % items.length; paint(); };
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('.lb-prev').onclick = () => step(-1);
  dlg.querySelector('.lb-next').onclick = () => step(1);
  dlg.querySelector('.lb-x').onclick = close;
  dlg.onclick = ev => { if (ev.target === dlg) close(); };
  dlg.addEventListener('cancel', ev => { ev.preventDefault(); close(); });
  dlg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); step(-1); }
    if (ev.key === 'ArrowRight') { ev.preventDefault(); step(1); }
  });
  paint();
  dlg.showModal();
}

function wireLightbox(root){
  root.querySelectorAll('.thumbs').forEach(box => {
    const links = [...box.querySelectorAll('a[data-full]')];
    const items = links.map(a => ({full: a.dataset.full, name: a.dataset.name || ''}));
    links.forEach((a, n) => a.onclick = ev => {
      // Ctrl/Cmd/средняя кнопка — пусть работает как обычная ссылка: человек
      // осознанно просит новую вкладку, и отнимать это нельзя.
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
      ev.preventDefault();
      lightbox(items, n);
    });
  });
}

function player(src){
  // Встроенный плеер браузера выглядит по-своему в каждом и не попадает в оформление.
  // Звук остаётся тем же <audio>, меняется только оболочка.
  const wrap = $(`<div class="pl">
    <button type="button" class="pl-go" title="Слушать"><i></i></button>
    <div class="bar"><i></i></div>
    <span class="t">0:00</span>
    <audio preload="none" src="${src}"></audio></div>`).firstElementChild;
  const a = wrap.querySelector('audio');
  const go = wrap.querySelector('.pl-go');
  const bar = wrap.querySelector('.bar');
  const fill = wrap.querySelector('.bar i');
  const t = wrap.querySelector('.t');
  const mmss = v => (isFinite(v) ? `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}` : '0:00');
  go.onclick = () => { a.paused ? a.play() : a.pause(); };
  a.onplay = () => { go.classList.add('on'); go.title = 'Пауза'; };
  a.onpause = () => { go.classList.remove('on'); go.title = 'Слушать'; };
  a.onended = () => { go.classList.remove('on'); fill.style.width = '0'; };
  a.ontimeupdate = () => {
    const d = a.duration || 0;
    fill.style.width = d ? `${(a.currentTime / d) * 100}%` : '0';
    t.textContent = `${mmss(a.currentTime)} / ${mmss(d)}`;
  };
  a.onloadedmetadata = () => { t.textContent = `0:00 / ${mmss(a.duration)}`; };
  bar.onclick = ev => {
    const r = bar.getBoundingClientRect();
    if (a.duration) a.currentTime = ((ev.clientX - r.left) / r.width) * a.duration;
  };
  return wrap;
}

function wirePlayers(root){
  root.querySelectorAll('[data-audio]').forEach(box => {
    box.replaceWith(player(box.dataset.audio));
  });
}

function wireRegen(root){
  root.querySelectorAll('button[data-regen]').forEach(b => b.onclick = async ev => {
    ev.preventDefault(); ev.stopPropagation();
    const what = b.dataset.regen;
    // Промпт необязателен: пусто = переделать как было. Поэтому кнопка «Переделать»
    // в поле ввода, а не «Готово» — видно, что можно просто нажать.
    askInline(b, {ok: 'Переделать', placeholder: what === 'image'
        ? 'свой промпт — по желанию' : 'промпт движения — по желанию'},
      async (prompt_) => {
    b.disabled = true; b.textContent = '…';
    try{
      await post(`/ui/regen/${what}`, {project_id: b.dataset.pid,
                                       name: b.dataset.name, prompt: prompt_});
      await render();
    }catch(e){
      b.disabled = false; b.textContent = 'переделать';
      toast(e.message);
    }
    });
  });
}

function stageFiles(s, pid){
  if (!s.files || !s.files.length) return '';
  const url = n => pultUrl(s.file_base) + n.split('/').map(encodeURIComponent).join('/');
  return s.files.map(g => {
    // Обложка — одна картинка, и её надо разглядеть: крупнее кадров и без «переделать»
    // (перерисовывают её на вкладке «Обложка» проекта, а не как кадр).
    if (g.code === 'covers') return `<div style="margin-top:7px">${g.names.slice(0, 1)
      .map(n => thumb(url(n) + '?w=480', url(n), n, 135, '')).join('')}</div>`;
    if (g.kind === 'image') return `<div style="display:flex;flex-wrap:wrap;gap:5px;
      margin-top:7px">${g.names.map(n => thumb(url(n) + '?w=120', url(n), n, 52,
        pid)).join('')}
      ${g.count > g.names.length
        ? `<span class="muted" style="align-self:center;font-size:12px">и ещё ${
            g.count - g.names.length}</span>` : ''}</div>`;
    if (g.kind === 'audio') return g.names.map(n => `<audio controls preload="none"
      src="${url(n)}" style="width:100%;max-width:340px;margin-top:7px"></audio>`).join('');
    if (g.kind === 'video') return g.names.slice(0, 2).map(n => `<div class="thumb"
      style="margin:7px 6px 0 0"><video controls preload="none" src="${url(n)}"
      style="max-width:260px;border-radius:6px"></video>${pid
        ? `<button class="again" data-regen="clip" data-pid="${esc(pid)}"
             data-name="${esc(n)}">переделать</button>` : ''}</div>`).join('');
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px">${
      g.names.map(n => `<a href="${url(n)}" target="_blank" style="padding:3px 9px;
      border:1px solid var(--line);border-radius:6px;text-decoration:none;font-size:12px"
      >${esc(n.split('/').pop())}</a>`).join('')}</div>`;
  }).join('');
}

/* ───────────────────────────── проекты ───────────────────────────── */

/* Проект — то, что делает выпуск: папка с кадрами, озвучкой, рендером и субтитрами.
   Заводить их руками пульт не даёт и не будет: их создаёт выпуск. А смотреть, что
   получилось, и забирать нужно каждый день — ради этого не должно приходиться уходить
   в кабинет. Ссылки на файлы ведут в кабинет: он отдаёт их с проверкой пути и с
   миниатюрами, и второй такой отдачи заводить незачем. */

// «Убрать» у выпуска — и в «Проектах», и в «Очереди» (18.09.2026). Снимает его кабинет
// своей ручкой `cancel_item`: она же гасит ждущую заливку и отказывает, когда ролик уже
// уходит на канал. Материалы проекта при этом остаются — их удаляет уборка по сроку
// хранения, а не эта кнопка.
function wireReleaseDrop(root){
  root.querySelectorAll('button.rel-del').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const plan = b.dataset.plan || (b.closest('[data-plan]') || {dataset: {}}).dataset.plan;
    if (!plan){ toast('У этого выпуска не нашлось строки плана'); return; }
    confirmModal('Убрать выпуск из очереди?',
      'Выпуск уйдёт из плана канала. Материалы проекта останутся на диске.', async () => {
      b.disabled = true;
      try{ await post(`/ui/plan/${plan}/cancel`); await render(); }
      catch(e){ b.disabled = false; toast(e.message); }
    });
  });
}

/* ── Пакетные карточки «Текст» и «Обложка» (20.09.2026) ─────────────────────────
   Эти два вида — не задачи очереди кабинета, а СОСЕДНИЕ СЕРВИСЫ (Rewrite и Cover):
   пульт ходит к ним сам, поэтому и пакет для них пультовый — POST
   /ui/projects/batch/text и /ui/projects/batch/cover, а не кабинетный
   /api/batch/{kind}. Отсюда и отдельная разметка: у кабинетных карточек поля общие
   (из пресета), у этих — свои.

   Компоновка следует из главного: источник берётся ИЗ ПРОЕКТА (ссылка донора
   выпуска, а если донора нет — сценарий проекта). Значит обычный случай — отметить
   проекты и нажать «Сделать», ничего не заполняя. Всё, что в карточке, —
   необязательная ЗАМЕНА, и замена источника лежит в свёрнутом блоке: развёрнутое
   поле человек читает как «надо заполнить», а заполнять тут нечего. */

// Варианты полей (языки, модели, пресеты) спрашиваем у тех же ручек, что кормят
// одиночные экраны текста и обложек, — второго списка тех же значений в пульте быть
// не должно. Каждая из них ходит к соседу по 4–5 раз, а экран «Проекты» перерисовывает
// себя сам после каждой пачки, поэтому спрашиваем ОДИН раз за загрузку страницы и
// держим обещание. Отказ соседа карточку не ломает: пустое поле и так значит «как в
// проекте», просто выбрать другое будет нельзя.
let PULT_BATCH_OPTS = null;
function pultBatchOptions(){
  if (!PULT_BATCH_OPTS)
    PULT_BATCH_OPTS = Promise.all([
      api('/ui/text').catch(e => ({_err: e.message})),
      api('/ui/covers').catch(e => ({_err: e.message})),
    ]).then(([text, cover]) => ({text, cover}));
  return PULT_BATCH_OPTS;
}

// «Пусто — как в проекте» написано у каждого поля обеих карточек: это не украшение,
// а единственное место, где сказано, что произойдёт, если ничего не трогать. У списка
// языков подпись стоит ОТДЕЛЬНОЙ строкой под чипами, а не внутри них: чипы заполняются
// вариантами, и надпись внутри коробки исчезла бы ровно тогда, когда выбор появился.
const PULT_LANGS_WAIT = '<span class="muted" style="font-size:12px">' +
  'языки загружаются…</span>';
const PULT_LANGS_HINT = '<div class="note muted" style="margin-top:6px">' +
  'ничего не отмечено — уедет язык канала проекта</div>';

  const about = isText

    : 'Источник — из проекта: превью донора выпуска.';
  // Главное поле сверху, как у соседних карточек: у текста это языки (за язык и

  const main = isText

       <select data-pf="option" style="width:100%;margin-top:4px">
         <option value="">Чем рисовать: по умолчанию</option></select>

// Варианты подставляются ПОСЛЕ отрисовки и без ожидания: «Сделать» с пустыми полями
// работает и до того, как соседи ответят, а если они не ответят вовсе — карточка
// останется в режиме «как в проекте», и это сказано словами, а не пустым местом.
async function pultBatchFill(batch){
  const opts = await pultBatchOptions();
  const chips = (box, list, err) => {
    if (!box) return;
    if (err){
      box.innerHTML = `<span class="muted" style="font-size:12px">список языков не
        загрузился (${esc(err)}) — уедет язык канала проекта</span>`;
      return;
    }
    if (!list.length){
      box.innerHTML = '<span class="muted" style="font-size:12px">список языков пуст — '
                    + 'уедет язык канала проекта</span>';
      return;
    }
    box.innerHTML = list.map(l => `<label data-code="${esc(l.code)}"><input
      type="checkbox">${esc(l.title)}</label>`).join('');
    box.querySelectorAll('label').forEach(l => {
      const cb = l.querySelector('input');
      cb.onchange = () => l.classList.toggle('on', cb.checked);
    });
    langPicker(box);
  };
  const fill = (sel, list) => {
    if (!sel || !list.length) return;
    sel.insertAdjacentHTML('beforeend', list.map(o =>
      `<option value="${esc(o.value)}">${esc(o.title)}</option>`).join(''));
  };
  const t = opts.text || {}, c = opts.cover || {};
  const tbox = batch.querySelector('[data-pult="text"]');
  if (tbox){
    chips(tbox.querySelector('[data-pf="languages"]'),
          (t.languages || []).filter(l => l && l.code), t._err);
    fill(tbox.querySelector('[data-pf="model"]'),
         (t.models || []).map(m => ({value: m.value, title: m.label})));
  }
  const cbox = batch.querySelector('[data-pult="cover"]');
  if (cbox){
    // Cover ждёт ОТОБРАЖАЕМОЕ имя языка («Русский»), а не код: подставить сюда коды
    // Rewrite значило бы отказ на каждой задаче. Поэтому значением чипа идёт имя.
    chips(cbox.querySelector('[data-pf="languages"]'),
          (c.languages || []).map(n => ({code: n, title: n})), c._err);
    fill(cbox.querySelector('[data-pf="preset"]'),
         (c.presets || []).map(p => ({value: p, title: p})));
    fill(cbox.querySelector('[data-pf="option"]'),
         (c.options || []).map(o => ({value: o.provider + '|' + o.model, title: o.label})));
  }
}

// Как назвать строку отчёта. `order` — сухой прогон («уйдёт»), `ordered` — уже
// поставлено: путать их нельзя, это разница между «посмотрели» и «заплатили».
const PULT_ACT = {order: ['уйдёт', 's-queued'], ordered: ['поставлено', 's-done'],
                  skip: ['пропуск', 's-idle'], error: ['ошибка', 's-error']};
const PULT_SRC = {donor: 'ссылка донора', text: 'сценарий проекта',
                  'replacement-url': 'ссылка из карточки',
                  'replacement-text': 'вставленный текст'};

// Строки по проектам. Отчёт пофайловый не из любви к подробностям: платят за каждый
// проект отдельно, и «ок» без строк не отвечает на вопрос, за что ушли деньги.
function pultBatchRows(out){
  return (out.projects || []).map(p => {
    const said = PULT_ACT[p.action] || [p.action, 's-idle'];
    const langs = (p.languages || []).map(esc).join(', ');
    const note = [langs && ('языки: ' + langs),
                  p.source && esc(PULT_SRC[p.source] || p.source),
                  p.source_note && esc(p.source_note)].filter(Boolean).join(' · ');
    return `<div style="border-top:1px solid var(--line);padding:7px 0">
      <span class="pill ${said[1]}">${esc(said[0])}</span> <b>${esc(p.name)}</b>
      ${p.replaced ? '<span class="pill s-error">не свой источник</span>' : ''}
      ${note ? `<div class="muted" style="font-size:12px">${note}</div>` : ''}
      ${p.why ? `<div class="note ${p.action === 'error' ? 'bad' : 'muted'}"
        style="margin:2px 0 0">${esc(p.why)}</div>` : ''}
      ${(p.skipped_languages || []).map(s => `<div class="note muted"
        style="margin:2px 0 0">${esc(s.code)}: ${esc(s.why)}</div>`).join('')}
      ${p.repeat_checked === false ? `<div class="note muted" style="margin:2px 0 0">
        повтор проверим при запуске: расшифровки донора ещё нет в кэше</div>` : ''}
    </div>`;
  }).join('');
}

// Поле карточки пакетного запуска: select — если у поля есть варианты (их даёт
// `preset_fields`), иначе обычный ввод. Пустое значение всегда первое: «как в проекте».
function fieldSelectHtml(kind, f){
  const id = `b-${kind}-${f.key}`;
  if ((f.options || []).length)
    return `<select id="${id}" data-bk="${kind}" data-key="${esc(f.key)}"
              style="width:100%;margin-top:6px" title="${esc(f.hint || f.label)}">
      <option value="">${esc(f.label)}: как в проекте</option>
      ${f.options.map(o => `<option value="${esc(String(o.value))}">${esc(o.title)}</option>`)
        .join('')}</select>`;
  return `<input id="${id}" data-bk="${kind}" data-key="${esc(f.key)}"
            placeholder="${esc(f.label)}: как в проекте" style="width:100%;margin-top:6px">`;
}

/* Что кабинет принял по «Сделать всё» — окном, а не молчанием.

   Жалоба владельца 20.09.2026: «нажал сделать всё, но не вижу чтобы начался делаться
   сценарий и обложка». Кабинет их и не делает: «всё» — это четыре этапа ЕГО очереди
   (поле `stages` ответа), а сценарий пишет Rewrite и обложку рисует Cover, каждый
   своей кнопкой (поле `note`). Оба поля ответ отдаёт, но на экране их не было нигде —
   человек ждал того, чего не заказывал, и не получал ни строчки объяснения.

   Слова берём из ответа, а не пересказываем своими: на кнопке, в подсказке кабинета и
   здесь должен стоять один текст, иначе экран однажды пообещает не то, что сделано.

   Окно, а не тост: тост живёт пять секунд и перекрывается следующим, а экран через
   1,2 с перерисовывается — врезка внутри карточки исчезла бы вместе с ним. <dialog>
   висит на <body> и перерисовку переживает. */
// Подписи этапов — ровно те же слова, что стоят на карточках пакетного запуска рядом
// («Озвучка», «Картинки», «Видео», «Рендер»): человек должен сопоставить сказанное с
// кнопками, а не догадываться, что «кадры» и «картинки» — одно и то же.
const PIPELINE_STAGE_TITLES = {tts: 'озвучка', images: 'картинки', video: 'видео',
                               render: 'рендер', prompts: 'промпты',
                               chapters: 'главы'};
function pipelineReport(out, n, where){
  const enq = out.enqueued || 0, def = out.deferred || 0;
  const blocked = out.blocked || 0, busy = out.skipped || 0;
  const stages = (out.stages || []).map(s => PIPELINE_STAGE_TITLES[s] || s).join(' → ');
  const nums = [`отмечено проектов: <b>${n}</b>`, `поставлено задач: <b>${enq}</b>`];
  if (def) nums.push(`отложено: <b>${def}</b>`);
  if (blocked) nums.push(`пропущено: <b>${blocked}</b>`);
  if (busy) nums.push(`уже шло: <b>${busy}</b>`);
  modal('Сделать всё: что поставлено',
    `<div style="font-size:14px">${nums.join(' · ')}</div>
     ${blocked ? `<div class="note bad">Пропущено проектов: ${blocked} — ${
        esc(out.block_reason || 'причина не названа')}. Денег на них не
        потрачено: задача не ставилась. Остальные уехали — всю пачку повторять не
        нужно, поправьте причину и нажмите только для пропущенных.</div>` : ''}
     ${def ? `<div class="note muted">Отложенное стартует само, когда дозреют
        материалы: видео ждёт картинки, рендер — озвучку и картинки.</div>` : ''}
     ${stages ? `<div class="note muted">В «сделать всё» входит: ${esc(stages)}.</div>`
       : ''}
     ${out.note ? `<div class="note muted">${esc(out.note)}${
        where ? ' ' + esc(where) : ''}</div>` : ''}`,
    {ok: 'Понятно', no: 'Закрыть', onOk: (body, close) => close()});
}

async function viewProjects(){
  const d = await api('/ui/projects');
  app.innerHTML = '';
  const bar = $(`<div class="head">
      <div><h1>Проекты ${hintDot(
        'Материалы роликов: кадры, озвучка, готовые файлы.')}</h1></div>
      <button id="newp" class="small">Новый проект</button>
    </div>`);
  app.append(bar);

  document.getElementById('newp').onclick = async () => {
    // Один клик — и сразу на «Сценарий» (18.09.2026). Раньше форма спрашивала название
    // и текст, а вкладка «Сценарий» тут же спрашивала то же самое второй раз: донора,
    // текст или файл. Имя даётся временное и правится на самом экране проекта.

    btn.disabled = true;

  if (!d.projects.length){
    app.append($(`<div class="card">${emptyBox({
      why: 'Проектов нет — ни один ролик пока не собирается.',
      means: 'Проект — это одна папка ролика: сценарий, озвучка, кадры и рендер. '
           + 'Обычно он заводится сам, когда на канал поставлена ссылка.',
      href: '#/projects', id: 'pr-first', act: 'Собрать проект руками'})}</div>`));

      ev.preventDefault();

    return;
  }
  const mark = (ok, txt) => `<span class="pill ${ok ? 's-done' : 's-idle'}">${txt}</span>`;
  // Частичный прогон пачкой (18.09.2026): по кнопке на каждый этап, как было в
  // кабинете. «Сделать всё» осталось — теперь одним запросом на весь пакет, а не
  // отдельным на каждый проект.
  let batchFields = {}, batchPult = {};
  try{
    const bf = await api('/ui/projects/batch/fields');
    batchFields = bf.kinds || {};
    // Карточки текста и обложки рисуем только если сервер про них знает: на старом
    // сервере экран останется прежним, а не обзаведётся кнопками в никуда.
    batchPult = bf.pult || {};
  }catch(e){ toast(e.message); }
  const BATCH_ORDER = ['tts', 'images', 'video', 'render'];
  const PULT_ORDER = ['text', 'cover'].filter(k => batchPult[k] && batchPult[k].post);
  // Панель пакетного запуска нужна, только когда что-то отмечено. Раскрытая всегда, она
  // занимала 900 px над списком проектов — на экране, который открывают ради списка
  // (жалоба владельца 21.09.2026 «интерфейс перегружен»). Без отметок от неё остаётся
  // одна строка с подсказкой, первая галочка раскрывает её целиком.
  const batch = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Запуск для отмеченных
      <span class="muted" id="batchn" style="float:right;font-weight:400;
        text-transform:none;letter-spacing:0">отметьте проекты в списке</span></div>
    <div class="secbody" id="batchbody" hidden>
      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:stretch">
        ${BATCH_ORDER.map(kind => {
          const k = batchFields[kind] || {title: kind, fields: []};
          const main = (k.fields || [])[0];
          const extra = (k.fields || []).slice(1);
          return `<div class="bcard" style="flex:1 1 220px;min-width:220px;border:1px solid var(--line);
                    border-radius:10px;padding:12px">
            <div style="font-weight:600;margin-bottom:8px">${esc(k.title)}</div>
            ${main ? fieldSelectHtml(kind, main) : ''}
            <button class="small bgo" data-kind="${kind}" disabled
              style="width:100%;margin-top:10px">Сделать</button>
            <button class="ghost small bcancel" data-kind="${kind}" disabled
              style="width:100%;margin-top:6px">Отменить</button>
            ${extra.length ? `<details style="margin-top:9px">
              <summary class="muted" style="cursor:pointer;font-size:12px">Доп. настройки</summary>
              ${extra.map(f => fieldSelectHtml(kind, f)).join('')}</details>` : ''}
          </div>`;
        }).join('')}
        ${PULT_ORDER.map(k => pultBatchCardHtml(k, batchPult[k].title || k)).join('')}
      </div>
      <button id="batchgo" class="small" disabled
        style="width:100%;margin-top:14px">Сделать всё для отмеченных</button>
      <button class="ghost small bcancel" data-kind="all" disabled
        style="width:100%;margin-top:6px">Отменить всё у отмеченных</button>
      <div class="note muted" style="margin-top:10px">Пустое поле — «как в проекте»:
        настройки проекта не перетираются. Видео и рендер у неготовых проектов ставятся
        отложенно — стартуют сами, когда материалы дозреют. «Отменить» снимает и уже
        идущие задачи, и отложенный авто-запуск; готовые файлы не удаляются.${
        PULT_ORDER.length ? ` У текста и обложки своя очередь заказов, поэтому
        «Отменить» для них здесь нет — начатый заказ виден на экранах «Текст» и
        «Обложки».` : ''}</div>
      <div id="pultres" style="margin-top:12px"></div>
    </div></div>`);
  app.append(batch);
  const card = $(`<div class="card"><table>
    <thead><tr><th style="width:26px"><input type="checkbox" id="pickall"></th>
      <th>Проект</th><th>Готово</th><th>Выпуск</th><th>Изменён</th></tr></thead>
    <tbody>${d.projects.map(p => p.kind === 'release'
      // Выпуск канала, у которого проекта ещё нет: проект появится после готового
      // текста. Показываем строку здесь же, чтобы ролик не пропадал из виду,
      // но отмечать её галочкой нечего — «сделать всё» делают по проекту.
      ? `<tr class="row" data-release="${esc(p.release_id)}" data-plan="${p.plan_item_id}">
      <td onclick="event.stopPropagation()"><span class="muted">·</span></td>
      <td><div style="font-weight:600">${esc(p.name)}</div>
          <div class="muted" style="font-size:11px">выпуск канала
            ${esc(p.channel || '')} · проекта ещё нет</div></td>
      <td><span class="pill s-queued">${esc(p.phase_title || p.phase)}</span>
          ${p.waiting ? `<div class="note bad">${esc(p.waiting)}</div>` : ''}</td>
      <td><a href="#/release/${encodeURIComponent(p.release_id)}">открыть выпуск</a></td>
      <td class="muted">${when(p.updated)}${p.plan_item_id
        ? `<button class="ghost small rel-del rel-below" onclick="event.stopPropagation()"
             data-plan="${p.plan_item_id}" style="margin-left:8px">Убрать</button>` : ''}</td>
    </tr>`
      : `<tr class="row" data-id="${esc(p.id)}">
      <td onclick="event.stopPropagation()"><input type="checkbox" class="pick"
          data-id="${esc(p.id)}"></td>
      <td><div style="font-weight:600">${esc(p.name)}</div>
          <div class="muted mono" style="font-size:11px">${esc(p.id)}</div></td>
      <td>${mark(p.ready.text, 'текст')}
          ${mark(p.ready.audio, 'озвучка')}
          ${mark(p.ready.images > 0, `кадры ${p.ready.images}${
            p.ready.images_expected ? '/' + p.ready.images_expected : ''}`)}
          ${p.ready.clips ? mark(true, `клипы ${p.ready.clips}`) : ''}
          ${mark(p.ready.render, 'ролик')}
          ${p.busy ? `<span class="pill s-running">в работе: ${p.busy}</span>` : ''}</td>
      <td>${p.release_id
        ? `<a href="#/release/${encodeURIComponent(p.release_id)}">${esc(
            p.phase_title || p.phase)}</a>` : '<span class="muted">—</span>'}</td>
      <td class="muted">${when(p.updated)}${p.plan_item_id
        ? `<button class="ghost small rel-del rel-below" onclick="event.stopPropagation()"
             data-plan="${p.plan_item_id}" style="margin-left:8px">Убрать выпуск</button>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>`);
  card.querySelectorAll('tr.row').forEach(tr => tr.onclick = () => {
    if (tr.dataset.id) location.hash = '#/project/' + encodeURIComponent(tr.dataset.id);
    else if (tr.dataset.release) location.hash = '#/release/' + encodeURIComponent(tr.dataset.release);
  });
  wireReleaseDrop(card);

  const goBtn = batch.querySelector('#batchgo');
  const countEl = batch.querySelector('#batchn');
  const picks = () => [...card.querySelectorAll('input.pick:checked')].map(cb => cb.dataset.id);
  // Подпись под полем текста ставится ниже, когда пультовые карточки нарисованы.
  // Через переменную, а не прямым вызовом: счётчик объявлен раньше карточек, и
  // ссылаться на ещё не созданное значило бы падать на первой же галочке.
  let pultNote = () => {};
  const refreshCount = () => {
    const n = picks().length;
    countEl.textContent = n ? `отмечено: ${n}` : 'отметьте проекты в списке';
    batch.querySelector('#batchbody').hidden = n === 0;
    batch.querySelectorAll('button.bgo, button.bcancel, button.pgo, #batchgo')
      .forEach(b => b.disabled = n === 0);
    pultNote();
  };
  card.querySelectorAll('input.pick').forEach(cb => cb.onchange = refreshCount);
  card.querySelector('#pickall').onchange = (e) => {
    card.querySelectorAll('input.pick').forEach(cb => cb.checked = e.target.checked);
    refreshCount();
  };

  // Кнопки этапов. Значения полей карточки уходят как есть: пустые кабинет
  // отбрасывает сам и берёт настройку проекта.
  const batchValues = kind => {
    const out = {};
    batch.querySelectorAll(`[data-bk="${kind}"]`).forEach(el => {
      if (el.value.trim()) out[el.dataset.key] = el.value.trim();
    });
    return out;
  };
  // Итог пачки. Причину пропуска называем ВСЕГДА, когда кто-то пропущен.
  //
  // Было: причина показывалась только при `!enq && !def` — то есть когда не поставлено
  // ничего. Такого ответа не бывает: если не уехал ни один проект, кабинет отвечает
  // отказом 400 с той же причиной, и она уходит в `catch` ниже. Условие было мёртвым,
  // а живой случай — смешанная пачка (часть уехала, часть отвалилась) — оставался без
  // единого слова: ни числа пропущенных, ни почему. Ровно на это жаловался владелец
  // 20.09.2026. Пропущенные (`blocked`) и «уже идёт» (`skipped`) считаются отдельно:
  // первое — повод что-то поправить, второе — нормальная защита от дубля.
  const batchToast = (out, n) => {
    const enq = out.enqueued || 0, def = out.deferred || 0;
    const blocked = out.blocked || 0, busy = out.skipped || 0;
    const parts = [`проектов: ${n}`, `поставлено задач: ${enq}`];
    if (def) parts.push(`отложено: ${def}`);
    if (blocked) parts.push(`пропущено: ${blocked}`);
    if (busy) parts.push(`уже идёт: ${busy}`);
    toast(parts.join(' · ')
          + (blocked ? ` — ${out.block_reason || 'причина не названа'}` : ''),
          (enq || def) ? (blocked ? 'warn' : 'ok') : 'bad');
  };
  batch.querySelectorAll('button.bgo').forEach(b => b.onclick = async () => {
    const ids = picks();
    if (!ids.length) return;
    b.disabled = true;
    try{
      const out = await post(`/ui/projects/batch/${b.dataset.kind}`,
                             {pids: ids, values: batchValues(b.dataset.kind)});
      batchToast(out, ids.length);
    }catch(e){ toast(e.message); }
    finally{ b.disabled = false; setTimeout(() => viewProjects(), 1200); }
  });
  batch.querySelectorAll('button.bcancel').forEach(b => b.onclick = () => {
    const ids = picks();
    if (!ids.length) return;
    confirmInline(b, 'Отменить у отмеченных? Снимутся и отложенные авто-запуски.',
      async () => {
        b.disabled = true;
        try{
          const out = await post(`/ui/projects/batch/cancel/${b.dataset.kind}`, {pids: ids});
          toast(`остановлено: ${out.cancelled || 0}, снято отложенных: ${
            out.cleared || 0}`, 'ok');
        }catch(e){ toast(e.message); }
        finally{ b.disabled = false; setTimeout(() => viewProjects(), 1200); }
      });
  });
  // ── Текст и обложка: сухой прогон → подтверждение → деньги ──────────────────
  // Отдельно от кнопок кабинета намеренно. Там ставится задача в очередь, и повтор
  // ловит сам кабинет; здесь уходит ПЛАТНЫЙ вызов соседу, и уходит сразу на пачку
  // проектов — цена ошибки умножается на число галочек. Поэтому сначала тот же
  // запрос с dry_run, где сервер считает, кому и что уйдёт, и только после
  // подтверждения — настоящий.
  const pultBox = kind => batch.querySelector(`[data-pult="${kind}"]`);
  const pultValues = kind => {
    const box = pultBox(kind);
    const val = k => { const el = box.querySelector(`[data-pf="${k}"]`);
                       return el ? String(el.value || '').trim() : ''; };
    const flag = k => { const el = box.querySelector(`[data-pf="${k}"]`);
                        return !!(el && el.checked); };
    const langs = [...box.querySelectorAll('[data-pf="languages"] label')]
      .filter(l => l.querySelector('input').checked).map(l => l.dataset.code);
    if (kind === 'text'){
      const area = box.querySelector('[data-pf="source_text"]');
      return {languages: langs, model: val('model'),
              source_from: val('source_from') || 'auto',
              source_url: val('source_url'),
              source_text: area ? area.value : '',
              one_at_a_time: flag('one_at_a_time')};
    }
    // Провайдер и модель обложки — одна пара в одном списке (так их проверяет сам
    // Cover), поэтому в значении они склеены и здесь разбираются обратно.
    const pair = val('option');
    const cut = pair.indexOf('|');
    return {languages: langs, preset: val('preset'),
            provider: cut < 0 ? '' : pair.slice(0, cut),
            model: cut < 0 ? '' : pair.slice(cut + 1),
            reference_url: val('reference_url'),
            edit_preview: flag('edit_preview'),
            one_at_a_time: flag('one_at_a_time')};
  };
  // То, что сервер отвергнет, говорим ДО нажатия: отказ, прилетевший после клика по
  // платной кнопке, читается как «сломалось», а не как «я сам так выбрал».
  const pultRefusal = (kind, body, n) => {
    if (kind !== 'text') return '';
    if (body.source_url && body.source_text.trim())
      return 'Замена источника одна: либо ссылка, либо текст. Денег не потрачено — '
           + 'запрос не уходил. Уберите одно из двух и нажмите «Сделать».';
    if (body.source_text.trim() && n > 1)
      return `Вставленный текст (или файл) уходит одному проекту, а отмечено ${n}. `
           + 'Денег не потрачено — запрос не уходил. Снимите лишние галочки или '
           + 'очистите текст.';
    return '';
  };
  const textBox = pultBox('text');
  if (textBox){
    const area = textBox.querySelector('[data-pf="source_text"]');
    // Предупреждение живёт рядом с полем и знает число отмеченных: «одному проекту» —
    // это про то, что человек уже отметил, а не про отвлечённое правило.
    pultNote = () => {
      const el = textBox.querySelector('.pult-one');
      const n = picks().length;
      const busy = !!area.value.trim();
      el.classList.toggle('bad', busy && n > 1);
      el.classList.toggle('muted', !(busy && n > 1));
      el.textContent = busy && n > 1
        ? `Вставленный текст уходит одному проекту, а отмечено ${n}: снимите лишние `
          + 'галочки или очистите текст — иначе сервер откажет.'
        : 'Ссылка уезжает всем отмеченным, а файл и вставленный текст — одному '
          + `проекту. Сейчас отмечено: ${n}.`;
    };
    area.oninput = pultNote;
    pultNote();
    // Файл читается в браузере, как на вкладке «Сценарий»: серверу нужен текст, а не
    // файл. TextDecoder с fatal — единственный способ отличить не-UTF-8 от кракозябр,
    // которые иначе уедут в рерайт и вернутся мусором за деньги.
    textBox.querySelector('[data-pf="source_file"]').onchange = async e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try{
        const txt = new TextDecoder('utf-8', {fatal: true}).decode(await file.arrayBuffer());
        area.value = txt;
        pultNote();
        toast(`Файл прочитан: ${txt.length} знаков — проверьте и нажмите «Сделать»`, 'ok');
      }catch(readErr){
        toast(`Файл «${file.name}» не в UTF-8 — пересохраните его в этой кодировке. `
              + 'Денег не потрачено: файл никуда не уходил.');
      }finally{ e.target.value = ''; }
    };
  }
  const pultReport = (out, title) => {
    const box = batch.querySelector('#pultres');
    box.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${esc(title)}:
        что уехало</div>
      <div class="muted" style="font-size:12px">поставлено: ${out.ordered || 0} ·
        пропущено: ${out.skipped || 0} · с ошибкой: ${out.failed || 0}</div>
      ${pultBatchRows(out)}`;
  };
  batch.querySelectorAll('button.pgo').forEach(b => b.onclick = async () => {
    const kind = b.dataset.pult;
    const cardDef = batchPult[kind] || {};
    const title = cardDef.title || kind;
    const ids = picks();
    if (!ids.length) return;
    const body = pultValues(kind);
    const stop = pultRefusal(kind, body, ids.length);
    if (stop){ toast(stop); return; }
    b.disabled = true;
    let dry;
    try{
      dry = await post(cardDef.post, Object.assign({}, body, {pids: ids, dry_run: true}));
    }catch(e){
      // Сессия истекла — это не отказ по проекту, а «войдите снова» (как у «Сделать всё»).
      if (e instanceof NeedLogin){ ME = null; return viewLogin(''); }
      // Сюда приходят и отказы про сам список (слишком много отмечено), поэтому
      // подсказка говорит и про галочки, и про поля.
      toast(`Проверка не прошла: ${e.message}. Денег не потрачено — ничего не заказано. `
            + 'Поправьте отмеченное или поля карточки и нажмите «Сделать» ещё раз.');
      return;
    }finally{ b.disabled = false; }
    const head = `<div class="note muted" style="margin:0 0 8px">Это проверка: ничего
        не заказано и не оплачено, в сеть за деньгами не ходили.</div>
      <div>Уйдёт в работу: <b>${dry.planned || 0}</b> из ${ids.length} ·
        пропущено: ${dry.skipped || 0}${dry.failed ? ` · с ошибкой: ${dry.failed}` : ''}${
        dry.replaced ? ` · получат не свой источник: ${dry.replaced}` : ''}</div>`;
    modal(`${title}: проверка перед заказом`, head + pultBatchRows(dry),
      {ok: dry.planned ? `Заказать: ${dry.planned}` : 'Закрыть',
       onOk: async (mb, close) => {
         if (!dry.planned){ close(); return; }
         let out;
         try{
           out = await post(cardDef.post,
                            Object.assign({}, body, {pids: ids, dry_run: false}));
         }catch(e){
           // Обрыв ПОСЛЕ начала заказа неоднозначен: часть пачки могла уже уехать и
           // быть оплачена. Поэтому не «повторите», а «посмотрите и не нажимайте».
           throw new Error(`${e.message}. Часть пачки могла уже уехать — посмотрите `
                           + `задачи на экране «${title}» и не нажимайте второй раз.`);
         }
         close();
         pultReport(out, title);
         toast(`поставлено: ${out.ordered || 0}, пропущено: ${out.skipped || 0}`
               + (out.failed ? `, с ошибкой: ${out.failed}` : ''),
               out.ordered ? 'ok' : 'bad');
         // Экран НЕ перерисовываем, в отличие от кабинетных кнопок: заказ ушёл
         // соседнему сервису, в таблице проектов от него сейчас ничего не изменится,
         // а отчёт по пачке — единственное место, где видно, за что заплачено.
       }});
  });
  // Варианты полей подтягиваются в фоне: пустая карточка уже рабочая.
  if (PULT_ORDER.length) pultBatchFill(batch).catch(e => console.warn(e));

  goBtn.onclick = async () => {
    const ids = picks();
    if (!ids.length) return;
    goBtn.disabled = true;
    // Один запрос на весь пакет (18.09.2026): раньше пульт слал по одному на проект —
    // двадцать отмеченных означали двадцать последовательных походов в кабинет.
    try{
      const out = await post('/ui/projects/batch/pipeline', {pids: ids});
      // Здесь окно вместо тоста: у «Сделать всё» объяснять надо не только числа, но и
      // границу — чего эта кнопка не делает и какой кнопкой это заказывают.
      // На карточки соседей показываем, только если они на экране есть: на старом
      // сервере (`/ui/projects/batch/fields` без `pult`) их не рисуют, и посылать
      // человека к несуществующей кнопке хуже, чем не посылать никуда.
      pipelineReport(out, ids.length, PULT_ORDER.length
        ? 'Карточки «Текст» и «Обложка» — в этой же панели, над кнопкой.' : '');
    }catch(e){
      // Сессия истекла посреди пакета — это не «причина отказа» проекта, а «войдите
      // снова»: тот же уход на экран входа, что и в render() при обычной навигации.
      if (e instanceof NeedLogin){ ME = null; return viewLogin(''); }
      toast(e.message);
    }finally{ goBtn.disabled = false; }
    setTimeout(() => viewProjects(), 1200);
  };

  app.append(card);
}

// Проект по составляющим. Раньше всё лежало одной лентой: запуск, задачи, кадры,
// озвучка, ролик, субтитры — и чтобы посмотреть обложку, надо было проскроллить сто
// картинок. Вкладка на каждую составляющую: у них разные вопросы и разные кнопки.
// Батч C (экран проекта): шесть вкладок вместо старых «Обзор/Текст/Кадры/Клипы/
// Сборка/Обложка» + отдельной «Настройки». Настройки этапа теперь живут ВНУТРИ

const PART_TABS = new Set(['tts', 'video']);

// Склонение руками: «2 части/ей» — не по-русски, а неряшливый текст в интерфейсе
// читается как неряшливая работа под ним.
function plural(n, one, few, many){
  const t = n % 10, h = n % 100;
  if (t === 1 && h !== 11) return one;
  if (t >= 2 && t <= 4 && (h < 12 || h > 14)) return few;
  return many;
}
function partsWord(n){ return plural(n, 'часть', 'части', 'частей'); }

// Выбор языков одной строкой (жалоба владельца 21.09.2026 «перегружен»): сорок с лишним
// языков висели стеной галочек на каждой вкладке заказа, и сам заказ уезжал под неё.
// Теперь — кнопка с итогом выбора, а список с поиском раскрывается по нажатию. Сами
// галочки и их обработчики не меняются: список переезжает внутрь целиком, как есть.
function langPicker(box){
  if (!box || box.closest('.lpick')) return null;
  const wrap = document.createElement('div');
  wrap.className = 'lpick';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'ghost small lpick-btn';
  btn.setAttribute('aria-expanded', 'false');
  const pop = document.createElement('div');
  pop.className = 'lpick-pop';
  pop.hidden = true;
  const q = document.createElement('input');
  q.className = 'lpick-q';
  q.placeholder = 'найти язык';
  box.replaceWith(wrap);
  pop.append(q, box);
  wrap.append(btn, pop);
  const paint = () => {
    const on = [...box.querySelectorAll('label')]
      .filter(l => { const i = l.querySelector('input'); return i && i.checked; })
      .map(l => l.textContent.trim());
    btn.textContent = !on.length ? 'выбрать языки'
      : on.length <= 3 ? on.join(', ') : `${on.slice(0, 3).join(', ')} +${on.length - 3}`;
  };
  box.addEventListener('change', paint);
  btn.onclick = () => {
    pop.hidden = !pop.hidden;
    btn.setAttribute('aria-expanded', String(!pop.hidden));
    if (!pop.hidden) q.focus();
  };
  // Скрываем стилем, а не атрибутом: у чипа свой display, и он сильнее [hidden].
  q.oninput = () => {
    const v = q.value.trim().toLowerCase();
    box.querySelectorAll('label').forEach(l => {
      l.style.display = (!v || l.textContent.toLowerCase().includes(v)) ? '' : 'none';
    });
  };
  paint();
  return wrap;
}
