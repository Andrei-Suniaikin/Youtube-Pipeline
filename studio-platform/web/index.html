/* ─────────────────────────── редактор пресета ─────────────────────────── */

// Дыра, которую закрывает эта функция: убрать модель из выпадающего списка (2.2, 3.1)
// не значит стереть её из движка (правило 2 ТЗ). Но `<select>` без "selected" ни на
// одном варианте браузер рисует так, будто выбран первый пункт — «как по умолчанию» —
// и следующее сохранение формы молча заменило бы GROK или grok пустой строкой,
// хотя движок их прекрасно принимает. Лишний вариант с самим сохранённым значением
// не даёт этому случиться, пока человек не выберет что-то из предложенного явно.
function selectOptionsHtml(f){
  const known = (f.options || []).some(o => String(o.value) === String(f.value));
  const stray = (f.value && !known)
    ? `<option value="${esc(f.value)}" selected>${esc(f.value)} — нет в списке, но сохранено</option>`
    : '';
  return `<option value="">— как по умолчанию —</option>${stray}${
    (f.options || []).map(o => `<option value="${esc(o.value)}"${
      String(f.value) === String(o.value) ? ' selected' : ''
    }>${esc(o.title)}</option>`).join('')}`;
}

// Строка «переключатель источника группы» (батч «Пресеты целые и частичные»): только
// у групп, которые пришли из редактора ЦЕЛОГО пресета (`g.part` есть и вызывающая
// сторона передала `onLinkChange` — у формы настроек проекта и у редактора частичного
// пресета этого нет, и переключателя там не будет). «Свои поля / Из частичного
// пресета» — ровно та формулировка, которую требует раздел 4 спецификации.
function linkBarHtml(g){
  const locked = !!g.readonly;
  const options = g.link_options || [];
  const attempted = g.link_id != null;
  const linkOn = locked || attempted;
  return `<div class="secbody" style="display:flex;flex-wrap:wrap;
      gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px">
    <div class="modes" data-linkmodes="${esc(g.part)}" style="margin:0">
      <button type="button" data-src="own" data-hadlink="${attempted ? '1' : ''}"
        class="${linkOn ? '' : 'on'}">Свои поля</button>
      <button type="button" data-src="link"
        class="${linkOn ? 'on' : ''}">Из частичного пресета</button>
    </div>
    <select class="link-pick" data-part="${esc(g.part)}"${linkOn ? '' : ' hidden'}>
      <option value="">— выбрать частичный —</option>
      ${options.map(o => `<option value="${o.id}"${
        g.link_id === o.id ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}
    </select>
    ${!options.length
      ? '<span class="note muted">Частичных пресетов этой части нет — сначала заведите один.</span>'
      : ''}
    ${locked
      ? `<span class="note muted">Поля только для чтения — из пресета «${esc(g.link_name)}».
           <a href="#/preset/${g.link_id}">Править его →</a></span>`
      : ''}
  </div>${g.link_problem
    ? `<div class="err" style="margin:14px 18px 0">${esc(g.link_problem)}</div>` : ''}`;
}

// Форма настроек. Одна и та же для пресета и для проекта: это один набор полей —
// пресет лишь заготовка, проект — его копия в момент заведения. Описание приходит с
// сервера (server/preset_fields.py), здесь только отрисовка.
// `groups.onLinkChange(part, presetIdOrNull)` — колбэк переключателя ссылки (только у
// редактора целого пресета, вызывающая сторона вешает его на сам массив `groups`
// перед вызовом). Не второй параметр функции: `tests/test_channel_settings_layout.py`
// (батч A) ищет `fieldForm()` по буквальной сигнатуре `function fieldForm(groups){` —
// менять её незачем, у вызова и так есть один объект, на который можно повесить
// необязательное поле.
function fieldForm(groups){
  const onLinkChange = groups.onLinkChange;
  const form = $(`<form></form>`);
  for (const g of groups){
    const locked = !!g.readonly;
    const linkBar = (g.part && onLinkChange) ? linkBarHtml(g) : '';
    const card = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">${esc(g.title)}</div>
      ${linkBar}
      <div class="fields">${g.fields.map(f => {
        const id = 'f-' + f.key;
        // Поле, отменённое другой настройкой, не прячем и не отключаем: readOnly
        // оставляет значение в форме (disabled-поля не отправляются, и сохранение
        // стёрло бы их), а причина написана рядом — правило 2 ТЗ. Группа, у которой
        // ссылка на частичный пресет реально сработала (`locked`), — другой случай:
        // поле принадлежит не этому пресету, и его нельзя отправлять вовсе (сервер
        // такую попытку отвергает), поэтому здесь именно `disabled`, а не `readonly`.
        const off = f.off ? ' readonly title="' + esc(f.off) + '"' : '';
        const body = f.kind === 'langmap'
          // Строки собираются в JS после вставки в DOM (wireLangMap): им нужен список
          // языков поля и значение соседнего поля «Движок» из этой же группы. Хранит
          // итог тот же скрытый input с data-key — form.read() не меняется вообще.
          ? `<div class="langmap" id="${id}-box">
               <input type="hidden" id="${id}" data-key="${esc(f.key)}" value="${esc(f.value)}"${
                 locked ? ' disabled' : ''}>
               <div class="langmap-rows"></div>
               <button type="button" class="ghost small langmap-add"${
                 locked ? ' disabled' : ''}>+ строка</button>
             </div>`
          : f.kind === 'select'
          ? `<select id="${id}" data-key="${esc(f.key)}"${(f.off || locked) ? ' disabled' : ''}>
               ${selectOptionsHtml(f)}</select>`
          : f.kind === 'switch'
          ? `<select id="${id}" data-key="${esc(f.key)}"${(f.off || locked) ? ' disabled' : ''}>
               <option value=""${f.value === '' ? ' selected' : ''}>— как по умолчанию —</option>
               <option value="1"${['1','true','on','да'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>включено</option>
               <option value="0"${['0','false','off','нет'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>выключено</option>
             </select>`
          : `<input id="${id}" data-key="${esc(f.key)}" value="${esc(f.value)}"
                 placeholder="${esc(f.placeholder)}"${off}${locked ? ' disabled' : ''}>`;
        // Подпись у langmap ведёт на видимый блок строк (`-box`), а не на скрытый
        // input с самим значением — клик по подписи на скрытом поле не делал ничего,
        // это была подпись в никуда.
        return `<div class="fld"${f.kind === 'langmap' ? ' style="grid-column:1/-1"' : ''}>
          <label for="${f.kind === 'langmap' ? id + '-box' : id}">${esc(f.label)}</label>
          ${body}
          ${f.off ? `<div class="note bad">${esc(f.off)}</div>`
                  : (f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : '')}
        </div>`;
      }).join('')}</div></div>`);
    form.append(card);
    g.fields.filter(f => f.kind === 'langmap').forEach(f => wireLangMap(card, f, g, locked));
  }
  // Переключатель источника группы — только когда его нарисовали (см. linkBarHtml).
  // Клик по «Свои поля» шлёт запрос на снятие ссылки, только если она реально
  // стояла (`data-hadlink`) — иначе это просто переключение вида без записи. Клик
  // по «Из частичного пресета» без выбора конкретного варианта ничего не пишет,
  // только открывает список — запись идёт из onchange самого списка.
  if (onLinkChange){
    form.querySelectorAll('[data-linkmodes]').forEach(bar => {
      const part = bar.dataset.linkmodes;
      const select = bar.parentElement.querySelector('.link-pick');
      const ownBtn = bar.querySelector('[data-src="own"]');
      const linkBtn = bar.querySelector('[data-src="link"]');
      ownBtn.onclick = () => {
        bar.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        ownBtn.classList.add('on');
        if (select) select.hidden = true;
        if (ownBtn.dataset.hadlink) onLinkChange(part, null);
      };
      linkBtn.onclick = () => {
        bar.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        linkBtn.classList.add('on');
        if (select) select.hidden = false;
      };
    });
    form.querySelectorAll('.link-pick').forEach(sel => {
      sel.onchange = () => onLinkChange(sel.dataset.part,
                                        sel.value ? Number(sel.value) : null);
    });
  }
  // Отключённые поля браузер не отправил бы сам; мы их и не читаем — значение
  // останется таким, каким было, а не обнулится молча. Той же дорогой уходят и
  // поля заблокированной ссылкой группы (`disabled` выше) — их и не должно быть
  // среди того, что уезжает на сохранение.
  form.read = () => {
    const values = {};
    form.querySelectorAll('[data-key]').forEach(el => {
      if (!el.disabled) values[el.dataset.key] = el.value;
    });
    return values;
  };
  return form;
}

// «ru: id, en: id2» → [[ "ru","id" ], [ "en","id2" ]] — зеркало preset_fields.parse_voice_map
// в браузере. Только для отрисовки строк; на сервер уезжает та же строка, собранная
// функцией sync() внутри wireLangMap(), и разбирает её по-прежнему сама функция кабинета.
function parseVoiceMapRows(raw){
  const out = [];
  String(raw || '').replace(/\n/g, ',').split(',').forEach(chunk => {
    const i = chunk.indexOf(':');
    if (i < 0) return;
    const lang = chunk.slice(0, i).trim().toLowerCase();
    const voice = chunk.slice(i + 1).trim();
    if (lang && voice) out.push([lang, voice]);
  });
  return out;
}

// Собрать виджет «голоса по языкам»: строка = язык из выпадающего списка + текстовое
// поле идентификатора + крестик. Движок и формат хранения не меняются — это только
// удобная отрисовка одной и той же строки настроек.
function wireLangMap(card, f, group, locked){
  const hidden = card.querySelector('#f-' + f.key);
  const box = card.querySelector('#f-' + f.key + '-box');
  const rows = box.querySelector('.langmap-rows');
  const langs = f.options || [];
  // Случай Lumean (ТЗ, батч 16.09.2026): у него идентификатор строки — id пресета
  // Lumean (template_id), а не голос. Подпись поля, подсказка и подсказка в строках
  // переключаются СРАЗУ при смене «Движка» в этой же группе (решение владельца
  // 17.09.2026), без сохранения: оба варианта текста прислал сервер в `f.by_engine`.
  const engineField = (group.fields || []).find(x => x.key === 'engine');
  const engineSelect = card.querySelector('#f-engine');
  const lumeanNow = () => String(engineSelect ? engineSelect.value
    : (engineField ? engineField.value : '') || '').toLowerCase() === 'lumean';
  let idPlaceholder = lumeanNow() ? 'id пресета Lumean (template_id)' : 'id голоса';
  const fld = box.closest('.fld');
  const applyEngine = () => {
    const lum = lumeanNow();
    idPlaceholder = lum ? 'id пресета Lumean (template_id)' : 'id голоса';
    rows.querySelectorAll('.lm-voice').forEach(i => { i.placeholder = idPlaceholder; });
    // Кнопка проверки шаблона нужна только у Lumean: у остальных движков проверять
    // нечего — там обычный id голоса, а не ссылка на чужой шаблон.
    rows.querySelectorAll('.lm-check').forEach(b => { b.hidden = !lum; });
    const texts = (f.by_engine || {})[lum ? 'lumean' : 'other'];
    if (!texts || !fld) return;
    const label = fld.querySelector('label');
    if (label) label.textContent = texts.label;
    const hint = fld.querySelector('.note.muted');
    if (hint) hint.textContent = texts.hint;
  };
  if (engineSelect) engineSelect.addEventListener('change', applyEngine);

  // Тот же приём, что и у selectOptionsHtml() выше, доведённый до строк карты: язык,
  // введённый до появления этого выпадающего списка (диалектный код вида `pt-br`,
  // или код, которого не стало после правки `_LANG_NAMES`), не входит
  // в `langs` — без отдельного пункта браузер выбрал бы первый вариант «— язык —», и
  // sync() ниже отправил бы строку с пустым языком, то есть выбросил бы её. Отдельный
  // выбранный пункт с пометкой сохраняет код ровно так же, как для моделей и методов.
  const langOptionsHtml = cur => {
    const known = langs.some(o => String(o.value) === cur);
    const stray = (cur && !known)
      ? `<option value="${esc(cur)}" selected>${esc(cur)} — нет в списке, но сохранено</option>`
      : '';
    return `<option value="">— язык —</option>${stray}${langs.map(o =>
      `<option value="${esc(o.value)}"${String(o.value) === cur ? ' selected' : ''}>${
        esc(o.title)}</option>`).join('')}`;
  };

  const sync = () => {
    const parts = [];
    rows.querySelectorAll('.langmap-row').forEach(r => {
      const lang = r.querySelector('.lm-lang').value.trim();
      const voice = r.querySelector('.lm-voice').value.trim();
      if (lang && voice) parts.push(`${lang}: ${voice}`);
    });
    hidden.value = parts.join(', ');
  };

  const addRow = (lang, voice) => {
    const wrap = $(`<div class="langmap-row" style="display:flex;gap:8px;margin-bottom:6px">
      <select class="lm-lang" style="width:180px;flex:0 0 auto"${locked ? ' disabled' : ''}
        >${langOptionsHtml(lang || '')}</select>
      <input class="lm-voice" style="flex:1;width:auto;min-width:0"${locked ? ' disabled' : ''}
             placeholder="${esc(idPlaceholder)}" value="${esc(voice || '')}">
      ${locked ? '' : `<button type="button" class="ghost small lm-check"
        title="проверить шаблон у Lumean, не платя"${lumeanNow() ? '' : ' hidden'}
        >проверить</button>`}
      <button type="button" class="ghost small lm-del" title="убрать строку"${
        locked ? ' disabled' : ''}>×</button>
    </div>`);
    // Группа закрыта ссылкой на частичный пресет (`locked`) — строки только для
    // чтения: без обработчиков менять и удалять их нельзя, а сама карта в форму
    // не уходит вовсе (скрытый input тоже `disabled`, см. вызывающий код).
    if (!locked){
      wrap.querySelector('.lm-lang').onchange = sync;
      wrap.querySelector('.lm-voice').oninput = sync;
      wrap.querySelector('.lm-del').onclick = () => { wrap.remove(); sync(); };
      // Проверка шаблона Lumean до оплаты (18.09.2026): id вписывают вслепую, и ошибка
      // вскрывалась платным заказом — теперь видно, что за шаблоном стоит.
      const chk = wrap.querySelector('.lm-check');
      if (chk) chk.onclick = async () => {
        const id = wrap.querySelector('.lm-voice').value.trim();
        if (!id){ toast('Сначала впишите id шаблона'); return; }
        chk.disabled = true;
        try{
          const out = await api(`/ui/lumean/template?id=${encodeURIComponent(id)}`);
          if (!out.ok) toast(out.why || 'шаблон не прочитался');
          else toast(`${out.name || id}: сервис ${out.service || '—'}${
            out.language ? ', язык ' + out.language : ''}${
            out.model ? ', модель ' + out.model : ''}`, 'ok');
        }catch(e){ toast(e.message); }
        finally{ chk.disabled = false; }
      };
    }
    rows.append(wrap);
  };

  parseVoiceMapRows(f.value).forEach(([lang, voice]) => addRow(lang, voice));
  if (!locked) box.querySelector('.langmap-add').onclick = () => addRow('', '');
  sync();
}

// `onCancel` — необязательный (review-feedback-F4 цикл 1, Issue 8): форма настроек
// этапа внутри вкладки проекта не отдельная страница, идти «Отмене» некуда — ссылка
// на текущий же hash ничего не делала. Если onCancel передан, «Отмена» — кнопка,
// которая откатывает форму на месте, а сохранение не уходит с экрана. Без onCancel
// поведение прежнее: ссылка на `back` (страница пресета и т.п.).
function saveBar(back, onSave, onCancel){
  const cancelHtml = onCancel
    ? `<button type="button" id="cancel" class="ghost">Отмена</button>`
    : `<a class="ghost" href="${back}" style="color:var(--muted)">Отмена</a>`;
  const bar = $(`<div style="display:flex;gap:10px;align-items:center">
    <button id="save">Сохранить</button>${cancelHtml}</div>`);
  const b = bar.querySelector('#save');
  b.onclick = async () => {
    b.disabled = true;
    try{
      await onSave();
      toast('Сохранено', 'ok');
      if (!onCancel) location.hash = back;
    }catch(e){ toast(e.message); b.disabled = false; }
  };
  if (onCancel) bar.querySelector('#cancel').onclick = onCancel;
  return bar;
}

// Заведение пресета — своя страница, а не браузерный попап: имя видно рядом с тем,
// куда попадёшь, и опечатку можно исправить, не начиная заново.
const PRESET_SLUG = {'Озвучка': 'ozvuchka', 'Картинки': 'kadry', 'Клипы': 'klipy',
                     'Сборка': 'sborka', 'Сценарий': 'stsenariy', 'Обложка': 'oblozhka'};

// Части пресета (батч «Пресеты целые и частичные») — тот же порядок и те же подписи,
// что и `server/preset_fields.py:PARTS`. Список один, чтобы выбор типа при заведении
// пресета и разбивка списка на «Целые/Частичные» не разошлись в названиях.
// С 18.09.2026 «Сценарий» и «Обложка» — разные части.
const PART_TITLES = [['voice', 'Озвучка'], ['images', 'Картинки'], ['clips', 'Клипы'],
                     ['render', 'Сборка'], ['text', 'Сценарий'], ['cover', 'Обложка']];

// Фильтр списка пресетов: живёт между заходами на экран, у каждого зрителя свой.
const PRESET_FILTER_TYPES = [['all', 'Все'], ['full', 'Целые'], ['partial', 'Частичные'],
                             ...PART_TITLES];
const presetFilter = (() => {
  const dflt = {q: '', type: 'all'};
  try{
    const v = JSON.parse(localStorage.getItem('presetFilter') || 'null');
    if (v && typeof v.q === 'string' && PRESET_FILTER_TYPES.some(([c]) => c === v.type)) return v;
  }catch(e){}
  return dflt;
})();

// «Кто бежит» (батч «Пресеты целые и частичные»): каналы и проекты — всегда,
// у частичного ещё целые пресеты, которые на него ссылаются, и каналы через них
// (`users.presets`/`users.via` — только у частичного, см. `preset_links.users_of`).
// Проекты — не больше 20 ссылок и число остальных: список может быть длинным,
// а карточка пресета не резиновая простыня.
function presetUsersHtml(scope, users){
  const linksOr = (arr, path) => arr.length
    ? arr.map(x => `<a href="${path}${x.id}">${esc(x.name)}</a>`).join(', ')
    : '<span class="muted">нет</span>';
  const projects = users.projects || [];
  const shown = projects.slice(0, 20);
  const rest = projects.length - shown.length;
  const projectsHtml = projects.length
    ? shown.map(p => `<a href="#/project/${p.id}">${esc(p.name)}</a>`).join(', ') +
      (rest > 0 ? `, и ещё ${rest}` : '')
    : '<span class="muted">нет</span>';
  const extra = scope === 'full' ? '' : `
      <div class="fld"><label>Целые пресеты, ссылающиеся на этот</label>
        <div class="note">${linksOr(users.presets || [], '#/preset/')}</div></div>
      <div class="fld"><label>Каналы через них</label>
        <div class="note">${linksOr(users.via || [], '#/channel/')}</div></div>`;
  return `<div class="card" style="margin-bottom:16px">
    <div class="sec">Кто бежит</div>
    <div class="fields">
      <div class="fld"><label>Каналы</label>
        <div class="note">${linksOr(users.channels || [], '#/channel/')}</div></div>
      <div class="fld"><label>Проекты</label><div class="note">${projectsHtml}</div></div>
      ${extra}
    </div>
    <div class="secbody"><div class="note muted">Уже поставленные задачи правка не
      меняет — их настройки заморожены в момент запуска. Изменится со следующего
      запуска.</div></div>
  </div>`;
}

async function viewPreset(id){
  const d = await api('/ui/presets/vsgen/' + encodeURIComponent(id));
  // Группы — вкладками, а не одной простынёй: полей три десятка, и «поменять голос»
  // не должно означать прокрутку мимо сборки и обложки. У частичного пресета вкладка
  // ровно одна — своя часть (раздел 4 спецификации: «Редактор частичного. Только
  // вкладка своей части»): у него нет и не может быть ссылок на другие части
  // (правило 4 — ссылок на ссылки нет), показывать остальные группы нечем.
  const slug = t => PRESET_SLUG[t] || 'ostalnoe';
  const groups = d.scope === 'full' ? d.groups
                                     : d.groups.filter(g => g.part === d.scope);
  const tabs = groups.map(g => [slug(g.title), g.title]);
  const cur = location.hash.split('/')[3] || (tabs[0] || ['', ''])[0];
  app.innerHTML = '';
  app.append($(`<a class="back" href="#/presets">← ко всем пресетам</a>
    <h1>${esc(d.name)}</h1>
    <p class="sub">${esc(d.note)}</p>`));
  const name = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Название</div>
    <div class="secbody">
    <input id="p-name" value="${esc(d.name)}" style="width:100%;max-width:420px"></div></div>`);
  app.append(name);
  app.append($(presetUsersHtml(d.scope, d.users || {})));
  // Плашка проблем ссылок на вкладке (раздел 4: «link_problems — красной плашкой на
  // вкладке группы с причиной») — предупреждающий значок на самой вкладке, чтобы
  // проблему было видно, не открывая её, и красный блок внутри вкладки (см. ниже,
  // `linkBarHtml` в `fieldForm`).
  app.append($(`<div class="subtabs">${tabs.map(([k, title]) => {
    const g = groups.find(x => slug(x.title) === k);
    const warn = g && g.link_problem ? ' ⚠' : '';
    return `<a href="#/preset/${encodeURIComponent(id)}/${k}"
        class="${cur === k ? 'on' : ''}">${esc(title)}${warn}</a>`;
  }).join('')}</div>`));
  const shown = groups.filter(g => slug(g.title) === cur);
  const formGroups = shown.length ? shown : groups.slice(0, 1);
  // Переключатель «свои поля / из частичного пресета» — только у целого пресета:
  // у частичного своих ссылок не бывает (правило 4), поэтому колбэк вешаем на массив
  // групп только когда `d.scope === 'full'` — без него `fieldForm()` переключатель
  // не рисует (см. комментарий у самой функции про буквальную сигнатуру).
  if (d.scope === 'full'){
    formGroups.onLinkChange = async (part, presetId) => {
      // `ownBtn`/`linkBtn` в fieldForm переключают вид сразу по клику, до ответа
      // сервера (иначе список частичных не успевал бы открыться до записи). Если
      // запись упала, экран должен вернуться к тому, что реально хранится, а не
      // остаться в оптимистичном виде — иначе переключатель показывает «Свои поля»
      // при фактически стоящей ссылке (ревью цикла 1 фазы 3, Issue 2). `render()`
      // перечитывает пресет и перерисовывает форму в любом случае — и при успехе,
      // и при ошибке, — поэтому визуальное состояние всегда совпадает с сервером.
      try{
        await post(`/ui/presets/vsgen/${encodeURIComponent(id)}/links`,
                   {part, preset_id: presetId});
      }catch(e){
        toast(e.message);
      }
      await render();
    };
  }
  const form = fieldForm(formGroups);
  app.append(form);
  app.append(saveBar('#/presets', () => post(
    '/ui/presets/vsgen/' + encodeURIComponent(id),
    {name: name.querySelector('#p-name').value, values: form.read()})));
}

// Батч C: отдельный экран «Настройки проекта» убран — настройки этапа теперь внутри
// каждой вкладки производства (renderStageTab), той же ручкой `GET/POST
// /ui/projects/{pid}/settings`. Вторая копии формы не заводим.

async function viewPresets(){
  const d = await api('/ui/presets');
  app.innerHTML = '';
  const head = $(`<div class="head">
      <div><h1>Пресеты</h1>
        <p class="sub">Настройки, которыми делаются ролики.</p></div>
      <button id="newpr" class="small">Новый пресет</button>
    </div>`);
  app.append(head);
  head.querySelector('#newpr').onclick = () => { location.hash = '#/preset/new'; };

  if (d.broken.length){
    app.append($(`<div class="card" style="margin-bottom:16px">
      <div class="sec">Ссылки в никуда</div>
      ${d.broken.map(b => `<div class="stage">
        <div class="dot s-error">!</div>
        <div class="body">
          <div class="name">${esc(b.why)}</div>
          <div class="facts">на него ссылаются: ${b.channels.map(ch =>
            `<a href="#/channel/${ch.id}">${esc(ch.name)}</a>`).join(', ')}</div>
          <div class="note muted">Сегодня такой канал узнаёт об этом в момент
            генерации — то есть после того, как встал.</div>
        </div></div>`).join('')}
    </div>`));
  }

  // Один пресет-«стейдж» — общий для всех трёх сервисов; у производства (vsgen)
  // вдобавок строка «кто бежит» счётом (раздел 4 спецификации: «каналы: 3,
  // проекты: 12», у частичного ещё «в пресетах: 2») — счёт берётся из
  // `preset_links.users_of` (фаза 1/2), а не из числа каналов-ссылок ниже:
  // «кто бежит» отвечает и за проекты, которых в первой строке нет вовсе.
  const presetItemHtml = (g, i) => {
    const who = i.users ? [`каналы: ${i.users.channels}`, `проекты: ${i.users.projects}`,
      ...(i.scope !== 'full' ? [`в пресетах: ${i.users.presets}`] : [])].join(', ') : '';
    // Частичный пресет никогда не привязан к каналу напрямую — канал ссылается
    // на целый, а не на частичный. Раньше «в работе» считалось только по прямым
    // каналам (`i.channels`), и частичный, который реально бежит через целый
    // (`_links`), показывался серой точкой и «ни один канал им не пользуется» —
    // ровно то ложное прочтение, от которого предостерегает раздел 4 (ревью
    // цикла 1 фазы 3, Issue 1). Минимальный правдивый признак — `users.presets`:
    // он уже посчитан `preset_links.users_of` и учитывает только ссылки, которые
    // реально разрешились бы (см. фазу 1).
    const viaPresets = i.scope !== 'full' && i.users ? i.users.presets : 0;
    const inUse = i.channels.length > 0 || viaPresets > 0;
    return `<div class="stage">
      <div class="dot ${inUse ? 's-done' : 's-idle'}">${inUse ? '✓' : '·'}</div>
      <div class="body">
        <div class="name">${esc(i.name)}</div>
        <div class="facts">${i.facts.map(f => esc(f)).join(' · ') || '—'}</div>
        ${who ? `<div class="note muted">${esc(who)}</div>` : ''}
        <div class="note ${inUse ? 'muted' : ''}">${
          i.channels.length
            ? 'каналы: ' + i.channels.map(ch =>
                `<a href="#/channel/${ch.id}">${esc(ch.name)}</a>`).join(', ')
            : viaPresets > 0
              ? `напрямую каналы не ссылаются — используется через целые пресеты (${viaPresets})`
              : 'ни один канал им не пользуется'}</div>
      </div>
      <div style="white-space:nowrap;align-self:center">
        ${g.service === 'vsgen'
          ? `<button class="ghost pedit" data-key="${esc(i.key)}">Править</button>`
          : `<button class="ghost pform" data-svc="${esc(g.service)}"
               data-name="${esc(i.name)}">Править</button>`}
        <button class="ghost pcopy" data-svc="${esc(g.service)}"
          data-name="${esc(i.name)}">Копия</button>
        <button class="ghost pdel" data-svc="${esc(g.service)}"
          data-name="${esc(i.name)}">Удалить</button>
      </div></div>`;
  };

  // Пресеты производства — «Целые» и «Частичные» отдельно, частичные вдобавок по
  // частям (раздел 4 спецификации): иначе список из трёх десятков строк не отличить,
  // какая настройка целиком отвечает за ролик, а какая — только заготовка озвучки.
  // Фильтр списка (17.09.2026): по названию и по типу. Тип — у пресетов производства
  // (целый / частичный / какая часть); у Rewrite и Cover типа нет, поэтому при
  // выборе типа их карточки скрываются, а не показываются «не подходящими».
  const F = presetFilter;
  const nameOk = i => !F.q || String(i.name || '').toLowerCase().includes(F.q.toLowerCase());
  const typeOk = i => F.type === 'all' || (F.type === 'full' ? i.scope === 'full'
    : F.type === 'partial' ? i.scope !== 'full' : i.scope === F.type);

  const vsgenBodyHtml = items => {
    items = items.filter(i => nameOk(i) && typeOk(i));
    const whole = items.filter(i => i.scope === 'full');
    const partial = items.filter(i => i.scope !== 'full');
    const filtered = F.q || F.type !== 'all';
    let html = '';
    if (!filtered || whole.length){
      html += '<div class="sec">Целые</div>';
      html += whole.length ? whole.map(i => presetItemHtml({service: 'vsgen'}, i)).join('')
                           : '<div class="empty">Целых пресетов нет.</div>';
    }
    if (!filtered || partial.length){
      html += '<div class="sec">Частичные</div>';
      if (!partial.length){
        html += '<div class="empty">Частичных пресетов нет.</div>';
      } else {
        for (const [code, title] of PART_TITLES){
          const arr = partial.filter(i => i.scope === code);
          if (!arr.length) continue;
          html += `<div class="sec" style="border-top:1px solid var(--line);
            font-size:12px;color:var(--muted)">${esc(title)}</div>`;
          html += arr.map(i => presetItemHtml({service: 'vsgen'}, i)).join('');
        }
      }
    }
    return html || '<div class="empty">Под фильтр ничего не подошло.</div>';
  };

  // Пресеты канала (18.09.2026) — отдельная сущность: это не «чем делается ролик», а
  // «как живёт канал»: расписание, машина заливки, ниша. Привязка живая.
  let chp = {presets: [], note: ''};
  try{ chp = await api('/ui/channel-presets'); }catch(e){ toast(e.message); }

  const bar = $(`<div class="card" style="padding:16px 18px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <input id="pf-q" type="search" placeholder="Поиск по названию"
             style="flex:1 1 240px;min-width:0;max-width:360px" value="${esc(F.q)}">
      <div class="modes" style="margin:0">${PRESET_FILTER_TYPES.map(([code, title]) =>
        `<button type="button" data-type="${code}" class="small${F.type === code ? ' on' : ''}"
         >${esc(title)}</button>`).join('')}</div>
    </div></div>`);
  app.append(bar);
  const list = document.createElement('div');
  app.append(list);

  const paint = () => {
    list.innerHTML = '';
    let shown = 0;
    for (const g of d.groups){
      if (g.service !== 'vsgen' && F.type !== 'all') continue;
      const items = g.service === 'vsgen' ? g.items : g.items.filter(nameOk);
      if (g.service !== 'vsgen' && F.q && !items.length && !g.error) continue;
      shown++;
      const card = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">${esc(g.title)}${g.service !== 'vsgen'
        ? ` <button class="ghost small pnew" data-svc="${esc(g.service)}"
              style="float:right;font-weight:400;text-transform:none;letter-spacing:0"
              >Завести</button>` : ''}</div>
      ${g.error
        ? `<div class="stage"><div class="dot s-error">!</div><div class="body">
             <div class="name">Список не получен — ${esc(g.error)}</div>
             <div class="note muted">Пусто здесь означает «не спросили», а не
               «пресетов нет».</div></div></div>`
        : (g.service === 'vsgen' ? vsgenBodyHtml(g.items)
           : (items.length ? items.map(i => presetItemHtml(g, i)).join('')
              : '<div class="empty">Пресетов нет.</div>'))}
      ${g.note ? `<div class="secbody"><div class="note muted">${esc(g.note)}</div></div>` : ''}
    </div>`);
      list.append(card);
      wirePresets(card);
    }
    if (!shown) list.append($(`<div class="card"><div class="empty">Под фильтр ничего не
      подошло.</div></div>`));
  };
  const save = () => { try{ localStorage.setItem('presetFilter', JSON.stringify(F)); }catch(e){} };
  bar.querySelector('#pf-q').oninput = e => { F.q = e.target.value; save(); paint(); };
  bar.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    F.type = b.dataset.type;
    bar.querySelectorAll('[data-type]').forEach(x => x.classList.toggle('on', x === b));
    save(); paint();
  });
  paint();
  // Каналы на пресете видно сразу: правка меняет их поведение со следующего прохода.
  const chpCard = $(`<div class="card">
    <div class="sec">Пресеты каналов
      <button class="ghost small" id="chp-new"
        style="float:right;font-weight:400;text-transform:none;letter-spacing:0"
        >Завести</button></div>
    ${chp.presets.length ? chp.presets.map(p => `<div class="stage" data-chp="${p.id}">
      <div class="dot ${p.channels.length ? 's-done' : 's-idle'}"
        >${p.channels.length ? '✓' : '·'}</div>
      <div class="body">
        <div class="name">${esc(p.name)}</div>
        <div class="facts">${p.given.length ? 'задано: ' + p.given.map(esc).join(', ')
          : 'ничего не задано — каналы работают по своим настройкам'}</div>
        <div class="note ${p.channels.length ? 'muted' : ''}">${p.channels.length
          ? 'каналы: ' + p.channels.map(ch =>
              `<a href="#/channel/${ch.id}">${esc(ch.name)}</a>`).join(', ')
          : 'ни один канал на нём не бежит'}</div>
      </div>
      <div style="white-space:nowrap;align-self:center">
        <button class="ghost chp-edit" data-id="${p.id}">Править</button>
        <button class="ghost chp-del" data-id="${p.id}"
          data-name="${esc(p.name)}">Удалить</button>
      </div></div>`).join('')
      : '<div class="empty">Пресетов каналов нет.</div>'}
    <div class="secbody"><div class="note muted">${esc(chp.note || '')}</div></div>
  </div>`);
  app.append(chpCard);
  chpCard.querySelector('#chp-new').onclick = () => channelPresetModal(null);
  chpCard.querySelectorAll('.chp-edit').forEach(b => b.onclick =
    () => channelPresetModal(Number(b.dataset.id)));
  chpCard.querySelectorAll('.chp-del').forEach(b => b.onclick = () =>
    confirmInline(b, `Удалить «${b.dataset.name}»?`, async () => {
      try{ await api(`/ui/channel-presets/${b.dataset.id}`, {method: 'DELETE'}); await render(); }
      catch(e){ toast(e.message); }
    }));

  app.append($(`<div class="note muted">Быстрее всего новый пресет получается копией
    похожего: «Копия» рядом с ним, потом правка полей. Завести с нуля и править
    настройки — в том сервисе, которому пресет принадлежит: ссылки в заголовках выше.
    Здесь их формы не повторяются намеренно — у обложек полей больше двадцати, и вторая
    копия формы разошлась бы с первой.</div>`));
}

function wirePresets(root){
  const ask = async (b, fn) => {
    b.disabled = true;
    try{ await fn(); await render(); }
    catch(e){
      b.disabled = false;
      const box = document.createElement('div');
      box.className = 'note bad';
      box.textContent = e.message;
      b.parentElement.appendChild(box);
    }
  };
  root.querySelectorAll('button.pedit').forEach(b => b.onclick =
    () => { location.hash = '#/preset/' + encodeURIComponent(b.dataset.key); });
  // Пресеты соседей (обложки, рерайт, брифы) правятся окном, а не уходом в чужой
  // интерфейс: до 18.09.2026 их можно было только скопировать или удалить.
  root.querySelectorAll('button.pform').forEach(b => b.onclick =
    () => neighbourPresetModal(b.dataset.svc, b.dataset.name));
  // Завести пресет обложек, рерайта или бриф — тем же окном, что и правка (18.09.2026).
  // Раньше из пульта их можно было только скопировать: заведение жило в чужом сервисе.
  root.querySelectorAll('button.pnew').forEach(b => b.onclick =
    () => neighbourPresetModal(b.dataset.svc, null));
  root.querySelectorAll('button.pcopy').forEach(b => b.onclick = () => {
    askInline(b, {value: b.dataset.name + ' — копия', ok: 'Скопировать'}, to =>
      ask(b, () => post(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/copy`,
                        {from: b.dataset.name, to})));
  });
  root.querySelectorAll('button.pdel').forEach(b => b.onclick = () => {
    confirmInline(b, `Удалить «${b.dataset.name}»?`, () =>
      ask(b, () => api(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/${
        encodeURIComponent(b.dataset.name)}`, {method: 'DELETE'})));
  });
}

// Окно пресета канала: те же настройки, что у канала, кроме языка. Пустое поле — «в
// пресете не задано», канал берёт своё значение. Привязка живая: правка меняет все
// каналы на этом пресете со следующего прохода очереди.
async function channelPresetModal(id){
  const creating = !id;
  let d = {name: '', note: '', fields: [], channels: [], days: [], any_day: '*'};
  if (!creating){
    try{ d = await api(`/ui/channel-presets/${id}`); }
    catch(e){ toast(e.message); return; }
  }else{
    // Поля для нового берём у пустого набора: тот же список, что и при правке.
    try{
      const probe = await api('/ui/channel-presets');
      d.fields = (probe.presets[0] ? (await api(`/ui/channel-presets/${probe.presets[0].id}`)).fields
                                   : []).map(f => ({...f, value: f.kind === 'days' ? [] : ''}));
    }catch(e){ /* полей нет — заведём по названию, поля добавятся при правке */ }
  }

  const fieldHtml = f => {
    const id_ = 'cp-' + f.key;
    if (f.kind === 'days')
      return `<div class="fld" style="grid-column:1/-1"><label>${esc(f.label)}</label>
        <span class="langs" id="${id_}" style="max-height:none;border:0;padding:0">${
          DAY_ORDER.map(dk => `<label data-day="${dk}" class="${
            (f.value || []).includes(dk) ? 'on' : ''}"><input type="checkbox" ${
            (f.value || []).includes(dk) ? 'checked' : ''}>${DAY_TITLE[dk] || dk}</label>`).join('')
        }</span></div>`;
    if (f.kind === 'number')
      return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
        <input id="${id_}" data-cp="${esc(f.key)}" type="number" min="${f.min}" max="${f.max}"
          value="${esc(String(f.value ?? ''))}" placeholder="как у канала">
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'switch')
      return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
        <select id="${id_}" data-cp="${esc(f.key)}">
          <option value=""${f.value === '' ? ' selected' : ''}>как у канала</option>
          <option value="1"${String(f.value) === '1' ? ' selected' : ''}>включено</option>
          <option value="0"${String(f.value) === '0' ? ' selected' : ''}>выключено</option>
        </select></div>`;
    if (f.kind === 'select')
      return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
        <select id="${id_}" data-cp="${esc(f.key)}">
          <option value="">как у канала</option>
          ${(f.options || []).map(o => `<option value="${esc(String(o.value))}"${
            String(o.value) === String(f.value) ? ' selected' : ''}>${esc(o.title)}</option>`)
            .join('')}</select></div>`;
    return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
      <input id="${id_}" data-cp="${esc(f.key)}" value="${esc(String(f.value ?? ''))}"
        placeholder="как у канала">
      ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
  };

  const used = (d.channels || []).length
    ? `<div class="note muted">Сейчас на нём: ${d.channels.map(ch =>
        esc(ch.name)).join(', ')}. Правка изменит их поведение со следующего прохода
        очереди; уже поставленные задачи не пересчитываются.</div>`
    : '<div class="note muted">Пока на нём не бежит ни один канал.</div>';

  modal(creating ? 'Новый пресет канала' : `Пресет канала «${d.name}»`, `
    <div class="fields" style="padding:0">
      <div class="fld" style="grid-column:1/-1"><label for="cp-name">Название</label>
        <input id="cp-name" value="${esc(d.name || '')}" placeholder="например: немецкие каналы"></div>
      ${(d.fields || []).map(fieldHtml).join('')}
    </div>${used}`,
    {ok: creating ? 'Завести' : 'Сохранить', onOk: async (box, close) => {
      const name = box.querySelector('#cp-name').value.trim();
      if (!name) throw new Error('Название пустое.');
      const values = {};
      box.querySelectorAll('[data-cp]').forEach(el => { values[el.dataset.cp] = el.value; });
      const daysBox = box.querySelector('#cp-schedule_days');
      if (daysBox) values.schedule_days = [...daysBox.querySelectorAll('label')]
        .filter(l => l.querySelector('input').checked).map(l => l.dataset.day);
      if (creating) await post('/ui/channel-presets', {name, values});
      else await post(`/ui/channel-presets/${id}`, {name, values});
      close();
      await render();
    }});
}

// Окно правки пресета соседа. Поля описывает сервер (NEIGHBOUR_PRESET_FIELDS) — здесь
// только отрисовка: второй список полей в браузере разошёлся бы с первым.
async function neighbourPresetModal(service, name){
  const creating = !name;
  let d;
  try{
    d = await api(creating
      ? `/ui/presets/${encodeURIComponent(service)}/new/form`
      : `/ui/presets/${encodeURIComponent(service)}/${encodeURIComponent(name)}/form`);
  }catch(e){ toast(e.message); return; }

  const fieldHtml = f => {
    const id = 'np-' + f.key;
    if (f.kind === 'text')
      return `<div class="fld" style="grid-column:1/-1"><label for="${id}">${esc(f.label)}</label>
        <textarea id="${id}" data-key="${esc(f.key)}" rows="8"
          style="width:100%">${esc(f.value || '')}</textarea>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'number')
      return `<div class="fld"><label for="${id}">${esc(f.label)}</label>
        <input id="${id}" data-key="${esc(f.key)}" type="number" min="${f.min}"
          max="${f.max}" value="${esc(String(f.value ?? ''))}">
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'switch')
      return `<div class="fld"><label for="${id}">${esc(f.label)}</label>
        <select id="${id}" data-key="${esc(f.key)}">
          <option value="1"${f.value ? ' selected' : ''}>включено</option>
          <option value="0"${f.value ? '' : ' selected'}>выключено</option></select>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'select'){
      const known = (f.options || []).some(o => String(o.value) === String(f.value));
      return `<div class="fld"><label for="${id}">${esc(f.label)}</label>
        <select id="${id}" data-key="${esc(f.key)}">
          ${known ? '' : `<option value="${esc(String(f.value || ''))}" selected
            >${esc(String(f.value || '—'))} — нет в списке, но сохранено</option>`}
          ${(f.options || []).map(o => `<option value="${esc(String(o.value))}"${
            String(o.value) === String(f.value) ? ' selected' : ''}>${esc(o.title)}</option>`
          ).join('')}</select>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    }
    if (f.kind === 'file')
      return `<div class="fld" style="grid-column:1/-1"><label>${esc(f.label)}</label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="muted np-refname">${f.value
            ? esc(f.filename || f.value) : 'не прикреплена'}</span>
          <input type="file" id="np-ref" accept="image/*">
        </div>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    return '';
  };

  const nameHtml = creating
    ? `<div class="fld" style="grid-column:1/-1"><label for="np-name">Название</label>
         <input id="np-name" placeholder="как называть пресет"></div>`
    : '';
  const m = modal(creating ? 'Новый пресет' : `Пресет «${name}»`,
    `<div class="fields" style="padding:0">${nameHtml}${d.fields.map(fieldHtml).join('')}</div>`,
    {ok: creating ? 'Завести' : 'Сохранить', onOk: async (box, close) => {
      const values = {};
      box.querySelectorAll('[data-key]').forEach(el => {
        const f = d.fields.find(x => x.key === el.dataset.key) || {};
        values[el.dataset.key] = f.kind === 'number' ? el.value.trim() : el.value;
      });
      const rows = box.querySelector('.np-langrows');
      if (rows){
        values.languages = [...rows.querySelectorAll('.np-lang')].map(r => ({
          code: r.querySelector('.np-code').value.trim(),
          host: r.querySelector('.np-host').value.trim(),
          channel: r.querySelector('.np-ch').value.trim(),
        })).filter(x => x.code);
      }
      if (creating){
        const nm = box.querySelector('#np-name').value.trim();
        if (!nm) throw new Error('Название пустое.');
        await post(`/ui/presets/${encodeURIComponent(service)}/new`, {name: nm, values});
      }else{
        await post(`/ui/presets/${encodeURIComponent(service)}/${
          encodeURIComponent(name)}/form`, {values});
      }
      close();
      await render();
    }});

  // Языковые строки (у рерайта): язык + ведущий + канал.
  const lf = d.fields.find(f => f.kind === 'langrows');
  if (lf){
    const host = $(`<div class="fld" style="grid-column:1/-1">
      <label>${esc(lf.label)}</label><div class="np-langrows"></div>
      <button type="button" class="ghost small np-add">+ строка</button>
      ${lf.hint ? `<div class="note muted">${esc(lf.hint)}</div>` : ''}</div>`)
      .firstElementChild;
    m.body.querySelector('.fields').append(host);
    const rows = host.querySelector('.np-langrows');
    const addRow = v => {
      const r = $(`<div class="np-lang" style="display:flex;gap:8px;margin-bottom:6px">
        <input class="np-code" placeholder="язык, напр. pl" style="width:130px"
          value="${esc((v || {}).code || '')}">
        <input class="np-host" placeholder="имя ведущего" style="flex:1;min-width:0"
          value="${esc((v || {}).host || '')}">
        <input class="np-ch" placeholder="название канала" style="flex:1;min-width:0"
          value="${esc((v || {}).channel || '')}">
        <button type="button" class="ghost small np-del" title="убрать строку">×</button>
      </div>`).firstElementChild;
      r.querySelector('.np-del').onclick = () => r.remove();
      rows.append(r);
    };
    (lf.value || []).forEach(addRow);
    host.querySelector('.np-add').onclick = () => addRow(null);
  }

  // Картинка-образец уходит сразу: файл хранит Cover Studio, а не форма.
  const ref = m.body.querySelector('#np-ref');
  if (ref && creating){
    ref.disabled = true;
    ref.title = 'Образец стиля прикрепляется после заведения пресета';
  }
  if (ref && !creating) ref.onchange = async () => {
    const file = ref.files && ref.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    ref.disabled = true;
    try{
      const r = await fetch(API + `/ui/presets/${encodeURIComponent(service)}/${
        encodeURIComponent(name)}/reference`, {method: 'POST', body: fd});
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.detail || ('HTTP ' + r.status));
      m.body.querySelector('.np-refname').textContent = out.filename || out.file_id;
      toast('Образец стиля прикреплён', 'ok');
    }catch(e){ toast(e.message); }
    finally{ ref.disabled = false; ref.value = ''; }
  };
}

/* Вход у человека один на всю платформу: кабинет, пульт, тексты и обложки. Поэтому
   и управление людьми одно — заводить их в трёх местах больше не нужно. */
async function accountsCard(){
  let d;
  try{ d = await api('/ui/accounts'); }

  const card = $(`<div class="card" style="margin-top:16px">

        u.id === d.me ? ' <span class="muted">— это вы</span>' : ''}</div>
        <div class="muted mono" style="font-size:11px">#${u.id}</div></td>

      <td><span class="pill ${u.disabled ? 's-error' : 's-done'}">${
        u.disabled ? 'заблокирован' : 'работает'}</span>
        ${u.has_password ? '' : '<div class="note bad">пароль не задан</div>'}</td>
      <td style="white-space:nowrap">
        <button class="ghost upw" data-id="${u.id}" data-name="${esc(u.name)}"
          >Пароль</button>
        ${u.id === d.me ? '' : `<button class="ghost ublock" data-id="${u.id}"
          data-name="${esc(u.name)}" data-to="${u.disabled ? '0' : '1'}"
          >${u.disabled ? 'Вернуть' : 'Заблокировать'}</button>`}
      </td>
    </tr>`).join('')}</tbody></table>

    <div class="sec" style="border-bottom:0">Завести человека</div>
    <div class="secbody">
    <div id="uerr"></div>
    <div class="fldrow"><label>Логин</label>
      <input id="n-login" style="width:200px" autocomplete="off">
      <label style="min-width:auto">Пароль</label>
      <input id="n-pw" type="password" style="width:200px" autocomplete="new-password">
    </div>
    <div class="fldrow"><label>Роль и квота</label>
      <select id="n-role">${d.roles.map(r =>
        `<option value="${esc(r.key)}">${esc(r.title)}</option>`).join('')}</select>
      <input id="n-quota" placeholder="без лимита" style="width:120px">
      <button id="n-go">Завести</button>
    </div>
    <div class="note muted">${esc(d.note)}. Заводить его в Rewrite и Cover не нужно —
      они узнают человека по этому же входу.</div>
    </div>
  </div>`);

  const err = card.querySelector('#uerr');
  const act = async (fn) => {
    err.innerHTML = '';
    try{ await fn(); await render(); }
    catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };

  card.querySelector('#n-go').onclick = () => act(() => post('/ui/accounts', {
    login: card.querySelector('#n-login').value,
    password: card.querySelector('#n-pw').value,
    role: card.querySelector('#n-role').value,
    quota: card.querySelector('#n-quota').value}));

  card.querySelectorAll('button.ublock').forEach(b => b.onclick = () => {
    const off = b.dataset.to === '1';

    act(() => post(`/ui/accounts/${sel.dataset.id}`, {role: sel.value})));

  card.querySelectorAll('input.uquota').forEach(inp => inp.onchange = () =>
    act(() => post(`/ui/accounts/${inp.dataset.id}`, {quota: inp.value})));

  return card;
}

/* ─────────────────────────── админ: тревоги и диск ─────────────────────────── */

const FATE_TITLE = {keep:'артефакт выпуска — не удаляется', strip:'промежуточное'};
const ACT_TITLE  = {keep:'оставить', strip:'очистить', drop:'удалить целиком'};
const ACT_CLS    = {keep:'s-idle', strip:'s-queued', drop:'s-error'};

const PUB_TITLE = {public:'вышел', unlisted:'только по ссылке',
                   not_public:'ключ не видит', unknown:'ответа нет'};
const PUB_CLS   = {public:'s-done', unlisted:'s-error',
                   not_public:'s-queued', unknown:'s-idle'};

async function viewAdmin(){
  const [a, d, pb] = await Promise.all([api('/ui/alerts'), api('/ui/disk'),
                                        api('/ui/public')]);
  app.innerHTML = '';
  app.append($(`<h1>Админ</h1>
    <p class="sub">Состояние системы: что мешает работе и сколько осталось места.
      <a href="#/limits" style="margin-left:8px">Серверные лимиты →</a></p>`));

  /* ── тревоги ── */
  const t = a.transport;
  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Тревоги в телеграм</div>
    <div class="stage">
      <div class="dot ${t.configured ? 's-done' : 's-error'}">${t.configured ? '✓' : '!'}</div>
      <div class="body">
        <div class="name">${t.configured
          ? 'Телеграм настроен' : 'Телеграм не настроен — тревоги никуда не уходят'}</div>
        <div class="facts">${t.configured
          ? `токен <span class="mono">${esc(t.token)}</span> · чат
             <span class="mono">${esc(t.chat)}</span>`
          : esc(t.how)}</div>
      </div>
    </div>
    ${a.active.length ? a.active.map(x => `<div class="stage">
        <div class="dot s-error">!</div>
        <div class="body">
          <div class="name">${esc(x.title)}</div>
          <div class="facts">${esc(x.text).replace(/\n/g, '<br>')}</div>
          ${x.money ? `<div class="note muted">деньги: ${esc(x.money)}</div>` : ''}
          <div class="note ${x.said_at ? 'muted' : 'bad'}">${x.said_at
            ? `сказано ${when(x.said_at)}${x.times > 1 ? `, раз: ${x.times}` : ''}`
            : 'ещё не сказано'}</div>
        </div></div>`).join('')
      : '<div class="empty">Ни один из десяти поводов не выполнен.</div>'}
    ${a.owed_recovered.length ? `<div class="note">Ждут сообщения «починилось»:
       ${a.owed_recovered.map(o => esc(o.title)).join(', ')}</div>` : ''}
    <div class="sec" style="border-bottom:0">Пороги</div>
    <table><tbody>
      ${a.thresholds.map(th => `<tr><td>${esc(th.what)}</td>
        <td style="text-align:right;width:120px">${dur(th.value)}</td></tr>`).join('')}
      <tr><td>свободного места меньше</td>
        <td style="text-align:right">${a.disk_min_gb} ГБ</td></tr>
    </tbody></table>
  </div>`));

  /* ── диск ── */
  const sp = d.space || {};
  const low = sp.free_gb != null && sp.free_gb < a.disk_min_gb;
  app.append($(`<div class="card">
    <div class="sec">Диск</div>
    <div class="stage">
      <div class="dot ${low ? 's-error' : 's-done'}">${low ? '!' : '✓'}</div>
      <div class="body">
        <div class="name">${sp.error ? 'Место не читается'
          : `Свободно ${sp.free_gb} ГБ из ${(sp.total/1073741824).toFixed(0)} ГБ`}</div>
        <div class="facts mono">${esc(sp.path || sp.error || '')}</div>
      </div>
    </div>
    ${(d.nodes || []).map(n => `<div class="stage">
      <div class="dot ${n.stale ? 's-idle'
        : n.free_gb != null && n.free_gb < a.disk_min_gb ? 's-error' : 's-done'}">${
        n.stale ? '?' : n.free_gb != null && n.free_gb < a.disk_min_gb ? '!' : '✓'}</div>
      <div class="body">
        <div class="name">${esc(n.host)}${
          n.role ? ` · ${n.role === 'render' ? 'рендер' : n.role === 'upload'
            ? 'заливка' : esc(n.role)}` : ''}</div>
        <div class="facts">${n.stale
          ? `молчит ${Math.round(n.age_sec / 60)} мин — сведения устарели`
          : `свободно ${n.free_gb} ГБ${n.total_gb ? ` из ${n.total_gb}` : ''}`}</div>
        ${!n.stale && n.free_gb != null && n.free_gb < a.disk_min_gb
          ? '<div class="note bad">Эта машина чистит за собой после каждой задачи. Если '
            + 'место кончается — значит задачи падают, не доходя до вердикта.</div>' : ''}
      </div></div>`).join('')}
    <div class="stage">
      <div class="dot ${!d.policy_set ? 's-idle' : d.auto ? 's-done' : 's-queued'}">${
        !d.policy_set ? '?' : d.auto ? '✓' : '·'}</div>
      <div class="body">
        <div class="name">${d.policy_set
          ? `Срок хранения: очистка через ${d.policy.strip_after_days ?? '—'} дн.,
             удаление через ${d.policy.drop_after_days ?? '—'} дн.`
          : 'Срок хранения не задан — ничего не удаляется'}</div>
        <div class="facts">${d.policy_set
          ? `${d.source === 'env' ? 'из .env' : 'из базы (запасной путь)'} · проверка раз в
             ${Math.round(d.every_sec / 60)} мин`
          : `задаётся в .env: <span class="mono">${esc(d.env.strip)}</span>,
             <span class="mono">${esc(d.env.drop)}</span>`}</div>
        ${d.policy_set && !d.auto ? `<div class="note">Уборка выключена: система только
           считает, что было бы удалено. Чтобы убирала сама —
           <span class="mono">${esc(d.env.auto)}=1</span> в .env.</div>` : ''}
        ${d.last && d.last.at ? `<div class="note ${d.last.errors && d.last.errors.length
            ? 'bad' : 'muted'}">последний проход ${when(d.last.at)}:
           ${esc(d.last.line || '')}${(d.last.errors || []).length
             ? ` · ошибок: ${d.last.errors.length}` : ''}</div>` : ''}
        <div class="note muted">${esc(d.how)}</div>
      </div>
    </div>
    ${d.projects.length ? `<table><thead><tr>
        <th>Проект</th><th>Объём</th><th>Промежуточное</th><th>Фаза</th>
        <th>Решение</th></tr></thead><tbody>
      ${d.projects.map(r => `<tr>
        <td><div style="font-weight:600">${esc(r.name)}</div>
            <div class="mono muted" style="font-size:11px">${esc(r.pid)}</div></td>
        <td>${size(r.total)}</td>
        <td>${size(r.strippable)}</td>
        <td>${esc(r.phase || '—')}</td>
        <td><span class="pill ${ACT_CLS[r.action]}">${ACT_TITLE[r.action]}</span></td>
      </tr>
      <tr><td colspan="5" style="padding-top:0">
        <div class="note muted">${esc(r.why)}</div>
        ${r.frees && r.paid_calls ? `<div class="note bad">безвозвратно теряются
          ${r.paid_calls} оплаченных вызовов${r.paid_cost
            ? ` на ${r.paid_cost.toFixed(0)} кр.` : ''}</div>` : ''}
        <div class="bar" title="${Object.entries(r.sizes || {})
            .map(([k, v]) => k + ': ' + size(v)).join(', ')}">
          ${Object.entries(r.sizes || {}).map(([k, v]) => `<i style="float:left;width:${
            (100 * v / Math.max(1, r.total)).toFixed(1)}%;background:${
            d.categories.find(c => c.code === k && c.fate === 'keep')
              ? 'var(--ok)' : 'var(--run)'}"></i>`).join('')}
        </div>
      </td></tr>`).join('')}
    </tbody></table>
    <div class="note muted">Синим — промежуточное, которое можно убрать.
      Зелёным — пять артефактов выпуска: они остаются всегда.
      Всего ${size(d.total)}, освободится ${size(d.freeable)}.</div>`
      : '<div class="empty">Проектов на диске нет.</div>'}
  </div>`));

  /* ── вышел ли ролик на самом деле ── */
  app.append($(`<div class="card" style="margin-top:16px">
    <div class="sec">Выход в свет</div>
    <div class="stage">
      <div class="dot ${pb.key_set ? 's-done' : 's-idle'}">${pb.key_set ? '✓' : '?'}</div>
      <div class="body">
        <div class="name">${pb.key_set
          ? `Ключ YouTube Data API задан (${esc(pb.key)})`
          : 'Ключа YouTube Data API нет — выход подтвердить нечем'}</div>
        <div class="facts">подтверждённо вышли: ${pb.confirmed} ·
          стоят в расписании: ${pb.scheduled}</div>
        <div class="note muted">${esc(pb.how)}</div>
      </div>
    </div>
    ${pb.due.length ? `<div class="sec" style="border-bottom:0">Пора спросить</div>
      ${pb.due.map(r => `<div class="stage">
        <div class="dot s-queued">·</div>
        <div class="body">
          <div class="name"><a href="#/release/${encodeURIComponent(r.release_id)}"
            >${esc(r.release_id)}</a> · <span class="mono">${esc(r.video_id)}</span></div>
          <div class="facts">слот прошёл ${r.late_hours} ч назад</div>
        </div></div>`).join('')}`
      : `<div class="note muted">Спрашивать пока некого: слоты прошли меньше
         ${pb.grace_min} мин назад либо всё уже подтверждено.</div>`}
    ${pb.checked.length ? `<div class="sec" style="border-bottom:0">Что ответил YouTube</div>
      ${pb.checked.map(x => `<div class="stage">
        <div class="dot ${PUB_CLS[x.state] || 's-idle'}">${
          x.state === 'public' ? '✓' : x.state === 'unlisted' ? '!' : '·'}</div>
        <div class="body">
          <div class="name">${esc(x.release_id)} — ${PUB_TITLE[x.state] || esc(x.state)}</div>
          <div class="facts">${when(x.at)}${x.privacy ? ' · ' + esc(x.privacy) : ''}</div>
          ${x.error ? `<div class="note muted">${esc(x.error)}</div>` : ''}
          ${x.blocked ? `<div class="note bad">${esc(x.blocked)}</div>` : ''}
        </div></div>`).join('')}` : ''}
    <div class="note muted">${esc(pb.blind_spot)}</div>
  </div>`));

  // Раздел людей появляется только у администратора: обычному он не показывается
  // и не отвечает — проверка стоит на сервере, а не на прятании кнопки.
  const people = await accountsCard();
  if (people) app.append(people);
}

/* ─────────────────────────────── роутер ─────────────────────────────── */

/* Каждая строка: какая вкладка подсвечивается, как узнать свой адрес, что рисовать.
   Раньше это была цепочка if с четырьмя булевыми переменными — при пятой вкладке
   она начала врать о подсветке. */
const ROUTES = [
  ['queue',    h => h === '#/queue',              () => viewQueue()],
  ['channels', h => h.startsWith('#/channel/'),
                                                 h  => viewChannel(h.split('/')[2])],
  ['profile',  h => h === '#/keys',               () => viewKeys()],
  ['projects', h => h === '#/text',               () => viewText()],
  ['projects', h => h === '#/covers',             () => viewCovers()],
  ['projects', h => h === '#/projects',           () => viewProjects()],
  // Отдельного адреса `.../settings` для проекта больше нет (батч C, ФР §4 п.9) —
  // настройки этапа переехали внутрь каждой производственной вкладки.
  ['projects', h => h.startsWith('#/project/'),   h  => viewProject(
                                                          decodeURIComponent(h.split('/')[2]))],
  ['profile',  h => h === '#/limits',             () => viewLimits()],
  ['presets',  h => h === '#/presets',            () => viewPresets()],
  ['presets',  h => h === '#/preset/new',          () => viewPresetNew()],
  ['presets',  h => h.startsWith('#/preset/'),     h  => viewPreset(
                                                          decodeURIComponent(h.split('/')[2]))],
  ['profile',  h => h === '#/admin',              () => viewAdmin()],
  ['channels', h => h.startsWith('#/release/'),   h  => viewRelease(decodeURIComponent(h.slice(10)))],
  ['channels', h => h === '#/new',                () => viewNew()],
  ['channels', h => h === '#/releases',           () => viewReleases()],
  ['profile',  h => h === '#/profile',            () => viewProfile()],
  ['channels', () => true,                        () => viewChannels()],
];

async function render(){
  // Смена адреса — уход со страницы для опроса логов задач проекта (§6): останавливаем
  // все таймеры здесь одним местом, а не по одному в каждом view — иначе переключение
  // на #/text/#/covers/куда угодно из открытого лога проекта оставляло бы его дёргать
  // API вникуда.
  clearAllLogTimers();
  if (!ME){
    try{ ME = await api('/ui/me'); }
    catch(e){ return viewLogin(e instanceof NeedLogin ? '' : e.message); }
  }
  document.querySelector('nav').style.visibility = '';
  showWho();
  const h = location.hash || '#/channels';
  const hit = ROUTES.find(r => r[1](h));
  // Экранов больше, чем вкладок: «Выпуски», «Текст», «Обложки» и «Админ» живут внутри
  // каналов, проектов и профиля. Подсвечиваем ту вкладку, в чей раздел попал маршрут.
  for (const id of ['channels', 'projects', 'queue', 'presets', 'profile'])
    document.getElementById('tab-' + id).classList.toggle('on', hit[0] === id);
  try{ await hit[2](h); }
  catch(e){
    // Сессия могла истечь посреди работы: это не ошибка экрана, а «войдите снова».
    if (e instanceof NeedLogin){ ME = null; return viewLogin(''); }
    fail(e);
  }
}
addEventListener('hashchange', render);
render();
</script>
