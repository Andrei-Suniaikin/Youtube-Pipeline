/* ───── пустое место говорит, чего не хватает (владелец 30.09.2026: «да, делаем») ─────

   Пустой список молчит одинаково в двух совершенно разных случаях: когда заводить ещё
   нечего и когда спросить не удалось. Человек, который видит экран впервые, эти случаи
   не различает и идёт спрашивать — а «заведите первый» поверх неудачной загрузки это
   уже не молчание, а прямая ложь.

   Поэтому пустое место отвечает на три вопроса: почему пусто, что это значит и что
   нажать. Третье — ссылкой прямо туда, где это чинится, а не описанием пути словами.

   Это тот же `.empty`, что был на экранах, а не пятый способ показать пустоту: класс и
   место остаются, меняется только содержимое. `data-empty` стоит здесь для того, чтобы
   «пусто» и «не знаем» различались машинно: иначе проверить, что неудачная загрузка не
   выдана за пустой список, можно только вчитываясь в слова глазами.                  */

function emptyBox(o){
  // Ссылки нет ровно там, где чинится кнопкой в этой же карточке: вторая дорога к той
  // же кнопке — лишний выбор, а не помощь. Тогда действие остаётся словами.
  const act = o.href
    ? `<div class="act"><a href="${esc(o.href)}"${o.id ? ` id="${esc(o.id)}"` : ''}
         >${esc(o.act)} →</a></div>`
    : (o.act ? `<div class="act muted">${esc(o.act)}</div>` : '');
  return `<div class="empty${o.unknown ? ' unknown' : ''}"
    data-empty="${o.unknown ? 'unknown' : 'none'}"><div class="why">${esc(o.why)}</div>
    ${o.means ? `<div class="means muted">${esc(o.means)}</div>` : ''}${act}</div>`;
}

/* «Спросить не удалось» — не пустой список. Отдельная дверь в `emptyBox`, чтобы
   вызывающая сторона не могла случайно предложить «завести первый» поверх отказа:
   заводить поверх незнания нечего, и действие здесь всегда одно — спросить снова. */
function emptyUnknown(what, means, act){
  return emptyBox({unknown: true, why: what, means: means,
                   act: act || 'Обновите страницу — спросим заново.'});
}

/* ───────────── одинаковые причины — одной строкой (30.09.2026) ─────────────

   Когда падает общий ключ или ложится провайдер, экран показывает сорок строк с одной
   и той же причиной. Человек их не читает — он их прокручивает, и вместе с ними
   прокручивает ту единственную, которая про другое. Поэтому одинаковое по СМЫСЛУ
   сворачивается в одну строку с числом, а раскрытие показывает сами строки.

   Одинаковость считается по смыслу, а не по буквам. В причине стоят номера задач,
   время, идентификаторы заказов и маски ключей — по буквам сорок одинаковых отказов
   дали бы сорок групп по одной строке, то есть ровно то, от чего уходили.

   Что НЕ обезличивается — код ответа провайдера (`HTTP 402` против `HTTP 429`): он и
   есть причина, «кончились деньги» и «превышен лимит» — разные беды с разным
   действием. Остальные числа в тексте — обстоятельства одной и той же беды.

   Склеивать разное запрещено: лишняя группа стоит дешевле, чем две непохожие беды под
   одной подписью. Поэтому в ключ группы входит ВЕСЬ текст причины (одинаковое начало
   при разном конце — это две причины), а вызывающая сторона добавляет к нему то, что
   группа рисует одно на всех: сервис, состояние, наличие действия. */

// Что в причине — обстоятельство, а не сама причина. Разбор идёт ОДНИМ проходом слева
// направо: подставленное больше не перечитывается, поэтому «код 402» не превращается
// потом в «код ‹число›». Порядок веток — это приоритет: ссылка раньше кода ответа
// (в «http://…» тоже есть слово http), дата раньше слова с цифрой.
const REASON_NOISE = new RegExp([
  'https?://\\S+',
  '(?<![\\p{L}\\p{N}])(?:http|код|code|status)\\s*[:=]?\\s*\\d{3}(?![\\p{L}\\p{N}])',
  '\\d{4}-\\d{2}-\\d{2}(?:[t ]\\d{2}:\\d{2}(?::\\d{2})?)?',
  '(?<![\\p{L}\\p{N}])\\d{1,2}:\\d{2}(?::\\d{2})?(?![\\p{L}\\p{N}])',
  '(?:[a-z]:\\\\|/)[\\p{L}\\p{N}_-]+(?:[\\\\/.][\\p{L}\\p{N}_-]+)+',
  '[\\p{L}\\p{N}_-]+\\.(?:png|jpe?g|mp3|mp4|wav|json|txt|srt|webm|mov)(?![\\p{L}\\p{N}])',
  '(?<![\\p{L}\\p{N}_-])[\\p{L}\\p{N}_-]*\\p{N}[\\p{L}\\p{N}_-]*(?![\\p{L}\\p{N}_-])',
].join('|'), 'giu');

function reasonKey(text){
  const s = String(text == null ? '' : text).replace(/\s+/g, ' ').trim().toLowerCase();
  if (!s) return '';
  return s.replace(REASON_NOISE, m => {
    if (/^https?:\/\//.test(m)) return '‹ссылка›';
    // Сначала берём число, потом решаем. Раньше здесь стояло `m.match(/\d{3}/)[0]`, и
    // слово вроде «code42» — его ловит последняя ветка «слово с цифрой», а начинается
    // оно на «code» — давало match === null и падение всего экрана очереди. Одна
    // причина странного вида уносила список целиком.
    const код = m.match(/\d{3}/);
    if (код && /^(?:http|код|code|status)/i.test(m)) return 'код' + код[0];
    if (/^\d{4}-\d{2}-\d{2}/.test(m) || /^\d{1,2}:\d{2}/.test(m)) return '‹время›';
    if (/[\\/]/.test(m)) return '‹путь›';
    if (/\./.test(m)) return '‹файл›';
    if (/^\d+$/.test(m)) return '‹число›';
    return '‹имя›';
  // Пунктуация и «ё» — тоже случайность записи: одна и та же причина приходит то с
  // точкой в конце, то в кавычках. Различать по ним значит опять получить группы по одной.
  }).replace(/ё/g, 'е').replace(/[«»"'`()\[\],.;:!?—–-]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

/* Разложить строки на группы по смыслу причины, сохраняя порядок первого появления.

   Группа из одной строки — не группа: она рисуется обычной строкой. Иначе экран
   заставлял бы раскрывать одиночную беду ради одной строки, а одиночная беда — это
   как раз то, что должно быть видно сразу.

   `whyOf` — где в строке лежит причина, `shapeOf` — что ещё группа рисует одно на всех
   (сервис, состояние, действие); строки с разной «формой» в одну группу не идут. */
// Причина остановки словами — её переводит сервер (block_reasons.explain): чья беда
// («Проблема в доноре», «Настройка канала»), что случилось и что делать. Не узнал —
// `block` пуст, и строка показывается как раньше, текстом движка.
function blockNote(r){
  const b = (r && r.block) || {};
  if (!b.kind) return r && r.blocked_reason
    ? `<div class="note bad">${esc(r.blocked_reason)}</div>` : '';
  return `<div class="note" style="color:var(--ink)"><span class="blktag ${esc(b.kind)}"
    >${esc(b.tag)}</span> ${whyTipHtml(b.title, blockTip(r))}</div>`;
}

// Полное объяснение причины — что случилось, что делать и запись движка как есть. Его
// показывает наведение на причину сразу, без захода в выпуск (владелец 09.10.2026).
function blockTip(r, raw){
  const b = (r && r.block) || {};
  const rec = raw != null ? raw : ((r && (r.blocked_reason || r.error)) || '');
  if (!b.kind) return '';
  // Первой строкой — кто чинит (владелец 09.10.2026: «понятно, на чьей это стороне»).
  return (b.who ? `Кто чинит: ${b.who}\n\n` : '')
    + `Что случилось: ${b.what}\n\nЧто делать: ${b.fix}`
    + (rec ? `\n\nЗапись движка: ${rec}` : '');
}
function whyTipHtml(text, tip){
  return tip ? `<span class="whytip" data-hint="${esc(tip)}" tabindex="0"
    >${esc(text)}</span>` : esc(text);
}

// Недосмотр настройки канала, который выпуск не остановил (нет пресета текста — текст
// на умолчаниях): короткая строка в списке и блок на карточке выпуска.
function gapNotes(r){
  return ((r && r.gaps) || []).map(g => `<div class="note" style="color:var(--wait)"
    ><span class="blktag ${esc(g.kind)}">${esc(g.tag)}</span> ${esc(g.title)}</div>`).join('');
}

function gapBoxes(r){
  const ch = encodeURIComponent(r.channel_id == null ? '' : r.channel_id);
  return ((r && r.gaps) || []).map(g => `<div class="blk ${esc(g.kind)} gap">
    <div class="blkhead"><span class="blktag ${esc(g.kind)}">${esc(g.tag)}</span>

  </div>`).join('');

function blockLabel(r){

// Карточка выпуска: объяснение целиком и действие, которое правда лечит. Для донора —
// не «Вернуть в работу» (повтор даст тот же отказ), а «убрать ссылку» и «поставить
// другую»; для канала — дорога в его настройки.
function blockBox(r){
  const b = (r && r.block) || {};
  if (!b.kind) return '';
  const ch = encodeURIComponent(r.channel_id == null ? '' : r.channel_id);
  const acts = [];
  if (b.kind === 'channel'){
    acts.push(`<a href="#/channel/${ch}/nastroyki" id="blk-fix">Открыть настройки канала →</a>`);
  } else if (b.kind === 'donor'){
    if (r.plan_item_id) acts.push(`<button class="ghost" id="blk-drop">Убрать ссылку из плана</button>`);
    acts.push(`<a href="#/channel/${ch}" id="blk-fix">Поставить другой ролик на канал →</a>`);
    if (r.donor_url) acts.push(`<a href="${esc(r.donor_url)}" target="_blank" rel="noopener"
      >Открыть донора на YouTube ↗</a>`);
  }
  if (b.revive && r.status === 'blocked' && !r.hand_confirmed)
    acts.push(`<button class="ghost" id="revive">Вернуть в работу</button>`);
  // Заливку могли сделать руками, пока выпуск стоял на заливке, — отметить это должно быть чем,
  // как и в прежней красной строке (04.10.2026: причины канала и студии теперь тоже
  // объясняются словами, и кнопка не должна была при этом пропасть).
  if (['channel', 'access', 'studio', 'check'].includes(b.kind) && r.status === 'blocked'
      && !r.hand_confirmed && ['upload_pending', 'upload_running'].includes(r.phase))
    acts.push(`<button class="ghost" id="byhand">Подтвердить руками</button>`);
  return `<div class="blk ${esc(b.kind)}" id="blk">
    <div class="blkhead"><span class="blktag ${esc(b.kind)}">${esc(b.tag)}</span> ${esc(b.title)}</div>
    ${b.who ? `<p><b>Кто чинит:</b> ${esc(b.who)}</p>` : ''}
    <p>${esc(b.what)}</p>
    <p><b>Что делать:</b> ${esc(b.fix)}</p>
    ${b.kind === 'cover' ? '<p><a href="#" class="cv-jump">Посмотреть обложку и решить ↓</a></p>' : ''}
    <div class="blkacts">${acts.join('')}</div>
    <p class="muted" style="font-size:12px">Запись движка: ${esc(r.blocked_reason)}</p>
  </div>`;
}

/* Обложка выпуска глазами человека (04.10.2026, владелец: «как мне понять, какие
   обложки не прошли проверку»). Её заказывает движок под ключом студии, во вкладке
   проекта её не видно — показываем здесь: картинку, что сказала сверка, и два решения. */
const COVER_VERDICT = {
  running: 'Обложка ещё рисуется — картинка появится здесь, когда будет готова.',
  unchecked: 'Сверку надписи сделать не успели — подписка Codex не ответила вовремя. '
    + 'Сама картинка нарисована и оплачена. Посмотрите надпись: перевод верный и без ошибок?',
  rejected: 'Сверка не приняла надпись на обложке:',
  nothing: 'Картинки нет: генератор её не отдал.',
  ok: 'Сверка надписи прошла.',
};
async function fillCoverReview(rid, box, onDone){
  let d;
  try { d = await api(`/ui/releases/${encodeURIComponent(rid)}/cover`); }
  catch (e){ box.innerHTML = `<p class="note bad">${esc(e.message)}</p>`; return; }
  if (!d.job){ box.innerHTML = '<p class="muted">Обложку для этого выпуска ещё не заказывали.</p>'; return; }
  if (d.error){ box.innerHTML = `<p class="note bad">${esc(d.error)}</p>`; return; }
  const notes = (d.notes || []).map(n => `<li>${esc(n.replace(/^[^\wА-Яа-яЁё]+/, ''))}</li>`).join('');
  box.innerHTML = `
    ${d.image ? `<a href="${pultUrl(d.image)}" target="_blank" class="cvr-img"><img
      src="${pultUrl(d.image)}" alt="Обложка выпуска"></a>` : ''}
    <div class="cvr-body">
      <p><b>${esc(d.verdict === 'rejected' && !notes
        // Задачу перезапускали — журнал начался заново, и строк сверки в нём нет.
        ? 'Сверка не приняла надпись на обложке; подробностей не сохранилось (задачу '
          + 'перезапускали). Посмотрите надпись сами.'
        : (COVER_VERDICT[d.verdict] || ''))}</b></p>
      ${notes ? `<ul class="cvr-notes">${notes}</ul>` : ''}
      ${d.blocked && d.verdict !== 'running' ? `<div class="blkacts">
        ${d.image ? '<button class="ghost cv-accept">Взять эту обложку</button>' : ''}
        <button class="ghost cv-reorder">Перезаказать — новая обложка, платно</button>
      </div>` : ''}
      <p class="muted" style="font-size:12px">Задача обложки ${esc(d.job)}</p>
    </div>`;
  const acc = box.querySelector('.cv-accept');
  if (acc) acc.onclick = () => confirmInline(acc,
      'Взять эту обложку? Она пойдёт на YouTube как есть — надпись проверили вы.', async () => {
    acc.disabled = true;
    try { await post(`/ui/releases/${encodeURIComponent(rid)}/cover/accept`);
          toast('Обложка взята — выпуск вернулся в работу', 'ok'); onDone && onDone(); }
    catch (e){ acc.disabled = false; toast(e.message); }
  });
  const reo = box.querySelector('.cv-reorder');
  if (reo) reo.onclick = () => confirmInline(reo,
      'Нарисовать обложку заново? Это новая платная задача; эта картинка будет забыта.', async () => {
    reo.disabled = true;
    try { await post(`/ui/releases/${encodeURIComponent(rid)}/cover/reorder`);
          toast('Новая обложка заказана — выпуск вернулся в работу', 'ok'); onDone && onDone(); }
    catch (e){ reo.disabled = false; toast(e.message); }
  });
}

function groupByReason(rows, whyOf, shapeOf, prefix){
  const out = [], seen = new Map();
  (rows || []).forEach(r => {
    const why = String(whyOf(r) || '').trim();
    const sense = reasonKey(why);
    // Без причины — строка сама по себе: молчание не повод считать её такой же, как
    // другое молчание.
    const key = sense ? [shapeOf ? shapeOf(r) : '', sense].join('\u0000') : '';
    const at = key ? seen.get(key) : undefined;
    if (at !== undefined){ out[at].rows.push(r); return; }
    if (key) seen.set(key, out.length);
    out.push({id: (prefix || 'g') + out.length, why, rows: [r]});
  });
  return out;
}

// Заголовок группы: раскрытие, число, причина. Число — не украшение: именно оно
// отвечает на вопрос «это одна беда или сорок».
function groupHeadHtml(g, count, tail){
  const label = 'Показать все — ' + count;
  return `<div class="grphead">
    <button class="iconbtn fold" data-fold="${esc(g.id)}" data-count="${esc(count)}"
            aria-expanded="false" title="${esc(label)}" aria-label="${esc(label)}"
      >${ICON.expand}</button>
    <div><span class="grpsum"><b>${esc(count)}</b> · <span class="why"
      >${whyTipHtml(g.why, g.tip || '')}</span></span>${tail || ''}</div>
  </div>`;
}

function wireReasonFolds(root){
  root.querySelectorAll('button.fold[data-fold]').forEach(b => {
    b.onclick = ev => {
      // Строка выпуска сама по себе кликабельна (ведёт в выпуск) — раскрытие группы
      // не должно заодно уводить с экрана.
      ev.stopPropagation();
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
      b.classList.toggle('open', open);
      const label = (open ? 'Свернуть — ' : 'Показать все — ') + b.dataset.count;
      b.title = label;
      b.setAttribute('aria-label', label);
      root.querySelectorAll(`tr[data-of="${b.dataset.fold}"]`)
          .forEach(tr => { tr.hidden = !open; });
    };
  });
}

let FILTERS = {channel:'', phase:'', status:''};

async function viewReleases(){
  const q = new URLSearchParams(Object.entries(FILTERS).filter(([,v]) => v)).toString();
  const [data, chs] = await Promise.all([
    api('/ui/releases' + (q ? '?' + q : '')),
    api('/ui/channels'),
  ]);

  app.innerHTML = '';
  app.append($(`<h1>Выпуски ${hintDot(
    'Выпуск — ролик в расписании канала: путь от донорской ссылки до подтверждённой '
    + 'публикации. Производство самого ролика (текст, озвучка, кадры, сборка) — его '
    + 'проект во вкладке «Проекты»; там же проекты, заведённые руками, без канала.')}</h1>`));
  const att = await attention();
  if (att.blocked) app.append($(`<div class="attnbar" id="rel-attn"><b>! В разборе ${
    att.blocked}</b>${att.blocked_sides.map(s => `<span><span class="blktag ${esc(s.kind)}"
    >${esc(s.tag)}</span>${s.who ? whyTipHtml(String(s.count), 'Кто чинит: ' + s.who)
      : s.count}</span>`).join('')}</div>`));

  const bar = $(`<div class="toolbar">
    <select id="f-ch"><option value="">все каналы</option>${
      chs.channels.map(c => `<option value="${c.id}" ${FILTERS.channel==String(c.id)?'selected':''}
        >${esc(c.name)}</option>`).join('')}</select>
    <select id="f-ph"><option value="">любая фаза</option>${
      data.phases.map(p => `<option value="${p.key}" ${FILTERS.phase==p.key?'selected':''}
        >${esc(p.title)}</option>`).join('')}</select>
    <select id="f-st"><option value="">любой статус</option>
      <option value="pending" ${FILTERS.status=='pending'?'selected':''}>ожидает</option>
      <option value="running" ${FILTERS.status=='running'?'selected':''}>в работе</option>
      <option value="done" ${FILTERS.status=='done'?'selected':''}>готово</option>
      <option value="blocked" ${FILTERS.status=='blocked'?'selected':''}>остановлен</option>
    </select>
    <span style="flex:1"></span>
    <button id="new">Новый выпуск по ссылке</button>
  </div>`);
  app.append(bar);
  bar.querySelector('#new').onclick = () => location.hash = '#/new';
  const bind = (id, key) => bar.querySelector(id).onchange = e => {
    FILTERS[key] = e.target.value; render();
  };
  bind('#f-ch','channel'); bind('#f-ph','phase'); bind('#f-st','status');

  if (!data.releases.length){
    // «Ни одного выпуска не было» и «под эти отборы ничего не подошло» — разные вещи, и
    // предлагать завести первый выпуск там, где их сто, но все не под отбор, значит
    // отправить человека делать лишнюю работу.
    const filtered = Object.values(FILTERS).some(Boolean);
    app.append($(`<div class="card">${filtered
      ? emptyBox({why: 'Под выбранные отборы ни один выпуск не подошёл.',
          means: 'Выпуски в студии есть — просто не эти.',
          href: '#/releases', id: 'r-clear', act: 'Снять отборы'})
      : emptyBox({why: 'Выпусков пока нет — ни одной донорской ссылки не поставлено.',
          means: 'Выпуск заводится ссылкой: она встанет в ближайший свободный выход '
               + 'канала, и дальше конвейер ведёт её сам.',
          href: '#/new', act: 'Новый выпуск по ссылке'})
    }</div>`));
    const clr = app.querySelector('#r-clear');
    if (clr) clr.onclick = ev => {
      ev.preventDefault();
      for (const k of Object.keys(FILTERS)) FILTERS[k] = '';
      render();
    };
    return;
  }

  // Подпись отрезка: название этапа плюс его состояние. Обещать «осталось столько-то»
  // мы не можем — система знает не время до готовности, а срок, после которого этап
  // считается зависшим. Показывать первое вместо второго значило бы соврать.
  const SEG_STATE = {done:'готово', running:'идёт', queued:'в очереди',
                     error:'ошибка', idle:'не начато', off:'не участвует'};
  const segs = r => `<div class="segs">${(r.bar || []).map(b =>
    `<i class="${b.state}" title="${esc(b.title)} — ${SEG_STATE[b.state] || b.state}"></i>`
    ).join('')}</div>`;

  const relRowHtml = (r, of) => `
    <tr class="row${of ? ' grp-item' : ''}" data-id="${esc(r.release_id)}"
        ${of ? `data-of="${esc(of)}" hidden` : ''}>
      <td>
        <div style="font-weight:600">${esc(r.donor_title || r.donor_url || r.release_id)}</div>
        <div class="muted mono">${esc(r.release_id)}</div>
      </td>
      <td>${esc(r.channel)}<div class="muted">${esc(r.lang)}</div></td>
      <td>${when(r.slot_at)}</td>
      <td>
        <span class="pill clip s-${r.status === 'done' ? 'done'
          : r.status === 'blocked' ? 'error'
          : r.status === 'running' ? 'running' : 'queued'}">${esc(r.phase_title)}</span>
        <div class="muted" style="margin-top:4px">шаг ${r.phase_index + 1} из ${r.phase_total}</div>
        ${segs(r)}
      </td>
      <td class="muted">${ago(r.idle_sec)}${r.attempts ? `<div>попыток ${r.attempts}</div>` : ''}
        ${blockNote(r)}${gapNotes(r)}</td>
    </tr>`;

  // Одинаковые причины остановки — одной строкой (см. `groupByReason`). Один упавший
  // общий ключ останавливает все выпуски сразу, и список превращался в сорок строк с
  // одной фразой. В ключ группы входит статус: «остановлен» и «ожидает» — разные
  // судьбы, и склеивать их под одной причиной нельзя.
  const STATUS_WORD = {blocked:'остановлен', pending:'ожидает', running:'в работе',
                       done:'готово'};
  // Выпуски одной причины — своей карточкой, остальные — своей (владелец 03.10.2026:
  // в общей таблице заголовок группы и обычные строки под ним сливались, и казалось,
  // что у нижних та же беда). Карточки бед — сверху: сначала остановленные, потом
  // ждущие; внутри — в прежнем порядке выходов.
  const THEAD = of => `<thead><tr ${of ? `data-of="${esc(of)}" hidden` : ''}>
    <th>Выпуск</th><th>Канал</th><th>Выход</th><th>Фаза</th><th>Без движения</th></tr></thead>`;
  const groups = groupByReason(data.releases, blockLabel, r => r.status || '', 'rg');
  groups.forEach(g => { g.tip = blockTip(g.rows[0]); });
  const singles = groups.filter(g => g.rows.length < 2).map(g => g.rows[0]);
  const many = groups.filter(g => g.rows.length >= 2);
  const RANK = {blocked: 0, pending: 1};
  many.sort((a, b) => (RANK[a.rows[0].status] ?? 2) - (RANK[b.rows[0].status] ?? 2));
  const cards = many.map(g => {
    const st = g.rows[0].status || '';
    const count = `${g.rows.length} ${plural(g.rows.length, 'выпуск', 'выпуска',
                                             'выпусков')}`;
    // «Настройка канала» чинится в канале — сразу говорим, в каких, со ссылками.
    const kind = ((g.rows[0].block) || {}).kind;
    const где = kind === 'channel'
      ? [...new Map(g.rows.map(r => [r.channel_id, r.channel])).entries()]
          .map(([id, name]) => `<a href="#/channel/${encodeURIComponent(id)}/nastroyki"
            >${esc(name)}</a>`).join(', ')
      : '';
    const cls = kind || (st === 'blocked' ? '' : 'pending');
    return `<div class="card grpcard ${esc(cls)}" data-grp="${esc(g.id)}">
      <div class="grpbar">${groupHeadHtml(g, count, (STATUS_WORD[st]
        ? ` <span class="pill s-${st === 'blocked' ? 'error' : 'queued'}"
              >${esc(STATUS_WORD[st])}</span>` : '')
        + (где ? `<div class="note blk-where">каналы: ${где}</div>` : ''))}</div>
      <table>${THEAD(g.id)}<tbody>${g.rows.map(r => relRowHtml(r, g.id)).join('')}</tbody></table>
    </div>`;
  });
  const rest = singles.length ? `<div class="card" id="rel-rest">
      ${cards.length ? `<div class="restcap">Остальные выпуски — ${singles.length}</div>` : ''}
      <table>${THEAD('')}<tbody>${singles.map(r => relRowHtml(r, '')).join('')}</tbody></table>
    </div>` : '';

  const box = $(`<div>${cards.join('')}${rest}</div>`);
  box.querySelectorAll('tr.row').forEach(tr =>
    tr.onclick = () => location.hash = '#/release/' + tr.dataset.id);
  wireReasonFolds(box);
  app.append(box);
}

async function viewRelease(id){
  const d = await api('/ui/releases/' + encodeURIComponent(id));
  const r = d.release;

  app.innerHTML = '';
  const [backHref, backText] = backFrom(CAME_FROM);
  app.append($(`<a class="back" href="${esc(backHref)}">← ${esc(backText)}</a>
    <h1>${esc(r.donor_title || r.release_id)}</h1>
    <p class="sub">${esc(r.channel)} · ${esc(r.lang)} · выход ${when(r.slot_at)}
      · фаза «${esc(r.phase_title)}»</p>`));

  const head = $(`<div class="card" style="margin-bottom:16px">
    <div class="grid">
      <div><div class="k">Статус</div>${esc(r.status || '—')}</div>
      <div><div class="k">Шаг</div>${r.phase_index + 1} из ${r.phase_total}</div>
      <div><div class="k">Попыток</div>${r.attempts}</div>
      <div><div class="k">Без движения</div>${ago(r.idle_sec) || '—'}</div>
      <div><div class="k">Ролик</div>${r.video_id ? esc(r.video_id) : '—'}</div>
    </div>
    ${r.hand_confirmed ? `<div class="sec">
        Подтверждено человеком${r.hand_by ? ' — ' + esc(r.hand_by) : ''}, ${
          when(r.hand_confirmed)}. Ролик на канале есть; заливка не повторится.
        <span class="muted" style="font-weight:400">Это не машинное подтверждение:
          ответа YouTube Data API по этому выпуску у нас нет.</span></div>` : ''}
    ${gapBoxes(r)}
    ${blockBox(r) || (r.blocked_reason ? `<div class="sec" style="color:var(--bad)">
        Остановлен: ${esc(r.blocked_reason)}
        ${r.status === 'blocked' && !r.hand_confirmed
          ? '<button class="ghost" id="revive" style="margin-left:10px">Вернуть в работу</button>'
            + '<button class="ghost" id="byhand" style="margin-left:8px">Подтвердить руками</button>'
          : ''}</div>` : '')}
    ${d.stages.map(s => `
      <div class="stage ${s.state === 'off' ? 'off' : ''}">
        <div class="dot ${STATE_CLS[s.state]}">${DOT[s.state] || ''}</div>
        <div class="body">
          <div class="name">${esc(s.title)}
            <span class="pill ${STATE_CLS[s.state]}" style="margin-left:6px">${STATE_TITLE[s.state]}</span>
          </div>
          ${s.facts.length || s.link ? `<div class="facts">${s.facts.map(esc).join(' · ')}${
            s.link ? `${s.facts.length ? ' · ' : ''}<a href="${esc(s.link.href)}"
              target="_blank" rel="noopener">${esc(s.link.text)}</a>` : ''}</div>` : ''}
          ${s.note ? `<div class="note ${s.state === 'error' ? 'bad' : 'muted'}"
            >${esc(s.note)}</div>` : ''}
          ${stageFiles(s, r.project_id)}
          ${s.review ? '<div class="cvr" data-cvr="1">Загружаю обложку выпуска…</div>' : ''}
        </div>
        <div style="white-space:nowrap;align-self:center">${
          s.job ? actions({service: s.job.service, id: s.job.id,
                           state: s.state, status: s.job.status}) : ''}</div>
      </div>`).join('')}
  </div>`);
  app.append(head);
  head.querySelectorAll('[data-cvr]').forEach(box =>
    fillCoverReview(r.release_id, box, () => viewRelease(id)));
  const jump = head.querySelector('.cv-jump');
  if (jump) jump.onclick = ev => {
    ev.preventDefault();
    const box = head.querySelector('[data-cvr]');
    if (box) box.scrollIntoView({behavior: 'smooth', block: 'center'});
  };
  // Повтор одного этапа не трогает соседние: кнопка обращается ровно к той задаче,
  // на которой этап держится, и в тот сервис, которому она принадлежит.
  wireActions(head);
  wireRegen(head);

  // Возврат из разбора. Фазу не откатываем: сделанное и оплаченное остаётся сделанным,
  // движок продолжит с того шага, где остановился.
  const drop = head.querySelector('#blk-drop');
  if (drop) drop.onclick = () => confirmInline(drop,
      'Убрать эту ссылку из плана? Выход канала освободится под другой ролик.', async () => {
    drop.disabled = true;
    try{
      await post(`/ui/plan/${encodeURIComponent(r.plan_item_id)}/cancel`);
      location.hash = '#/channel/' + encodeURIComponent(r.channel_id);
    }catch(e){ drop.disabled = false; toast(e.message); }
  });

  const rev = head.querySelector('#revive');
  if (rev) rev.onclick = () => confirmInline(rev,
      `Вернуть в работу с фазы «${r.phase_title}»?`, async () => {
    rev.disabled = true;
    try{
      await post(`/ui/releases/${encodeURIComponent(r.release_id)}/revive`);
      await render();
    }catch(e){ rev.disabled = false; toast(e.message); }
  });

  /* Подтверждение человеком — единственный выход из тупика, в котором у выпуска нет ни
     одного действия: загрузка уже начиналась, значит повтор запрещён навсегда, а выход
     канала занят. Решение владельца 01.10.2026, п. 6: это считается выполнением плана,
     и пометка остаётся навсегда.

     Кнопка ОДИНОЧНАЯ и живёт только здесь, на странице одного выпуска: массовое
     применение — прямой запрет ТЗ, и правильно оно быть не может, потому что каждый
     такой выпуск человек смотрит на канале своими глазами.

     Номер ролика спрашиваем, если нода его не присылала. Без номера подтверждать нечем:
     «не знаем» не равно «подтверждено», и закрывать выпуск на доверии нельзя — ролика
     на канале может не быть вовсе. */
  const byhand = head.querySelector('#byhand');
  if (byhand) byhand.onclick = () => {
    const есть = !!r.video_id;
    modal('Подтвердить руками', `
      <div style="font-size:14px">Вы открыли канал и видите ролик там. Выпуск закроется
        как выполненный: выход канала останется занятым, заливка больше не повторится,
        а пометка «подтверждено человеком» останется навсегда.</div>
      ${есть
        ? `<div class="note muted">Ролик: ${esc(r.video_id)} — номер прислала машина
             заливки, вписывать ничего не нужно.</div>`
        : `<div class="fld" style="margin-top:12px">
             <label>Ссылка на ролик или его номер<span style="color:var(--bad)">*</span></label>
             <input id="bh-vid" placeholder="https://youtu.be/… или 11 символов">
             <div class="note muted">Номера ролика мы не знаем: машина его не прислала.
               Откройте ролик на канале и скопируйте ссылку из адресной строки.</div>
           </div>`}
      <div class="fld" style="margin-top:10px">
        <label>Заметка для разбора</label>
        <input id="bh-note" placeholder="что было видно на канале — необязательно">
      </div>`,
      {ok: 'Подтвердить', no: 'Отмена', onOk: async (body, close) => {
        const vid = (body.querySelector('#bh-vid') || {}).value || '';
        if (!есть && !vid.trim()) throw new Error('впишите ссылку на ролик или его номер');
        await post(`/ui/releases/${encodeURIComponent(r.release_id)}/confirm-by-hand`,
                   {video_id: vid.trim(),
                    note: ((body.querySelector('#bh-note') || {}).value || '').trim()});
        close();
        await render();
      }});
  };

  app.append($(`<div class="card">
    <div class="sec">Что происходило</div>
    ${[
      // Одна лента, а не две подряд: фазы и журнал — события одного ролика, и
      // читать их надо вперемешку по времени. От новых к старым — текущее состояние
      // сверху (владелец 03.10.2026: «для понимания текущей ситуации»).
      ...d.events.map(e => ({t: e.created, html: `<div class="ev">
        <time>${when(e.created)}</time>
        <div class="step">фаза</div>
        <div>${esc(e.phase_title)}${e.video_id ? ' · ролик ' + esc(e.video_id) : ''}
          ${again(e.repeats, e.last_seen)}</div>
      </div>`})),
      ...d.log.map(l => ({t: l.ts, html: `<div class="ev">
        <time>${when(l.ts)}</time>
        <div class="step">${esc(l.step)}</div>
        <div${l.level === 'warn' || l.level === 'error' ? ' class="note bad"' : ''}
          >${esc(l.message)} ${again(l.repeats, l.last_ts)}</div>
      </div>`})),
    ].sort((a, b) => (b.t || 0) - (a.t || 0)).map(x => x.html).join('')}
    ${!d.events.length && !d.log.length ? '<div class="empty">Записей пока нет.</div>' : ''}
  </div>`));
}

/* ───────────────────────────── ключи ───────────────────────────── */

/* Повтор одного и того же состояния не заводит новую строку (движок пишет «ждём…»
   каждые 30 секунд) — вместо стены одинаковых записей показываем, сколько раз и
   когда в последний раз. Одиночная запись выглядит как раньше. */
function again(times, last){
  if (!(times > 1)) return '';
  return `<span class="muted"> · повторилось ${times} раз(а), последний раз ${when(last)}</span>`;
}

function dur(sec){
  if (sec == null) return '—';
  if (sec < 60) return sec + ' с';
  if (sec < 3600) return Math.round(sec/60) + ' мин';
  if (sec < 86400) return Math.round(sec/3600) + ' ч';
  return Math.round(sec/86400) + ' дн';
}

// Ключ, которым Rewrite Studio делает текст (18.09.2026). Он живёт не в кабинете, а у
// самого рерайта, поэтому в таблицу «свои ключи» не попадает — но искать его человек
// будет именно здесь: без него выпуск встаёт на первом шаге с «нет доступных ключей
// провайдера». Значение ключа наружу не отдаётся, видно только «задан или нет».
// Язык канала — списком (18.09.2026). Уже сохранённый код, которого нет в списке, не
// теряется: он остаётся отдельным выбранным пунктом, как у моделей и языков карты голосов.
function langOptionsHtml(langs, cur){
  if (!langs.length)
    return `<input id="f-lang" value="${esc(cur || '')}" style="width:60px">`;
  const known = langs.some(l => String(l.value) === String(cur || ''));
  return `<select id="f-lang" style="width:230px">
    <option value=""${cur ? '' : ' selected'}>— не выбран —</option>
    ${known || !cur ? '' : `<option value="${esc(cur)}" selected>${esc(cur)
      } — нет в списке, но сохранён</option>`}
    ${langs.map(l => `<option value="${esc(l.value)}"${
      String(l.value) === String(cur || '') ? ' selected' : ''}>${esc(l.title)}</option>`).join('')}
  </select>`;
}

// До 22.09.2026 плашка была одна: побеждал own_openai, затем own_claude, затем
// серверный ключ — своя подписка Codex/Claude, заданная вместе с OpenAI, была бы не
// видна и не снимаема. Теперь три плашки независимы: у каждой свой булев признак и своя
// ссылка «снять», ничьё наличие не прячет состояние двух других. Правка 22.09.2026
// (ревью, Issue 1): «независимо» не значит «молча» — если своего нет, а сервер
// отвечает за провайдер (видно по *_source, не по own_*), плашка обязана сказать, что
// текст всё равно делается — серверным. own_*/server_openai/server_claude сами по себе
// это не говорят: для Codex отдельного булева server_codex вообще нет — «что сработает»
// надёжно знают только *_source (user/server/none).
// Правка 22.09.2026 (ревью итерация 2, Issue 1): подпись «Текст:» вернулась — общим
// заголовком над тремя плашками, как было в прежней однострочной версии, а подсказка
// «?» стоит рядом с ней, а не отдельной строкой под плашками.
// Правка 22.09.2026 (ревью итерация 2, Issue 2): claude_source === 'server' бывает и
// без настоящей серверной подписки (OAuth) — тогда сервер тянет Claude обычным ключом
// API. Различить эти два случая можно по server_claude (он и есть признак «серверный
// OAuth есть», `web/app.py:_rewrite_keys`): без него пишем нейтральное «серверный ключ
// владельца», как у OpenAI, а не «серверная подписка», которой на деле нет.
function rewriteRowHtml(rw){
  if (!rw.ok)
    return `<div class="secbody"><div class="note muted">Текст: <span class="note bad">${
      esc(rw.why || 'рерайт не ответил')}</span></div></div>`;
  const sources = [rw.source, rw.claude_source, rw.codex_source];
  const nothing = sources.every(s => !s || s === 'none');
  const claudeServerText = rw.server_claude
    ? 'серверная подписка Claude владельца' : 'серверный ключ владельца';
  const line = (own, source, doneText, serverText, idleText, dropId, dropText) => {
    if (own) return `<div class="note muted"><span class="pill s-done">${esc(doneText)
      }</span> <a href="#" id="${dropId}">${esc(dropText)}</a></div>`;
    if (source === 'server') return `<div class="note muted"><span class="pill s-idle">${
      esc(serverText)}</span></div>`;
    return `<div class="note muted"><span class="pill s-idle">${esc(idleText)}</span></div>`;
  };
  return `<div class="secbody">
    <div class="note muted">Текст:${hintDot(
      'Ключ для текста и свои подписки Codex/Claude добавляются той же кнопкой ниже — '
      + 'провайдеры «OpenAI · текст», «Своя подписка Codex», «Своя подписка Claude».')}</div>
    ${nothing ? '<div class="note muted"><span class="pill s-error">'
      + 'ключа нет — текст делать нечем</span></div>' : ''}
    ${line(rw.own_openai, rw.source, 'ваш ключ OpenAI', 'серверный ключ владельца',
      'свой ключ OpenAI не задан', 'rw-drop', 'снять свой')}
    ${line(rw.own_codex, rw.codex_source, 'ваша подписка Codex',
      'серверная подписка Codex владельца', 'своя подписка Codex не задана',
      'rw-drop-codex', 'снять свою')}
    ${line(rw.own_claude, rw.claude_source, 'ваша подписка Claude', claudeServerText,
      'своя подписка Claude не задана', 'rw-drop-claude', 'снять свою')}
  </div>`;
}

/* Карточка своих ключей. Одна и та же на экране ключей и в профиле (20.09.2026):
   владелец — «чтобы ключ добавить, нужно куда-то переходить». Теперь не нужно, а второй
   копии разметки, которая разойдётся с первой на первой же правке, не завелось.
   `opts.title` — своё название в профиле, `opts.note` — строка под заголовком,
   `opts.more` — ссылка на полный экран ключей: очередь провайдеров, отдыхающие ключи и
   FastGen остались там, они только читают и в профиле были бы простынёй. */
function ownKeysCard(d, opts){
  const o = opts || {};
  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">${esc(o.title || 'Свои ключи пользователей')}${o.more
      ? '<a class="mklink" href="#/keys">очередь и отдых ключей →</a>' : ''}</div>
    ${o.note ? `<div class="secbody"><div class="note muted">${esc(o.note)}</div></div>` : ''}
    ${d.own_keys.length ? `<table><thead><tr>
        <th>Пользователь</th><th>Провайдер</th>
        <th>Ключей ${hintDot('Значение ключа нигде не показывается — только его хвост.')}</th>
        <th>Раздача</th>
      </tr></thead><tbody>${d.own_keys.map(o2 => `<tr>
        <td>${esc(o2.user)}</td><td>${esc(o2.family)}</td>
        <td>${(o2.items || []).map(i => `<span class="mono"
          style="margin-right:8px;white-space:nowrap">${esc(i.mask)}${o2.mine ? ` <a href="#"
          class="dropkey" data-f="${esc(o2.family)}" data-i="${i.index}"
          title="снять этот ключ">×</a>` : ''}</span>`).join('') || o2.count}</td>
        <td>${o2.pooled
          ? '<span class="pill s-done">по кругу между ключами</span>'
          : '<span class="pill s-idle">ключ один</span>'}</td>
      </tr>`).join('')}</tbody></table>
`
      : '<div class="empty">Свои ключи не заданы — всё идёт на серверные.</div>'}
    ${rewriteRowHtml(d.rewrite || {})}
    <div class="secbody" style="padding-top:0">
      <button class="ghost" id="addkey">Добавить ключ</button>
    </div>
  </div>`);
  wireKeys(card, d);
  return card;
}

/* ────────────────── промпты для картинок: канал (пункт 4 ТЗ 22.09.2026) ──────────────────
   Тот же выбор, что у кабинета в «Мои ключи» (server/main.py, prompts_block): один
   выпадающий список канала и под ним — поле ровно его credential'а (OpenAI = ключ,
   Claude = OAuth-токен подписки, Codex = содержимое auth.json, alt-Claude = ключ + свои
   адрес/модель). Пишет и хранит кабинет тем же POST /api/my/keys/web — второго места
   хранения секрета пульт не заводит; значения сюда не приходят вовсе, только
   «задан/не задан» на канал (см. `_prompt_state` в web/app.py). Серверные подписки из
   «Подписок для текста» (textSubsCard) сюда не подключены намеренно — разные деньги,
   разное хранилище (Rewrite `/settings/keys` там, `users.keys` кабинета здесь) — даже
   если подписи «Codex (подписка)» похожи, «задан/не задан» у них независимы.
   Порядок каналов — тот же, что у кабинета (`server/main.py:786` PROMPT_CHANNEL_ORDER =
   openai/claude/altclaude/codex): ревью 22.09.2026, Issue 5 — было `codex` перед
   `altclaude`, расходилось с кабинетом при совпадающем комментарии «тот же порядок».
   Подписи (PROMPT_CHANNEL_TITLE ниже) — НЕ те же, что `server/main.py:778`
   PROMPT_PROVIDERS, а намеренно свои и короче: кабинетные («GPT API — ключ OpenAI»,
   «Codex токен — подписка ChatGPT», «Claude токен — подписка Claude (Sonnet 5)»,
   «Альтернативный Claude API — свой адрес и ключ») рассчитаны на отдельную страницу
   «Мои ключи»; здесь тот же выбор — один из под-пунктов внутри карточки «Ключи» пульта,
   рядом с полем credential'а конкретного канала, и длинная подпись там дублировала бы
   то, что уже видно строкой ниже. Ревью 22.09.2026 итерация 2, Issue 2 — комментарий
   ошибочно утверждал, что подписи тоже совпадают; это неверно и здесь исправлено. */
const PROMPT_CHANNEL_ORDER = ['openai', 'claude', 'altclaude', 'codex'];
const PROMPT_CHANNEL_TITLE = {openai: 'OpenAI', claude: 'Claude (подписка)',
                              altclaude: 'Альтернативный Claude API', codex: 'Codex (подписка)'};
// Отдельная папка для входа Codex, которым пишутся ПРОМПТЫ КАРТИНОК — НЕ та же
// `~/codex-studio`, что у подписки для ТЕКСТА (subFormHtml/textSubsCard, обе живут в
// «Моих ключах», но это разные хранилища кабинета и рерайта). Codex сам обновляет
// вход и глушит прежний: один и тот же auth.json/одна и та же папка в двух местах
// выбивали бы друг друга при каждом обновлении — для промптов это даже важнее, чем
// для текста, потому что заметить тихую потерю входа тут некому (ревью 22.09.2026,
// Issue 2).
const PROMPT_CODEX_HOME = '~/codex-studio-prompts';
const PROMPT_CODEX_WARNING = 'Не вставляйте сюда тот же <code>auth.json</code>, что уже '
  + 'отдан в «Мои ключи → Своя подписка Codex»: это для ТЕКСТА, а это поле — для '
  + 'ПРОМПТОВ КАРТИНОК, разные хранилища. Общий вход из одной папки будет выбивать '
  + 'сам себя при каждом обновлении.';

// OpenAI и alt-Claude — своя простая разметка (у `subFormHtml` аналога для них нет:
// она про подписки Codex/Claude). Claude и Codex рисует `promptSubPaneHtml` ниже.
function promptChannelFieldHtml(ch, stateText){
  const state = `<div class="note muted">Сейчас: ${esc(stateText)} · пусто = не менять · `
    + `«-» = очистить.</div>`;
  if (ch === 'altclaude') return `
    <label for="pf-altclaude">Ключ альтернативного Claude API</label>
    <input id="pf-altclaude" type="password" autocomplete="new-password" spellcheck="false"
      placeholder="sk-ant-…">
    ${state}
    <label for="pf-altclaude-base" style="display:block;margin-top:8px">Адрес API (необязательно)</label>
    <input id="pf-altclaude-base" spellcheck="false" placeholder="https://…">
    <label for="pf-altclaude-model" style="display:block;margin-top:8px">Модель (необязательно)</label>
    <input id="pf-altclaude-model" spellcheck="false" placeholder="claude-…">
    <div class="note muted">Адрес и модель: пусто — не отправляется вовсе (сохранённое
      значение не меняется); «-» — очистить и вернуться на серверное умолчание.</div>`;
  return `<label for="pf-openai">OpenAI-ключ</label>
    <input id="pf-openai" type="password" autocomplete="new-password" spellcheck="false"
      placeholder="sk-proj-…">
    ${state}`;
}

// Claude/Codex — общая разметка `subFormHtml`/`subEmptyText` (не дублируем: FR-16,
// ревью 22.09.2026 Issue 2). `codexHome`/`warnSeparateAuth` — те же параметры, что
// принимает теперь `subFormHtml`, только со своими (не текстовыми) значениями.
function promptSubPaneHtml(ch, stateText){
  const opts = ch === 'codex'
    ? {codexHome: PROMPT_CODEX_HOME, warnSeparateAuth: PROMPT_CODEX_WARNING} : {};
  const note = `<div class="note muted">Сейчас: ${esc(stateText)} · пусто = не менять · `
    + `«-» = очистить. Чтобы задать/заменить — ${esc(subEmptyText(ch))}.</div>`;
  // `forLabel` — любая непустая строка: прячет поле «Название» (оно тут не нужно,
  // канал один на человека) тем же условием, что и своя подписка в «Моих ключах»
  // (`subFormHtml(fam, 'own')`, `wireKeys`).
  return note + subFormHtml(ch, 'prompt', opts);
}

// Карточка канала — рядом со «Своими ключами» (не внутри неё): своя карточка проще
// свернуть/найти на экране и не путает список провайдеров с четырьмя каналами промптов.
function promptChannelCard(d){
  const p = d.prompt || {selected: '', channels: {}};
  // «Свой не задан», не просто «не задан» (ревью 22.09.2026, Issue 5): канал может
  // при этом работать на СЕРВЕРНОМ ключе — «не задан» звучало бы как «канал недоступен».
  const stateOf = ch => ((p.channels || {})[ch] || {}).own_set ? 'свой ключ задан' : 'свой не задан';
  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Промпты для картинок${hintDot(
      'Каким каналом писать промпты для картинок: OpenAI, подписка Claude, подписка '
      + 'Codex или альтернативный Claude API. Свой ключ/подписка канала — расход идёт '
      + 'на вашу подписку; канал не выбран — решает сервер. Это ОТДЕЛЬНО от «Подписок '
      + 'для текста» ниже: разные деньги, разное хранилище.')}</div>
    <div class="secbody">
      <div class="fld"><label for="pchan">Канал</label>
        <select id="pchan">
          <option value=""${p.selected ? '' : ' selected'}>Авто — решает сервер</option>
          ${PROMPT_CHANNEL_ORDER.map(ch => `<option value="${ch}"${
            p.selected === ch ? ' selected' : ''}>${esc(PROMPT_CHANNEL_TITLE[ch])} · ${
            esc(stateOf(ch))}</option>`).join('')}
        </select>
      </div>
      <div class="fld" id="pchan-fields" style="margin-top:10px"></div>
      <div class="secbody" style="padding:12px 0 0;display:flex;gap:10px;align-items:center">
        <button id="pchan-save">Сохранить</button>
        <span class="note bad" id="pchan-err" style="margin:0"></span>
      </div>
    </div>
  </div>`);
  wirePromptChannel(card, d);
  return card;
}

function wirePromptChannel(card, d){
  const p = d.prompt || {selected: '', channels: {}};
  const stateOf = ch => ((p.channels || {})[ch] || {}).own_set ? 'свой ключ задан' : 'свой не задан';
  const sel = card.querySelector('#pchan');
  // ОДНА обёртка — в неё перерисовывается форма только выбранного канала, тем же
  // приёмом, что модалка «Добавить ключ» (`wireKeys`, `#kval-wrap`). Так в карточке
  // никогда не бывает больше одного набора `#sf-*` разом: Claude и Codex делят те же
  // id (`#sf-secret` и т. д.), и держать оба в DOM одновременно (даже скрытым через
  // display:none, как было раньше у четырёх панелей) — это дублирующиеся id на
  // странице (ревью 22.09.2026, Issue 2).
  const wrap = card.querySelector('#pchan-fields');
  const renderPane = ch => {
    if (!ch){ wrap.innerHTML = ''; return; }
    if (ch === 'openai' || ch === 'altclaude'){
      wrap.innerHTML = promptChannelFieldHtml(ch, stateOf(ch));
      return;
    }
    wrap.innerHTML = promptSubPaneHtml(ch, stateOf(ch));
    // Собственная строка кнопок `subFormHtml` (`#sf-ok`/`#sf-no`) дублирует кнопку
    // «Сохранить» самой карточки — прячется тем же приёмом, что у формы своей
    // подписки в «Моих ключах» (`wireKeys`, `#kval-wrap`, `ownRow.hidden = true`).
    const ok = wrap.querySelector('#sf-ok');
    if (ok){ const row = ok.closest('.row'); if (row) row.hidden = true; }
    wireSubFile(wrap);
  };
  renderPane(sel.value);
  sel.onchange = () => renderPane(sel.value);
  const err = card.querySelector('#pchan-err');
  card.querySelector('#pchan-save').onclick = async () => {
    err.textContent = '';
    const ch = sel.value;
    const prompt = {channel: ch};
    if (ch === 'openai')
      prompt.prompt_key_openai = (wrap.querySelector('#pf-openai').value || '').trim();
    else if (ch === 'claude')
      prompt.claude_oauth = (wrap.querySelector('#sf-secret').value || '').trim();
    else if (ch === 'codex')
      prompt.codex_auth = (wrap.querySelector('#sf-secret').value || '').trim();
    else if (ch === 'altclaude'){
      prompt.alt_llm = (wrap.querySelector('#pf-altclaude').value || '').trim();
      // Issue 1 (Critical, ревью 22.09.2026): адрес/модель отправляются ТОЛЬКО
      // непустыми. Кабинет отличает «поле есть, но пусто» (= очистить) от «поля не
      // было» (= не менять) именно у этих двух полей и только у них
      // (`server/main.py:17783-17788`: `if _v == "-" or (_fld in d and not _v): pop`);
      // у остальных пяти полей формы пустая строка безопасна как есть. Раньше JS слал
      // сюда `''` всегда — любое сохранение карточки на alt-Claude молча стирало
      // сохранённые адрес и модель, даже если человек их не трогал вовсе.
      // Мутация: вернуть безусловное `prompt.alt_llm_base = base` (как было) — тест
      // браузера, что «пусто не отправляется вовсе», ловит.
      const base = (wrap.querySelector('#pf-altclaude-base').value || '').trim();
      const model = (wrap.querySelector('#pf-altclaude-model').value || '').trim();
      if (base) prompt.alt_llm_base = base;
      if (model) prompt.alt_llm_model = model;
    }
    card.querySelector('#pchan-save').disabled = true;
    try{
      await post('/ui/keys', {prompt});
      toast('Канал промптов сохранён', 'ok');
      await render();
    }catch(e){ err.textContent = e.message; }
    finally{ const btn = card.querySelector('#pchan-save'); if (btn) btn.disabled = false; }
  };
}

/* ─────────────── подписки для текста: Codex и Claude (22.09.2026) ───────────────
   Владелец: «сделаем, чтобы мы могли пользоваться подпиской кодекса или клода для
   написания текста». Раньше подписку меняли только по SSH: `codex login` на сервере,
   правка /etc/rewrite.env и перезапуск. Теперь — здесь, администратором.
   Значение входа сюда обратно не приходит никогда: только имя, хвост и состояние. */
const SUB_PROVIDER = {codex: 'Codex', claude: 'Claude'};
const SUB_DOT = {ok: ['s-done', '✓'], new: ['s-idle', '·'], limit: ['s-queued', '⏳'],
                 dead: ['s-error', '!'], paused: ['s-idle', '‖']};

function subStateText(it){
  const t = ts => new Date(ts * 1000).toLocaleTimeString('ru-RU',
    {hour: '2-digit', minute: '2-digit'});
  switch (it.state){
    case 'ok': return `работает${it.last_ok ? ' · последний вызов ' + when(it.last_ok) : ''}`;
    case 'limit': return it.until
      ? `упёрлась в лимит подписки — проснётся в ${t(it.until)}`
      // Codex времени сброса не называет — выдумывать час не будем.
      : 'упёрлась в лимит подписки — ждёт сброса окна; Codex не говорит, когда';
    case 'dead': return `вход протух ${when(it.since)} — вынута из раздачи, `
      + 'текст её не берёт. Замените вход';
    case 'paused': return 'на паузе — задачи текста её не берут';
    default: return 'добавлена, ещё не работала';
  }
}

function subFormHtml(provider, forLabel, opts){
  const codex = provider === 'codex';
  // opts — необязательный третий параметр (ревью 22.09.2026, Issue 2): по умолчанию
  // `{}`, так что оба старых вызова с двумя аргументами (textSubsCard, wireKeys)
  // рисуют байт-в-байт то же самое, что и раньше. Канал промптов картинок
  // (`promptSubPaneHtml`) передаёт свою папку CODEX_HOME и предупреждение не путать
  // её со входом для текста.
  opts = opts || {};
  const codexHome = opts.codexHome || '~/codex-studio';
  return `
    ${forLabel ? '' : `<div class="fld"><label>Название</label>
      <input id="sf-label" maxlength="60" style="width:min(340px,100%)"
        placeholder="${codex ? 'Например: ChatGPT Pro, основной' : 'Например: Claude Max, резерв'}"></div>`}
    ${codex ? `<ol class="note">
        <li>На своём компьютере войдите в <b>отдельную папку</b>:
          <code>CODEX_HOME=${esc(codexHome)} codex login</code> — аккаунтом ChatGPT с подпиской.</li>
        <li>Вставьте сюда файл <code>${esc(codexHome)}/auth.json</code> целиком или выберите его.</li>
      </ol>
      <div class="note muted">Почему отдельная папка: Codex сам обновляет вход, и старый
        при этом перестаёт действовать. Один и тот же вход на сервере и на вашем
        компьютере выбивал бы друг друга.</div>
      ${opts.warnSeparateAuth ? `<div class="note bad">${opts.warnSeparateAuth}</div>` : ''}
      <textarea id="sf-secret" rows="6" spellcheck="false" autocomplete="off"
        placeholder='{"auth_mode": "chatgpt", "tokens": { … } }'></textarea>
      <div class="row"><label class="filepick"><span class="pickbtn">Выбрать auth.json</span>
        <input id="sf-file" type="file" accept=".json,application/json"></label>
        <span class="muted" id="sf-fname" style="font-size:12.5px"></span></div>`
    : `<ol class="note">
        <li>На своём компьютере выполните <code>claude setup-token</code> и войдите
          аккаунтом Claude с подпиской.</li>
        <li>Вставьте напечатанный токен — он начинается с <code>sk-ant-oat</code>.</li>
      </ol>
      <input id="sf-secret" class="secret" type="password" autocomplete="off"
        spellcheck="false" placeholder="sk-ant-oat01-…">`}
    <div class="note muted">Вход хранится на сервере закрыто. Показать его обратно
      нельзя — только заменить или удалить.</div>
    <div class="row"><button id="sf-ok">${forLabel ? 'Заменить вход' : 'Добавить'}</button>
      <button class="ghost" id="sf-no">Отмена</button>
      <span class="note bad" id="sf-err" style="margin:0"></span></div>`;
}

// Текст «чего не хватает» для пустой формы subFormHtml — общий для админского блока
// подписок (textSubsCard) и своей подписки в «Моих ключах» (wireKeys), чтобы не
// разойтись при первой правке (ревью 22.09.2026, Issue 4).
function subEmptyText(provider){
  return provider === 'codex' ? 'вставьте содержимое auth.json' : 'вставьте токен';
}

// Подключить filepicker внутри уже вставленной разметки subFormHtml: файл целиком —
// в #sf-secret, имя — в #sf-fname, сам инпут сбрасывается, чтобы повторный выбор того
// же файла тоже сработал. Общий для textSubsCard и wireKeys (Issue 4) — нет filepicker'а
// только у формы Claude (там обычное password-поле, #sf-file отсутствует).
function wireSubFile(container){
  const file = container.querySelector('#sf-file');
  if (!file) return;
  file.onchange = async () => {
    const f = file.files[0];
    if (!f) return;
    container.querySelector('#sf-secret').value = await f.text();
    container.querySelector('#sf-fname').textContent = f.name;
    file.value = '';
  };
}

/* ────────── серверные ключи владельца: правка со страницы (24.09.2026) ──────────
   Владелец: «сделаем так чтобы серверные ключи админ тоже мог менять из интерфейса без
   надобности в ssh». Ключи лежат там же, где и раньше, — файлом у владельца; студия
   только правит его. Значение обратно не приходит никогда: видно «задан», хвост и
   сколько ключей в семействе. */
async function serverKeysCard(){
  const card = $(`<div class="card" id="srvkeys-card" style="margin-bottom:16px"></div>`)
    .firstElementChild;
  const draw = async () => {
    let d;
    try{ d = await api('/ui/keys/server'); }
    catch(e){
      if (e instanceof NeedLogin) throw e;
      card.innerHTML = `<div class="sec">Ключи провайдеров (общие)</div><div class="secbody">
        <div class="note bad">Список прочитать не удалось: ${esc(e.message)}</div></div>`;
      return;
    }
    const items = Array.isArray(d.items) ? d.items : [];
    card.innerHTML = `
      <div class="sec">Ключи провайдеров (общие) ${hintDot(
        'Ключи владельца: ими работают все, у кого нет своего ключа. Меняются прямо '
        + 'здесь — новый ключ действует со следующей задачи, перезапускать ничего не '
        + 'надо. Само значение ключа нигде не показывается.')}</div>
      ${d.warning ? `<div class="secbody" style="padding-bottom:0">
        <div class="note bad">${esc(d.warning)}</div></div>` : ''}
      ${items.map(it => `<div class="stage pitem srvkey" data-family="${esc(it.family)}">
        <div class="dot ${it.set ? 's-done' : 's-idle'}">${it.set ? '✓' : '·'}</div>
        <div class="body">
          <div class="pline"><span class="name">${esc(it.title)}</span>
            ${it.set ? `<span class="facts mono">${esc(it.tail)}</span>` : ''}
            ${it.pooled ? `<span class="pill ptag">ключей ${it.count}</span>` : ''}</div>
          <div class="note muted">${it.set
            ? (it.pooled ? 'работают по кругу; «Заменить» меняет основной'
                         : 'задан')
            : 'не задан — задачи этого провайдера упадут «нет ключа»'}</div>
        </div>
        <div class="pacts">
          ${iconBtn('srvkey-set', 'key', it.set ? 'Заменить ключ' : 'Задать ключ', it.title)}
          ${it.set ? iconBtn('bad srvkey-drop', 'remove', 'Убрать ключ', it.title) : ''}
        </div></div>`).join('')}
      <div class="secbody" style="padding-top:8px"><div class="note muted">Свой ключ
        человека перекрывает общий: у кого он задан, задачи идут на него.</div></div>
      <div class="secbody srvkey-form" id="srvkey-form" hidden></div>`;

    const form = card.querySelector('#srvkey-form');
    const openForm = it => {
      form.hidden = false;
      form.innerHTML = `
        <div class="name" style="font-weight:600">${esc(it.title)}</div>
        <div class="note muted">Вставьте новый ключ. Старый сохранится в файле ключей
          с пометкой даты — на случай, если новый окажется чужим.</div>
        <input id="sk-val" class="secret" type="password" autocomplete="off"
          spellcheck="false" placeholder="ключ провайдера"
          style="width:min(460px,100%);font-family:var(--mono);font-size:12px">
        <div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button id="sk-ok">Сохранить</button>
          <button class="ghost" id="sk-no">Отмена</button>
          <span class="note bad" id="sk-err" style="margin:0"></span></div>`;
      const val = form.querySelector('#sk-val');
      const err = form.querySelector('#sk-err');
      const ok = form.querySelector('#sk-ok');
      form.querySelector('#sk-no').onclick = () => { form.hidden = true; form.innerHTML = ''; };
      ok.onclick = async () => {
        err.textContent = '';
        if (!val.value.trim()){ err.textContent = 'вставьте ключ'; return val.focus(); }
        ok.disabled = true;
        try{
          await post('/ui/keys/server', {family: it.family, value: val.value});
          val.value = '';                       // в странице секрет не задерживается
          toast(`Ключ «${it.title}» заменён — действует со следующей задачи`, 'ok');
          await draw();
        }catch(e){ err.textContent = e.message; }
        finally{ ok.disabled = false; }
      };
      val.focus();
    };
    const byFamily = f => items.find(i => i.family === f);
    card.querySelectorAll('.srvkey-set').forEach(b => b.onclick = () =>
      openForm(byFamily(b.closest('.srvkey').dataset.family)));
    card.querySelectorAll('.srvkey-drop').forEach(b => b.onclick = () => {
      const it = byFamily(b.closest('.srvkey').dataset.family);
      confirmModal('Убрать ключ', `Убрать общий ключ «${it.title}»? Задачи этого `
        + 'провайдера будут падать «нет ключа» у всех, у кого нет своего.',
        async () => {
          try{ await api(`/ui/keys/server/${encodeURIComponent(it.family)}`,
                         {method: 'DELETE'}); await draw(); }
          catch(e){ toast(e.message); }
        });
    });
  };
  await draw();
  return card;
}

async function textSubsCard(){
  const card = $(`<div class="card" id="subs-card" style="margin-bottom:16px"></div>`)
    .firstElementChild;
  const draw = async () => {
    let d;
    try{ d = await api('/ui/subscriptions'); }
    catch(e){
      if (e instanceof NeedLogin) throw e;
      card.innerHTML = `<div class="sec">Подписки для текста</div><div class="secbody">
        <div class="note bad">Список подписок прочитать не удалось: ${esc(e.message)}</div></div>`;
      return;
    }
    // Неполный ответ не должен ронять весь экран ключей: блок рисуется из того, что есть.
    d.items = Array.isArray(d.items) ? d.items : [];
    const env = d.env || {};
    const envParts = ['codex', 'claude'].filter(p => (env[p] || []).length).map(p =>
      `${SUB_PROVIDER[p]} — ${env[p].length} (${env[p].map(x => esc(x.tail)).join(', ')})`);
    const pool = d.pool || {};
    const busy = ['codex', 'claude'].filter(p => pool[p] && pool[p].credentials).map(p =>
      `${SUB_PROVIDER[p]} ${pool[p].in_use} из ${pool[p].capacity}`);
    card.innerHTML = `
      <div class="sec stage-head"><span class="grow">Подписки для текста ${hintDot(
        'Подписки ChatGPT (Codex) и Claude, которыми студия пишет сценарии. Добавленная '
        + 'здесь начинает работать со следующей задачи — без перезапуска. Задачи '
        + 'раздаются по кругу; подписка с протухшим входом вынимается сама.')}</span>
        <button class="ghost small" id="sub-add-codex">Добавить Codex</button>
        <button class="ghost small" id="sub-add-claude">Добавить Claude</button></div>
      <div class="secbody subform" id="sub-form" hidden></div>
      ${d.items.length ? d.items.map(it => {
        const [cls, mark] = SUB_DOT[it.state] || SUB_DOT.new;
        const paused = it.state === 'paused', dead = it.state === 'dead';
        return `<div class="stage pitem subrow" data-sub="${esc(it.id)}"
            data-provider="${esc(it.provider)}" data-state="${esc(it.state)}">
          <div class="dot ${cls}">${mark}</div>
          <div class="body">
            <div class="pline"><span class="name">${esc(it.label)}</span>
              <span class="pill ptag">${esc(SUB_PROVIDER[it.provider])}</span>
              <span class="facts mono">${esc(it.tail)}</span></div>
            <div class="note ${dead ? 'bad' : it.state === 'limit' ? 'warn' : 'muted'}">${
              esc(subStateText(it))}</div>
            ${dead && it.note ? `<div class="note muted">${esc(it.note)}</div>` : ''}
          </div>
          <div class="pacts">
            ${iconBtn('sub-replace', 'key', 'Заменить вход', it.label)}
            ${paused || dead
              ? iconBtn('sub-resume', 'play', dead ? 'Вернуть в работу без замены'
                                                   : 'Вернуть в работу', it.label)
              : iconBtn('sub-pause', 'pause', 'Поставить на паузу', it.label)}
            ${iconBtn('sub-rename', 'edit', 'Переименовать', it.label)}
            ${iconBtn('sub-drop', 'remove', 'Удалить', it.label)}
          </div></div>`;
      }).join('') : `<div class="empty">Своих подписок студии пока нет${
        envParts.length ? ' — текст пишут подписки из настроек сервера' : ''}.</div>`}
      ${envParts.length || busy.length || env.known === false ? `<div class="secbody"
          style="padding-top:8px">
        ${envParts.length ? `<div class="note muted">Из файла настроек сервера:
          ${envParts.join(' · ')}. Их меняют на сервере, здесь только видно.</div>` : ''}
        ${busy.length ? `<div class="note muted">Пишут текст прямо сейчас: ${
          busy.join(' · ')}.</div>` : ''}
        ${env.known === false ? `<div class="note muted">Подписки из настроек сервера
          отсюда не видно: сервис текста не поднят в этом процессе.</div>` : ''}
      </div>` : ''}`;

    const form = card.querySelector('#sub-form');
    const openForm = (provider, item) => {
      form.hidden = false;
      form.innerHTML = `<div class="name" style="font-weight:600">${item
        ? `Новый вход для «${esc(item.label)}»` : `Новая подписка ${SUB_PROVIDER[provider]}`}</div>`
        + subFormHtml(provider, item ? item.label : '');
      const secret = form.querySelector('#sf-secret');
      const err = form.querySelector('#sf-err');
      wireSubFile(form);
      form.querySelector('#sf-no').onclick = () => { form.hidden = true; form.innerHTML = ''; };
      const ok = form.querySelector('#sf-ok');
      ok.onclick = async () => {
        err.textContent = '';
        if (!secret.value.trim()){
          err.textContent = subEmptyText(provider);
          return secret.focus();
        }
        ok.disabled = true;
        try{
          if (item) await post(`/ui/subscriptions/${item.id}`, {secret: secret.value});
          else await post('/ui/subscriptions', {provider, secret: secret.value,
            label: form.querySelector('#sf-label').value});
          // Секрет не держим в странице ни мгновения дольше нужного.
          secret.value = '';
          toast(item ? `Вход «${item.label}» заменён` : 'Подписка добавлена — работает '
                + 'со следующей задачи текста', 'ok');
          await draw();
        }catch(e){ err.textContent = e.message; }
        finally{ ok.disabled = false; }
      };
      (form.querySelector('#sf-label') || secret).focus();
    };
    card.querySelector('#sub-add-codex').onclick = () => openForm('codex');
    card.querySelector('#sub-add-claude').onclick = () => openForm('claude');

    const byId = id => d.items.find(i => i.id === id);
    const rowItem = b => byId(b.closest('.subrow').dataset.sub);
    card.querySelectorAll('.sub-replace').forEach(b => b.onclick = () => {
      const it = rowItem(b); openForm(it.provider, it);
    });
    const act = async (b, payload, done) => {
      b.disabled = true;
      try{ await post(`/ui/subscriptions/${rowItem(b).id}`, payload); if (done) toast(done, 'ok');
           await draw(); }
      catch(e){ toast(e.message); b.disabled = false; }
    };
    card.querySelectorAll('.sub-pause').forEach(b => b.onclick = () =>
      act(b, {paused: true}));
    card.querySelectorAll('.sub-resume').forEach(b => b.onclick = () =>
      act(b, {paused: false}));
    card.querySelectorAll('.sub-rename').forEach(b => b.onclick = () => {
      const it = rowItem(b);
      const m = modal('Переименовать подписку', `<div class="fld"><label>Название</label>
        <input id="rn" maxlength="60" value="${esc(it.label)}"></div>`,
        {onOk: async (body, close) => {
          await post(`/ui/subscriptions/${it.id}`, {label: body.querySelector('#rn').value});
          close(); await draw();
        }});
      m.body.querySelector('#rn').select();
    });
    card.querySelectorAll('.sub-drop').forEach(b => b.onclick = () => {
      const it = rowItem(b);
      confirmModal('Удалить подписку', `Удалить «${it.label}»? Задачи текста перестанут `
        + 'её брать, а вход будет стёрт с сервера. Вернуть можно только добавив заново.',
        async () => {
          try{ await api(`/ui/subscriptions/${it.id}`, {method: 'DELETE'}); await draw(); }
          catch(e){ toast(e.message); }
        });
    });
  };
  await draw();
  return card;
}

  app.append($(`<a class="back" href="#/profile">← в профиль</a>
    <h1>Ключи ${hintDot('Кто ждёт, сколько ждёт и когда снова заработает.')}</h1>`));

  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Занято прямо сейчас</div>
    ${(d.busy || []).length ? d.busy.map(b => `<div class="stage">
        <div class="dot ${b.percent >= 90 ? 's-error' : b.percent > 0 ? 's-running'
          : 's-idle'}">${b.percent >= 90 ? '!' : b.percent > 0 ? '◐' : '·'}</div>
        <div class="body">
          <div class="name">${esc(b.provider)}${b.own ? ' · свои ключи' : ''}</div>

  </div>`));

  // Серверные подписки общие на всех — блок видит и меняет только администратор
  // (проверка на сервере; здесь — лишь чтобы не показывать пустой отказ).

  app.append($(`<div class="card" style="margin-bottom:16px">

      </tr></thead><tbody>${d.providers.map(p => `<tr>
        <td style="font-weight:600">${esc(p.provider)}</td>

  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Отдыхающие ключи</div>
    ${d.resting.length ? d.resting.map(r => `<div class="stage">
        <div class="dot s-queued">⏳</div>

          <div class="name">${esc(r.family)} · <span class="mono">${esc(r.mask)}</span></div>
          <div class="facts">проснётся через ${dur(r.left_sec)}${
            r.noticed_by_neighbour ? ' · лимит заметили при заказе текста или обложки' : ''}</div>
          <div class="note muted">${esc(r.why)}</div>
        </div></div>`).join('')
      : '<div class="empty">Все ключи в строю.</div>'}

  const fg = d.fastgen;
  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">FastGen</div>
    ${fg ? `<div class="stage">
        <div class="dot ${fg.expires_in_sec != null && fg.expires_in_sec <= 0 ? 's-error' : 's-done'}">${
          fg.expires_in_sec != null && fg.expires_in_sec <= 0 ? '!' : '✓'}</div>
        <div class="body">
          <div class="name">${fg.expires
            ? `Действует до ${esc(when(fg.expires))} — ${fg.expires_in_sec > 0
                ? `осталось ${esc(dur(fg.expires_in_sec))}`

              ? `за час израсходовано ${esc(fg.images_used != null ? fg.images_used : 'нет данных')} из ${esc(fg.images_limit)} картинок`
              : 'расход картинок неизвестен'}${fg.threads_limit != null
              ? ` · потоков занято ${esc(fg.threads_used != null ? fg.threads_used : 'нет данных')} из ${esc(fg.threads_limit)}` : ''}</div>

  app.append(ownKeysCard(d));
  app.append(promptChannelCard(d));

  if (d.unavailable && d.unavailable.length){

      <div class="sec">Чего отсюда не видно</div>
      ${d.unavailable.map(u => `<div class="stage">

// это была неправда: `done` означает только «расписание подтверждено», а выход на
// YouTube никто не проверял. Подтверждает его одна лишь поздняя проверка
// (`server/pub_verify.py`), и она поднимает фазу до `published` — сервер отдаёт такой
// слот отдельным состоянием `public` (`web/app.py` `_calendar`). Знак и цвет у них
// тоже разные: «✓» зелёным — факт, «→» цветом ожидания — только замысел.

/* ───────────────── машины заливки и профили AdsPower (§6.4 ТЗ) ─────────────────

// Занятость профиля тремя состояниями. «Не знаем» намеренно не выглядит как
// «свободен» (пунктир, а не заливка): человек, увидевший «свободен», откроет профиль
// руками — и если на самом деле там идёт чужая заливка, порвёт ей куки. Состояние
// считает сервер по `active_at` (когда занятость стала известна), а не браузер.
const PROFILE_BUSY = {
  busy: {dot: 's-running', mark: '●', pill: 's-running', title: 'занят'},
  free: {dot: 's-idle', mark: '·', pill: 's-idle', title: 'свободен'},
  unknown: {dot: 's-off', mark: '?', pill: 's-off', title: 'не знаем'},
};

function profileRowHtml(p){
  const hostLabel = p.host ? esc(p.host.title || p.host.code) : 'машина неизвестна';
  const facts = [p.group_name, p.remark].filter(Boolean).map(esc).join(' · ');
  const st = PROFILE_BUSY[p.busy] || PROFILE_BUSY.unknown;
  const why = p.busy === 'unknown' && p.busy_why ? esc(p.busy_why) : '';
  return `<div class="stage pitem">
    <div class="dot ${st.dot}">${st.mark}</div>
    <div class="body">
      <div class="pline"><span class="name">${esc(p.title || p.serial)}</span>
        <span class="facts mono">№${esc(p.serial)}</span>
        <span class="pill">${hostLabel}</span>
        <span class="pill ${st.pill}" title="${why}">${st.title}</span>
        ${p.missing_since ? '<span class="pill s-error">на машине больше нет</span>' : ''}</div>
      ${why ? `<div class="note muted">${why}</div>` : ''}
      ${facts ? `<div class="note muted">${facts}</div>` : ''}
    </div></div>`;
}

// Окно добавления/правки машины — тем же приёмом, что `channelPresetModal`.
function hostModal(id, hosts, onSaved){
  const creating = id == null;
  const cur = creating ? {} : (hosts.find(h => h.id === id) || {});
  modal(creating ? 'Новая машина заливки' : `Машина «${cur.title || cur.code}»`, `
    <div class="fldrow"><label for="h-code">Код</label>
      <input id="h-code" value="${esc(cur.code || '')}" style="width:200px"
        placeholder="minsk"></div>
    <div class="fldrow"><label for="h-title">Название</label>
      <input id="h-title" value="${esc(cur.title || '')}" style="width:300px"></div>
    <div class="fldrow"><label for="h-url">Адрес AdsPower</label>
      <input id="h-url" value="${esc(cur.adspower_url || '')}" style="width:300px"
        placeholder="http://127.0.0.1:50325"></div>
    <div class="fldrow"><label for="h-note">Заметка</label>
      <input id="h-note" value="${esc(cur.note || '')}" style="width:100%"></div>`,
    {ok: creating ? 'Добавить' : 'Сохранить', onOk: async (box, close) => {
      const payload = {
        code: box.querySelector('#h-code').value,
        title: box.querySelector('#h-title').value,
        adspower_url: box.querySelector('#h-url').value,
        note: box.querySelector('#h-note').value,
      };
      if (creating) await post('/ui/hosts', payload);
      else await post(`/ui/hosts/${id}`, payload);
      close();
      await onSaved();
    }});
}

// Опись одной машины — общая для кнопки у строки машины и для «Обновить все» на
// карточке профилей: второй запрос к той же машине сервер и так отклонит (ФТ §5.13),
// но здесь опись машин запускается заведомо по одной, последовательно (§7, Фаза 4).
async function refreshHost(id, name){
  try{
    const r = await post(`/ui/hosts/${id}/refresh-profiles`);
    toast(`«${name}»: найдено ${r.found} · новых ${r.new} · вернулось ${r.reappeared} `
        + `· пропало ${r.missing_now} · открыто сейчас ${r.active_now}`, 'ok');
    return {ok: true, r};
  }catch(e){
    // Честная ошибка (ФТ §5.9/§9): старые данные не трогаем, список не пустеет,
    // просто говорим словами, что не вышло.
    toast(`«${name}»: ${e.message}`);
    return {ok: false, error: e.message};
  }
}

  hostsCard.querySelectorAll('button.host-status').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await post(`/ui/hosts/${b.dataset.id}/status`, {status: b.dataset.to}); await rerender(); }
    catch(e){ b.disabled = false; toast(e.message); }
  });
  hostsCard.querySelectorAll('button.host-refresh').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const res = await refreshHost(Number(b.dataset.id), b.dataset.name);
    if (res.ok) await rerender();
    else b.disabled = false;
  });

  let profiles = [], profErr = null;
  try{ profiles = (await api('/ui/profiles')).profiles || []; }
  catch(e){ profErr = e.message; }

  const profilesCard = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec stage-head"><span class="grow">Профили AdsPower ${hintDot(
      'Все профили со всех машин сразу: где живёт номер, занят ли он сейчас и не '
      + 'пропал ли он с машины при последней описи. «Не знаем» — это не «свободен»: '
      + 'значит, свежих сведений о занятости нет, и открывать профиль руками опасно.')}</span>
      <button class="ghost small" id="prof-refresh-all">Обновить все</button></div>
    ${profErr
      ? `<div class="secbody"><div class="note bad">Список профилей прочитать не удалось: ${
          esc(profErr)}</div></div>`

                         : '<div class="empty">Профилей нет — опросите машину выше.</div>')}
  </div>`).firstElementChild;
  container.append(profilesCard);
  foldRefCard(profilesCard, 'profiles', profiles.length
    ? `${profiles.length} ${plural(profiles.length, 'профиль', 'профиля', 'профилей')}` : '');

  // Опись всех активных машин по очереди, одна за другой (не параллельно — предел
  // 1 запрос/сек у каждой машины свой, но сервер и так отклонил бы одновременный
  // повторный запуск описи, а параллельность здесь ничего не даёт, кроме риска). Отказ
  // одной машины не останавливает остальные — у каждой свой тост с итогом или ошибкой.
  profilesCard.querySelector('#prof-refresh-all').onclick = async () => {

}

/* Справочники длинные — профилей на машине полсотни, и развёрнутыми они заслоняют всё
   остальное (жалоба владельца 24.09.2026). Поэтому карточки сворачиваются, а в полосе
   заголовка остаётся счёт: «52 профиля» видно и свёрнутым. Открытое состояние помнится
   на время сессии — перерисовка после описи не должна закрывать то, что человек открыл. */
const REF_FOLD_OPEN = {};

function foldRefCard(card, key, summary){
  const sec = card.querySelector('.sec');
  if (!sec) return;
  const open = !!REF_FOLD_OPEN[key];
  sec.classList.add('stage-head');
  if (!sec.querySelector('.grow')){
    const grow = document.createElement('span');
    grow.className = 'grow';
    while (sec.firstChild) grow.append(sec.firstChild);
    sec.append(grow);
  }
  if (summary){
    const count = document.createElement('span');
    count.className = 'note muted refcount';
    count.textContent = summary;
    sec.querySelector('.grow').append(count);
  }
  const btn = $(iconBtn('fold', 'expand', open ? 'Свернуть' : 'Развернуть', '',
                        `aria-expanded="${open ? 'true' : 'false'}"`)).firstElementChild;
  sec.append(btn);
  card.classList.toggle('folded', !open);
  btn.onclick = () => {
    const now = card.classList.contains('folded');
    REF_FOLD_OPEN[key] = now;
    card.classList.toggle('folded', !now);
    btn.setAttribute('aria-expanded', now ? 'true' : 'false');
    btn.title = now ? 'Свернуть' : 'Развернуть';
    btn.setAttribute('aria-label', now ? 'Свернуть' : 'Развернуть');
  };
}

/* Строка с подписчиками на плитке канала. Снимка нет — строки нет: пустое место
   честнее прочерка, который выглядит как «ноль подписчиков». */
function tileStats(st){
  if (!st || !st.day) return '';
  const d7 = (st.delta || {})['7'] || {};
  const subs = st.hidden ? 'подписчики скрыты' : `${bigNum(st.subs)} подписчиков`;
  const up = (d7.subs === null || d7.subs === undefined) ? ''
    : ` · <span class="delta ${d7.subs > 0 ? 'up' : d7.subs < 0 ? 'down' : ''}">${
        d7.subs > 0 ? '+' : d7.subs < 0 ? '−' : ''}${bigNum(Math.abs(d7.subs))}</span>
        <span class="muted">за неделю</span>`;
  return `<div class="meta" style="margin-top:7px">${subs}${up}</div>`;
}

async function viewChannels(){

  app.innerHTML = '';
  // Кнопки — в строке заголовка, как на «Проектах» и «Пресетах» (владелец 22.09.2026:

  app.append(bar);

  // Ссылки приходят общим списком, а каналов полтораста: раскладывать их по одному
  // каналу — полтораста заходов в карточки (владелец 30.09.2026).
  bar.querySelector('#spread').onclick = () => { location.hash = '#/spread'; };

  bar.querySelector('#impch').onclick = () => {

    const form = $(`<div class="card" id="imp-form" style="margin-bottom:16px">

      err.innerHTML = ''; res.innerHTML = '';
      try{
        const out = await post('/ui/channels/import',
                               {payload: form.querySelector('#pl').value});
        // Отклонённые строки показываем поимённо: импорт, который «прошёл», а половину
        // выбросил молча, хуже отказа.
        res.innerHTML = `<div class="res">
          Заведено новых: <b>${out.created}</b> · обновлено: <b>${out.updated}</b>
          · отклонено: <b>${out.rejected.length}</b>
          ${out.rejected.length ? `<h3>Что отклонено и почему</h3><ul>${
            out.rejected.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
          <button class="ghost" id="again">Обновить список</button></div>`;
        res.querySelector('#again').onclick = () => render();
      }catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  };
  // Пункт 6.1 ТЗ: поле ID канала необязательное — канал иногда заводят раньше, чем
  // узнают его настоящий ID на YouTube (см. также `pub_schema.py`, `pub_ui.clean_uc`).
  bar.querySelector('#newch').onclick = async () => {
    if (document.getElementById('newch-form')) return;
    // Язык выбирается списком, а не вписывается руками (18.09.2026): свой код языка
    // канала потом не совпадёт с картой голосов пресета, и ролик выйдет без голоса.
    let langs = [];
    try{ langs = (await api('/ui/channels/new')).languages || []; }
    catch(e){ toast(e.message); }
    const form = $(`<div class="card" id="newch-form" style="margin-bottom:16px">
      <div class="sec">Новый канал</div>
      <div class="secbody">
      <div id="err"></div>
      <div class="fldrow"><label>ID канала</label>
        <input id="uc" placeholder="UCK8sQmJBp8GCxrOtXWBpyEA" style="width:340px"></div>
      <div class="note muted">Необязательно — можно завести канал раньше, чем узнаете
        его ID. Выпуски на таком канале не заводятся, пока ID не задан. Вписать ID
        можно будет позже, на вкладке «Настройки» этого канала — и только один раз.</div>
      <div class="fldrow"><label>Название</label><input id="nm" style="width:340px"></div>
      <div class="fldrow"><label>Язык / ниша</label>
        ${langs.length
          ? `<select id="lg" style="width:230px"><option value="">— не выбран —</option>${
              langs.map(l => `<option value="${esc(l.value)}">${esc(l.title)}</option>`).join('')
            }</select>`
          : `<input id="lg" placeholder="pl" style="width:70px">`}
        <input id="nc" style="width:240px" placeholder="ниша"></div>
      <div class="note muted">Расписание, пресеты и профиль — в карточке,
        она откроется сразу.</div>
      <div style="margin-top:12px"><button id="go">Создать</button>
        <button class="ghost" id="no">Отмена</button></div>
      </div>
    </div>`);
    bar.after(form);
    const err = form.querySelector('#err');
    form.querySelector('#no').onclick = () => form.remove();
    form.querySelector('#go').onclick = async () => {
      err.innerHTML = '';
      try{
        const out = await post('/ui/channels', {
          uc: form.querySelector('#uc').value, name: form.querySelector('#nm').value,
          lang: form.querySelector('#lg').value, niche: form.querySelector('#nc').value});
        location.hash = '#/channel/' + out.id;
      }catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  };

  if (!d.channels.length){
    // Ссылка ведёт к той же кнопке в шапке: у заведения канала своего адреса нет, форма
