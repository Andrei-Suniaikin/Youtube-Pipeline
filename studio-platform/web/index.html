      </span>
    </div>

    <div id="tx-auto">
      <div class="lh" style="display:flex;margin-bottom:6px"><label class="k"
        for="tx-any">Ссылка на ролик-донор или готовый текст сценария</label>${
        hintDot('И то и другое вставляется в одно и то же поле — сервер сам разбирает, '
        + 'что ему дали.')}</div>
      <textarea id="tx-any" rows="1" style="min-height:0"
        placeholder="https://www.youtube.com/watch?v=… — или вставьте сюда сам текст"
        >${esc(st.any)}</textarea>
      <div class="note" id="tx-seen"></div>
    </div>

    <div id="tx-topic-box" hidden>
      <div class="lh" style="display:flex;margin-bottom:6px"><label class="k"
        for="tx-one">Тема</label>${hintDot(topicMode.note)}</div>
      <input id="tx-one" style="width:100%;box-sizing:border-box"
        placeholder="О чём должен быть ролик" value="${esc(st.topic)}">
    </div>

    <div class="note muted" id="tx-keep-head" style="margin-top:16px;
      border-top:1px solid var(--line);padding-top:12px">Бесплатно и сразу — сценарий
      в самом проекте</div>
    <div id="tx-keep-row" style="margin-top:8px;display:flex;gap:10px;align-items:center;
      flex-wrap:wrap">
      <button class="ghost" id="tx-keep">Сохранить сценарий</button>
      <span class="muted" id="tx-keep-why" style="font-size:12.5px"></span>
    </div>

    <div class="note muted" style="margin-top:18px;border-top:1px solid var(--line);
      padding-top:12px">Платно — заказать текст у рерайта</div>
    <div id="tx-preset-box" style="margin-top:10px">
      <label class="k" style="display:block;margin-bottom:6px">Бриф</label>
      <select id="tx-preset"><option value="">— выберите бриф —</option>
        ${td.presets.generation.map(x => `<option ${x === st.preset ? 'selected' : ''}
          >${esc(x)}</option>`).join('')}</select>
    </div>
    <div style="margin-top:10px">
      <label class="k" style="display:block;margin-bottom:6px">Модель</label>
      <select id="tx-model">${td.models.map(m => `<option value="${esc(m.value)}"
        ${m.value === st.model ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}</select>
    </div>
    <div style="margin-top:10px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="tx-langs">${td.languages.map(l => `<label
        data-code="${esc(l.code)}"><input type="checkbox"
        ${st.langs.has(l.code) ? 'checked' : ''}>${esc(l.title)}</label>`).join('')}</div>
    </div>
    <div class="note warn" id="tx-warn" hidden></div>
    <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button id="tx-go">Получить текст</button>
      <span class="muted" id="tx-go-why" style="font-size:12.5px"></span>
    </div>
    <div id="tx-jobs"></div>
    </div></div>`);
  // Готовый сценарий — первым блоком и сразу на виду (владелец 22.09.2026: «не особо
  // понятно, где готовый текст; сделать так, чтобы он лежал сразу, плюс возможность
  // просмотреть»). Раньше он прятался в свёрнутом блоке посреди «Откуда взять», между
  // бесплатным и платным действиями. Правка — там же, по «Править».
  const scnCard = $(`<div class="card scn" style="margin-bottom:16px">
    <div class="sec stage-head"><span class="grow">Сценарий проекта</span>
      <span class="note muted" id="src-sum" style="margin:0"></span>
      <button type="button" class="ghost small" id="src-read">Читать целиком</button>
      <button type="button" class="ghost small" id="src-edit"
        aria-expanded="false">Править</button></div>
    <div class="secbody">
      <div class="scn-preview" id="src-preview"></div>
      <details id="src-box">
        <summary>Править</summary>
        <textarea id="src-text">${esc(d.source)}</textarea>
        <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="ghost" id="src-save">Сохранить текст</button>
          <span class="muted" style="font-size:12.5px">правка уходит в сам проект
            (source.txt) — то, что пойдёт в озвучку</span>
        </div>
        <div class="note muted">Edge режет текст по строкам/абзацам — короткие абзацы
          могут потеряться при озвучке этим движком.</div>
      </details>
    </div></div>`);
  app.append(scnCard);
  app.append(card);

  const anyBox = card.querySelector('#tx-any');
  const one = card.querySelector('#tx-one');
  const seenNote = card.querySelector('#tx-seen');
  const warnNote = card.querySelector('#tx-warn');
  const keep = card.querySelector('#tx-keep');
  const keepWhy = card.querySelector('#tx-keep-why');
  const go = card.querySelector('#tx-go');
  const goWhy = card.querySelector('#tx-go-why');
  const srcBox = scnCard.querySelector('#src-box');
  const srcText = scnCard.querySelector('#src-text');
  const srcPreview = scnCard.querySelector('#src-preview');
  const srcEdit = scnCard.querySelector('#src-edit');
  const srcRead = scnCard.querySelector('#src-read');
  const fname = card.querySelector('#tx-fname');
  const fdrop = card.querySelector('#tx-fdrop');
  const forget = card.querySelector('#or-forget');

  // «Взять в проект» (готовый рерайт из списка задач) кладёт текст в эту же textarea.
  // Она теперь внутри свёрнутого <details>, поэтому наружу отдаётся не она сама, а
  // обёртка с тем же `value`: запись раскрывает блок и обновляет подпись — иначе
  // человек не увидел бы, что текст приехал, и решил бы, что кнопка не сработала.
  // Что лежит в проекте (`source.txt`) — отдельно от поля правки. Превью, число знаков
  // и «Читать целиком» показывают ЗАПИСАННОЕ: именно оно уйдёт в озвучку. Иначе
  // несохранённая правка выглядела бы текстом проекта, «Сделать всё» озвучило бы
  // прежний текст, а правка пропала бы молча (ревью 22.09.2026, отмечено как деньги).
  let savedText = d.source || '';
  const scnDirty = () => srcText.isConnected && srcText.value !== savedText;
  const myScnHash = location.hash;
  const scnGuard = () => {
    if (scnDirty()){
      LEAVE_GUARD = {scenario: true, hash: myScnHash, keep: h => h === myScnHash,
                     dirty: scnDirty, what: 'Правка сценария не сохранена.',
                     drop: () => { srcText.value = savedText; }};
    }else if (LEAVE_GUARD && LEAVE_GUARD.scenario){
      LEAVE_GUARD = null;
    }
  };
  const markSaved = text => { savedText = text; paintScenario(); scnGuard(); };
  SCENARIO_DIRTY = () => scnDirty() ? 'правка сценария не сохранена — «Сохранить текст» '
    + 'на вкладке «Сценарий»' : null;
  if (LEAVE_GUARD && LEAVE_GUARD.scenario) LEAVE_GUARD = null;   // от прошлой отрисовки
  const scenarioBox = {
    get value(){ return srcText.value; },
    // «Взять в проект» записывает текст на сервер и только потом кладёт его сюда.
    set value(v){ srcText.value = v; markSaved(v); },
  };

  function paintScenario(){
    const text = savedText;
    const n = text.length;
    const from = (origin.kind === 'file' && origin.file_name)
      ? ` · из файла «${origin.file_name}»` : '';
    const sum = scnCard.querySelector('#src-sum');
    const dirty = scnDirty();
    sum.textContent = (n ? `${n} ${plural(n, 'знак', 'знака', 'знаков')}${from}` : 'пусто')
      + (dirty ? ' · правка не сохранена' : '');
    sum.className = 'note ' + (dirty ? 'warn' : 'muted');
    // Превью — начало текста абзацами; целиком — по «Читать целиком». Пустой сценарий
    // говорит, откуда его взять, а не показывает пустую рамку.
    srcPreview.classList.toggle('empty', !n);
    srcPreview.textContent = n ? text.slice(0, 900)
      : 'Сценария пока нет — возьмите его ниже: по ссылке на ролик, из готового текста '
        + 'или по теме. Или впишите вручную.';
    srcRead.hidden = !n;
    srcEdit.textContent = srcBox.open ? 'Свернуть правку' : (n ? 'Править' : 'Вписать вручную');
    srcEdit.setAttribute('aria-expanded', String(srcBox.open));
  }
  srcEdit.onclick = () => {
    srcBox.open = !srcBox.open;
    paintScenario();
    if (srcBox.open) srcText.focus();
  };
  srcBox.addEventListener('toggle', paintScenario);
  srcRead.onclick = () => readerModal('Сценарий проекта', savedText,
                                      scnCard.querySelector('#src-sum').textContent);

  // Что записано у проекта про источник — строкой над полем: откуда берётся сценарий, когда по
  // этому источнику последний раз платили и не расходится ли он со ссылкой выпуска.
  function paintOrigin(o){
    if (o && typeof o === 'object' && Object.keys(o).length) origin = o;
    const k = origin.kind || '';
    let text;
    if (k === 'link' && origin.donor_url) text = 'Записан донор: ' + origin.donor_url;
    else if (k === 'topic' && origin.topic) text = 'Записана тема: ' + origin.topic;
    else if (k === 'file') text = 'Сценарий взят из файла «'
      + (origin.file_name || 'без имени') + '»';
    else if (k === 'text') text = 'Сценарий вставлен текстом';
    else text = 'Откуда берётся сценарий, у проекта пока не записано.';
    // В одном поле `why` сервер склеивает до двух РАЗНЫХ мыслей: про источник в поле
    // («по этой ссылке заказывали текст 20.09 19:41») и, если у выпуска канала своя
    // ссылка, про неё («движок берёт её»). Вторую он приписывает последней, через
    // «; », и ровно тогда, когда отдаёт непустой `release_url` (`_project_origin` в
    // web/app.py). Печатать склейку целиком после ссылки выпуска, как было до
    // 21.09.2026, значит приписать выпуску чужой заказ: человек читает «по ЭТОЙ ссылке
    // заказывали», а платили по той, что в поле. Поэтому режем по последнему «; »:
    // голова — строке источника, хвост — строке выпуска.
    const why = origin.why || '';
    let ownWhy = why, relWhy = '';
    if (origin.release_url && why){
      const cut = why.lastIndexOf('; ');
      if (cut < 0){ ownWhy = ''; relWhy = why; }
      else { ownWhy = why.slice(0, cut); relWhy = why.slice(cut + 2); }
    }
    if (ownWhy) text += ' — ' + ownWhy;
    card.querySelector('#or-now').textContent = text;
    // Две разные ссылки у одного проекта: кнопки этого экрана возьмут запомненную,
    // а ночной движок — ссылку выпуска. Молчать об этом нельзя.
    const rel = card.querySelector('#or-release');
    rel.hidden = !origin.release_url;
    rel.innerHTML = origin.release_url
      ? `Ссылка выпуска канала: ${esc(origin.release_url)}`
        + (relWhy ? `<div class="muted">${esc(relWhy)}</div>` : '')
      : '';
    // Забыть можно только СВОЮ запись. Ссылка выпуска живёт в плане канала: пульт её
    // не заводил и стереть отсюда не может — кнопка там была бы обещанием впустую.
    forget.hidden = !(origin.donor_url && origin.from !== 'release');
    paintScenario();
  }

  // ── разбор поля: спрашиваем сервер, своих правил не заводим ──────────────────
  let seenTimer = null;
  const currentSeen = () => (st.seen && st.seenFor === anyBox.value) ? st.seen : null;

  function paintSeen(){
    const seen = currentSeen();
    if (!seen){
      seenNote.className = 'note muted';
      seenNote.textContent = anyBox.value.trim()
        ? 'разбираем, что это…'
        : 'ссылка на ролик-донор или текст сценария — что именно, определит сервер';
    }else if (!seen.mode){
      seenNote.className = 'note bad';
      seenNote.textContent = 'Так заказывать нельзя: ' + (seen.problem || seen.title);
    }else{
      seenNote.className = 'note muted';
      seenNote.textContent = 'Распознано: ' + seen.title
        + (seen.note ? ' — ' + seen.note : '');
    }
    const warn = (seen && seen.warn) ? seen.warn : '';
    warnNote.hidden = !warn;
    warnNote.textContent = warn;
    paintActions();
  }

  async function askSeen(){
    const asked = anyBox.value;
    if (!asked.trim()){ st.seen = null; st.seenFor = null; paintSeen(); return null; }
    try{
      const out = await post('/ui/source/detect', {value: asked, project_id: p.id});
      // Пока ответ шёл, человек мог допечатать: старый разбор относится к другому
      // тексту, и показывать его — врать про то, что уедет по кнопке.
      if (!card.isConnected || anyBox.value !== asked) return null;
      st.seen = out; st.seenFor = asked;
      paintSeen();
      await rememberLink(out);
      return out;
    }catch(e){
      if (!card.isConnected || anyBox.value !== asked) return null;
      st.seen = null; st.seenFor = null;
      seenNote.className = 'note bad';
      seenNote.textContent = `Не удалось разобрать поле: ${e.message}. Разбор бесплатный `
        + 'и ничего не заказывает — повторите ввод или обновите страницу.';
      warnNote.hidden = true;
      paintActions();
      return null;
    }
  }

  const ensureSeen = async () => currentSeen() || await askSeen();

  // Та же ли это ссылка, что записана у проекта. По идентификатору ролика, а не по
  // строке: голый id сервер собирает в полную ссылку, и `youtu.be/X` с
  // `watch?v=X` — один донор. Переписывать запись из-за формы адреса незачем.
  const sameVideo = (seen, o) => !!(seen && o && (
    (seen.video_id && seen.video_id === o.video_id) || seen.value === o.donor_url));

  // Ссылка донора запоминается сама, как только сервер её распознал (просьба
  // владельца 21.09.2026: «блок с запомнить ссылку убираем, ссылка запоминается
  // сама»). Это ровно та запись, что делала кнопка, — бесплатная, без заказа и без
  // `source.txt`, — поэтому спрашивать о ней незачем.
  // Не пишет то, что уже записано, и не возвращает ссылку, которую человек только что
  // велел забыть: она осталась в поле, а состояние вкладки переживает перерисовку
  // экрана, и без этой пометки забытая ссылка записалась бы обратно при следующем
  // же открытии вкладки. Пометку снимает только правка поля.
  async function rememberLink(seen){
    if (!seen || seen.kind !== 'link' || !seen.value) return;
    if (sameVideo(seen, origin) || st.forgot === seen.value) return;
    try{
      const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/source`,
                             {link: seen.value});
      st.linkFail = null;
      if (!card.isConnected) return;
      paintOrigin(out.origin);
      paintActions();
      // Разбор спрошен ДО записи, и его предупреждение («у проекта записана другая
      // ссылка — заказ по новой её заменит») после записи уже неправда. Спрашиваем
      // заново: разбор бесплатный, а предупреждение о повторе — про деньги и должно
      // быть свежим. Повторной записи не будет: ссылка теперь та же, что записана.
      if (st.seenFor != null && st.seenFor === anyBox.value) await askSeen();
    }catch(e){
      st.linkFail = {value: seen.value, message: e.message};
      if (!card.isConnected) return;
      paintActions();
    }
  }

  function paintActions(){
    const topic = (st.mode === 'topic');
    const seen = currentSeen();
    const langsOk = st.langs.size > 0;
    const kind = seen ? seen.kind : '';
    // Запись ссылки не прошла — это держится на экране, пока ссылка та же, и кнопка
    // возвращается как повтор. Без этого любая следующая перерисовка (галочка языка,
    // выбор брифа) писала поверх отказа «ссылка запоминается сама», и человек верил,
    // что обложка её подхватит.
    const linkFail = (kind === 'link' && st.linkFail && st.linkFail.value === seen.value)
      ? st.linkFail : null;
    keep.hidden = (kind === 'link') && !linkFail;
    if (linkFail){
      keep.textContent = 'Запомнить ссылку ещё раз';
      keep.disabled = false;
      keepWhy.textContent = 'ссылку запомнить не удалось: ' + linkFail.message;
    }else if (kind === 'link'){
      keepWhy.textContent = sameVideo(seen, origin)
        ? 'ссылка запомнена у проекта — вкладка «Обложка» подставит её сама'
        : (st.forgot === seen.value
           ? 'эту ссылку велели забыть — поправьте поле, и она запомнится снова'
           : 'ссылка запоминается у проекта сама — денег это не стоит');
    }else if (kind === 'text'){
      keep.textContent = 'Сохранить сценарий';
      keep.disabled = false;
      keepWhy.textContent = `${seen.chars} знаков лягут в сценарий проекта — сразу и `
                          + 'бесплатно, рерайт не зовём';
    }else{
      keep.textContent = 'Сохранить сценарий';
      keep.disabled = true;
      keepWhy.textContent = seen ? (seen.problem || '')
        : (anyBox.value.trim() ? 'ждём разбор поля' : 'поле источника пустое');
    }
    go.disabled = topic ? !(langsOk && st.preset) : !(seen && seen.mode && langsOk);
    let why;
    if (topic){
      why = !st.preset ? 'выберите бриф — без него с нуля не пишем'
          : !langsOk ? 'выберите хотя бы один язык'
          : 'модель напишет текст по теме и брифу — это платный вызов';
    }else if (!seen){
      why = anyBox.value.trim() ? 'ждём разбор поля' : 'заполните поле источника';
    }else if (!seen.mode){
      why = seen.problem || 'так заказывать нельзя';
    }else if (!langsOk){
      why = 'выберите хотя бы один язык';
    }else{
      why = seen.mode === 'link'
        ? 'донор → субтитры → рерайт: создастся платная задача'
        : 'текст уйдёт в рерайт как есть — это платный вызов';
    }
    goWhy.textContent = why;
  }

  // Поле по умолчанию — ОДНА строка (владелец просил дословно: «чтобы в строку он и
  // текст и ссылку распознавал»), и растёт под содержимое: вставляют в него и ссылку
  // в 40 знаков, и сценарий в 12 000 — одна высота не годится обоим. Отсюда `rows="1"`
  // и `min-height:0` в разметке: без них браузер и общий стиль textarea держали бы
  // высоту в несколько строк, что бы ни лежало в поле.
  // Зовётся только когда поле ПОКАЗАНО: у скрытого scrollHeight равен нулю, и
  // высота вышла бы нулевой. За показ отвечает `paintMode` — он же и меряет.
  function grow(){
    anyBox.style.height = 'auto';
    anyBox.style.height = Math.min(anyBox.scrollHeight + 2, 320) + 'px';
  }

  function paintMode(){
    const topic = (st.mode === 'topic');
    card.querySelector('#tx-auto').hidden = topic;
    card.querySelector('#tx-filebox').hidden = topic;
    card.querySelector('#tx-topic-box').hidden = !topic;
    card.querySelector('#tx-preset-box').hidden = !topic;
    card.querySelector('#tx-keep-head').hidden = topic;
    // Не `hidden`: у строки свой inline display:flex, а он сильнее браузерного
    // правила [hidden]{display:none} — с атрибутом строка так и осталась бы на
    // экране. Проверено в браузере, поэтому здесь именно style.display.
    card.querySelector('#tx-keep-row').style.display = topic ? 'none' : 'flex';
    // Поле на экране — меряем и растим его ЗДЕСЬ, и только здесь: и при первой
    // отрисовке, и при возврате из «с нуля по теме». Пока оно скрыто, мерить нечего
    // (scrollHeight у скрытого ноль), а вкладка перерисовывается после каждого
    // действия — и текст в поле переживает перерисовку, высота обязана тоже.
    if (!topic) grow();
    paintActions();
  }

  function paintFile(){
    fname.textContent = st.fileName ? `файл: ${st.fileName}` : 'файл не выбран';
    fdrop.hidden = !st.fileName;
  }

  function dropFile(silent){
    const was = st.fileText;
    st.fileName = ''; st.fileText = '';
    paintFile();
    if (silent) return;
    if (anyBox.value === was){
      anyBox.value = ''; st.any = ''; st.seen = null; st.seenFor = null;
      grow();
      paintSeen();
      toast('Файл снят, поле очищено', 'ok');
    }else{
      // Текст правили руками после чтения файла — выкидывать правку молча нельзя.
      toast('Файл снят. Текст в поле вы правили — он остался, его всё ещё можно '
            + 'сохранить', 'ok');
    }
  }

  anyBox.oninput = () => {
    st.any = anyBox.value;
    st.forgot = null;                       // поле правили — воля «забыть» исчерпана
    st.seen = null; st.seenFor = null;      // старый разбор — про другой текст
    grow();
    paintSeen();
    clearTimeout(seenTimer);
    seenTimer = setTimeout(askSeen, 300);   // разбор бесплатный, но дёргать на каждую букву незачем
  };
  one.oninput = () => { st.topic = one.value; };
  fdrop.onclick = () => dropFile(false);

  // Забыть записанную ссылку. Сервер это умеет с самого начала (пустая ссылка чистит
  // запись), а экран такого запроса не слал — убрать записанного донора было нечем,
  // только заменить его другим. Спрашиваем окном: другой копии ссылки у проекта нет,
  // и «забыть» здесь значит «навсегда».
  forget.onclick = () => confirmModal('Забыть записанную ссылку донора?',
    'У проекта перестанет быть записан донор, и другой копии этой ссылки у него нет. '
    + 'Уже поставленные по ней задачи останутся: забывается запись, а не задача.',
    async () => {
      try{
        const was = currentSeen();
        const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/source`,
                               {link: ''});
        st.forgot = (was && was.kind === 'link') ? was.value : (origin.donor_url || null);
        paintOrigin(out.origin);
        // Разбор поля заново НЕ спрашиваем, хотя ответ сервера теперь был бы другим:
        // в нём висит предупреждение «по этой ссылке уже заказывали», и оно про
        // потраченные деньги, а не про запись. Забыли мы запись — заказ остался, и
        // снимать с человека это предупреждение было бы враньём в дорогую сторону.
        toast('Ссылка забыта. В поле она осталась, но сама больше не запомнится — '
              + 'поправьте поле, если передумаете.', 'ok');
        paintActions();
      }catch(e){ toast(e.message); }
    });

  // Файл .txt читает БРАУЗЕР — серверу нужен текст, а не файл, и он уже едет тем же
  // полем. TextDecoder с fatal — единственный способ отличить не-UTF-8 от кракозябр,
  // которые иначе озвучат за деньги. Те же правила, что в карточках пакета.
  card.querySelector('#src-file').onchange = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try{
      const text = new TextDecoder('utf-8', {fatal: true}).decode(await file.arrayBuffer());
      anyBox.value = text;
      st.any = text;
      st.fileName = file.name;
      st.fileText = text;
      paintFile();
      grow();
      paintSeen();
      await askSeen();
      toast(`Файл прочитан: ${text.length} знаков — проверьте и нажмите `
            + '«Сохранить сценарий»', 'ok');
    }catch(readErr){
      toast(`Файл «${file.name}» не в UTF-8 — пересохраните его в этой кодировке. `
            + 'Денег не потрачено: файл никуда не уходил.');
    }finally{ e.target.value = ''; }
  };

  card.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    st.mode = b.dataset.mode;
    card.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
    paintMode();
  });
  langPicker(card.querySelector('#tx-langs'));
  card.querySelectorAll('#tx-langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? st.langs.add(l.dataset.code) : st.langs.delete(l.dataset.code);
      paintActions(); };
    sync();
    box.onchange = sync;
  });
  card.querySelector('#tx-model').onchange = e => st.model = e.target.value;
  card.querySelector('#tx-preset').onchange = e => { st.preset = e.target.value;
    paintActions(); };

  // Положить вставленный текст в сценарий проекта. Отдельной функцией, потому что
  // зовётся из двух мест: сразу — когда затирать нечего, и из ответа «Да» на вопрос
  // о замене.
  async function saveScenario(text){
    const body = {text};
    if (st.fileName) body.file = st.fileName;   // сервер пометит источник как файл
    const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/source`, body);
    srcText.value = text;
    markSaved(text);
    // Поле освобождается: тот же текст и в поле, и в сценарии ниже — это ровно та
    // вторая копия, из-за которой владелец не понимал, что откуда.
    anyBox.value = ''; st.any = ''; st.seen = null; st.seenFor = null;
    dropFile(true);
    grow();
    paintOrigin(out.origin);
    paintSeen();
    toast(`Сценарий сохранён — ${text.length} знаков. Поле свободно для нового `
          + 'источника.', 'ok');
  }

  // Бесплатное действие: положить источник в проект. Что именно положится — ссылка
  // или сценарий, — сказано на самой кнопке ещё до нажатия.
  keep.onclick = async () => {
    const seen = await ensureSeen();
    if (!seen){ toast('Поле не разобрано — повторите ввод'); return; }
    keep.disabled = true;
    try{
      if (seen.kind === 'link'){
        await rememberLink(seen);          // кнопка у ссылки скрыта; сюда — только гонкой
      }else if (seen.kind === 'text'){
        const text = anyBox.value;
        const cur = srcText.value;
        // Сценарий у проекта уже есть, и он ДРУГОЙ. Сохранение затирает `source.txt`
        // насовсем — второй копии у проекта нет, а рядом, на этом же экране, висит
        // предупреждение «в проекте уже есть сценарий». Молча стереть его после такой
        // подписи — худшее, что экран может сделать: человек прочитал, что текст цел.
        if (cur.trim() && cur !== text){
          confirmModal('Заменить сценарий проекта?',
            `В проекте уже есть сценарий — ${cur.length} знаков. Он будет заменён `
            + `вставленным (${text.length} знаков), и вернуть прежний будет неоткуда.`,
            // Окно закрывается ДО сохранения, и его `.m-err` показать уже нечему —
            // поэтому отказ ловим здесь и говорим тостом.
            () => saveScenario(text).catch(e => toast(e.message)));
          return;                      // сохранение уйдёт из ответа «Да», не отсюда
        }
        await saveScenario(text);
      }else{
        toast('Сохранять нечего: ' + (seen.problem || seen.title));
      }
    }catch(e){ toast(e.message); }
    finally{ keep.disabled = false; paintActions(); }
  };

  scnCard.querySelector('#src-save').onclick = async () => {
    const btn = scnCard.querySelector('#src-save');
    btn.disabled = true;
    try{
      const text = srcText.value;
      const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/source`, {text});
      markSaved(text);
      paintOrigin(out.origin);
      toast('Текст сохранён', 'ok');
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };
  srcText.oninput = () => { paintScenario(); scnGuard(); };

  // Платное действие: заказ у рерайта. Режим больше не выбирают руками — его назвал
  // сервер при разборе поля (`seen.mode`), и источник уезжает нормализованным
  // (`seen.value`): голый идентификатор ролика сервер уже собрал в ссылку.
  go.onclick = async () => {
    const topic = (st.mode === 'topic');
    let mode = 'topic';
    let source = one.value;
    if (!topic){
      const seen = await ensureSeen();
      if (!seen || !seen.mode){
        toast(seen ? (seen.problem || 'так заказывать нельзя')
                   : 'поле источника не разобрано — повторите ввод');
        return;
      }
      mode = seen.mode;
      source = seen.value;
    }
    go.disabled = true;
    try{
      const out = await post('/ui/text', {
        mode, source, languages: [...st.langs], model: st.model,
        preset: st.preset, project_id: p.id,
      });
      st.lastJob = out.job && out.job.job_id;
      paintOrigin(out.origin);        // источник запомнен сервером — показать это сразу
      toast('Задача текста создана', 'ok');
      await refreshScenarioJobs(card.querySelector('#tx-jobs'), p.id, scenarioBox);
    }catch(e){ toast(e.message); }
    finally{ go.disabled = false; paintActions(); }
  };

  paintFile();
  paintOrigin(null);
  paintMode();                        // он же поставит высоту поля, если оно показано
  paintSeen();
  // Подставленную ссылку разбираем сразу: «по этой ссылке уже заказывали» нужно
  // знать ДО нажатия платной кнопки, а не после списания.
  if (anyBox.value.trim()) await askSeen();
  await refreshScenarioJobs(card.querySelector('#tx-jobs'), p.id, scenarioBox);

  // 3. Результат — план сцен/промпты.
  const mine = d.files.filter(g => (TAB_FILES.scenario || []).includes(g.code));
  if (mine.length) for (const g of mine) app.append(fileCard(d, g));
  else app.append(emptyResultCard());

  // 4. Лог задач вида prompts.
  app.append(jobsLogCard(d, 'scenario'));

  // 5. Прочие задачи проекта — виды, не относящиеся ни к одной из шести вкладок
  // (например `cards`/`pipeline`), были видны на старом «Обзоре» целиком; молча
  // прятать платную работу с экрана нельзя (review-feedback-F4 цикл 1, Issue 5).
  const knownKinds = new Set(Object.values(TAB_KINDS).flat());
  const other = (d.jobs || []).filter(j => !knownKinds.has(j.kind));
  if (other.length) app.append(jobsTableCard('Прочие задачи проекта', other, ''));
}

/* ───────────────────────── вкладка «Обложка» ───────────────────────── */
const COVER_STATE = {};
function coverState(pid){
  if (!COVER_STATE[pid]) COVER_STATE[pid] = {mode: 'url', langs: new Set(), preset: '',
                                             option: 0, edit: false, n: 3, lastJob: null,
                                             urls: '', urlsOffered: ''};
  return COVER_STATE[pid];
}

async function paintCoverTake(jobId, host, pid){
  try{
    const fd = await api(`/ui/files/cover/${encodeURIComponent(jobId)}`);
    if (!fd.files.length){
      host.innerHTML = '<span class="muted">Вариантов пока нет — обложка ещё не готова.</span>';
      return;
    }
    const url = f => `${API}/ui/files/cover/${encodeURIComponent(jobId)}/${
      encodeURIComponent(f.name)}`;
    host.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:12px">${fd.files.map(f => `
      <div style="text-align:center">
        <a href="${url(f)}" target="_blank"><img src="${url(f)}" style="height:96px;
          border-radius:6px;border:1px solid var(--line);display:block"></a>
        <button class="ghost small cv-take" data-name="${esc(f.name)}"
          style="margin-top:6px">Поставить обложкой проекта</button>
      </div>`).join('')}</div>`;
    host.querySelectorAll('.cv-take').forEach(btn => btn.onclick = async () => {
      btn.disabled = true;
      try{
        await post(`/ui/projects/${encodeURIComponent(pid)}/cover`,
                   {service_job_id: jobId, name: btn.dataset.name});
        toast('Обложка поставлена', 'ok');
        await viewProject(pid);         // перерисовать — новая обложка видна в «Результат»
      }catch(e){ toast(e.message); btn.disabled = false; }
    });
  }catch(e){
    host.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
  }
}

// Строка списка «задачи обложек проекта» — общая для первой отрисовки и
// для точечного дополнения тиком (`syncJobsTable`), см. `scenJobRowHtml` выше.
function coverJobRowHtml(j){
  return `<tr data-job="${esc(j.id)}" data-state="${esc(j.state)}" data-print="${esc(jobRowPrint(j))}">
    <td><div style="font-weight:600">${esc(j.title)}</div>
        <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
    <td class="jl-state">${jobListStateCellHtml(j, 'cover')}</td>
    <td class="muted when">${when(j.created)}</td>
  </tr>`;
}
// Тот же приём, что у «Сценария» (см. комментарии там, включая review-feedback-F4
// цикл 3, Issue 1/2 — тик правит таблицу на месте и проверяет актуальность экрана
// после каждого своего ответа), только источник — `GET /ui/covers` (как у #/covers).
async function refreshCoverJobs(box, pid){
  const key = jobListPollKey('cover', pid);
  stopJobLogPoll(key);
  const hashAtStart = location.hash;
  const st = coverState(pid);
  const cd = await api(`/ui/covers?project_id=${encodeURIComponent(pid)}`);
  if (location.hash !== hashAtStart || !box.isConnected) return;   // ушли со страницы, пока список грузился
  const jobs = cd.jobs.slice();
  if (st.lastJob != null){
    const i = jobs.findIndex(j => String(j.id) === String(st.lastJob));
    if (i > 0){ const [j] = jobs.splice(i, 1); jobs.unshift(j); }
  }
  box.innerHTML = `<div class="note muted" style="margin:14px 0 8px">Задачи обложек этого
    проекта ${hintDot('Здесь поставленные из этой вкладки, новые сверху. '
      + 'Нажмите на строку — покажутся готовые обложки.')}</div>
    ${jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Состояние</th><th>Создана</th></tr></thead>
      <tbody>${jobs.map(coverJobRowHtml).join('')}</tbody></table>`
      : '<div class="empty">У проекта задач обложек пока нет.</div>'}`;
  wireProjectJobRows(box, 'cover', 3, (jid, host) => paintCoverTake(jid, host, pid));

  if (!jobs.some(j => !JOB_LIST_TERMINAL.has(j.state))) return;   // все терминальны — опрашивать нечего
  let busy = false;
  const tick = async () => {
    if (busy) return;
    busy = true;
    try{
      const d2 = await api(`/ui/covers?project_id=${encodeURIComponent(pid)}`);
      if (location.hash !== hashAtStart || !box.isConnected){ stopOwnPoll(key, handle); return; }
      const jobs2 = d2.jobs.slice();
      if (st.lastJob != null){
        const i = jobs2.findIndex(j => String(j.id) === String(st.lastJob));
        if (i > 0){ const [j] = jobs2.splice(i, 1); jobs2.unshift(j); }
      }
      syncJobsTable(box, jobs2, 'cover', coverJobRowHtml, 3,
        (jid, host) => paintCoverTake(jid, host, pid));
      if (!jobs2.some(j => !JOB_LIST_TERMINAL.has(j.state))) stopOwnPoll(key, handle);
    }catch(e){
      // сеть иногда сбоит — список не стираем, следующий тик попробует снова
    }finally{ busy = false; }
  };
  // Два наложившихся вызова оба дошли сюда: снять уже записанный таймер, чтобы он не
  // выпал из реестра и не опрашивал сервис до перезагрузки страницы.
  stopJobLogPoll(key);
  const handle = setInterval(tick, 3000);
  LOG_TIMERS[key] = handle;
}

  // Обложку выпуска заказывает движок — в задачах этой вкладки её нет (04.10.2026,
  // владелец: «нажимаю посмотреть обложки и её не вижу»). Показываем её первой.

    const rc = $(`<div class="card" style="margin-bottom:16px">

  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Сделать обложку</div>
    <div class="secbody">
    <div class="modes">${cd.modes.map(m => `<button type="button" data-mode="${

      <select id="cv-preset"><option value="">— без пресета —</option>
        ${cd.presets.map(x => `<option ${x === st.preset ? 'selected' : ''}
          >${esc(x)}</option>`).join('')}</select>
    </div>
    <div style="margin-top:10px">
      <label class="k" style="display:block;margin-bottom:6px">Чем генерировать</label>
      <select id="cv-option">${cd.options.map((o, i) => `<option value="${i}"
        ${i === st.option ? 'selected' : ''}>${esc(o.label)}${
          o.admin_only ? ' — платит владелец' : ''}</option>`).join('')}</select>
    </div>
    <div style="margin-top:10px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="cv-langs">${cd.languages.map(l => `<label
        data-code="${esc(l)}"><input type="checkbox"
        ${st.langs.has(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div>
    </div>
    <div id="cv-edit-box" style="margin-top:10px"></div>
    <div class="note muted" style="margin-top:12px">Соотношение сторон —
      <b>${esc(cd.aspect)}</b>, всегда. У обложки YouTube оно одно.</div>
    <div style="margin-top:12px"><button id="cv-go">Запустить</button></div>
    <div id="cv-jobs"></div>
    </div></div>`);
  app.append(card);

  const fields = card.querySelector('#cv-fields');
  const editBox = card.querySelector('#cv-edit-box');
  const noteBox = card.querySelector('#cv-note');
  function paintFields(){
    const m = st.mode;
    // Текущий выбор языков — считан здесь же, при каждой отрисовке полей, а не из
    // снимка, сделанного один раз при открытии вкладки (Issue 2, review-feedback-F4
    // цикл 1): иначе отметка языка в режиме «По заголовку» не показывала поле
    // заголовка без полной перерисовки вкладки.
    const langs = [...st.langs];
    if (m === 'url'){
      // Ссылка, запомненная на вкладке «Сценарий», подставляется сама (просьба
      // владельца 21.09.2026) — но только в ПУСТОЕ поле и только один раз: стёртую
      // человеком обратно не возвращаем. Запуск по-прежнему за кнопкой, а откуда
      // взялась ссылка, сказано под полем — подстановка не должна выглядеть как
      // чужая правка.
      const known = (d.origin && (d.origin.donor_url || d.origin.release_url)) || '';
      // Подставленное нами и не тронутое человеком следует за запомненной ссылкой:
      // сменили или забыли её на «Сценарии» — меняется и здесь. Иначе в поле тихо
      // оставался прежний донор, подпись «подставлена» пропадала (он уже не совпадал
      // с запомненным), и платная обложка уходила по ролику, от которого отказались.
      if (st.urlsOffered && st.urls === st.urlsOffered && known !== st.urlsOffered){
        st.urls = '';
        st.urlsOffered = '';
      }
      if (known && st.urlsOffered !== known && !String(st.urls || '').trim()){
        st.urls = known;
        st.urlsOffered = known;
      }
      const offered = !!known && st.urls === known;
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px"
        >Ссылки на доноров, по одной в строке</label>
        <textarea id="cv-urls" placeholder="https://www.youtube.com/watch?v=…"
          >${esc(st.urls)}</textarea>
        <div class="note muted" id="cv-urls-from"${offered ? '' : ' hidden'}>${
          // Своей ссылки нет — сервер кладёт в `donor_url` ссылку выпуска и помечает
          // это `from: 'release'`. Называть её «запомненной на Сценарии» — неправда:
          // там её никто не запоминал.
          (d.origin && (d.origin.from === 'release' || !d.origin.donor_url))
            ? 'подставлена ссылка выпуска канала'
            : 'подставлена ссылка, запомненная на вкладке «Сценарий»'}</div>`;
      const ta = fields.querySelector('#cv-urls');
      ta.oninput = () => {
        st.urls = ta.value;
        fields.querySelector('#cv-urls-from').hidden = !(known && ta.value === known);
      };
    } else if (m === 'title'){
      fields.innerHTML = langs.length
        ? `<label class="k" style="display:block;margin-bottom:6px">Заголовок на
             каждый язык</label>${langs.map(l => `<div style="display:flex;gap:8px;
             align-items:center;margin-bottom:6px"><span class="muted"
             style="min-width:110px">${esc(l)}</span><input data-lang="${esc(l)}"
             class="cv-title-in" style="flex:1"></div>`).join('')}
           <label class="k" style="display:block;margin:10px 0 6px">Дополнение к промпту</label>
           <input id="cv-extra" style="width:100%;box-sizing:border-box">`
        : '<div class="note">Сначала выберите языки — заголовок задаётся на каждый отдельно.</div>';
    } else {
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px">Семя</label>
        <textarea id="cv-seed"></textarea>
        <label class="k" style="display:block;margin:10px 0 6px">Вариантов на язык</label>
        <input id="cv-n" type="number" min="1" max="8" value="${st.n}" style="width:90px">`;
    }
    const killed = cd.rules.find(r => r.when === 'edit');
    editBox.innerHTML = st.mode === 'url'
      ? `<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
           <input type="checkbox" id="cv-edit" ${st.edit ? 'checked' : ''}>
           <span><b>Редактировать превью моделью</b>${st.edit
             ? `<div class="note muted">Тогда не действуют: ${killed.kills.join(', ')} —
                 ${esc(killed.why)}.</div>` : ''}</span></label>`
      : `<div class="note muted">${esc((cd.rules.find(r => r.when === 'not_url') || {}).why
          || '')}.</div>`;
    const box = editBox.querySelector('#cv-edit');
    if (box) box.onchange = e => { st.edit = e.target.checked; paintFields(); };
  }
  // Подпись режима заполняется сразу при первой отрисовке (Issue 8, review-feedback-F4
  // цикл 1) — раньше #cv-note оставалась пустой, пока не нажать кнопку режима вручную.
  const initNote = cd.modes.find(x => x.key === st.mode);
  noteBox.textContent = initNote ? initNote.note : '';
  paintFields();
  card.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    st.mode = b.dataset.mode;
    card.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
    const note = cd.modes.find(x => x.key === st.mode);
    noteBox.textContent = note ? note.note : '';
    paintFields();
  });
  langPicker(card.querySelector('#cv-langs'));
  card.querySelectorAll('#cv-langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? st.langs.add(l.dataset.code) : st.langs.delete(l.dataset.code); };
    sync();
    box.onchange = () => { sync(); if (st.mode === 'title') paintFields(); };
  });
  card.querySelector('#cv-preset').onchange = e => st.preset = e.target.value;
  card.querySelector('#cv-option').onchange = e => st.option = Number(e.target.value);

  card.querySelector('#cv-go').onclick = async () => {
    const btn = card.querySelector('#cv-go');
    btn.disabled = true;
    try{
      // Провайдер и модель — из ТЕКУЩЕГО выбора на момент нажатия «Запустить», а не
      // из значения, посчитанного при отрисовке вкладки (Issue 1, review-feedback-F4
      // цикл 1): иначе смена пункта в списке «Чем генерировать» без полной
      // перерисовки уводила платный вызов не тому провайдеру, которого выбрал
      // человек — тот же дефект, что и в #/covers (см. viewCovers ниже).
      const curOpt = cd.options[st.option] || cd.options[0] || {};
      const body = {mode: st.mode, preset: st.preset, languages: [...st.langs],
                    provider: curOpt.provider || '', model: curOpt.model || '',
                    edit_preview: st.edit, project_id: p.id};
      if (st.mode === 'url'){
        body.urls = (card.querySelector('#cv-urls').value || '')
          .split(/\s+/).map(x => x.trim()).filter(Boolean);
      } else if (st.mode === 'title'){
        body.titles = {};
        card.querySelectorAll('.cv-title-in').forEach(i => {
          if (i.value.trim()) body.titles[i.dataset.lang] = i.value.trim();
        });
        body.extra_prompt = (card.querySelector('#cv-extra') || {}).value || '';
      } else {
        body.seed = card.querySelector('#cv-seed').value;
        body.n_variants = Number(card.querySelector('#cv-n').value) || 3;
      }
      const out = await post('/ui/covers', body);
      st.lastJob = out.job && out.job.job_id;
      toast('Задача обложки создана', 'ok');
      await refreshCoverJobs(card.querySelector('#cv-jobs'), p.id);
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };
  await refreshCoverJobs(card.querySelector('#cv-jobs'), p.id);

  // 3. Результат — уже стоящая обложка проекта (категория covers, §5.10).
  const mine = d.files.filter(g => (TAB_FILES.cover || []).includes(g.code));
  if (mine.length) for (const g of mine) app.append(fileCard(d, g));
  else app.append(emptyResultCard());

  // 4. Лог задач вида cover.
  app.append(jobsLogCard(d, 'cover'));
}

/* Вкладки ВНУТРИ одного экрана не копят историю браузера. Жалоба владельца 20.09.2026:
   «захожу в проекты, тыкаю на проект, жму назад — показывает, что я на вкладке каналов».
   Каждый клик по вкладке был отдельным шагом истории, «назад» отыгрывал их по одному и
   доходил до адреса без хеша — а это умолчание ROUTES, то есть «Каналы». Адрес вкладки
   остаётся честной ссылкой (её можно скопировать, открыть в новой вкладке, прислать),
   но обычный клик ЗАМЕНЯЕТ текущий шаг, и «назад» возвращает туда, откуда пришли. */
function tabsNoHistory(box){
  box.querySelectorAll('a[href^="#/"]').forEach(a => a.onclick = ev => {
    // Ctrl/Cmd/Shift/Alt и средняя кнопка — просьба открыть отдельно; не перехватываем.
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button) return;
    ev.preventDefault();
    // `location.replace`, а не `history.replaceState`: он сам шлёт `hashchange`, и экран
    // перерисовывает тот же роутер, что и при обычном переходе, — второй точки входа в
    // отрисовку не появляется.
    location.replace(a.getAttribute('href'));
  });
}

/* ───────────────────────── экран проекта целиком ───────────────────────── */
async function viewProject(id){
  clearAllLogTimers();
  const [d, presetsData] = await Promise.all([
    api('/ui/projects/' + encodeURIComponent(id)),
    api('/ui/presets'),
  ]);
  const p = d.project;
  const wantTab = location.hash.split('/')[3] || '';
  const tab = PROJECT_TABS.some(([k]) => k === wantTab) ? wantTab : 'scenario';
  // «Во что обошёлся» (`d.paid`) — один раз на экране, строкой в шапке, видна на любой
  // вкладке (review-feedback-F4 цикл 1, Issue 5). Отдельной карточкой она стояла до
  // вкладок вместе с «Пресетом», и до самой работы надо было листать 700 px (жалоба
  // владельца 21.09.2026 «интерфейс перегружен»). Пояснение — под знаком вопроса.
  const paidLine = d.paid.length
    ? `<div class="note" id="paidline">Во что обошёлся: ${d.paid.map(x =>
        `${esc(PAID_KIND[x.kind] || x.kind)} — ${x.delivered} ${
          plural(x.delivered, 'оплаченный вызов', 'оплаченных вызова', 'оплаченных вызовов')}${
          x.cost ? ` на ${x.cost.toFixed(0)} кр.` : ''}`).join('; ')} ${hintDot(
        'Это то, что будет выброшено, если проект убрать с диска.')}</div>`
    : '';
  const ap = p.applied_preset;
  const ppLabel = !ap ? 'Пресет' : ap.missing ? 'Пресет удалён' : `Пресет: ${ap.name}`;
  app.innerHTML = '';
  app.append($(`<a class="back" href="#/projects">← ко всем проектам</a>
    <div class="head">
      <div><h1 id="pname" title="Нажмите, чтобы переименовать"
             style="cursor:text">${esc(p.name)}</h1>
        <p class="sub"><span class="mono">${esc(p.id)}</span>
          ${p.release_id ? ` · выпуск <a href="#/release/${
            encodeURIComponent(p.release_id)}">${esc(p.release_id)}</a> · фаза ${
            esc(p.phase)}` : ''}</p>
        ${stageStripHtml(p.stage)}
        ${paidLine}
      </div>
      <div class="head-acts">
        <button id="ppopen" class="small ghost${ap && ap.missing ? ' bad' : ''}"
          aria-expanded="false">${esc(ppLabel)}</button>
        <button id="runall" class="small ghost">Сделать всё</button>
      </div>
    </div>`));

  // Предупреждение стоит до вкладок: нажимать «Начать» при выключенном исполнителе
  // бессмысленно, и узнать об этом надо ДО нажатия, а не через девять часов.
  const schCard = schedulerCard(d.scheduler);
  if (schCard) app.append(schCard);

  // Имя правится прямо в заголовке: при заведении его больше не спрашивают
  // (18.09.2026), и «Проект от 18.09 14:20» в списке из сорока проектов ничего не
  // говорит. Сохраняется по Enter или уходу фокуса, пустое имя не принимается.
  const h1 = app.querySelector('#pname');
  if (h1) h1.onclick = () => {
    if (h1.querySelector('input')) return;
    const was = h1.textContent.trim();
    h1.innerHTML = `<input id="pname-in" value="${esc(was)}"
      style="font-size:inherit;font-weight:inherit;width:min(520px,100%)">`;
    const inp = h1.querySelector('#pname-in');
    inp.focus();
    inp.select();
    const save = async () => {
      const name = inp.value.trim();
      if (!name || name === was){ h1.textContent = was; return; }
      try{
        await post(`/ui/projects/${encodeURIComponent(p.id)}/name`, {name});
        h1.textContent = name;
        toast('Название изменено', 'ok');
      }catch(e){ h1.textContent = was; toast(e.message); }
    };
    inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur();
                            if (ev.key === 'Escape'){ inp.onblur = null; h1.textContent = was; } };
    inp.onblur = save;
  };

  // «Сделать всё» — ровно одна кнопка на экране (ФР §4 п.8), видна на любой вкладке,
  // сама форма сворачиваема, чтобы не занимать место на каждый день.
  // `$()` отдаёт ОБЁРТКУ, а скрыта карточка внутри неё: переключение `display` у
  // обёртки не открывало панель никогда — «Сделать всё» не делало ничего видимого
  // (жалоба владельца 21.09.2026; прошлая правка лечила место панели, а не это).
  const runBox = $(`<div class="card" style="margin-bottom:16px;display:none">
    <div class="sec">Сделать всё</div>
    <div class="secbody">
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div><label class="k" style="display:block;margin-bottom:4px">Предложений на кадр</label>
        <input id="r-spp" placeholder="как в проекте" style="width:110px"></div>
      <div><label class="k" style="display:block;margin-bottom:4px">Модель кадров</label>
        <input id="r-model" placeholder="как в проекте" style="width:150px"></div>
      <div><label class="k" style="display:block;margin-bottom:4px">Озвучка</label>
        <input id="r-engine" placeholder="как в проекте" style="width:120px"></div>
      <div><label class="k" style="display:block;margin-bottom:4px">Качество</label>
        <input id="r-quality" placeholder="как в проекте" style="width:110px"></div>
    </div>
    <div class="note muted">Пустое поле = как в настройках проекта. Озвучка и кадры
      пойдут параллельно, сборка дождётся материалов сама.</div>
    <div class="note muted">Сборку делает отдельная машина. Если рендер-нода не
      запущена, проект дойдёт до сборки и остановится.</div>
    <div style="margin-top:12px"><button id="rgo">Запустить</button></div></div></div>`).firstElementChild;
  // Панель ставится ПОД шапкой, а не в конец страницы. Раньше она добавлялась после
  // вкладок, настроек, результатов и лога — то есть далеко за пределами видимого
  // экрана. Кнопка вверху, панель внизу: владелец нажимал «Сделать всё» и не видел
  // ничего, отчего и решил, что кнопка не работает.
  //
  // Якорь берём по самой кнопке, а не по переменной шапки: в этом экране шапка
  // добавляется анонимно, и обращение к несуществующему `head` роняло отрисовку
  // целиком — экран проекта переставал открываться вовсе.
  const runAnchor = app.querySelector('#runall');
  const runHead = runAnchor ? runAnchor.closest('.head') : null;
  if (runHead) runHead.after(runBox); else app.append(runBox);
  app.querySelector('#runall').onclick = () => {
    const hidden = runBox.style.display === 'none';
    runBox.style.display = hidden ? '' : 'none';
    // Даже стоя под кнопкой, панель может оказаться за краем на коротком экране.
    if (hidden) runBox.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  };
  runBox.querySelector('#rgo').onclick = async () => {
    const btn = runBox.querySelector('#rgo');
    btn.disabled = true;
    try{
      // Правка на вкладке этапа ждёт паузы в наборе; запуск, попавший в эту паузу,
      // оплатил бы конвейер по значениям ДО правки. Сначала досылаем, и если записать
      // не вышло — не запускаем: экран показывает одно, а платить пришлось бы за другое.
      const why = (STAGE_FLUSH ? await STAGE_FLUSH() : null)
        || (SCENARIO_DIRTY ? SCENARIO_DIRTY() : null);
      if (why){ toast('Не запускаю — настройки этапа не записаны: ' + why); return; }
      const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/run`, {
        sentences_per_prompt: runBox.querySelector('#r-spp').value,
        model: runBox.querySelector('#r-model').value,
        engine: runBox.querySelector('#r-engine').value,
        quality: runBox.querySelector('#r-quality').value});
      // Тот же отчёт, что и у пакетной кнопки: ответ один и тот же, и объяснять его
      // двумя разными способами значит однажды разойтись. Врезки под формой здесь
      // быть не может — через 1,2 с экран перерисовывается и уносит её с собой.
      pipelineReport(out, 1,
                     'На экране проекта это вкладки «Сценарий» и «Обложка».');
      setTimeout(() => viewProject(p.id), 1200);
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };

  // Панель пресета — только целые (раздел 2 спецификации).
  const vsgenGroup = (presetsData.groups || []).find(g => g.service === 'vsgen');
  const wholePresets = ((vsgenGroup && vsgenGroup.items) || [])
    .filter(i => i.scope === 'full').map(i => ({key: i.key, name: i.name}));
  // Панель пресета нужна изредка — применить или снять снимок, — а стояла до вкладок
  // на каждом заходе. Теперь её открывает кнопка «Пресет» в шапке, тем же приёмом, что
  // и «Сделать всё»; что применено, сказано на самой кнопке.
  const ppCard = $(presetPanelHtml(p.applied_preset, wholePresets));
  ppCard.style.display = 'none';
  (runBox.isConnected ? runBox : (runHead || app.lastElementChild)).after(ppCard);
  wirePresetPanel(ppCard, p.id);
  const ppOpen = app.querySelector('#ppopen');
  ppOpen.onclick = () => {
    const hidden = ppCard.style.display === 'none';
    ppCard.style.display = hidden ? '' : 'none';
    ppOpen.setAttribute('aria-expanded', String(hidden));
    if (hidden) ppCard.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  };

  // Вкладки — адрес вида #/project/{pid}/{tab}, никакой отдельной «Настройки».
  const tabsBox = $(`<div class="subtabs">${PROJECT_TABS.map(([k, title]) => {
    const codes = TAB_FILES[k] || [];
    const n = d.files.filter(g => codes.includes(g.code)).reduce((a, g) => a + g.count, 0);
    // Что считает цифра: у звука и видео это куски ОДНОГО результата (EdgeTTS не берёт
    // больше 4000 знаков за раз, видео режется по сценам), у остальных — просто файлы.
    // Словом единица измерения больше не пишется: она удлиняла полосу вкладок вдвое, а
    // от чтения цифры номером спасает не слово, а форма значка (см. `.subtabs .cnt`).
    const what = `файлов: ${n}` + (PART_TABS.has(k)
      ? ` (${partsWord(n)} одного результата)` : '');
    return `<a href="#/project/${encodeURIComponent(id)}/${k}"
      class="${tab === k ? 'on' : ''}">${esc(title)}${n
        ? ` <span class="cnt" title="${esc(what)}" aria-label="${esc(what)}">${n}</span>`
        : ''}</a>`;
  }).join('')}</div>`);
  app.append(tabsBox);
  tabsNoHistory(tabsBox);

  if (tab === 'scenario') await renderScenarioTab(d);
  else if (tab === 'cover') await renderCoverTab(d);
  else await renderStageTab(d, tab);
}

function fileCard(d, g){
  const p = d.project;
  const url = n => pultUrl(d.file_base) + n.split('/').map(encodeURIComponent).join('/');
    // Содержимое — в .secbody (правило батча A, отступ 18px): без него миниатюры,
    // плеер и ссылки шли вплотную к рамке карточки (Issue 6, review-feedback-F4
    // цикл 1). Заголовок и кнопка «Скачать архивом» остаются в .sec как есть.
    const card = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">${esc(g.title)} · ${g.count}
        <a class="ghost" href="${pultUrl(d.zip_base)}${esc(g.code)}"
           style="float:right;padding:3px 10px;border:1px solid var(--line);
                  border-radius:6px;text-decoration:none;font-size:12px"
           >Скачать архивом</a></div>
      <div class="secbody">
      ${g.kind === 'image'
        ? `<div class="thumbs" style="display:flex;flex-wrap:wrap;gap:6px">${g.names.map(n =>
            thumb(url(n) + '?w=160', url(n), n, 78, p.id)).join('')}</div>
           <div class="more-mark"></div>`
        : g.kind === 'audio'
        ? g.names.map((n, i) => `<div class="note muted" style="margin-top:8px">${
              g.names.length > 1 ? `часть ${i + 1} из ${g.names.length}` : 'дорожка'
            }</div><div data-audio="${url(n)}"></div>`).join('')
          // Почему кусков несколько — объясняем прямо здесь, а не оставляем догадываться:
          // имя файла «1.mp3» человеку ничего не говорит, а число рядом с названием этапа
          // владелец 21.09 прочёл как номер запуска.
          + (g.names.length > 1
             ? `<div class="note muted" style="margin-top:8px">Движок озвучки не берёт
                больше 4000 знаков за раз, поэтому текст озвучен кусками. В ролик они
                склеиваются подряд — это одна дорожка, а не несколько записей.</div>`
             : '')
        : g.kind === 'video'
        ? g.names.slice(0, 4).map(n => `<div class="thumb" style="margin:6px 6px 0 0"
            ><video controls preload="none" src="${url(n)}"
            style="max-width:320px;border-radius:6px"></video>
            <button class="again" data-regen="clip" data-pid="${esc(p.id)}"
              data-name="${esc(n)}">переделать</button></div>`).join('')
          + (g.names.length > 4 ? `<div class="note muted">и ещё ${
              g.names.length - 4} — в архиве</div>` : '')
        : `<div style="display:flex;flex-wrap:wrap;gap:8px">${g.names.map(n =>
            `<a href="${url(n)}" target="_blank"
              style="padding:4px 10px;border:1px solid var(--line);border-radius:6px;
                     text-decoration:none;font-size:12px">${esc(n)}</a>`).join('')}</div>`}
      ${g.more && g.kind !== 'image'
        ? `<div class="note muted">показаны первые ${g.names.length},
             всего ${g.count} — остальные в архиве</div>` : ''}
      </div>
    </div>`);
  wireRegen(card); wireLightbox(card); wirePlayers(card);
  if (g.kind === 'image') wireThumbScroll(card, d, g);
  return card;
}

// Дочитывание кадров при прокрутке (18.09.2026). В проекте бывает 300+ кадров: сервер
// отдаёт первую порцию, остальные подтягиваются по мере того, как человек досматривает
// до конца списка. Загруженные миниатюры не перерисовываются — дописываются новые,
// поэтому «переделать» у уже открытой картинки не слетает.
const THUMBS_PAGE = 40;

function wireThumbScroll(card, d, g){
  const box = card.querySelector('.thumbs');
  const mark = card.querySelector('.more-mark');
  if (!box || !mark) return;
  const p = d.project;
  const url = n => pultUrl(d.file_base) + n.split('/').map(encodeURIComponent).join('/');
  let loaded = g.names.length;
  let total = g.count;
  let busy = false;
  let stopped = false;
  let everConnected = false;
  const note = html => {
    mark.innerHTML = html != null ? html
      : (loaded < total ? `<div class="note muted">показано ${loaded} из ${total}</div>` : '');
  };
  note();
  if (loaded >= total) return;

  // Конец списка виден (с запасом в экран вперёд) — пора дочитывать. Считаем сами, а не
  // через IntersectionObserver: тот сообщает только о СМЕНЕ видимости, и когда конец
  // списка так и остаётся на экране, второй порции уже не дождаться.
  const nearEnd = () => mark.getBoundingClientRect().top
    < (window.innerHeight || 800) + 400;

  const stop = () => {
    stopped = true;
    window.removeEventListener('scroll', onView);
    window.removeEventListener('resize', onView);
  };

  async function fetchPage(){
    const out = await api(`/ui/projects/${encodeURIComponent(p.id)}/files/${
      encodeURIComponent(g.code)}?offset=${loaded}&limit=${THUMBS_PAGE}`);
    // Экран мог смениться, пока шёл ответ: дописывать в оторванный узел незачем.
    if (!mark.isConnected){ stop(); return; }
    const names = out.names || [];
    total = out.count != null ? out.count : total;
    if (!names.length){ stop(); note(''); return; }
    box.insertAdjacentHTML('beforeend', names.map(n =>
      thumb(url(n) + '?w=160', url(n), n, 78, p.id)).join(''));
    wireRegen(card); wireLightbox(card); wirePlayers(card);
    loaded += names.length;
    note();
    if (loaded >= total) stop();
  }

  async function onView(){
    if (busy || stopped) return;
    if (!mark.isConnected){
      // Первый вызов случается до того, как карточку вставили в страницу: это не повод
      // выключать дочитывание навсегда — выключаем только когда карточку убрали.
      if (everConnected) stop();
      return;
    }
    everConnected = true;
    busy = true;
    try{
      // Пока конец списка на виду — дочитываем дальше: одна порция могла его не сдвинуть.
      while (!stopped && loaded < total && nearEnd()) await fetchPage();
    }catch(e){
      // Сеть сбоит — уже показанное не трогаем, причину говорим и даём дочитать снова
      // кнопкой: молча повторять в цикле значит долбить сервер, который и так отвечает
      // ошибкой.
      note(`<div class="note bad">кадры не дочитались: ${esc(e.message)}
        <button type="button" class="ghost small thumb-retry"
          style="margin-left:8px">Ещё раз</button></div>`);
      const btn = mark.querySelector('.thumb-retry');
      if (btn) btn.onclick = () => { note(); onView(); };
    }finally{ busy = false; }
  }

  window.addEventListener('scroll', onView, {passive: true});
  window.addEventListener('resize', onView);
  // Конец списка может быть виден сразу, без единой прокрутки. Через setTimeout —
  // карточку в страницу вставляет вызывающий код, уже после возврата отсюда.
  setTimeout(onView, 0);
}

/* ───────────────────────── свои ключи ───────────────────────── */

/* Значения ключей сюда не приходят и не уходят: снять можно по номеру в списке,
   добавить — вписав новый. На экране только маска. Разбор и запись делает кабинет
   своим же обработчиком: там ключи правятся по одному, каждый несёт свой лимит,
   и ёмкость дорожки пересчитывается сразу. */
async function wireKeys(root, d){

  const rwDrop = root.querySelector('#rw-drop');
  if (rwDrop) rwDrop.onclick = ev => {
    ev.preventDefault();
    confirmInline(rwDrop, 'Снять свой ключ рерайта? Останется серверный, если он задан.',
      async () => {
        try{ await post('/ui/keys/rewrite', {openai_api_key: ''}); await render(); }
        catch(e){ toast(e.message); }
      });
  };

  // Своя подписка Codex/Claude (22.09.2026) — хранилище то же (rewrite/server.py),
  // поэтому и снятие тем же путём: пустое значение соответствующего поля.
  const wireSubDrop = (id, field, question) => {
    const a = root.querySelector(id);
    if (!a) return;
    a.onclick = ev => {
      ev.preventDefault();
      confirmInline(a, question, async () => {
        try{ await post('/ui/keys/rewrite', {[field]: ''}); await render(); }
        catch(e){ toast(e.message); }
      });
    };
  };
  wireSubDrop('#rw-drop-codex', 'codex_auth',
    'Снять свою подписку Codex? Текст станет писаться на серверной, если она задана.');
  wireSubDrop('#rw-drop-claude', 'oauth_token',
    'Снять свою подписку Claude? Текст станет писаться на серверной, если она задана.');

  root.querySelectorAll('a.dropkey').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    // Ключ снимается сразу и без отмены — спросить обязаны, но не попапом.
    confirmInline(a, 'Снять ключ? Перестанет использоваться сразу.', async () => {
      try{
        await post('/ui/keys', {drop: {[a.dataset.f]: [Number(a.dataset.i)]}});
        await render();
      }catch(e){ toast(e.message); }
    });
  });

  root.querySelector('#addkey').onclick = async () => {
    // Форма ключа — в окне (18.09.2026): в строке карточки она жила криво и мешала
    // читать сам список. Провайдеры спрашиваем у кабинета, как и раньше.
    const ref = await api('/ui/keys/families');
    // Обычное поле ключа — как и было; для своих подписок Codex/Claude (22.09.2026) его
    // на лету подменяет subFormHtml (та же разметка, что в админском блоке подписок).
    const normalField = `<div class="fldrow"><label>Ключ</label>
        <input id="kval" type="password" autocomplete="off" style="flex:1;min-width:0"></div>`;
    const m = modal('Добавить ключ', `
      <div class="fldrow"><span class="lh"><label for="kfam">Провайдер</label>${
        hintDot((ref.note || '')
        + ' Значение нигде не показывается: в списке видно только хвост.')}</span>
        <select id="kfam">${ref.families.map(f =>
          `<option value="${esc(f.key)}">${esc(f.title)}</option>`).join('')}
          <option value="__rewrite">OpenAI · текст</option>
          <option value="__rewrite_codex">Своя подписка Codex</option>
          <option value="__rewrite_claude">Своя подписка Claude</option></select></div>
      <div id="kval-wrap">${normalField}</div>
`,
      {ok: 'Сохранить', onOk: async (box, close) => {
        const fam = box.querySelector('#kfam').value;
        // Своя подписка Codex/Claude — своим путём: не генерик /ui/keys {add:}, второго
        // места хранения секрета не заводим, значение уходит только в рерайт.
        if (fam === '__rewrite_codex' || fam === '__rewrite_claude'){
          const provider = fam === '__rewrite_codex' ? 'codex' : 'claude';
          const secret = box.querySelector('#sf-secret');
          const val = (secret.value || '').trim();
          if (!val) throw new Error(subEmptyText(provider));
          await post('/ui/keys/rewrite', fam === '__rewrite_codex'
            ? {codex_auth: val} : {oauth_token: val});
          secret.value = '';
          close();
          await render();
          return;
        }
        const val = box.querySelector('#kval').value.trim();
        if (!val) throw new Error('Ключ пустой.');
        // Ключ рерайта хранит сам Rewrite: второго места хранения секрета не заводим.
        if (fam === '__rewrite') await post('/ui/keys/rewrite', {openai_api_key: val});
        else await post('/ui/keys', {add: {[fam]: [val]}});
        close();
        await render();
      }});

    // Подмена поля ключа на форму своей подписки — и обратно. Собственная строка кнопок
    // subFormHtml (`#sf-ok`/`#sf-no`) дублирует футер самого modal(), поэтому прячется:
    // сохранение и отмена — только через него. Пересобираем обычное поле, только когда
    // реально уходим с формы подписки — иначе переключение между обычными провайдерами
    // (например OpenAI · текст → другой обычный ключ) молча стирало бы уже вписанное
    // значение #kval (ревью 22.09.2026, Issue 3).
    const wrap = m.body.querySelector('#kval-wrap');
    m.body.querySelector('#kfam').onchange = ev => {
      const fam = ev.target.value;
      if (fam !== '__rewrite_codex' && fam !== '__rewrite_claude'){
        if (!wrap.querySelector('#kval')) wrap.innerHTML = normalField;
        return;
      }
      wrap.innerHTML = subFormHtml(fam === '__rewrite_codex' ? 'codex' : 'claude', 'own');
      const ownRow = wrap.querySelector('#sf-ok').closest('.row');
      if (ownRow) ownRow.hidden = true;
      wireSubFile(wrap);
    };
  };
}

const DAY_TITLE = {mon:'пн', tue:'вт', wed:'ср', thu:'чт', fri:'пт', sat:'сб', sun:'вс'};
// Порядок дней — как в неделе, а не как в объекте: тот же порядок у формы канала.
const DAY_ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
// Названия полей канала для фразы «из пресета приходят: …» — теми же словами, что
// подписаны поля формы.
const CHANNEL_FIELD_TITLE = {tz: 'часовой пояс', schedule: 'расписание',
  horizon_days: 'горизонт', lead_days: 'готовить заранее', deferred: 'отложенные',
  deferred_limit: 'лимит отложенных', preset_vsgen_id: 'пресет производства',
  host_id: 'машина заливки', niche: 'ниша', collaborator: 'соавтор'};

async function wireChannelEdit(root, c, chp){
  const box = root.querySelector('#editbox');
  // `channel_id` (§6.4 ТЗ) — иначе список профилей режется по `missing_since IS NULL`
  // и текущий профиль канала, если он пропал с машины, вообще пропадает из <select>:
  // сохранение формы тогда тихо стирает `profile_id` (index.html:6318 → 6396,
  // pub_ui.py:207 — ловушка из брифа).
  const ref = await api('/ui/channels/new?channel_id=' + encodeURIComponent(c.id));
  // Пресет канала (18.09.2026): привязка живая — пока канал на пресете, перекрытые
  // поля приходят из него, и править их в канале нельзя. Иначе форма показала бы
  // унаследованное значение и сохранила его как собственное значение канала.
  const inherited = new Set((chp && chp.inherited) || []);
  const own = (chp && chp.own) || {};

  root.querySelector('#statusbtns').innerHTML =
    `<span class="pill ${c.status === 'active' ? 's-done' : 's-idle'}">${
      esc(CH_STATUS[c.status] || c.status)}</span>` + ref.statuses
    .filter(s => s.key !== c.status)
    .map(s => `<button class="ghost small chst" data-s="${s.key}">${
      esc(CH_VERB[s.key] || s.title)}</button>`)
    .join('')
    + iconBtn('bad', 'remove', 'Удалить канал', c.name, 'id="chdel"');
  root.querySelectorAll('button.chst').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await post(`/ui/channels/${c.id}/status`, {status: b.dataset.s}); await render(); }
    catch(e){ b.disabled = false; toast(e.message); }
  });

  // Удалить канал — решение владельца 24.09.2026. Стоит отдельно от статусов и
  // спрашивает окном: у канала с историей сервер откажет и объяснит, почему архив
  // здесь честнее удаления.
  const del = root.querySelector('#chdel');
  if (del) del.onclick = () => confirmModal('Удалить канал',
    `Удалить «${c.name}» насовсем? Ссылки, поставленные в план и ещё не пущенные в `
    + 'работу, удалятся вместе с ним. Выпуски и заливки не трогаются: если они есть, '
    + 'удаление не пройдёт — такой канал убирают в архив.',
    async () => {
      try{
        const out = await api(`/ui/channels/${c.id}`, {method: 'DELETE'});
        toast(`Канал «${out.deleted}» удалён`, 'ok');
        location.hash = '#/channels';
      }catch(e){ toast(e.message); }
    });

  // Форма строится сразу при открытии вкладки (доработка §5, Дополнение 16.09):
  // кнопки «Настроить» и промежуточного состояния «свёрнуто» больше нет.
  {
    // «*» в расписании означает «каждый день»: без этого галочки дней оставались
    // пустыми у канала, который выходит ежедневно (жалоба владельца 18.09.2026).
    // В форме — СВОИ значения канала: пресет их только перекрывает на чтение.
    const ownSched = (() => {
      try{ return JSON.parse(own.schedule || '{}'); }catch(e){ return {}; }
    })();

    // человек видит, как канал живёт на самом деле, и не может случайно записать это
    // значение как собственное. При сохранении вместо погашенных полей уходят
    // собственные значения канала — они не должны потеряться при отвязке от пресета.
    const off = k => inherited.has(k) ? ' disabled title="приходит из пресета канала"' : '';
    const schedSrc = c.schedule || {};
    const schedKeys2 = Object.keys(schedSrc);
    const picked = new Set(schedKeys2.includes('*')
      ? ref.days.filter(x => x !== ref.any_day) : schedKeys2);
    const times = [...new Set(Object.values(c.schedule || {}).flat())].join(', ');
    const sel = (id, items, cur, label, key) => `<div class="fldrow"><label>${label}</label>
      <select id="${id}"${key ? off(key) : ''}><option value="">— не выбран —</option>${items.map(i =>

    // Дополнение 16.09, вопрос 1: ID можно вписать только в пустое поле — уже

           <input id="f-uc" placeholder="UCK8sQmJBp8GCxrOtXWBpyEA" style="width:300px"></div>

    const curProfileMissing = (ref.profiles || []).some(p =>

    const chpOptions = ((chp && chp.all) || []).map(p =>
