/* ─────────────────── статус проекта по этапам ─────────────────── */
// `project_stage_status` (Ф1, server/main.py) отдаёт tone/state кабинетными именами
// (`running`/`error`/`queued`/`done`/`muted`/`dim`) — это переменные ЕГО палитры
// (`var(--running)` и т.п.). У пульта своя палитра (см. :root вверху файла), поэтому
// имена переводятся в свои переменные и свои классы, а не используются как есть.
// Класс .segs/.segs i уже существует (полоска этапов выпуска) — тот же визуальный
// язык, а не вторая полоска с нуля.
const STAGE_TONE_VAR = {running: '--run', error: '--bad', queued: '--wait',
                        done: '--ok', muted: '--muted', dim: '--off'};
// «Ещё не начат» — пустой контур (`idle`), а не `off`: `off` в полосах выпусков значит
// «этап не участвует» и рисуется средней чертой — в шапке проекта это перечёркивало
// этапы, которые просто ещё впереди.
const STAGE_SEG_CLS = {done: 'done', running: 'running', queued: 'queued',
                       error: 'error', pending: 'idle'};
// Подписи этапов: до 18.09.2026 в подсказке стоял внутренний код («tts», «cover»),
// а плиток было пять при шести вкладках — шестую (обложку) добавили в
// `project_stage_status`, здесь её надо ещё и назвать по-человечески.
const STAGE_SEG_TITLE = {text: 'сценарий', tts: 'озвучка', images: 'картинки',
                         video: 'видео', render: 'рендер', cover: 'обложка'};
function stageStripHtml(stage){
  if (!stage || !(stage.segments || []).length) return '';
  const bar = stage.segments.map(s =>
    `<i class="${STAGE_SEG_CLS[s.state] || 'idle'}" title="${
      esc(STAGE_SEG_TITLE[s.stage] || s.stage)}"></i>`).join('');
  return `<div class="segs" style="max-width:320px;margin-top:9px">${bar}</div>
    <div class="note" style="color:var(${STAGE_TONE_VAR[stage.tone] || '--muted'})"
      >${esc(stage.caption)}</div>`;
}

    <div class="sec">Пресет</div>
    <div class="secbody">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">

      <span style="flex:1 1 auto"></span>
      <input id="pp-name" placeholder="сохранить как новый…" style="width:200px">
      <button id="pp-snap" class="ghost small">Снимок</button>
    </div>
    ${applied && applied.missing
      ? '<div class="note bad">пресет удалён</div>'
      : (applied ? `<div class="note muted">применён: ${esc(applied.name)}</div>` : '')}
    ${applied && !applied.missing && (applied.links || []).length
      ? `<div class="note muted">часть настроек — из частичных пресетов: ${
          applied.links.map(l => esc(l.title)).join(', ')}</div>` : ''}

function wirePresetPanel(card, pid){
  const sel = card.querySelector('#pp-pick');
  // «×» — снимает выбор ТОЛЬКО в списке, ничего не отправляет и не меняет в проекте
  // (раздел 2 спецификации: без запроса).
  card.querySelector('#pp-clear').onclick = () => { sel.value = ''; };
  card.querySelector('#pp-apply').onclick = ev => {
    const presetId = sel.value;
    if (!presetId) return;
    // Применение заменяет настройки проекта ЦЕЛИКОМ — обязательное предупреждение
    // перед необратимым действием (раздел 2 спецификации), инлайн, не confirm().
    confirmInline(ev.currentTarget,
      'Заменит настройки проекта целиком — применить пресет?', async () => {
      try{
        await post(`/ui/projects/${encodeURIComponent(pid)}/preset/apply`,
                   {preset_id: Number(presetId)});
        toast('Пресет применён', 'ok');
        await viewProject(pid);           // перерисовать экран целиком (п.3 спецификации)
      }catch(e){ toast(e.message); }
    });
  };
  card.querySelector('#pp-snap').onclick = async () => {
    const btn = card.querySelector('#pp-snap');
    const name = card.querySelector('#pp-name').value.trim();
    if (!name){ toast('у пресета должно быть имя'); return; }
    btn.disabled = true;
    try{
      await post(`/ui/projects/${encodeURIComponent(pid)}/preset/snapshot`, {name});
      toast('Пресет сохранён снимком', 'ok');
      await viewProject(pid);
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };
}

/* ───────────────────────── лог задачи, опросом ───────────────────────── */
// Раскрывающийся лог на задачу (ФР §4 п.7): дочитывается раз в 3с, пока задача не
// в терминальном статусе; сворачивание блока или уход со страницы (смена hash) —
// таймер снимается. Реестр таймеров — общий на все вкладки проекта: при перерисовке
// экрана (смена hash, повторный viewProject) снимаются все разом, а не по одному —
// иначе вкладка, которую уже покинули, продолжала бы дёргать API вникуда.
const LOG_TIMERS = {};
// `deleted` — тоже терминальный статус `queue_tasks` (review-feedback-F4 цикл 1,
// Issue 7): без него опрос лога уже удалённой задачи продолжался бы впустую.
const LOG_TERMINAL = new Set(['done', 'error', 'cancelled', 'failed', 'deleted']);
function clearAllLogTimers(){
  for (const jid of Object.keys(LOG_TIMERS)){ clearInterval(LOG_TIMERS[jid]); delete LOG_TIMERS[jid]; }
  // Опрос фонового подбора оплаченных текстов останавливается тем же местом: он тоже
  // переживает уход с экрана, и сам себя гасит только на следующем тике.
  clearTimeout(PAID_POLL);
}
function stopJobLogPoll(jid){
  if (LOG_TIMERS[jid]){ clearInterval(LOG_TIMERS[jid]); delete LOG_TIMERS[jid]; }
}
function startJobLogPoll(jid, pre){
  let after = 0;
  // Тик не запускается повторно, пока предыдущий ещё не ответил (review-feedback-F4
  // цикл 1, Issue 7): без этого ответ дольше 3с давал два тика с одним `after`, и
  // строки лога дописывались дважды.
  let busy = false;
  const tick = async () => {
    if (busy) return;
    busy = true;
    try{
      const d = await api(`/ui/jobs/${encodeURIComponent(jid)}/logs?after=${after}`);
      const text = d.lines.map(l => l.line).join('\n');
      if (after === 0){
        pre.textContent = (d.truncated ? '… показаны последние 1000 строк …\n' : '')
          + (text || '(пусто)');
      } else if (text){
        pre.textContent += '\n' + text;
      }
      pre.scrollTop = pre.scrollHeight;
      after = d.next_after;
      if (LOG_TERMINAL.has(d.status)) stopJobLogPoll(jid);   // задача завершилась — дальше нечего опрашивать
    }catch(e){
      // Сеть иногда сбоит (условие задачи) — один неудачный тик не должен стирать уже
      // показанный лог и останавливать опрос идущей задачи; следующий тик попробует
      // снова с тем же `after`.
    }finally{ busy = false; }
  };
  tick();
  LOG_TIMERS[jid] = setInterval(tick, 3000);
}
function toggleJobLog(tr, btn){
  const jid = btn.dataset.job;
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('jlog-row')){
    stopJobLogPoll(jid);
    next.remove();
    return;
  }
  tr.insertAdjacentHTML('afterend', `<tr class="jlog-row"><td colspan="4">
    <pre class="mono" style="white-space:pre-wrap;max-height:260px;overflow:auto;
      background:var(--card-2);border-radius:8px;padding:10px;margin:0"
      >загрузка…</pre></td></tr>`);
  startJobLogPoll(jid, tr.nextElementSibling.querySelector('pre'));
}

/* ── Сырой лог задачи соседа: причина, а не её код ────────────────────────────────
   Просьба владельца 20.09.2026, дословно: «можем добавить лог?». В тот день он
   полтора часа чинил интернет, которого не ломал: заказ текста трижды падал с
   «Ошибка: сеть недоступна (E-NET)», а настоящая причина — не найденная связка
   сертификатов — лежала в СЫРОМ логе задачи рерайта и наружу не выходила: публичный
   фильтр соседа заменяет текст исключения кодом. Сырой лог отдаёт
   `GET /ui/jobs/{service}/{id}/log`, и он ТОЛЬКО ЧИТАЕТ: ничего не запускает, не
   повторяет и не стоит денег. Поэтому кнопку можно нажимать сколько угодно — в том
   числе у идущей задачи, — и «Обновить» в окне тоже.
   Ручка есть только у соседей: у задач кабинета лог свой (`/ui/jobs/{id}/logs`,
   кнопка «лог» с раскрытием строки), и подменять одно другим нельзя. */
const JOB_LOG_SVC = {rewrite: 'Текст', cover: 'Обложки'};

/* Кнопка стоит в клетке СОСТОЯНИЯ — рядом с той самой подменённой причиной («сеть
   недоступна (E-NET)»): туда человек смотрит, когда задача упала, там же он будет
   искать, что случилось на самом деле. У упавшей кнопка сплошная и заметная, у
   остальных — тихая, рамкой: у идущей лог смотрят «как оно там», у упавшей он первое,
   что нужно. */
function jobLogBtnHtml(service, id, state){
  if (!JOB_LOG_SVC[service] || !id) return '';
  return `<button class="${state === 'error' ? '' : 'ghost '}small joblog"
    data-service="${esc(service)}" data-job="${esc(id)}"
    style="margin-top:8px">Показать лог</button>`;
}

/* Одним слушателем на весь документ, а не onclick на каждую кнопку: строки очереди и
   списков задач дорисовываются тиком опроса (`syncJobsTable`) уже после того, как
   экран собран, — поимённая привязка пропустила бы ровно ту строку, за которой сейчас
   следят. */
document.addEventListener('click', ev => {
  const btn = ev.target.closest && ev.target.closest('button.joblog');
  if (btn) showJobLog(btn.dataset.service, btn.dataset.job);
});

function jobLogBodyHtml(d){
  const parts = [];
  // Откуда лог — ПЕРВОЙ строкой и всегда. Если это не сырой файл, а публичный
  // пересказ, говорим это громко: в нём причина снова заменена кодом, и человек,
  // приняв код за причину, второй раз пойдёт чинить не то. Ровно от этого вся правка.
  const raw = (d.source === 'raw');
  parts.push(`<div class="note ${raw ? 'muted' : 'warn'}">${esc(d.why || (raw
    ? 'сырой лог задачи с диска'
    : 'это НЕ сырой лог задачи: настоящая причина в нём могла быть заменена кодом'))
    }</div>`);
  if (d.problem) parts.push(`<div class="note warn">${esc(d.problem)}</div>`);
  if (d.error) parts.push(`<div class="note bad">О задаче: ${esc(d.error)}</div>`);
  // Обрезку называем обрезкой: молчаливый хвост заставляет искать в логе то, чего в
  // показанном куске нет.
  if (d.truncated) parts.push(`<div class="note muted">Показан только конец лога — ${
    size(d.bytes)} из ${size(d.total_bytes)}. Начало осталось в файле${
    d.path ? ': ' + esc(d.path) : ''}.</div>`);
  parts.push(d.text
    ? `<pre class="mono jl-text" style="white-space:pre-wrap;max-height:52vh;overflow:auto;
        background:var(--card-2);border-radius:8px;padding:10px;margin:8px 0 0">${
        esc(d.text)}</pre>`
    : '<div class="empty">Показывать нечего.</div>');
  if (d.text && d.redacted)
    parts.push(`<div class="note muted">Ключи и токены из лога вырезаны (${
      esc(d.redacted)}).</div>`);
  return parts.join('');
}

async function showJobLog(service, jobId){
  // «Обновить» вместо «Сохранить»: окно ничего не меняет, а у идущей задачи лог
  // дописывается — перечитать его стоит ноль.
  const m = modal(`Лог задачи · ${JOB_LOG_SVC[service] || service} · ${jobId}`,
    '<div class="muted">Читаем лог…</div>',
    {ok: 'Обновить', no: 'Закрыть', onOk: () => load()});
  const load = async () => {
    try{
      const d = await api(`/ui/jobs/${encodeURIComponent(service)}/${
        encodeURIComponent(jobId)}/log`);
      if (!m.el.isConnected) return;               // окно закрыли, пока лог ехал
      m.body.innerHTML = jobLogBodyHtml(d);
      // Причина всегда в конце лога — показываем конец, а не начало.
      const pre = m.body.querySelector('.jl-text');
      if (pre) pre.scrollTop = pre.scrollHeight;
    }catch(e){
      if (!m.el.isConnected) return;
      m.body.innerHTML = `<div class="note bad">Лог не прочитался: ${esc(e.message)}</div>
        <div class="note muted">Чтение лога бесплатно и ничего не запускает —
          «Обновить» можно нажать ещё раз.</div>`;
    }
  };
  await load();
  return m;
}

// Строка задачи: состояние, прогресс, ошибка, «с какими настройками пошла» (снимок
// момента постановки — правило 6 ТЗ, `j.applied`), отменить/повторить и раскрывающийся
// лог. review-feedback-F4 цикл 1, Issue 5: старый «Обзор» умел всё это через
// `actions()`/`wireActions()` (те же, что у очереди и #/text/#/covers — не новая
// кнопка), но при переезде на вкладки список задач превратился в одну колонку «лог» и
// молча потерял остальное. `jobRowHtml`/`jobsTableCard` — общий рендер строки/карточки
// для «Лога задач» каждой вкладки и для «Прочих задач проекта» на «Сценарии».
function jobRowHtml(j){
  return `<tr>
    <td>${esc(j.kind)}<div class="muted mono" style="font-size:11px">#${j.id}</div></td>
    <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
      ${j.stage ? `<div class="muted">${esc(j.stage)}</div>` : ''}
      ${j.progress != null ? `<div class="bar"><i style="width:${
        Math.round(j.progress * 100)}%"></i></div>` : ''}
      ${j.error ? `<div class="note bad">${esc(j.error)}</div>` : ''}
      ${(j.applied || []).length ? `<details style="margin-top:6px">
        <summary class="muted" style="cursor:pointer;font-size:12px"
          >с какими настройками пошла</summary>
        <div class="note muted">${j.applied.map(a =>
          `${esc(a.name)}: <b>${esc(a.value)}</b>`).join(' · ')}</div>
        <div class="note muted">Это снимок момента запуска — правка пресета
          его не меняет.</div></details>` : ''}</td>
    <td class="muted when">${when(j.created)}</td>
    <td style="white-space:nowrap">${actions({service: 'vsgen', id: j.id,
                                              state: j.state, status: j.status})}
      <button class="ghost small jlog-toggle" data-job="${j.id}">лог</button></td>
  </tr>`;
}
function jobsTableCard(title, jobs, emptyText){
  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">${esc(title)}</div>
    ${jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Состояние</th><th>Создана</th><th></th></tr></thead>
      <tbody>${jobs.map(jobRowHtml).join('')}</tbody></table>`
      : `<div class="empty">${esc(emptyText)}</div>`}
  </div>`);
  wireActions(card);
  card.querySelectorAll('.jlog-toggle').forEach(btn => {
    btn.onclick = () => toggleJobLog(btn.closest('tr'), btn);
  });
  return card;
}

// Список задач вкладки (вид задачи — по TAB_KINDS) с раскрывающимся логом на каждую

/* ───────────────────────── старт этапа (tts/images/video/render) ───────────────────────── */
const STAGE_OUTCOME_TEXT = {
  duplicate: 'Уже идёт — вторая такая же задача не ставится',
  images_busy: 'Картинки заняты правкой — дождитесь освобождения',
  render_deferred: 'Рендер отложен: материалы для сборки ещё не готовы',
  video_deferred: 'Видео отложено: материалы ещё не готовы',
};
// Строка исхода последнего нажатия «Начать» переживает автообновление экрана после
// успешного старта (review-feedback-F4 цикл 1, Issue 3): раньше отложенный
// `viewProject()` рисовал блок «Действие» заново уже пустым, и «Поставлено: задача
// #N» пропадало через 1,2 с, так и не будучи прочитанным. Ключ — pid:tab, живёт на
// сессию вкладки браузера, как и остальные *_STATE этого экрана.
const STAGE_OUTCOME_STATE = {};
// 21.09.2026: исход переживал перерисовку БЕССРОЧНО, и отказ превращался в призрак.
// У владельца на экране висело «Уже идёт — вторая такая же задача не ставится», хотя
// мешавшие задачи давно отменены и сервер старт разрешал. Пока этап в очереди, экран
// автообновляется, и старая надпись рисовалась заново снова и снова — человек видел
// отказ, которого в этот момент уже не существовало, и не нажимал кнопку.
// Исход отвечает на ОДНО нажатие и живёт ровно столько, сколько нужно, чтобы пережить
// отложенное обновление экрана (1,2 с). Дальше он молчит: пусть лучше не будет надписи,
// чем будет неправда.
const STAGE_OUTCOME_TTL_MS = 15000;

// Пауза в наборе, после которой настройки этапа уезжают сами. 600–800 мс: короче —
// и каждое слово в поле «Стиль» становится отдельной записью, длиннее — человек
// успевает уйти с вкладки раньше своей правки.
const STAGE_SAVE_MS = 700;
// Поля, значение которых ДОНАБИРАЮТ и недобранное кабинет законно отвергает: у Lumean
// голос и template_id — UUID (server/main.py:_normalize_lumean). Пауза в наборе для них
// не значит «готово», поэтому они уезжают по уходу с поля, а не по таймеру. Иначе
// экран показывал бы отказ на полуслове, хотя сервер прав.
const STAGE_SAVE_ON_BLUR = new Set(['voice', 'voice_uuid']);
// Тот же образец, что `_LUMEAN_TEMPLATE_ID_RE` в кабинете (server/main.py).
const LUMEAN_TEMPLATE_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const LUMEAN_HOLD = 'Lumean запишется вместе с шаблоном — впишите его UUID в строку '
  + 'языка или в «Голос по умолчанию».';
// Досылает набранное на открытой вкладке этапа и ждёт ответа кабинета. Возвращает
// причину, по которой записать не вышло, или null. Нужна платным кнопкам шапки
// проекта: они видны, пока человек набирает, и без неё ушли бы со значениями ДО правки.
let STAGE_FLUSH = null;
// Правка сценария, не записанная в проект: «Сделать всё» с ней не запускается — иначе
// озвучился бы прежний `source.txt`, а на экране стоял бы новый текст.
let SCENARIO_DIRTY = null;
// Форма части «Сценарий» / «Обложка» на экране заведения: набрано ли в ней что-то.
let PRESET_PART_DIRTY = null;
// Какие свёрнутые настройки человек раскрыл сам, по `pid:tab`. Экран проекта
// перерисовывается сам (после «Начать», при возврате на вкладку) — без этой памяти
// раскрытое сворачивалось бы обратно у него на глазах.
const STAGE_FOLD_OPEN = {};
// Подписи состояния, при котором настройки свёрнуты.
const STAGE_FOLD_WHY = {running: 'идёт', queued: 'в очереди',
                        planned: 'в плане — стартует сам, когда дозреют материалы',
                        done: 'готово'};

async function renderStageTab(d, tab){
  const p = d.project;
  const skey = p.id + ':' + tab;
  const groupTitle = TAB_SETTINGS_GROUP[tab];
  const settingsData = await api(`/ui/projects/${encodeURIComponent(p.id)}/settings`);
  const group = settingsData.groups.find(g => g.title === groupTitle);
  const settingsForm = group ? fieldForm([group]) : null;
  // Сторож ухода от прошлой отрисовки этой же вкладки снимается здесь: экран сам
  // перерисовывается через 1,2 с после удачного «Начать», и старое замыкание
  // продолжало бы отвечать «не сохранено» за форму, которой уже нет на странице.
  if (LEAVE_GUARD && LEAVE_GUARD.stageTab) LEAVE_GUARD = null;

  // 1. Настройки этапа и действие — ОДНА карточка. Отдельная карточка «Действие» на
  // одну кнопку убрана (жалоба владельца 21.09.2026: «места много, смысла в рамке
  // нет»). Заголовок «Действие» не сообщал ничего — на вкладке «Озвучка» единственное
  // действие и так озвучить, — а рамка с заголовком отодвигала настройки вниз на
  // ~130 px, и до них надо было прокручивать. Теперь «Начать» стоит в заголовке той
  // самой карточки, поля которой он и отправляет.
  // Идентификаторы `stage-go` и `stage-outcome` — дословно прежние: на них держится
  // проверка «призрачного отказа» (tests/test_stage_outcome_ttl_browser.py).
  const goBtn = document.createElement('button');
  goBtn.id = 'stage-go';
  goBtn.textContent = 'Начать';
  const outcomeBox = document.createElement('span');
  outcomeBox.id = 'stage-outcome';
  outcomeBox.className = 'note';
  // Группы настроек у вкладки может и не быть — тогда от карточки остаётся одна строка
  // действия: кнопке и её исходу пропадать не из-за чего.
  const box = settingsForm || $(`<div class="card"><div class="sec"></div></div>`);
  const sec = box.querySelector('.sec');
  const headTitle = (sec.textContent || '').trim()
    || (PROJECT_TABS.find(([k]) => k === tab) || ['', tab])[1];
  const titleSpan = document.createElement('span');
  titleSpan.className = 'grow';
  titleSpan.textContent = headTitle;
  sec.textContent = '';
  sec.className = 'sec stage-head';
  sec.append(titleSpan, outcomeBox, goBtn);
  app.append(box);

  // Этап идёт, ждёт в очереди или поставлен «Сделать всё» в план — настройки
  // сворачиваются в одну строку (просьба владельца 21.09.2026: «они много места
  // занимают»). Сворачивание — ради места, не запрет: у идущего и стоящего в очереди
  // правка уже не изменит поставленное, а этап «в плане» стартует позже с ТЕКУЩИМИ
  // настройками проекта — поэтому их можно развернуть и поправить. Раскрытое
  // запоминается до конца работы этапа.
  // Готовый этап — тоже свёрнут (владелец 22.09.2026: «когда этап уже готов, настройки
  // удобно скрывать, а развернуть — стрелочкой на уровне кнопки „Начать“»).
  const segNow = ((p.stage && p.stage.segments) || []).find(x => x.stage === tab);
  // «В плане» важнее «готово»: «Сделать всё» ставит видео и сборку в план и у
  // проекта, где они уже есть, — и стартуют они с ТЕКУЩИМИ настройками.
  const foldState = (segNow && ['running', 'queued'].includes(segNow.state)) ? segNow.state
    : (p.planned || []).includes(tab) ? 'planned'
    : (segNow && segNow.state === 'done') ? 'done' : '';
  const foldCard = settingsForm ? box.querySelector('.card') : null;
  // Раскрытое помнится только в том же состоянии этапа: ушёл в работу, закончился —
  // снова свёрнуто по умолчанию, а не «как раскрыли вчера в другом состоянии».
  if (STAGE_FOLD_OPEN[skey] && STAGE_FOLD_OPEN[skey] !== foldState) delete STAGE_FOLD_OPEN[skey];
  if (foldCard && foldState){
    const why = document.createElement('span');
    why.id = 'stage-fold-why';
    why.className = 'note muted';
    why.textContent = STAGE_FOLD_WHY[foldState];
    const foldBtn = document.createElement('button');
    foldBtn.type = 'button';
    foldBtn.id = 'stage-fold';
    foldBtn.className = 'iconbtn fold';
    foldBtn.innerHTML = ICON.expand;
    const paintFold = () => {
      const open = STAGE_FOLD_OPEN[skey] === foldState;
      foldCard.classList.toggle('folded', !open);
      const word = open ? 'Свернуть настройки' : 'Развернуть настройки';
      foldBtn.title = word;
      foldBtn.setAttribute('aria-label', word);
      foldBtn.setAttribute('aria-expanded', String(open));
    };
    foldBtn.onclick = () => {
      if (STAGE_FOLD_OPEN[skey] === foldState) delete STAGE_FOLD_OPEN[skey];
      else STAGE_FOLD_OPEN[skey] = foldState;
      paintFold();
    };
    titleSpan.after(why);
    goBtn.before(foldBtn);
    paintFold();
  }

  // Показать исход предыдущего нажатия сразу же — переживает перерисовку экрана.
  const savedOutcome = STAGE_OUTCOME_STATE[skey];
  if (savedOutcome && Date.now() - (savedOutcome.at || 0) > STAGE_OUTCOME_TTL_MS){
    delete STAGE_OUTCOME_STATE[skey];          // протух — не показываем вчерашний ответ
  } else if (savedOutcome){
    outcomeBox.textContent = savedOutcome.text;
    outcomeBox.classList.add(savedOutcome.cls);
  }
  // «Начать» шлёт ТЕКУЩИЕ значения формы настроек этой вкладки (fieldForm(...).read()),
  // чтобы старт не сбросил их на «как по умолчанию» (поправка оркестратора к §5.4).
  // Автосохранение ниже этого не отменяет: пустое тело кабинет трактует как
  // `engine="edge"` и молча увёл бы проект с Lumean (web/app.py:7322-7352).
  goBtn.onclick = async () => {
    goBtn.disabled = true;
    outcomeBox.className = 'note';
    outcomeBox.textContent = 'запускаю…';
    // Адрес на момент нажатия — чтобы отложенное обновление ниже не сработало,
    // если человек за эти 1,2 с уже ушёл с этой вкладки (Issue 3).
    const hashAtClick = location.hash;
    try{
      const settings = settingsForm ? settingsForm.read() : {};
      const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/stage/${tab}`,
                             {settings});
      // Пять честных исходов (поправка 1 триажа) — «поставлено» только когда
      // outcome === 'started'; остальное — своя правдивая подпись (принцип 3).
      const text = out.outcome === 'started'
        ? `Поставлено: задача #${out.job_id}`
        : (STAGE_OUTCOME_TEXT[out.outcome] || out.outcome);
      const cls = out.outcome === 'started' ? 'muted' : 'bad';
      STAGE_OUTCOME_STATE[skey] = {text, cls, at: Date.now()};
      outcomeBox.textContent = text;
      outcomeBox.classList.add(cls);
      if (out.outcome === 'started'){
        setTimeout(() => { if (location.hash === hashAtClick) viewProject(p.id); }, 1200);
      }
    }catch(e){
      STAGE_OUTCOME_STATE[skey] = {text: e.message, cls: 'bad', at: Date.now()};
      outcomeBox.textContent = e.message;         // текст кабинета как есть (принцип 3)
      outcomeBox.classList.add('bad');
    }finally{ goBtn.disabled = false; }
  };

  // 2. Настройки этапа сохраняются САМИ — кнопки «Сохранить» здесь больше нет.
  // Ручка та же, что была у неё: POST /ui/projects/{pid}/settings. Кабинет по ней
  // только СЛИВАЕТ присланные ключи в projects.settings (_mutate_project_settings,
  // BEGIN IMMEDIATE, слиянием) — ни задачи, ни списания. Поэтому запись по паузе в
  // наборе ничего не запускает и ни за что не платит.
  // Автосохранение стоит ТОЛЬКО здесь. Ни «Начать» (/stage/{kind} ставит платную
  // задачу), ни «Сделать всё» (/run — весь конвейер), ни вкладка «Обложка» (платный
  // заказ), ни источник сценария (/source затирает source.txt без второй копии)
  // сами не отправляются: там «сохранить» означает работу и деньги.
  if (settingsForm){
    const foot = $(`<div class="stage-foot" hidden>
      <span id="stage-save" class="note"></span>
      <button type="button" id="stage-retry" class="ghost small" hidden>Повторить</button>
      <button type="button" id="stage-undo" class="ghost small" hidden
              style="margin-left:auto"
              title="вернёт значения, какими они были при открытии вкладки, и запишет их"
        >Вернуть как было</button>
      </div>`).firstElementChild;
    box.querySelector('.card').append(foot);
    const status = foot.querySelector('#stage-save');
    const retryBtn = foot.querySelector('#stage-retry');
    const undoBtn = foot.querySelector('#stage-undo');

    const entry = settingsForm.read();       // что лежало на сервере при входе на вкладку
    const saved = Object.assign({}, entry);  // что лежит там сейчас
    let timer = null, inFlight = false, again = false, failReason = null, held = null;

    // Слияние на сервере позволяет слать ТОЛЬКО отличия; пустое тело ручка отвергает
    // (web/app.py:7306), и это правильно — сохранять нечего.
    const diff = from => {
      const now = settingsForm.read(), out = {};
      for (const k in now) if (!sameValue(now[k], from[k])) out[k] = now[k];
      return out;
    };
    const paint = () => {
      undoBtn.hidden = !Object.keys(diff(entry)).length;
      retryBtn.hidden = !failReason;
      foot.hidden = undoBtn.hidden && retryBtn.hidden && !status.textContent;
      // Откатывать стало нечего, пока висел вопрос, — вопрос снимается, а кнопка
      // возвращается в строй. Иначе он прятался вместе с подвалом и всплывал потом
      // устаревшим, а кнопка оставалась выключенной до перерисовки экрана.
      if (undoBtn.hidden){
        const ask = foot.querySelector('.inline-ask');
        if (ask) ask.remove();
        undoBtn.disabled = false;
      }
    };
    const say = (text, cls) => {
      status.className = 'note' + (cls ? ' ' + cls : '');
      status.textContent = text;
      paint();
    };
    const myHash = location.hash;
    const guardOff = () => {
      if (LEAVE_GUARD && LEAVE_GUARD.stageTab === skey) LEAVE_GUARD = null;
    };
    // Сторож один на оба случая: запись отвергнута или придержана. Текст читается в
    // момент ухода, а не в момент постановки — к тому времени причина могла смениться.
    const guardOn = () => {
      if (!settingsForm.isConnected) return;
      LEAVE_GUARD = {stageTab: skey, hash: myHash, keep: h => h === myHash,
                     dirty: () => failReason != null || held != null,
                     get what(){
                       return failReason != null
                         ? `Настройки «${headTitle}» не сохранены: ${failReason}.`
                         : `Движок Lumean в «${headTitle}» не записан: ему нужен шаблон.`;
                     }};
    };
    // Выбор «Lumean» в «Движке» — первый шаг настройки, а не готовое значение: кабинет
    // законно отвергает Lumean без UUID шаблона (`_normalize_lumean_settings`), а поле
    // шаблона человек заполнит только следующим шагом. Отправь мы движок сразу — первый
    // же клик давал бы красное «не сохранено», тост и сторож ухода. Поэтому движок
    // придерживается, пока шаблона нет нигде: ни в «Голосе по умолчанию», ни в
    // template_id, ни в строке карты языков. Остальные правки уходят как обычно.
    // Неверный UUID в строке языка НЕ придерживается: его человек уже вписал, и отказ
    // кабинета с объяснением — ровно то, что ему нужно увидеть.
    const holdLumean = values => {
      if (!('engine' in values)) return null;
      const now = settingsForm.read();
      if (String(now.engine || '').trim().toLowerCase() !== 'lumean') return null;
      const uuid = v => LUMEAN_TEMPLATE_RE.test(String(v || '').trim());
      const rows = String(now.voice_by_lang || '').split(/[,\n]/).filter(c => {
        const i = c.indexOf(':');
        return i > 0 && c.slice(0, i).trim() && c.slice(i + 1).trim();
      });
      if (uuid(now.voice) || uuid(now.voice_uuid) || rows.length) return null;
      delete values.engine;
      return LUMEAN_HOLD;
    };

    const send = async () => {
      clearTimeout(timer); timer = null;
      // Один запрос в полёте: _mutate_project_settings берёт BEGIN IMMEDIATE на одну
      // строку, а пульт ждёт кабинет синхронно до 18 с. Набор в поле иначе породил бы
      // хвост параллельных записей; следующая уходит одна, из последнего состояния.
      if (inFlight){ again = true; return; }
      const values = diff(saved);
      const wasHeld = held;
      held = holdLumean(values);
      if (held) guardOn();
      else if (wasHeld && failReason == null) guardOff();
      if (!Object.keys(values).length){
        // Форма снова совпадает с сервером — прежний отказ больше ни о чём. Без этого
        // «не сохранено» висело бы вечно, «Повторить» слал бы пустоту, сторож ухода
        // пугал потерей, которой нет, а «Сделать всё» отказывалось бы запускать.
        const hadFail = failReason != null;
        if (hadFail){ failReason = null; if (!held) guardOff(); }
        if (held) say(held, 'warn');
        else if (wasHeld || hadFail) say('');
        return;
      }
      inFlight = true;
      say('сохраняю…');
      try{
        await post(`/ui/projects/${encodeURIComponent(p.id)}/settings`, {values});
        Object.assign(saved, values);
        failReason = null;
        if (held) say(held, 'warn');
        else { guardOff(); say('сохранено ' + new Date().toTimeString().slice(0, 5)); }
      }catch(e){
        // Набранное НЕ откатываем и снимок несохранённого держим: «Lumean требует UUID
        // Template ID» — законный ответ на недобранное поле, а не сбой, и дописать его
        // человек может только в своём же значении. Следующая правка отправит
        // непрошедшее вместе с новым.
        const firstOfSeries = failReason == null;
        failReason = e.message;
        // Кнопки «Сохранить» больше нет — значит, и защиты от потери нет. Её место
        // занимает сторож ухода, и только на «не сохранено»: пока запись проходит,
        // спрашивать не о чем, правка уже на сервере.
        // Если отказ пришёл, когда вкладку уже покинули (запись уходит и по уходу с
        // поля), сторожу нечего стеречь: формы с набранным на странице нет, и
        // «остаться» ничего не вернёт. Тогда остаётся сказать словами — тостом ниже.
        guardOn();
        say('не сохранено: ' + e.message, 'bad');
        if (firstOfSeries) toast(e.message);   // один тост на серию, а не на букву
      }finally{
        inFlight = false;
        if (again){ again = false; send(); }
      }
    };
    const arm = () => { clearTimeout(timer); timer = setTimeout(send, STAGE_SAVE_MS); };

    // Карта голосов шлёт `change` со скрытого поля на КАЖДУЮ букву в строке id
    // (wireLangMap.sync через setFieldValue) — при Lumean это недобранный UUID.
    // Такие поля ждут ухода с поля; всё остальное — селекты, переключатели, выбор
    // шаблона, пресет соседа — приходит готовым значением и уезжает сразу.
    const slow = el => !!(el && el.closest && (el.closest('.langmap')
      || STAGE_SAVE_ON_BLUR.has((el.dataset || {}).key)));
    const stillTyping = () => {
      const a = document.activeElement;
      return !!(a && a.classList && a.classList.contains('lm-voice'));
    };
    settingsForm.addEventListener('input', ev => {
      paint();
      if (!slow(ev.target)) arm();
    });
    settingsForm.addEventListener('change', ev => {
      paint();
      if (slow(ev.target) && stillTyping()) return;
      send();
    });
    settingsForm.addEventListener('focusout', () => { paint(); send(); });
    retryBtn.onclick = () => send();

    STAGE_FLUSH = async () => {
      if (!settingsForm.isConnected) return null;
      for (let i = 0; i < 400; i++){
        if (!inFlight){
          await send();                      // нечего слать — вернётся сразу
          if (failReason != null) return failReason;
          if (held) return held;
          if (!inFlight && !Object.keys(diff(saved)).length) return null;
        }
        await new Promise(r => setTimeout(r, 50));
      }
      return 'сервер не ответил на запись настроек';
    };

    // Откат при автосохранении — это ЗАПИСЬ: набранное уже лежит на сервере, и вернуть
    // одну форму значило бы показывать человеку не то, что хранится. Поэтому «Вернуть
    // как было» отправляет значения на момент открытия вкладки и перерисовывает экран —
    // форма собирается из ответа сервера, а не из нашей памяти о нём.
    undoBtn.onclick = async () => {
      // Нажатие мышью сперва снимает фокус с поля, а `focusout` зовёт `send()`. Без
      // ожидания получались ДВА одновременных запроса в одну строку настроек:
      // набранное и возвращаемое. Порядок прихода не определён, и если набранное
      // ложилось последним, на сервере оставалось оно, а экран показывал возвращённое.
      // Поэтому откат ждёт, пока текущая запись закончится, и запрещает следующую.
      clearTimeout(timer);
      again = false;
      undoBtn.disabled = true;
      let spins = 0;
      while (inFlight && spins++ < 200) await new Promise(r => setTimeout(r, 50));

      const count = Object.keys(diff(entry)).length;
      if (!count){ undoBtn.disabled = false; return; }
      // Откат ПИШЕТ на сервер и возвращает всё, что изменилось с открытия вкладки, —
      // в том числе правки, сохранённые давно. Это самое сильное действие на экране,
      // и спрашивать о нём обязательно: в проекте подтверждают куда меньшее.
      confirmInline(undoBtn,
        `Вернуть ${count} настр. к значениям на момент открытия `
        + `вкладки? Это запишется на сервер.`,
        async () => {
          // Что откатывать — считаем в момент ответа, а не вопроса: пока он висел,
          // человек мог поправить форму ещё раз.
          const values = {};
          Object.keys(diff(entry)).forEach(k => { values[k] = entry[k]; });
          if (!Object.keys(values).length){ undoBtn.disabled = false; return; }
          try{
            inFlight = true;
            await post(`/ui/projects/${encodeURIComponent(p.id)}/settings`, {values});
            failReason = null;
            guardOff();
            await viewProject(p.id);
          }catch(e){ toast(e.message); undoBtn.disabled = false; }
          finally{ inFlight = false; }
        },
        () => { undoBtn.disabled = false; });
    };
    paint();
  }

  // 3. Результат
  const mine = d.files.filter(g => (TAB_FILES[tab] || []).includes(g.code));
  if (mine.length) for (const g of mine) app.append(fileCard(d, g));
  else app.append(emptyResultCard());

  // 4. Лог задач
  app.append(jobsLogCard(d, tab));
}

/* ───────────────────────── вкладка «Сценарий» ───────────────────────── */
// У Rewrite нет понятия «проект VSGen» — GET /ui/text не фильтруется по проекту, и
// связать задачу рерайта с этим проектом в данных нечем. Решение оркестратора
// (review-feedback-F4 цикл 2, Issue 4): needs-clarification.md не писать и новую
// связь в данных не придумывать — вкладка показывает те же «последние задачи текста»,
// что и #/text (тот же источник, без новой ручки сервера), честно подписано, что
// список — по аккаунту, а не по проекту; задача, созданная тут же, — первой в списке.
// Опрос переиспользует LOG_TIMERS/clearAllLogTimers (тот же реестр, что у раскрытого
// лога задачи выше) — останавливается сам при уходе со страницы (смене hash).
// Состояние вкладки переживает перерисовку экрана (viewProject вызывается после
// каждого действия), поэтому набранное человеком тут и хранится. `any: null` — это
// «на вкладку ещё не заходили»: в этом случае поле источника заполняется тем, что
// записано у проекта, а дальше уже не перетирается (иначе правка пропадала бы от
// любой перерисовки). Режимов теперь два: `auto` — одно поле на ссылку и текст,
// `topic` — с нуля по теме, где источника нет вовсе.
const SCEN_STATE = {};
function scenState(pid){
  if (!SCEN_STATE[pid]) SCEN_STATE[pid] = {mode: 'auto', langs: new Set(),
                                           model: '', preset: '', lastJob: null,
                                           any: null, topic: '', fileName: '',
                                           fileText: '', seen: null, seenFor: null};
  return SCEN_STATE[pid];
}
// Терминальные состояния СПИСКА задач Rewrite/Cover (не `queue_tasks` кабинета —
// у тех `LOG_TERMINAL` выше): пока среди показанных есть бегущая/ждущая, есть смысл
// продолжать опрашивать.
const JOB_LIST_TERMINAL = new Set(['done', 'partial', 'cancelled', 'error', 'blocked']);
function jobListPollKey(kind, pid){ return `${kind}-jobs:${pid}`; }

async function fetchText(path){
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('файл не прочитался: HTTP ' + r.status);
  return r.text();
}

// Раскрывающаяся строка результата задачи — та же механика RESULT_OPEN, что у
// #/text/#/covers (`wireResults`), но `paint` умеет класть готовый файл в проект,
// чего нет у общего `paintResults`. Клик вынесен в отдельную `wireOneJobRow` (review-
// feedback-F4 цикл 3, Issue 1): `syncJobsTable` навешивает её на КОНКРЕТНУЮ новую
// строку без повторного прохода по всей таблице — общий `wireProjectJobRows` ниже
// на уже открытых строках сам эмулирует клик (`tr.click()`), и повторный вызов на
// всей таблице закрыл бы то, что уже открыто.
function wireOneJobRow(tr, service, colspan, paint){
  tr.style.cursor = 'pointer';
  tr.onclick = ev => {
    if (ev.target.closest('button, a')) return;
    const id = tr.dataset.job;
    const key = service + ':' + id;
    const next = tr.nextElementSibling;
    if (next && next.classList.contains('res-row')){
      next.remove(); RESULT_OPEN.delete(key); return;
    }
    RESULT_OPEN.add(key);
    tr.insertAdjacentHTML('afterend',
      `<tr class="res-row"><td colspan="${colspan}" style="padding-top:0">` +
      '<div class="muted">загрузка…</div></td></tr>');
    paint(id, tr.nextElementSibling.querySelector('div'));
  };
}
function wireProjectJobRows(root, service, colspan, paint){
  root.querySelectorAll('tr[data-job]').forEach(tr => {
    wireOneJobRow(tr, service, colspan, paint);
    if (RESULT_OPEN.has(service + ':' + tr.dataset.job)) tr.click();
  });
}

// Ячейка «Состояние» строки списка задач Rewrite/Cover — общая для первой отрисовки
// таблицы и для точечного обновления тиком опроса (`syncJobsTable`), чтобы обе
// рисовали её одинаково. `service` — чья это задача: от него зависит кнопка лога, и
// передаёт его ВЫЗЫВАЮЩИЙ, а не догадка по виду строки. Тик тоже обязан передать его:
// он перерисовывает эту ячейку целиком, и без него кнопка пропадала бы с первым же
// изменением состояния — то есть ровно в тот миг, когда задача упала.
function jobListStateCellHtml(j, service){
  return `<span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
    ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
    ${j.progress != null ? `<div class="bar"><i style="width:${
      Math.round(j.progress * 100)}%"></i></div>` : ''}
    ${jobLogBtnHtml(service, j.id, j.state)}`;
}
// Тик опроса списка задач Rewrite/Cover (review-feedback-F4 цикл 3, Issue 1): не
// перестраивает таблицу через `box.innerHTML` — это стирало бы раскрытые result-row и
// всё внутри них (в т.ч. `confirmInline` у «Взять в проект» — Issue 1 цикла 3). Вместо
// этого обновляется только ячейка `.jl-state` строк, у которых изменилось состояние
// (по `data-state` на `<tr>`), новые задачи дописываются новыми строками, а уже
// раскрытый результат перечитывается РОВНО ОДИН раз — в момент, когда задача только
// что перешла в терминальное состояние (а не на каждом тике). Строки, которых больше
// нет в ответе сервера, не удаляются: связь с проектом только добавляется, пропасть
// строка может лишь при удалении задачи в самом сервисе — до следующего захода на вкладку.
// Отпечаток строки: состояние + прогресс + подпись. Внутри `running` меняются только
// прогресс и подпись, поэтому сравнивать по одному состоянию нельзя — полоска застынет.
function jobRowPrint(j){
  return [j.state, j.progress == null ? '' : j.progress, j.detail || ''].join('|');
}
// Снять СВОЙ таймер опроса: реестр чистится, только если под ключом всё ещё он.
// Иначе запоздавший тик старого экрана погасил бы опрос нового под тем же ключом.
function stopOwnPoll(key, handle){
  clearInterval(handle);
  if (LOG_TIMERS[key] === handle) delete LOG_TIMERS[key];
}
function syncJobsTable(box, jobs, service, rowHtml, colspan, paint){
  const table = box.querySelector('table');
  if (!table) return;                          // таблицы ещё нет — рано, ждём полной отрисовки
  const tbody = table.querySelector('tbody');
  const rows = {};
  tbody.querySelectorAll('tr[data-job]').forEach(tr => { rows[tr.dataset.job] = tr; });
  jobs.forEach(j => {
    const id = String(j.id);
    const tr = rows[id];
    if (!tr){
      tbody.insertAdjacentHTML('beforeend', rowHtml(j));   // новая задача — новая строка в конец
      wireOneJobRow(tbody.lastElementChild, service, colspan, paint);
      return;
    }
    if (tr.dataset.print === jobRowPrint(j)) return;   // ни состояние, ни прогресс, ни подпись не изменились
    const wasTerminal = JOB_LIST_TERMINAL.has(tr.dataset.state);
    const cell = tr.querySelector('.jl-state');
    if (cell) cell.innerHTML = jobListStateCellHtml(j, service);
    tr.dataset.state = j.state;
    tr.dataset.print = jobRowPrint(j);
    const key = service + ':' + id;
    if (!wasTerminal && JOB_LIST_TERMINAL.has(j.state) && RESULT_OPEN.has(key)){
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('res-row')) paint(id, next.querySelector('div'));
    }
  });
}

async function paintTextTake(jobId, host, pid, srcTextEl){
  try{
    const fd = await api(`/ui/files/rewrite/${encodeURIComponent(jobId)}`);
    if (!fd.files.length){
      host.innerHTML = '<span class="muted">Файлов пока нет — рерайт ещё не готов.</span>';
      return;
    }
    host.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px">${fd.files.map(f => `
      <div style="display:flex;gap:10px;align-items:center">
        <span class="mono">${esc(f.name)}</span>
        <button class="ghost small tx-take" data-name="${esc(f.name)}"
          >Взять в проект</button>
      </div>`).join('')}</div>`;
    host.querySelectorAll('.tx-take').forEach(btn => btn.onclick = async () => {
      const name = btn.dataset.name;
      const apply = async () => {
        btn.disabled = true;
        try{
          const text = await fetchText(
            `/ui/files/rewrite/${encodeURIComponent(jobId)}/${encodeURIComponent(name)}`);
          await post(`/ui/projects/${encodeURIComponent(pid)}/source`, {text});
          if (srcTextEl) srcTextEl.value = text;
          toast('Текст взят в проект', 'ok');
        }catch(e){ toast(e.message); }
        finally{ btn.disabled = false; }
      };
      const cur = srcTextEl ? srcTextEl.value.trim() : '';
      if (cur) confirmInline(btn, 'Заменить текущий текст проекта?', apply);
      else await apply();
    });
  }catch(e){
    host.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
  }
}

// Строка списка «задачи текста проекта» — общая для первой отрисовки
// таблицы (`refreshScenarioJobs`) и для точечного дополнения тиком (`syncJobsTable`).
function scenJobRowHtml(j){
  return `<tr data-job="${esc(j.id)}" data-state="${esc(j.state)}" data-print="${esc(jobRowPrint(j))}">
    <td><div style="font-weight:600">${esc(j.title)}</div>
        <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
    <td>${j.kind === 'generation' ? 'с нуля' : 'рерайт'}</td>
    <td>${(Array.isArray(j.langs) ? j.langs : [j.langs]).map(esc).join(', ') || '—'}</td>
    <td class="jl-state">${jobListStateCellHtml(j, 'rewrite')}</td>
    <td class="muted when">${when(j.created)}</td>
  </tr>`;
}
// Список «задачи текста проекта»: источник — `GET /ui/text?project_id=` (связь
// `project_service_jobs` пишется при постановке из вкладки, 17.09.2026), порядок —
// постановки, задача, созданная тут же (`st.lastJob`), — первой. Опрашивается раз в 3с, пока среди показанных есть
// незавершённая (review-feedback-F4 цикл 2, Issue 4а — готовый результат должен
// дочитываться сам, не только после ухода с вкладки и возврата).
// review-feedback-F4 цикл 3: полная перестройка (`box.innerHTML`) — только здесь, при
// первом заходе на вкладку/сразу после постановки новой задачи; тик опроса ниже правит
// таблицу на месте через `syncJobsTable` (Issue 1 — не стирать раскрытые result-row) и
// проверяет `location.hash`/`box.isConnected` ПОСЛЕ каждого своего ответа, а не только
// при первом входе (Issue 2 — не оживать на чужом экране, если ответ задержался и hash
// уже сменился); busy-флаг и перехват ошибки — тот же приём, что у `startJobLogPoll`.
async function refreshScenarioJobs(box, pid, srcTextEl){
  const key = jobListPollKey('scenario', pid);
  stopJobLogPoll(key);
  const hashAtStart = location.hash;
  const st = scenState(pid);
  const td = await api(`/ui/text?project_id=${encodeURIComponent(pid)}`);
  if (location.hash !== hashAtStart || !box.isConnected) return;   // ушли со страницы, пока список грузился
  const jobs = td.jobs.slice();
  if (st.lastJob != null){
    const i = jobs.findIndex(j => String(j.id) === String(st.lastJob));
    if (i > 0){ const [j] = jobs.splice(i, 1); jobs.unshift(j); }
  }
  box.innerHTML = `<div class="note muted" style="margin:14px 0 8px">Задачи текста этого
    проекта ${hintDot('Здесь поставленные из этой вкладки, новые сверху. '
      + 'Нажмите на строку — покажется результат.')}</div>
    ${jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Вид</th><th>Языки</th><th>Состояние</th><th>Создана</th></tr></thead>
      <tbody>${jobs.map(scenJobRowHtml).join('')}</tbody></table>`
      : '<div class="empty">У проекта задач текста пока нет.</div>'}`;
  wireProjectJobRows(box, 'rewrite', 5, (jid, host) => paintTextTake(jid, host, pid, srcTextEl));

  if (!jobs.some(j => !JOB_LIST_TERMINAL.has(j.state))) return;   // все терминальны — опрашивать нечего
  let busy = false;
  const tick = async () => {
    if (busy) return;
    busy = true;
    try{
      const d2 = await api(`/ui/text?project_id=${encodeURIComponent(pid)}`);
      if (location.hash !== hashAtStart || !box.isConnected){ stopOwnPoll(key, handle); return; }
      const jobs2 = d2.jobs.slice();
      if (st.lastJob != null){
        const i = jobs2.findIndex(j => String(j.id) === String(st.lastJob));
        if (i > 0){ const [j] = jobs2.splice(i, 1); jobs2.unshift(j); }
      }
      syncJobsTable(box, jobs2, 'rewrite', scenJobRowHtml, 5,
        (jid, host) => paintTextTake(jid, host, pid, srcTextEl));
      if (!jobs2.some(j => !JOB_LIST_TERMINAL.has(j.state))) stopOwnPoll(key, handle);
    }catch(e){
      // сеть иногда сбоит — список не стираем, следующий тик попробует снова
    }finally{ busy = false; }
  };
  // Два наложившихся вызова оба дошли сюда: снять уже записанный таймер, чтобы он не
  // выпал из реестра и не опрашивал сервис до перезагрузки страницы.
  stopJobLogPoll(key);
  const handle = setInterval(tick, 3000);
  LOG_TIMERS[key] = handle;
}

async function renderScenarioTab(d){
  const p = d.project;
  const st = scenState(p.id);
  const td = await api('/ui/text');
  if (!st.model && td.models.length) st.model = td.models[0].value;
  // Режим «с нуля по теме» — единственный, который остаётся ОТДЕЛЬНЫМ: там нет
  // источника вообще, есть тема и бриф. Название и пояснение берутся у сервера
  // (TEXT_MODES), чтобы слова были одни и те же и здесь, и на #/text.
  const topicMode = (td.modes || []).find(m => m.key === 'topic')
                 || {title: 'С нуля по теме', note: 'текста нет, есть тема и бриф'};

  // 1. «Откуда взять сценарий» — ОДИН блок в начале вкладки (жалоба владельца
  // 20.09.2026: «сверху ссылка на донора, а потом снизу висит исходный текст
  // какой-то»). Раньше выбор источника был разорван: ссылка/тема — сверху карточки
  // «Действие», вставленный текст — врезкой в самом её низу, и связи между ними
  // человек не видел.
  //
  // Поле источника теперь одно на ссылку и на текст («желательно чтобы в строку он и
  // текст и ссылку распознавал»), а решает, что именно вставили, СЕРВЕР —
  // POST /ui/source/detect. Свои правила разбора в браузере рано или поздно
  // разошлись бы с серверными, и разошлись бы на платном заказе.
  //
  // Смыслы при этом не свалены в кучу: «Сохранить сценарий» — бесплатно и сразу,
  // «Получить текст» — платный заказ у рерайта. Что произойдёт по нажатию, написано
  // рядом с каждой кнопкой ДО нажатия. Ссылку донора кнопкой больше не запоминают —
  // она запоминается сама, как только сервер её распознал (см. `rememberLink`).
  let origin = d.origin || {};
  if (st.any === null){
    // Первый заход на вкладку: поле заполняется тем, что записано у проекта — это
    // вторая половина жалобы «ссылку на донора не сохранило».
    st.mode = (origin.kind === 'topic') ? 'topic' : 'auto';
    st.topic = (origin.kind === 'topic') ? (origin.value || '') : '';
    // Сценарий (kind=text|file) в поле источника НЕ дублируется: он и так ниже,
    // целиком и с правкой. Вторая копия того же текста — ровно та путаница, на
    // которую жаловались.
    st.any = (origin.kind === 'link') ? (origin.value || '') : '';
  }

  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Откуда взять сценарий</div>
    <div class="secbody">
    <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
      <div class="note muted" id="or-now" style="margin-top:0"></div>
      <button type="button" class="ghost small" id="or-forget" hidden>Забыть ссылку</button>
    </div>
    <div class="note muted" id="or-release" hidden></div>
    <div class="srcrow">
      <div class="modes">
        <button type="button" data-mode="auto" class="${st.mode === 'topic' ? '' : 'on'}"
          >Ссылка или готовый текст</button>
        <button type="button" data-mode="topic" class="${st.mode === 'topic' ? 'on' : ''}"
          >${esc(topicMode.title)}</button>
      </div>
      <span id="tx-filebox" class="srcfile">
        <label class="filepick">
          <span class="pickbtn">Выбрать файл .txt</span>
          <input id="src-file" type="file" accept=".txt,text/plain">

        <span class="muted" id="tx-fname" style="font-size:12.5px"></span>
