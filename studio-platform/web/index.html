<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<style>
  /* Тёмная тема с фиолетовым акцентом. Правила, по которым она собрана, а не просто
     подобрана на глаз:

     — три уровня глубины и не больше: фон, поверхность, приподнятая поверхность.
       Больше уровней в тёмной теме читаются как грязь, а не как иерархия;
     — фиолетовый только для действия и текущего места. Состояния (готово, идёт,
       ошибка) остаются своими цветами: если акцент раскрасить всё, статус перестаёт
       быть заметным, а он здесь важнее красоты;
     — на тёмном чистый белый текст «звенит», поэтому основной — чуть приглушённый,
       а белый оставлен заголовкам и активным элементам;
     — состояния на тёмном строятся как цветной текст на его же полупрозрачной
       заливке: так они читаются и не спорят с фоном. */
  :root{
    --bg:#0d0b12;            /* почти чёрный с фиолетовым подтоном */
    --card:#16131d;          /* поверхность */
    --card-2:#1d1929;        /* приподнятая: строки таблиц при наведении, поля ввода */
    --line:#2a2438;
    --line-2:#3a3150;
    --ink:#eceaf2;           /* основной текст */
    --ink-hi:#ffffff;        /* заголовки и активное */
    --muted:#9d96b5;
    --acc:#8b5cf6;           /* фиолетовый: действие и текущее место */
    --acc-hi:#a78bfa;
    --acc-dim:rgba(139,92,246,.16);
    --ok:#4ade80;    --ok-bg:rgba(74,222,128,.13);
    --run:#60a5fa;   --run-bg:rgba(96,165,250,.14);
    --wait:#fbbf24;  --wait-bg:rgba(251,191,36,.14);
    --bad:#f87171;   --bad-bg:rgba(248,113,113,.14);
    --off:#7c748f;   --off-bg:rgba(124,116,143,.15);
    --surface:var(--card); --border:var(--line);
    --r:12px;
  }
  *{box-sizing:border-box}
  ::selection{background:var(--acc);color:#fff}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",
            Inter,Roboto,system-ui,sans-serif;
       font-weight:450;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  a{color:var(--acc-hi);text-decoration:none}
  a:hover{color:var(--ink-hi)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  header{background:rgba(13,11,18,.86);backdrop-filter:saturate(160%) blur(12px);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav{display:flex;gap:2px;align-items:center;padding:0 20px;max-width:1180px;margin:0 auto;
      flex-wrap:wrap}
  nav .brand{font-weight:800;margin-right:22px;padding:15px 0;letter-spacing:-.02em;
             font-size:17px;color:var(--ink-hi)}
  nav .brand b{color:var(--acc-hi)}
  nav a.tab{padding:15px 13px;color:var(--muted);text-decoration:none;font-weight:550;
            border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
  nav a.tab:hover{color:var(--ink)}
  nav a.tab.on{color:var(--ink-hi);border-bottom-color:var(--acc)}
  nav span.soon{padding:15px 13px;color:#5a5470;cursor:not-allowed;white-space:nowrap}
  nav span.soon::after{content:" скоро";font-size:11px;opacity:.8}
  nav .who{padding:15px 0 15px 16px;color:var(--muted);font-size:13px;white-space:nowrap}

  main{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
  h1{font-size:26px;margin:0 0 5px;font-weight:750;letter-spacing:-.02em;color:var(--ink-hi)}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

  select,input,textarea,button{font:inherit;color:inherit}
  select,input,textarea{background:var(--card-2);border:1px solid var(--line-2);
                        border-radius:9px;padding:9px 11px;color:var(--ink)}
  select:focus,input:focus,textarea:focus{outline:0;border-color:var(--acc);
                                          box-shadow:0 0 0 3px var(--acc-dim)}
  textarea{width:100%;min-height:120px;resize:vertical;
           font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
  button{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:9px 16px;
         cursor:pointer;font-weight:650;letter-spacing:-.01em;transition:background .15s}
  button:hover{background:var(--acc-hi)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  button.ghost:hover{background:var(--card-2);color:var(--ink-hi)}
  button:disabled{opacity:.45;cursor:default}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line)}
  td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.row:hover,tr[data-job]:hover{background:var(--card-2);cursor:pointer}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;
        font-weight:650;letter-spacing:-.01em}
  .s-done{background:var(--ok-bg);color:var(--ok)}
  .s-running{background:var(--run-bg);color:var(--run)}
  .s-queued{background:var(--wait-bg);color:var(--wait)}
  .s-error{background:var(--bad-bg);color:var(--bad)}
  .s-idle{background:var(--off-bg);color:var(--off)}
  .s-off{background:transparent;color:var(--off);border:1px dashed var(--line-2)}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
  .bar{height:5px;background:var(--card-2);border-radius:4px;overflow:hidden;margin-top:8px;
       max-width:230px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-hi))}
  /* Полоска по этапам: семь отрезков вместо одной шкалы «сколько процентов».
     Процент по выпуску — выдумка: этапы разной длины и часть из них необязательна. */
  .segs{display:flex;gap:3px;margin-top:7px;max-width:260px}
  .segs i{flex:1;height:5px;border-radius:2px;background:var(--off-bg);cursor:default}
  .segs i.done{background:var(--ok)}
  .segs i.running{background:linear-gradient(90deg,var(--acc),var(--acc-hi));
                  animation:pulse 1.6s ease-in-out infinite}
  .segs i.queued{background:var(--wait);opacity:.55}
  .segs i.error{background:var(--bad)}
  .segs i.off{background:transparent;border:1px dashed var(--line-2)}
  /* Переделать один кадр — ТЗ §14. Кнопка появляется на самой миниатюре: искать
     номер сцены в отдельном поле человек не станет, он смотрит на картинку. */
  .thumb{position:relative;display:inline-block;line-height:0}
  .thumb img{display:block;border-radius:5px;border:1px solid var(--line)}
  .thumb .again{position:absolute;right:3px;bottom:3px;opacity:0;transition:opacity .12s;
                background:rgba(13,11,18,.82);color:#fff;border:0;border-radius:5px;
                padding:2px 7px;font-size:11px;font-weight:650;cursor:pointer;line-height:1.5}
  .thumb:hover .again{opacity:1}
  .thumb .again:hover{background:var(--acc)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .stage{display:flex;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .stage:last-child{border-bottom:0}
  .stage .dot{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;
              font-size:12px;font-weight:800;margin-top:1px}
  .stage .body{flex:1;min-width:0}
  .stage .name{font-weight:650;color:var(--ink-hi)}
  .stage.off .name{color:var(--off)}
  .facts{color:var(--muted);font-size:13.5px;margin-top:3px}
  .note{margin-top:4px;font-size:13px;color:var(--muted)}
  .note.bad{color:var(--bad)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:0;
        border-bottom:1px solid var(--line)}
  .grid div{padding:14px 18px;border-right:1px solid var(--line)}
  .grid div:last-child{border-right:0}
  .grid .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
           font-weight:700;margin-bottom:4px}
  .sec{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;
       color:var(--ink-hi);letter-spacing:-.01em}
  .ev{display:flex;gap:13px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
  .ev:last-child{border-bottom:0}
  .ev time{color:var(--muted);flex:0 0 112px;font-variant-numeric:tabular-nums}
  .ev .step{flex:0 0 112px;color:var(--muted)}
  .empty{padding:44px 18px;text-align:center;color:var(--muted)}

  .chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
  .chcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--off);
          border-radius:var(--r);padding:16px 17px;cursor:pointer;transition:border-color .15s}
  .chcard:hover{border-color:var(--line-2);border-left-color:var(--acc)}
  .chcard.active{border-left-color:var(--ok)}
  .chcard.paused{border-left-color:var(--off);opacity:.65}
  .chcard.problem{border-left-color:var(--bad)}
  .chcard h3{margin:0 0 4px;font-size:16px;font-weight:700;color:var(--ink-hi)}
  .chcard .meta{color:var(--muted);font-size:13px}

  .cal{display:flex;gap:13px;padding:11px 18px;border-bottom:1px solid var(--line);
       align-items:flex-start}
  .cal:last-child{border-bottom:0}
  .cal.past{background:rgba(255,255,255,.02)}
  .cal time{flex:0 0 136px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .cal .dot{flex:0 0 21px;height:21px;border-radius:50%;display:grid;place-items:center;
            font-size:11px;font-weight:800;margin-top:1px}
  .cal .what{flex:1;min-width:0}
  .cal.miss .what{color:var(--bad)}
  .today{height:0;border-top:2px dashed var(--acc);position:relative;margin:0 18px}
  .today span{position:absolute;top:-9px;left:0;background:var(--card);padding:0 9px;
              font-size:11px;color:var(--acc-hi);font-weight:700}

  .err{background:var(--bad-bg);color:var(--bad);padding:12px 15px;border-radius:9px;
       margin-bottom:14px;border:1px solid rgba(248,113,113,.25)}
  .res{margin-top:15px}
  .res h3{font-size:11px;margin:0 0 7px;text-transform:uppercase;letter-spacing:.07em;
          color:var(--muted);font-weight:700}
  .res ul{margin:0 0 14px;padding-left:20px}
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .fld input,.fld select{width:100%}
  .fld input[readonly]{opacity:.55}
  .sec .mklink{float:right;font-weight:500;font-size:12px;text-transform:none;
               letter-spacing:0;color:var(--acc-hi);text-decoration:none}
  .sec .mklink:hover{text-decoration:underline}
  .back{display:inline-block;margin-bottom:13px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--ink-hi)}
  button.small{padding:6px 13px;border-radius:8px;font-size:13px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .head h1{margin-bottom:5px}
  .head > button{margin-top:3px;flex:0 0 auto}   /* по верхней строке заголовка */

  /* Тосты: ошибка действия видна там, где смотрит глаз, и не перекрывает работу.
     Раньше это был alert() — он останавливает страницу и требует нажать «ОК». */
  #toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;
          gap:9px;max-width:min(420px,calc(100vw - 32px));pointer-events:none}
  #toasts .toast{pointer-events:auto;background:var(--card);border:1px solid var(--line-2);
          border-left:3px solid var(--acc);border-radius:9px;padding:11px 14px;font-size:13px;
          box-shadow:0 16px 40px -14px rgba(0,0,0,.7);cursor:pointer;
          animation:toast-in .18s ease-out}
  #toasts .toast.bad{border-left-color:var(--bad);color:var(--bad)}
  #toasts .toast.ok{border-left-color:var(--ok)}
  #toasts .toast.out{opacity:0;transform:translateX(12px);transition:opacity .2s,transform .2s}
  @keyframes toast-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

  .login{max-width:380px;margin:14vh auto;background:var(--card);
         border:1px solid var(--line);border-radius:16px;padding:34px 32px;
         box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
  .login .logo{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--ink-hi);
               margin-bottom:6px}
  .login .logo b{color:var(--acc-hi)}
  .login h1{font-size:19px;margin:0 0 22px;font-weight:650;color:var(--ink)}
  .login input{width:100%;margin-top:11px;padding:11px 13px}
  .login button{width:100%;margin-top:18px;padding:11px}

  .langs{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;max-height:140px;overflow:auto;
         border:1px solid var(--line-2);border-radius:10px;padding:10px}
  .langs label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
               border:1px solid var(--line-2);border-radius:16px;padding:4px 10px;
               cursor:pointer;transition:all .12s}
  .langs label:hover{border-color:var(--acc)}
  .langs label.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc-hi)}
  .modes{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .modes button{background:transparent;color:var(--muted);border:1px solid var(--line-2)}
  .modes button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .fldrow{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .fldrow>label:first-child{min-width:175px;color:var(--muted);font-size:12.5px;font-weight:550}

  @media (max-width:640px){ .grid{grid-template-columns:1fr 1fr} .ev time{flex-basis:76px} }
</style>
</head>
<body>

<header>
  <nav>
    <span class="brand">Studio<b>.</b></span>
    <a class="tab" href="#/releases" id="tab-releases">Выпуски</a>
    <a class="tab" href="#/channels" id="tab-channels">Каналы</a>
    <a class="tab" href="#/queue" id="tab-queue">Очередь</a>
    <a class="tab" href="#/keys" id="tab-keys">Ключи</a>
    <a class="tab" href="#/text" id="tab-text">Текст</a>
    <a class="tab" href="#/covers" id="tab-covers">Обложки</a>
    <a class="tab" href="#/projects" id="tab-projects">Проекты</a>
    <a class="tab" href="#/presets" id="tab-presets">Пресеты</a>
    <a class="tab" href="#/admin" id="tab-admin" style="margin-left:auto">Админ</a>
    <span class="who" id="who"></span>
  </nav>
</header>

<main id="app"><div class="empty">загрузка…</div></main>

<script>
const $ = (h, ...kids) => { const e = document.createElement('div'); e.innerHTML = h; return e; };
const app = document.getElementById('app');

// Состояния по-русски и одинаковые везде — ТЗ §13. «Готово частично» и «остановлено»
// не ошибки, и красить их красным было бы враньём.
const STATE_TITLE = {done:'готово', running:'в работе', queued:'в очереди',
                     partial:'готово частично', cancelled:'остановлено',
                     blocked:'нужно действие', error:'ошибка', idle:'не начато',
                     off:'не участвует'};
const STATE_CLS = {done:'s-done', running:'s-running', queued:'s-queued',
                   partial:'s-queued', cancelled:'s-idle', blocked:'s-error',
                   error:'s-error', idle:'s-idle', off:'s-off'};
const DOT = {done:'✓', running:'◐', queued:'·', partial:'◑', cancelled:'–',
             blocked:'!', error:'!', idle:'', off:'–'};

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function when(ts){
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit',
                                    hour:'2-digit', minute:'2-digit'});
}
function size(n){
  n = Number(n || 0);
  if (n < 1048576) return (n/1024).toFixed(0) + ' КБ';
  if (n < 1073741824) return (n/1048576).toFixed(0) + ' МБ';
  return (n/1073741824).toFixed(2) + ' ГБ';
}
function ago(sec){
  if (sec == null) return '';
  if (sec < 60) return sec + ' с';
  if (sec < 3600) return Math.round(sec/60) + ' мин';
  if (sec < 86400) return Math.round(sec/3600) + ' ч';
  return Math.round(sec/86400) + ' дн';
}
class NeedLogin extends Error {}

// ИСПРАВЛЕНО 04.09.2026: пульт зовёт свой API абсолютным путём «/ui/…», а живёт он
// под префиксом /studio. Из браузера такой путь уходит в КОРЕНЬ платформы, то есть
// в кабинет, и возвращается 404 — включая вход, так что зайти было нельзя вообще.
// Соседям это уже чинилось; свою же страницу я проверял curl'ом сразу по полному
// адресу и потому не увидел.
// База берётся из адреса страницы, а не из настройки: одна сборка годится и под
// префиксом, и при запуске пульта отдельно.
const API = (location.pathname.match(/^\/studio(?=\/|$)/) || [''])[0];

async function api(path, opts){
  const r = await fetch(API + path, opts);
  const body = await r.json().catch(() => ({detail:'ответ не разобран'}));
  if (r.status === 401) throw new NeedLogin(body.detail || 'нужен вход');
  if (!r.ok) throw new Error(body.detail || body.error || ('HTTP ' + r.status));
  return body;
}
async function post(path, payload){
  return api(path, {method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(payload || {})});
}
// Сообщение о неудавшемся действии. Пять секунд, потом уходит само; клик убирает
// раньше. До этого здесь был alert(): он останавливает страницу, требует нажать «ОК»
// и не даёт ни перечитать текст, ни сравнить два подряд.
const TOAST_MS = 5000;
function toast(text, kind){
  let box = document.getElementById('toasts');
  if (!box){
    box = document.createElement('div');
    box.id = 'toasts';
    document.body.append(box);
  }
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'bad');
  el.textContent = String(text || 'что-то пошло не так');
  const kill = () => {
    if (!el.isConnected) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  };
  el.onclick = kill;
  box.append(el);
  setTimeout(kill, TOAST_MS);
}

function fail(e){
  app.innerHTML = '';
  app.append($(`<div class="err">${esc(e.message)}</div>
    <p class="muted">Обновите страницу. Если не помогло — сервис недоступен.</p>`));
}

/* ─────────────────────────── список выпусков ─────────────────────────── */

let FILTERS = {channel:'', phase:'', status:''};

async function viewReleases(){
  const q = new URLSearchParams(Object.entries(FILTERS).filter(([,v]) => v)).toString();
  const [data, chs] = await Promise.all([
    api('/ui/releases' + (q ? '?' + q : '')),
    api('/ui/channels'),
  ]);

  app.innerHTML = '';
  app.append($(`<h1>Выпуски</h1>
    <p class="sub">Путь ролика от донорской ссылки до подтверждённой публикации.</p>`));

  const bar = $(`<div class="toolbar">
    <select id="f-ch"><option value="">все каналы</option>${
      chs.channels.map(c => `<option value="${c.id}" ${FILTERS.channel==String(c.id)?'selected':''}
        >${esc(c.name)}</option>`).join('')}</select>
    <select id="f-ph"><option value="">любая фаза</option>${
      data.phases.map(p => `<option value="${p.key}" ${FILTERS.phase==p.key?'selected':''}
        >${esc(p.title)}</option>`).join('')}</select>
    <select id="f-st"><option value="">любой статус</option>
      <option value="pending" ${FILTERS.status=='pending'?'selected':''}>ожидает</option>
      <option value="running" ${FILTERS.status=='running'?'selected':''}>в работе</option>
      <option value="done" ${FILTERS.status=='done'?'selected':''}>готово</option>
      <option value="blocked" ${FILTERS.status=='blocked'?'selected':''}>остановлен</option>
    </select>
    <span style="flex:1"></span>
    <button id="new">Новый выпуск по ссылке</button>
  </div>`);
  app.append(bar);
  bar.querySelector('#new').onclick = () => location.hash = '#/new';
  const bind = (id, key) => bar.querySelector(id).onchange = e => {
    FILTERS[key] = e.target.value; render();
  };
  bind('#f-ch','channel'); bind('#f-ph','phase'); bind('#f-st','status');

  if (!data.releases.length){
    app.append($(`<div class="card"><div class="empty">
      Выпусков нет. Вставьте ссылку на донора — она встанет в ближайший свободный выход канала.
    </div></div>`));
    return;
  }

  // Подпись отрезка: название этапа плюс его состояние. Обещать «осталось столько-то»
  // мы не можем — система знает не время до готовности, а срок, после которого этап
  // считается зависшим. Показывать первое вместо второго значило бы соврать.
  const SEG_STATE = {done:'готово', running:'идёт', queued:'в очереди',
                     error:'ошибка', idle:'не начато', off:'не участвует'};
  const segs = r => `<div class="segs">${(r.bar || []).map(b =>
    `<i class="${b.state}" title="${esc(b.title)} — ${SEG_STATE[b.state] || b.state}"></i>`
    ).join('')}</div>`;

  const rows = data.releases.map(r => `
    <tr class="row" data-id="${esc(r.release_id)}">
      <td>
        <div style="font-weight:600">${esc(r.donor_title || r.donor_url || r.release_id)}</div>
        <div class="muted mono">${esc(r.release_id)}</div>
      </td>
      <td>${esc(r.channel)}<div class="muted">${esc(r.lang)}</div></td>
      <td>${when(r.slot_at)}</td>
      <td>
        <span class="pill s-${r.status === 'done' ? 'done'
          : r.status === 'blocked' ? 'error'
          : r.status === 'running' ? 'running' : 'queued'}">${esc(r.phase_title)}</span>
        <div class="muted" style="margin-top:4px">шаг ${r.phase_index + 1} из ${r.phase_total}</div>
        ${segs(r)}
      </td>
      <td class="muted">${ago(r.idle_sec)}${r.attempts ? `<div>попыток ${r.attempts}</div>` : ''}
        ${r.blocked_reason ? `<div class="note bad">${esc(r.blocked_reason)}</div>` : ''}</td>
    </tr>`).join('');

  const table = $(`<div class="card"><table>
    <thead><tr><th>Выпуск</th><th>Канал</th><th>Выход</th><th>Фаза</th><th>Без движения</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`);
  table.querySelectorAll('tr.row').forEach(tr =>
    tr.onclick = () => location.hash = '#/release/' + tr.dataset.id);
  app.append(table);
}

  app.innerHTML = '';
  app.append($(`<a class="back" href="#/releases">← ко всем выпускам</a>

    <p class="sub">${esc(r.channel)} · ${esc(r.lang)} · выход ${when(r.slot_at)}
      · фаза «${esc(r.phase_title)}»</p>`));

  const head = $(`<div class="card" style="margin-bottom:16px">
    <div class="grid">
      <div><div class="k">Статус</div>${esc(r.status || '—')}</div>
      <div><div class="k">Шаг</div>${r.phase_index + 1} из ${r.phase_total}</div>
      <div><div class="k">Попыток</div>${r.attempts}</div>
      <div><div class="k">Без движения</div>${ago(r.idle_sec) || '—'}</div>
      <div><div class="k">Ролик</div>${r.video_id ? esc(r.video_id) : '—'}</div>
    </div>
    ${r.blocked_reason ? `<div class="sec" style="color:var(--bad)">
        Остановлен: ${esc(r.blocked_reason)}
        ${r.status === 'blocked'
          ? '<button class="ghost" id="revive" style="margin-left:10px">Вернуть в работу</button>'
          : ''}</div>` : ''}
    ${d.stages.map(s => `
      <div class="stage ${s.state === 'off' ? 'off' : ''}">
        <div class="dot ${STATE_CLS[s.state]}">${DOT[s.state] || ''}</div>
        <div class="body">
          <div class="name">${esc(s.title)}
            <span class="pill ${STATE_CLS[s.state]}" style="margin-left:6px">${STATE_TITLE[s.state]}</span>
          </div>
          ${s.facts.length ? `<div class="facts">${s.facts.map(esc).join(' · ')}</div>` : ''}
          ${s.note ? `<div class="note ${s.state === 'error' ? 'bad' : 'muted'}"
            >${esc(s.note)}</div>` : ''}
          ${stageFiles(s, r.project_id)}
        </div>
        <div style="white-space:nowrap;align-self:center">${
          s.job ? actions({service: s.job.service, id: s.job.id,
                           state: s.state, status: s.job.status}) : ''}</div>
      </div>`).join('')}
  </div>`);
  app.append(head);
  // Повтор одного этапа не трогает соседние: кнопка обращается ровно к той задаче,
  // на которой этап держится, и в тот сервис, которому она принадлежит.
  wireActions(head);
  wireRegen(head);

  // Возврат из разбора. Фазу не откатываем: сделанное и оплаченное остаётся сделанным,
  // движок продолжит с того шага, где остановился.
  const rev = head.querySelector('#revive');
  if (rev) rev.onclick = async () => {
    if (!confirm('Вернуть выпуск в работу? Движок продолжит с фазы «'
                 + r.phase_title + '».')) return;
    rev.disabled = true;
    try{
      await post(`/ui/releases/${encodeURIComponent(r.release_id)}/revive`);
      await render();
    }catch(e){ rev.disabled = false; toast(e.message); }
  };

  app.append($(`<div class="card">
    <div class="sec">Что происходило</div>
    ${d.events.length ? d.events.map(e => `<div class="ev">
        <time>${when(e.created)}</time>
        <div class="step">фаза</div>
        <div>${esc(e.phase_title)}${e.video_id ? ' · ролик ' + esc(e.video_id) : ''}</div>
      </div>`).join('') : ''}
    ${d.log.map(l => `<div class="ev">
        <time>${when(l.ts)}</time>
        <div class="step">${esc(l.step)}</div>
        <div${l.level === 'warn' || l.level === 'error' ? ' class="note bad"' : ''}
          >${esc(l.message)}</div>
      </div>`).join('')}
    ${!d.events.length && !d.log.length ? '<div class="empty">Записей пока нет.</div>' : ''}
  </div>`));
}

function dur(sec){
  if (sec == null) return '—';
  if (sec < 60) return sec + ' с';
  if (sec < 3600) return Math.round(sec/60) + ' мин';
  if (sec < 86400) return Math.round(sec/3600) + ' ч';
  return Math.round(sec/86400) + ' дн';
}

async function viewChannel(id){
  const d = await api('/ui/channels/' + encodeURIComponent(id) + '?history=14');
  const c = d.channel;
  const times = Object.entries(c.schedule)
    .map(([day, tt]) => `${day}: ${(tt || []).join(', ')}`).join(' · ') || 'не задано';

  app.innerHTML = '';
  app.append($(`<a class="back" href="#/channels">← ко всем каналам</a>
    <h1>${esc(c.name)}</h1>
    <p class="sub">${esc(c.handle || '')} · ${esc(c.lang)} · ${esc(c.niche || '')}</p>`));

  const head = $(`<div class="card" style="margin-bottom:16px"><div class="grid">
    <div><div class="k">Расписание</div>${esc(times)}</div>
    <div><div class="k">Часовой пояс</div>${esc(c.tz)}</div>
    <div><div class="k">Горизонт</div>${c.horizon_days} дн</div>
    <div><div class="k">Готовим заранее</div>${c.lead_days} дн</div>
    <div><div class="k">Машина</div>${esc(c.host || '—')}</div>
    <div><div class="k">Профиль</div>${esc(c.profile || '—')}</div>
  </div>
  <div class="sec" style="border-bottom:0;padding-bottom:0">
    <button class="ghost" id="edit">Настроить</button>
    <span id="statusbtns"></span></div>
  <div id="editbox"></div></div>`);
  app.append(head);
  wireChannelEdit(head, c);

  const counts = Object.entries(d.counts)
    .map(([k, n]) => `<span class="pill ${CAL_CLS[k]}">${CAL_TITLE[k]}: ${n}</span>`).join(' ');
  app.append($(`<div class="toolbar">${counts}
    ${d.waiting_without_slot ? `<span class="pill s-queued">без даты ждут:
      ${d.waiting_without_slot}</span>` : ''}</div>`));

  if (!d.calendar.length){
    app.append($(`<div class="card"><div class="empty">
      Расписание не задано — выходов нет, и ссылке некуда встать.</div></div>`));
    return;
  }

  // Черта «сейчас» между прошлым и будущим: без неё пропуск и свободный слот
  // выглядят одинаково, а это разные вещи.
  const rows = [];
  let drawn = false;
  for (const r of d.calendar){
    if (!r.past && !drawn){ rows.push('<div class="today"><span>сейчас</span></div>'); drawn = true; }
    const when_ = new Date(r.at * 1000).toLocaleString('ru-RU',
      {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    const link = r.project_id ? `#/release/${esc(r.release_id)}` : (r.donor_url || '');
    const title = r.donor_title || r.donor_url || (r.state === 'missed'
      ? 'ролика не было' : 'свободен — сюда встанет следующая ссылка');
    rows.push(`<div class="cal ${r.past ? 'past' : ''} ${r.state === 'missed' ? 'miss' : ''}">
      <time>${when_}</time>
      <div class="dot ${CAL_CLS[r.state]}">${CAL_DOT[r.state]}</div>
      <div class="what">
        ${link ? `<a href="${esc(link)}" ${r.project_id ? '' : 'target=_blank rel=noopener'}
            style="font-weight:600">${esc(title)}</a>`
               : `<span style="font-weight:${r.state === 'free' ? '400' : '600'}">${esc(title)}</span>`}
        <div class="muted" style="font-size:12.5px">
          ${esc(CAL_TITLE[r.state])}${r.phase_title ? ' · ' + esc(r.phase_title) : ''}
          ${r.beyond_horizon ? ' · за горизонтом канала' : ''}
        </div>
        ${r.blocked_reason ? `<div class="note bad">${esc(r.blocked_reason)}</div>` : ''}
      </div></div>`);
  }
  if (!drawn) rows.push('<div class="today"><span>сейчас</span></div>');
  app.append($(`<div class="card">${rows.join('')}</div>`));
}

    <span class="pill ${s.ok ? 's-done' : 's-error'}" title="${esc(s.error)}">
      ${esc(s.title)}: ${s.ok ? s.count : 'нет связи'}</span>`).join('')}</div>`));

  const bar = $(`<div class="toolbar">
    <select id="q-svc"><option value="">все сервисы</option>${d.services.map(s =>
      `<option value="${esc(s.key)}" ${QFILTER.service === s.key ? 'selected' : ''}
        >${esc(s.title)}</option>`).join('')}</select>
    <select id="q-ch"><option value="">все каналы</option>${d.channels.map(c =>
      `<option value="${c.id}" ${QFILTER.channel == c.id ? 'selected' : ''}
        >${esc(c.name)}</option>`).join('')}</select>
    <select id="q-st"><option value="">любое состояние</option>${d.states.map(x =>
      `<option value="${esc(x.key)}" ${QFILTER.state === x.key ? 'selected' : ''}
        >${esc(x.title)}</option>`).join('')}</select>
    <select id="q-since"><option value="">за всё время</option>${d.periods.map(x =>
      `<option value="${esc(x.key)}" ${QFILTER.since === x.key ? 'selected' : ''}
        >${esc(x.title)}</option>`).join('')}</select>
    <span style="flex:1"></span>
    <span class="muted">${d.shown === d.total ? `задач ${d.total}`
      : `показано ${d.shown} из ${d.total}`}</span>
  </div>`);
  app.append(bar);
  const bindQ = (id, key) => bar.querySelector(id).onchange = e => {
    QFILTER[key] = e.target.value; render();
  };
  bindQ('#q-svc','service'); bindQ('#q-ch','channel');
  bindQ('#q-st','state'); bindQ('#q-since','since');

  const down = d.services.filter(s => !s.ok);
  if (down.length) app.append($(`<div class="err">${down.map(s =>
    `${esc(s.title)} — ${esc(s.error)}`).join('<br>')}<br>
    <span style="opacity:.75">Это не «задач нет», а «спросить не удалось».</span></div>`));

  if (!d.rows.length){
    app.append($(`<div class="card"><div class="empty">Задач нет.</div></div>`));
    return;
  }

  const card = $(`<div class="card"><table>
    <thead><tr><th>Сервис</th><th>Задача</th><th>Этап</th><th>Состояние</th><th>Создана</th>
      <th></th></tr></thead>
    <tbody>${d.rows.map(r => `
      <tr>
        <td><span class="pill s-idle">${esc(SVC_TITLE[r.service] || r.service)}</span></td>
        <td><div style="font-weight:600">${esc(r.title)}</div>
            <div class="muted" style="font-size:12px">${
              [r.channel && esc(r.channel), r.lang && esc(r.lang),
               r.user && esc(r.user)].filter(Boolean).join(' · ')
              || `<span class="mono">${esc(r.id)}</span>`}</div></td>
        <td>${esc(r.kind_title || r.kind || '—')}
            ${r.provider ? `<div class="muted">${esc(r.provider)}</div>` : ''}</td>
        <td><span class="pill ${STATE_CLS[r.state]}">${STATE_TITLE[r.state]}</span>
            ${r.stage ? `<div class="muted" style="margin-top:4px">${esc(r.stage)}</div>` : ''}
            ${r.progress != null ? `<div class="bar"><i style="width:${
              Math.round(r.progress * 100)}%"></i></div>` : ''}
            ${r.error ? `<div class="note bad">${esc(r.error)}</div>` : ''}</td>
        <td class="muted">${when(r.created)}</td>
        <td style="white-space:nowrap">${actions(r)}</td>
      </tr>`).join('')}</tbody></table></div>`);
  app.append(card);
  wireActions(card);
}

/* Кнопка показывается только там, где действие имеет смысл: отменить можно то, что
   ещё идёт, повторить — то, что уже упало. Кнопка, которая всегда есть и через раз
   отвечает «нельзя», обучает не нажимать её вовсе. */
function actions(r){
  const btn = (act, title) =>
    `<button class="ghost act" data-service="${esc(r.service)}" data-id="${esc(r.id)}"
             data-act="${act}">${title}</button>`;
  if (r.state === 'running' || r.state === 'queued') return btn('cancel', 'Отменить');
  if (r.state === 'error' || r.status === 'cancelled') return btn('retry', 'Повторить');
  return '';
}

function wireActions(root){
  root.querySelectorAll('button.act').forEach(b => {
    b.onclick = async () => {
      const {service, id, act} = b.dataset;
      b.disabled = true;
      const was = b.textContent;
      b.textContent = '…';
      try{
        await post(`/ui/actions/${encodeURIComponent(service)}/${encodeURIComponent(id)}/${act}`);
        await render();
      }catch(e){
        b.disabled = false;
        b.textContent = was;
        // Отказ сервиса — это ответ, а не сбой экрана: показываем его словами рядом
        // с той строкой, к которой он относится.
        const box = document.createElement('div');
        box.className = 'note bad';
        box.textContent = e.message;
        b.parentElement.appendChild(box);
      }
    };
  });
}

/* Материалы прямо в строке этапа — ТЗ §14 просит на каждом этапе не статус, а сам
   результат: миниатюры кадров, плеер озвучки, готовые файлы сборки. Ссылки ведут
   в кабинет: он проверяет, что путь не выводит за пределы проекта, и умеет отдавать
   уменьшенные копии по ?w=. */
/* Миниатюра с кнопкой «переделать». Один кадр вместо всего этапа: повтор этапа
   целиком переделывает и то, что получилось, а это уже оплаченная работа. */
function thumb(src, full, name, height, pid){
  return `<span class="thumb"><a href="${full}" target="_blank" title="${esc(name)}"
    ><img src="${src}" loading="lazy" style="height:${height}px"></a>${pid
    ? `<button class="again" data-regen="image" data-pid="${esc(pid)}"
         data-name="${esc(name)}">переделать</button>` : ''}</span>`;
}

function wireRegen(root){
  root.querySelectorAll('button[data-regen]').forEach(b => b.onclick = async ev => {
    ev.preventDefault(); ev.stopPropagation();
    const what = b.dataset.regen;
    const prompt_ = prompt(what === 'image'
      ? `Переделать кадр «${b.dataset.name}».\nСвой промпт — по желанию, пусто = как было:`
      : `Переделать клип «${b.dataset.name}».\nСвой промпт движения — по желанию:`, '');
    if (prompt_ === null) return;          // отменили
    b.disabled = true; b.textContent = '…';
    try{
      await post(`/ui/regen/${what}`, {project_id: b.dataset.pid,
                                       name: b.dataset.name, prompt: prompt_});
      await render();
    }catch(e){
      b.disabled = false; b.textContent = 'переделать';
      toast(e.message);
    }
  });
}

function stageFiles(s, pid){
  if (!s.files || !s.files.length) return '';
  const url = n => s.file_base + n.split('/').map(encodeURIComponent).join('/');
  return s.files.map(g => {
    if (g.kind === 'image') return `<div style="display:flex;flex-wrap:wrap;gap:5px;
      margin-top:7px">${g.names.map(n => thumb(url(n) + '?w=120', url(n), n, 52,
        pid)).join('')}
      ${g.count > g.names.length
        ? `<span class="muted" style="align-self:center;font-size:12px">и ещё ${
            g.count - g.names.length}</span>` : ''}</div>`;
    if (g.kind === 'audio') return g.names.map(n => `<audio controls preload="none"
      src="${url(n)}" style="width:100%;max-width:340px;margin-top:7px"></audio>`).join('');
    if (g.kind === 'video') return g.names.slice(0, 2).map(n => `<div class="thumb"
      style="margin:7px 6px 0 0"><video controls preload="none" src="${url(n)}"
      style="max-width:260px;border-radius:6px"></video>${pid
        ? `<button class="again" data-regen="clip" data-pid="${esc(pid)}"
             data-name="${esc(n)}">переделать</button>` : ''}</div>`).join('');
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px">${
      g.names.map(n => `<a href="${url(n)}" target="_blank" style="padding:3px 9px;
      border:1px solid var(--line);border-radius:6px;text-decoration:none;font-size:12px"
      >${esc(n.split('/').pop())}</a>`).join('')}</div>`;
  }).join('');
}

/* Проект — то, что делает выпуск: папка с кадрами, озвучкой, рендером и субтитрами.
   Заводить их руками пульт не даёт и не будет: их создаёт выпуск. А смотреть, что
   получилось, и забирать нужно каждый день — ради этого не должно приходиться уходить
   в кабинет. Ссылки на файлы ведут в кабинет: он отдаёт их с проверкой пути и с
   миниатюрами, и второй такой отдачи заводить незачем. */

async function viewProject(id){
  const d = await api('/ui/projects/' + encodeURIComponent(id));
  const p = d.project;
  app.innerHTML = '';
  app.append($(`<h1>${esc(p.name)}</h1>
    <p class="sub"><span class="mono">${esc(p.id)}</span>
      ${p.release_id ? ` · выпуск <a href="#/release/${
        encodeURIComponent(p.release_id)}">${esc(p.release_id)}</a> · фаза ${
        esc(p.phase)}` : ''}</p>`));

  const run = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Сделать всё</div>
    <div id="rerr"></div>
    <div class="row" style="gap:12px;flex-wrap:wrap">
      <div><label>Предложений на кадр</label>
        <input id="r-spp" value="" placeholder="как в проекте" style="width:110px"></div>
      <div><label>Модель кадров</label>
        <input id="r-model" value="" placeholder="как в проекте" style="width:150px"></div>
      <div><label>Озвучка</label>
        <input id="r-engine" value="" placeholder="как в проекте" style="width:120px"></div>
      <div><label>Качество</label>
        <input id="r-quality" value="" placeholder="как в проекте" style="width:110px"></div>
    </div>
    <div class="note muted">Пустое поле = как в настройках проекта. Озвучка и кадры
      пойдут параллельно, сборка дождётся материалов сама.</div>
    <div class="note muted">Сборку делает отдельная машина. Если рендер-нода не
      запущена, проект дойдёт до сборки и остановится.</div>
    <div style="margin-top:12px"><button id="rgo">Запустить</button></div></div>`);
  app.append(run);
  const rerr = run.querySelector('#rerr');
  run.querySelector('#rgo').onclick = async () => {
    const btn = run.querySelector('#rgo');
    rerr.innerHTML = ''; btn.disabled = true;
    try{
      const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/run`, {
        sentences_per_prompt: run.querySelector('#r-spp').value,
        model: run.querySelector('#r-model').value,

      // Кабинет отвечает счётчиками, а не «ок»: поставленное, отложенное и пропущенное —

      rerr.innerHTML = `<div class="note ${out.enqueued ? 'muted' : 'bad'}">поставлено: ${

    app.append($(`<div class="card" style="margin-bottom:16px">

        <div class="body"><div class="name">${esc(x.kind)}: ${x.delivered} оплаченных
          вызовов${x.cost ? ` · ${x.cost.toFixed(0)} кр.` : ''}</div></div></div>`).join('')}
      <div class="note muted">Это то, что будет выброшено, если проект убрать с диска.</div>
    </div>`));
  }

  if (d.jobs.length){
    const jc = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">Задачи проекта</div>
      <table><thead><tr><th>Этап</th><th>Состояние</th><th>Создана</th><th></th></tr>
      </thead><tbody>${d.jobs.map(j => `<tr>
        <td>${esc(j.kind)}<div class="muted mono" style="font-size:11px">#${j.id}</div></td>
        <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
          ${j.stage ? `<div class="muted">${esc(j.stage)}</div>` : ''}
          ${j.progress != null ? `<div class="bar"><i style="width:${
            Math.round(j.progress * 100)}%"></i></div>` : ''}
          ${j.error ? `<div class="note bad">${esc(j.error)}</div>` : ''}
          ${(j.applied || []).length ? `<details style="margin-top:6px">
            <summary class="muted" style="cursor:pointer;font-size:12px"
              >с какими настройками пошла</summary>
            <div class="note muted">${j.applied.map(a =>
              `${esc(a.name)}: <b>${esc(a.value)}</b>`).join(' · ')}</div>
            <div class="note muted">Это снимок момента запуска — правка пресета
              его не меняет.</div></details>` : ''}</td>
        <td class="muted">${when(j.created)}</td>
        <td style="white-space:nowrap">${actions({service:'vsgen', id:j.id,
                                                  state:j.state, status:j.status})}</td>
      </tr>`).join('')}</tbody></table></div>`);
    app.append(jc);
    wireActions(jc);
  }

  for (const g of d.files){
    const url = n => d.file_base + n.split('/').map(encodeURIComponent).join('/');
    const card = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">${esc(g.title)} · ${g.count}
        <a class="ghost" href="${d.zip_base}${esc(g.code)}"
           style="float:right;padding:3px 10px;border:1px solid var(--line);
                  border-radius:6px;text-decoration:none;font-size:12px"
           >Скачать архивом</a></div>
      ${g.kind === 'image'
        ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${g.names.map(n =>
            thumb(url(n) + '?w=160', url(n), n, 78, p.id)).join('')}</div>`
        : g.kind === 'audio'
        ? g.names.map(n => `<audio controls preload="none" src="${url(n)}"
            style="width:100%;margin-top:6px"></audio>`).join('')
        : g.kind === 'video'
        ? g.names.slice(0, 4).map(n => `<div class="thumb" style="margin:6px 6px 0 0"
            ><video controls preload="none" src="${url(n)}"
            style="max-width:320px;border-radius:6px"></video>
            <button class="again" data-regen="clip" data-pid="${esc(p.id)}"
              data-name="${esc(n)}">переделать</button></div>`).join('')
          + (g.names.length > 4 ? `<div class="note muted">и ещё ${
              g.names.length - 4} — в архиве</div>` : '')
        : `<div style="display:flex;flex-wrap:wrap;gap:8px">${g.names.map(n =>
            `<a href="${url(n)}" target="_blank"
              style="padding:4px 10px;border:1px solid var(--line);border-radius:6px;
                     text-decoration:none;font-size:12px">${esc(n)}</a>`).join('')}</div>`}
      ${g.more ? `<div class="note muted">показаны первые ${g.names.length},
        всего ${g.count} — остальные в архиве</div>` : ''}
    </div>`);
    app.append(card);
    wireRegen(card);
  }
  if (!d.files.length){
    app.append($(`<div class="card"><div class="empty">Файлов пока нет.</div></div>`));
  }
}

/* ───────────────────────── свои ключи ───────────────────────── */

/* Значения ключей сюда не приходят и не уходят: снять можно по номеру в списке,
   добавить — вписав новый. На экране только маска. Разбор и запись делает кабинет
   своим же обработчиком: там ключи правятся по одному, каждый несёт свой лимит,
   и ёмкость дорожки пересчитывается сразу. */
async function wireKeys(root, d){
  const box = root.querySelector('#keyedit');

  root.querySelectorAll('a.dropkey').forEach(a => a.onclick = async ev => {
    ev.preventDefault();
    if (!confirm('Снять этот ключ? Он перестанет использоваться сразу.')) return;
    try{
      await post('/ui/keys', {drop: {[a.dataset.f]: [Number(a.dataset.i)]}});
      await render();
    }catch(e){ toast(e.message); }
  });

  root.querySelector('#addkey').onclick = async () => {
    if (box.innerHTML){ box.innerHTML = ''; return; }
    const ref = await api('/ui/keys/families');
    box.innerHTML = `
      <div id="kerr"></div>
      <div class="fldrow"><label>Провайдер</label>
        <select id="kfam">${ref.families.map(f =>
          `<option value="${esc(f.key)}">${esc(f.title)}</option>`).join('')}</select></div>
      <div class="fldrow"><label>Ключ</label>
        <input id="kval" style="width:340px" autocomplete="off"></div>
      <div class="note muted">${esc(ref.note)}</div>
      <div style="margin-top:10px"><button id="ksave">Сохранить</button></div>`;
    box.querySelector('#ksave').onclick = async () => {
      const err = box.querySelector('#kerr');
      err.innerHTML = '';
      const val = box.querySelector('#kval').value.trim();
      if (!val){ err.innerHTML = '<div class="err">Ключ пустой.</div>'; return; }
      try{
        await post('/ui/keys', {add: {[box.querySelector('#kfam').value]: [val]}});
        await render();
      }catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  };
}

      <div class="fldrow"><label>Хэндл / язык / ниша</label>
        <input id="f-handle" value="${esc(c.handle || '')}" style="width:150px">
        <input id="f-lang" value="${esc(c.lang_raw ?? c.lang ?? '')}" style="width:60px">
        <input id="f-niche" value="${esc(c.niche || '')}" style="width:180px"></div>
      <div class="fldrow"><label>Дни</label>
        <span class="langs" style="max-height:none;border:0;padding:0">${
          ref.days.filter(x => x !== ref.any_day).map(dk =>
            `<label data-day="${dk}" class="${picked.has(dk) ? 'on' : ''}"><input

      <div class="fldrow"><label>Время выходов</label>
        <input id="f-times" value="${esc(times)}" placeholder="10:00, 18:00"
          style="width:220px"></div>
      <div class="fldrow"><label>Часовой пояс</label>
        <input id="f-tz" value="${esc(c.tz)}" style="width:200px"></div>
      <div class="fldrow"><label>Горизонт / заранее</label>
        <input id="f-hor" type="number" min="1" max="90" value="${c.horizon_days}"
          style="width:80px"> дн
        <input id="f-lead" type="number" min="0" max="30" value="${c.lead_days}"
          style="width:80px"> дн</div>
      <div class="fldrow"><label>Отложенные</label>
        <label style="font-weight:400"><input type="checkbox" id="f-def"
          ${c.deferred ? 'checked' : ''}> копить</label>
        <input id="f-deflim" type="number" min="1" max="200"
          value="${c.deferred_limit ?? 5}" style="width:80px"> шт</div>
      ${sel('f-prof', ref.profiles.map(p => ({value: p.id, title: p.title})),
            c.profile_id, 'Профиль AdsPower')}
      ${sel('f-host', ref.hosts.map(h => ({value: h.id, title: h.title})),
            c.host_id, 'Машина заливки')}
      ${sel('f-pv', ref.presets.vsgen.map(p => ({value: p.id, title: p.name})),

      ${sel('f-pr', ref.presets.rewrite.map(n => ({value: n, title: n})),

      ${sel('f-pc', ref.presets.cover.map(n => ({value: n, title: n})),

/* ────────────────────────── результаты задачи ────────────────────────── */

/* Один блок на оба сервиса: у Rewrite и Cover результаты устроены одинаково —
   список имён и файл по имени. Смысл в том, чтобы не уходить с экрана: увидеть,
   что получилось, и забрать — там же, где задача. */
const RESULT_OPEN = new Set();

async function paintResults(service, jobId, host){
  try{
    const d = await api(`/ui/files/${encodeURIComponent(service)}/${encodeURIComponent(jobId)}`);
    if (!d.files.length){ host.innerHTML = '<span class="muted">Файлов пока нет.</span>'; return; }
    // Ссылки и <img src> идут мимо api() — префикс им нужен свой.
    const url = f => `${API}/ui/files/${encodeURIComponent(service)}/${
      encodeURIComponent(jobId)}/${encodeURIComponent(f.name)}`;
    const imgs = d.files.filter(f => f.kind === 'image');
    const rest = d.files.filter(f => f.kind !== 'image');
    host.innerHTML = `
      ${imgs.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        ${imgs.map(f => `<a href="${url(f)}" target="_blank" title="${esc(f.name)}"
          ><img src="${url(f)}" style="height:96px;border-radius:6px;
          border:1px solid var(--line);display:block"></a>`).join('')}</div>` : ''}
      ${rest.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">
        ${rest.map(f => `<a href="${url(f)}" target="_blank"
          style="display:inline-block;padding:4px 10px;border:1px solid var(--line);
                 border-radius:6px;text-decoration:none;font-size:12px"
          >${esc(f.name)}</a>`).join('')}</div>` : ''}`;
  }catch(e){
    host.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
  }
}

function wireResults(root, service){
  root.querySelectorAll('tr[data-job]').forEach(tr => {
    tr.style.cursor = 'pointer';
    tr.onclick = ev => {
      if (ev.target.closest('button, a')) return;   // кнопки строки — не раскрытие
      const id = tr.dataset.job;
      const key = service + ':' + id;
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('res-row')){
        next.remove(); RESULT_OPEN.delete(key); return;
      }
      RESULT_OPEN.add(key);
      tr.insertAdjacentHTML('afterend',
        '<tr class="res-row"><td colspan="9" style="padding-top:0">' +
        '<div class="muted">загрузка…</div></td></tr>');
      paintResults(service, id, tr.nextElementSibling.querySelector('div'));
    };
    if (RESULT_OPEN.has(service + ':' + tr.dataset.job)) tr.click();
  });
}

/* ─────────────────────────────── текст ─────────────────────────────── */

/* Рерайт и генерация с нуля — один экран (ТЗ §05). Разница между ними только
   в источнике: ссылка, свой текст или тема. Три разных экрана для трёх источников
   одной и той же работы — это и была «разбивка на тысячу интерфейсов». */
let TEXT_FORM = {mode:'link', langs:new Set(), model:'', preset:''};

async function viewText(){
  const d = await api('/ui/text');
  app.innerHTML = '';
  app.append($(`<h1>Текст</h1>
    <p class="sub">Рерайт по ссылке, рерайт своего текста и генерация с нуля.</p>`));

  if (!TEXT_FORM.model && d.models.length) TEXT_FORM.model = d.models[0].value;
  const mode = () => d.modes.find(m => m.key === TEXT_FORM.mode) || d.modes[0];

  const form = $(`<div class="card" style="padding:16px;margin-bottom:16px">
    <div id="err"></div>
    <div class="modes">${d.modes.map(m => `
      <button data-mode="${m.key}" class="${m.key === TEXT_FORM.mode ? 'on' : ''}"
        >${esc(m.title)}</button>`).join('')}</div>
    <div class="note muted" style="margin-bottom:10px">${esc(mode().note)}</div>

    <label class="k" style="display:block;margin-bottom:6px" id="src-label"></label>
    <input id="src-one" placeholder="https://www.youtube.com/watch?v=…"
           style="width:100%;box-sizing:border-box;padding:9px 11px;
                  border:1px solid var(--border);border-radius:7px;font:inherit">
    <textarea id="src-many" placeholder="Вставьте текст"></textarea>

    <div id="preset-box" style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Бриф</label>
      <select id="preset" style="min-width:280px">
        <option value="">— выберите бриф —</option>
        ${d.presets.generation.map(p => `<option>${esc(p)}</option>`).join('')}
      </select>
      ${d.presets.generation.length ? '' :
        '<div class="note muted">Брифов нет. Создать их можно в разделе Rewrite.</div>'}
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Модель</label>
      <select id="model" style="min-width:280px">${d.models.map(m =>
        `<option value="${esc(m.value)}" ${m.value === TEXT_FORM.model ? 'selected' : ''}
          >${esc(m.label)}</option>`).join('')}</select>
      <div class="note muted">${d.models.length
        ? 'Показаны только модели, под которые у вас есть ключ или подписка.'
        : 'Ни одной доступной модели: нет ни своего ключа, ни серверного.'}</div>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="langs">${d.languages.map(l => `
        <label data-code="${esc(l.code)}"><input type="checkbox"
          ${TEXT_FORM.langs.has(l.code) ? 'checked' : ''}>${esc(l.title)}</label>`).join('')}
      </div>
    </div>

    <div style="margin-top:14px"><button id="go">Запустить</button></div>
    <div id="res"></div>
  </div>`);
  app.append(form);

  const one = form.querySelector('#src-one');
  const many = form.querySelector('#src-many');
  const presetBox = form.querySelector('#preset-box');
  const label = form.querySelector('#src-label');

  function paint(){
    const m = TEXT_FORM.mode;
    label.textContent = m === 'link' ? 'Ссылка на ролик-донор'
                      : m === 'text' ? 'Текст' : 'Тема';
    one.hidden = (m === 'text');
    many.hidden = (m !== 'text');
    presetBox.hidden = (m !== 'topic');
    one.placeholder = m === 'link' ? 'https://www.youtube.com/watch?v=…'
                                   : 'О чём должен быть ролик';
  }
  paint();

  form.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    TEXT_FORM.mode = b.dataset.mode;
    render();
  });
  form.querySelectorAll('#langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? TEXT_FORM.langs.add(l.dataset.code)
                  : TEXT_FORM.langs.delete(l.dataset.code); };
    sync();
    box.onchange = sync;
  });
  form.querySelector('#model').onchange = e => TEXT_FORM.model = e.target.value;
  form.querySelector('#preset').onchange = e => TEXT_FORM.preset = e.target.value;

  const errBox = form.querySelector('#err');
  const resBox = form.querySelector('#res');
  const btn = form.querySelector('#go');
  btn.onclick = async () => {
    errBox.innerHTML = ''; resBox.innerHTML = ''; btn.disabled = true;
    btn.textContent = 'Отправляю…';
    try{
      const out = await post('/ui/text', {
        mode: TEXT_FORM.mode,
        source: (TEXT_FORM.mode === 'text' ? many.value : one.value),
        languages: [...TEXT_FORM.langs],
        model: TEXT_FORM.model,
        preset: TEXT_FORM.preset,
      });
      resBox.innerHTML = `<div class="res">Задача создана${
        out.chars ? ` · текста ${out.chars} знаков` : ''}.</div>`;
      one.value = ''; many.value = '';
      setTimeout(render, 600);
    }catch(e){
      errBox.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }finally{ btn.disabled = false; btn.textContent = 'Запустить'; }
  };

  const list = $(`<div class="card">
    <div class="sec">Задачи текста</div>
    ${d.jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Вид</th><th>Языки</th><th>Состояние</th><th>Создана</th><th></th>
      </tr></thead><tbody>${d.jobs.map(j => `<tr data-job="${esc(j.id)}">
        <td><div style="font-weight:600">${esc(j.title)}</div>
            <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
        <td>${j.kind === 'generation' ? 'с нуля' : 'рерайт'}</td>
        <td>${(Array.isArray(j.langs) ? j.langs : [j.langs]).map(esc).join(', ') || '—'}</td>
        <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
            ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
            ${j.progress != null ? `<div class="bar"><i style="width:${
              Math.round(j.progress * 100)}%"></i></div>` : ''}</td>
        <td class="muted">${when(j.created)}</td>
        <td style="white-space:nowrap">${actions({service:'rewrite', id:j.id,
                                                  state:j.state, status:j.status})}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Задач текста пока нет.</div>'}
    ${d.jobs.length ? '<div class="note muted">Нажмите на строку — покажется результат.</div>' : ''}
  </div>`);
  app.append(list);
  wireActions(list);
  wireResults(list, 'rewrite');
}

/* ─────────────────────────────── обложки ─────────────────────────────── */

/* Стратегия выбирается ДО показа полей (ТЗ §10). Раньше это была одна простыня, где
   половина полей молча не работала: они относились к другой стратегии. */
let COVER_FORM = {mode:'url', langs:new Set(), preset:'', option:0,
                  edit:false, n:3};

async function viewCovers(){
  const d = await api('/ui/covers');
  app.innerHTML = '';
  app.append($(`<h1>Обложки</h1>
    <p class="sub">Сначала выберите, как делаем обложку.</p>`));

  const mode = () => d.modes.find(m => m.key === COVER_FORM.mode) || d.modes[0];
  const opt = d.options[COVER_FORM.option] || d.options[0] || {};
  const langs = [...COVER_FORM.langs];

  const form = $(`<div class="card" style="padding:16px;margin-bottom:16px">
    <div id="err"></div>
    <div class="modes">${d.modes.map((m, i) => `
      <button data-mode="${m.key}" class="${m.key === COVER_FORM.mode ? 'on' : ''}"
        >${esc(m.title)}</button>`).join('')}</div>
    <div class="note muted" style="margin-bottom:10px">${esc(mode().note)}</div>

    <div id="fields"></div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Пресет</label>
      <select id="preset" style="min-width:280px">
        <option value="">— без пресета —</option>
        ${d.presets.map(p => `<option ${p === COVER_FORM.preset ? 'selected' : ''}
          >${esc(p)}</option>`).join('')}</select>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Чем генерировать</label>
      <select id="option" style="min-width:280px">${d.options.map((o, i) =>
        `<option value="${i}" ${i === COVER_FORM.option ? 'selected' : ''}>${esc(o.label)}${
          o.admin_only ? ' — платит владелец' : ''}</option>`).join('')}</select>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="langs">${d.languages.map(l => `
        <label data-code="${esc(l)}"><input type="checkbox"
          ${COVER_FORM.langs.has(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}
      </div>
    </div>

    <div id="edit-box" style="margin-top:12px"></div>

    <div class="note muted" style="margin-top:12px">Соотношение сторон —
      <b>${esc(d.aspect)}</b>, всегда. У обложки YouTube оно одно, поэтому его здесь
      не спрашивают и не дают выбрать; в задачу оно уходит явно, а не «по умолчанию».</div>

    <div style="margin-top:14px"><button id="go">Запустить</button></div>
    <div id="res"></div>
  </div>`);
  app.append(form);

  const fields = form.querySelector('#fields');
  const editBox = form.querySelector('#edit-box');

  function paintFields(){
    const m = COVER_FORM.mode;
    if (m === 'url'){
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px"
        >Ссылки на доноров, по одной в строке</label>
        <textarea id="urls" placeholder="https://www.youtube.com/watch?v=…"></textarea>`;
    } else if (m === 'title'){
      fields.innerHTML = langs.length
        ? `<label class="k" style="display:block;margin-bottom:6px">Заголовок на каждый язык</label>
           ${langs.map(l => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
             <span class="muted" style="min-width:120px">${esc(l)}</span>
             <input data-lang="${esc(l)}" class="title-in" placeholder="Текст на обложке"
               style="flex:1;padding:8px 10px;border:1px solid var(--border);
                      border-radius:7px;font:inherit"></div>`).join('')}
           <label class="k" style="display:block;margin:10px 0 6px">Дополнение к промпту</label>
           <input id="extra" style="width:100%;box-sizing:border-box;padding:9px 11px;
             border:1px solid var(--border);border-radius:7px;font:inherit">`
        : '<div class="note">Сначала выберите языки — заголовок задаётся на каждый отдельно.</div>';
    } else {
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px">Семя</label>
        <textarea id="seed" placeholder="Описание сцены, из которого рождаются варианты"></textarea>
        <label class="k" style="display:block;margin:10px 0 6px">Вариантов на язык</label>
        <input id="n" type="number" min="1" max="8" value="${COVER_FORM.n}"
          style="width:90px;padding:8px 10px;border:1px solid var(--border);
                 border-radius:7px;font:inherit">`;
    }

    // Редактирование превью — ОТДЕЛЬНЫЙ выбор, а не следствие приложенного референса.
    // Пока это следствие, человек прикладывает картинку «для стиля» и незаметно
    // выключает половину пресета.
    const killed = d.rules.find(r => r.when === 'edit');
    editBox.innerHTML = COVER_FORM.mode === 'url'
      ? `<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
           <input type="checkbox" id="edit" ${COVER_FORM.edit ? 'checked' : ''}>
           <span><b>Редактировать превью моделью</b>
             <div class="note muted">Превью донора уходит в модель целиком.
               ${COVER_FORM.edit ? `Тогда НЕ действуют: ${killed.kills.join(', ')} —
                 ${esc(killed.why)}.` : ''}</div></span></label>`
      : `<div class="note muted">${esc((d.rules.find(r => r.when === 'not_url') || {}).why || '')}.</div>`;
    const box = editBox.querySelector('#edit');
    if (box) box.onchange = e => { COVER_FORM.edit = e.target.checked; paintFields(); };
  }
  paintFields();

  form.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    COVER_FORM.mode = b.dataset.mode; render();
  });
  form.querySelectorAll('#langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? COVER_FORM.langs.add(l.dataset.code)
                  : COVER_FORM.langs.delete(l.dataset.code); };
    sync();
    box.onchange = () => { sync(); if (COVER_FORM.mode === 'title') render(); };
  });
  form.querySelector('#preset').onchange = e => COVER_FORM.preset = e.target.value;
  form.querySelector('#option').onchange = e => COVER_FORM.option = Number(e.target.value);

  const errBox = form.querySelector('#err');
  const resBox = form.querySelector('#res');
  const btn = form.querySelector('#go');
  btn.onclick = async () => {
    errBox.innerHTML = ''; resBox.innerHTML = ''; btn.disabled = true;
    btn.textContent = 'Отправляю…';
    try{
      const body = {mode: COVER_FORM.mode, preset: COVER_FORM.preset,
                    languages: [...COVER_FORM.langs],
                    provider: opt.provider || '', model: opt.model || '',
                    edit_preview: COVER_FORM.edit};
      if (COVER_FORM.mode === 'url'){
        body.urls = (form.querySelector('#urls').value || '')
          .split(/\s+/).map(x => x.trim()).filter(Boolean);
      } else if (COVER_FORM.mode === 'title'){
        body.titles = {};
        form.querySelectorAll('.title-in').forEach(i => {
          if (i.value.trim()) body.titles[i.dataset.lang] = i.value.trim();
        });
        body.extra_prompt = (form.querySelector('#extra') || {}).value || '';
      } else {
        body.seed = form.querySelector('#seed').value;
        body.n_variants = Number(form.querySelector('#n').value) || 3;
      }
      await post('/ui/covers', body);
      resBox.innerHTML = '<div class="res">Задача создана.</div>';
      setTimeout(render, 600);
    }catch(e){
      errBox.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }finally{ btn.disabled = false; btn.textContent = 'Запустить'; }
  };

  const list = $(`<div class="card">
    <div class="sec">Задачи обложек</div>
    ${d.jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Состояние</th><th>Готово</th><th>Создана</th><th></th>
      </tr></thead><tbody>${d.jobs.map(j => `<tr data-job="${esc(j.id)}">
        <td><div style="font-weight:600">${esc(j.title)}</div>
            <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
        <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
            ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
            ${j.progress != null ? `<div class="bar"><i style="width:${
              Math.round(j.progress * 100)}%"></i></div>` : ''}</td>
        <td>${j.results || '—'}</td>
        <td class="muted">${when(j.created)}</td>
        <td style="white-space:nowrap">${actions({service:'cover', id:j.id,
                                                  state:j.state, status:j.status})}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Задач обложек пока нет.</div>'}
    ${d.jobs.length ? '<div class="note muted">Нажмите на строку — покажутся готовые обложки.</div>' : ''}
  </div>`);
  app.append(list);
  wireActions(list);
  wireResults(list, 'cover');
}

async function viewPreset(id){
  const d = await api('/ui/presets/vsgen/' + encodeURIComponent(id));
  app.innerHTML = '';
  app.append($(`<a class="back" href="#/presets">← ко всем пресетам</a>
    <h1>${esc(d.name)}</h1>
    <p class="sub">${esc(d.note)}</p>`));

  const form = $(`<form id="pf"></form>`);
  form.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Название</div>
    <input id="p-name" value="${esc(d.name)}" style="width:100%;max-width:420px"></div>`));

  for (const g of d.groups){
    const card = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">${esc(g.title)}</div>
      <div class="fields">${g.fields.map(f => {
        const id = 'f-' + f.key;
        // Поле, отменённое другой настройкой, не прячем и не отключаем: readOnly
        // оставляет значение в форме (disabled-поля не отправляются, и сохранение
        // стёрло бы их), а причина написана рядом — правило 2 ТЗ.
        const off = f.off ? ' readonly title="' + esc(f.off) + '"' : '';
        const body = f.kind === 'select'
          ? `<select id="${id}" data-key="${esc(f.key)}"${f.off ? ' disabled' : ''}>
               <option value="">— как по умолчанию —</option>
               ${f.options.map(o => `<option value="${esc(o.value)}"${
                 String(f.value) === String(o.value) ? ' selected' : ''
               }>${esc(o.title)}</option>`).join('')}</select>`
          : f.kind === 'switch'
          ? `<select id="${id}" data-key="${esc(f.key)}"${f.off ? ' disabled' : ''}>
               <option value=""${f.value === '' ? ' selected' : ''}>— как по умолчанию —</option>
               <option value="1"${['1','true','on','да'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>включено</option>
               <option value="0"${['0','false','off','нет'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>выключено</option>
             </select>`
          : `<input id="${id}" data-key="${esc(f.key)}" value="${esc(f.value)}"
                 placeholder="${esc(f.placeholder)}"${off}>`;
        return `<div class="fld"><label for="${id}">${esc(f.label)}</label>
          ${body}
          ${f.off ? `<div class="note bad">${esc(f.off)}</div>`
                  : (f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : '')}
        </div>`;
      }).join('')}</div></div>`);
    form.append(card);
  }
  app.append(form);

  const bar = $(`<div style="display:flex;gap:10px;align-items:center">
    <button id="save">Сохранить</button>
    <a class="ghost" href="#/presets" style="color:var(--muted)">Отмена</a></div>`);
  app.append(bar);
  bar.querySelector('#save').onclick = async () => {
    const b = bar.querySelector('#save');
    b.disabled = true;
    const values = {};
    // Отключённые поля браузер не отправил бы сам; мы их и не читаем — значение
    // останется в пресете таким, каким было.
    form.querySelectorAll('[data-key]').forEach(el => {
      if (!el.disabled) values[el.dataset.key] = el.value;
    });
    try{
      await post('/ui/presets/vsgen/' + encodeURIComponent(id),
                 {name: form.querySelector('#p-name').value, values});
      toast('Сохранено', 'ok');
      location.hash = '#/presets';
    }catch(e){ toast(e.message); b.disabled = false; }
  };
}

      ${g.error
        ? `<div class="stage"><div class="dot s-error">!</div><div class="body">

             <div class="note muted">Пусто здесь означает «не спросили», а не

        : (g.items.length ? g.items.map(i => `<div class="stage">

               i.channels.length ? '✓' : '·'}</div>
             <div class="body">

               <div class="facts">${i.facts.map(f => esc(f)).join(' · ') || '—'}</div>
               <div class="note ${i.channels.length ? 'muted' : ''}">${
                 i.channels.length
                   ? 'каналы: ' + i.channels.map(ch =>
                       `<a href="#/channel/${ch.id}">${esc(ch.name)}</a>`).join(', ')

             </div>
             <div style="white-space:nowrap;align-self:center">
               ${g.service === 'vsgen' ? `<button class="ghost pedit"
                 data-key="${esc(i.key)}">Править</button>` : ''}
               <button class="ghost pcopy" data-svc="${esc(g.service)}"

    app.append(card);
    wirePresets(card);
  }
  app.append($(`<div class="note muted">Быстрее всего новый пресет получается копией
    похожего: «Копия» рядом с ним, потом правка полей. Завести с нуля и править
    настройки — в том сервисе, которому пресет принадлежит: ссылки в заголовках выше.
    Здесь их формы не повторяются намеренно — у обложек полей больше двадцати, и вторая
    копия формы разошлась бы с первой.</div>`));
}

function wirePresets(root){
  const ask = async (b, fn) => {
    b.disabled = true;
    try{ await fn(); await render(); }
    catch(e){
      b.disabled = false;
      const box = document.createElement('div');
      box.className = 'note bad';
      box.textContent = e.message;
      b.parentElement.appendChild(box);
    }
  };
  root.querySelectorAll('button.pedit').forEach(b => b.onclick =
    () => { location.hash = '#/preset/' + encodeURIComponent(b.dataset.key); });
  root.querySelectorAll('button.pcopy').forEach(b => b.onclick = () => {
    const to = prompt(`Имя копии пресета «${b.dataset.name}»:`,
                      b.dataset.name + ' — копия');
    if (!to) return;
    ask(b, () => post(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/copy`,
                      {from: b.dataset.name, to}));
  });
  root.querySelectorAll('button.pdel').forEach(b => b.onclick = () => {
    if (!confirm(`Удалить пресет «${b.dataset.name}»?`)) return;
    ask(b, () => api(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/${
      encodeURIComponent(b.dataset.name)}`, {method: 'DELETE'}));
  });
}

        u.disabled ? 'заблокирован' : 'работает'}</span>
        ${u.has_password ? '' : '<div class="note bad">пароль не задан</div>'}</td>
      <td style="white-space:nowrap">
        <button class="ghost upw" data-id="${u.id}" data-name="${esc(u.name)}"
          >Пароль</button>
        ${u.id === d.me ? '' : `<button class="ghost ublock" data-id="${u.id}"

          >${u.disabled ? 'Вернуть' : 'Заблокировать'}</button>`}
      </td>
    </tr>`).join('')}</tbody></table>

    <div class="sec" style="border-bottom:0">Завести человека</div>
    <div id="uerr"></div>
    <div class="fldrow"><label>Логин</label>
      <input id="n-login" style="width:200px" autocomplete="off">
      <label style="min-width:auto">Пароль</label>
      <input id="n-pw" type="password" style="width:200px" autocomplete="new-password">
    </div>
    <div class="fldrow"><label>Роль и квота</label>
      <select id="n-role">${d.roles.map(r =>
        `<option value="${esc(r.key)}">${esc(r.title)}</option>`).join('')}</select>
      <input id="n-quota" placeholder="без лимита" style="width:120px">

  const err = card.querySelector('#uerr');

    err.innerHTML = '';
    try{ await fn(); await render(); }
    catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };

  card.querySelector('#n-go').onclick = () => act(() => post('/ui/accounts', {
    login: card.querySelector('#n-login').value,
    password: card.querySelector('#n-pw').value,
    role: card.querySelector('#n-role').value,

      : `Вернуть доступ «${b.dataset.name}»?`)) return;

  card.querySelectorAll('input.uquota').forEach(inp => inp.onchange = () =>
    act(() => post(`/ui/accounts/${inp.dataset.id}`, {quota: inp.value})));

  return card;
