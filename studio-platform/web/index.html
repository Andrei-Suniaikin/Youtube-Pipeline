   записью, с отказом от правок и со сменой пресета. */
// `scope` в черновике нужен только ещё не заведённому пресету (`#/preset/new`): у
// заведённого тип хранит сервер, а у этого его негде держать, кроме как здесь — а
// пережить перерисовку он обязан, потому что от него считается набор вкладок.
let PRESET_DRAFT = {id: '', name: null, values: {}, scope: ''};
function presetDraft(id){
  if (PRESET_DRAFT.id !== String(id))
    PRESET_DRAFT = {id: String(id), name: null, values: {}, scope: ''};
  return PRESET_DRAFT;
}
function presetDraftDrop(){ PRESET_DRAFT = {id: '', name: null, values: {}, scope: ''}; }
// Пробелы внутри значения сравнение не различает: карту голосов виджет пересобирает
// при отрисовке («ru:x» → «ru: x»), и без этого нетронутое поле числилось бы правкой,
// а экран спрашивал бы «уйти без сохранения?» там, где ничего не меняли.
const sameValue = (a, b) =>
  String(a == null ? '' : a).replace(/\s+/g, ' ').trim() ===
  String(b == null ? '' : b).replace(/\s+/g, ' ').trim();

async function viewPreset(id){
  // `#/preset/new` — тот же редактор, но за ним ещё нет строки в кабинете: настройки
  // видны сразу, а заводится пресет первым «Сохранить». Имя требуется только в этот
  // момент — дальше его никто не проверяет и затереть пустым нельзя, так что держать
  // из-за него отдельный экран было незачем.
  const creating = String(id) === 'new';
  const draft = presetDraft(id);
  if (creating && !draft.scope) draft.scope = 'full';
  const d = await api(creating
    ? '/ui/presets/vsgen/new/form?scope=' + encodeURIComponent(draft.scope)
    : '/ui/presets/vsgen/' + encodeURIComponent(id));
  // Группы — вкладками, а не одной простынёй: полей три десятка, и «поменять голос»
  // не должно означать прокрутку мимо сборки и обложки. У частичного пресета вкладка
  // ровно одна — своя часть (раздел 4 спецификации: «Редактор частичного. Только
  // вкладка своей части»): у него нет и не может быть ссылок на другие части
  // (правило 4 — ссылок на ссылки нет), показывать остальные группы нечем.
  const slug = t => PRESET_SLUG[t] || 'ostalnoe';
  const groups = d.scope === 'full' ? d.groups
                                     : d.groups.filter(g => g.part === d.scope);
  const tabs = groups.map(g => [slug(g.title), g.title]);
  const cur = location.hash.split('/')[3] || (tabs[0] || ['', ''])[0];

  // Что реально хранится на сервере, — по всем группам, а не только по открытой
  // вкладке: черновик копит правки со всех вкладок, и сравнивать их не с чем иным.
  const saved = {};
  d.groups.forEach(g => g.fields.forEach(f => { saved[f.key] = f.value; }));
  // Поля группы, закрытой ссылкой на частичный пресет, отправлять нельзя — сервер
  // такую попытку отвергает (`ui_preset_save`). Ссылку могли поставить уже после
  // того, как черновик набрали, поэтому чужие ключи выбрасываем на каждом заходе,
  // а не надеемся поймать их в момент переключения.
  const sendable = new Set();
  // У ещё не заведённого пресета набор полей считаем от ВЫБРАННОГО типа, а не от всех
  // групп: тип тут переключается на месте, и набранное для «Картинок» уехало бы в
  // пресет «Только озвучка» настройкой, которой в нём не видно и которую не поправить.
  (creating ? groups : d.groups).filter(g => !g.readonly).forEach(g =>
    g.fields.forEach(f => sendable.add(f.key)));
  Object.keys(draft.values).forEach(k => {
    if (!sendable.has(k)) delete draft.values[k];
  });
  // Набранное возвращаем в поля ДО отрисовки: виджеты (карта голосов) собираются из
  // `f.value`, и подстановка после сборки их бы не переубедила.
  d.groups.forEach(g => g.fields.forEach(f => {
    if (Object.prototype.hasOwnProperty.call(draft.values, f.key))
      f.value = draft.values[f.key];
  }));

  app.innerHTML = '';
  // Заголовок держим за ссылку: имя пресета правится полем ниже, а целый пресет после
  // записи остаётся открытым — и переименованный стоял под прежним заголовком до
  // перезахода. Человек видел старое имя ровно там, где ищет подтверждение, что
  // записалось (ниже, в обработчике сохранения, заголовок обновляется).
  const head = $(`<a class="back" href="#/presets">← ко всем пресетам</a>
    <h1>${esc(creating ? 'Новый пресет' : d.name)}</h1>
    <p class="sub">${esc(d.note)}</p>`);
  app.append(head);
  const headTitle = head.querySelector('h1');
  const name = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Название</div>
    <div class="secbody">
    <input id="p-name" placeholder="например: длинные ролики, польский"
      value="${esc(draft.name != null ? draft.name : d.name)}"
      style="width:100%;max-width:420px">
    <div class="note bad" id="p-name-err" hidden></div></div></div>`);
  app.append(name);

  // Тип пресета — здесь же, в форме, а не на экране до неё (жалоба владельца 21.09).
  // Кнопки-группа, а не выпадающий список: вариантов семь, и прежнее решение
  // владельца — видеть их сразу. Переключается только пока пресета нет: после
  // заведения тип лежит в `_scope`, ручки сменить его у сервера нет, а молча
  // переписать тип пресета, на который уже ссылаются каналы, нельзя.
  if (creating){
    const scopeCard = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">Тип пресета ${hintDot('Частичный пресет закрывает одну часть '
        + 'ролика. Озвучку, картинки, клипы и сборку можно подключить ссылкой в целом '
        + 'пресете; сценарий и обложку целый пресет выбирает по названию.')}</div>
      <div class="secbody">
      <div class="modes" id="scope-modes">
        <button type="button" data-scope="full"
          class="${draft.scope === 'full' ? 'on' : ''}">Целый</button>
        ${PART_TITLES.map(([code, title]) =>
          `<button type="button" data-scope="${code}"
            class="${draft.scope === code ? 'on' : ''}"
            >Только ${esc(title.toLowerCase())}</button>`).join('')}
      </div>
      </div></div>`);
    app.append(scopeCard);
    scopeCard.querySelectorAll('#scope-modes button').forEach(b => b.onclick = async () => {
      if (draft.scope === b.dataset.scope) return;
      if (PRESET_PART_DIRTY && PRESET_PART_DIRTY()){
        confirmModal('Сменить тип пресета?', 'Набранное в форме не заведено и пропадёт.',
          () => { PRESET_PART_DIRTY = null; LEAVE_GUARD = null; b.click(); });
        return;
      }
      draft.scope = b.dataset.scope;
      // Набор вкладок считается от типа, а открытая вкладка — часть адреса. Смена типа
      // обязана вернуть адрес к первой вкладке, иначе остался бы адрес части, которой
      // у нового типа нет, и форма открылась бы «ни на чём».
      if (location.hash !== '#/preset/new'){ location.hash = '#/preset/new'; return; }
      await render();
    });
  }
  // Сценарий и обложка — такие же части, как картинки и сборка (владелец 22.09.2026).
  // Их настройки хранятся в хранилище текстов и обложек, поэтому и поля у них свои —
  // но на этом же экране, сразу под выбором типа, а не отдельным окном.
  if (creating && (draft.scope === 'text' || draft.scope === 'cover')){
    name.remove();                              // у формы части своё поле названия
    // Сторож от формы «Целый» (она рисовалась до смены типа) здесь ни о чём: его
    // черновик — другой. Оставленный, он после заведения кричал бы «не заведён».
    LEAVE_GUARD = null;
    PRESET_PART_DIRTY = null;
    let svc = 'cover';
    const host = document.createElement('div');
    // Набранное в форме части — не в черновике пресета, поэтому и сторож свой: уход,
    // смена типа и «по ссылке / с нуля» спрашивают, прежде чем стереть набранное.
    let touched = false;
    const partDirty = () => touched && host.isConnected;
    PRESET_PART_DIRTY = partDirty;
    const guardHash = location.hash;
    const guard = () => {
      touched = true;
      LEAVE_GUARD = {hash: guardHash, keep: h => h === guardHash, dirty: partDirty,
                     what: 'Новый пресет ещё не заведён — набранное нигде не записано.'};
    };
    host.addEventListener('input', guard);
    if (draft.scope === 'text'){
      svc = draft.textKind === 'gen' ? 'rewrite_gen' : 'rewrite';
      const kinds = $(`<div class="modes" id="text-kind" style="margin-bottom:12px">
        <button type="button" data-k="link" class="${svc === 'rewrite' ? 'on' : ''}"
          >Рерайт по ссылке</button>
        <button type="button" data-k="gen" class="${svc === 'rewrite_gen' ? 'on' : ''}"
          >Бриф для текста с нуля</button></div>`);
      app.append(kinds);
      kinds.querySelectorAll('button').forEach(b => b.onclick = () => {
        if (b.classList.contains('on')) return;
        const go = async () => { touched = false; LEAVE_GUARD = null;
                                 draft.textKind = b.dataset.k; await render(); };
        if (partDirty()) confirmModal('Сменить вид сценария?',
          'Набранное в форме не заведено и пропадёт.', go);
        else go();
      });
    }
    app.append(host);
    // Имя, набранное до выбора типа, переезжает в форму — и уже есть что терять.
    if ((draft.name || '').trim()) guard();
    await neighbourPresetModal(svc, null, {host, reload: false, prefillName: draft.name || '',
      onSaved: nm => {
        touched = false;
        LEAVE_GUARD = null;
        PRESET_PART_DIRTY = null;
        presetDraftDrop();
        toast(`Пресет «${nm}» заведён`, 'ok');
        location.hash = '#/presets';
      }});
    return;
  }
  if (!creating) app.append($(presetUsersHtml(d.scope, d.users || {})));
  // Плашка проблем ссылок на вкладке (раздел 4: «link_problems — красной плашкой на
  // вкладке группы с причиной») — предупреждающий значок на самой вкладке, чтобы
  // проблему было видно, не открывая её, и красный блок внутри вкладки (см. ниже,
  // `linkBarHtml` в `fieldForm`).
  app.append($(`<div class="subtabs">${tabs.map(([k, title]) => {
    const g = groups.find(x => slug(x.title) === k);
    const warn = g && g.link_problem ? ' ⚠' : '';
    return `<a href="#/preset/${encodeURIComponent(id)}/${k}"
        class="${cur === k ? 'on' : ''}">${esc(title)}${warn}</a>`;
  }).join('')}</div>`));
  const shown = groups.filter(g => slug(g.title) === cur);
  const formGroups = shown.length ? shown : groups.slice(0, 1);
  // Переключатель «свои поля / из частичного пресета» — только у целого пресета:
  // у частичного своих ссылок не бывает (правило 4), поэтому колбэк вешаем на массив
  // групп только когда `d.scope === 'full'` — без него `fieldForm()` переключатель
  // не рисует (см. комментарий у самой функции про буквальную сигнатуру).
  // У ещё не заведённого пресета переключателя ссылок нет: писать ссылку некуда —
  // ручка `/links` адресуется номером, которого пока не существует. Поэтому про это
  // сказано в карточке типа, а не оставлено кнопкой, которая молча не сработает.
  if (d.scope === 'full' && !creating){
    formGroups.onLinkChange = async (part, presetId) => {
      // `ownBtn`/`linkBtn` в fieldForm переключают вид сразу по клику, до ответа
      // сервера (иначе список частичных не успевал бы открыться до записи). Если
      // запись упала, экран должен вернуться к тому, что реально хранится, а не
      // остаться в оптимистичном виде — иначе переключатель показывает «Свои поля»
      // при фактически стоящей ссылке (ревью цикла 1 фазы 3, Issue 2). `render()`
      // перечитывает пресет и перерисовывает форму в любом случае — и при успехе,
      // и при ошибке, — поэтому визуальное состояние всегда совпадает с сервером.
      try{
        await post(`/ui/presets/vsgen/${encodeURIComponent(id)}/links`,
                   {part, preset_id: presetId});
      }catch(e){
        toast(e.message);
      }
      await render();
    };
  }
  const form = fieldForm(formGroups);
  app.append(form);

  // ЛЮБОЕ изменение значения в форме — в черновик, а не только набор с клавиатуры.
  // Не «на всякий случай»: перерисовка формы может случиться в любой момент (вкладка,
  // ссылка на частичный пресет), и после неё в DOM уже не спросишь, что там было.
  // Правки «мимо клавиатуры» (крестик у строки карты голосов, заведённый тут же шаблон
  // Lumean, выбранный в окне пресет соседа) сюда доходят потому, что меняющий их код
  // ходит через setFieldValue — он и шлёт `change`, который браузер сам бы не послал.
  // В черновике держим только ОТЛИЧИЯ от сохранённого — одинаковое на сервер
  // не уезжает и правкой не считается.
  const nameInput = name.querySelector('#p-name');
  const nameErr = name.querySelector('#p-name-err');
  const snap = () => {
    const now = form.read();
    for (const k in now){
      if (sameValue(now[k], saved[k])) delete draft.values[k];
      else draft.values[k] = now[k];
    }
    draft.name = nameInput.value;
  };
  form.addEventListener('input', snap);
  form.addEventListener('change', snap);
  nameInput.addEventListener('input', snap);
  const dirty = () =>
    (draft.name != null && !sameValue(draft.name, d.name)) ||
    Object.keys(draft.values).some(k => !sameValue(draft.values[k], saved[k]));

  // Уход с формы с незаписанными правками спрашивает, а не теряет молча. Сторож
  // снимается сам: записали — спрашивать не о чем (см. ниже), ушли по своей воле —
  // снимает роутер.
  LEAVE_GUARD = {
    hash: location.hash,
    keep: h => h.startsWith('#/preset/') &&
               decodeURIComponent(h.split('/')[2] || '') === String(id),
    dirty, drop: presetDraftDrop,
    what: creating ? 'Новый пресет ещё не заведён — набранное нигде не записано.'
                   : 'Настройки пресета изменены, но не сохранены.',
  };

  // Целый пресет после записи остаётся открытым: его настраивают по многу полей за
  // заход, и уход на список посреди настройки — ровно то, на что жаловался владелец.
  // Частичный — про одну часть: записали и на список.
  const full = d.scope === 'full';
  app.append(saveBar('#/presets', async () => {
    // Уезжает и то, что набрано на других вкладках: черновик копил правки всего
    // пресета, и записать только открытую вкладку значило бы потерять остальные
    // молча — та же потеря, от которой уходим.
    const values = {};
    Object.keys(draft.values).forEach(k => {
      if (sendable.has(k)) values[k] = draft.values[k];
    });
    Object.entries(form.read()).forEach(([k, v]) => {
      if (sendable.has(k)) values[k] = v;
    });
    if (creating){
      // Имя спрашиваем ровно здесь: сервер отвергает пустое только при заведении
      // (`ui_preset_create`), а набирать настройки оно не мешало. Говорим у самого
      // поля — не тостом поверх экрана, который не показывает, где поправить.
      const nm = nameInput.value.trim();
      if (!nm){
        nameErr.textContent = 'Дайте пресету имя — по нему его ищут в списках и '
          + 'привязывают к каналу. Настройки уже набраны, они никуда не денутся.';
        nameErr.hidden = false;
        nameInput.focus();
        const why = new Error('у пресета должно быть имя');
        why.inplace = true;                       // уже сказано у поля, тост не нужен
        throw why;
      }
      nameErr.hidden = true;
      const out = await post('/ui/presets/vsgen', {name: nm, scope: draft.scope});
      // Черновик переносим на заведённый номер ДО записи значений: пресет уже есть, и
      // второй раз его не завести — имя занято им же (409). Если запись полей упадёт
      // (сосед не ответил, поле не прошло контракт), человек окажется в редакторе
      // нового пресета со всем набранным на месте, а не перед пустой формой.
      PRESET_DRAFT = {id: String(out.id), name: null, values: {...values}, scope: ''};
      LEAVE_GUARD = null;
      try{
        if (Object.keys(values).length)
          await post('/ui/presets/vsgen/' + out.id, {name: nm, values});
        presetDraftDrop();
      }finally{
        location.hash = '#/preset/' + out.id;
      }
      return;
    }
    await post('/ui/presets/vsgen/' + encodeURIComponent(id),
               {name: nameInput.value, values});
    // Записанное становится «тем, что хранится»: иначе сторож ухода считал бы
    // сохранённые правки незаписанными и спрашивал бы на пустом месте.
    Object.assign(saved, values);
    d.name = nameInput.value;
    if (headTitle) headTitle.textContent = d.name;
    draft.values = {};
    draft.name = null;
    // Отказ у поля имени снимаем: он про пустое имя, а имя только что уехало.
    nameErr.hidden = true;
  }, null, {stay: creating || full}));
}

// Батч C: отдельный экран «Настройки проекта» убран — настройки этапа теперь внутри
// каждой вкладки производства (renderStageTab), той же ручкой `GET/POST
// /ui/projects/{pid}/settings`. Вторая копии формы не заводим.

async function viewPresets(){
  const d = await api('/ui/presets');
  app.innerHTML = '';
  const head = $(`<div class="head">
      <div><h1>Пресеты ${hintDot('Настройки, которыми делаются ролики. Целый пресет '
        + 'задаёт всё сразу, частичный — одну часть: текст, озвучку, картинки, клипы, '
        + 'сборку или обложку. Быстрее всего новый получается копией похожего.')}</h1></div>
      <button id="newpr" class="small">Создать</button>
    </div>`);
  app.append(head);
  // Раньше кнопка вела ровно в один вид, а пресет канала и шаблон Lumean заводились
  // своими кнопками внизу страницы — то есть найти их можно было, только долистав.
  // 21.09.2026: сюда же пресеты обложки и рерайта. До этого завести пресет обложки
  // значило сперва завести пресет производства «Только обложка» — обёртку, у которой
  // всё содержимое — одна ссылка на пресет Cover Studio (`preset_fields`: часть
  // «Обложка» — единственное поле `preset_cover`), и лишь потом, из его редактора,
  // завести сам пресет обложки. Два заведения на одно намерение; теперь второе
  // доступно напрямую, а обёртка остаётся тем, кому она правда нужна.
  // 22.09.2026 владелец: «нет больше отдельных студий — одна студия; пресеты текста и
  // обложки — такие же обычные, как картинки и монтаж». Отдельных пунктов «Пресет
  // обложки» / «Пресет рерайта» больше нет: это части пресета, их выбирают там же,
  // где «Только картинки» и «Только сборку».
  head.querySelector('#newpr').onclick = ev => menuInline(ev.currentTarget, [
    {title: 'Пресет',
     hint: 'целый или одна часть: текст, озвучка, картинки, клипы, сборка, обложка',
     // Черновик незаведённого живёт под ключом «new» и помнит выбранный тип. Если его
     // не сбросить, «Создать» во второй раз открывало бы форму с типом от прошлого
     // захода — состояние, которого человек не задавал и которому неоткуда взяться.
     run: () => { presetDraftDrop(); location.hash = '#/preset/new'; }},
    {title: 'Пресет канала',
     hint: 'как живёт канал: расписание, машина заливки, ниша',
     run: () => channelPresetModal(null)},
    {title: 'Шаблон озвучки Lumean',
     hint: 'голос и настройки на стороне Lumean',
     run: () => { location.hash = '#/lumean/new'; }},
  ]);

  if (d.broken.length){
    app.append($(`<div class="card" style="margin-bottom:16px">
      <div class="sec">Ссылки в никуда</div>
      ${d.broken.map(b => `<div class="stage">
        <div class="dot s-error">!</div>
        <div class="body">
          <div class="name">${esc(b.why)}</div>
          <div class="facts">на него ссылаются: ${b.channels.map(ch =>
            `<a href="#/channel/${ch.id}">${esc(ch.name)}</a>`).join(', ')}</div>
          <div class="note muted">Такой канал узнаёт об этом в момент генерации —
            то есть после того, как встал.</div>
        </div></div>`).join('')}
    </div>`));
  }

  // Один пресет-«стейдж» — общий для всех трёх сервисов; у производства (vsgen)
  // вдобавок строка «кто бежит» счётом (раздел 4 спецификации: «каналы: 3,
  // проекты: 12», у частичного ещё «в пресетах: 2») — счёт берётся из
  // `preset_links.users_of` (фаза 1/2), а не из числа каналов-ссылок ниже:
  // «кто бежит» отвечает и за проекты, которых в первой строке нет вовсе.
  const presetItemHtml = (g, i) => {
    const who = i.users ? [`каналы: ${i.users.channels}`, `проекты: ${i.users.projects}`,
      ...(i.scope !== 'full' ? [`в пресетах: ${i.users.presets}`] : [])].join(', ') : '';
    // Частичный пресет никогда не привязан к каналу напрямую — канал ссылается
    // на целый, а не на частичный. Раньше «в работе» считалось только по прямым
    // каналам (`i.channels`), и частичный, который реально бежит через целый
    // (`_links`), показывался серой точкой и «ни один канал им не пользуется» —
    // ровно то ложное прочтение, от которого предостерегает раздел 4 (ревью
    // цикла 1 фазы 3, Issue 1). Минимальный правдивый признак — `users.presets`:
    // он уже посчитан `preset_links.users_of` и учитывает только ссылки, которые
    // реально разрешились бы (см. фазу 1).
    const viaPresets = i.scope !== 'full' && i.users ? i.users.presets : 0;
    const inUse = i.channels.length > 0 || viaPresets > 0;
    // Строка пресета — две строки текста, а не четыре (жалоба владельца 21.09.2026
    // «перегружен»): название и чем он делает — рядом, кто им пользуется — ниже. Счёт
    // «каналы: 0, проекты: 0» рядом с «ни один канал им не пользуется» говорил одно и
    // то же дважды, поэтому нули не печатаются; прочерк на месте пустых фактов — тоже.
    // Каналы названы ссылками — их число рядом не нужно; через целые пресеты — число
    // уже в самой фразе. Остаются проекты, и только когда они есть.
    const whoShown = i.users ? [
      ...(!i.channels.length && !viaPresets && i.users.channels
        ? [`каналы: ${i.users.channels}`] : []),
      ...(i.users.projects ? [`проекты: ${i.users.projects}`] : []),
    ].join(', ') : '';
    // Настройки в карточке не выписываются (владелец 22.09.2026: «очень мешает»):
    // строка из движка, голосов и качества читалась хуже самого названия, а увидеть
    // их целиком можно по «Править».
    // Старый частичный «Сценарий»/«Обложка» производства — это ссылка на пресет текста или
    // обложки и стоит в той же карточке, часто под тем же именем. Пометка отличает.
    const wrapper = g.service === 'vsgen' && (i.scope === 'text' || i.scope === 'cover');
    const tag = wrapper ? 'ссылка' : PRESET_KIND_TAG[g.service];
    const kind = wrapper ? `ссылку на пресет ${i.scope === 'text' ? 'текста' : 'обложки'}`
      : (PRESET_KIND_WORD[g.service] || (i.scope === 'full' ? 'целый пресет'
                                                             : 'частичный пресет'));
    return `<div class="stage pitem">
      <div class="dot ${inUse ? 's-done' : 's-idle'}">${inUse ? '✓' : '·'}</div>
      <div class="body">
        <div class="pline"><span class="name">${esc(i.name)}</span>${
          tag ? `<span class="pill s-idle ptag">${esc(tag)}</span>` : ''}</div>
        <div class="note ${inUse ? 'muted' : ''}">${
          i.channels.length
            ? 'каналы: ' + i.channels.map(ch =>
                `<a href="#/channel/${ch.id}">${esc(ch.name)}</a>`).join(', ')
            : viaPresets > 0
              ? `напрямую каналы не ссылаются — используется через целые пресеты (${viaPresets})`
              : 'ни один канал им не пользуется'}${
          whoShown ? `<span class="muted"> · ${esc(whoShown)}</span>` : ''}</div>
      </div>
      <div class="pacts">
        ${g.service === 'vsgen'
          ? iconBtn('pedit', 'edit', 'Править', i.name, `data-key="${esc(i.key)}"`)
          : iconBtn('pform', 'edit', 'Править', i.name,
                    `data-svc="${esc(g.service)}" data-name="${esc(i.name)}"`)}
        ${iconBtn('pcopy', 'copy', 'Копия', i.name,
                  `data-svc="${esc(g.service)}" data-name="${esc(i.name)}"`)}
        ${iconBtn('bad pdel', 'remove', 'Удалить', i.name,
                  `data-svc="${esc(g.service)}" data-name="${esc(i.name)}"
                   data-kind="${esc(kind)}"`)}
      </div></div>`;
  };

  // Пресеты производства — «Целые» и «Частичные» отдельно, частичные вдобавок по
  // частям (раздел 4 спецификации): иначе список из трёх десятков строк не отличить,
  // какая настройка целиком отвечает за ролик, а какая — только заготовка озвучки.
  // Фильтр списка (17.09.2026): по названию и по типу. Тип — у пресетов производства
  // (целый / частичный / какая часть); у Rewrite и Cover типа нет, поэтому при
  // выборе типа их карточки скрываются, а не показываются «не подходящими».
  const F = presetFilter;
  const nameOk = i => !F.q || String(i.name || '').toLowerCase().includes(F.q.toLowerCase());
  const SIDE_CODES = new Set(PRESET_SIDE_TYPES.map(([c]) => c));
  // Виды «Каналы» и «Озвучка Lumean» — не про пресеты производства вовсе. Пока выбраны
  // ТОЛЬКО они, список производства пустеет целиком и на экране остаётся одно нужное;
  // вместе с «Целыми» — показываются и те и другие, потому что выбор нескольких видов
  // читается как «покажи вот это», а не «покажи то, что одновременно и то и другое».
  const onlySides = () => F.types.length > 0 && F.types.every(c => SIDE_CODES.has(c));
  const typeOk = i => {
    if (!F.types.length) return true;             // «Все виды» — это пустой набор
    return (F.types.includes('full') && i.scope === 'full')
        || (F.types.includes('partial') && i.scope !== 'full')
        || F.types.includes(i.scope);
  };

  // Пресеты из хранилищ текстов и обложек — такие же части, как картинки и сборка
  // (владелец 22.09.2026: «одна студия»). Каждому — часть, куда он встаёт в списке.
  // Сервис остаётся на элементе: по нему «Править», «Копия» и «Удалить» знают, куда
  // писать.
  const NB_PART = {rewrite: 'text', rewrite_gen: 'text', cover: 'cover'};
  const nbItems = d.groups.filter(g => NB_PART[g.service]).flatMap(g =>
    (g.items || []).map(i => Object.assign({}, i, {scope: NB_PART[g.service],
      service: g.service, users: null})));
  const nbErrors = d.groups.filter(g => NB_PART[g.service] && g.error);
  // Каждый вид — своей карточкой, как «Шаблоны озвучки Lumean» (владелец 22.09.2026:
  // «картинки, монтаж и все эти типы сейчас склеены в одно — несуразно; отдельными
  // карточками мозг будет отделять их друг от друга»). Раньше это был один лист с
  // подзаголовками «Целые / Частичные / Озвучка / …», и границу вида глаз не находил.
  // «Целые» видны всегда — это главный вид; пустая часть карточки не получает.
  const vsgenCardsHtml = vsItems => {
    const items = [...vsItems.map(i => Object.assign({service: 'vsgen'}, i)), ...nbItems]
      .filter(i => nameOk(i) && typeOk(i));
    const filtered = F.q || F.types.length > 0;
    const cards = [];
    const whole = items.filter(i => i.scope === 'full');
    if (!filtered || whole.length){
      cards.push({title: 'Целые пресеты', html: whole.length
        ? whole.map(i => presetItemHtml({service: i.service}, i)).join('')
        : emptyBox({why: 'Целых пресетов нет.',
            means: 'Пресет — это настройки озвучки, кадров и монтажа одним набором. '
                 + 'Без него выпуску нечем делать ролик.',
            href: '#/preset/new', act: 'Завести первый пресет'})});
    }
    for (const [code, title] of PART_TITLES){
      const arr = items.filter(i => i.scope === code);
      const errs = nbErrors.filter(g => NB_PART[g.service] === code)
        .filter(() => !F.types.length || F.types.includes(code) || F.types.includes('partial'));
      if (!arr.length && !errs.length) continue;
      cards.push({title, html: arr.map(i => presetItemHtml({service: i.service}, i)).join('')
        + errs.map(g => `<div class="stage"><div class="dot s-error">!</div><div class="body">
            <div class="name">${esc(NEIGHBOUR_PART[g.service] || g.title)}: список не получен —
              ${esc(g.error)}</div>
            <div class="note muted">Пусто здесь означает «не спросили», а не «пресетов нет».
            </div></div></div>`).join('')});
    }
    return cards;
  };

  // Пресеты канала (18.09.2026) — отдельная сущность: это не «чем делается ролик», а
  // «как живёт канал»: расписание, машина заливки, ниша. Привязка живая.
  let chp = {presets: [], note: ''};
  try{ chp = await api('/ui/channel-presets'); }catch(e){ toast(e.message); }

  // Подпись кнопки — то, что сейчас выбрано, и это единственное, что про фильтр видно
  // не раскрывая его. Больше двух видов в строку не пишем: подпись кнопки перестала бы
  // быть подписью и стала бы тем же списком, только без рамок.
  const typeLabel = () => {
    const t = F.types.map(c => PRESET_TYPE_TITLE.get(c)).filter(Boolean);
    if (!t.length) return 'Все виды';
    return t.length <= 2 ? t.join(', ') : `${t[0]}, ${t[1]} +${t.length - 2}`;
  };
  const bar = $(`<div class="card" style="padding:16px 18px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <input id="pf-q" type="search" placeholder="Поиск по названию"
             style="flex:1 1 240px;min-width:0;max-width:360px" value="${esc(F.q)}">
      <div class="pf-pick">
        <button type="button" id="pf-open" class="ghost small" aria-haspopup="true"
          aria-expanded="false">${esc(typeLabel())}</button>
        <div class="pf-menu" id="pf-types" hidden>${PRESET_FILTER_TYPES.map(
          ([code, title], n) => `${SIDE_CODES.has(code)
            && !SIDE_CODES.has((PRESET_FILTER_TYPES[n - 1] || [])[0])
              ? '<div class="pf-sep"></div>' : ''}<button type="button" class="pf-item small${
            (code === 'all' ? !F.types.length : F.types.includes(code)) ? ' on' : ''
          }" data-type="${code}">${esc(title)}</button>`
        ).join('')}</div>
      </div>
    </div></div>`);
  app.append(bar);
  const list = document.createElement('div');
  app.append(list);

  // Боковые карточки («Пресеты каналов», «Шаблоны Lumean») создаются ниже, а прятать их
  // надо на каждую смену фильтра. Поэтому ссылки объявлены здесь, а `paint` только
  // переключает видимость — перерисовывать их незачем, данные от фильтра не зависят.
  let lumCard = null, chpCard = null;

  const paint = () => {
    const any = !F.types.length;
    const side = onlySides();
    if (lumCard) lumCard.style.display = (any || F.types.includes('lumean')) ? '' : 'none';
    if (chpCard) chpCard.style.display = (any || F.types.includes('channel')) ? '' : 'none';
    list.innerHTML = '';
    let shown = 0;
    for (const g of d.groups){
      // Виды «Каналы» и «Озвучка Lumean» не про эти списки вовсе: карточка производства
      // при них рисовала саму себя с надписью «под фильтр ничего не подошло» — рядом с
      // секцией, которую человек как раз и просил показать. Это читается как поломка.
      if (side) continue;
      // Пресеты текстов и обложек стоят частями внутри общего списка — отдельной
      // карточкой со своим заголовком хранилища их больше нет.
      if (NB_PART[g.service]) continue;
      // У пресетов рерайта и обложек типа нет вовсе, поэтому любой выбранный вид их
      // карточки скрывает: показывать их «не подошедшими» было бы неправдой.
      if (g.service !== 'vsgen' && !any) continue;
      const items = g.service === 'vsgen' ? g.items : g.items.filter(nameOk);
      if (g.service !== 'vsgen' && F.q && !items.length && !g.error) continue;
      const blocks = g.service === 'vsgen'
        ? (g.error ? [{title: 'Пресеты', html: `<div class="stage"><div class="dot s-error">!</div>
             <div class="body"><div class="name">Список не получен — ${esc(g.error)}</div>
             <div class="note muted">Пусто здесь означает «не спросили», а не
               «пресетов нет».</div></div></div>`}] : vsgenCardsHtml(g.items))
        : [{title: g.title, html: g.error
            ? `<div class="stage"><div class="dot s-error">!</div><div class="body">
                 <div class="name">Список не получен — ${esc(g.error)}</div></div></div>`
            : (items.length ? items.map(i => presetItemHtml(g, i)).join('')
               : emptyBox({why: 'Пресетов нет.',
                   means: 'Этот вид настроек пока ни разу не заводили.',
                   href: '#/preset/new', act: 'Завести первый пресет'}))}];
      for (const b of blocks){
        shown++;
        const card = $(`<div class="card ptype" style="margin-bottom:16px">
          <div class="sec">${esc(b.title)}</div>${b.html}</div>`);
        list.append(card);
        wirePresets(card);
      }
    }
    if (!shown && !side) list.append($(
      '<div class="card"><div class="empty">Под фильтр ничего не подошло.</div></div>'));
  };
  const save = () => { try{ localStorage.setItem('presetFilter', JSON.stringify(F)); }catch(e){} };
  bar.querySelector('#pf-q').oninput = e => { F.q = e.target.value; save(); paint(); };

  const typeMenu = bar.querySelector('#pf-types');
  const typeOpen = bar.querySelector('#pf-open');
  const typeShut = () => {
    if (typeMenu.hidden) return;
    typeMenu.hidden = true;
    typeOpen.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', typeOutside, true);
    document.removeEventListener('keydown', typeEsc, true);
  };
  const typeOutside = ev => {
    if (!typeOpen.parentElement.contains(ev.target)) typeShut();
  };
  const typeEsc = ev => { if (ev.key === 'Escape') typeShut(); };
  typeOpen.onclick = () => {
    if (!typeMenu.hidden) return typeShut();
    typeMenu.hidden = false;
    typeOpen.setAttribute('aria-expanded', 'true');
    // Через такт — иначе слушатель поймал бы тот же клик, которым список открыли.
    setTimeout(() => {
      document.addEventListener('mousedown', typeOutside, true);
      document.addEventListener('keydown', typeEsc, true);
    }, 0);
  };
  bar.querySelectorAll('[data-type]').forEach(b => b.onclick = () => {
    const code = b.dataset.type;
    // «Все» — не вид, а сброс набора. Остальные переключаются по одному, и список
    // остаётся открытым: выбирают их обычно не по одному, и закрытие после каждого
    // означало бы открывать его заново столько раз, сколько видов нужно.
    if (code === 'all') F.types = [];
    else if (F.types.includes(code)) F.types = F.types.filter(x => x !== code);
    else F.types = [...F.types, code];
    bar.querySelectorAll('[data-type]').forEach(x => x.classList.toggle('on',
      x.dataset.type === 'all' ? !F.types.length : F.types.includes(x.dataset.type)));
    typeOpen.textContent = typeLabel();
    save(); paint();
  });
  paint();
  // Шаблоны озвучки Lumean (18.09.2026): собираются прямо здесь. Провайдер отдаёт id
  // в ответе на создание — его сразу видно и можно вставить в карту голосов пресета.
  let lum = {ok: false, templates: [], fields: []};
  try{ lum = await api('/ui/lumean/templates'); }catch(e){ lum = {ok: false, why: e.message}; }
  lumCard = $(`<div class="card">
    <div class="sec">Шаблоны озвучки Lumean
      ${lum.ok ? `<button class="ghost small" id="lum-new"
        style="float:right;font-weight:400;text-transform:none;letter-spacing:0"
        >Завести</button>` : ''}</div>
    ${lum.ok
      ? (lum.templates.length ? lum.templates.map(t => `<div class="stage pitem">
          <div class="dot s-done">♪</div>
          <div class="body">
            <div class="name">${esc(t.name || t.id)}</div>
            <div class="note muted mono" style="font-size:11px">${esc(t.id)}</div>
          </div>
          <div class="pacts">
            ${iconBtn('lum-copy', 'link', 'Копировать id', t.name || t.id,
                      `data-id="${esc(t.id)}"`)}
            ${iconBtn('lum-edit', 'edit', 'Править', t.name || t.id, `data-id="${esc(t.id)}"`)}
            ${iconBtn('bad lum-del', 'remove', 'Удалить', t.name || t.id,
                      `data-id="${esc(t.id)}" data-name="${esc(t.name || t.id)}"`)}
          </div></div>`).join('')
        : '<div class="empty">Шаблонов нет — заведите первый.</div>')
      : `<div class="secbody"><div class="note bad">${esc(lum.why || 'Lumean не ответил')}</div>
         <div class="note muted">Шаблоны читаются ключом Lumean из профиля: без него
           список пуст, а озвучка идёт по id, вписанному в пресет руками.</div></div>`}
    ${lum.ok ? `<div class="secbody"><div class="note muted">${esc(lum.note || '')}</div></div>` : ''}
  </div>`);
  app.append(lumCard);
  const lumNew = lumCard.querySelector('#lum-new');
  // Заводится и правится шаблон своей страницей, как обычный пресет (22.09.2026).
  if (lumNew) lumNew.onclick = () => { location.hash = '#/lumean/new'; };
  lumCard.querySelectorAll('.lum-edit').forEach(b => b.onclick =
    () => { location.hash = '#/lumean/' + encodeURIComponent(b.dataset.id); });
  lumCard.querySelectorAll('.lum-copy').forEach(b => b.onclick = async () => {
    try{ await navigator.clipboard.writeText(b.dataset.id); toast('id скопирован', 'ok'); }
    catch(e){ toast('Скопировать не вышло — id виден в строке шаблона'); }
  });
  lumCard.querySelectorAll('.lum-del').forEach(b => b.onclick = () =>
    // Удаление спрашивается окном по центру с затемнением (владелец 24.09.2026):
    // врезка в строке уезжала вместе со списком и терялась среди соседних пресетов.
    confirmModal('Удалить шаблон озвучки',
      `Удалить «${b.dataset.name}» в Lumean? Это правда удалит его у провайдера.`,
      async () => {
        try{ await api(`/ui/lumean/templates/${encodeURIComponent(b.dataset.id)}`,
                       {method: 'DELETE'}); await render(); }
        catch(e){ toast(e.message); }
      }));

  // Каналы на пресете видно сразу: правка меняет их поведение со следующего прохода.
  chpCard = $(`<div class="card">
    <div class="sec">Пресеты каналов
      <button class="ghost small" id="chp-new"
        style="float:right;font-weight:400;text-transform:none;letter-spacing:0"
        >Завести</button></div>
    ${chp.presets.length ? chp.presets.map(p => `<div class="stage pitem" data-chp="${p.id}">
      <div class="dot ${p.channels.length ? 's-done' : 's-idle'}"
        >${p.channels.length ? '✓' : '·'}</div>
      <div class="body">
        <div class="name">${esc(p.name)}</div>
        <div class="note ${p.channels.length ? 'muted' : ''}">${p.channels.length
          ? 'каналы: ' + p.channels.map(ch =>
              `<a href="#/channel/${ch.id}">${esc(ch.name)}</a>`).join(', ')
          : 'ни один канал на нём не бежит'}</div>
      </div>
      <div class="pacts">
        ${iconBtn('chp-edit', 'edit', 'Править', p.name, `data-id="${p.id}"`)}
        ${iconBtn('bad chp-del', 'remove', 'Удалить', p.name,
                  `data-id="${p.id}" data-name="${esc(p.name)}"`)}
      </div></div>`).join('')
      : emptyBox({why: 'Пресетов каналов нет.',
          means: 'Пресет канала задаёт, чем канал озвучивает и рисует по умолчанию, '
               + 'чтобы не выбирать это каждому выпуску. Заводится кнопкой выше.'})}
    <div class="secbody"><div class="note muted">${esc(chp.note || '')}</div></div>
  </div>`);
  app.append(chpCard);
  // Обе карточки уже на месте — теперь фильтр может ими управлять.
  paint();
  chpCard.querySelector('#chp-new').onclick = () => channelPresetModal(null);
  chpCard.querySelectorAll('.chp-edit').forEach(b => b.onclick =
    () => channelPresetModal(Number(b.dataset.id)));
  chpCard.querySelectorAll('.chp-del').forEach(b => b.onclick = () =>
    confirmModal('Удалить пресет канала', `Удалить «${b.dataset.name}»?`, async () => {
      try{
        await api(`/ui/channel-presets/${b.dataset.id}`, {method: 'DELETE'});
        // Убираем строку на месте, а НЕ перерисовываем экран целиком. Полная
        // перерисовка заново тянет список пресетов производства, а он ходит по сети к
        // соседним сервисам с шестисекундным ожиданием на каждого — из-за этого
        // удаление и «происходило долго» (жалоба владельца 30.09.2026). Сервер на само
        // удаление тратит миллисекунды.
        const row = b.closest('[data-chp]');
        if (row) row.remove();
        // Список опустел — показываем объяснение, а не пустое место: «ничего нет» и
        // «всё удалили» человек читает одинаково, и второе без подписи выглядит сбоем.
        if (!chpCard.querySelector('[data-chp]')){
          const шапка = chpCard.querySelector('.sec');
          if (шапка) шапка.insertAdjacentHTML('afterend', emptyBox({
            why: 'Пресетов каналов нет.',
            means: 'Пресет канала задаёт расписание, машину и нишу сразу многим каналам.'}));
        }
        toast(`Пресет «${b.dataset.name}» удалён`, 'ok');
      }catch(e){ toast(e.message); }
    }));

}

function wirePresets(root){
  const ask = async (b, fn) => {
    b.disabled = true;
    try{ await fn(); await render(); }
    catch(e){
      b.disabled = false;
      const box = document.createElement('div');
      box.className = 'note bad';
      box.textContent = e.message;
      const body = b.closest('.pitem') && b.closest('.pitem').querySelector('.body');
      (body || b.parentElement).appendChild(box);
    }
  };
  root.querySelectorAll('button.pedit').forEach(b => b.onclick =
    () => { location.hash = '#/preset/' + encodeURIComponent(b.dataset.key); });
  // Пресеты соседей (обложки, рерайт, брифы) правятся окном, а не уходом в чужой
  // интерфейс: до 18.09.2026 их можно было только скопировать или удалить.
  root.querySelectorAll('button.pform').forEach(b => b.onclick =
    () => neighbourPresetModal(b.dataset.svc, b.dataset.name));
  root.querySelectorAll('button.pcopy').forEach(b => b.onclick = () => {
    askInline(b, {value: b.dataset.name + ' — копия', ok: 'Скопировать'}, to =>
      ask(b, () => post(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/copy`,
                        {from: b.dataset.name, to})));
  });
  root.querySelectorAll('button.pdel').forEach(b => b.onclick = () => {
    // В одном списке теперь бывают одноимённые строки (ссылка из производства и сам
    // пресет обложки), поэтому вопрос называет, ЧТО удаляется.
    confirmModal('Удалить пресет',
      `Удалить ${b.dataset.kind || 'пресет'} «${b.dataset.name}»?`, () =>
      ask(b, () => api(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/${
        encodeURIComponent(b.dataset.name)}`, {method: 'DELETE'})));
  });
}

// Окно шаблона озвучки Lumean. Поля описывает сервер (те же имена, что у провайдера),
// здесь только отрисовка. Создание возвращает id — показываем его и предлагаем
// скопировать: именно он вписывается в карту «язык → шаблон» пресета.
// Форма шаблона озвучки — одна на окно и на страницу: поля описывает сервер, здесь
// только отрисовка.
function lumeanFormHtml(d){
  const fieldHtml = f => {
    const fid = 'lt-' + f.key;
    if (f.kind === 'switch')
      return `<div class="fld"><label for="${fid}">${esc(f.label)}</label>
        <select id="${fid}" data-lt="${esc(f.key)}">
          <option value=""${String(f.value) === '' ? ' selected' : ''}>как у провайдера</option>
          <option value="1"${String(f.value) === '1' ? ' selected' : ''}>включено</option>
          <option value="0"${String(f.value) === '0' ? ' selected' : ''}>выключено</option>
        </select>${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'select')
      return `<div class="fld"><label for="${fid}">${esc(f.label)}</label>
        <select id="${fid}" data-lt="${esc(f.key)}">
          ${(f.options || []).map(o => `<option value="${esc(String(o.value))}"${
            String(o.value) === String(f.value) ? ' selected' : ''}>${esc(o.title)}</option>`)
            .join('')}</select>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'number')
      return `<div class="fld"><label for="${fid}">${esc(f.label)}</label>
        <input id="${fid}" data-lt="${esc(f.key)}" type="number" step="0.05"
          min="${f.min}" max="${f.max}" value="${esc(String(f.value ?? ''))}">
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    return `<div class="fld"${f.key === 'name' ? ' style="grid-column:1/-1"' : ''}>
      <label for="${fid}">${esc(f.label)}</label>
      <input id="${fid}" data-lt="${esc(f.key)}" value="${esc(String(f.value ?? ''))}">
      ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
  };
  const used = (d.used_by || []).length
    ? `<div class="note muted">На него ссылаются: ${d.used_by.map(esc).join(', ')}.
       Правка изменит их озвучку со следующего запуска.</div>`
    : '';
  return `<div class="fields" style="padding:0">${(d.fields || []).map(fieldHtml).join('')}</div>
     <div class="note muted">Шаблон живёт в аккаунте Lumean: заведённый здесь виден и
       на сайте Lumean, удаление удаляет его там же. Формат вывода задаём мы — студия
       собирает ролик из mp3.</div>${used}`;
}

function lumeanValues(box){
  const values = {};
  box.querySelectorAll('[data-lt]').forEach(el => { values[el.dataset.lt] = el.value; });
  return values;
}

// Окно шаблона осталось ровно в одном месте — в форме пресета, у карты голосов
// («Завести шаблон» и сразу подставить его id). Там уход на отдельную страницу стёр
// бы всё, что человек успел набрать в пресете. Со списка пресетов шаблон заводится и
// правится страницей `#/lumean/…` — как обычный пресет (владелец 22.09.2026).
async function lumeanTemplateModal(id, fields, opts){
  const creating = !id;
  let d = {fields: fields || [], used_by: []};
  if (!creating){
    try{ d = await api(`/ui/lumean/templates/${encodeURIComponent(id)}/form`); }
    catch(e){ toast(e.message); return; }
  }
  modal(creating ? 'Новый шаблон озвучки' : 'Шаблон озвучки Lumean', lumeanFormHtml(d),
    {ok: creating ? 'Завести' : 'Сохранить', onOk: async (box, close) => {
      const values = lumeanValues(box);
      if (creating){
        const out = await post('/ui/lumean/templates', {values});
        close();
        // id нужен человеку сразу: именно он идёт в карту голосов пресета.
        toast(`Шаблон заведён, id: ${out.id}`, 'ok');
        if (opts && opts.onCreated) opts.onCreated(out.id);
        // Копия id в буфер — удобство, а не часть дела, и ЖДАТЬ её нельзя: в браузере
        // без фокуса (или когда доступ к буферу не разрешён) этот вызов не отвечает
        // вовсе. Пока он стоял выше и под `await`, всё, что идёт следом, не выполнялось:
        // заведённый шаблон не попадал в карту голосов, хотя у провайдера уже создан.
        try{ navigator.clipboard.writeText(out.id).catch(() => {}); }catch(e){}
      }else{
        await post(`/ui/lumean/templates/${encodeURIComponent(id)}`, {values});
        close();
        toast('Шаблон обновлён у провайдера', 'ok');
      }
      // Перерисовка нужна списку пресетов (там карточка шаблонов), но вредна форме
      // пресета: она стёрла бы незаписанные правки. Зовущий решает сам.
      if (!opts || opts.reload !== false) await render();
    }});
}

// Страница шаблона озвучки Lumean (22.09.2026). Владелец: «когда хочешь создать пресет
// для Lumean — попап, а для обычного пресета нас на страницу перекидывает; давай и для
// Lumean сделаем отдельной страничкой, просто перенесём попап». Форма та же, что была
// в окне, — `lumeanFormHtml`; меняется только место.
async function viewLumeanTemplate(id){
  const creating = id === 'new';
  let d;
  if (creating){
    const lum = await api('/ui/lumean/templates');
    d = lum.ok ? {fields: lum.fields || [], used_by: []} : {why: lum.why || 'Lumean не ответил'};
  }else{
    d = await api(`/ui/lumean/templates/${encodeURIComponent(id)}/form`);
  }
  const nameField = (d.fields || []).find(f => f.key === 'name');
  const title = creating ? 'Новый шаблон озвучки Lumean'
                         : ((nameField && nameField.value) || id);
  app.innerHTML = '';
  const head = $(`<a class="back" href="#/presets">← ко всем пресетам</a>
    <h1>${esc(title)}</h1>
    <p class="sub">${creating ? 'Голос и настройки на стороне Lumean. Заведённый шаблон '
      + 'выбирается в пресете, в карте голосов.' : `Шаблон озвучки Lumean · id
      <span class="mono">${esc(id)}</span> ${iconBtn('lum-copy', 'link', 'Копировать id',
      title, `data-id="${esc(id)}"`)}`}</p>`);
  app.append(head);
  const copy = head.querySelector('.lum-copy');
  if (copy) copy.onclick = async () => {
    try{ await navigator.clipboard.writeText(id); toast('id скопирован', 'ok'); }
    catch(e){ toast('Скопировать не вышло — id виден в строке выше'); }
  };
  if (d.why){
    app.append($(`<div class="card"><div class="secbody">
      <div class="note bad">${esc(d.why)}</div>
      <div class="note muted">Шаблоны заводятся ключом Lumean из профиля: без него
        завести шаблон нечем.</div></div></div>`));
    return;
  }
  // Сторож набранного — как у формы пресета: уход по ссылке, вкладке или «назад»
  // спрашивает, прежде чем стереть незаписанное.
  let touched = false;
  const guardHash = location.hash;
  const panel = inlinePanel(app, 'Настройки шаблона', lumeanFormHtml(d), {
    ok: creating ? 'Завести' : 'Сохранить',
    onOk: async box => {
      const values = lumeanValues(box);
      if (creating){
        const out = await post('/ui/lumean/templates', {values});
        touched = false; LEAVE_GUARD = null;
        // id нужен человеку сразу: именно он идёт в карту голосов пресета. Страница
        // заведённого показывает его с кнопкой копирования.
        toast(`Шаблон заведён, id: ${out.id}`, 'ok');
        try{ navigator.clipboard.writeText(out.id).catch(() => {}); }catch(e){}
        location.hash = '#/lumean/' + encodeURIComponent(out.id);
      }else{
        await post(`/ui/lumean/templates/${encodeURIComponent(id)}`, {values});
        touched = false; LEAVE_GUARD = null;
        toast('Шаблон обновлён у провайдера', 'ok');
        await render();
      }
    }});
  panel.el.addEventListener('input', () => {
    touched = true;
    LEAVE_GUARD = {hash: guardHash, keep: h => h === guardHash,
                   dirty: () => touched && panel.el.isConnected,
                   what: creating ? 'Шаблон ещё не заведён — набранное нигде не записано.'
                                  : 'Правка шаблона не сохранена.'};
  });
}

// Окно пресета канала: те же настройки, что у канала, кроме языка. Пустое поле — «в
// пресете не задано», канал берёт своё значение. Привязка живая: правка меняет все
// каналы на этом пресете со следующего прохода очереди.
async function channelPresetModal(id){
  const creating = !id;
  let d = {name: '', note: '', fields: [], channels: [], days: [], any_day: '*'};
  if (!creating){
    try{ d = await api(`/ui/channel-presets/${id}`); }
    catch(e){ toast(e.message); return; }
  }else{
    // Поля для нового спрашиваем у сервера отдельным маршрутом. Раньше их брали у УЖЕ
    // существующего пресета — и когда ни одного нет (первый пресет в студии или все
    // удалили), брать было не у кого: окно выходило без единого поля, человек сохранял
    // одно название, и в списке появлялся пустой пресет. Жалоба владельца 30.09.2026.
    try{
      d = await api('/ui/channel-presets/new');
    }catch(e){ toast(e.message); return; }
  }
  // Без полей окно заводить нельзя: это та самая пустая форма, из-за которой пресет
  // получался пустым. Лучше честно отказать, чем принять название в никуда.
  if (creating && !(d.fields || []).length){
    toast('Не удалось получить поля пресета — попробуйте ещё раз');
    return;
  }

  const fieldHtml = f => {
    const id_ = 'cp-' + f.key;
    if (f.kind === 'days')
      return `<div class="fld" style="grid-column:1/-1"><label>${esc(f.label)}</label>
        <span class="langs" id="${id_}" style="max-height:none;border:0;padding:0">${
          DAY_ORDER.map(dk => `<label data-day="${dk}" class="${
            (f.value || []).includes(dk) ? 'on' : ''}"><input type="checkbox" ${
            (f.value || []).includes(dk) ? 'checked' : ''}>${DAY_TITLE[dk] || dk}</label>`).join('')
        }</span></div>`;
    if (f.kind === 'number')
      return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
        <input id="${id_}" data-cp="${esc(f.key)}" type="number" min="${f.min}" max="${f.max}"
          value="${esc(String(f.value ?? ''))}" placeholder="как у канала">
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'switch')
      return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
        <select id="${id_}" data-cp="${esc(f.key)}">
          <option value=""${f.value === '' ? ' selected' : ''}>как у канала</option>
          <option value="1"${String(f.value) === '1' ? ' selected' : ''}>включено</option>
          <option value="0"${String(f.value) === '0' ? ' selected' : ''}>выключено</option>
        </select></div>`;
    if (f.kind === 'select')
      return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
        <select id="${id_}" data-cp="${esc(f.key)}">
          <option value="">как у канала</option>
          ${(f.options || []).map(o => `<option value="${esc(String(o.value))}"${
            String(o.value) === String(f.value) ? ' selected' : ''}>${esc(o.title)}</option>`)
            .join('')}</select></div>`;
    return `<div class="fld"><label for="${id_}">${esc(f.label)}</label>
      <input id="${id_}" data-cp="${esc(f.key)}" value="${esc(String(f.value ?? ''))}"
        placeholder="как у канала">
      ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
  };

  const used = (d.channels || []).length
    ? `<div class="note muted">Сейчас на нём: ${d.channels.map(ch =>
        esc(ch.name)).join(', ')}. Правка изменит их поведение со следующего прохода
        очереди; уже поставленные задачи не пересчитываются.</div>`
    : '<div class="note muted">Пока на нём не бежит ни один канал.</div>';

  modal(creating ? 'Новый пресет канала' : `Пресет канала «${d.name}»`, `
    <div class="fields" style="padding:0">
      <div class="fld" style="grid-column:1/-1"><label for="cp-name">Название</label>
        <input id="cp-name" value="${esc(d.name || '')}" placeholder="например: немецкие каналы"></div>
      ${(d.fields || []).map(fieldHtml).join('')}
    </div>${used}`,
    {ok: creating ? 'Завести' : 'Сохранить', onOk: async (box, close) => {
      const name = box.querySelector('#cp-name').value.trim();
      if (!name) throw new Error('Название пустое.');
      const values = {};
      box.querySelectorAll('[data-cp]').forEach(el => { values[el.dataset.cp] = el.value; });
      const daysBox = box.querySelector('#cp-schedule_days');
      if (daysBox) values.schedule_days = [...daysBox.querySelectorAll('label')]
        .filter(l => l.querySelector('input').checked).map(l => l.dataset.day);
      if (creating) await post('/ui/channel-presets', {name, values});
      else await post(`/ui/channel-presets/${id}`, {name, values});
      close();
      await render();
    }});
}

// Окно правки пресета соседа. Поля описывает сервер (NEIGHBOUR_PRESET_FIELDS) — здесь
// только отрисовка: второй список полей в браузере разошёлся бы с первым.
// Хранилище пресета части → как часть называется на экране.
// Пометка у пресета части «Сценарий»: их там два рода, и по названию не отличить.
const PRESET_KIND_TAG = {rewrite: 'по ссылке', rewrite_gen: 'с нуля по теме'};
// Как назвать пресет в вопросе об удалении.
const PRESET_KIND_WORD = {rewrite: 'пресет текста', rewrite_gen: 'бриф', cover: 'пресет обложки'};
const NEIGHBOUR_PART = {rewrite: 'Сценарий — рерайт по ссылке',
                        rewrite_gen: 'Сценарий — бриф для текста с нуля',
                        cover: 'Обложка'};

async function neighbourPresetModal(service, name, opts){
  const creating = !name;
  let d;
  try{
    d = await api(creating
      ? `/ui/presets/${encodeURIComponent(service)}/new/form`
      : `/ui/presets/${encodeURIComponent(service)}/${encodeURIComponent(name)}/form`);
  }catch(e){ toast(e.message); return; }

  const fieldHtml = f => {
    const id = 'np-' + f.key;
    if (f.kind === 'text')
      return `<div class="fld" style="grid-column:1/-1"><label for="${id}">${esc(f.label)}</label>
        <textarea id="${id}" data-key="${esc(f.key)}" rows="8"
          style="width:100%">${esc(f.value || '')}</textarea>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'number')
      return `<div class="fld"><label for="${id}">${esc(f.label)}</label>
        <input id="${id}" data-key="${esc(f.key)}" type="number" min="${f.min}"
          max="${f.max}" value="${esc(String(f.value ?? ''))}">
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'switch')
      return `<div class="fld"><label for="${id}">${esc(f.label)}</label>
        <select id="${id}" data-key="${esc(f.key)}">
          <option value="1"${f.value ? ' selected' : ''}>включено</option>
          <option value="0"${f.value ? '' : ' selected'}>выключено</option></select>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    if (f.kind === 'select'){
      const known = (f.options || []).some(o => String(o.value) === String(f.value));
      return `<div class="fld"><label for="${id}">${esc(f.label)}</label>
        <select id="${id}" data-key="${esc(f.key)}">
          ${known ? '' : `<option value="${esc(String(f.value || ''))}" selected
            >${esc(String(f.value || '—'))} — нет в списке, но сохранено</option>`}
          ${(f.options || []).map(o => `<option value="${esc(String(o.value))}"${
            String(o.value) === String(f.value) ? ' selected' : ''}>${esc(o.title)}</option>`
          ).join('')}</select>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    }
    if (f.kind === 'file')
      return `<div class="fld" style="grid-column:1/-1"><label>${esc(f.label)}</label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="muted np-refname">${f.value
            ? esc(f.filename || f.value) : 'не прикреплена'}</span>
          <input type="file" id="np-ref" accept="image/*">
        </div>
        ${f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : ''}</div>`;
    return '';
  };

  const nameHtml = creating
    // По имени пресет части выбирают в целых пресетах и в каналах — об этом и
    // подсказка. Вторая фраза — когда имя подставлено из целого пресета.
    ? `<div class="fld" style="grid-column:1/-1"><div class="lh"
         style="display:flex;margin-bottom:7px"><label for="np-name">Название</label>${
         hintDot((service === 'rewrite_gen'
             ? 'По названию бриф выбирают на вкладке «Сценарий» в режиме «С нуля по теме».'
             : 'По названию этот пресет выбирают в целых пресетах и в каналах.')
           + (opts && opts.suggestName
              ? ' Можно оставить такое же, как у пресета, из которого вы пришли.' : ''))}</div>
         <input id="np-name" placeholder="как называть пресет"
           value="${esc((opts && (opts.suggestName || opts.prefillName)) || '')}"></div>`
    : '';
  const panelTitle = opts && opts.host
    ? (NEIGHBOUR_PART[service] || 'Настройки') : (creating ? 'Новый пресет' : `Пресет «${name}»`);
  const m = (opts && opts.host ? inlinePanel.bind(null, opts.host) : modal)(panelTitle,
    `<div class="fields" style="padding:0">${nameHtml}${d.fields.map(fieldHtml).join('')}</div>`,
    {ok: creating ? 'Завести' : 'Сохранить', onOk: async (box, close) => {
      const values = {};
      box.querySelectorAll('[data-key]').forEach(el => {
        const f = d.fields.find(x => x.key === el.dataset.key) || {};
        values[el.dataset.key] = f.kind === 'number' ? el.value.trim() : el.value;
      });
      const rows = box.querySelector('.np-langrows');
      if (rows){
        values.languages = [...rows.querySelectorAll('.np-lang')].map(r => ({
          code: r.querySelector('.np-code').value.trim(),
          host: r.querySelector('.np-host').value.trim(),
          channel: r.querySelector('.np-ch').value.trim(),
        })).filter(x => x.code);
      }
      if (creating){
        const nm = box.querySelector('#np-name').value.trim();
        if (!nm) throw new Error('Название пустое.');
        await post(`/ui/presets/${encodeURIComponent(service)}/new`, {name: nm, values});
        // Образец стиля уходит тем же нажатием, сразу за заведением. Cover Studio
        // принимает файл только по имени УЖЕ существующего пресета — из-за этого
        // поле при заведении было заперто, и чтобы приложить картинку, окно надо
        // было открывать второй раз. Неудача с файлом не отменяет заведённый пресет:
        // он уже есть у соседа, и «откатить» его тут значило бы удалить чужое.
        const refIn = box.querySelector('#np-ref');
        const picked = refIn && refIn.files && refIn.files[0];
        if (picked){
          try{ await uploadPresetReference(service, nm, picked); }
          catch(e){ toast('Пресет заведён, образец стиля не ушёл: ' + e.message); }
        }
      }else{
        await post(`/ui/presets/${encodeURIComponent(service)}/${
          encodeURIComponent(name)}/form`, {values});
      }
      close();
      // Перерисовка нужна списку пресетов (там карточки соседей), но вредна ФОРМЕ
      // пресета: она стёрла бы незаписанные правки. Зовущий решает сам, а имя
      // заведённого пресета отдаём ему — чтобы подставить его в поле на месте.
      if (opts && opts.onSaved) opts.onSaved(creating ? box.querySelector('#np-name').value.trim() : name);
      if (!opts || opts.reload !== false) await render();
    }});

  // Языковые строки (у рерайта): язык + ведущий + канал.
  const lf = d.fields.find(f => f.kind === 'langrows');
  if (lf){
    const host = $(`<div class="fld" style="grid-column:1/-1">
      <label>${esc(lf.label)}</label><div class="np-langrows"></div>
      <button type="button" class="ghost small np-add">+ строка</button>
      ${lf.hint ? `<div class="note muted">${esc(lf.hint)}</div>` : ''}</div>`)
      .firstElementChild;
    m.body.querySelector('.fields').append(host);
    const rows = host.querySelector('.np-langrows');
    const addRow = v => {
      const r = $(`<div class="np-lang" style="display:flex;gap:8px;margin-bottom:6px">
        <input class="np-code" placeholder="язык, напр. pl" style="width:130px"
          value="${esc((v || {}).code || '')}">
        <input class="np-host" placeholder="имя ведущего" style="flex:1;min-width:0"
          value="${esc((v || {}).host || '')}">
        <input class="np-ch" placeholder="название канала" style="flex:1;min-width:0"
          value="${esc((v || {}).channel || '')}">
        <button type="button" class="ghost small np-del" title="убрать строку">×</button>
      </div>`).firstElementChild;
      r.querySelector('.np-del').onclick = () => r.remove();
      rows.append(r);
    };
    (lf.value || []).forEach(addRow);
    host.querySelector('.np-add').onclick = () => addRow(null);
  }

  // У заведённого пресета картинка-образец уходит сразу по выбору файла: править —
  // значит менять то, что уже есть. У заводимого файл ждёт нажатия «Завести» (см.
  // `onOk` выше): раньше сосед её принять не мог, и поле стояло запертым.
  const ref = m.body.querySelector('#np-ref');
  if (ref && !creating) ref.onchange = async () => {
    const file = ref.files && ref.files[0];
    if (!file) return;
    ref.disabled = true;
    try{
      const out = await uploadPresetReference(service, name, file);
      m.body.querySelector('.np-refname').textContent = out.filename || out.file_id;
      toast('Образец стиля прикреплён', 'ok');
    }catch(e){ toast(e.message); }
    finally{ ref.disabled = false; ref.value = ''; }
  };
}

// Картинку-образец хранит Cover Studio, а не форма: пульт её только передаёт. Вынесено
// из окна пресета соседа, потому что зовётся из двух мест — при правке (сразу по
// выбору файла) и при заведении (следом за созданием пресета, когда имя уже занято им).
async function uploadPresetReference(service, presetName, file){
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch(API + `/ui/presets/${encodeURIComponent(service)}/${
    encodeURIComponent(presetName)}/reference`, {method: 'POST', body: fd});
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(out.detail || ('HTTP ' + r.status));
  return out;
}

/* Вход у человека один на всю платформу: кабинет, пульт, тексты и обложки. Поэтому
   и управление людьми одно — заводить их в трёх местах больше не нужно. */
async function accountsCard(){
  let d;
  try{ d = await api('/ui/accounts'); }
  catch(e){ return null; }        // не администратор — раздела просто нет

  const card = $(`<div class="card" style="margin-top:16px">
    <div class="sec">Люди ${hintDot((d.note ? d.note + '. ' : '')
      + 'Вход у человека один на всю студию: тексты и обложки узнают его по нему же.')}</div>
    <table><thead><tr>
      <th>Логин</th><th>Роль</th><th>Тенант</th><th>Квота</th><th>Состояние</th><th></th>
    </tr></thead><tbody>${d.users.map(u => `<tr>
      <td><div style="font-weight:600">${esc(u.name)}${
        u.id === d.me ? ' <span class="muted">— это вы</span>' : ''}</div>
        <div class="muted mono" style="font-size:11px">#${u.id}</div></td>
      <td><select class="urole" data-id="${u.id}">${d.roles.map(r =>
        `<option value="${esc(r.key)}" ${r.key === u.role ? 'selected' : ''}
          >${esc(r.title)}</option>`).join('')}</select></td>
      <td class="mono">${esc(u.tenant_id)}</td>
      <td><input class="uquota" data-id="${u.id}" value="${u.quota ?? ''}"
            placeholder="без лимита" style="width:110px"></td>
      <td><span class="pill ${u.disabled ? 's-error' : 's-done'}">${
        u.disabled ? 'заблокирован' : 'работает'}</span>
        ${u.has_password ? '' : '<div class="note bad">пароль не задан</div>'}</td>
      <td style="white-space:nowrap">
        <button class="ghost upw" data-id="${u.id}" data-name="${esc(u.name)}"
          >Пароль</button>
        ${u.id === d.me ? '' : `<button class="ghost ublock" data-id="${u.id}"
          data-name="${esc(u.name)}" data-to="${u.disabled ? '0' : '1'}"
          >${u.disabled ? 'Вернуть' : 'Заблокировать'}</button>
        ${iconBtn('bad udel', 'remove', 'Удалить учётную запись', u.name,
                  `data-id="${u.id}" data-name="${esc(u.name)}"`)}`}
      </td>
    </tr>`).join('')}</tbody></table>

    <div class="secbody" style="padding-top:0">
      <button class="ghost" id="n-go">Завести человека</button>
      <div id="uerr"></div>
    </div>
  </div>`);

  const err = card.querySelector('#uerr');
  const act = async (fn) => {
    err.innerHTML = '';
    try{ await fn(); await render(); }
    catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };

  // Форма нового человека — в окне, как форма ключа (18.09.2026). Теперь оба раздела
  // профиля устроены одинаково: список, одна кнопка, окно с формой — это и есть
  // «более нативно» из жалобы владельца 20.09.2026. Заодно экран не растёт в простыню:
  // постоянно раскрытой формы на нём больше нет.
  card.querySelector('#n-go').onclick = () => modal('Завести человека', `
    <div class="fldrow"><label>Логин</label>
      <input id="n-login" style="width:200px" autocomplete="off"></div>
    <div class="fldrow"><label>Пароль</label>
      <input id="n-pw" type="password" style="width:200px" autocomplete="new-password"></div>
    <div class="fldrow"><label>Роль и квота</label>
      <select id="n-role">${d.roles.map(r =>
        `<option value="${esc(r.key)}">${esc(r.title)}</option>`).join('')}</select>
      <input id="n-quota" placeholder="без лимита" style="width:120px"></div>`,
    // Отказ сервера (занятый логин, слабый пароль) показывает само окно: `modal` ловит
    // исключение из onOk и пишет его в подвал, а окно остаётся открытым. Введённое не
    // пропадает, и поправить можно там же, где ошиблись.
    {ok: 'Завести', onOk: async (box, close) => {
      await post('/ui/accounts', {
        login: box.querySelector('#n-login').value,
        password: box.querySelector('#n-pw').value,
        role: box.querySelector('#n-role').value,
        quota: box.querySelector('#n-quota').value});
      close();
      await render();
    }});

  card.querySelectorAll('button.ublock').forEach(b => b.onclick = () => {
    const off = b.dataset.to === '1';
    confirmInline(b, off
      ? `Заблокировать «${b.dataset.name}»? Вкладки закроются сразу.`
      : `Вернуть доступ «${b.dataset.name}»?`,
      () => act(() => post(`/ui/accounts/${b.dataset.id}`, {disabled: off})));
  });

  card.querySelectorAll('button.upw').forEach(b => b.onclick = () => {
    // Пароль вводится в поле на странице, а не в браузерном окне: попап не даёт
    // ни увидеть, чей это пароль, ни исправить опечатку до отправки.
    askInline(b, {ok: 'Задать', placeholder: `новый пароль для «${b.dataset.name}»`},
      pw => act(() => post(`/ui/accounts/${b.dataset.id}`, {password: pw})));
  });

  card.querySelectorAll('select.urole').forEach(sel => sel.onchange = () =>
    act(() => post(`/ui/accounts/${sel.dataset.id}`, {role: sel.value})));

  // Удаление учётной записи — решение владельца 24.09.2026. Спрашиваем окном и
  // говорим, чем это отличается от блокировки: за человеком может числиться работа,
  // и тогда сервер откажет — это не поломка, а защита.
  card.querySelectorAll('button.udel').forEach(b => b.onclick = () =>
    confirmModal('Удалить учётную запись',
      `Удалить «${b.dataset.name}» насовсем? Войти этим логином станет нельзя. `
      + 'Если за человеком числятся каналы или проекты, удаление не пройдёт — '
      + 'для этого есть блокировка.',
      () => act(() => api(`/ui/accounts/${b.dataset.id}`, {method: 'DELETE'}))));

  card.querySelectorAll('input.uquota').forEach(inp => inp.onchange = () =>
    act(() => post(`/ui/accounts/${inp.dataset.id}`, {quota: inp.value})));

  return card;
}

/* ─────────────────────────── админ: тревоги и диск ─────────────────────────── */

const FATE_TITLE = {keep:'артефакт выпуска — не удаляется', strip:'промежуточное'};
const ACT_TITLE  = {keep:'оставить', strip:'очистить', drop:'удалить целиком'};
const ACT_CLS    = {keep:'s-idle', strip:'s-queued', drop:'s-error'};

const PUB_TITLE = {public:'вышел', unlisted:'только по ссылке',
                   not_public:'ключ не видит', unknown:'ответа нет'};
const PUB_CLS   = {public:'s-done', unlisted:'s-error',
                   not_public:'s-queued', unknown:'s-idle'};

/* ───────────── выходы субтитров: кто жив, кто отдыхает, кто мёртв (A1) ───────────── */

/* Мёртвый туннель (`127.0.0.1:1080`, который никто не поднял) раньше выглядел с
   экрана как «всё встало»: выпуски стоят, задачи не двигаются, причину ищут в
   очереди, в ключах, у соседей — где угодно, кроме связи. Сторож в кабинете знает
   ответ; эта плитка его показывает и ничего не решает сама. */
const EXIT_CLS = {'работает':'s-done', 'мёртв':'s-error', 'отдыхает':'s-queued',
                  'не проверялся':'s-idle', 'сведения устарели':'s-idle'};
const EXIT_KIND_CLS = {ok:'s-done', warn:'s-queued', err:'s-error', none:'s-idle'};
const EXIT_KIND_DOT = {ok:'✓', warn:'!', err:'!', none:'?'};

function subsExitsCard(s){
  if (s.read_error)
    return $(`<div class="card"><div class="sec">Выходы субтитров</div>
      <div class="secbody"><div class="note bad">Состояние выходов прочитать не удалось:
        ${esc(s.read_error)}. Денег это не стоило — плитка только читает. Обновите
        страницу; если не помогло, сервер не отвечает.</div></div></div>`);

  const card = $(`<div class="card">
    <div class="sec">Выходы субтитров ${hintDot((s.rest_vs_dead || '')
      + ' Мёртвый выход убирать из настроек не нужно: он вернётся в работу сам, как '
      + 'только снова ответит.')}</div>
    <div class="stage">
      <div class="dot ${EXIT_KIND_CLS[s.kind] || 's-idle'}">${EXIT_KIND_DOT[s.kind] || '?'}</div>
      <div class="body">
        <div class="name">${esc(s.text || '')}</div>
        <div class="facts">${[
            s.checked_ago != null ? 'последняя проверка ' + ago(s.checked_ago) + ' назад'
                                  : 'проверки ещё не было',
            s.period ? 'проверяем раз в ' + dur(s.period) : 'сторож выключен настройкой',
            s.running ? 'обход идёт прямо сейчас' : '',
          ].filter(Boolean).map(esc).join(' · ')}</div>
        ${s.trusted === false ? `<div class="note">Не отвечает ни один выход — ротация
          этим сведениям не верит и работает по полному списку, выпуски идут. Так
          выглядит не конец сети, а упавший адрес проверки или отсутствие PySocks на
          сервере.</div>` : ''}
        <div class="note muted">${esc(s.how || '')} Адрес проверки:
          <span class="mono">${esc(s.probe_url || '')}</span></div>
      </div>
    </div>
    ${(s.exits || []).length ? `<table><thead><tr>
        <th>Выход</th><th>Состояние</th><th>Отвечал</th><th>Виден снаружи</th>
      </tr></thead><tbody>${s.exits.map(e => `<tr>
        <td class="mono">${esc(e.name)}</td>
        <td><span class="pill ${EXIT_CLS[e.state] || 's-idle'}">${esc(e.state)}</span>
            ${e.resting && e.rest_min ? `<div class="muted" style="margin-top:4px"
              >ещё ${e.rest_min} мин</div>` : ''}</td>
        <td class="muted">${e.ok_ago != null ? esc(ago(e.ok_ago) + ' назад')
            : 'ни разу'}${e.ms ? esc(' · ' + Math.round(e.ms) + ' мс') : ''}
            ${e.error ? `<div class="note bad">${esc(e.error)}</div>` : ''}</td>
        <td class="mono muted">${esc(e.ip || '—')}${e.ip_shared
            ? '<div class="note muted">адрес общий</div>' : ''}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Выходы не заданы: субтитры качаются напрямую.</div>'}
    <div class="secbody">
      ${Object.keys(s.shared_ip || {}).length ? `<div class="note">Одним адресом видны
        несколько выходов: ${Object.entries(s.shared_ip).map(([ip, names]) =>
          esc(ip + ' — ' + names.join(', '))).join('; ')}.
        ${esc(s.shared_ip_note || '')}</div>` : ''}
      <div style="margin-top:12px"><button class="ghost small" id="se-probe"
        >Проверить сейчас</button></div>
    </div></div>`);

  card.querySelector('#se-probe').onclick = async () => {
    const b = card.querySelector('#se-probe');
    b.disabled = true;
    try{
      const out = await post('/ui/subs-exits/probe');
      toast(out.text, out.started ? 'ok' : 'info');
    }catch(e){
      // Три вопроса: что упало, потрачены ли деньги, что нажать.
      toast('Разбудить проверку не удалось: ' + e.message
            + '. Денег это не стоило — проверка не ходит в YouTube. '
            + 'Обновите страницу и попробуйте ещё раз.');
    }finally{ b.disabled = false; }
  };
  return card;
}

async function viewAdmin(){
  // Плитка выходов не имеет права уронить весь экран: она про связь, а связь как раз
  // и ломается. Неудача чтения показывается отдельной строкой, остальное открывается.
  const [a, d, pb, se] = await Promise.all([api('/ui/alerts'), api('/ui/disk'),
                                            api('/ui/public'),
