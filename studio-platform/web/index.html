/* Экран одной страницы: то, что заказчик просит присылать каждый день, и то, что
   оператор до сих пор собирал руками по сотне строк. Читается за минуту, копируется
   целиком одной кнопкой.

   Готовый текст отчёта приходит с сервера и НЕ собирается здесь заново. Причина та
   же, по которой сводку вообще считает машина: два места, собирающие одну и ту же
   строку, расходятся молча, и расхождение обнаружится тогда, когда заказчик сверит
   отчёт из телеграма с отчётом из пульта. Числа рядом — это тот же текст, разложенный
   по карточкам, чтобы по нему можно было кликнуть. */

/* ── сводка встречает при входе, и её можно убрать (владелец 30.09.2026) ──

   «Да, давай показывать сводку сразу плюс возможность её скрыть».

   Смена оператора начинается с двух вопросов: что сегодня и что застряло. Ответ на них
   обязан встречать сам, а не ждать, пока за ним зайдут отдельной вкладкой. Поэтому
   вход в студию без адреса ведёт на сводку.

   Убрать её со входа — дело КАЖДОГО ЧЕЛОВЕКА, а не общая настройка: одному она нужна
   каждое утро, другому мешает. Поэтому решение живёт в браузере рядом с отбором
   каналов (SIEVE_KEY), а не на сервере, и у каждого входа свой ключ: за одним
   браузером сидят по очереди двое, и чужое «скрыть» не должно прятать сводку у
   напарника.

   Адресов это не меняет: ни один `#/…` не перехватывается, поэтому закладка на канал
   или на выпуск открывает ровно то, что открывала. */
const DIGEST_HOME_KEY = 'vs.digest.home';

function digestHomeKey(){
  // `id` стабилен, имя — на случай ответа без него; 'me' — если про человека ещё
  // ничего не известно (экран входа), и тогда это значение всё равно не спросят.
  return DIGEST_HOME_KEY + '.' + ((ME && (ME.id || ME.name)) || 'me');
}

function digestGreets(){
  // Запрещённое хранилище (приватное окно) — не повод падать и не повод менять
  // поведение: по умолчанию сводка встречает, как у всех.
  try { return localStorage.getItem(digestHomeKey()) !== 'off'; }
  catch (e){ return true; }
}

function digestGreetsSet(on){
  try {
    if (on) localStorage.removeItem(digestHomeKey());
    else localStorage.setItem(digestHomeKey(), 'off');
  } catch (e){ /* приват */ }
}

// Куда попадает человек, открывший студию без адреса в строке.
function homeHash(){ return digestGreets() ? '#/digest' : '#/channels'; }

// Кнопка у заголовка сводки: прячут её, глядя на неё, а не в настройках. Обратная
// дорога — вкладка «Сводка» в шапке: она на месте всегда, и именно про неё говорит
// сообщение после скрытия. Экран, исчезнувший молча, человек не найдёт.
function digestGreetButton(){
  const greets = digestGreets();
  const box = $(`<button class="ghost small" id="digest-greet">${
    greets ? 'Скрыть' : 'Показывать при входе'}</button>
    ${hintDot(greets
      ? 'Сводка перестанет встречать при входе — студия будет открываться на каналах. '
        + 'Вкладка «Сводка» останется на месте. Это решение только ваше: у остальных '
        + 'сводка не спрячется.'
      : 'Сейчас студия открывается на каналах. Вернуть сводку на вход — этой кнопкой.')}`);
  box.querySelector('#digest-greet').onclick = async () => {
    const on = !greets;
    digestGreetsSet(on);
    if (on){
      toast('сводка снова встречает при входе', 'ok');
      await render();
      return;
    }
    toast('сводка больше не встречает при входе — она осталась вкладкой «Сводка» '
          + 'в шапке', 'ok');
    location.hash = '#/channels';
  };
  return box;
}

/* ── период сводки (04.10.2026, владелец: «не совсем понятно, за какой период — давай
   приятный календарь для выбора в нашем стиле, а так будет показывать за текущий
   месяц») ──
   Выбор живёт в sessionStorage: вернулся на сводку в той же вкладке — тот же период;
   новая вкладка — снова текущий месяц. Хранилище может быть недоступно (приватный
   режим) — тогда просто текущий месяц. */
const DIGEST_PERIOD_KEY = 'digestPeriod';
function digestPeriod(){
  try {
    const v = JSON.parse(sessionStorage.getItem(DIGEST_PERIOD_KEY) || 'null');
    return v && /^\d{4}-\d{2}-\d{2}$/.test(v.from) && /^\d{4}-\d{2}-\d{2}$/.test(v.to) ? v : null;
  } catch (_e){ return null; }
}
function setDigestPeriod(v){
  try { v ? sessionStorage.setItem(DIGEST_PERIOD_KEY, JSON.stringify(v))
          : sessionStorage.removeItem(DIGEST_PERIOD_KEY); } catch (_e){}
}

const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля',
                    'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль',
                    'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${
  String(d.getDate()).padStart(2, '0')}`;
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

// «1–31 октября 2026», «4 октября 2026», «28 сентября – 4 октября 2026».
function periodLabel(p){
  if (!p) return 'текущий месяц';
  const a = fromIso(p.from), b = fromIso(p.to);
  const y = d => d.getFullYear(), m = d => d.getMonth();
  if (p.from === p.to) return `${a.getDate()} ${MONTHS_GEN[m(a)]} ${y(a)}`;
  if (y(a) === y(b) && m(a) === m(b))
    return `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[m(a)]} ${y(a)}`;
  if (y(a) === y(b))
    return `${a.getDate()} ${MONTHS_GEN[m(a)]} – ${b.getDate()} ${MONTHS_GEN[m(b)]} ${y(b)}`;
  return `${a.getDate()} ${MONTHS_GEN[m(a)]} ${y(a)} – ${b.getDate()} ${MONTHS_GEN[m(b)]} ${y(b)}`;
}

function periodPresets(){
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const shift = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const first = new Date(t.getFullYear(), t.getMonth(), 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0);
  const pFirst = new Date(t.getFullYear(), t.getMonth() - 1, 1);
  const pLast = new Date(t.getFullYear(), t.getMonth(), 0);
  return [
    ['Сегодня', t, t], ['Вчера', shift(t, -1), shift(t, -1)],
    ['7 дней', shift(t, -6), t], ['30 дней', shift(t, -29), t],
    ['Этот месяц', first, last], ['Прошлый месяц', pFirst, pLast],
  ].map(([name, a, b]) => ({name, from: isoDay(a), to: isoDay(b)}));
}

// Кнопка с периодом и всплывающий календарь: слева готовые периоды, справа месяц, где
// первый щелчок — начало, второй — конец. Esc и щелчок мимо — закрыть без изменений.
function periodPicker(cur, onPick){
  // `$` отдаёт обёртку-div; берём сам элемент — иначе классы, обработчики и координаты
  // всплывающего окна достались бы обёртке.
  const btn = $(`<button class="ghost pp-btn" type="button" aria-haspopup="dialog">
    <span class="pp-ico" aria-hidden="true">▦</span> ${esc(periodLabel(cur))}
    <span class="pp-car" aria-hidden="true">▾</span></button>`).firstElementChild;
  let pop = null;
  const close = () => {
    if (!pop) return;
    pop.remove(); pop = null;
    document.removeEventListener('mousedown', outside, true);
    document.removeEventListener('keydown', onKey, true);
  };
  const outside = ev => { if (pop && !pop.contains(ev.target) && !btn.contains(ev.target)) close(); };
  const onKey = ev => { if (ev.key === 'Escape'){ ev.preventDefault(); close(); btn.focus(); } };
  btn.onclick = () => {
    if (pop){ close(); return; }
    let a = cur ? cur.from : null, b = cur ? cur.to : null, hover = null;
    let view = fromIso(a || isoDay(new Date())); view.setDate(1);
    const todayIso = isoDay(new Date());
    pop = $(`<div class="pp-pop card" role="dialog" aria-label="Период сводки">
      <div class="pp-presets"></div>
      <div class="pp-cal">
        <div class="pp-nav"><button type="button" class="iconbtn pp-prev" aria-label="Предыдущий месяц">‹</button>
          <b class="pp-month"></b>
          <button type="button" class="iconbtn pp-next" aria-label="Следующий месяц">›</button></div>
        <div class="pp-grid"></div>
        <div class="pp-foot"><span class="pp-sel muted"></span>
          <span><button type="button" class="ghost pp-cancel">Отмена</button>
          <button type="button" class="pp-ok">Показать</button></span></div>
      </div></div>`).firstElementChild;
    const presets = pop.querySelector('.pp-presets');
    periodPresets().forEach(pr => {
      const x = $(`<button type="button" class="pp-preset">${esc(pr.name)}</button>`)
        .firstElementChild;
      if (cur && cur.from === pr.from && cur.to === pr.to) x.classList.add('on');
      x.onclick = () => { close(); onPick({from: pr.from, to: pr.to}); };
      presets.append(x);
    });
    const grid = pop.querySelector('.pp-grid');
    const draw = () => {
      pop.querySelector('.pp-month').textContent = `${MONTHS_NOM[view.getMonth()]} ${view.getFullYear()}`;
      const lo = a && (b || hover) ? [a, b || hover].sort()[0] : a;
      const hi = a && (b || hover) ? [a, b || hover].sort()[1] : a;
      const start = new Date(view); start.setDate(1 - ((view.getDay() + 6) % 7));
      grid.innerHTML = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс']
        .map(w => `<span class="pp-wd">${w}</span>`).join('');
      for (let i = 0; i < 42; i++){
        const d = new Date(start); d.setDate(start.getDate() + i);
        const iso = isoDay(d), out = d.getMonth() !== view.getMonth();
        const cls = ['pp-day', out ? 'out' : '', iso === todayIso ? 'now' : '',
          lo && hi && iso >= lo && iso <= hi ? 'in' : '',
          iso === lo ? 'lo' : '', iso === hi ? 'hi' : ''].filter(Boolean).join(' ');
        grid.insertAdjacentHTML('beforeend',
          `<button type="button" class="${cls}" data-d="${iso}">${d.getDate()}</button>`);
      }
      pop.querySelector('.pp-sel').textContent = a
        ? periodLabel({from: lo, to: hi}) + (b ? '' : ' — выберите конец') : 'выберите начало';
      pop.querySelector('.pp-ok').disabled = !(a && b);
    };
    grid.onclick = ev => {
      const day = ev.target.closest('[data-d]'); if (!day) return;
      if (!a || b){ a = day.dataset.d; b = null; } else { b = day.dataset.d; }
      draw();
    };
    grid.onmouseover = ev => {
      const day = ev.target.closest('[data-d]');
      if (a && !b && day && day.dataset.d !== hover){ hover = day.dataset.d; draw(); }
    };
    pop.querySelector('.pp-prev').onclick = () => { view.setMonth(view.getMonth() - 1); draw(); };
    pop.querySelector('.pp-next').onclick = () => { view.setMonth(view.getMonth() + 1); draw(); };
    pop.querySelector('.pp-cancel').onclick = () => { close(); btn.focus(); };
    pop.querySelector('.pp-ok').onclick = () => {
      if (!(a && b)) return;
      const [lo, hi] = [a, b].sort();
      close(); onPick({from: lo, to: hi});
    };
    draw();
    document.body.append(pop);
    const r = btn.getBoundingClientRect();
    const w = pop.offsetWidth;
    pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
    pop.style.left = Math.max(8, Math.min(r.right + window.scrollX - w,
                                          window.scrollX + innerWidth - w - 8)) + 'px';
    document.addEventListener('mousedown', outside, true);
    document.addEventListener('keydown', onKey, true);
    (pop.querySelector('.pp-day.lo') || pop.querySelector('.pp-day.now')
      || pop.querySelector('.pp-day')).focus();
  };
  return btn;
}

async function viewDigest(){
  let d;
  const chosen = digestPeriod();
  try { d = await api('/ui/digest' + (chosen
    ? `?from=${encodeURIComponent(chosen.from)}&to=${encodeURIComponent(chosen.to)}` : '')); }
  catch (e){
    if (e instanceof NeedLogin) throw e;      // «войдите снова» разбирает роутер
    // Сводка встречает при входе, и её поломка не имеет права запирать студию на
    // пустом экране. Поэтому здесь: причина словами, честное «числа неизвестны»
    // вместо нулей, дорога дальше и та же кнопка, чтобы убрать сводку со входа.
    app.innerHTML = '';
    const head = $(`<div class="head"><div><h1>Сводка</h1></div>
      <div class="head-acts"></div></div>`);
    head.querySelector('.head-acts').append(digestGreetButton());
    app.append(head);
    app.append($(`<div class="err">Сводку посчитать не удалось: ${esc(e.message)}</div>
      <p class="muted">Числа за сегодня неизвестны — это не значит, что их ноль и что
        всё хорошо. Денег этот экран не тратит: он только читает базу, поэтому обновить
        страницу безопасно. Остальная студия работает —
        <a href="#/channels">перейти к каналам</a>.</p>`));
    return;
  }
  const g = d.digest, t = g.today, p = g.production;
  const per = g.period || null;
  app.innerHTML = '';
  const head = $(`<div class="head">
    <div><h1>Сводка ${hintDot(
      'Числа — за выбранный период, дни календарные, по поясу ' + g.tz + '. Блокеры и '
      + 'проблемы — на сейчас: выпуск в разборе стоит, пока его не разберут. Всё '
      + 'посчитано из базы: план, выпуски, заливки, подтверждённые выходы, запас каналов '
      + 'и тревоги.')}</h1>
    <p class="sub">За ${esc(periodLabel(per))} · часовой пояс ${esc(g.tz)}</p></div>
    <div class="head-acts"></div></div>`);
  head.querySelector('.head-acts').append(periodPicker(per, v => {
    setDigestPeriod(v); viewDigest().catch(e => toast(e.message));
  }));
  head.querySelector('.head-acts').append(digestGreetButton());
  app.append(head);
  // Скрытую сводку человек открыл вкладкой — и должен видеть, почему она больше не
  // встречает при входе и чем это вернуть. Иначе он решит, что она сломалась.
  if (!digestGreets())
    app.append($(`<div class="note muted" id="digest-hidden-note">Сводка не встречает
      при входе: студия открывается на каналах. Вернуть её на вход — кнопкой
      «Показывать при входе» выше.</div>`));

  /* ── сегодня ── */
  // «Подтверждено» — самое дорогое число экрана, поэтому ему отдельная плитка и
  // отдельные слова. Ноль тут пишется только тогда, когда про каждый выход есть
  // ответ; иначе стоит «не знаем» и причина — см. `server/pub_digest.py`.
  const known = t.expected - t.unknown;
  // Подтверждённое человеком — выполнение плана (владелец 01.10.2026, п. 6), поэтому
  // входит в число. Складывается ЗДЕСЬ так же, как в тексте отчёта
  // (`pub_digest._confirmed_text`): два места, считающие одно число по-разному,
  // расходятся молча, и расхождение находит заказчик, сверив отчёт с экраном.
  const руками = t.by_hand || 0;
  const confirmText = (t.unknown && known <= 0) ? 'не знаем'
    : String((t.confirmed || 0) + руками);
  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">За период</div>
    <table><tbody>
      <tr><td>Залито в расписание ${hintDot(
        'Ролик загружен на канал, и YouTube Studio подтвердила его отложенную публикацию '
        + '— он ждёт своего часа. Это ещё не «вышел»: выход ниже, отдельной строкой. '
        + 'Считается по дню, когда Studio подтвердила расписание.')}</td>
          <td style="text-align:right;font-weight:600;color:var(--ok)">${p.accepted}</td></tr>
      <tr><td>Ожидалось выходов ${hintDot(
        'Выходы из плана каналов, чьё время в этом периоде уже наступило.')}</td>
          <td style="text-align:right;font-weight:600">${t.expected}</td></tr>
      <tr><td>Вышло на YouTube, подтверждено ${hintDot(
        'Подтверждение — это ответ YouTube Data API о том, что ролик публичный. '
        + 'Статус «готово» в базе значит только подтверждённое расписание и '
        + 'подтверждением выхода не является.')}</td>

            t.delayed ? ';color:var(--bad)' : ''}">${t.delayed}</td></tr>
      ${руками ? `<tr><td class="muted">В том числе подтверждено человеком ${hintDot(
        'Человек открыл канал и увидел ролик там. План выполнен, заливка не '
        + 'повторится. Машинного подтверждения по этим выходам у нас нет: ответа '
        + 'YouTube Data API не было.')}</td>
          <td style="text-align:right;font-weight:600" class="muted">${руками}</td></tr>`
        : ''}
      ${t.unknown ? `<tr><td class="muted">Про столько выходов ответа нет</td>
          <td style="text-align:right;font-weight:600" class="muted">${t.unknown}</td></tr>`
        : ''}
      ${t.ahead ? `<tr><td class="muted">Ещё впереди в этом периоде</td>
          <td style="text-align:right" class="muted">${t.ahead}</td></tr>` : ''}
    </tbody></table>
    ${(t.why || []).length ? `<div class="secbody">${(t.why || []).map(w =>
      `<div class="note muted">не знаем потому, что ${esc(w)}</div>`).join('')}</div>` : ''}

  /* ── группы ── */

    ${g.groups.length ? `<table>
      <thead><tr><th>Группа</th><th style="text-align:right">Каналов</th>
        <th style="text-align:right">В плане</th><th style="text-align:right">Принято</th>
        <th style="text-align:right">Блокеры</th></tr></thead>
      <tbody>${g.groups.map(x => `<tr>
        <td>${esc(x.tag)}</td>
        <td style="text-align:right">${x.channels}</td>
        <td style="text-align:right">${x.plan}</td>
        <td style="text-align:right">${x.accepted}</td>
        <td style="text-align:right${
          x.blocked ? ';color:var(--bad)' : ''}">${x.blocked}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Каналов нет.</div>'}
  </div>`));

  /* ── старый кабинет: ВВ2 и манхва (решение владельца А10, 04.10.2026) ── */
  // Числа приходят выгрузкой `ops-ww2/legacy_streams.py` раз в час и всегда за сегодняшние
  // сутки. Нет выгрузки или устарела — карточка так и говорит, а не прячет потоки.
  const lg = g.legacy || null;
  if (lg){
    const lgRows = (lg.streams || []).map(x => {
      const t = x.today || {};
      const главное = (x.reasons || []).map(r => `${esc(r.why)} — ${r.count}`).join('; ');
      return `<tr>
        <td>${esc(x.name || x.key)}</td>
        <td style="text-align:right">${x.channels}${x.paused ? ` <span class="muted">(пауза ${x.paused})</span>` : ''}</td>
        <td style="text-align:right">${x.plan}</td>
        <td style="text-align:right">${x.accepted}</td>
        <td style="text-align:right${x.blocked ? ';color:var(--bad)' : ''}">${x.blocked}</td>
        <td style="text-align:right">${t.expected || 0} / ${t.reached || 0} / ${

    }).join('');
    app.append($(`<div class="card" style="margin-bottom:16px" id="digest-legacy">
      <div class="sec">Старая студия ${hintDot(

      <tbody>${bl.map(x => `<tr>

        <td style="text-align:right;font-weight:600">${x.count}</td>

      <div class="secbody"><a href="#/releases">Открыть выпуски — там у каждого кнопка

      : '<div class="empty">Ни одного выпуска в разборе.</div>'}
  </div>`));

  /* ── проблемы ── */
  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Проблемы</div>
    ${g.problems.length ? `<table>

      : '<div class="empty">Ни одного канала в разборе и без материала.</div>'}
    ${g.alerts_why ? `<div class="secbody"><div class="note bad">${esc(g.alerts_why)}
      </div></div>`
      : (g.alerts || []).length ? `<div class="secbody"><div class="note muted">
         Действующие тревоги: ${g.alerts.map(a => esc(a.title)).join('; ')}</div></div>` : ''}
  </div>`));
  app.querySelectorAll('tr[data-cid]').forEach(tr => tr.onclick =
    () => { location.hash = '#/channel/' + tr.dataset.cid; });

  /* ── текст отчёта и рассылка ── */
  const s = d.settings;
  const box = $(`<div class="card">
    <div class="sec">Отчёт целиком</div>
    <div class="secbody">
      <textarea id="digest-text" readonly rows="16"
        style="width:100%;font-family:ui-monospace,monospace;font-size:12.5px"
        >${esc(d.text)}</textarea>
      <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <button class="ghost" id="digest-copy">Скопировать отчёт</button>
        <label style="display:flex;gap:8px;align-items:center">
          <input type="checkbox" id="digest-tg"${s.telegram ? ' checked' : ''}${
            ME && ME.role === 'admin' ? '' : ' disabled'}>
          Присылать в телеграм раз в сутки</label>
        <label style="display:flex;gap:8px;align-items:center" class="muted">
          в <input type="number" id="digest-hour" min="0" max="23" value="${s.hour}"
            style="width:64px;text-align:right"${
            ME && ME.role === 'admin' ? '' : ' disabled'}> часов</label>
      </div>
      <div class="note muted">Рассылка выключена, пока её не включат здесь: новых
        сообщений без спроса не появляется. Включает и выключает администратор.</div>
    </div>
  </div>`);
  app.append(box);
  box.querySelector('#digest-copy').onclick = async () => {
    // Копируем ТОТ ЖЕ текст, что уходит в телеграм, а не разметку страницы: отчёт
    // вставляют в переписку, и таблица из буфера приезжает туда кашей.
    try{ await navigator.clipboard.writeText(d.text); toast('отчёт скопирован', 'ok'); }
    catch(e){ toast('Скопировать не вышло — текст выделяется в поле ниже'); }
  };
  const saveDigest = async () => {
    try{
      const out = await post('/ui/digest/settings', {
        telegram: box.querySelector('#digest-tg').checked,
        hour: Number(box.querySelector('#digest-hour').value)});
      toast(out.telegram ? `сводка будет приходить в ${out.hour}:00`
                         : 'рассылка сводки выключена', 'ok');
    }catch(e){
      // Возвращаем переключатель как было: галочка, оставшаяся включённой после
      // отказа сервера, обещает рассылку, которой не будет.
      box.querySelector('#digest-tg').checked = s.telegram;
      box.querySelector('#digest-hour').value = s.hour;
      toast(e.message);
    }
  };
  box.querySelector('#digest-tg').onchange = saveDigest;
  box.querySelector('#digest-hour').onchange = saveDigest;
}

/* Каждая строка: какая вкладка подсвечивается, как узнать свой адрес, что рисовать.
   Раньше это была цепочка if с четырьмя булевыми переменными — при пятой вкладке
   она начала врать о подсветке. */

/* ────────── раскладка ссылок по каналам (владелец 30.09.2026) ──────────

   «Сделать чекбокс, что завести много на много каналов — и тогда открывается попап,
   где делаешь контрол-в, и он создаёт кучу карточек со вставленными ссылками и
   названиями видео в скобочках в заголовке карточки; и тогда просто справа в
   дропдауне по названию канал выбираешь, опять же с фильтром по названию».

   Раньше ссылки ставились по одному каналу — заходом в карточку. На ста пятидесяти
   каналах и общем списке ссылок это полтораста заходов.

   Главное правило экрана: КАНАЛ НЕ ПОДСТАВЛЯЕТСЯ САМ. Подсказка живёт отдельной
   строкой и переносится в выбор только нажатием — ролик, ушедший на чужой канал, уже
   у YouTube, и вернуть его нельзя. Поэтому же «Поставить» берёт ровно то, что стоит в
   списках справа, и ничего больше.

   Поиск по длинному списку каналов писать здесь не нужно: `wireSearchableSelects`
   выдаёт его любому списку длиннее пяти пунктов сам, и второй поиск разошёлся бы с
   общим поведением студии на первой же правке. */

const SPREAD_HINT_NONE = 'подсказки нет';

function spreadTitle(row){
  // Ссылка и название ролика в скобках — так владелец и описал заголовок карточки.
  // Пустого названия здесь не бывает: «названия не добыли» сказано словами, потому что
  // по заголовку человек решает, тот ли это ролик.
  const name = row.title || row.title_note || 'название не добыли';
  return `${esc(row.url)} <span class="muted">(${esc(name)})</span>`;
}

function spreadOptions(channels, chosen){
  const head = `<option value="">— канал не выбран —</option>`;
  return head + channels.map(ch => `<option value="${ch.id}"
    ${String(ch.id) === String(chosen || '') ? 'selected' : ''}>${esc(ch.name)}${
      ch.lang ? ' · ' + esc(ch.lang.toUpperCase()) : ''}${
      ch.status === 'paused' ? ' · на паузе' : ''}</option>`).join('');
}

function spreadDup(row){
  const d = row.duplicate;
  if (!d) return '';
  return `<div class="note muted sp-dup">Этот ролик уже стоит у канала
    «${esc(d.channel)}». Сам собой он никуда не встанет — но если донор нарочно идёт
    на второй язык, выберите канал вручную.</div>`;
}

function spreadHintLine(row, channels){
  const h = row.hint || {};
  const ch = channels.find(c => c.id === h.channel_id);
  if (!ch) return `<div class="note muted sp-hint" data-hint="">${SPREAD_HINT_NONE}:
    ${esc(h.why || 'уверенности нет')}</div>`;
  return `<div class="note muted sp-hint" data-hint="${ch.id}">Подсказка:
    <b>${esc(ch.name)}</b> — ${esc(h.why || '')}.
    <button class="ghost small sp-take" type="button">Взять подсказку</button></div>`;
}

function spreadDonorLine(d){
  if (!d) return '';
  const facts = [donorSubsText(d), donorLengthText(d), d.lang_ru || ''].filter(Boolean);
  return `<span class="pill ${DONOR_CLS[d.verdict] || 's-idle'}">${
      esc(DONOR_TITLE[d.verdict] || d.verdict)}</span>
    ${esc(facts.join(' · '))}${d.why ? ' · ' + esc(d.why) : ''}`;
}

const SPREAD_STATE = {
  placed: ['s-done', 'встало на дату'],
  queued: ['s-queued', 'встало без даты'],
  skipped: ['s-idle', 'пропущено'],
  failed: ['s-error', 'не вышло'],
};

async function viewSpread(){
  app.innerHTML = '';
  app.append($(`<div class="head"><div><h1>Разложить ссылки ${hintDot(
    'Вставьте список ссылок — на каждую появится карточка с названием ролика и '
    + 'выбором канала справа. Канал сам не подставляется.')}</h1></div>
    <div class="head-acts"><a class="ghost small" href="#/channels">Ко всем каналам</a>
    </div></div>`));

  const form = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Вставьте ссылки пачкой</div>
    <div class="secbody">
      <textarea id="sp-in" rows="6" style="width:100%"
        placeholder="ссылки на доноров — по одной в строке или вперемешку с текстом"
        ></textarea>
      <div style="margin-top:10px"><button id="sp-read" class="small">Разобрать</button>
      </div>
      <div class="note muted">Названия роликов берутся бесплатно: квоту YouTube Data API
        это не тратит. Субтитры и длину смотрит отдельная кнопка — она ходит через
        выходы субтитров и на сотне ссылок думает минутами.</div>
      <div id="sp-err"></div>
    </div></div>`);
  app.append(form);

  const box = $(`<div id="sp-out"></div>`);
  app.append(box);

  form.querySelector('#sp-read').onclick = async () => {
    const btn = form.querySelector('#sp-read');
    btn.disabled = true;
    form.querySelector('#sp-err').innerHTML = '';
    box.innerHTML = '';
    try{
      const out = await post('/ui/spread/preview',
                             {links: form.querySelector('#sp-in').value});
      spreadDraw(box, out);
    }catch(e){
      form.querySelector('#sp-err').innerHTML = `<div class="err">${esc(e.message)}
        Ничего не записано и денег это не стоило.</div>`;
    }
    finally{ btn.disabled = false; }
  };
}

function spreadDraw(box, out){
  const channels = out.channels || [], rows = out.rows || [];
  box.innerHTML = `<div class="card" style="margin-bottom:12px"><div class="secbody">
      <div><b>Разобрано ссылок: ${rows.length}</b>
        <span class="muted" id="sp-count"></span></div>
      <div class="note muted">${esc(out.note || '')}</div>
      <div class="note muted">${esc(out.no_channel || '')}</div>
      <div style="margin-top:10px">
        <button class="small" id="sp-place">Поставить</button>
        <button class="ghost small" id="sp-check" style="margin-left:8px">Проверить
          доноров</button>
        <button class="ghost small" id="sp-hints" style="margin-left:8px">Подставить
          подсказки</button></div>
      <div id="sp-res"></div>
    </div></div>
    ${rows.map((r, n) => `<div class="card sp-row" data-n="${n}"
        data-url="${esc(r.url)}" style="margin-bottom:8px"><div class="secbody"
        style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:280px">
        <div style="font-weight:600;word-break:break-all">${spreadTitle(r)}</div>
        ${spreadDup(r)}
        <div class="note muted sp-donor"></div>
        <div class="note sp-res"></div>
      </div>
      <div style="width:300px">
        <select class="sp-ch" style="width:100%">${spreadOptions(channels, '')}</select>
        ${spreadHintLine(r, channels)}
      </div></div></div>`).join('')}`;

  const cards = [...box.querySelectorAll('.sp-row')];
  const picked = () => cards.filter(card => !card.querySelector('.sp-ch').disabled
                                            && card.querySelector('.sp-ch').value);
  const count = () => {
    const n = picked().length;
    box.querySelector('#sp-count').textContent =
      n ? ` · канал выбран у ${n}` : ' · канал пока не выбран ни у одной';
    box.querySelector('#sp-place').disabled = !n;
  };
  box.addEventListener('change', ev => {
    if (ev.target.classList && ev.target.classList.contains('sp-ch')) count();
  });

  // Подсказку переносит в выбор только человек — и переносит видимо: список справа
  // после нажатия показывает канал, и «Поставить» берёт именно его.
  const take = card => {
    const hint = card.querySelector('.sp-hint');
    const id = hint && hint.dataset.hint;
    const sel = card.querySelector('.sp-ch');
    if (!id || sel.disabled || sel.value) return false;
    sel.value = id;
    sel.dispatchEvent(new Event('change', {bubbles: true}));
    return true;
  };
  cards.forEach(card => {
    const b = card.querySelector('.sp-take');
    if (b) b.onclick = () => { take(card); };
  });
  box.querySelector('#sp-hints').onclick = () => {
    // Дубли пропускаем: про них уже сказано, что сами они никуда не встают, и
    // подставить их пачкой значило бы обойти это одним нажатием.
    const n = cards.filter(c => !c.querySelector('.sp-dup') && take(c)).length;
    toast(n ? `Подсказки подставлены: ${n}. Просмотрите их перед «Поставить».`
            : 'Подставлять нечего: подсказок нет или каналы уже выбраны');
  };

  box.querySelector('#sp-check').onclick = async () => {
    const btn = box.querySelector('#sp-check');
    btn.disabled = true;
    cards.forEach(c => c.querySelector('.sp-donor').textContent = 'проверяем…');
    try{
      const res = await post('/ui/spread/check', {urls: cards.map(c => c.dataset.url)});
      const by = {};
      for (const d of (res.donors || [])) by[d.url] = d;
      cards.forEach(c => c.querySelector('.sp-donor').innerHTML =
        spreadDonorLine(by[c.dataset.url]) || 'проверить не удалось');
      box.querySelector('#sp-res').innerHTML = `<div class="note muted">${
        res.timed_out ? `Проверка не уложилась в ${Math.round(res.wall_sec || 0)} с и
          была остановлена — что успели, показано в строках. ` : ''}${
        esc(res.donor_note || '')}</div>`;
    }catch(e){
      cards.forEach(c => c.querySelector('.sp-donor').textContent = '');
      box.querySelector('#sp-res').innerHTML = `<div class="note bad">Проверить ролики
        не удалось: ${esc(e.message)}. Денег это не стоило, в план ничего не записано —
        ставить ссылки можно и без проверки.</div>`;
    }
    finally{ btn.disabled = false; }
  };

  box.querySelector('#sp-place').onclick = async () => {
    const btn = box.querySelector('#sp-place');
    const mine = picked();
    btn.disabled = true;
    try{
      const res = await post('/ui/spread/apply', {rows: mine.map(c => ({
        url: c.dataset.url, channel_id: Number(c.querySelector('.sp-ch').value)}))});
      const by = {};
      for (const r of (res.rows || [])) by[r.url] = r;
      for (const card of mine){
        const r = by[card.dataset.url];
        if (!r) continue;
        const [cls, word] = SPREAD_STATE[r.state] || ['s-idle', r.state];
        card.querySelector('.sp-res').innerHTML = `<span class="pill ${cls}">${
          esc(word)}</span> ${esc(r.channel || '')}${
          r.slot ? ' · ' + esc(spreadWhen(r.slot)) : ''}${
          r.why ? ' · ' + esc(r.why) : ''}`;
        // Поставленное и пропущенное больше не выбирается: второе нажатие «Поставить»
        // не должно ни отправить его ещё раз, ни выглядеть так, будто может.
        if (r.state !== 'failed') card.querySelector('.sp-ch').disabled = true;
      }
      const c = res.counts || {};
      box.querySelector('#sp-res').innerHTML = `<div class="res">Встало на дату:
        <b>${c.placed || 0}</b> · без даты: <b>${c.queued || 0}</b> · пропущено:
        <b>${c.skipped || 0}</b> · не вышло: <b>${c.failed || 0}</b>.
        ${c.failed ? 'Отказ по строке не отменил остальные — что встало, то встало.'
                   : ''}</div>`;
    }catch(e){
      box.querySelector('#sp-res').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
    finally{ count(); }
  };
  count();
  // Поиска по списку каналов здесь нет намеренно: его выдаёт общий наблюдатель студии
  // (`wireSearchableSelects`) любому списку длиннее пяти пунктов, и карточки, дорисованные
  // внутри уже вставленного узла, тоже через него проходят. Свой поиск на этом экране
  // разошёлся бы с остальными списками на первой же правке общего.
}

function spreadWhen(value){
  const t = new Date(value);
  return isNaN(t) ? String(value)
    : t.toLocaleString('ru-RU', {weekday: 'short', day: '2-digit', month: '2-digit',
                                 hour: '2-digit', minute: '2-digit'});
}

/* Сторож незаписанных правок (20.09.2026). Экран, на котором что-то набрано и не
   сохранено, ставит сюда `{hash, keep, dirty, drop, what}` и снимает сам, когда
   терять уже нечего. Роутер — единственное место, где видно ВСЕ уходы: и ссылку
   «← ко всем пресетам», и вкладку в шапке, и кнопку «назад» браузера.
   Спрашиваем нашим <dialog>: браузерный `confirm` останавливает страницу целиком, а
   `beforeunload` браузер показывает своими словами и не даёт объяснить, что именно
   пропадёт. */
let LEAVE_GUARD = null;
// Откат адреса — это тоже смена адреса, и роутер получит её вторым событием. Второй
// заход экран перерисовывать не должен: человек никуда не ушёл, он стоит в своей
// форме, и перерисовка отняла бы у него фокус и место прокрутки.
let LEAVE_BACK = false;

function leaveAsk(target){
  const g = LEAVE_GUARD;
  modal('Правки не сохранены', `<div style="font-size:14px">${esc(g.what)}
    Если уйти сейчас, они пропадут.</div>`, {
      ok: 'Уйти без сохранения', no: 'Остаться',
      onOk: async (_body, close) => {
        close();
        LEAVE_GUARD = null;
        if (g.drop) g.drop();
        location.hash = target;
      }});
}

// Откуда пришли на страницу выпуска — туда и ведёт «назад» (владелец 03.10.2026: «нажимаю
// „ко всем выпускам“ — и меня перекидывает в Каналы, а я пришёл из проектов»). Помним
// последний экран, который не страница выпуска.
let CAME_FROM = '';
function backFrom(h){
  h = h || '';
  if (h === '#/releases') return [h, 'ко всем выпускам'];
  if (h.startsWith('#/project/')) return [h, 'к проекту'];
  if (h.startsWith('#/channel/')) return [h, 'к каналу'];
  if (h === '#/queue') return [h, 'к очереди'];
  if (h === '#/digest') return [h, 'к сводке'];
  if (h === '#/projects') return [h, 'ко всем проектам'];
  // По ссылке, без истории — в список выпусков: у них теперь своя вкладка.
  return ['#/releases', 'ко всем выпускам'];
}

// Какая вкладка подсвечена на странице выпуска — по тому же «откуда пришли».
function tabFrom(h){
  h = h || '';
  if (h === '#/projects' || h.startsWith('#/project/')) return 'projects';
  if (h.startsWith('#/channel/') || h === '#/channels') return 'channels';
  if (h === '#/queue') return 'queue';
  if (h === '#/digest') return 'digest';
  return 'releases';
}

async function render(){
  if (LEAVE_BACK){ LEAVE_BACK = false; return; }
  if (LEAVE_GUARD){
    const g = LEAVE_GUARD;
    const to = location.hash || homeHash();
    if (!g.keep(to)){
      if (g.dirty()){
        LEAVE_BACK = true;
        location.hash = g.hash;        // человек ещё здесь, адрес должен это отражать
        leaveAsk(to);
        return;
      }
      LEAVE_GUARD = null;              // терять нечего — уходим молча
    }
  }
  // Смена адреса — уход со страницы для опроса логов задач проекта (§6): останавливаем
  // все таймеры здесь одним местом, а не по одному в каждом view — иначе переключение
  // на #/text/#/covers/куда угодно из открытого лога проекта оставляло бы его дёргать
  // API вникуда.
  clearAllLogTimers();
  if (!ME){
    try{ ME = await api('/ui/me'); }
    catch(e){ return viewLogin(e instanceof NeedLogin ? '' : e.message); }
  }
  document.querySelector('nav').style.visibility = '';
  showWho();
  refreshAttention();
  // Пустой адрес — это вход в студию, и встречает на нём сводка (см. homeHash).
  // Адрес при этом не переписываем: подмена `location.hash` на входе добавила бы шаг в
  // историю браузера, и кнопка «назад» из сводки возвращала бы в сводку же.
  const h = location.hash || homeHash();
  const hit = ROUTES.find(r => r[1](h));
  if (!h.startsWith('#/release/')) CAME_FROM = h;
  // Экранов больше, чем вкладок: «Выпуски», «Текст», «Обложки» и «Админ» живут внутри
  // каналов, проектов и профиля. Подсвечиваем ту вкладку, в чей раздел попал маршрут.
  // «Профиль» среди них — это имя человека справа: отдельной вкладки у него больше
  // нет, id висит на ссылке, которую рисует showWho(). На экране входа имени нет, и
  // слепое обращение к нему уронило бы весь роутер — поэтому проверяем.
  const tabOn = typeof hit[0] === 'function' ? hit[0]() : hit[0];
  for (const id of ['digest', 'releases', 'channels', 'projects', 'queue', 'presets', 'profile']){
    const tab = document.getElementById('tab-' + id);
    if (tab) tab.classList.toggle('on', tabOn === id);
  }
  // Полоса появляется, только если экран думает дольше мгновения: на быстром переходе
  // мигание раздражает сильнее, чем помогает.
  const slow = setTimeout(busyOn, 120);
  try{ await hit[2](h); }
  catch(e){
    // Сессия могла истечь посреди работы: это не ошибка экрана, а «войдите снова».
    if (e instanceof NeedLogin){ ME = null; return viewLogin(''); }
    fail(e);
  }
  finally{ clearTimeout(slow); busyOff(); }
}

// Показать, что экран грузится. Вынесено отдельными функциями: тем же индикатором
// пользуются долгие действия внутри экранов, а не только смена адреса.
function busyOn(){
  const bar = document.getElementById('busy');
  const spin = document.getElementById('busy-spin');
  if (bar) bar.hidden = false;
  if (spin) spin.hidden = false;
  document.body.classList.add('loading');
}
function busyOff(){
  const bar = document.getElementById('busy');
  const spin = document.getElementById('busy-spin');
  if (bar) bar.hidden = true;
  if (spin) spin.hidden = true;
  document.body.classList.remove('loading');
}
sfindWatch();                      // длинные списки получают поиск сами
addEventListener('hashchange', render);
render();
oauthReturnNotice();
</script>
</body>
