/* ───────────────────────── старт этапа (tts/images/video/render) ───────────────────────── */
const STAGE_OUTCOME_TEXT = {
  duplicate: 'Уже идёт — вторая такая же задача не ставится',
  images_busy: 'Картинки заняты правкой — дождитесь освобождения',
  render_deferred: 'Рендер отложен: материалы для сборки ещё не готовы',
  video_deferred: 'Видео отложено: материалы ещё не готовы',
};
// Строка исхода последнего нажатия «Начать» переживает автообновление экрана после
// успешного старта (review-feedback-F4 цикл 1, Issue 3): раньше отложенный
// `viewProject()` рисовал блок «Действие» заново уже пустым, и «Поставлено: задача
// #N» пропадало через 1,2 с, так и не будучи прочитанным. Ключ — pid:tab, живёт на
// сессию вкладки браузера, как и остальные *_STATE этого экрана.
const STAGE_OUTCOME_STATE = {};

async function renderStageTab(d, tab){
  const p = d.project;
  const skey = p.id + ':' + tab;
  const groupTitle = TAB_SETTINGS_GROUP[tab];
  const settingsData = await api(`/ui/projects/${encodeURIComponent(p.id)}/settings`);
  const group = settingsData.groups.find(g => g.title === groupTitle);
  let settingsForm = group ? fieldForm([group]) : null;

  // 1. Действие — «Начать» шлёт ТЕКУЩИЕ значения формы настроек этой вкладки
  // (fieldForm(...).read()), чтобы старт не сбросил их на «как по умолчанию»
  // (поправка оркестратора к §5.4).
  const actCard = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Действие</div>
    <div class="secbody">
    <button id="stage-go">Начать</button>
    <div id="stage-outcome" class="note"></div>
    </div></div>`);
  app.append(actCard);
  const outcomeBox = actCard.querySelector('#stage-outcome');
  // Показать исход предыдущего нажатия сразу же — переживает перерисовку экрана.
  const savedOutcome = STAGE_OUTCOME_STATE[skey];
  if (savedOutcome){
    outcomeBox.textContent = savedOutcome.text;
    outcomeBox.classList.add(savedOutcome.cls);
  }
  actCard.querySelector('#stage-go').onclick = async () => {
    const btn = actCard.querySelector('#stage-go');
    btn.disabled = true;
    outcomeBox.className = 'note';
    outcomeBox.textContent = 'запускаю…';
    // Адрес на момент нажатия — чтобы отложенное обновление ниже не сработало,
    // если человек за эти 1,2 с уже ушёл с этой вкладки (Issue 3).
    const hashAtClick = location.hash;
    try{
      const settings = settingsForm ? settingsForm.read() : {};
      const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/stage/${tab}`,
                             {settings});
      // Пять честных исходов (поправка 1 триажа) — «поставлено» только когда
      // outcome === 'started'; остальное — своя правдивая подпись (принцип 3).
      const text = out.outcome === 'started'
        ? `Поставлено: задача #${out.job_id}`
        : (STAGE_OUTCOME_TEXT[out.outcome] || out.outcome);
      const cls = out.outcome === 'started' ? 'muted' : 'bad';
      STAGE_OUTCOME_STATE[skey] = {text, cls};
      outcomeBox.textContent = text;
      outcomeBox.classList.add(cls);
      if (out.outcome === 'started'){
        setTimeout(() => { if (location.hash === hashAtClick) viewProject(p.id); }, 1200);
      }
    }catch(e){
      STAGE_OUTCOME_STATE[skey] = {text: e.message, cls: 'bad'};
      outcomeBox.textContent = e.message;         // текст кабинета как есть (принцип 3)
      outcomeBox.classList.add('bad');
    }finally{ btn.disabled = false; }
  };

  // 2. Настройки этапа — та же fieldForm/группа, что и в общих настройках проекта,
  // сохранение — той же ручкой (§3: путь переиспользуется без изменений).
  if (settingsForm){
    app.append(settingsForm);
    // «Отмена» тут не адрес — вкладка сама и есть текущий экран, у неё нет отдельной
    // страницы «назад» (Issue 8: ссылка на тот же hash не делала ничего). Вместо
    // перехода — построить форму заново из тех же данных, что пришли с сервера,
    // отбросив несохранённые правки на месте.
    app.append(saveBar(location.hash,
      () => post(`/ui/projects/${encodeURIComponent(p.id)}/settings`,
                 {values: settingsForm.read()}),
      () => {
        const fresh = fieldForm([group]);
        settingsForm.replaceWith(fresh);
        settingsForm = fresh;
      }));
  }

  // 3. Результат
  const mine = d.files.filter(g => (TAB_FILES[tab] || []).includes(g.code));
  if (mine.length) for (const g of mine) app.append(fileCard(d, g));
  else app.append(emptyResultCard());

  // 4. Лог задач
  app.append(jobsLogCard(d, tab));
}

/* ───────────────────────── вкладка «Сценарий» ───────────────────────── */
// У Rewrite нет понятия «проект VSGen» — GET /ui/text не фильтруется по проекту, и
// связать задачу рерайта с этим проектом в данных нечем. Решение оркестратора
// (review-feedback-F4 цикл 2, Issue 4): needs-clarification.md не писать и новую
// связь в данных не придумывать — вкладка показывает те же «последние задачи текста»,
// что и #/text (тот же источник, без новой ручки сервера), честно подписано, что
// список — по аккаунту, а не по проекту; задача, созданная тут же, — первой в списке.
// Опрос переиспользует LOG_TIMERS/clearAllLogTimers (тот же реестр, что у раскрытого
// лога задачи выше) — останавливается сам при уходе со страницы (смене hash).
const SCEN_STATE = {};
function scenState(pid){
  if (!SCEN_STATE[pid]) SCEN_STATE[pid] = {mode: 'link', langs: new Set(),
                                           model: '', preset: '', lastJob: null};
  return SCEN_STATE[pid];
}
// Терминальные состояния СПИСКА задач Rewrite/Cover (не `queue_tasks` кабинета —
// у тех `LOG_TERMINAL` выше): пока среди показанных есть бегущая/ждущая, есть смысл
// продолжать опрашивать.
const JOB_LIST_TERMINAL = new Set(['done', 'partial', 'cancelled', 'error', 'blocked']);
function jobListPollKey(kind, pid){ return `${kind}-jobs:${pid}`; }

async function fetchText(path){
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('файл не прочитался: HTTP ' + r.status);
  return r.text();
}

// Раскрывающаяся строка результата задачи — та же механика RESULT_OPEN, что у
// #/text/#/covers (`wireResults`), но `paint` умеет класть готовый файл в проект,
// чего нет у общего `paintResults`. Клик вынесен в отдельную `wireOneJobRow` (review-
// feedback-F4 цикл 3, Issue 1): `syncJobsTable` навешивает её на КОНКРЕТНУЮ новую
// строку без повторного прохода по всей таблице — общий `wireProjectJobRows` ниже
// на уже открытых строках сам эмулирует клик (`tr.click()`), и повторный вызов на
// всей таблице закрыл бы то, что уже открыто.
function wireOneJobRow(tr, service, colspan, paint){
  tr.style.cursor = 'pointer';
  tr.onclick = ev => {
    if (ev.target.closest('button, a')) return;
    const id = tr.dataset.job;
    const key = service + ':' + id;
    const next = tr.nextElementSibling;
    if (next && next.classList.contains('res-row')){
      next.remove(); RESULT_OPEN.delete(key); return;
    }
    RESULT_OPEN.add(key);
    tr.insertAdjacentHTML('afterend',
      `<tr class="res-row"><td colspan="${colspan}" style="padding-top:0">` +
      '<div class="muted">загрузка…</div></td></tr>');
    paint(id, tr.nextElementSibling.querySelector('div'));
  };
}
function wireProjectJobRows(root, service, colspan, paint){
  root.querySelectorAll('tr[data-job]').forEach(tr => {
    wireOneJobRow(tr, service, colspan, paint);
    if (RESULT_OPEN.has(service + ':' + tr.dataset.job)) tr.click();
  });
}

// Ячейка «Состояние» строки списка задач Rewrite/Cover — общая для первой отрисовки
// таблицы и для точечного обновления тиком опроса (`syncJobsTable`), чтобы обе
// рисовали её одинаково.
function jobListStateCellHtml(j){
  return `<span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
    ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
    ${j.progress != null ? `<div class="bar"><i style="width:${
      Math.round(j.progress * 100)}%"></i></div>` : ''}`;
}
// Тик опроса списка задач Rewrite/Cover (review-feedback-F4 цикл 3, Issue 1): не
// перестраивает таблицу через `box.innerHTML` — это стирало бы раскрытые result-row и
// всё внутри них (в т.ч. `confirmInline` у «Взять в проект» — Issue 1 цикла 3). Вместо
// этого обновляется только ячейка `.jl-state` строк, у которых изменилось состояние
// (по `data-state` на `<tr>`), новые задачи дописываются новыми строками, а уже
// раскрытый результат перечитывается РОВНО ОДИН раз — в момент, когда задача только
// что перешла в терминальное состояние (а не на каждом тике). Строки, которых больше
// нет в ответе сервера, не удаляются: связь с проектом только добавляется, пропасть
// строка может лишь при удалении задачи в самом сервисе — до следующего захода на вкладку.
// Отпечаток строки: состояние + прогресс + подпись. Внутри `running` меняются только
// прогресс и подпись, поэтому сравнивать по одному состоянию нельзя — полоска застынет.
function jobRowPrint(j){
  return [j.state, j.progress == null ? '' : j.progress, j.detail || ''].join('|');
}
// Снять СВОЙ таймер опроса: реестр чистится, только если под ключом всё ещё он.
// Иначе запоздавший тик старого экрана погасил бы опрос нового под тем же ключом.
function stopOwnPoll(key, handle){
  clearInterval(handle);
  if (LOG_TIMERS[key] === handle) delete LOG_TIMERS[key];
}
function syncJobsTable(box, jobs, service, rowHtml, colspan, paint){
  const table = box.querySelector('table');
  if (!table) return;                          // таблицы ещё нет — рано, ждём полной отрисовки
  const tbody = table.querySelector('tbody');
  const rows = {};
  tbody.querySelectorAll('tr[data-job]').forEach(tr => { rows[tr.dataset.job] = tr; });
  jobs.forEach(j => {
    const id = String(j.id);
    const tr = rows[id];
    if (!tr){
      tbody.insertAdjacentHTML('beforeend', rowHtml(j));   // новая задача — новая строка в конец
      wireOneJobRow(tbody.lastElementChild, service, colspan, paint);
      return;
    }
    if (tr.dataset.print === jobRowPrint(j)) return;   // ни состояние, ни прогресс, ни подпись не изменились
    const wasTerminal = JOB_LIST_TERMINAL.has(tr.dataset.state);
    const cell = tr.querySelector('.jl-state');
    if (cell) cell.innerHTML = jobListStateCellHtml(j);
    tr.dataset.state = j.state;
    tr.dataset.print = jobRowPrint(j);
    const key = service + ':' + id;
    if (!wasTerminal && JOB_LIST_TERMINAL.has(j.state) && RESULT_OPEN.has(key)){
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('res-row')) paint(id, next.querySelector('div'));
    }
  });
}

async function paintTextTake(jobId, host, pid, srcTextEl){
  try{
    const fd = await api(`/ui/files/rewrite/${encodeURIComponent(jobId)}`);
    if (!fd.files.length){
      host.innerHTML = '<span class="muted">Файлов пока нет — рерайт ещё не готов.</span>';
      return;
    }
    host.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px">${fd.files.map(f => `
      <div style="display:flex;gap:10px;align-items:center">
        <span class="mono">${esc(f.name)}</span>
        <button class="ghost small tx-take" data-name="${esc(f.name)}"
          >Взять в проект</button>
      </div>`).join('')}</div>`;
    host.querySelectorAll('.tx-take').forEach(btn => btn.onclick = async () => {
      const name = btn.dataset.name;
      const apply = async () => {
        btn.disabled = true;
        try{
          const text = await fetchText(
            `/ui/files/rewrite/${encodeURIComponent(jobId)}/${encodeURIComponent(name)}`);
          await post(`/ui/projects/${encodeURIComponent(pid)}/source`, {text});
          if (srcTextEl) srcTextEl.value = text;
          toast('Текст взят в проект', 'ok');
        }catch(e){ toast(e.message); }
        finally{ btn.disabled = false; }
      };
      const cur = srcTextEl ? srcTextEl.value.trim() : '';
      if (cur) confirmInline(btn, 'Заменить текущий текст проекта?', apply);
      else await apply();
    });
  }catch(e){
    host.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
  }
}

// Строка списка «задачи текста проекта» — общая для первой отрисовки
// таблицы (`refreshScenarioJobs`) и для точечного дополнения тиком (`syncJobsTable`).
function scenJobRowHtml(j){
  return `<tr data-job="${esc(j.id)}" data-state="${esc(j.state)}" data-print="${esc(jobRowPrint(j))}">
    <td><div style="font-weight:600">${esc(j.title)}</div>
        <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
    <td>${j.kind === 'generation' ? 'с нуля' : 'рерайт'}</td>
    <td>${(Array.isArray(j.langs) ? j.langs : [j.langs]).map(esc).join(', ') || '—'}</td>
    <td class="jl-state">${jobListStateCellHtml(j)}</td>
    <td class="muted">${when(j.created)}</td>
  </tr>`;
}
// Список «задачи текста проекта»: источник — `GET /ui/text?project_id=` (связь
// `project_service_jobs` пишется при постановке из вкладки, 17.09.2026), порядок —
// постановки, задача, созданная тут же (`st.lastJob`), — первой. Опрашивается раз в 3с, пока среди показанных есть
// незавершённая (review-feedback-F4 цикл 2, Issue 4а — готовый результат должен
// дочитываться сам, не только после ухода с вкладки и возврата).
// review-feedback-F4 цикл 3: полная перестройка (`box.innerHTML`) — только здесь, при
// первом заходе на вкладку/сразу после постановки новой задачи; тик опроса ниже правит
// таблицу на месте через `syncJobsTable` (Issue 1 — не стирать раскрытые result-row) и
// проверяет `location.hash`/`box.isConnected` ПОСЛЕ каждого своего ответа, а не только
// при первом входе (Issue 2 — не оживать на чужом экране, если ответ задержался и hash
// уже сменился); busy-флаг и перехват ошибки — тот же приём, что у `startJobLogPoll`.
async function refreshScenarioJobs(box, pid, srcTextEl){
  const key = jobListPollKey('scenario', pid);
  stopJobLogPoll(key);
  const hashAtStart = location.hash;
  const st = scenState(pid);
  const td = await api(`/ui/text?project_id=${encodeURIComponent(pid)}`);
  if (location.hash !== hashAtStart || !box.isConnected) return;   // ушли со страницы, пока список грузился
  const jobs = td.jobs.slice();
  if (st.lastJob != null){
    const i = jobs.findIndex(j => String(j.id) === String(st.lastJob));
    if (i > 0){ const [j] = jobs.splice(i, 1); jobs.unshift(j); }
  }
  box.innerHTML = `<div class="note muted" style="margin:14px 0 8px">Задачи текста этого
    проекта — поставленные из этой вкладки, новые сверху.</div>
    ${jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Вид</th><th>Языки</th><th>Состояние</th><th>Создана</th></tr></thead>
      <tbody>${jobs.map(scenJobRowHtml).join('')}</tbody></table>
      <div class="note muted">Нажмите на строку — покажется результат.</div>`
      : '<div class="empty">У проекта задач текста пока нет.</div>'}`;
  wireProjectJobRows(box, 'rewrite', 5, (jid, host) => paintTextTake(jid, host, pid, srcTextEl));

  if (!jobs.some(j => !JOB_LIST_TERMINAL.has(j.state))) return;   // все терминальны — опрашивать нечего
  let busy = false;
  const tick = async () => {
    if (busy) return;
    busy = true;
    try{
      const d2 = await api(`/ui/text?project_id=${encodeURIComponent(pid)}`);
      if (location.hash !== hashAtStart || !box.isConnected){ stopOwnPoll(key, handle); return; }
      const jobs2 = d2.jobs.slice();
      if (st.lastJob != null){
        const i = jobs2.findIndex(j => String(j.id) === String(st.lastJob));
        if (i > 0){ const [j] = jobs2.splice(i, 1); jobs2.unshift(j); }
      }
      syncJobsTable(box, jobs2, 'rewrite', scenJobRowHtml, 5,
        (jid, host) => paintTextTake(jid, host, pid, srcTextEl));
      if (!jobs2.some(j => !JOB_LIST_TERMINAL.has(j.state))) stopOwnPoll(key, handle);
    }catch(e){
      // сеть иногда сбоит — список не стираем, следующий тик попробует снова
    }finally{ busy = false; }
  };
  // Два наложившихся вызова оба дошли сюда: снять уже записанный таймер, чтобы он не
  // выпал из реестра и не опрашивал сервис до перезагрузки страницы.
  stopJobLogPoll(key);
  const handle = setInterval(tick, 3000);
  LOG_TIMERS[key] = handle;
}

async function renderScenarioTab(d){
  const p = d.project;
  const st = scenState(p.id);
  const td = await api('/ui/text');
  if (!st.model && td.models.length) st.model = td.models[0].value;

  // 1. Действие: «Получить текст» (три режима TEXT_MODES — та же форма, что у
  // #/text) + список задач текста этого проекта + textarea с source.txt.
  const card = $(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Действие</div>
    <div class="secbody">
    <div class="note muted" style="margin-bottom:6px">Получить текст</div>
    <div class="modes">${td.modes.map(m => `<button type="button" data-mode="${
      esc(m.key)}" class="${m.key === st.mode ? 'on' : ''}">${esc(m.title)}</button>`
      ).join('')}</div>
    <div class="note muted" id="tx-note"></div>
    <label class="k" style="display:block;margin-bottom:6px" id="tx-label"></label>
    <input id="tx-one" style="width:100%;box-sizing:border-box">
    <textarea id="tx-many"></textarea>
    <div id="tx-preset-box" style="margin-top:10px">
      <label class="k" style="display:block;margin-bottom:6px">Бриф</label>
      <select id="tx-preset"><option value="">— выберите бриф —</option>
        ${td.presets.generation.map(x => `<option ${x === st.preset ? 'selected' : ''}
          >${esc(x)}</option>`).join('')}</select>
    </div>
    <div style="margin-top:10px">
      <label class="k" style="display:block;margin-bottom:6px">Модель</label>
      <select id="tx-model">${td.models.map(m => `<option value="${esc(m.value)}"
        ${m.value === st.model ? 'selected' : ''}>${esc(m.label)}</option>`).join('')}</select>
    </div>
    <div style="margin-top:10px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="tx-langs">${td.languages.map(l => `<label
        data-code="${esc(l.code)}"><input type="checkbox"
        ${st.langs.has(l.code) ? 'checked' : ''}>${esc(l.title)}</label>`).join('')}</div>
    </div>
    <div style="margin-top:12px"><button id="tx-go">Получить текст</button></div>
    <div id="tx-jobs"></div>

    <div class="note muted" style="margin-top:18px;border-top:1px solid var(--line);
      padding-top:12px">Исходный текст</div>
    <textarea id="src-text" style="margin-top:6px">${esc(d.source)}</textarea>
    <div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button id="src-save">Сохранить текст</button>
      <label class="muted" style="font-size:12.5px">или файлом:
        <input id="src-file" type="file" accept=".txt,text/plain"></label>
    </div>
    <div class="note muted">Edge режет текст по строкам/абзацам — короткие абзацы
      могут потеряться при озвучке этим движком.</div>
    </div></div>`);
  app.append(card);

  const one = card.querySelector('#tx-one');
  const many = card.querySelector('#tx-many');
  const presetBox = card.querySelector('#tx-preset-box');
  const label = card.querySelector('#tx-label');
  const srcText = card.querySelector('#src-text');
  function paintMode(){
    const m = st.mode;
    label.textContent = m === 'link' ? 'Ссылка на ролик-донор'
                      : m === 'text' ? 'Текст' : 'Тема';
    one.hidden = (m === 'text');
    many.hidden = (m !== 'text');
    presetBox.hidden = (m !== 'topic');
    one.placeholder = m === 'link' ? 'https://www.youtube.com/watch?v=…'
                                   : 'О чём должен быть ролик';
    const note = td.modes.find(x => x.key === m);
    card.querySelector('#tx-note').textContent = note ? note.note : '';
  }
  paintMode();
  card.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    st.mode = b.dataset.mode;
    card.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
    paintMode();
  });
  card.querySelectorAll('#tx-langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? st.langs.add(l.dataset.code) : st.langs.delete(l.dataset.code); };
    sync();
    box.onchange = sync;
  });
  card.querySelector('#tx-model').onchange = e => st.model = e.target.value;
  card.querySelector('#tx-preset').onchange = e => st.preset = e.target.value;

  card.querySelector('#tx-go').onclick = async () => {
    const btn = card.querySelector('#tx-go');
    btn.disabled = true;
    try{
      const out = await post('/ui/text', {
        mode: st.mode,
        source: (st.mode === 'text' ? many.value : one.value),
        languages: [...st.langs], model: st.model, preset: st.preset,
        project_id: p.id,
      });
      st.lastJob = out.job && out.job.job_id;
      toast('Задача текста создана', 'ok');
      await refreshScenarioJobs(card.querySelector('#tx-jobs'), p.id, srcText);
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };
  await refreshScenarioJobs(card.querySelector('#tx-jobs'), p.id, srcText);

  // Файл .txt читается в браузере (18.09.2026 переехал сюда из формы заведения
  // проекта): серверу нужен текст, а не файл, и он уже едет тем же полем.
  // TextDecoder с fatal — единственный способ отличить не-UTF-8 от кракозябр, которые
  // потом озвучат.
  const srcFile = card.querySelector('#src-file');
  if (srcFile) srcFile.onchange = async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try{
      const text = new TextDecoder('utf-8', {fatal: true}).decode(await file.arrayBuffer());
      card.querySelector('#src-text').value = text;
      toast('Файл прочитан — нажмите «Сохранить текст»', 'ok');
    }catch(readErr){
      toast(`файл «${file.name}» не в UTF-8 — пересохраните его в этой кодировке`);
    }finally{ e.target.value = ''; }
  };

  card.querySelector('#src-save').onclick = async () => {
    const btn = card.querySelector('#src-save');
    btn.disabled = true;
    try{
      await post(`/ui/projects/${encodeURIComponent(p.id)}/source`, {text: srcText.value});
      toast('Текст сохранён', 'ok');
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };

  // 3. Результат — план сцен/промпты.
  const mine = d.files.filter(g => (TAB_FILES.scenario || []).includes(g.code));
  if (mine.length) for (const g of mine) app.append(fileCard(d, g));
  else app.append(emptyResultCard());

  // 4. Лог задач вида prompts.
  app.append(jobsLogCard(d, 'scenario'));

  // 5. Прочие задачи проекта — виды, не относящиеся ни к одной из шести вкладок
  // (например `cards`/`pipeline`), были видны на старом «Обзоре» целиком; молча
  // прятать платную работу с экрана нельзя (review-feedback-F4 цикл 1, Issue 5).
  const knownKinds = new Set(Object.values(TAB_KINDS).flat());
  const other = (d.jobs || []).filter(j => !knownKinds.has(j.kind));
  if (other.length) app.append(jobsTableCard('Прочие задачи проекта', other, ''));
}

/* ───────────────────────── вкладка «Обложка» ───────────────────────── */
const COVER_STATE = {};
function coverState(pid){
  if (!COVER_STATE[pid]) COVER_STATE[pid] = {mode: 'url', langs: new Set(), preset: '',
                                             option: 0, edit: false, n: 3, lastJob: null};
  return COVER_STATE[pid];
}

async function paintCoverTake(jobId, host, pid){
  try{
    const fd = await api(`/ui/files/cover/${encodeURIComponent(jobId)}`);
    if (!fd.files.length){
      host.innerHTML = '<span class="muted">Вариантов пока нет — обложка ещё не готова.</span>';
      return;
    }
    const url = f => `${API}/ui/files/cover/${encodeURIComponent(jobId)}/${
      encodeURIComponent(f.name)}`;
    host.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:12px">${fd.files.map(f => `
      <div style="text-align:center">
        <a href="${url(f)}" target="_blank"><img src="${url(f)}" style="height:96px;
          border-radius:6px;border:1px solid var(--line);display:block"></a>
        <button class="ghost small cv-take" data-name="${esc(f.name)}"
          style="margin-top:6px">Поставить обложкой проекта</button>
      </div>`).join('')}</div>`;
    host.querySelectorAll('.cv-take').forEach(btn => btn.onclick = async () => {
      btn.disabled = true;
      try{
        await post(`/ui/projects/${encodeURIComponent(pid)}/cover`,
                   {service_job_id: jobId, name: btn.dataset.name});
        toast('Обложка поставлена', 'ok');
        await viewProject(pid);         // перерисовать — новая обложка видна в «Результат»
      }catch(e){ toast(e.message); btn.disabled = false; }
    });
  }catch(e){
    host.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
  }
}

// Строка списка «задачи обложек проекта» — общая для первой отрисовки и
// для точечного дополнения тиком (`syncJobsTable`), см. `scenJobRowHtml` выше.
function coverJobRowHtml(j){
  return `<tr data-job="${esc(j.id)}" data-state="${esc(j.state)}" data-print="${esc(jobRowPrint(j))}">
    <td><div style="font-weight:600">${esc(j.title)}</div>
        <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
    <td class="jl-state">${jobListStateCellHtml(j)}</td>
    <td class="muted">${when(j.created)}</td>
  </tr>`;
}
// Тот же приём, что у «Сценария» (см. комментарии там, включая review-feedback-F4
// цикл 3, Issue 1/2 — тик правит таблицу на месте и проверяет актуальность экрана
// после каждого своего ответа), только источник — `GET /ui/covers` (как у #/covers).
async function refreshCoverJobs(box, pid){
  const key = jobListPollKey('cover', pid);
  stopJobLogPoll(key);
  const hashAtStart = location.hash;
  const st = coverState(pid);
  const cd = await api(`/ui/covers?project_id=${encodeURIComponent(pid)}`);
  if (location.hash !== hashAtStart || !box.isConnected) return;   // ушли со страницы, пока список грузился
  const jobs = cd.jobs.slice();
  if (st.lastJob != null){
    const i = jobs.findIndex(j => String(j.id) === String(st.lastJob));
    if (i > 0){ const [j] = jobs.splice(i, 1); jobs.unshift(j); }
  }
  box.innerHTML = `<div class="note muted" style="margin:14px 0 8px">Задачи обложек этого
    проекта — поставленные из этой вкладки, новые сверху.</div>
    ${jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Состояние</th><th>Создана</th></tr></thead>
      <tbody>${jobs.map(coverJobRowHtml).join('')}</tbody></table>
      <div class="note muted">Нажмите на строку — покажутся готовые обложки.</div>`
      : '<div class="empty">У проекта задач обложек пока нет.</div>'}`;
  wireProjectJobRows(box, 'cover', 3, (jid, host) => paintCoverTake(jid, host, pid));

  if (!jobs.some(j => !JOB_LIST_TERMINAL.has(j.state))) return;   // все терминальны — опрашивать нечего
  let busy = false;
  const tick = async () => {
    if (busy) return;
    busy = true;
    try{
      const d2 = await api(`/ui/covers?project_id=${encodeURIComponent(pid)}`);
      if (location.hash !== hashAtStart || !box.isConnected){ stopOwnPoll(key, handle); return; }
      const jobs2 = d2.jobs.slice();
      if (st.lastJob != null){
        const i = jobs2.findIndex(j => String(j.id) === String(st.lastJob));
        if (i > 0){ const [j] = jobs2.splice(i, 1); jobs2.unshift(j); }
      }
      syncJobsTable(box, jobs2, 'cover', coverJobRowHtml, 3,
        (jid, host) => paintCoverTake(jid, host, pid));
      if (!jobs2.some(j => !JOB_LIST_TERMINAL.has(j.state))) stopOwnPoll(key, handle);
    }catch(e){
      // сеть иногда сбоит — список не стираем, следующий тик попробует снова
    }finally{ busy = false; }
  };
  // Два наложившихся вызова оба дошли сюда: снять уже записанный таймер, чтобы он не
  // выпал из реестра и не опрашивал сервис до перезагрузки страницы.
  stopJobLogPoll(key);
  const handle = setInterval(tick, 3000);
  LOG_TIMERS[key] = handle;
}

      <b>${esc(cd.aspect)}</b>, всегда. У обложки YouTube оно одно, поэтому его здесь
      не спрашивают и не дают выбрать; в задачу оно уходит явно, а не «по умолчанию».</div>

  const editBox = card.querySelector('#cv-edit-box');
  const noteBox = card.querySelector('#cv-note');
  function paintFields(){
    const m = st.mode;
    // Текущий выбор языков — считан здесь же, при каждой отрисовке полей, а не из
    // снимка, сделанного один раз при открытии вкладки (Issue 2, review-feedback-F4
    // цикл 1): иначе отметка языка в режиме «По заголовку» не показывала поле
    // заголовка без полной перерисовки вкладки.

    if (m === 'url'){
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px"

        <textarea id="cv-urls" placeholder="https://www.youtube.com/watch?v=…"></textarea>`;
    } else if (m === 'title'){
      fields.innerHTML = langs.length
        ? `<label class="k" style="display:block;margin-bottom:6px">Заголовок на
             каждый язык</label>${langs.map(l => `<div style="display:flex;gap:8px;
             align-items:center;margin-bottom:6px"><span class="muted"
             style="min-width:110px">${esc(l)}</span><input data-lang="${esc(l)}"
             class="cv-title-in" style="flex:1"></div>`).join('')}
           <label class="k" style="display:block;margin:10px 0 6px">Дополнение к промпту</label>
           <input id="cv-extra" style="width:100%;box-sizing:border-box">`
        : '<div class="note">Сначала выберите языки — заголовок задаётся на каждый отдельно.</div>';

      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px">Семя</label>
        <textarea id="cv-seed"></textarea>

           <span><b>Редактировать превью моделью</b>${st.edit

    if (box) box.onchange = e => { st.edit = e.target.checked; paintFields(); };

  const initNote = cd.modes.find(x => x.key === st.mode);
  noteBox.textContent = initNote ? initNote.note : '';

  card.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    st.mode = b.dataset.mode;
    card.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));

      box.checked ? st.langs.add(l.dataset.code) : st.langs.delete(l.dataset.code); };

  card.querySelector('#cv-go').onclick = async () => {
    const btn = card.querySelector('#cv-go');
    btn.disabled = true;
    try{
      // Провайдер и модель — из ТЕКУЩЕГО выбора на момент нажатия «Запустить», а не
      // из значения, посчитанного при отрисовке вкладки (Issue 1, review-feedback-F4
      // цикл 1): иначе смена пункта в списке «Чем генерировать» без полной

      // человек — тот же дефект, что и в #/covers (см. viewCovers ниже).
      const curOpt = cd.options[st.option] || cd.options[0] || {};

                    provider: curOpt.provider || '', model: curOpt.model || '',
                    edit_preview: st.edit, project_id: p.id};

        body.urls = (card.querySelector('#cv-urls').value || '')
          .split(/\s+/).map(x => x.trim()).filter(Boolean);
      } else if (st.mode === 'title'){
        body.titles = {};
        card.querySelectorAll('.cv-title-in').forEach(i => {
          if (i.value.trim()) body.titles[i.dataset.lang] = i.value.trim();
        });
        body.extra_prompt = (card.querySelector('#cv-extra') || {}).value || '';
      } else {
        body.seed = card.querySelector('#cv-seed').value;
        body.n_variants = Number(card.querySelector('#cv-n').value) || 3;
      }
      const out = await post('/ui/covers', body);
      st.lastJob = out.job && out.job.job_id;
      toast('Задача обложки создана', 'ok');
      await refreshCoverJobs(card.querySelector('#cv-jobs'), p.id);
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };
  await refreshCoverJobs(card.querySelector('#cv-jobs'), p.id);

  // 3. Результат — уже стоящая обложка проекта (категория covers, §5.10).
  const mine = d.files.filter(g => (TAB_FILES.cover || []).includes(g.code));
  if (mine.length) for (const g of mine) app.append(fileCard(d, g));
  else app.append(emptyResultCard());

  // 4. Лог задач вида cover.
  app.append(jobsLogCard(d, 'cover'));
}

/* ───────────────────────── экран проекта целиком ───────────────────────── */
async function viewProject(id){
  clearAllLogTimers();
  const [d, presetsData] = await Promise.all([
    api('/ui/projects/' + encodeURIComponent(id)),
    api('/ui/presets'),
  ]);
  const p = d.project;
  const wantTab = location.hash.split('/')[3] || '';
  const tab = PROJECT_TABS.some(([k]) => k === wantTab) ? wantTab : 'scenario';
  app.innerHTML = '';
  app.append($(`<a class="back" href="#/projects">‹ Все проекты</a>
    <div class="head">
      <div><h1 id="pname" title="Нажмите, чтобы переименовать"
             style="cursor:text">${esc(p.name)}</h1>
        <p class="sub"><span class="mono">${esc(p.id)}</span>
          ${p.release_id ? ` · выпуск <a href="#/release/${
            encodeURIComponent(p.release_id)}">${esc(p.release_id)}</a> · фаза ${
            esc(p.phase)}` : ''}</p>
        ${stageStripHtml(p.stage)}
      </div>
      <button id="runall" class="small ghost">Сделать всё</button>
    </div>`));

  // Имя правится прямо в заголовке: при заведении его больше не спрашивают
  // (18.09.2026), и «Проект от 18.09 14:20» в списке из сорока проектов ничего не
  // говорит. Сохраняется по Enter или уходу фокуса, пустое имя не принимается.
  const h1 = app.querySelector('#pname');
  if (h1) h1.onclick = () => {
    if (h1.querySelector('input')) return;
    const was = h1.textContent.trim();
    h1.innerHTML = `<input id="pname-in" value="${esc(was)}"
      style="font-size:inherit;font-weight:inherit;width:min(520px,100%)">`;
    const inp = h1.querySelector('#pname-in');
    inp.focus();
    inp.select();
    const save = async () => {
      const name = inp.value.trim();
      if (!name || name === was){ h1.textContent = was; return; }
      try{
        await post(`/ui/projects/${encodeURIComponent(p.id)}/name`, {name});
        h1.textContent = name;
        toast('Название изменено', 'ok');
      }catch(e){ h1.textContent = was; toast(e.message); }
    };
    inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur();
                            if (ev.key === 'Escape'){ inp.onblur = null; h1.textContent = was; } };
    inp.onblur = save;
  };

  // «Сделать всё» — ровно одна кнопка на экране (ФР §4 п.8), видна на любой вкладке,
  // сама форма сворачиваема, чтобы не занимать место на каждый день.
  const runBox = $(`<div class="card" style="margin-bottom:16px;display:none">
    <div class="sec">Сделать всё</div>
    <div class="secbody">
    <div id="rerr"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div><label class="k" style="display:block;margin-bottom:4px">Предложений на кадр</label>
        <input id="r-spp" placeholder="как в проекте" style="width:110px"></div>
      <div><label class="k" style="display:block;margin-bottom:4px">Модель кадров</label>
        <input id="r-model" placeholder="как в проекте" style="width:150px"></div>
      <div><label class="k" style="display:block;margin-bottom:4px">Озвучка</label>
        <input id="r-engine" placeholder="как в проекте" style="width:120px"></div>
      <div><label class="k" style="display:block;margin-bottom:4px">Качество</label>
        <input id="r-quality" placeholder="как в проекте" style="width:110px"></div>
    </div>
    <div class="note muted">Пустое поле = как в настройках проекта. Озвучка и кадры
      пойдут параллельно, сборка дождётся материалов сама.</div>
    <div class="note muted">Сборку делает отдельная машина. Если рендер-нода не
      запущена, проект дойдёт до сборки и остановится.</div>
    <div style="margin-top:12px"><button id="rgo">Запустить</button></div></div></div>`);
  app.append(runBox);
  app.querySelector('#runall').onclick = () => {
    runBox.style.display = (runBox.style.display === 'none') ? '' : 'none';
  };
  const rerr = runBox.querySelector('#rerr');
  runBox.querySelector('#rgo').onclick = async () => {
    const btn = runBox.querySelector('#rgo');
    rerr.innerHTML = ''; btn.disabled = true;
    try{
      const out = await post(`/ui/projects/${encodeURIComponent(p.id)}/run`, {
        sentences_per_prompt: runBox.querySelector('#r-spp').value,
        model: runBox.querySelector('#r-model').value,
        engine: runBox.querySelector('#r-engine').value,
        quality: runBox.querySelector('#r-quality').value});
      rerr.innerHTML = `<div class="note ${out.enqueued ? 'muted' : 'bad'}">поставлено: ${
        out.enqueued}${out.deferred ? `, отложено: ${out.deferred}` : ''}${
        out.skipped ? `, пропущено (уже идёт): ${out.skipped}` : ''}${
        out.block_reason ? ' — ' + esc(out.block_reason) : ''}</div>`;
      setTimeout(() => viewProject(p.id), 1200);
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  };

  // Панель пресета — только целые (раздел 2 спецификации).
  const vsgenGroup = (presetsData.groups || []).find(g => g.service === 'vsgen');

  // «Во что обошёлся» (`d.paid`) — один раз на экране, здесь в шапке, видна на любой
  // вкладке (review-feedback-F4 цикл 1, Issue 5: карточка была на старом «Обзоре» и
  // молча пропала при переезде на вкладки). `.stage`/`.dot`/`.body`/`.name` — те же
  // классы, что и раньше здесь же, строки от края до края по замыслу (правило батча A
  // — строчные компоненты сами себе отступ); хвостовая подпись — в `.secbody`, чтобы
  // не касаться рамки (Issue 6).
  if (d.paid.length){
    app.append($(`<div class="card" style="margin-bottom:16px">
      <div class="sec">Во что обошёлся</div>
      ${d.paid.map(x => `<div class="stage"><div class="dot s-done">✓</div>
        <div class="body"><div class="name">${esc(x.kind)}: ${x.delivered} оплаченных
          вызовов${x.cost ? ` · ${x.cost.toFixed(0)} кр.` : ''}</div></div></div>`).join('')}
      <div class="secbody">
      <div class="note muted">Это то, что будет выброшено, если проект убрать с диска.</div>
      </div></div>`));
  }

  // Вкладки — адрес вида #/project/{pid}/{tab}, никакой отдельной «Настройки».
  app.append($(`<div class="subtabs">${PROJECT_TABS.map(([k, title]) => {
    const codes = TAB_FILES[k] || [];
    const n = d.files.filter(g => codes.includes(g.code)).reduce((a, g) => a + g.count, 0);
    return `<a href="#/project/${encodeURIComponent(id)}/${k}"
      class="${tab === k ? 'on' : ''}">${esc(title)}${
        n ? ` <span class="muted">${n}</span>` : ''}</a>`;
  }).join('')}</div>`));

  if (tab === 'scenario') await renderScenarioTab(d);
  else if (tab === 'cover') await renderCoverTab(d);
  else await renderStageTab(d, tab);
}

// Дочитывание кадров при прокрутке (18.09.2026). В проекте бывает 300+ кадров: сервер
// отдаёт первую порцию, остальные подтягиваются по мере того, как человек досматривает
// до конца списка. Загруженные миниатюры не перерисовываются — дописываются новые,
// поэтому «переделать» у уже открытой картинки не слетает.
const THUMBS_PAGE = 40;

function wireThumbScroll(card, d, g){
  const box = card.querySelector('.thumbs');
  const mark = card.querySelector('.more-mark');
  if (!box || !mark) return;
  const p = d.project;
  const url = n => d.file_base + n.split('/').map(encodeURIComponent).join('/');
  let loaded = g.names.length;
  let total = g.count;
  let busy = false;
  let stopped = false;
  let everConnected = false;
  const note = html => {
    mark.innerHTML = html != null ? html
      : (loaded < total ? `<div class="note muted">показано ${loaded} из ${total}</div>` : '');
  };
  note();
  if (loaded >= total) return;

  // Конец списка виден (с запасом в экран вперёд) — пора дочитывать. Считаем сами, а не
  // через IntersectionObserver: тот сообщает только о СМЕНЕ видимости, и когда конец
  // списка так и остаётся на экране, второй порции уже не дождаться.
  const nearEnd = () => mark.getBoundingClientRect().top
    < (window.innerHeight || 800) + 400;

  const stop = () => {
    stopped = true;
    window.removeEventListener('scroll', onView);
    window.removeEventListener('resize', onView);
  };

  async function fetchPage(){
    const out = await api(`/ui/projects/${encodeURIComponent(p.id)}/files/${
      encodeURIComponent(g.code)}?offset=${loaded}&limit=${THUMBS_PAGE}`);
    // Экран мог смениться, пока шёл ответ: дописывать в оторванный узел незачем.
    if (!mark.isConnected){ stop(); return; }
    const names = out.names || [];
    total = out.count != null ? out.count : total;
    if (!names.length){ stop(); note(''); return; }
    box.insertAdjacentHTML('beforeend', names.map(n =>
      thumb(url(n) + '?w=160', url(n), n, 78, p.id)).join(''));
    wireRegen(card);
    loaded += names.length;
    note();
    if (loaded >= total) stop();
  }

  async function onView(){
    if (busy || stopped) return;
    if (!mark.isConnected){
      // Первый вызов случается до того, как карточку вставили в страницу: это не повод
      // выключать дочитывание навсегда — выключаем только когда карточку убрали.
      if (everConnected) stop();
      return;
    }
    everConnected = true;
    busy = true;
    try{
      // Пока конец списка на виду — дочитываем дальше: одна порция могла его не сдвинуть.
      while (!stopped && loaded < total && nearEnd()) await fetchPage();
    }catch(e){
      // Сеть сбоит — уже показанное не трогаем, причину говорим и даём дочитать снова
      // кнопкой: молча повторять в цикле значит долбить сервер, который и так отвечает
      // ошибкой.
      note(`<div class="note bad">кадры не дочитались: ${esc(e.message)}
        <button type="button" class="ghost small thumb-retry"
          style="margin-left:8px">Ещё раз</button></div>`);
      const btn = mark.querySelector('.thumb-retry');
      if (btn) btn.onclick = () => { note(); onView(); };
    }finally{ busy = false; }
  }

  window.addEventListener('scroll', onView, {passive: true});
  window.addEventListener('resize', onView);
  // Конец списка может быть виден сразу, без единой прокрутки. Через setTimeout —
  // карточку в страницу вставляет вызывающий код, уже после возврата отсюда.
  setTimeout(onView, 0);
}

/* ───────────────────────── свои ключи ───────────────────────── */

/* Значения ключей сюда не приходят и не уходят: снять можно по номеру в списке,
   добавить — вписав новый. На экране только маска. Разбор и запись делает кабинет
   своим же обработчиком: там ключи правятся по одному, каждый несёт свой лимит,
   и ёмкость дорожки пересчитывается сразу. */
async function wireKeys(root, d){

  const rwDrop = root.querySelector('#rw-drop');
  if (rwDrop) rwDrop.onclick = ev => {
    ev.preventDefault();
    confirmInline(rwDrop, 'Снять свой ключ рерайта? Останется серверный, если он задан.',
      async () => {
        try{ await post('/ui/keys/rewrite', {openai_api_key: ''}); await render(); }
        catch(e){ toast(e.message); }
      });
  };

  root.querySelectorAll('a.dropkey').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    // Ключ снимается сразу и без отмены — спросить обязаны, но не попапом.
    confirmInline(a, 'Снять ключ? Перестанет использоваться сразу.', async () => {
      try{
        await post('/ui/keys', {drop: {[a.dataset.f]: [Number(a.dataset.i)]}});
        await render();
      }catch(e){ toast(e.message); }
    });
  });

  root.querySelector('#addkey').onclick = async () => {
    // Форма ключа — в окне (18.09.2026): в строке карточки она жила криво и мешала
    // читать сам список. Провайдеры спрашиваем у кабинета, как и раньше.
    const ref = await api('/ui/keys/families');
    modal('Добавить ключ', `
      <div class="fldrow"><label>Провайдер</label>
        <select id="kfam">${ref.families.map(f =>
          `<option value="${esc(f.key)}">${esc(f.title)}</option>`).join('')}
          <option value="__rewrite">OpenAI · текст (Rewrite Studio)</option></select></div>
      <div class="fldrow"><label>Ключ</label>
        <input id="kval" type="password" autocomplete="off" style="flex:1;min-width:0"></div>
      <div class="note muted">${esc(ref.note)}</div>
      <div class="note muted">Ключ для текста хранит Rewrite Studio, остальные — кабинет.
        Значение нигде не показывается: в списке видно только хвост.</div>`,
      {ok: 'Сохранить', onOk: async (box, close) => {
        const val = box.querySelector('#kval').value.trim();
        if (!val) throw new Error('Ключ пустой.');
        const fam = box.querySelector('#kfam').value;
        // Ключ рерайта хранит сам Rewrite: второго места хранения секрета не заводим.
        if (fam === '__rewrite') await post('/ui/keys/rewrite', {openai_api_key: val});
        else await post('/ui/keys', {add: {[fam]: [val]}});
        close();
        await render();
      }});
  };
}

/* Поля и их проверка — кабинета: имена совпадают с его формой, а разбирает их его же

const DAY_TITLE = {mon:'пн', tue:'вт', wed:'ср', thu:'чт', fri:'пт', sat:'сб', sun:'вс'};
// Порядок дней — как в неделе, а не как в объекте: тот же порядок у формы канала.
const DAY_ORDER = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
// Названия полей канала для фразы «из пресета приходят: …» — теми же словами, что
// подписаны поля формы.
const CHANNEL_FIELD_TITLE = {tz: 'часовой пояс', schedule: 'расписание',
  horizon_days: 'горизонт', lead_days: 'готовить заранее', deferred: 'отложенные',
  deferred_limit: 'лимит отложенных', preset_vsgen_id: 'пресет производства',
  host_id: 'машина заливки', niche: 'ниша', collaborator: 'соавтор'};

async function wireChannelEdit(root, c, chp){
  const box = root.querySelector('#editbox');
  const ref = await api('/ui/channels/new');
  // Пресет канала (18.09.2026): привязка живая — пока канал на пресете, перекрытые
  // поля приходят из него, и править их в канале нельзя. Иначе форма показала бы
  // унаследованное значение и сохранила его как собственное значение канала.
  const inherited = new Set((chp && chp.inherited) || []);
  const own = (chp && chp.own) || {};

  root.querySelector('#statusbtns').innerHTML = ref.statuses
    .filter(s => s.key !== c.status)
    .map(s => `<button class="ghost chst" data-s="${s.key}">${esc(s.title)}</button>`)
    .join('');
  root.querySelectorAll('button.chst').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await post(`/ui/channels/${c.id}/status`, {status: b.dataset.s}); await render(); }
    catch(e){ b.disabled = false; toast(e.message); }
  });

  // Форма строится сразу при открытии вкладки (доработка §5, Дополнение 16.09):
  // кнопки «Настроить» и промежуточного состояния «свёрнуто» больше нет.
  {
    // «*» в расписании означает «каждый день»: без этого галочки дней оставались
    // пустыми у канала, который выходит ежедневно (жалоба владельца 18.09.2026).
    // В форме — СВОИ значения канала: пресет их только перекрывает на чтение.
    const ownSched = (() => {
      try{ return JSON.parse(own.schedule || '{}'); }catch(e){ return {}; }
    })();
    // Показываем ДЕЙСТВУЮЩЕЕ значение (из пресета, если оно оттуда), но поле гасим:
    // человек видит, как канал живёт на самом деле, и не может случайно записать это
    // значение как собственное. При сохранении вместо погашенных полей уходят
    // собственные значения канала — они не должны потеряться при отвязке от пресета.
    const off = k => inherited.has(k) ? ' disabled title="приходит из пресета канала"' : '';
    const schedSrc = c.schedule || {};
    const schedKeys2 = Object.keys(schedSrc);
    const picked = new Set(schedKeys2.includes('*')
      ? ref.days.filter(x => x !== ref.any_day) : schedKeys2);
    const times = [...new Set(Object.values(c.schedule || {}).flat())].join(', ');
    const sel = (id, items, cur, label, key) => `<div class="fldrow"><label>${label}</label>
      <select id="${id}"${key ? off(key) : ''}><option value="">— не выбран —</option>${items.map(i =>
        `<option value="${esc(String(i.value))}" ${String(i.value) === String(cur ?? '')
          ? 'selected' : ''}>${esc(i.title)}</option>`).join('')}</select></div>`;
    // Дополнение 16.09, вопрос 1: ID можно вписать только в пустое поле — уже
    // заданный UC «не меняется после создания» (см. `pub_ui.set_channel_uc`), поэтому
    // показываем его как чтение с пояснением, а не как ещё одно редактируемое поле.
    const ucField = c.uc
      ? `<div class="fldrow"><label>ID канала</label>
           <span class="mono">${esc(c.uc)}</span></div>
         <div class="note muted">Не меняется после создания: неверный ID — ролик
           на чужом канале.</div>`
      : `<div class="fldrow"><label>ID канала</label>
           <input id="f-uc" placeholder="UCK8sQmJBp8GCxrOtXWBpyEA" style="width:300px"></div>
         <div class="note muted">Задайте, когда узнаете, — сохранить можно один раз,
           потом изменить будет нельзя.</div>`;
    const chpOptions = ((chp && chp.all) || []).map(p =>
      `<option value="${p.id}"${String(p.id) === String(chp.id || '') ? ' selected' : ''}
        >${esc(p.name)}</option>`).join('');
    const inheritNote = inherited.size
      ? `<div class="note muted">Из пресета канала приходят: ${
          [...inherited].map(k => esc(CHANNEL_FIELD_TITLE[k] || k)).join(', ')}.
         Эти поля здесь не правятся — правьте их в пресете, и изменится у всех каналов
         на нём.</div>`
      : '';
    box.innerHTML = `
      <div id="cherr"></div>
      <div class="fldrow"><label>Пресет канала</label>
        <select id="f-chp" style="width:230px">
          <option value="">— свои настройки —</option>${chpOptions}</select>
        <a href="#/presets" class="muted" style="font-size:12px">завести и править →</a></div>
      ${inheritNote}
      ${ucField}
      <div class="fldrow"><label>Название</label>
        <input id="f-name" value="${esc(c.name)}" style="width:300px"></div>
      <div class="fldrow"><label>Хэндл / язык / ниша</label>
        <input id="f-handle" value="${esc(c.handle || '')}" style="width:150px">
        ${langOptionsHtml(ref.languages || [], c.lang_raw ?? c.lang ?? '')}
        <input id="f-niche" value="${esc(c.niche || '')}" style="width:180px"${off('niche')}></div>
      <div class="fldrow"><label>Дни</label>
        <span class="langs" style="max-height:none;border:0;padding:0">${
          ref.days.filter(x => x !== ref.any_day).map(dk =>
            `<label data-day="${dk}" class="${picked.has(dk) ? 'on' : ''}"><input
              type="checkbox" ${picked.has(dk) ? 'checked' : ''}${off('schedule')}>${
              DAY_TITLE[dk] || dk}</label>`).join('')}</span></div>
      <div class="fldrow"><label>Время выходов</label>
        <input id="f-times" value="${esc(times)}" placeholder="10:00, 18:00"
          style="width:220px"${off('schedule')}></div>
      <div class="fldrow"><label>Часовой пояс</label>
        <input id="f-tz" value="${esc(c.tz)}" style="width:200px"${off('tz')}></div>
      <div class="fldrow"><label>Горизонт / заранее</label>
        <input id="f-hor" type="number" min="1" max="90" value="${c.horizon_days}"
          style="width:80px"${off('horizon_days')}> дн
        <input id="f-lead" type="number" min="0" max="30" value="${c.lead_days}"
          style="width:80px"${off('lead_days')}> дн</div>
      <div class="fldrow"><label>Отложенные</label>
        <label style="font-weight:400"><input type="checkbox" id="f-def"
          ${c.deferred ? 'checked' : ''}${off('deferred')}> копить</label>
        <input id="f-deflim" type="number" min="1" max="200"

      ${sel('f-prof', ref.profiles.map(p => ({value: p.id, title: p.title})),

      ${sel('f-host', ref.hosts.map(h => ({value: h.id, title: h.title})),
            c.host_id, 'Машина заливки', 'host_id')}
      ${sel('f-pv', ref.presets.vsgen.map(p => ({value: p.id, title: p.name})),
            c.preset_vsgen_id, 'Пресет', 'preset_vsgen_id')}
      <div class="note muted">Текст и обложка берутся из него же — группы
        «Сценарий» и «Обложка» внутри пресета. Сейчас: рерайт
        «${esc(c.presets.rewrite || 'не задан')}», обложка
        «${esc(c.presets.cover || 'не задана')}».${c.preset_vsgen_id
          ? ` <a href="#/preset/${c.preset_vsgen_id}">Открыть пресет →</a>` : ''}</div>
      <div class="fldrow"><label>Заметка</label>
        <input id="f-note" value="${esc(c.note || '')}" style="width:100%"></div>
      <div style="margin-top:12px"><button id="save">Сохранить</button></div>`;

    box.querySelectorAll('span.langs label').forEach(l => {
      const cb = l.querySelector('input');
      cb.onchange = () => l.classList.toggle('on', cb.checked);
    });
    // Привязка сохраняется сразу: это не «одно из полей формы», а решение, откуда
    // канал берёт настройки, и от него зависит, что вообще показывать в форме.
    box.querySelector('#f-chp').onchange = async e => {
      const val = e.target.value;
      try{
        await post(`/ui/channels/${c.id}/channel-preset`,
                   {preset_id: val ? Number(val) : null});
        toast(val ? 'Канал посажен на пресет' : 'Канал снят с пресета', 'ok');
        await render();
      }catch(err){ toast(err.message); e.target.value = chp.id || ''; }
    };

    box.querySelector('#save').onclick = async () => {
      const err = box.querySelector('#cherr');
      err.innerHTML = '';
      const days = [...box.querySelectorAll('span.langs label')]
        .filter(l => l.querySelector('input').checked).map(l => l.dataset.day);
      const v = id => box.querySelector('#' + id).value;
      // Поля, которые сейчас приходят из пресета, в форме погашены — и отправляем за
      // них СОБСТВЕННЫЕ значения канала: иначе кабинет записал бы вместо них
      // умолчания, и при снятии с пресета канал получил бы не свои настройки.
      const ownSchedObj = (() => {
        try{ return JSON.parse(own.schedule || '{}'); }catch(e){ return {}; }
      })();
      const ownDays = Object.keys(ownSchedObj).includes('*')
        ? ref.days.filter(x => x !== ref.any_day)
        : Object.keys(ownSchedObj);
      const ownTimes = [...new Set(Object.values(ownSchedObj).flat())].join(', ');
      const pick = (key, formValue, ownValue) =>
        inherited.has(key) ? (ownValue ?? '') : formValue;
      try{
        // ID — отдельным запросом и только если поле вообще есть (канал ещё без ID)
        // и что-то в него вписали: пустое поле здесь значит «не сейчас», а не «стереть».
        const ucInput = box.querySelector('#f-uc');
        if (ucInput && ucInput.value.trim()){
          await post(`/ui/channels/${c.id}/uc`, {uc: ucInput.value});
          // Доработка ревьюера (code review, итерация 2, Issue 3): ID уже записан на
          // сервере. Если вторым запросом ниже упадут остальные настройки, повторное
          // нажатие «Сохранить» не должно снова слать тот же ID — сервер его больше не
          // примет («уже задан»), а пользователь так и не сохранит исправленные поля.
          // Переводим поле в чтение сразу, без ожидания перерисовки всей формы.
          c.uc = ucInput.value.trim();
          const ucRow = ucInput.closest('.fldrow');
          if (ucRow) ucRow.innerHTML =
            `<label>ID канала</label><span class="mono">${esc(c.uc)}</span>`;
        }
        await post(`/ui/channels/${c.id}`, {
          name: v('f-name'), handle: v('f-handle'), lang: v('f-lang'),
          niche: pick('niche', v('f-niche'), own.niche),
          tz: pick('tz', v('f-tz'), own.tz),
          times: pick('schedule', v('f-times'), ownTimes),
          days: inherited.has('schedule') ? ownDays : days,
          horizon_days: pick('horizon_days', v('f-hor'), own.horizon_days),
          lead_days: pick('lead_days', v('f-lead'), own.lead_days),
          deferred: inherited.has('deferred')
            ? (own.deferred ? '1' : '')
            : (box.querySelector('#f-def').checked ? '1' : ''),
          deferred_limit: pick('deferred_limit', v('f-deflim'), own.deferred_limit),
          profile_id: v('f-prof'),
          host_id: pick('host_id', v('f-host'), own.host_id),
          // Текст и обложку канал больше не хранит: их держит пресет. Старые значения
          // отправляем как есть — обнулить их значило бы остановить выпуски каналов,
          // у которых пресет про соседей ещё не знает.
          preset_vsgen_id: pick('preset_vsgen_id', v('f-pv'), own.preset_vsgen_id),
          preset_rewrite: c.preset_rewrite || '',
          preset_cover: c.preset_cover || '', note: v('f-note'),
        });
        await render();
      }catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  }
}

/* ────────────────────────── результаты задачи ────────────────────────── */

/* Один блок на оба сервиса: у Rewrite и Cover результаты устроены одинаково —
   список имён и файл по имени. Смысл в том, чтобы не уходить с экрана: увидеть,
   что получилось, и забрать — там же, где задача. */
const RESULT_OPEN = new Set();

async function paintResults(service, jobId, host){
  try{
    const d = await api(`/ui/files/${encodeURIComponent(service)}/${encodeURIComponent(jobId)}`);
    if (!d.files.length){ host.innerHTML = '<span class="muted">Файлов пока нет.</span>'; return; }
    // Ссылки и <img src> идут мимо api() — префикс им нужен свой.
    const url = f => `${API}/ui/files/${encodeURIComponent(service)}/${
      encodeURIComponent(jobId)}/${encodeURIComponent(f.name)}`;
    const imgs = d.files.filter(f => f.kind === 'image');
    const rest = d.files.filter(f => f.kind !== 'image');
    host.innerHTML = `
      ${imgs.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        ${imgs.map(f => `<a href="${url(f)}" target="_blank" title="${esc(f.name)}"
          ><img src="${url(f)}" style="height:96px;border-radius:6px;
          border:1px solid var(--line);display:block"></a>`).join('')}</div>` : ''}
      ${rest.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">
        ${rest.map(f => `<a href="${url(f)}" target="_blank"
          style="display:inline-block;padding:4px 10px;border:1px solid var(--line);
                 border-radius:6px;text-decoration:none;font-size:12px"
          >${esc(f.name)}</a>`).join('')}</div>` : ''}`;
  }catch(e){
    host.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
  }
}

function wireResults(root, service){
  root.querySelectorAll('tr[data-job]').forEach(tr => {
    tr.style.cursor = 'pointer';
    tr.onclick = ev => {
      if (ev.target.closest('button, a')) return;   // кнопки строки — не раскрытие
      const id = tr.dataset.job;
      const key = service + ':' + id;
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('res-row')){
        next.remove(); RESULT_OPEN.delete(key); return;
      }
      RESULT_OPEN.add(key);
      tr.insertAdjacentHTML('afterend',
        '<tr class="res-row"><td colspan="9" style="padding-top:0">' +
        '<div class="muted">загрузка…</div></td></tr>');
      paintResults(service, id, tr.nextElementSibling.querySelector('div'));
    };
    if (RESULT_OPEN.has(service + ':' + tr.dataset.job)) tr.click();
  });
}

/* ─────────────────────────────── текст ─────────────────────────────── */

/* Рерайт и генерация с нуля — один экран (ТЗ §05). Разница между ними только
   в источнике: ссылка, свой текст или тема. Три разных экрана для трёх источников
   одной и той же работы — это и была «разбивка на тысячу интерфейсов». */
let TEXT_FORM = {mode:'link', langs:new Set(), model:'', preset:''};

async function viewText(){
  const d = await api('/ui/text');
  app.innerHTML = '';
  app.append($(`<h1>Текст</h1>
    <p class="sub">Рерайт по ссылке, рерайт своего текста и генерация с нуля.</p>`));

  if (!TEXT_FORM.model && d.models.length) TEXT_FORM.model = d.models[0].value;
  const mode = () => d.modes.find(m => m.key === TEXT_FORM.mode) || d.modes[0];

  const form = $(`<div class="card" style="padding:16px;margin-bottom:16px">
    <div id="err"></div>
    <div class="modes">${d.modes.map(m => `
      <button data-mode="${m.key}" class="${m.key === TEXT_FORM.mode ? 'on' : ''}"
        >${esc(m.title)}</button>`).join('')}</div>
    <div class="note muted" style="margin-bottom:10px">${esc(mode().note)}</div>

    <label class="k" style="display:block;margin-bottom:6px" id="src-label"></label>
    <input id="src-one" placeholder="https://www.youtube.com/watch?v=…"
           style="width:100%;box-sizing:border-box;padding:9px 11px;
                  border:1px solid var(--border);border-radius:7px;font:inherit">
    <textarea id="src-many" placeholder="Вставьте текст"></textarea>

    <div id="preset-box" style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Бриф</label>
      <select id="preset" style="min-width:280px">
        <option value="">— выберите бриф —</option>
        ${d.presets.generation.map(p => `<option>${esc(p)}</option>`).join('')}
      </select>
      ${d.presets.generation.length ? '' :
        '<div class="note muted">Брифов нет. Создать их можно в разделе Rewrite.</div>'}
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Модель</label>
      <select id="model" style="min-width:280px">${d.models.map(m =>
        `<option value="${esc(m.value)}" ${m.value === TEXT_FORM.model ? 'selected' : ''}
          >${esc(m.label)}</option>`).join('')}</select>
      <div class="note muted">${d.models.length
        ? 'Показаны только модели, под которые у вас есть ключ или подписка.'
        : 'Ни одной доступной модели: нет ни своего ключа, ни серверного.'}</div>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="langs">${d.languages.map(l => `
        <label data-code="${esc(l.code)}"><input type="checkbox"
          ${TEXT_FORM.langs.has(l.code) ? 'checked' : ''}>${esc(l.title)}</label>`).join('')}
      </div>
    </div>

    <div style="margin-top:14px"><button id="go">Запустить</button></div>
    <div id="res"></div>
  </div>`);
  app.append(form);

  const one = form.querySelector('#src-one');
  const many = form.querySelector('#src-many');
  const presetBox = form.querySelector('#preset-box');
  const label = form.querySelector('#src-label');

  function paint(){
    const m = TEXT_FORM.mode;
    label.textContent = m === 'link' ? 'Ссылка на ролик-донор'
                      : m === 'text' ? 'Текст' : 'Тема';
    one.hidden = (m === 'text');
    many.hidden = (m !== 'text');
    presetBox.hidden = (m !== 'topic');
    one.placeholder = m === 'link' ? 'https://www.youtube.com/watch?v=…'
                                   : 'О чём должен быть ролик';
  }
  paint();

  form.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    TEXT_FORM.mode = b.dataset.mode;
    render();
  });
  form.querySelectorAll('#langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? TEXT_FORM.langs.add(l.dataset.code)
                  : TEXT_FORM.langs.delete(l.dataset.code); };
    sync();
    box.onchange = sync;
  });
  form.querySelector('#model').onchange = e => TEXT_FORM.model = e.target.value;
  form.querySelector('#preset').onchange = e => TEXT_FORM.preset = e.target.value;

  const errBox = form.querySelector('#err');
  const resBox = form.querySelector('#res');
  const btn = form.querySelector('#go');
  btn.onclick = async () => {
    errBox.innerHTML = ''; resBox.innerHTML = ''; btn.disabled = true;
    btn.textContent = 'Отправляю…';
    try{
      const out = await post('/ui/text', {
        mode: TEXT_FORM.mode,
        source: (TEXT_FORM.mode === 'text' ? many.value : one.value),
        languages: [...TEXT_FORM.langs],
        model: TEXT_FORM.model,
        preset: TEXT_FORM.preset,
      });
      resBox.innerHTML = `<div class="res">Задача создана${
        out.chars ? ` · текста ${out.chars} знаков` : ''}.</div>`;
      one.value = ''; many.value = '';
      setTimeout(render, 600);
    }catch(e){
      errBox.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }finally{ btn.disabled = false; btn.textContent = 'Запустить'; }
  };

  const list = $(`<div class="card">
    <div class="sec">Задачи текста</div>
    ${d.jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Вид</th><th>Языки</th><th>Состояние</th><th>Создана</th><th></th>
      </tr></thead><tbody>${d.jobs.map(j => `<tr data-job="${esc(j.id)}">
        <td><div style="font-weight:600">${esc(j.title)}</div>
            <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
        <td>${j.kind === 'generation' ? 'с нуля' : 'рерайт'}</td>
        <td>${(Array.isArray(j.langs) ? j.langs : [j.langs]).map(esc).join(', ') || '—'}</td>
        <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
            ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
            ${j.progress != null ? `<div class="bar"><i style="width:${
              Math.round(j.progress * 100)}%"></i></div>` : ''}</td>
        <td class="muted">${when(j.created)}</td>
        <td style="white-space:nowrap">${actions({service:'rewrite', id:j.id,
                                                  state:j.state, status:j.status})}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Задач текста пока нет.</div>'}
    ${d.jobs.length ? '<div class="note muted">Нажмите на строку — покажется результат.</div>' : ''}
  </div>`);
  app.append(list);
  wireActions(list);
  wireResults(list, 'rewrite');
}

/* ─────────────────────────────── обложки ─────────────────────────────── */

/* Стратегия выбирается ДО показа полей (ТЗ §10). Раньше это была одна простыня, где
   половина полей молча не работала: они относились к другой стратегии. */
let COVER_FORM = {mode:'url', langs:new Set(), preset:'', option:0,
                  edit:false, n:3};

async function viewCovers(){
  const d = await api('/ui/covers');
  app.innerHTML = '';
  app.append($(`<h1>Обложки</h1>
    <p class="sub">Сначала выберите, как делаем обложку.</p>`));

  const mode = () => d.modes.find(m => m.key === COVER_FORM.mode) || d.modes[0];
  const langs = [...COVER_FORM.langs];

  const form = $(`<div class="card" style="padding:16px;margin-bottom:16px">
    <div id="err"></div>
    <div class="modes">${d.modes.map((m, i) => `
      <button data-mode="${m.key}" class="${m.key === COVER_FORM.mode ? 'on' : ''}"
        >${esc(m.title)}</button>`).join('')}</div>
    <div class="note muted" style="margin-bottom:10px">${esc(mode().note)}</div>

    <div id="fields"></div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Пресет</label>
      <select id="preset" style="min-width:280px">
        <option value="">— без пресета —</option>
        ${d.presets.map(p => `<option ${p === COVER_FORM.preset ? 'selected' : ''}
          >${esc(p)}</option>`).join('')}</select>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Чем генерировать</label>
      <select id="option" style="min-width:280px">${d.options.map((o, i) =>
        `<option value="${i}" ${i === COVER_FORM.option ? 'selected' : ''}>${esc(o.label)}${
          o.admin_only ? ' — платит владелец' : ''}</option>`).join('')}</select>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="langs">${d.languages.map(l => `
        <label data-code="${esc(l)}"><input type="checkbox"
          ${COVER_FORM.langs.has(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}
      </div>
    </div>

    <div id="edit-box" style="margin-top:12px"></div>

    <div class="note muted" style="margin-top:12px">Соотношение сторон —
      <b>${esc(d.aspect)}</b>, всегда. У обложки YouTube оно одно, поэтому его здесь
      не спрашивают и не дают выбрать; в задачу оно уходит явно, а не «по умолчанию».</div>

    <div style="margin-top:14px"><button id="go">Запустить</button></div>
    <div id="res"></div>
  </div>`);
  app.append(form);

  const fields = form.querySelector('#fields');
  const editBox = form.querySelector('#edit-box');

  function paintFields(){
    const m = COVER_FORM.mode;
    if (m === 'url'){
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px"
        >Ссылки на доноров, по одной в строке</label>
        <textarea id="urls" placeholder="https://www.youtube.com/watch?v=…"></textarea>`;
    } else if (m === 'title'){
      fields.innerHTML = langs.length
        ? `<label class="k" style="display:block;margin-bottom:6px">Заголовок на каждый язык</label>
           ${langs.map(l => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
             <span class="muted" style="min-width:120px">${esc(l)}</span>
             <input data-lang="${esc(l)}" class="title-in" placeholder="Текст на обложке"
               style="flex:1;padding:8px 10px;border:1px solid var(--border);
                      border-radius:7px;font:inherit"></div>`).join('')}
           <label class="k" style="display:block;margin:10px 0 6px">Дополнение к промпту</label>
           <input id="extra" style="width:100%;box-sizing:border-box;padding:9px 11px;
             border:1px solid var(--border);border-radius:7px;font:inherit">`
        : '<div class="note">Сначала выберите языки — заголовок задаётся на каждый отдельно.</div>';
    } else {
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px">Семя</label>
        <textarea id="seed" placeholder="Описание сцены, из которого рождаются варианты"></textarea>
        <label class="k" style="display:block;margin:10px 0 6px">Вариантов на язык</label>
        <input id="n" type="number" min="1" max="8" value="${COVER_FORM.n}"
          style="width:90px;padding:8px 10px;border:1px solid var(--border);
                 border-radius:7px;font:inherit">`;
    }

    // Редактирование превью — ОТДЕЛЬНЫЙ выбор, а не следствие приложенного референса.
    // Пока это следствие, человек прикладывает картинку «для стиля» и незаметно
    // выключает половину пресета.
    const killed = d.rules.find(r => r.when === 'edit');
    editBox.innerHTML = COVER_FORM.mode === 'url'
      ? `<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
           <input type="checkbox" id="edit" ${COVER_FORM.edit ? 'checked' : ''}>
           <span><b>Редактировать превью моделью</b>
             <div class="note muted">Превью донора уходит в модель целиком.
               ${COVER_FORM.edit ? `Тогда НЕ действуют: ${killed.kills.join(', ')} —
                 ${esc(killed.why)}.` : ''}</div></span></label>`
      : `<div class="note muted">${esc((d.rules.find(r => r.when === 'not_url') || {}).why || '')}.</div>`;
    const box = editBox.querySelector('#edit');
    if (box) box.onchange = e => { COVER_FORM.edit = e.target.checked; paintFields(); };
  }
  paintFields();

  form.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    COVER_FORM.mode = b.dataset.mode; render();
  });
  form.querySelectorAll('#langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? COVER_FORM.langs.add(l.dataset.code)
                  : COVER_FORM.langs.delete(l.dataset.code); };
    sync();
    box.onchange = () => { sync(); if (COVER_FORM.mode === 'title') render(); };

  form.querySelector('#preset').onchange = e => COVER_FORM.preset = e.target.value;
  form.querySelector('#option').onchange = e => COVER_FORM.option = Number(e.target.value);

  const errBox = form.querySelector('#err');
  const resBox = form.querySelector('#res');
  const btn = form.querySelector('#go');
  btn.onclick = async () => {
    errBox.innerHTML = ''; resBox.innerHTML = ''; btn.disabled = true;
    btn.textContent = 'Отправляю…';
    try{
      // Провайдер и модель — из ТЕКУЩЕГО выбора на момент нажатия «Запустить», не из
      // значения, посчитанного при отрисовке экрана (review-feedback-F4 цикл 2,
      // Issue 1 — «тот же файл и тот же дефект с деньгами», что и в проектной
      // вкладке «Обложка»): `#option.onchange` меняет только `COVER_FORM.option`, без
      // перерисовки, и платный вызов уходил бы провайдеру не того пункта списка.
      const curOpt = d.options[COVER_FORM.option] || d.options[0] || {};
      const body = {mode: COVER_FORM.mode, preset: COVER_FORM.preset,
                    languages: [...COVER_FORM.langs],
                    provider: curOpt.provider || '', model: curOpt.model || '',
                    edit_preview: COVER_FORM.edit};
      if (COVER_FORM.mode === 'url'){
        body.urls = (form.querySelector('#urls').value || '')
          .split(/\s+/).map(x => x.trim()).filter(Boolean);
      } else if (COVER_FORM.mode === 'title'){
        body.titles = {};
        form.querySelectorAll('.title-in').forEach(i => {
          if (i.value.trim()) body.titles[i.dataset.lang] = i.value.trim();
        });
        body.extra_prompt = (form.querySelector('#extra') || {}).value || '';
      } else {
        body.seed = form.querySelector('#seed').value;
        body.n_variants = Number(form.querySelector('#n').value) || 3;
      }
      await post('/ui/covers', body);
      resBox.innerHTML = '<div class="res">Задача создана.</div>';
      setTimeout(render, 600);
    }catch(e){
      errBox.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }finally{ btn.disabled = false; btn.textContent = 'Запустить'; }
  };

  const list = $(`<div class="card">
    <div class="sec">Задачи обложек</div>
    ${d.jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Состояние</th><th>Готово</th><th>Создана</th><th></th>
      </tr></thead><tbody>${d.jobs.map(j => `<tr data-job="${esc(j.id)}">
        <td><div style="font-weight:600">${esc(j.title)}</div>
            <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
        <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
            ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
            ${j.progress != null ? `<div class="bar"><i style="width:${
              Math.round(j.progress * 100)}%"></i></div>` : ''}</td>
        <td>${j.results || '—'}</td>
        <td class="muted">${when(j.created)}</td>
        <td style="white-space:nowrap">${actions({service:'cover', id:j.id,
                                                  state:j.state, status:j.status})}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Задач обложек пока нет.</div>'}
    ${d.jobs.length ? '<div class="note muted">Нажмите на строку — покажутся готовые обложки.</div>' : ''}
  </div>`);
  app.append(list);
  wireActions(list);
  wireResults(list, 'cover');
}

/* ───────────────── спросить, не выходя из страницы ───────────────── */
// Браузерные prompt() и confirm() останавливают страницу целиком, выглядят чужими и на
// части браузеров блокируются вместе с попапами. Спрашиваем там же, где нажали.

function inlineBox(btn){
  let box = btn.parentElement.querySelector('.inline-ask');
  if (box) box.remove();
  box = document.createElement('div');
  box.className = 'inline-ask';
  btn.parentElement.insertBefore(box, btn.nextSibling);
  return box;
}

// Вместо prompt(): поле рядом с кнопкой. Enter — принять, Esc — отменить.
function askInline(btn, opts, onOk){
  const box = inlineBox(btn);
  box.innerHTML = `<input class="ask-in" placeholder="${esc(opts.placeholder || '')}"
      value="${esc(opts.value || '')}">
    <button class="small ask-ok">${esc(opts.ok || 'Готово')}</button>
    <button class="ghost small ask-no">Отмена</button>`;
  const input = box.querySelector('.ask-in');
  input.focus();
  input.select();
  const done = () => box.remove();
  box.querySelector('.ask-no').onclick = done;
  box.querySelector('.ask-ok').onclick = async () => {
    const v = input.value.trim();
    if (!v) return input.focus();
    done();
    await onOk(v);
  };
  input.onkeydown = e => {
    if (e.key === 'Enter'){ e.preventDefault(); box.querySelector('.ask-ok').click(); }
    if (e.key === 'Escape') done();
  };
}

// Вместо confirm(): вопрос рядом с кнопкой. Нужен только там, где действие необратимо.
// Окно для формы, которой тесно в строке: ключ, пресет обложки, бриф сценария.
// Возвращает {el, body, close}: содержимое рисует вызывающий, кнопка «Сохранить» и
// показ ошибки — здесь, потому что они одинаковы у всех таких форм.
function modal(title, bodyHtml, opts){
  const o = opts || {};
  // $() возвращает обёртку-div, а нам нужен сам <dialog>: showModal() есть только у него.
  const dlg = $(`<dialog class="modal">
    <div class="sec">${esc(title)}<button class="x" title="Закрыть">×</button></div>
    <div class="mbody">${bodyHtml}</div>
    <div class="mfoot"><button class="m-ok">${esc(o.ok || 'Сохранить')}</button>
      <button class="ghost m-no">Отмена</button>
      <span class="note bad m-err" style="margin:0"></span></div>
  </dialog>`).firstElementChild;
  document.body.append(dlg);
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('.x').onclick = close;
  dlg.querySelector('.m-no').onclick = close;
  // Клик по фону — это клик по самому <dialog> вне его содержимого.
  dlg.onclick = ev => { if (ev.target === dlg) close(); };
  dlg.addEventListener('cancel', ev => { ev.preventDefault(); close(); });
  const err = dlg.querySelector('.m-err');
  const ok = dlg.querySelector('.m-ok');
  ok.onclick = async () => {
    err.textContent = '';
    ok.disabled = true;
    try{
      await o.onOk(dlg.querySelector('.mbody'), close);
    }catch(e){ err.textContent = e.message; }
    finally{ ok.disabled = false; }
  };
  dlg.showModal();
  const first = dlg.querySelector('.mbody input,.mbody textarea,.mbody select');
  if (first) first.focus();
  return {el: dlg, body: dlg.querySelector('.mbody'), close};
}

function confirmInline(btn, text, onOk){
  const box = inlineBox(btn);
  box.innerHTML = `<span class="muted">${esc(text)}</span>
    <button class="small ask-ok">Да</button>
    <button class="ghost small ask-no">Нет</button>`;
  box.querySelector('.ask-no').onclick = () => box.remove();
  box.querySelector('.ask-ok').onclick = async () => { box.remove(); await onOk(); };
}
