    const inheritNote = inherited.size
      ? `<div class="note muted">Из пресета канала приходят: ${
          [...inherited].map(k => esc(CHANNEL_FIELD_TITLE[k] || k)).join(', ')}.
         Эти поля здесь не правятся — правьте их в пресете, и изменится у всех каналов
         на нём.</div>`
      : '';
    box.innerHTML = `
      <div id="cherr"></div>
      <div class="fldrow"><label>Пресет канала</label>
        <select id="f-chp" style="width:230px">
          <option value="">— свои настройки —</option>${chpOptions}</select>
        <a href="#/presets" class="muted" style="font-size:12px">завести и править →</a></div>
      ${inheritNote}
      ${ucField}
      <div class="fldrow"><label>Название</label>
        <input id="f-name" value="${esc(c.name)}" style="width:300px"></div>
      <div class="fldrow"><label>Хэндл / язык / ниша</label>
        <input id="f-handle" value="${esc(c.handle || '')}" style="width:150px">
        ${langOptionsHtml(ref.languages || [], c.lang_raw ?? c.lang ?? '')}
        <input id="f-niche" value="${esc(c.niche || '')}" style="width:180px"${off('niche')}></div>
      <div class="fldrow"><label>Дни</label>
        <span class="langs days" style="max-height:none;border:0;padding:0">${
          ref.days.filter(x => x !== ref.any_day).map(dk =>
            `<label data-day="${dk}" class="${picked.has(dk) ? 'on' : ''}"><input
              type="checkbox" ${picked.has(dk) ? 'checked' : ''}${off('schedule')}>${
              DAY_TITLE[dk] || dk}</label>`).join('')}</span></div>
      <div class="fldrow"><label>Время выходов</label>
        <input id="f-times" value="${esc(times)}" placeholder="10:00, 18:00"
          style="width:220px"${off('schedule')}></div>
      <div class="fldrow"><label>Часовой пояс</label>
        <input id="f-tz" value="${esc(c.tz)}" style="width:200px"${off('tz')}></div>
      <div class="fldrow"><label>Горизонт / заранее</label>
        <input id="f-hor" type="number" min="1" max="90" value="${c.horizon_days}"
          style="width:80px"${off('horizon_days')}> дн
        <input id="f-lead" type="number" min="0" max="30" value="${c.lead_days}"
          style="width:80px"${off('lead_days')}> дн</div>
      <div class="fldrow"><label>Отложенные</label>
        <label style="font-weight:400"><input type="checkbox" id="f-def"
          ${c.deferred ? 'checked' : ''}${off('deferred')}> копить</label>
        <input id="f-deflim" type="number" min="1" max="200"
          value="${c.deferred_limit ?? 5}" style="width:80px"${off('deferred_limit')}> шт</div>
      ${sel('f-prof', profItems, c.profile_id, 'Профиль AdsPower')}
      ${curProfileMissing ? `<div class="note bad">Текущий профиль пропал с машины
        при последней описи. Сохранение формы его не сотрёт — но стоит завести
        профиль заново на машине или выбрать другой.</div>` : ''}
      ${sel('f-host', ref.hosts.map(h => ({value: h.id, title: h.title})),
            c.host_id, 'Машина заливки', 'host_id')}
      ${sel('f-pv', ref.presets.vsgen.map(p => ({value: p.id, title: p.name})),
            c.preset_vsgen_id, 'Пресет', 'preset_vsgen_id')}
      <div class="note muted">Сейчас: рерайт
        «${esc(c.presets.rewrite || 'не задан')}», обложка
        «${esc(c.presets.cover || 'не задана')}» ${hintDot('Текст и обложка берутся из '
          + 'того же пресета — это группы «Сценарий» и «Обложка» внутри него.')}${
          c.preset_vsgen_id
          ? ` <a href="#/preset/${c.preset_vsgen_id}">Открыть пресет →</a>` : ''}</div>
      <div class="fldrow"><label>Заметка</label>
        <input id="f-note" value="${esc(c.note || '')}" style="width:100%"></div>
      <div style="margin-top:12px"><button id="save">Сохранить</button></div>`;

    box.querySelectorAll('span.langs label').forEach(l => {
      const cb = l.querySelector('input');
      cb.onchange = () => l.classList.toggle('on', cb.checked);
    });
    // Привязка сохраняется сразу: это не «одно из полей формы», а решение, откуда
    // канал берёт настройки, и от него зависит, что вообще показывать в форме.
    box.querySelector('#f-chp').onchange = async e => {
      const val = e.target.value;
      try{
        await post(`/ui/channels/${c.id}/channel-preset`,
                   {preset_id: val ? Number(val) : null});
        toast(val ? 'Канал посажен на пресет' : 'Канал снят с пресета', 'ok');
        await render();
      }catch(err){ toast(err.message); e.target.value = chp.id || ''; }
    };

    box.querySelector('#save').onclick = async () => {
      const err = box.querySelector('#cherr');
      err.innerHTML = '';
      const days = [...box.querySelectorAll('span.langs label')]
        .filter(l => l.querySelector('input').checked).map(l => l.dataset.day);
      const v = id => box.querySelector('#' + id).value;
      // Поля, которые сейчас приходят из пресета, в форме погашены — и отправляем за
      // них СОБСТВЕННЫЕ значения канала: иначе кабинет записал бы вместо них
      // умолчания, и при снятии с пресета канал получил бы не свои настройки.
      const ownSchedObj = (() => {
        try{ return JSON.parse(own.schedule || '{}'); }catch(e){ return {}; }
      })();
      const ownDays = Object.keys(ownSchedObj).includes('*')
        ? ref.days.filter(x => x !== ref.any_day)
        : Object.keys(ownSchedObj);
      const ownTimes = [...new Set(Object.values(ownSchedObj).flat())].join(', ');
      const pick = (key, formValue, ownValue) =>
        inherited.has(key) ? (ownValue ?? '') : formValue;
      try{
        // ID — отдельным запросом и только если поле вообще есть (канал ещё без ID)
        // и что-то в него вписали: пустое поле здесь значит «не сейчас», а не «стереть».
        const ucInput = box.querySelector('#f-uc');
        if (ucInput && ucInput.value.trim()){
          await post(`/ui/channels/${c.id}/uc`, {uc: ucInput.value});
          // Доработка ревьюера (code review, итерация 2, Issue 3): ID уже записан на
          // сервере. Если вторым запросом ниже упадут остальные настройки, повторное
          // нажатие «Сохранить» не должно снова слать тот же ID — сервер его больше не
          // примет («уже задан»), а пользователь так и не сохранит исправленные поля.
          // Переводим поле в чтение сразу, без ожидания перерисовки всей формы.
          c.uc = ucInput.value.trim();
          const ucRow = ucInput.closest('.fldrow');
          if (ucRow) ucRow.innerHTML =
            `<label>ID канала</label><span class="mono">${esc(c.uc)}</span>`;
        }
        await post(`/ui/channels/${c.id}`, {
          name: v('f-name'), handle: v('f-handle'), lang: v('f-lang'),
          niche: pick('niche', v('f-niche'), own.niche),
          tz: pick('tz', v('f-tz'), own.tz),
          times: pick('schedule', v('f-times'), ownTimes),
          days: inherited.has('schedule') ? ownDays : days,
          horizon_days: pick('horizon_days', v('f-hor'), own.horizon_days),
          lead_days: pick('lead_days', v('f-lead'), own.lead_days),
          deferred: inherited.has('deferred')
            ? (own.deferred ? '1' : '')
            : (box.querySelector('#f-def').checked ? '1' : ''),
          deferred_limit: pick('deferred_limit', v('f-deflim'), own.deferred_limit),
          profile_id: v('f-prof'),
          host_id: pick('host_id', v('f-host'), own.host_id),
          // Текст и обложку канал больше не хранит: их держит пресет. Старые значения
          // отправляем как есть — обнулить их значило бы остановить выпуски каналов,
          // у которых пресет про соседей ещё не знает.
          preset_vsgen_id: pick('preset_vsgen_id', v('f-pv'), own.preset_vsgen_id),
          preset_rewrite: c.preset_rewrite || '',
          preset_cover: c.preset_cover || '', note: v('f-note'),
        });
        await render();
      }catch(e){ err.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  }
}

/* ────────────────────────── результаты задачи ────────────────────────── */

/* Один блок на оба сервиса: у Rewrite и Cover результаты устроены одинаково —
   список имён и файл по имени. Смысл в том, чтобы не уходить с экрана: увидеть,
   что получилось, и забрать — там же, где задача. */
const RESULT_OPEN = new Set();

async function paintResults(service, jobId, host){
  try{
    const d = await api(`/ui/files/${encodeURIComponent(service)}/${encodeURIComponent(jobId)}`);
    if (!d.files.length){ host.innerHTML = '<span class="muted">Файлов пока нет.</span>'; return; }
    // Ссылки и <img src> идут мимо api() — префикс им нужен свой.
    const url = f => `${API}/ui/files/${encodeURIComponent(service)}/${
      encodeURIComponent(jobId)}/${encodeURIComponent(f.name)}`;
    const imgs = d.files.filter(f => f.kind === 'image');
    const rest = d.files.filter(f => f.kind !== 'image');
    host.innerHTML = `
      ${imgs.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        ${imgs.map(f => `<a href="${url(f)}" target="_blank" title="${esc(f.name)}"
          ><img src="${url(f)}" style="height:96px;border-radius:6px;
          border:1px solid var(--line);display:block"></a>`).join('')}</div>` : ''}
      ${rest.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">
        ${rest.map(f => `<a href="${url(f)}" target="_blank"
          style="display:inline-block;padding:4px 10px;border:1px solid var(--line);
                 border-radius:6px;text-decoration:none;font-size:12px"
          >${esc(f.name)}</a>`).join('')}</div>` : ''}`;
  }catch(e){
    host.innerHTML = `<span class="note bad">${esc(e.message)}</span>`;
  }
}

function wireResults(root, service){
  root.querySelectorAll('tr[data-job]').forEach(tr => {
    tr.style.cursor = 'pointer';
    tr.onclick = ev => {
      if (ev.target.closest('button, a')) return;   // кнопки строки — не раскрытие
      const id = tr.dataset.job;
      const key = service + ':' + id;
      const next = tr.nextElementSibling;
      if (next && next.classList.contains('res-row')){
        next.remove(); RESULT_OPEN.delete(key); return;
      }
      RESULT_OPEN.add(key);
      tr.insertAdjacentHTML('afterend',
        '<tr class="res-row"><td colspan="9" style="padding-top:0">' +
        '<div class="muted">загрузка…</div></td></tr>');
      paintResults(service, id, tr.nextElementSibling.querySelector('div'));
    };
    if (RESULT_OPEN.has(service + ':' + tr.dataset.job)) tr.click();
  });
}

/* ─────────────────────────────── текст ─────────────────────────────── */

/* Рерайт и генерация с нуля — один экран (ТЗ §05). Разница между ними только
   в источнике: ссылка, свой текст или тема. Три разных экрана для трёх источников
   одной и той же работы — это и была «разбивка на тысячу интерфейсов». */
let TEXT_FORM = {mode:'link', langs:new Set(), model:'', preset:''};

async function viewText(){
  const d = await api('/ui/text');
  app.innerHTML = '';
  app.append($(`<h1>Текст ${hintDot(
    'Рерайт по ссылке, рерайт своего текста и генерация с нуля.')}</h1>`));

  if (!TEXT_FORM.model && d.models.length) TEXT_FORM.model = d.models[0].value;
  const mode = () => d.modes.find(m => m.key === TEXT_FORM.mode) || d.modes[0];

  const form = $(`<div class="card" style="padding:16px;margin-bottom:16px">
    <div id="err"></div>
    <div class="modes">${d.modes.map(m => `
      <button data-mode="${m.key}" class="${m.key === TEXT_FORM.mode ? 'on' : ''}"
        >${esc(m.title)}</button>`).join('')}</div>
    <div class="note muted" style="margin-bottom:10px">${esc(mode().note)}</div>

    <label class="k" style="display:block;margin-bottom:6px" id="src-label"></label>
    <input id="src-one" placeholder="https://www.youtube.com/watch?v=…"
           style="width:100%;box-sizing:border-box;padding:9px 11px;
                  border:1px solid var(--border);border-radius:7px;font:inherit">
    <textarea id="src-many" placeholder="Вставьте текст"></textarea>

    <div id="preset-box" style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Бриф</label>
      <select id="preset" style="min-width:280px">
        <option value="">— выберите бриф —</option>
        ${d.presets.generation.map(p => `<option>${esc(p)}</option>`).join('')}
      </select>
      ${d.presets.generation.length ? '' :
        '<div class="note muted">Брифов нет. Завести: «Пресеты» → «Создать» → «Пресет» → '
        + '«Только сценарий» → «Бриф для текста с нуля».</div>'}
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Модель</label>
      <select id="model" style="min-width:280px">${d.models.map(m =>
        `<option value="${esc(m.value)}" ${m.value === TEXT_FORM.model ? 'selected' : ''}
          >${esc(m.label)}</option>`).join('')}</select>
      <div class="note muted">${d.models.length
        ? 'Показаны только модели, под которые у вас есть ключ или подписка.'
        : 'Ни одной доступной модели: нет ни своего ключа, ни серверного.'}</div>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="langs">${d.languages.map(l => `
        <label data-code="${esc(l.code)}"><input type="checkbox"
          ${TEXT_FORM.langs.has(l.code) ? 'checked' : ''}>${esc(l.title)}</label>`).join('')}
      </div>
    </div>

    <div style="margin-top:14px"><button id="go">Запустить</button></div>
    <div id="res"></div>
  </div>`);
  app.append(form);

  const one = form.querySelector('#src-one');
  const many = form.querySelector('#src-many');
  const presetBox = form.querySelector('#preset-box');
  const label = form.querySelector('#src-label');

  function paint(){
    const m = TEXT_FORM.mode;
    label.textContent = m === 'link' ? 'Ссылка на ролик-донор'
                      : m === 'text' ? 'Текст' : 'Тема';
    one.hidden = (m === 'text');
    many.hidden = (m !== 'text');
    presetBox.hidden = (m !== 'topic');
    one.placeholder = m === 'link' ? 'https://www.youtube.com/watch?v=…'
                                   : 'О чём должен быть ролик';
  }
  paint();

  form.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    TEXT_FORM.mode = b.dataset.mode;
    render();
  });
  form.querySelectorAll('#langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? TEXT_FORM.langs.add(l.dataset.code)
                  : TEXT_FORM.langs.delete(l.dataset.code); };
    sync();
    box.onchange = sync;
  });
  form.querySelector('#model').onchange = e => TEXT_FORM.model = e.target.value;
  form.querySelector('#preset').onchange = e => TEXT_FORM.preset = e.target.value;

  const errBox = form.querySelector('#err');
  const resBox = form.querySelector('#res');
  const btn = form.querySelector('#go');
  btn.onclick = async () => {
    errBox.innerHTML = ''; resBox.innerHTML = ''; btn.disabled = true;
    btn.textContent = 'Отправляю…';
    try{
      const out = await post('/ui/text', {
        mode: TEXT_FORM.mode,
        source: (TEXT_FORM.mode === 'text' ? many.value : one.value),
        languages: [...TEXT_FORM.langs],
        model: TEXT_FORM.model,
        preset: TEXT_FORM.preset,
      });
      resBox.innerHTML = `<div class="res">Задача создана${
        out.chars ? ` · текста ${out.chars} знаков` : ''}.</div>`;
      one.value = ''; many.value = '';
      setTimeout(render, 600);
    }catch(e){
      errBox.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }finally{ btn.disabled = false; btn.textContent = 'Запустить'; }
  };

  const list = $(`<div class="card">
    <div class="sec">Задачи текста ${hintDot(
      'Нажмите на строку — покажется результат.')}</div>
    ${d.jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Вид</th><th>Языки</th><th>Состояние</th><th>Создана</th><th></th>
      </tr></thead><tbody>${d.jobs.map(j => `<tr data-job="${esc(j.id)}">
        <td><div style="font-weight:600">${esc(j.title)}</div>
            <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
        <td>${j.kind === 'generation' ? 'с нуля' : 'рерайт'}</td>
        <td>${(Array.isArray(j.langs) ? j.langs : [j.langs]).map(esc).join(', ') || '—'}</td>
        <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
            ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
            ${j.progress != null ? `<div class="bar"><i style="width:${
              Math.round(j.progress * 100)}%"></i></div>` : ''}</td>
        <td class="muted when">${when(j.created)}</td>
        <td style="white-space:nowrap">${actions({service:'rewrite', id:j.id,
                                                  state:j.state, status:j.status})}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Задач текста пока нет.</div>'}
  </div>`);
  app.append(list);
  wireActions(list);
  wireResults(list, 'rewrite');
}

/* ─────────────────────────────── обложки ─────────────────────────────── */

/* Стратегия выбирается ДО показа полей (ТЗ §10). Раньше это была одна простыня, где
   половина полей молча не работала: они относились к другой стратегии. */
let COVER_FORM = {mode:'url', langs:new Set(), preset:'', option:0,
                  edit:false, n:3};

async function viewCovers(){
  const d = await api('/ui/covers');
  app.innerHTML = '';
  app.append($(`<h1>Обложки ${hintDot('Сначала выберите, как делаем обложку.')}</h1>`));

  const mode = () => d.modes.find(m => m.key === COVER_FORM.mode) || d.modes[0];
  const langs = [...COVER_FORM.langs];

  const form = $(`<div class="card" style="padding:16px;margin-bottom:16px">
    <div id="err"></div>
    <div class="modes">${d.modes.map((m, i) => `
      <button data-mode="${m.key}" class="${m.key === COVER_FORM.mode ? 'on' : ''}"
        >${esc(m.title)}</button>`).join('')}</div>
    <div class="note muted" style="margin-bottom:10px">${esc(mode().note)}</div>

    <div id="fields"></div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Пресет</label>
      <select id="preset" style="min-width:280px">
        <option value="">— без пресета —</option>
        ${d.presets.map(p => `<option ${p === COVER_FORM.preset ? 'selected' : ''}
          >${esc(p)}</option>`).join('')}</select>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block;margin-bottom:6px">Чем генерировать</label>
      <select id="option" style="min-width:280px">${d.options.map((o, i) =>
        `<option value="${i}" ${i === COVER_FORM.option ? 'selected' : ''}>${esc(o.label)}${
          o.admin_only ? ' — платит владелец' : ''}</option>`).join('')}</select>
    </div>

    <div style="margin-top:12px">
      <label class="k" style="display:block">Языки</label>
      <div class="langs" id="langs">${d.languages.map(l => `
        <label data-code="${esc(l)}"><input type="checkbox"
          ${COVER_FORM.langs.has(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}
      </div>
    </div>

    <div id="edit-box" style="margin-top:12px"></div>

    <div class="note muted" style="margin-top:12px">Соотношение сторон —
      <b>${esc(d.aspect)}</b>, всегда. У обложки YouTube оно одно.</div>

    <div style="margin-top:14px"><button id="go">Запустить</button></div>
    <div id="res"></div>
  </div>`);
  app.append(form);

  const fields = form.querySelector('#fields');
  const editBox = form.querySelector('#edit-box');

  function paintFields(){
    const m = COVER_FORM.mode;
    if (m === 'url'){
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px"
        >Ссылки на доноров, по одной в строке</label>
        <textarea id="urls" placeholder="https://www.youtube.com/watch?v=…"></textarea>`;
    } else if (m === 'title'){
      fields.innerHTML = langs.length
        ? `<label class="k" style="display:block;margin-bottom:6px">Заголовок на каждый язык</label>
           ${langs.map(l => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
             <span class="muted" style="min-width:120px">${esc(l)}</span>
             <input data-lang="${esc(l)}" class="title-in" placeholder="Текст на обложке"
               style="flex:1;padding:8px 10px;border:1px solid var(--border);
                      border-radius:7px;font:inherit"></div>`).join('')}
           <label class="k" style="display:block;margin:10px 0 6px">Дополнение к промпту</label>
           <input id="extra" style="width:100%;box-sizing:border-box;padding:9px 11px;
             border:1px solid var(--border);border-radius:7px;font:inherit">`
        : '<div class="note">Сначала выберите языки — заголовок задаётся на каждый отдельно.</div>';
    } else {
      fields.innerHTML = `<label class="k" style="display:block;margin-bottom:6px">Семя</label>
        <textarea id="seed" placeholder="Описание сцены, из которого рождаются варианты"></textarea>
        <label class="k" style="display:block;margin:10px 0 6px">Вариантов на язык</label>
        <input id="n" type="number" min="1" max="8" value="${COVER_FORM.n}"
          style="width:90px;padding:8px 10px;border:1px solid var(--border);
                 border-radius:7px;font:inherit">`;
    }

    // Редактирование превью — ОТДЕЛЬНЫЙ выбор, а не следствие приложенного референса.
    // Пока это следствие, человек прикладывает картинку «для стиля» и незаметно
    // выключает половину пресета.
    const killed = d.rules.find(r => r.when === 'edit');
    editBox.innerHTML = COVER_FORM.mode === 'url'
      ? `<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">
           <input type="checkbox" id="edit" ${COVER_FORM.edit ? 'checked' : ''}>
           <span><b>Редактировать превью моделью</b>
             <div class="note muted">Превью донора уходит в модель целиком.
               ${COVER_FORM.edit ? `Тогда НЕ действуют: ${killed.kills.join(', ')} —
                 ${esc(killed.why)}.` : ''}</div></span></label>`
      : `<div class="note muted">${esc((d.rules.find(r => r.when === 'not_url') || {}).why || '')}.</div>`;
    const box = editBox.querySelector('#edit');
    if (box) box.onchange = e => { COVER_FORM.edit = e.target.checked; paintFields(); };
  }
  paintFields();

  form.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    COVER_FORM.mode = b.dataset.mode; render();
  });
  form.querySelectorAll('#langs label').forEach(l => {
    const box = l.querySelector('input');
    const sync = () => { l.classList.toggle('on', box.checked);
      box.checked ? COVER_FORM.langs.add(l.dataset.code)
                  : COVER_FORM.langs.delete(l.dataset.code); };
    sync();
    box.onchange = () => { sync(); if (COVER_FORM.mode === 'title') render(); };
  });
  form.querySelector('#preset').onchange = e => COVER_FORM.preset = e.target.value;
  form.querySelector('#option').onchange = e => COVER_FORM.option = Number(e.target.value);

  const errBox = form.querySelector('#err');
  const resBox = form.querySelector('#res');
  const btn = form.querySelector('#go');
  btn.onclick = async () => {
    errBox.innerHTML = ''; resBox.innerHTML = ''; btn.disabled = true;
    btn.textContent = 'Отправляю…';
    try{
      // Провайдер и модель — из ТЕКУЩЕГО выбора на момент нажатия «Запустить», не из
      // значения, посчитанного при отрисовке экрана (review-feedback-F4 цикл 2,
      // Issue 1 — «тот же файл и тот же дефект с деньгами», что и в проектной
      // вкладке «Обложка»): `#option.onchange` меняет только `COVER_FORM.option`, без
      // перерисовки, и платный вызов уходил бы провайдеру не того пункта списка.
      const curOpt = d.options[COVER_FORM.option] || d.options[0] || {};
      const body = {mode: COVER_FORM.mode, preset: COVER_FORM.preset,
                    languages: [...COVER_FORM.langs],
                    provider: curOpt.provider || '', model: curOpt.model || '',
                    edit_preview: COVER_FORM.edit};
      if (COVER_FORM.mode === 'url'){
        body.urls = (form.querySelector('#urls').value || '')
          .split(/\s+/).map(x => x.trim()).filter(Boolean);
      } else if (COVER_FORM.mode === 'title'){
        body.titles = {};
        form.querySelectorAll('.title-in').forEach(i => {
          if (i.value.trim()) body.titles[i.dataset.lang] = i.value.trim();
        });
        body.extra_prompt = (form.querySelector('#extra') || {}).value || '';
      } else {
        body.seed = form.querySelector('#seed').value;
        body.n_variants = Number(form.querySelector('#n').value) || 3;
      }
      await post('/ui/covers', body);
      resBox.innerHTML = '<div class="res">Задача создана.</div>';
      setTimeout(render, 600);
    }catch(e){
      errBox.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }finally{ btn.disabled = false; btn.textContent = 'Запустить'; }
  };

  const list = $(`<div class="card">
    <div class="sec">Задачи обложек ${hintDot(
      'Нажмите на строку — покажутся готовые обложки.')}</div>
    ${d.jobs.length ? `<table><thead><tr>
      <th>Задача</th><th>Состояние</th><th>Готово</th><th>Создана</th><th></th>
      </tr></thead><tbody>${d.jobs.map(j => `<tr data-job="${esc(j.id)}">
        <td><div style="font-weight:600">${esc(j.title)}</div>
            <div class="muted mono" style="font-size:11px">${esc(j.id)}</div></td>
        <td><span class="pill ${STATE_CLS[j.state]}">${STATE_TITLE[j.state]}</span>
            ${j.detail ? `<div class="muted" style="margin-top:4px">${esc(j.detail)}</div>` : ''}
            ${j.progress != null ? `<div class="bar"><i style="width:${
              Math.round(j.progress * 100)}%"></i></div>` : ''}</td>
        <td>${j.results || '—'}</td>
        <td class="muted when">${when(j.created)}</td>
        <td style="white-space:nowrap">${actions({service:'cover', id:j.id,
                                                  state:j.state, status:j.status})}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Задач обложек пока нет.</div>'}
  </div>`);
  app.append(list);
  wireActions(list);
  wireResults(list, 'cover');
}

/* ───────────────── подсказка у знака вопроса ───────────────── */
// Руководство («за что отвечает поле», «что этот экран показывает») снято с экрана под
// знак вопроса. Граница, по которой решалось, что убрать: останавливает ли текст руку ДО
// необратимого. Всё про деньги, дубли, «изменится у всех каналов» и «задать можно один
// раз» осталось открытым текстом — предупреждение, которое надо раскрыть кликом, уже не
// предупреждение.
// Раскрывается наведением, кликом и фокусом с клавиатуры сразу: hover'а нет на
// тач-экране, а у клавиатуры нет ни hover'а, ни клика мышью.

let HINT = null;                        // {btn, box, pinned} — открыта всегда одна

function hintDot(text){
  // Переносы строк приходят из шаблонных строк вёрстки; в атрибуте они бы остались
  // пробелами по три десятка знаков.
  const t = String(text ?? '').replace(/\s+/g, ' ').trim();
  if (!t) return '';                    // пустая подсказка — знака вопроса тоже нет
  // Текст лежит и в aria-label: читалка озвучит его по самой кнопке, не дожидаясь
  // появления всплывающего блока (тот помечен aria-hidden, чтобы не повторяться).
  return `<button type="button" class="q" data-hint="${esc(t)}"
    aria-label="${esc(t)}">?</button>`;
}

function hintHide(){
  if (!HINT) return;
  HINT.box.remove();
  HINT = null;
}

function hintShow(btn, pinned){
  if (HINT && HINT.btn === btn){ HINT.pinned = HINT.pinned || pinned; return; }
  hintHide();
  const box = document.createElement('div');
  box.className = btn.classList.contains('whytip') ? 'qbox wide' : 'qbox';
  box.setAttribute('aria-hidden', 'true');
  box.textContent = btn.dataset.hint || '';
  document.body.append(box);
  // Размер меряем уже наполненным: пустую коробку мерить нечего, а от её ширины зависит,
  // с какой стороны она поместится (та же причина, что у `inlineBox`).
  const r = btn.getBoundingClientRect();
  const w = box.offsetWidth, bh = box.offsetHeight;
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  // За край экрана не выпускаем: знаки вопроса стоят и у правой колонки формы, и у
  // заголовков карточек — оттуда подсказка шириной в треть экрана уезжала бы под обрез.
  const left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, vw - w - 8));
  // Снизу, если снизу есть место; иначе над знаком. Если не помещается нигде — всё равно
  // снизу: обрезанный низ виден прокруткой, обрезанный верх — нет.
  const below = r.bottom + 8 + bh <= vh || r.top - 8 - bh < 0;
  const top = below ? r.bottom + 8 : Math.max(8, r.top - 8 - bh);
  box.style.left = (left + window.scrollX) + 'px';
  box.style.top = (top + window.scrollY) + 'px';
  HINT = {btn, box, pinned: !!pinned, at: Date.now()};
}

const hintAt = ev => (ev.target instanceof Element)
  ? ev.target.closest('.q[data-hint], .whytip[data-hint]') : null;

document.addEventListener('mouseover', ev => {
  const b = hintAt(ev);
  if (b) hintShow(b, false);
});
document.addEventListener('mouseout', ev => {
  const b = hintAt(ev);
  // Открытую кликом подсказку уход курсора не закрывает: её закрывают повторным кликом,
  // Esc или кликом мимо. Иначе прочитать длинный текст было бы нельзя — он исчезал бы,
  // как только курсор двинулся к нему.
  if (b && HINT && HINT.btn === b && !HINT.pinned) hintHide();
});
// Клик ловим на погружении: знак вопроса стоит и внутри <label>, и внутри кликабельной
// строки таблицы. На всплытии обработчик строки уже успел бы открыть задачу, а <label> —
// переключить галочку.
document.addEventListener('click', ev => {
  const b = hintAt(ev);
  if (!b){ hintHide(); return; }
  ev.preventDefault();
  ev.stopPropagation();
  // Закрывать по клику можно только ту подсказку, которую человек САМ открыл кликом
  // раньше. Chrome даёт кнопке фокус на mousedown, то есть `focusin` успевает
  // приколотить подсказку ДО `click` — и обычное нажатие мышью её тут же закрывало.
  // На тач-экране, где hover'а нет вовсе, подсказка не открывалась ни разу: ровно тот
  // случай, ради которого клик и добавляли. Поэтому считаем «своим» только клик,
  // пришедший позже открытия, а не тот, что его и вызвал.
  const mine = HINT && HINT.btn === b && HINT.pinned
               && (Date.now() - (HINT.at || 0)) > 250;
  if (mine) hintHide(); else hintShow(b, true);
}, true);
document.addEventListener('focusin', ev => {
  const b = hintAt(ev);
  // Фокус от мыши подсказку не открывает — это сделает клик следом. Открываем только
  // при переходе клавиатурой, иначе mousedown и click спорят друг с другом.
  if (b && !HINT_POINTER) hintShow(b, true);
  else if (!b) hintHide();
});
// Отличить клавиатуру от мыши иначе нечем: `focusin` одинаков в обоих случаях.
let HINT_POINTER = false;
document.addEventListener('mousedown', () => { HINT_POINTER = true; }, true);
document.addEventListener('touchstart', () => { HINT_POINTER = true; }, true);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Tab') HINT_POINTER = false;
}, true);
// Уход фокуса закрывает свою подсказку сам: `focusin` на новом месте бывает не всегда —
// после Tab в адресную строку или blur() фокус уходит в никуда, и подсказка осталась бы
// висеть поверх экрана, к которому уже не относится.
document.addEventListener('focusout', ev => {
  const b = hintAt(ev);
  if (b && HINT && HINT.btn === b) hintHide();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') hintHide(); }, true);
// Экран перерисовывается целиком (`app.innerHTML`), кнопка со знаком вопроса при этом
// исчезает — а подсказка лежит в <body> и осталась бы висеть поверх нового экрана.
window.addEventListener('hashchange', hintHide);

/* ─────────────────────────────── пресеты ─────────────────────────────── */

/* ───────────────── спросить, не выходя из страницы ───────────────── */
// Браузерные prompt() и confirm() останавливают страницу целиком, выглядят чужими и на
// части браузеров блокируются вместе с попапами. Спрашиваем там же, где нажали.

// `fill` наполняет врезку ДО того, как ей ищут место: пустую мерить нечего, а место
// зависит от её ширины. Отдельным шагом после возврата это делать нельзя — ширину
// пришлось бы досчитывать в следующем кадре, а в безголовом браузере (им прогоняются
// браузерные тесты) до следующего кадра дело может и не дойти.
function inlineBox(btn, fill){
  const host = btn.parentElement;
  let box = host.querySelector('.inline-ask');
  if (box) box.remove();
  box = document.createElement('div');
  box.className = 'inline-ask';
  host.insertBefore(box, btn.nextSibling);
  // Врезка вынута из потока (CSS `.inline-ask`), поэтому место отмеряем сами — от
  // кнопки, а не от края карточки. Точкой отсчёта для absolute служит ближайший
  // позиционированный предок, а у наших контейнеров позиции обычно нет вовсе:
  // без этой строки врезка улетела бы к краю экрана.
  if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
  fill(box);
  // Ширину меряем, прижав врезку к левому краю контейнера: у правого края ей остаётся
  // несколько десятков пикселей, и браузер сложил бы её в узкий столбик ещё до того,
  // как мы её оттуда сдвинем. Потом ставим под кнопку, но не дальше правого края —
  // «Создать» и «Удалить» стоят справа, и оттуда врезка вылезала бы за карточку.
  box.style.left = '0px';
  const w = box.offsetWidth;
  let left = Math.max(0, Math.min(btn.offsetLeft, host.clientWidth - w));
  // Контейнер уже врезки (узкая ячейка) — тогда держим её в пределах экрана: слева
  // от ячейки место есть, а за правым краем экрана её не увидят.
  const hostLeft = host.getBoundingClientRect().left;
  const vw = document.documentElement.clientWidth;
  left = Math.max(8 - hostLeft, Math.min(left, vw - 8 - hostLeft - w));
  box.style.left = left + 'px';
  box.style.top = (btn.offsetTop + btn.offsetHeight + 6) + 'px';
  return box;
}

// Вместо prompt(): поле рядом с кнопкой. Enter — принять, Esc — отменить.
function menuInline(btn, items){
  // Выбор из нескольких действий у одной кнопки. Отдельное окно тут было бы тяжелее
  // самого выбора, а три кнопки в шапке — это ровно та перегруженность, на которую
  // жаловался владелец 21.09.
  const box = inlineBox(btn, b => {
    b.style.flexDirection = 'column';
    b.style.alignItems = 'stretch';
    // Пункты с пояснениями сами по себе узкие не бывают, а без нижней границы у
    // правого края экрана меню сложилось бы в столбик по одному слову.
    b.style.minWidth = '212px';
    b.innerHTML = items.map((it, n) => `<button class="ghost small mi" data-n="${n}"
      style="text-align:left;font-weight:500">${esc(it.title)}${it.hint
      ? `<div class="note muted" style="margin:2px 0 0">${esc(it.hint)}</div>` : ''}</button>`).join('');
  });
  // Меню висит поверх страницы, а не раздвигает её (см. `inlineBox`). Значит, закрыть
  // его должно что-то помимо выбора пункта: в потоке передумавший нажимал мимо и меню
  // просто оставалось стоять ниже, а поверх текста забытое меню закрывает содержимое.
  // Слушатели снимаются вместе с меню — иначе они копились бы на каждое открытие.
  const close = () => {
    box.remove();
    document.removeEventListener('mousedown', outside, true);
    document.removeEventListener('keydown', onEsc, true);
  };
  const outside = ev => { if (!box.contains(ev.target) && ev.target !== btn) close(); };
  const onEsc = ev => { if (ev.key === 'Escape') close(); };
  // Через такт: этот же клик ещё не закончился, и слушатель поймал бы его сам —
  // меню закрывалось бы ровно в момент открытия.
  setTimeout(() => {
    document.addEventListener('mousedown', outside, true);
    document.addEventListener('keydown', onEsc, true);
  }, 0);
  box.querySelectorAll('.mi').forEach(b => b.onclick = () => {
    close();
    items[Number(b.dataset.n)].run();
  });
}

function askInline(btn, opts, onOk){
  const box = inlineBox(btn, b => {
    b.innerHTML = `<input class="ask-in" placeholder="${esc(opts.placeholder || '')}"
      value="${esc(opts.value || '')}">
    <button class="small ask-ok">${esc(opts.ok || 'Готово')}</button>
    <button class="ghost small ask-no">Отмена</button>`;
  });
  const input = box.querySelector('.ask-in');
  input.focus();
  input.select();
  const done = () => box.remove();
  box.querySelector('.ask-no').onclick = done;
  box.querySelector('.ask-ok').onclick = async () => {
    const v = input.value.trim();
    if (!v) return input.focus();
    done();
    await onOk(v);
  };
  input.onkeydown = e => {
    if (e.key === 'Enter'){ e.preventDefault(); box.querySelector('.ask-ok').click(); }
    if (e.key === 'Escape') done();
  };
}

// Вместо confirm(): вопрос рядом с кнопкой. Нужен только там, где действие необратимо.
// Окно для формы, которой тесно в строке: ключ, пресет обложки, бриф сценария.
// Возвращает {el, body, close}: содержимое рисует вызывающий, кнопка «Сохранить» и
// показ ошибки — здесь, потому что они одинаковы у всех таких форм.
function modal(title, bodyHtml, opts){
  const o = opts || {};
  // $() возвращает обёртку-div, а нам нужен сам <dialog>: showModal() есть только у него.
  const dlg = $(`<dialog class="modal">
    <div class="sec">${esc(title)}<button class="x" title="Закрыть">×</button></div>
    <div class="mbody">${bodyHtml}</div>
    <div class="mfoot"><button class="m-ok">${esc(o.ok || 'Сохранить')}</button>
      <button class="ghost m-no">${esc(o.no || 'Отмена')}</button>
      <span class="note bad m-err" style="margin:0"></span></div>
  </dialog>`).firstElementChild;
  document.body.append(dlg);
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('.x').onclick = close;
  dlg.querySelector('.m-no').onclick = close;
  // Клик по фону — это клик по самому <dialog> вне его содержимого.
  dlg.onclick = ev => { if (ev.target === dlg) close(); };
  dlg.addEventListener('cancel', ev => { ev.preventDefault(); close(); });
  const err = dlg.querySelector('.m-err');
  const ok = dlg.querySelector('.m-ok');
  ok.onclick = async () => {
    err.textContent = '';
    ok.disabled = true;
    try{
      await o.onOk(dlg.querySelector('.mbody'), close);
    }catch(e){ err.textContent = e.message; }
    finally{ ok.disabled = false; }
  };
  dlg.showModal();
  const first = dlg.querySelector('.mbody input,.mbody textarea,.mbody select');
  if (first) first.focus();
  return {el: dlg, body: dlg.querySelector('.mbody'), close};
}

// То же, что `modal`, но на самой странице: форма встаёт в указанное место. Нужна
// заведению частей «Сценарий» и «Обложка» на общем экране пресета — отдельное окно
// поверх него было бы вторым экраном на одно намерение. «Отмены» нет: закрывать нечего.
function inlinePanel(host, title, bodyHtml, opts){
  const o = opts || {};
  const el = $(`<div class="card inpanel" style="margin-bottom:16px">
    <div class="sec">${esc(title)}</div>
    <div class="mbody secbody">${bodyHtml}</div>
    <div class="mfoot secbody" style="display:flex;gap:10px;align-items:center;padding-top:0">
      <button class="m-ok">${esc(o.ok || 'Сохранить')}</button>
      <span class="note bad m-err" style="margin:0"></span></div></div>`).firstElementChild;
  host.append(el);
  const err = el.querySelector('.m-err');
  const ok = el.querySelector('.m-ok');
  ok.onclick = async () => {
    err.textContent = '';
    ok.disabled = true;
    try{ await o.onOk(el.querySelector('.mbody'), () => {}); }
    catch(e){ err.textContent = e.message; }
    finally{ ok.disabled = false; }
  };
  const first = el.querySelector('.mbody input,.mbody textarea,.mbody select');
  if (first) first.focus();
  return {el, body: el.querySelector('.mbody'), close: () => {}};
}

// Прочитать длинный текст целиком: окном поверх экрана, удобной мерой строки и без
// поля ввода — чтобы прочитать, не рискуя случайно поправить.
function readerModal(title, text, meta){
  const m = modal(title, `${meta ? `<div class="note muted" style="margin:0 0 10px">${
      esc(meta)}</div>` : ''}<div class="reader">${esc(text)}</div>`,
    {ok: 'Закрыть', onOk: async (_b, close) => close()});
  m.el.classList.add('reading');
  m.el.querySelector('.m-no').hidden = true;
  return m;
}

/* Вопрос про необратимое — окном, а не врезкой в строке. `confirmInline` раздвигает ту
   строку, в которой нажали: в таблице очереди от этого уезжала вся таблица (жалоба
   владельца 20.09.2026). Окно ничего не двигает, закрывается Esc и кликом по фону.
   Это по-прежнему НЕ браузерный `confirm` — тот останавливает страницу целиком. */
function confirmModal(title, question, onOk){
  const m = modal(title, `<div style="font-size:14px">${esc(question)}</div>`,
    {ok: 'Да', no: 'Нет', onOk: async (_body, close) => {
      // Закрываем ДО действия: ответ «да» уже получен, а ход работы показывает тот
      // экран, к которому она относится, — строка, тост, перерисовка списка.
      close();
      await onOk();
    }});
  // Полей в вопросе нет, поэтому фокус сам уходит на крестик закрытия — и Enter
  // попадает по нему вслепую. Ставим фокус на «Нет»: у необратимого действия по
  // умолчанию должен быть выбран безопасный ответ.
  m.el.querySelector('.m-no').focus();
  return m;
}

function confirmInline(btn, text, onOk, onNo){
  const box = inlineBox(btn, b => {
    b.innerHTML = `<span class="muted">${esc(text)}</span>
    <button class="small ask-ok">Да</button>
    <button class="ghost small ask-no">Нет</button>`;
  });
  // `onNo` нужен там, где кнопку на время вопроса выключили: без него отказ оставлял бы
  // её мёртвой навсегда, и человек решил бы, что сломалось.
  box.querySelector('.ask-no').onclick = () => { box.remove(); if (onNo) onNo(); };
  box.querySelector('.ask-ok').onclick = async () => { box.remove(); await onOk(); };
}

/* ─────────────────────────── профиль ─────────────────────────── */

// Всё, что про человека и про машину, а не про ролики: учётные записи, состояние
// системы, лимиты. Раньше это была вкладка «Админ» в одном ряду с производством —
// то есть настройка соседствовала с ежедневной работой.
async function viewProfile(){
  const me = ME || await api('/ui/me');
  app.innerHTML = '';
  app.append($(`<h1>Профиль</h1>
    <p class="sub">${esc(me.name || '')}${me.role ? ' · ' + esc(me.role) : ''}</p>`));

  // Ключи работают ЗДЕСЬ, а не «где-то ещё» (владелец 20.09.2026): та же карточка, что
  // на #/keys, с той же кнопкой «Добавить ключ». Сам экран #/keys остался живым адресом
  // — на нём очередь провайдеров, отдыхающие ключи и FastGen; туда ведёт ссылка в
  // заголовке карточки, и чужие закладки не ломаются.
  // Разделы профиля сворачиваются (владелец 24.09.2026: «за нужным отделом много
  // листать»). Свёрнуты по умолчанию: человек приходит сюда за одним разделом, а не
  // читать всё подряд. Что открыл — остаётся открытым до конца сессии.
  const fold = (card, key, summary) => {
    if (card) foldRefCard(card, 'profile:' + key, summary || '');
    return card;
  };
  try{
    const d = await api('/ui/keys');
    const wrap = ownKeysCard(d, {
      title: 'Ключи провайдеров', more: true,
      note: 'Ключи принадлежат человеку, а не системе: свой ключ тратит свои деньги, '
          + 'серверный — деньги владельца.'});
    app.append(wrap);
    const own = (d.own_keys || []).length;
    fold(wrap.querySelector('.card'), 'keys',
         own ? `${own} ${plural(own, 'свой ключ', 'своих ключа', 'своих ключей')}`
             : 'своих ключей нет');
  }catch(e){
    // Истёкшая сессия — дело роутера, он покажет вход; всё остальное не повод терять
    // весь профиль: люди и система человеку всё равно нужны, а про ключи скажем прямо.
    if (e instanceof NeedLogin) throw e;
    app.append($(`<div class="card" style="margin-bottom:16px">
      <div class="sec">Ключи провайдеров<a class="mklink" href="#/keys">открыть →</a></div>
      <div class="secbody"><div class="note bad">Состояние ключей прочитать не удалось:
        ${esc(e.message)}. Денег это не стоило — карточка только читает.</div></div></div>`));
  }
  // Подписки для текста — рядом с ключами: заказчик меняет их отсюда, а не по SSH.
  if (me.role === 'admin'){
    const srv = await serverKeysCard();
    app.append(srv);
    fold(srv, 'srvkeys', 'общие ключи владельца');
    const subs = await textSubsCard();
    app.append(subs);
    fold(subs, 'subs', 'Codex и Claude');
  }

  // Раздел людей появляется только у администратора: проверка стоит на сервере,
  // а не на прятании кнопки — запрос может прислать кто угодно.
  const people = await accountsCard();
  if (people){
    app.append(people);
    const many = people.querySelectorAll('tbody tr').length;
    fold(people.querySelector('.card') || people, 'people',
         many ? `${many} ${plural(many, 'человек', 'человека', 'человек')}` : '');
  }

  // «Система» — только ссылки: тревоги, диск и лимиты не место для действий. Внизу,
  // потому что это переход в другой экран, а не работа на этом.
  app.append($(`<div class="card" style="margin-top:16px">
    <div class="sec">Система</div>
    <div class="note muted secbody">
      <a href="#/admin">Состояние: тревоги, диск, публикации</a> ·
      <a href="#/limits">Серверные лимиты</a></div></div>`));
}

/* Порог хранится в своей мере (секунды, гигабайты, штуки), а правится в человеческой:
   получасовые и часовые пороги удобнее задавать минутами, а не секундами. */
const LIM_DIV = {sec: 60, gb: 1, days: 1, pct: 1, count: 1};
const LIM_UNIT = {sec: 'мин', gb: 'ГБ', days: 'дн', pct: '%', count: 'шт'};
function limShow(th){
  const v = th.value / (LIM_DIV[th.unit] || 1);
  return Math.round(v * 100) / 100;
}

function wireLimits(card){
  if (!card || !(ME && ME.role === 'admin')) return;
  const send = async (key, value, el) => {
    el.disabled = true;
    try{
      await post('/ui/alerts/thresholds', {key, value});
      toast('Порог сохранён — подействует со следующего прохода', 'ok');
      await render();
    }catch(e){ toast(e.message); el.disabled = false; }
  };
  card.querySelectorAll('input.limval').forEach(inp => {
    // По уходу из поля, а не по каждой набранной цифре: иначе «30» успело бы
    // сохраниться как «3» — и порог полчаса стал бы тремя минутами.
    inp.onchange = () => {
      const row = inp.closest('tr');
      const unit = (a => a)(inp.nextElementSibling ? inp.nextElementSibling.textContent : '');
      const key = row.dataset.lim;
      const mul = Object.entries(LIM_UNIT).find(([, u]) => u === unit.trim());
      const div = mul ? LIM_DIV[mul[0]] : 1;
      const value = Number(inp.value);
      if (!Number.isFinite(value)) { toast('порог — это число'); return; }
      send(key, value * div, inp);
    };
  });
  card.querySelectorAll('button.limreset').forEach(b => b.onclick = () =>
    send(b.closest('tr').dataset.lim, null, b));
}

/* ─────────────────────────── редактор пресета ─────────────────────────── */

// Дыра, которую закрывает эта функция: убрать модель из выпадающего списка (2.2, 3.1)
// не значит стереть её из движка (правило 2 ТЗ). Но `<select>` без "selected" ни на
// одном варианте браузер рисует так, будто выбран первый пункт — «как по умолчанию» —
// и следующее сохранение формы молча заменило бы GROK или grok пустой строкой,
// хотя движок их прекрасно принимает. Лишний вариант с самим сохранённым значением
// не даёт этому случиться, пока человек не выберет что-то из предложенного явно.
function selectOptionsHtml(f){
  const known = (f.options || []).some(o => String(o.value) === String(f.value));
  const stray = (f.value && !known)
    ? `<option value="${esc(f.value)}" selected>${esc(f.value)} — нет в списке, но сохранено</option>`
    : '';
  return `<option value="">— как по умолчанию —</option>${stray}${
    (f.options || []).map(o => `<option value="${esc(o.value)}"${
      String(f.value) === String(o.value) ? ' selected' : ''
    }>${esc(o.title)}</option>`).join('')}`;
}

// Строка «переключатель источника группы» (батч «Пресеты целые и частичные»): только
// у групп, которые пришли из редактора ЦЕЛОГО пресета (`g.part` есть и вызывающая
// сторона передала `onLinkChange` — у формы настроек проекта и у редактора частичного
// пресета этого нет, и переключателя там не будет). «Свои поля / Из частичного
// пресета» — ровно та формулировка, которую требует раздел 4 спецификации.
function linkBarHtml(g){
  const locked = !!g.readonly;
  const options = g.link_options || [];
  const attempted = g.link_id != null;
  const linkOn = locked || attempted;
  return `<div class="secbody" style="display:flex;flex-wrap:wrap;
      gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px">
    <div class="modes" data-linkmodes="${esc(g.part)}" style="margin:0">
      <button type="button" data-src="own" data-hadlink="${attempted ? '1' : ''}"
        class="${linkOn ? '' : 'on'}">Свои поля</button>
      <button type="button" data-src="link"
        class="${linkOn ? 'on' : ''}">Из частичного пресета</button>
    </div>
    <select class="link-pick" data-part="${esc(g.part)}"${linkOn ? '' : ' hidden'}>
      <option value="">— выбрать частичный —</option>
      ${options.map(o => `<option value="${o.id}"${
        g.link_id === o.id ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}
    </select>
    ${!options.length
      ? '<span class="note muted">Частичных пресетов этой части нет — сначала заведите один.</span>'
      : ''}
    ${locked
      ? `<span class="note muted">Поля только для чтения — из пресета «${esc(g.link_name)}».
           <a href="#/preset/${g.link_id}">Править его →</a></span>`
      : ''}
  </div>${g.link_problem
    ? `<div class="err" style="margin:14px 18px 0">${esc(g.link_problem)}</div>` : ''}`;
}

/* Поле формы, изменённое КОДОМ, а не человеком.
   Браузер шлёт `input`/`change` только на набор с клавиатуры и на выбор в списке;
   присваивание `el.value = …` проходит молча. А черновик пресета (`viewPreset`)
   слушает ровно эти два события на форме — поэтому всё, что меняет значение мимо
   клавиатуры, в черновик не попадало и пропадало при первой же перерисовке: человек
   убирал язык крестиком в карте голосов, уходил на вкладку другой части, возвращался —
   строка снова на месте, и никто ему не сказал, что правку выбросили.
   Значит, значение поля формы меняется ТОЛЬКО через эту функцию — она же и сообщает
   форме о правке. */
function setFieldValue(el, value){
  if (!el) return;
  el.value = value;
  // `change`, а не `input`: смысл события здесь — «значение стало другим», а не «идёт
  // набор». `bubbles` обязателен: слушатель висит на самой форме, а не на каждом поле.
  el.dispatchEvent(new Event('change', {bubbles: true}));
}

// Форма настроек. Одна и та же для пресета и для проекта: это один набор полей —
// пресет лишь заготовка, проект — его копия в момент заведения. Описание приходит с
// сервера (server/preset_fields.py), здесь только отрисовка.
// `groups.onLinkChange(part, presetIdOrNull)` — колбэк переключателя ссылки (только у
// редактора целого пресета, вызывающая сторона вешает его на сам массив `groups`
// перед вызовом). Не второй параметр функции: `tests/test_channel_settings_layout.py`
// (батч A) ищет `fieldForm()` по буквальной сигнатуре `function fieldForm(groups){` —
// менять её незачем, у вызова и так есть один объект, на который можно повесить
// необязательное поле.
function fieldForm(groups){
  const onLinkChange = groups.onLinkChange;
  const form = $(`<form></form>`);
  for (const g of groups){
    const locked = !!g.readonly;
    // Сценарий и обложку целый пресет выбирает по названию — полем самой группы. С
    // 22.09.2026 их пресеты — части хранилища текстов и обложек, а не частичные
    // пресеты производства, и «подключить частичный» для них нечего: переключатель
    // звал бы «сначала завести один», которого заведение больше не создаёт. Старую
    // ссылку (если она есть) видно по-прежнему — чтобы её можно было снять.
    const nameLinked = (g.part === 'text' || g.part === 'cover') && g.link_id == null
      && !g.readonly;
    const linkBar = (g.part && onLinkChange && !nameLinked) ? linkBarHtml(g) : '';
    const card = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">${esc(g.title)}</div>
      ${linkBar}
      <div class="fields">${g.fields.map(f => {
        const id = 'f-' + f.key;
        // Поле, отменённое другой настройкой, не прячем и не отключаем: readOnly
        // оставляет значение в форме (disabled-поля не отправляются, и сохранение
        // стёрло бы их), а причина написана рядом — правило 2 ТЗ. Группа, у которой
        // ссылка на частичный пресет реально сработала (`locked`), — другой случай:
        // поле принадлежит не этому пресету, и его нельзя отправлять вовсе (сервер
        // такую попытку отвергает), поэтому здесь именно `disabled`, а не `readonly`.
        const off = f.off ? ' readonly title="' + esc(f.off) + '"' : '';
        const body = f.kind === 'langmap'
          // Строки собираются в JS после вставки в DOM (wireLangMap): им нужен список
          // языков поля и значение соседнего поля «Движок» из этой же группы. Хранит
          // итог тот же скрытый input с data-key — form.read() не меняется вообще.
          ? `<div class="langmap" id="${id}-box">
               <input type="hidden" id="${id}" data-key="${esc(f.key)}" value="${esc(f.value)}"${
                 locked ? ' disabled' : ''}>
               <div class="langmap-rows"></div>
               <button type="button" class="ghost small langmap-add"${
                 locked ? ' disabled' : ''}>+ строка</button>
               <!-- Шаблон Lumean заводится ПРЯМО ЗДЕСЬ (20.09.2026). Раньше карточка
                    шаблонов жила только на экране списка пресетов: человек выбирал
                    движок Lumean, искал, где создать голос, и не находил — id надо было
                    принести с другого экрана. Кнопка появляется только у Lumean: у
                    остальных движков в строке обычный id голоса, заводить нечего. -->
               <button type="button" class="ghost small langmap-lum" hidden${
                 locked ? ' disabled' : ''}>+ шаблон в Lumean</button>
             </div>`
          : f.kind === 'select'
          ? `<select id="${id}" data-key="${esc(f.key)}"${(f.off || locked) ? ' disabled' : ''}>
               ${selectOptionsHtml(f)}</select>`
          : f.kind === 'switch'
          ? `<select id="${id}" data-key="${esc(f.key)}"${(f.off || locked) ? ' disabled' : ''}>
               <option value=""${f.value === '' ? ' selected' : ''}>— как по умолчанию —</option>
               <option value="1"${['1','true','on','да'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>включено</option>
               <option value="0"${['0','false','off','нет'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>выключено</option>
             </select>`
          : `<input id="${id}" data-key="${esc(f.key)}" value="${esc(f.value)}"
                 placeholder="${esc(f.placeholder)}"${off}${locked ? ' disabled' : ''}>`;
        // Подпись у langmap ведёт на видимый блок строк (`-box`), а не на скрытый
        // input с самим значением — клик по подписи на скрытом поле не делал ничего,
        // это была подпись в никуда.
        return `<div class="fld"${f.kind === 'langmap' ? ' style="grid-column:1/-1"' : ''}>
          <label for="${f.kind === 'langmap' ? id + '-box' : id}">${esc(f.label)}</label>
          ${body}
          ${f.off ? `<div class="note bad">${esc(f.off)}</div>`
                  : (f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : '')}
        </div>`;
      }).join('')}</div></div>`);
    form.append(card);
    g.fields.filter(f => f.kind === 'langmap').forEach(f => wireLangMap(card, f, g, locked));
    // Сценарий и обложка (20.09.2026, третья просьба владельца). В группах «Сценарий» и
    // «Обложка» стоял ТОЛЬКО выбор чужого пресета по имени: сами настройки жили на
    // экране списка пресетов, и, чтобы их поправить, надо было уйти из формы, найти
    // нужный пресет среди чужих и вернуться. Теперь они правятся здесь же — тем самым
    // окном, что и на списке, и форма под руками не перерисовывается.
    g.fields.filter(f => NEIGHBOUR_PRESET_KEYS[f.key]).forEach(f =>
      wireNeighbourPreset(card, f, locked));
  }
  // Переключатель источника группы — только когда его нарисовали (см. linkBarHtml).
  // Клик по «Свои поля» шлёт запрос на снятие ссылки, только если она реально
  // стояла (`data-hadlink`) — иначе это просто переключение вида без записи. Клик
  // по «Из частичного пресета» без выбора конкретного варианта ничего не пишет,
  // только открывает список — запись идёт из onchange самого списка.
  if (onLinkChange){
    form.querySelectorAll('[data-linkmodes]').forEach(bar => {
      const part = bar.dataset.linkmodes;
      const select = bar.parentElement.querySelector('.link-pick');
      const ownBtn = bar.querySelector('[data-src="own"]');
      const linkBtn = bar.querySelector('[data-src="link"]');
      ownBtn.onclick = () => {
        bar.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        ownBtn.classList.add('on');
        if (select) select.hidden = true;
        if (ownBtn.dataset.hadlink) onLinkChange(part, null);
      };
      linkBtn.onclick = () => {
        bar.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        linkBtn.classList.add('on');
        if (select) select.hidden = false;
      };
    });
    form.querySelectorAll('.link-pick').forEach(sel => {
      sel.onchange = () => onLinkChange(sel.dataset.part,
                                        sel.value ? Number(sel.value) : null);
    });
  }
  // Отключённые поля браузер не отправил бы сам; мы их и не читаем — значение
  // останется таким, каким было, а не обнулится молча. Той же дорогой уходят и
  // поля заблокированной ссылкой группы (`disabled` выше) — их и не должно быть
  // среди того, что уезжает на сохранение.
  form.read = () => {
    const values = {};
    form.querySelectorAll('[data-key]').forEach(el => {
      if (!el.disabled) values[el.dataset.key] = el.value;
    });
    return values;
  };
  return form;
}

// «ru: id, en: id2» → [[ "ru","id" ], [ "en","id2" ]] — зеркало preset_fields.parse_voice_map
// в браузере. Только для отрисовки строк; на сервер уезжает та же строка, собранная
// функцией sync() внутри wireLangMap(), и разбирает её по-прежнему сама функция кабинета.
function parseVoiceMapRows(raw){
  const out = [];
  String(raw || '').replace(/\n/g, ',').split(',').forEach(chunk => {
    const i = chunk.indexOf(':');
    if (i < 0) return;
    const lang = chunk.slice(0, i).trim().toLowerCase();
    const voice = chunk.slice(i + 1).trim();
    if (lang && voice) out.push([lang, voice]);
  });
  return out;
}

// Собрать виджет «голоса по языкам»: строка = язык из выпадающего списка + текстовое
// поле идентификатора + крестик. Движок и формат хранения не меняются — это только
// удобная отрисовка одной и той же строки настроек.
// Поле пресета кабинета → сервис соседа, у которого этот пресет живёт.
const NEIGHBOUR_PRESET_KEYS = {preset_rewrite: 'rewrite', preset_cover: 'cover'};

function wireNeighbourPreset(card, f, locked){
  const service = NEIGHBOUR_PRESET_KEYS[f.key];
  const sel = card.querySelector('#f-' + f.key);
  if (!sel || locked) return;
  const bar = $(`<div style="display:flex;gap:8px;margin-top:6px">
    <button type="button" class="ghost small np-edit">Настроить</button>
    <button type="button" class="ghost small np-add">Завести новый</button>
  </div>`);
  sel.parentElement.append(bar);
  // Жалоба 21.09: «создаю частичный пресет для обложки, а мне зачем-то предлагают
  // выбрать ещё какой-то пресет». Поле не лишнее — оно и ЕСТЬ всё содержимое такой
  // части: настройки обложки и текста живут в соседних сервисах, а здесь хранится
  // ссылка на них. Понять это по одной подписи нельзя — поэтому знак вопроса у самой
  // подписи, а не третья строка текста под полем: в форме пресета таких полей много.
  // Знак — соседом подписи, а не внутри неё: кнопка внутри подписи дописала бы весь текст
  // подсказки к имени поля для читалки (см. `.lh`).
  const lab = sel.parentElement.querySelector('label');
  if (lab && !lab.parentElement.classList.contains('lh')){
    const row = document.createElement('div');
    row.className = 'lh';
    row.style.cssText = 'display:flex;margin-bottom:7px';
    lab.replaceWith(row);
    row.append(lab);
    row.insertAdjacentHTML('beforeend', hintDot('Какой пресет '
      + (service === 'cover' ? 'обложки' : 'текста')
      + ' взять. Его настройки правятся по «Настроить», новый — «Завести новый».'));
  }
  const edit = bar.querySelector('.np-edit');
  const paint = () => { edit.disabled = !sel.value; };
  sel.addEventListener('change', paint);
  paint();
  edit.onclick = () => {
    if (!sel.value){ toast('Сначала выберите пресет — или заведите новый'); return; }
    // reload:false — человек стоит в незаполненной форме пресета кабинета, и общая
    // перерисовка стёрла бы всё, что он успел набрать.
    neighbourPresetModal(service, sel.value, {reload: false});
  };
  bar.querySelector('.np-add').onclick = () => neighbourPresetModal(service, null, {
    reload: false,
    // Жалоба 21.09: «в попапе предлагается ввести имя, хотя я его уже ввёл, когда
    // создавал пресет». Это РАЗНЫЕ объекты — пресет кабинета и пресет соседа, — но
    // заставлять человека придумывать второе имя незачем: подставляем то же самое,
    // а он поменяет, если захочет.
    suggestName: (document.querySelector('#p-name') || {}).value || '',
    // Заведённый пресет сразу становится выбранным: иначе человек заводит его и тут же
    // ищет в списке, который ещё не знает о нём.
    onSaved: name => {
      if (!name) return;
      if (![...sel.options].some(o => o.value === name))
        sel.append(new Option(name, name));
      // Выбор сделан кодом — форме о нём надо сказать, иначе черновик пресета
      // кабинета не увидит, что сосед здесь поменялся (см. setFieldValue).
      setFieldValue(sel, name);
      paint();
      toast('Пресет заведён и выбран здесь же', 'ok');
    },
  });
}

function wireLangMap(card, f, group, locked){
  const hidden = card.querySelector('#f-' + f.key);
  const box = card.querySelector('#f-' + f.key + '-box');
  const rows = box.querySelector('.langmap-rows');
  const langs = f.options || [];
  // Случай Lumean (ТЗ, батч 16.09.2026): у него идентификатор строки — id пресета
  // Lumean (template_id), а не голос. Подпись поля, подсказка и подсказка в строках
  // переключаются СРАЗУ при смене «Движка» в этой же группе (решение владельца
  // 17.09.2026), без сохранения: оба варианта текста прислал сервер в `f.by_engine`.
  const engineField = (group.fields || []).find(x => x.key === 'engine');
  const engineSelect = card.querySelector('#f-engine');
  const lumeanNow = () => String(engineSelect ? engineSelect.value
    : (engineField ? engineField.value : '') || '').toLowerCase() === 'lumean';
  let idPlaceholder = lumeanNow() ? 'id пресета Lumean (template_id)' : 'id голоса';
  const fld = box.closest('.fld');
  const applyEngine = () => {
    const lum = lumeanNow();
    idPlaceholder = lum ? 'id пресета Lumean (template_id)' : 'id голоса';
    rows.querySelectorAll('.lm-voice').forEach(i => { i.placeholder = idPlaceholder; });
    // Кнопка проверки шаблона нужна только у Lumean: у остальных движков проверять
    // нечего — там обычный id голоса, а не ссылка на чужой шаблон.
    rows.querySelectorAll('.lm-check').forEach(b => { b.hidden = !lum; });
    // Список шаблонов — только у Lumean, и только когда он вообще собрался.
    if (lum) loadLumTemplates();
    rows.querySelectorAll('.langmap-row').forEach(row => {
      const pick = row.querySelector('.lm-pick');
      if (pick) pick.hidden = !lum || !(lumTemplates && lumTemplates.length);
    });
    const lumBtn = box.querySelector('.langmap-lum');
    if (lumBtn) lumBtn.hidden = !lum || locked;
    const texts = (f.by_engine || {})[lum ? 'lumean' : 'other'];
    if (!texts || !fld) return;
    const label = fld.querySelector('label');
    if (label) label.textContent = texts.label;
    const hint = fld.querySelector('.note.muted');
    if (hint) hint.textContent = texts.hint;
  };
  if (engineSelect) engineSelect.addEventListener('change', applyEngine);

  // Тот же приём, что и у selectOptionsHtml() выше, доведённый до строк карты: язык,
  // введённый до появления этого выпадающего списка (диалектный код вида `pt-br`,
  // или код, которого не стало после правки `_LANG_NAMES`), не входит
  // в `langs` — без отдельного пункта браузер выбрал бы первый вариант «— язык —», и
  // sync() ниже отправил бы строку с пустым языком, то есть выбросил бы её. Отдельный
  // выбранный пункт с пометкой сохраняет код ровно так же, как для моделей и методов.
  const langOptionsHtml = cur => {
    const known = langs.some(o => String(o.value) === cur);
    const stray = (cur && !known)
      ? `<option value="${esc(cur)}" selected>${esc(cur)} — нет в списке, но сохранено</option>`
      : '';
    return `<option value="">— язык —</option>${stray}${langs.map(o =>
      `<option value="${esc(o.value)}"${String(o.value) === cur ? ' selected' : ''}>${
        esc(o.title)}</option>`).join('')}`;
  };

  const sync = () => {
    const parts = [];
    rows.querySelectorAll('.langmap-row').forEach(r => {
      const lang = r.querySelector('.lm-lang').value.trim();
      const voice = r.querySelector('.lm-voice').value.trim();
      if (lang && voice) parts.push(`${lang}: ${voice}`);
    });
    // Через setFieldValue, а не присваиванием: карту меняют не только с клавиатуры.
    // Крестик убирает строку, «+ строка» добавляет, «+ шаблон в Lumean» подставляет
    // id заведённого шаблона, список шаблонов пишет выбранный — всё это клики, и без
    // явного события черновик пресета о них не узнавал.
    setFieldValue(hidden, parts.join(', '));
  };

  // Шаблоны Lumean грузятся ОДИН раз на карточку и только когда выбран Lumean: у других
  // движков в строке обычный id голоса, и ходить за чужим списком незачем. Отказ (нет
  // ключа, сосед молчит) список просто не показывает — поле id продолжает работать,
  // как работало.
  let lumTemplates = null;
  let lumLoading = null;
  const loadLumTemplates = () => {
    if (lumTemplates || lumLoading) return lumLoading || Promise.resolve();
    lumLoading = api('/ui/lumean/templates')
      .then(d => { lumTemplates = d && d.ok ? (d.templates || []) : []; })
      .catch(() => { lumTemplates = []; })
      .then(() => { rows.querySelectorAll('.langmap-row').forEach(fillPick); });
    return lumLoading;
  };
  const fillPick = (row) => {
    const pick = row.querySelector('.lm-pick');
    if (!pick) return;
    const cur = (row.querySelector('.lm-voice').value || '').trim();
    if (!lumTemplates || !lumTemplates.length){
      pick.hidden = true;
      return;
    }
    const known = lumTemplates.some(t => t.id === cur);
    pick.innerHTML = `<option value=""${known ? '' : ' selected'}>${
      cur && !known ? '— вписан вручную —' : '— выберите шаблон —'}</option>`
      + lumTemplates.map(t => `<option value="${esc(t.id)}"${t.id === cur ? ' selected' : ''}
          >${esc(t.name || t.id)}${t.service ? ' · ' + esc(t.service) : ''} · ${
          esc(String(t.id).slice(0, 8))}…</option>`).join('');
    pick.hidden = !lumeanNow();
  };
  const syncPick = (row) => {
    const pick = row.querySelector('.lm-pick');
    if (!pick || pick.hidden || !pick.options.length) return;
    const cur = (row.querySelector('.lm-voice').value || '').trim();
    const known = [...pick.options].some(o => o.value && o.value === cur);
    pick.value = known ? cur : '';
    if (!known) pick.options[0].textContent = cur ? '— вписан вручную —' : '— выберите шаблон —';
  };

  const addRow = (lang, voice) => {
    const wrap = $(`<div class="langmap-row" style="display:flex;gap:8px;margin-bottom:6px">
      <select class="lm-lang" style="width:180px;flex:0 0 auto"${locked ? ' disabled' : ''}
        >${langOptionsHtml(lang || '')}</select>
      <select class="lm-pick" hidden style="flex:1.1;width:auto;min-width:0"${
        locked ? ' disabled' : ''}
        title="шаблоны из вашего аккаунта Lumean"></select>
      <input class="lm-voice" style="flex:1;width:auto;min-width:0"${locked ? ' disabled' : ''}
             placeholder="${esc(idPlaceholder)}" value="${esc(voice || '')}">
      ${locked ? '' : `<button type="button" class="ghost small lm-check"
        title="проверить шаблон у Lumean, не платя"${lumeanNow() ? '' : ' hidden'}
        >проверить</button>`}
      <button type="button" class="ghost small lm-del" title="убрать строку"${
        locked ? ' disabled' : ''}>×</button>
    </div>`);
    // Группа закрыта ссылкой на частичный пресет (`locked`) — строки только для
    // чтения: без обработчиков менять и удалять их нельзя, а сама карта в форму
    // не уходит вовсе (скрытый input тоже `disabled`, см. вызывающий код).
    if (!locked){
      wrap.querySelector('.lm-lang').onchange = sync;
      // Список шаблонов и поле id — одно и то же значение, показанное дважды: выбор в
      // списке пишет id в поле, правка поля переводит список в «вписан вручную». Поле
      // оставлено видимым нарочно: по нему работает кнопка «проверить», по нему же
      // человек узнаёт свой id в чужом шаблоне и может вставить тот, которого в списке
      // нет (чужой аккаунт, только что заведённый шаблон).
      const pick = wrap.querySelector('.lm-pick');
      const voiceInput = wrap.querySelector('.lm-voice');
      voiceInput.oninput = () => { syncPick(wrap); sync(); };
      if (pick) pick.onchange = () => {
        if (!pick.value) return;                 // «вписать вручную» — поле не трогаем
        voiceInput.value = pick.value;
        sync();
      };
      fillPick(wrap);
      wrap.querySelector('.lm-del').onclick = () => { wrap.remove(); sync(); };
      // Проверка шаблона Lumean до оплаты (18.09.2026): id вписывают вслепую, и ошибка
      // вскрывалась платным заказом — теперь видно, что за шаблоном стоит.
      const chk = wrap.querySelector('.lm-check');
      if (chk) chk.onclick = async () => {
        const id = wrap.querySelector('.lm-voice').value.trim();
        if (!id){ toast('Сначала впишите id шаблона'); return; }
        chk.disabled = true;
        try{
          const out = await api(`/ui/lumean/template?id=${encodeURIComponent(id)}`);
          if (!out.ok) toast(out.why || 'шаблон не прочитался');
          else toast(`${out.name || id}: сервис ${out.service || '—'}${
            out.language ? ', язык ' + out.language : ''}${
            out.model ? ', модель ' + out.model : ''}`, 'ok');
        }catch(e){ toast(e.message); }
        finally{ chk.disabled = false; }
      };
    }
    rows.append(wrap);
  };

  parseVoiceMapRows(f.value).forEach(([lang, voice]) => addRow(lang, voice));
  if (!locked) box.querySelector('.langmap-add').onclick = () => addRow('', '');
  const lumBtn = box.querySelector('.langmap-lum');
  // Начальное состояние ставим здесь, а не разметкой: `fieldForm` собирает её до того,
  // как известен выбранный движок (значение читается из соседнего поля этой группы).
  // Без этой строки кнопка появлялась только после того, как человек трогал «Движок».
  if (lumBtn) lumBtn.hidden = !lumeanNow() || locked;
  // Список шаблонов при ПЕРВОЙ отрисовке: `applyEngine` висит только на смене движка, а
  // пресет открывают уже с выбранным Lumean — без этой строки список появлялся, только
  // если человек трогал «Движок».
  if (lumeanNow() && !locked) loadLumTemplates();
  if (lumBtn && !locked) lumBtn.onclick = async () => {
    // Поля формы шаблона отдаёт сервер: их список зависит от того, что принимает
    // провайдер, и дублировать его здесь значило бы разойтись с ним при первой правке.
    let lum;
    try{ lum = await api('/ui/lumean/templates'); }
    catch(e){ toast(e.message); return; }
    if (!lum.ok){
      toast(lum.why || 'Lumean не ответил');
      return;
    }
    lumeanTemplateModal(null, lum.fields, {
      // Экран НЕ перерисовываем: человек стоит в незаполненной форме пресета, и
      // render() стёр бы всё, что он успел набрать.
      reload: false,
      onCreated: id => {
        // Заведённый шаблон сразу становится строкой карты: id — это ровно то, что
        // идёт в пресет, и переносить его руками больше не нужно.
        const empty = [...rows.querySelectorAll('.langmap-row')].find(
          r => !r.querySelector('.lm-voice').value.trim());
        if (empty){
          empty.querySelector('.lm-voice').value = id;
        }else{
          addRow('', id);
        }
        sync();
        toast('Шаблон подставлен в карту голосов — выберите язык', 'ok');
      },
    });
  };
  sync();
}

// `onCancel` — необязательный (review-feedback-F4 цикл 1, Issue 8): форма настроек
// этапа внутри вкладки проекта не отдельная страница, идти «Отмене» некуда — ссылка
// на текущий же hash ничего не делала. Если onCancel передан, «Отмена» — кнопка,
// которая откатывает форму на месте, а сохранение не уходит с экрана. Без onCancel
// поведение прежнее: ссылка на `back` (страница пресета и т.п.).
// `opts.stay` — остаться на форме после записи (20.09.2026, просьба владельца про
// целые пресеты: «каждый раз приходится настраивать»). Уход на список после каждого
// «Сохранить» и был тем, из-за чего настройка целого пресета шла по одному полю за
// заход: человек правил голос, сохранял, его уносило на список, он возвращался и
// снова искал вкладку. Частичного пресета это не касается — он про одну часть, и
// список после записи как раз то место, куда человек идёт.
function saveBar(back, onSave, onCancel, opts){
  const o = opts || {};
  const cancelHtml = onCancel
    ? `<button type="button" id="cancel" class="ghost">Отмена</button>`
    : `<a class="ghost" href="${back}" style="color:var(--muted)">Отмена</a>`;
  const bar = $(`<div style="display:flex;gap:10px;align-items:center">
    <button id="save">Сохранить</button>${cancelHtml}</div>`);
  const b = bar.querySelector('#save');
  b.onclick = async () => {
    b.disabled = true;
    try{
      await onSave();
      toast('Сохранено', 'ok');
      // Остаёмся — значит кнопка нужна снова: человек продолжает настраивать и
      // сохранит ещё раз. Уходим — кнопку разблокировать незачем, экран сменится.
      if (o.stay) b.disabled = false;
      else if (!onCancel) location.hash = back;
    }catch(e){
      // `e.inplace` — отказ, который форма уже показала у самого поля (пустое имя
      // пресета). Тост поверх него повторил бы ту же фразу вторым голосом и увёл
      // взгляд от места, куда надо смотреть.
      if (!e.inplace) toast(e.message);
      b.disabled = false;
    }
  };
  if (onCancel) bar.querySelector('#cancel').onclick = onCancel;
  return bar;
}

// Отдельного экрана заведения (название + тип, потом «Завести») больше нет: он
// требовал имя до того, как человек что-нибудь настроил, и держал настройки за двумя
// переходами — жалоба владельца 21.09.2026 «имя — как будто уже настройка пресета».
// Теперь `#/preset/new` открывает тот же редактор, только пресета за ним ещё нет:
// строку заводит первое «Сохранить» (см. `viewPreset`).
const PRESET_SLUG = {'Озвучка': 'ozvuchka', 'Картинки': 'kadry', 'Клипы': 'klipy',
                     'Сборка': 'sborka', 'Сценарий': 'stsenariy', 'Обложка': 'oblozhka'};

// Части пресета (батч «Пресеты целые и частичные») — тот же порядок и те же подписи,
// что и `server/preset_fields.py:PARTS`. Список один, чтобы выбор типа при заведении
// пресета и разбивка списка на «Целые/Частичные» не разошлись в названиях.
// С 18.09.2026 «Сценарий» и «Обложка» — разные части.
const PART_TITLES = [['voice', 'Озвучка'], ['images', 'Картинки'], ['clips', 'Клипы'],
                     ['render', 'Сборка'], ['text', 'Сценарий'], ['cover', 'Обложка']];

// Фильтр списка пресетов: живёт между заходами на экран, у каждого зрителя свой.
// 21.09.2026: пресеты каналов и шаблоны Lumean висели внизу страницы всегда, мимо
// фильтра — страница получалась перегруженной, а найти их было негде. Теперь они
// такие же виды, как остальные: фильтр их и показывает, и прячет.
const PRESET_SIDE_TYPES = [['channel', 'Каналы'], ['lumean', 'Озвучка Lumean']];
const PRESET_FILTER_TYPES = [['all', 'Все'], ['full', 'Целые'], ['partial', 'Частичные'],
                             ...PART_TITLES, ...PRESET_SIDE_TYPES];
// «Все» — не вид, а пустой набор видов, поэтому в карте подписей его нет: она отвечает
// на вопрос «как называется выбранный код», а выбрать «все» значит не выбрать ничего.
const PRESET_TYPE_TITLE = new Map(PRESET_FILTER_TYPES.filter(([c]) => c !== 'all'));
// 21.09.2026 форма состояния сменилась с `{q, type}` на `{q, types: []}`: видов стало
// одиннадцать, строка кнопок свёрнута в один список, и выбирать можно несколько.
// Старую форму читаем, а не выбрасываем: иначе у всех, кто уже заходил на экран,
// фильтр молча слетел бы в «Все». Сверка со списком кодов остаётся — в ключе зрителя
// может лежать что угодно, в том числе вид, которого больше нет.
const presetFilter = (() => {
  const dflt = {q: '', types: []};
  try{
    const v = JSON.parse(localStorage.getItem('presetFilter') || 'null');
    if (!v || typeof v.q !== 'string') return dflt;
    const raw = Array.isArray(v.types) ? v.types
              : (typeof v.type === 'string' ? [v.type] : []);
    return {q: v.q, types: raw.filter(c => PRESET_TYPE_TITLE.has(c))};
  }catch(e){}
  return dflt;
})();

// «Кто бежит» (батч «Пресеты целые и частичные»): каналы и проекты — всегда,
// у частичного ещё целые пресеты, которые на него ссылаются, и каналы через них
// (`users.presets`/`users.via` — только у частичного, см. `preset_links.users_of`).
// Проекты — не больше 20 ссылок и число остальных: список может быть длинным,
// а карточка пресета не резиновая простыня.
function presetUsersHtml(scope, users){
  const linksOr = (arr, path) => arr.length
    ? arr.map(x => `<a href="${path}${x.id}">${esc(x.name)}</a>`).join(', ')
    : '<span class="muted">нет</span>';
  const projects = users.projects || [];
  const shown = projects.slice(0, 20);
  const rest = projects.length - shown.length;
  const projectsHtml = projects.length
    ? shown.map(p => `<a href="#/project/${p.id}">${esc(p.name)}</a>`).join(', ') +
      (rest > 0 ? `, и ещё ${rest}` : '')
    : '<span class="muted">нет</span>';
  const extra = scope === 'full' ? '' : `
      <div class="fld"><label>Целые пресеты, ссылающиеся на этот</label>
        <div class="note">${linksOr(users.presets || [], '#/preset/')}</div></div>
      <div class="fld"><label>Каналы через них</label>
        <div class="note">${linksOr(users.via || [], '#/channel/')}</div></div>`;
  return `<div class="card" style="margin-bottom:16px">
    <div class="sec">Кто бежит</div>
    <div class="fields">
      <div class="fld"><label>Каналы</label>
        <div class="note">${linksOr(users.channels || [], '#/channel/')}</div></div>
      <div class="fld"><label>Проекты</label><div class="note">${projectsHtml}</div></div>
      ${extra}
    </div>
    <div class="secbody"><div class="note muted">Уже поставленные задачи правка не
      меняет — их настройки заморожены в момент запуска. Изменится со следующего
      запуска.</div></div>
  </div>`;
}

/* ─────────────── незаписанные правки пресета живут в стейте ───────────────
   Форма пресета перерисовывается не только при уходе с экрана: вкладки частей —
   это адреса (`#/preset/12/kadry`), а переключатель «свои поля / из частичного»
   перечитывает пресет целиком. Каждая такая перерисовка брала значения с сервера,
   то есть молча стирала всё, что человек набрал и не сохранил, — это и есть его
   «каждый раз приходится настраивать».
   Черновик хранит ТОЛЬКО отличия от сохранённого и только для одного пресета: он
   не файл настроек, а память между перерисовками одного экрана. Уходит вместе с
