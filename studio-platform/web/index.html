/* ─────────────────────────── редактор пресета ─────────────────────────── */

// Дыра, которую закрывает эта функция: убрать модель из выпадающего списка (2.2, 3.1)
// не значит стереть её из движка (правило 2 ТЗ). Но `<select>` без "selected" ни на
// одном варианте браузер рисует так, будто выбран первый пункт — «как по умолчанию» —
// и следующее сохранение формы молча заменило бы GROK или grok пустой строкой,
// хотя движок их прекрасно принимает. Лишний вариант с самим сохранённым значением
// не даёт этому случиться, пока человек не выберет что-то из предложенного явно.
function selectOptionsHtml(f){
  const known = (f.options || []).some(o => String(o.value) === String(f.value));
  const stray = (f.value && !known)
    ? `<option value="${esc(f.value)}" selected>${esc(f.value)} — нет в списке, но сохранено</option>`
    : '';
  return `<option value="">— как по умолчанию —</option>${stray}${
    (f.options || []).map(o => `<option value="${esc(o.value)}"${
      String(f.value) === String(o.value) ? ' selected' : ''
    }>${esc(o.title)}</option>`).join('')}`;
}

// Форма настроек. Одна и та же для пресета и для проекта: это один набор полей —
// пресет лишь заготовка, проект — его копия в момент заведения. Описание приходит с
// сервера (server/preset_fields.py), здесь только отрисовка.
function fieldForm(groups){
  const form = $(`<form></form>`);
  for (const g of groups){
    const card = $(`<div class="card" style="margin-bottom:16px">
      <div class="sec">${esc(g.title)}</div>
      <div class="fields">${g.fields.map(f => {
        const id = 'f-' + f.key;
        // Поле, отменённое другой настройкой, не прячем и не отключаем: readOnly
        // оставляет значение в форме (disabled-поля не отправляются, и сохранение
        // стёрло бы их), а причина написана рядом — правило 2 ТЗ.
        const off = f.off ? ' readonly title="' + esc(f.off) + '"' : '';
        const body = f.kind === 'langmap'
          // Строки собираются в JS после вставки в DOM (wireLangMap): им нужен список
          // языков поля и значение соседнего поля «Движок» из этой же группы. Хранит
          // итог тот же скрытый input с data-key — form.read() не меняется вообще.
          ? `<div class="langmap" id="${id}-box">
               <input type="hidden" id="${id}" data-key="${esc(f.key)}" value="${esc(f.value)}">
               <div class="langmap-rows"></div>
               <button type="button" class="ghost small langmap-add">+ строка</button>
             </div>`
          : f.kind === 'select'
          ? `<select id="${id}" data-key="${esc(f.key)}"${f.off ? ' disabled' : ''}>
               ${selectOptionsHtml(f)}</select>`
          : f.kind === 'switch'
          ? `<select id="${id}" data-key="${esc(f.key)}"${f.off ? ' disabled' : ''}>
               <option value=""${f.value === '' ? ' selected' : ''}>— как по умолчанию —</option>
               <option value="1"${['1','true','on','да'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>включено</option>
               <option value="0"${['0','false','off','нет'].includes(String(f.value).toLowerCase()) ? ' selected' : ''}>выключено</option>
             </select>`
          : `<input id="${id}" data-key="${esc(f.key)}" value="${esc(f.value)}"
                 placeholder="${esc(f.placeholder)}"${off}>`;
        // Подпись у langmap ведёт на видимый блок строк (`-box`), а не на скрытый
        // input с самим значением — клик по подписи на скрытом поле не делал ничего,
        // это была подпись в никуда.
        return `<div class="fld"${f.kind === 'langmap' ? ' style="grid-column:1/-1"' : ''}>
          <label for="${f.kind === 'langmap' ? id + '-box' : id}">${esc(f.label)}</label>
          ${body}
          ${f.off ? `<div class="note bad">${esc(f.off)}</div>`
                  : (f.hint ? `<div class="note muted">${esc(f.hint)}</div>` : '')}
        </div>`;
      }).join('')}</div></div>`);
    form.append(card);
    g.fields.filter(f => f.kind === 'langmap').forEach(f => wireLangMap(card, f, g));
  }
  // Отключённые поля браузер не отправил бы сам; мы их и не читаем — значение
  // останется таким, каким было, а не обнулится молча.
  form.read = () => {
    const values = {};
    form.querySelectorAll('[data-key]').forEach(el => {
      if (!el.disabled) values[el.dataset.key] = el.value;
    });
    return values;
  };
  return form;
}

// «ru: id, en: id2» → [[ "ru","id" ], [ "en","id2" ]] — зеркало preset_fields.parse_voice_map
// в браузере. Только для отрисовки строк; на сервер уезжает та же строка, собранная
// функцией sync() внутри wireLangMap(), и разбирает её по-прежнему сама функция кабинета.
function parseVoiceMapRows(raw){
  const out = [];
  String(raw || '').replace(/\n/g, ',').split(',').forEach(chunk => {
    const i = chunk.indexOf(':');
    if (i < 0) return;
    const lang = chunk.slice(0, i).trim().toLowerCase();
    const voice = chunk.slice(i + 1).trim();
    if (lang && voice) out.push([lang, voice]);
  });
  return out;
}

// Собрать виджет «голоса по языкам»: строка = язык из выпадающего списка + текстовое
// поле идентификатора + крестик. Движок и формат хранения не меняются — это только
// удобная отрисовка одной и той же строки настроек.
function wireLangMap(card, f, group){
  const hidden = card.querySelector('#f-' + f.key);
  const box = card.querySelector('#f-' + f.key + '-box');
  const rows = box.querySelector('.langmap-rows');
  const langs = f.options || [];
  // Случай Lumean (ТЗ, батч 16.09.2026): у него идентификатор строки — id пресета
  // Lumean (template_id), а не голос. Значение движка читается здесь один раз, при
  // отрисовке формы, и не пересчитывается при смене «Движка» до сохранения — это
  // принятое ограничение формы, а не побочный эффект приёма: все правила off/hide в
  // этой форме так же статичны до сохранения и перезагрузки, карта голосов не
  // исключение.
  const engineField = (group.fields || []).find(x => x.key === 'engine');
  const isLumean = !!engineField && String(engineField.value || '').toLowerCase() === 'lumean';
  const idPlaceholder = isLumean ? 'id пресета Lumean (template_id)' : 'id голоса';

  // Тот же приём, что и у selectOptionsHtml() выше, доведённый до строк карты: язык,
  // введённый до появления этого выпадающего списка (диалектный код вида `pt-br`,
  // или код, которого не стало после правки `_LANG_NAMES`), не входит
  // в `langs` — без отдельного пункта браузер выбрал бы первый вариант «— язык —», и
  // sync() ниже отправил бы строку с пустым языком, то есть выбросил бы её. Отдельный
  // выбранный пункт с пометкой сохраняет код ровно так же, как для моделей и методов.
  const langOptionsHtml = cur => {
    const known = langs.some(o => String(o.value) === cur);
    const stray = (cur && !known)
      ? `<option value="${esc(cur)}" selected>${esc(cur)} — нет в списке, но сохранено</option>`
      : '';
    return `<option value="">— язык —</option>${stray}${langs.map(o =>
      `<option value="${esc(o.value)}"${String(o.value) === cur ? ' selected' : ''}>${
        esc(o.title)}</option>`).join('')}`;
  };

  const sync = () => {
    const parts = [];
    rows.querySelectorAll('.langmap-row').forEach(r => {
      const lang = r.querySelector('.lm-lang').value.trim();
      const voice = r.querySelector('.lm-voice').value.trim();
      if (lang && voice) parts.push(`${lang}: ${voice}`);
    });
    hidden.value = parts.join(', ');
  };

  const addRow = (lang, voice) => {
    const wrap = $(`<div class="langmap-row" style="display:flex;gap:8px;margin-bottom:6px">
      <select class="lm-lang" style="width:180px;flex:0 0 auto">${langOptionsHtml(lang || '')}</select>
      <input class="lm-voice" style="flex:1;width:auto;min-width:0"
             placeholder="${esc(idPlaceholder)}" value="${esc(voice || '')}">
      <button type="button" class="ghost small lm-del" title="убрать строку">×</button>
    </div>`);
    wrap.querySelector('.lm-lang').onchange = sync;
    wrap.querySelector('.lm-voice').oninput = sync;
    wrap.querySelector('.lm-del').onclick = () => { wrap.remove(); sync(); };
    rows.append(wrap);
  };

  parseVoiceMapRows(f.value).forEach(([lang, voice]) => addRow(lang, voice));
  box.querySelector('.langmap-add').onclick = () => addRow('', '');
  sync();
}

function saveBar(back, onSave){
  const bar = $(`<div style="display:flex;gap:10px;align-items:center">
    <button id="save">Сохранить</button>
    <a class="ghost" href="${back}" style="color:var(--muted)">Отмена</a></div>`);
  const b = bar.querySelector('#save');
  b.onclick = async () => {
    b.disabled = true;
    try{
      await onSave();
      toast('Сохранено', 'ok');
      location.hash = back;
    }catch(e){ toast(e.message); b.disabled = false; }
  };
  return bar;
}

async function viewPreset(id){
  const d = await api('/ui/presets/vsgen/' + encodeURIComponent(id));
  // Группы — вкладками, а не одной простынёй: полей три десятка, и «поменять голос»
  // не должно означать прокрутку мимо сборки и обложки.
  const slug = t => PRESET_SLUG[t] || 'ostalnoe';
  const tabs = d.groups.map(g => [slug(g.title), g.title]);
  const cur = location.hash.split('/')[3] || (tabs[0] || ['', ''])[0];
  app.innerHTML = '';
  app.append($(`<a class="back" href="#/presets">← ко всем пресетам</a>
    <h1>${esc(d.name)}</h1>
    <p class="sub">${esc(d.note)}</p>`));

    <div class="sec">Название</div>
    <input id="p-name" value="${esc(d.name)}" style="width:100%;max-width:420px"></div>`);
  app.append(name);
  app.append($(`<div class="subtabs">${tabs.map(([k, title]) =>
    `<a href="#/preset/${encodeURIComponent(id)}/${k}"
        class="${cur === k ? 'on' : ''}">${esc(title)}</a>`).join('')}</div>`));

function wirePresets(root){
  const ask = async (b, fn) => {
    b.disabled = true;
    try{ await fn(); await render(); }
    catch(e){
      b.disabled = false;
      const box = document.createElement('div');
      box.className = 'note bad';
      box.textContent = e.message;
      b.parentElement.appendChild(box);
    }
  };
  root.querySelectorAll('button.pedit').forEach(b => b.onclick =
    () => { location.hash = '#/preset/' + encodeURIComponent(b.dataset.key); });
  root.querySelectorAll('button.pcopy').forEach(b => b.onclick = () => {
    askInline(b, {value: b.dataset.name + ' — копия', ok: 'Скопировать'}, to =>
      ask(b, () => post(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/copy`,
                        {from: b.dataset.name, to})));
  });
  root.querySelectorAll('button.pdel').forEach(b => b.onclick = () => {
    confirmInline(b, `Удалить «${b.dataset.name}»?`, () =>
      ask(b, () => api(`/ui/presets/${encodeURIComponent(b.dataset.svc)}/${
        encodeURIComponent(b.dataset.name)}`, {method: 'DELETE'})));
  });
}

      </div></div>`).join('')}
    <div class="stage">
      <div class="dot ${!d.policy_set ? 's-idle' : d.auto ? 's-done' : 's-queued'}">${
        !d.policy_set ? '?' : d.auto ? '✓' : '·'}</div>
      <div class="body">
        <div class="name">${d.policy_set
          ? `Срок хранения: очистка через ${d.policy.strip_after_days ?? '—'} дн.,
             удаление через ${d.policy.drop_after_days ?? '—'} дн.`
          : 'Срок хранения не задан — ничего не удаляется'}</div>
        <div class="facts">${d.policy_set
          ? `${d.source === 'env' ? 'из .env' : 'из базы (запасной путь)'} · проверка раз в
             ${Math.round(d.every_sec / 60)} мин`
          : `задаётся в .env: <span class="mono">${esc(d.env.strip)}</span>,
             <span class="mono">${esc(d.env.drop)}</span>`}</div>
        ${d.policy_set && !d.auto ? `<div class="note">Уборка выключена: система только
           считает, что было бы удалено. Чтобы убирала сама —
           <span class="mono">${esc(d.env.auto)}=1</span> в .env.</div>` : ''}
        ${d.last && d.last.at ? `<div class="note ${d.last.errors && d.last.errors.length
            ? 'bad' : 'muted'}">последний проход ${when(d.last.at)}:
           ${esc(d.last.line || '')}${(d.last.errors || []).length
             ? ` · ошибок: ${d.last.errors.length}` : ''}</div>` : ''}
        <div class="note muted">${esc(d.how)}</div>
      </div>
    </div>
    ${d.projects.length ? `<table><thead><tr>
        <th>Проект</th><th>Объём</th><th>Промежуточное</th><th>Фаза</th>
        <th>Решение</th></tr></thead><tbody>
      ${d.projects.map(r => `<tr>
        <td><div style="font-weight:600">${esc(r.name)}</div>
            <div class="mono muted" style="font-size:11px">${esc(r.pid)}</div></td>
        <td>${size(r.total)}</td>
        <td>${size(r.strippable)}</td>
        <td>${esc(r.phase || '—')}</td>
        <td><span class="pill ${ACT_CLS[r.action]}">${ACT_TITLE[r.action]}</span></td>
      </tr>
      <tr><td colspan="5" style="padding-top:0">
        <div class="note muted">${esc(r.why)}</div>
        ${r.frees && r.paid_calls ? `<div class="note bad">безвозвратно теряются
          ${r.paid_calls} оплаченных вызовов${r.paid_cost
            ? ` на ${r.paid_cost.toFixed(0)} кр.` : ''}</div>` : ''}
        <div class="bar" title="${Object.entries(r.sizes || {})
            .map(([k, v]) => k + ': ' + size(v)).join(', ')}">
          ${Object.entries(r.sizes || {}).map(([k, v]) => `<i style="float:left;width:${
            (100 * v / Math.max(1, r.total)).toFixed(1)}%;background:${
            d.categories.find(c => c.code === k && c.fate === 'keep')
              ? 'var(--ok)' : 'var(--run)'}"></i>`).join('')}
        </div>
      </td></tr>`).join('')}
    </tbody></table>
    <div class="note muted">Синим — промежуточное, которое можно убрать.
      Зелёным — пять артефактов выпуска: они остаются всегда.
      Всего ${size(d.total)}, освободится ${size(d.freeable)}.</div>`
      : '<div class="empty">Проектов на диске нет.</div>'}
  </div>`));

  /* ── вышел ли ролик на самом деле ── */
  app.append($(`<div class="card" style="margin-top:16px">
    <div class="sec">Выход в свет</div>
    <div class="stage">
      <div class="dot ${pb.key_set ? 's-done' : 's-idle'}">${pb.key_set ? '✓' : '?'}</div>
      <div class="body">
        <div class="name">${pb.key_set
          ? `Ключ YouTube Data API задан (${esc(pb.key)})`
          : 'Ключа YouTube Data API нет — выход подтвердить нечем'}</div>
        <div class="facts">подтверждённо вышли: ${pb.confirmed} ·
          стоят в расписании: ${pb.scheduled}</div>
        <div class="note muted">${esc(pb.how)}</div>
      </div>
    </div>
    ${pb.due.length ? `<div class="sec" style="border-bottom:0">Пора спросить</div>
      ${pb.due.map(r => `<div class="stage">
        <div class="dot s-queued">·</div>
        <div class="body">
          <div class="name"><a href="#/release/${encodeURIComponent(r.release_id)}"
            >${esc(r.release_id)}</a> · <span class="mono">${esc(r.video_id)}</span></div>
          <div class="facts">слот прошёл ${r.late_hours} ч назад</div>
        </div></div>`).join('')}`
      : `<div class="note muted">Спрашивать пока некого: слоты прошли меньше
         ${pb.grace_min} мин назад либо всё уже подтверждено.</div>`}
    ${pb.checked.length ? `<div class="sec" style="border-bottom:0">Что ответил YouTube</div>
      ${pb.checked.map(x => `<div class="stage">
        <div class="dot ${PUB_CLS[x.state] || 's-idle'}">${
          x.state === 'public' ? '✓' : x.state === 'unlisted' ? '!' : '·'}</div>
        <div class="body">
          <div class="name">${esc(x.release_id)} — ${PUB_TITLE[x.state] || esc(x.state)}</div>
          <div class="facts">${when(x.at)}${x.privacy ? ' · ' + esc(x.privacy) : ''}</div>
          ${x.error ? `<div class="note muted">${esc(x.error)}</div>` : ''}
          ${x.blocked ? `<div class="note bad">${esc(x.blocked)}</div>` : ''}
        </div></div>`).join('')}` : ''}
    <div class="note muted">${esc(pb.blind_spot)}</div>
  </div>`));

  // Раздел людей появляется только у администратора: обычному он не показывается
  // и не отвечает — проверка стоит на сервере, а не на прятании кнопки.
  const people = await accountsCard();
  if (people) app.append(people);
}

/* ─────────────────────────────── роутер ─────────────────────────────── */

/* Каждая строка: какая вкладка подсвечивается, как узнать свой адрес, что рисовать.
   Раньше это была цепочка if с четырьмя булевыми переменными — при пятой вкладке
   она начала врать о подсветке. */
const ROUTES = [
  ['queue',    h => h === '#/queue',              () => viewQueue()],
  ['channels', h => h.startsWith('#/channel/'),
                                                 h  => viewChannel(h.split('/')[2])],
  ['profile',  h => h === '#/keys',               () => viewKeys()],
  ['projects', h => h === '#/text',               () => viewText()],
  ['projects', h => h === '#/covers',             () => viewCovers()],
  ['projects', h => h === '#/projects',           () => viewProjects()],
  ['projects', h => h.startsWith('#/project/') && h.endsWith('/settings'),
                                                  h  => viewProjectSettings(
                                                          decodeURIComponent(h.split('/')[2]))],
  ['projects', h => h.startsWith('#/project/'),   h  => viewProject(
                                                          decodeURIComponent(h.split('/')[2]))],
  ['profile',  h => h === '#/limits',             () => viewLimits()],
  ['presets',  h => h === '#/presets',            () => viewPresets()],
  ['presets',  h => h === '#/preset/new',          () => viewPresetNew()],
  ['presets',  h => h.startsWith('#/preset/'),     h  => viewPreset(
                                                          decodeURIComponent(h.split('/')[2]))],
  ['profile',  h => h === '#/admin',              () => viewAdmin()],
  ['channels', h => h.startsWith('#/release/'),   h  => viewRelease(decodeURIComponent(h.slice(10)))],
  ['channels', h => h === '#/new',                () => viewNew()],
  ['channels', h => h === '#/releases',           () => viewReleases()],
  ['profile',  h => h === '#/profile',            () => viewProfile()],
  ['channels', () => true,                        () => viewChannels()],
];

async function render(){
  if (!ME){
    try{ ME = await api('/ui/me'); }
    catch(e){ return viewLogin(e instanceof NeedLogin ? '' : e.message); }
  }
  document.querySelector('nav').style.visibility = '';
  showWho();
  const h = location.hash || '#/channels';
  const hit = ROUTES.find(r => r[1](h));
  // Экранов больше, чем вкладок: «Выпуски», «Текст», «Обложки» и «Админ» живут внутри
  // каналов, проектов и профиля. Подсвечиваем ту вкладку, в чей раздел попал маршрут.
  for (const id of ['channels', 'projects', 'queue', 'presets', 'profile'])
    document.getElementById('tab-' + id).classList.toggle('on', hit[0] === id);
  try{ await hit[2](h); }
  catch(e){
    // Сессия могла истечь посреди работы: это не ошибка экрана, а «войдите снова».
    if (e instanceof NeedLogin){ ME = null; return viewLogin(''); }
    fail(e);
  }
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
