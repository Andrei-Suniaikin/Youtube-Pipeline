<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio — выпуски</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e6ea;
    --ok:#127a3d; --ok-bg:#e8f5ec; --run:#1257a8; --run-bg:#e7f0fb;
    --wait:#8a5a00; --wait-bg:#fdf3e0; --bad:#a41d1d; --bad-bg:#fbeaea;
    --off:#7a7f88; --off-bg:#f0f1f3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:inherit}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav{display:flex;gap:2px;align-items:center;padding:0 16px;max-width:1080px;margin:0 auto;
      flex-wrap:wrap}
  nav .brand{font-weight:650;margin-right:18px;padding:13px 0;letter-spacing:.02em}
  nav a.tab{padding:13px 12px;color:var(--muted);text-decoration:none;
            border-bottom:2px solid transparent;white-space:nowrap}
  nav a.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:550}
  nav span.soon{padding:13px 12px;color:#b4b8bf;cursor:not-allowed;white-space:nowrap}
  nav .who{padding:13px 0 13px 14px;color:var(--muted);font-size:12px;white-space:nowrap}
  nav .who a{color:var(--muted)}
  .login{max-width:340px;margin:12vh auto;background:var(--surface);border:1px solid var(--border);
         border-radius:10px;padding:26px 24px}
  .login h1{margin:0 0 4px;font-size:19px}
  .login input{width:100%;box-sizing:border-box;padding:9px 11px;margin-top:10px;
               border:1px solid var(--border);border-radius:7px;font:inherit}
  .login button{width:100%;margin-top:14px}
  nav span.soon::after{content:" скоро";font-size:11px;opacity:.8}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,input,textarea,button{font:inherit;color:inherit}
  select,input,textarea{background:var(--card);border:1px solid var(--line);
                        border-radius:7px;padding:7px 9px}
  textarea{width:100%;min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace;
           font-size:13px}
  button{background:var(--ink);color:#fff;border:0;border-radius:7px;padding:8px 14px;
         cursor:pointer;font-weight:550}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
     color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line)}
  td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.row:hover{background:#fafbfc;cursor:pointer}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .s-done{background:var(--ok-bg);color:var(--ok)}
  .s-running{background:var(--run-bg);color:var(--run)}
  .s-queued{background:var(--wait-bg);color:var(--wait)}
  .s-error{background:var(--bad-bg);color:var(--bad)}
  .s-idle{background:var(--off-bg);color:var(--off)}
  .s-off{background:transparent;color:var(--off);border:1px dashed #c9cdd4}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .bar{height:4px;background:var(--off-bg);border-radius:3px;overflow:hidden;margin-top:7px;
       max-width:220px}
  .bar i{display:block;height:100%;background:var(--run)}
  .stage{display:flex;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .stage:last-child{border-bottom:0}
  .stage .dot{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;
              font-size:12px;font-weight:700;margin-top:1px}
  .stage .body{flex:1;min-width:0}
  .stage .name{font-weight:600}
  .stage.off .name{color:var(--off)}
  .facts{color:var(--muted);font-size:13px;margin-top:2px}
  .note{margin-top:3px;font-size:13px}
  .note.bad{color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;
        border-bottom:1px solid var(--line)}
  .grid div{padding:13px 16px;border-right:1px solid var(--line)}
  .grid div:last-child{border-right:0}
  .grid .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
           font-weight:600;margin-bottom:3px}
  .sec{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
  .ev{display:flex;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
  .ev:last-child{border-bottom:0}
  .ev time{color:var(--muted);flex:0 0 108px;font-variant-numeric:tabular-nums}
  .ev .step{flex:0 0 110px;color:var(--muted)}
  .empty{padding:34px 16px;text-align:center;color:var(--muted)}
  .chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .chcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--off);
          border-radius:10px;padding:14px 15px;cursor:pointer}
  .chcard:hover{border-color:#c9cdd4}
  .chcard.active{border-left-color:var(--ok)}
  .chcard.paused{border-left-color:var(--off);opacity:.72}
  .chcard.problem{border-left-color:var(--bad)}
  .chcard h3{margin:0 0 3px;font-size:15px}
  .chcard .meta{color:var(--muted);font-size:12.5px}
  .cal{display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
       align-items:flex-start}
  .cal:last-child{border-bottom:0}
  .cal.past{background:#fbfbfc}
  .cal time{flex:0 0 132px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .cal .dot{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;
            font-size:11px;font-weight:700;margin-top:1px}
  .cal .what{flex:1;min-width:0}
  .cal.miss .what{color:var(--bad)}
  .today{height:0;border-top:2px dashed var(--run);position:relative;margin:0 16px}
  .today span{position:absolute;top:-9px;left:0;background:var(--card);padding:0 8px;
              font-size:11px;color:var(--run);font-weight:600}
  .err{background:var(--bad-bg);color:var(--bad);padding:11px 14px;border-radius:8px;
       margin-bottom:14px}
  .res{margin-top:14px}
  .res h3{font-size:13px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em;
          color:var(--muted)}
  .res ul{margin:0 0 14px;padding-left:20px}
  .back{display:inline-block;margin-bottom:12px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--ink)}
  @media (max-width:640px){ .grid{grid-template-columns:1fr 1fr} .ev time{flex-basis:74px} }
</style>
</head>
<body>

<header>
  <nav>
    <span class="brand">Studio</span>
    <a class="tab" href="#/releases" id="tab-releases">Выпуски</a>
    <a class="tab" href="#/channels" id="tab-channels">Каналы</a>
    <a class="tab" href="#/queue" id="tab-queue">Очередь</a>
    <a class="tab" href="#/keys" id="tab-keys">Ключи</a>
    <a class="tab" href="#/presets" id="tab-presets">Пресеты</a>
    <a class="tab" href="#/admin" id="tab-admin" style="margin-left:auto">Админ</a>
    <span class="who" id="who"></span>
  </nav>
</header>

<main id="app"><div class="empty">загрузка…</div></main>

<script>
const $ = (h, ...kids) => { const e = document.createElement('div'); e.innerHTML = h; return e; };
const app = document.getElementById('app');

const STATE_TITLE = {done:'готово', running:'идёт', queued:'в очереди',
                     error:'ошибка', idle:'не начато', off:'не участвует'};
const DOT = {done:'✓', running:'◐', queued:'·', error:'!', idle:'', off:'–'};

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function when(ts){
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit',
                                    hour:'2-digit', minute:'2-digit'});
}
function size(n){
  n = Number(n || 0);
  if (n < 1048576) return (n/1024).toFixed(0) + ' КБ';
  if (n < 1073741824) return (n/1048576).toFixed(0) + ' МБ';
  return (n/1073741824).toFixed(2) + ' ГБ';
}
function ago(sec){
  if (sec == null) return '';
  if (sec < 60) return sec + ' с';
  if (sec < 3600) return Math.round(sec/60) + ' мин';
  if (sec < 86400) return Math.round(sec/3600) + ' ч';
  return Math.round(sec/86400) + ' дн';
}
class NeedLogin extends Error {}

async function api(path, opts){
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({detail:'ответ не разобран'}));
  if (r.status === 401) throw new NeedLogin(body.detail || 'нужен вход');
  if (!r.ok) throw new Error(body.detail || body.error || ('HTTP ' + r.status));
  return body;
}
async function post(path, payload){
  return api(path, {method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(payload || {})});
}
function fail(e){
  app.innerHTML = '';
  app.append($(`<div class="err">${esc(e.message)}</div>
    <p class="muted">Проверьте, что база создана: <span class="mono">python3 dev/make_db.py</span></p>`));
}

/* ─────────────────────────── список выпусков ─────────────────────────── */

let FILTERS = {channel:'', phase:'', status:''};

async function viewReleases(){
  const q = new URLSearchParams(Object.entries(FILTERS).filter(([,v]) => v)).toString();
  const [data, chs] = await Promise.all([
    api('/ui/releases' + (q ? '?' + q : '')),
    api('/ui/channels'),
  ]);

  app.innerHTML = '';
  app.append($(`<h1>Выпуски</h1>
    <p class="sub">Путь ролика от донорской ссылки до подтверждённой публикации.</p>`));

  const bar = $(`<div class="toolbar">
    <select id="f-ch"><option value="">все каналы</option>${
      chs.channels.map(c => `<option value="${c.id}" ${FILTERS.channel==String(c.id)?'selected':''}
        >${esc(c.name)}</option>`).join('')}</select>
    <select id="f-ph"><option value="">любая фаза</option>${
      data.phases.map(p => `<option value="${p.key}" ${FILTERS.phase==p.key?'selected':''}
        >${esc(p.title)}</option>`).join('')}</select>
    <select id="f-st"><option value="">любой статус</option>
      <option value="pending" ${FILTERS.status=='pending'?'selected':''}>ожидает</option>
      <option value="running" ${FILTERS.status=='running'?'selected':''}>в работе</option>
      <option value="done" ${FILTERS.status=='done'?'selected':''}>готово</option>
      <option value="blocked" ${FILTERS.status=='blocked'?'selected':''}>остановлен</option>
    </select>
    <span style="flex:1"></span>
    <button id="new">Новый выпуск по ссылке</button>
  </div>`);
  app.append(bar);
  bar.querySelector('#new').onclick = () => location.hash = '#/new';
  const bind = (id, key) => bar.querySelector(id).onchange = e => {
    FILTERS[key] = e.target.value; render();
  };
  bind('#f-ch','channel'); bind('#f-ph','phase'); bind('#f-st','status');

  if (!data.releases.length){
    app.append($(`<div class="card"><div class="empty">
      Выпусков нет. Вставьте ссылку на донора — она встанет в ближайший свободный выход канала.
    </div></div>`));
    return;
  }

  const rows = data.releases.map(r => `
    <tr class="row" data-id="${esc(r.release_id)}">
      <td>
        <div style="font-weight:600">${esc(r.donor_title || r.donor_url || r.release_id)}</div>
        <div class="muted mono">${esc(r.release_id)}</div>
      </td>
      <td>${esc(r.channel)}<div class="muted">${esc(r.lang)}</div></td>
      <td>${when(r.slot_at)}</td>
      <td>
        <span class="pill s-${r.status === 'done' ? 'done'
          : r.status === 'blocked' ? 'error'
          : r.status === 'running' ? 'running' : 'queued'}">${esc(r.phase_title)}</span>
        <div class="muted" style="margin-top:4px">шаг ${r.phase_index + 1} из ${r.phase_total}</div>
        <div class="bar"><i style="width:${
          Math.round((r.phase_index + 1) / r.phase_total * 100)}%"></i></div>
      </td>
      <td class="muted">${ago(r.idle_sec)}${r.attempts ? `<div>попыток ${r.attempts}</div>` : ''}
        ${r.blocked_reason ? `<div class="note bad">${esc(r.blocked_reason)}</div>` : ''}</td>
    </tr>`).join('');

  const table = $(`<div class="card"><table>
    <thead><tr><th>Выпуск</th><th>Канал</th><th>Выход</th><th>Фаза</th><th>Без движения</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`);
  table.querySelectorAll('tr.row').forEach(tr =>
    tr.onclick = () => location.hash = '#/release/' + tr.dataset.id);
  app.append(table);
}

/* ─────────────────────────── карточка выпуска ─────────────────────────── */

async function viewRelease(id){
  const d = await api('/ui/releases/' + encodeURIComponent(id));
  const r = d.release;

  app.innerHTML = '';
  app.append($(`<a class="back" href="#/releases">← ко всем выпускам</a>
    <h1>${esc(r.donor_title || r.release_id)}</h1>
    <p class="sub">${esc(r.channel)} · ${esc(r.lang)} · выход ${when(r.slot_at)}
      · фаза «${esc(r.phase_title)}»</p>`));

  const head = $(`<div class="card" style="margin-bottom:16px">
    <div class="grid">
      <div><div class="k">Статус</div>${esc(r.status || '—')}</div>
      <div><div class="k">Шаг</div>${r.phase_index + 1} из ${r.phase_total}</div>
      <div><div class="k">Попыток</div>${r.attempts}</div>
      <div><div class="k">Без движения</div>${ago(r.idle_sec) || '—'}</div>
      <div><div class="k">Ролик</div>${r.video_id ? esc(r.video_id) : '—'}</div>
    </div>
    ${r.blocked_reason ? `<div class="sec" style="color:var(--bad)">
        Остановлен: ${esc(r.blocked_reason)}</div>` : ''}
    ${d.stages.map(s => `
      <div class="stage ${s.state === 'off' ? 'off' : ''}">
        <div class="dot s-${s.state}">${DOT[s.state] || ''}</div>
        <div class="body">
          <div class="name">${esc(s.title)}
            <span class="pill s-${s.state}" style="margin-left:6px">${STATE_TITLE[s.state]}</span>
          </div>
          ${s.facts.length ? `<div class="facts">${s.facts.map(esc).join(' · ')}</div>` : ''}
          ${s.note ? `<div class="note ${s.state === 'error' ? 'bad' : 'muted'}"
            >${esc(s.note)}</div>` : ''}
        </div>
        <div style="white-space:nowrap;align-self:center">${
          s.job ? actions({service: s.job.service, id: s.job.id,
                           state: s.state, status: s.job.status}) : ''}</div>
      </div>`).join('')}
  </div>`);
  app.append(head);
  // Повтор одного этапа не трогает соседние: кнопка обращается ровно к той задаче,
  // на которой этап держится, и в тот сервис, которому она принадлежит.
  wireActions(head);

  app.append($(`<div class="card">
    <div class="sec">Что происходило</div>
    ${d.events.length ? d.events.map(e => `<div class="ev">
        <time>${when(e.created)}</time>
        <div class="step">фаза</div>
        <div>${esc(e.phase_title)}${e.video_id ? ' · ролик ' + esc(e.video_id) : ''}</div>
      </div>`).join('') : ''}
    ${d.log.map(l => `<div class="ev">
        <time>${when(l.ts)}</time>
        <div class="step">${esc(l.step)}</div>
        <div${l.level === 'warn' || l.level === 'error' ? ' class="note bad"' : ''}
          >${esc(l.message)}</div>
      </div>`).join('')}
    ${!d.events.length && !d.log.length ? '<div class="empty">Записей пока нет.</div>' : ''}
  </div>`));
}

/* ───────────────────────────── ключи ───────────────────────────── */

function dur(sec){
  if (sec == null) return '—';
  if (sec < 60) return sec + ' с';
  if (sec < 3600) return Math.round(sec/60) + ' мин';
  if (sec < 86400) return Math.round(sec/3600) + ' ч';
  return Math.round(sec/86400) + ' дн';
}

async function viewKeys(){
  const d = await api('/ui/keys');
  app.innerHTML = '';
  app.append($(`<h1>Ключи</h1>
    <p class="sub">Что занято, кто ждёт и до какого времени отдыхает ключ —
      вместо «свободных слотов», которые ничего не говорят.</p>`));

  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Очередь по провайдерам</div>
    ${d.providers.length ? `<table><thead><tr>
        <th>Провайдер</th><th>Ждут</th><th>В работе</th><th>Старейшая ждёт</th>
      </tr></thead><tbody>${d.providers.map(p => `<tr>
        <td style="font-weight:600">${esc(p.provider)}</td>
        <td>${p.queued}</td><td>${p.running}</td>
        <td class="${p.oldest_wait_sec > 6*3600 ? 'note bad' : 'muted'}">
          ${p.queued ? dur(p.oldest_wait_sec) : '—'}
          ${p.oldest_wait_sec > 6*3600 ? ' — дольше шести часов' : ''}</td>
      </tr>`).join('')}</tbody></table>`
      : '<div class="empty">Очередь пуста.</div>'}
  </div>`));

  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Отдыхающие ключи</div>
    ${d.resting.length ? d.resting.map(r => `<div class="stage">
        <div class="dot s-queued">⏳</div>
        <div class="body">
          <div class="name">${esc(r.family)} · <span class="mono">${esc(r.mask)}</span></div>
          <div class="facts">проснётся через ${dur(r.left_sec)}${
            r.noticed_by_neighbour ? ' · лимит заметил соседний сервис' : ''}</div>
          <div class="note muted">${esc(r.why)}</div>
        </div></div>`).join('')
      : '<div class="empty">Все ключи в строю.</div>'}
  </div>`));

  app.append($(`<div class="card" style="margin-bottom:16px">
    <div class="sec">Свои ключи пользователей</div>
    ${d.own_keys.length ? `<table><thead><tr>
        <th>Пользователь</th><th>Провайдер</th><th>Ключей</th><th>Раздача</th>
      </tr></thead><tbody>${d.own_keys.map(o => `<tr>
        <td>${esc(o.user)}</td><td>${esc(o.family)}</td><td>${o.count}</td>
        <td>${o.pooled
          ? '<span class="pill s-done">по кругу между ключами</span>'
          : '<span class="pill s-idle">ключ один</span>'}</td>
      </tr>`).join('')}</tbody></table>
      <div class="sec" style="border-bottom:0;font-weight:400" class="muted">
        Значения ключей наружу не отдаются — ни здесь, ни в API: только количество и маска.
      </div>`
      : '<div class="empty">Свои ключи не заданы — всё идёт на серверные.</div>'}
  </div>`));

  if (d.unavailable && d.unavailable.length){
    app.append($(`<div class="card">
      <div class="sec">Чего отсюда не видно</div>
      ${d.unavailable.map(u => `<div class="stage">
        <div class="dot s-idle">?</div>
        <div class="body"><div class="name">${esc(u.what)}</div>
        <div class="note muted">${esc(u.why)}</div></div></div>`).join('')}
    </div>`));
  }
}

/* ───────────────────────────── каналы ───────────────────────────── */

const CAL_TITLE = {done:'вышел', running:'в работе', blocked:'остановлен',
                   planned:'запланирован', missed:'пропуск', free:'свободен'};
const CAL_DOT   = {done:'✓', running:'◐', blocked:'!', planned:'·', missed:'✗', free:'○'};
const CAL_CLS   = {done:'s-done', running:'s-running', blocked:'s-error',
                   planned:'s-queued', missed:'s-error', free:'s-idle'};

async function viewChannels(){
  const d = await api('/ui/channels');
  app.innerHTML = '';
  app.append($(`<h1>Каналы</h1>
    <p class="sub">Расписание выходов, план и история. Цвет карточки — состояние канала.</p>`));

  if (!d.channels.length){
    app.append($(`<div class="card"><div class="empty">Каналов нет.</div></div>`));
    return;
  }
  const cls = c => c.status === 'active' ? 'active'
                 : c.status === 'paused' ? 'paused'
                 : c.status === 'problem' ? 'problem' : '';
  const grid = $(`<div class="chgrid">${d.channels.map(c => `
    <div class="chcard ${cls(c)}" data-id="${c.id}">
      <h3>${esc(c.name)}</h3>

      {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    const link = r.project_id ? `#/release/${esc(r.release_id)}` : (r.donor_url || '');

    rows.push(`<div class="cal ${r.past ? 'past' : ''} ${r.state === 'missed' ? 'miss' : ''}">
      <time>${when_}</time>
      <div class="dot ${CAL_CLS[r.state]}">${CAL_DOT[r.state]}</div>
      <div class="what">
        ${link ? `<a href="${esc(link)}" ${r.project_id ? '' : 'target=_blank rel=noopener'}
            style="font-weight:600">${esc(title)}</a>`
               : `<span style="font-weight:${r.state === 'free' ? '400' : '600'}">${esc(title)}</span>`}
        <div class="muted" style="font-size:12.5px">
          ${esc(CAL_TITLE[r.state])}${r.phase_title ? ' · ' + esc(r.phase_title) : ''}
          ${r.beyond_horizon ? ' · за горизонтом канала' : ''}
        </div>
        ${r.blocked_reason ? `<div class="note bad">${esc(r.blocked_reason)}</div>` : ''}
      </div></div>`);
  }
  if (!drawn) rows.push('<div class="today"><span>сейчас</span></div>');
  app.append($(`<div class="card">${rows.join('')}</div>`));
}

/* Кнопка показывается только там, где действие имеет смысл: отменить можно то, что
   ещё идёт, повторить — то, что уже упало. Кнопка, которая всегда есть и через раз
   отвечает «нельзя», обучает не нажимать её вовсе. */
function actions(r){
  const btn = (act, title) =>
    `<button class="ghost act" data-service="${esc(r.service)}" data-id="${esc(r.id)}"
             data-act="${act}">${title}</button>`;
  if (r.state === 'running' || r.state === 'queued') return btn('cancel', 'Отменить');
  if (r.state === 'error' || r.status === 'cancelled') return btn('retry', 'Повторить');
  return '';
}

function wireActions(root){
  root.querySelectorAll('button.act').forEach(b => {
    b.onclick = async () => {
      const {service, id, act} = b.dataset;
      b.disabled = true;
      const was = b.textContent;
      b.textContent = '…';
      try{
        await post(`/ui/actions/${encodeURIComponent(service)}/${encodeURIComponent(id)}/${act}`);
        await render();
      }catch(e){
        b.disabled = false;
        b.textContent = was;
        // Отказ сервиса — это ответ, а не сбой экрана: показываем его словами рядом
        // с той строкой, к которой он относится.
        const box = document.createElement('div');
        box.className = 'note bad';
        box.textContent = e.message;
        b.parentElement.appendChild(box);
      }
    };
  });
}

      </div>
    </div>
    ${pb.due.length ? `<div class="sec" style="border-bottom:0">Пора спросить</div>
      ${pb.due.map(r => `<div class="stage">
        <div class="dot s-queued">·</div>
        <div class="body">
          <div class="name"><a href="#/release/${encodeURIComponent(r.release_id)}"
            >${esc(r.release_id)}</a> · <span class="mono">${esc(r.video_id)}</span></div>
          <div class="facts">слот прошёл ${r.late_hours} ч назад</div>
        </div></div>`).join('')}`
      : `<div class="note muted">Спрашивать пока некого: слоты прошли меньше
         ${pb.grace_min} мин назад либо всё уже подтверждено.</div>`}
    ${pb.checked.length ? `<div class="sec" style="border-bottom:0">Что ответил YouTube</div>
      ${pb.checked.map(x => `<div class="stage">
        <div class="dot ${PUB_CLS[x.state] || 's-idle'}">${
          x.state === 'public' ? '✓' : x.state === 'unlisted' ? '!' : '·'}</div>
        <div class="body">
          <div class="name">${esc(x.release_id)} — ${PUB_TITLE[x.state] || esc(x.state)}</div>
          <div class="facts">${when(x.at)}${x.privacy ? ' · ' + esc(x.privacy) : ''}</div>
          ${x.error ? `<div class="note muted">${esc(x.error)}</div>` : ''}
          ${x.blocked ? `<div class="note bad">${esc(x.blocked)}</div>` : ''}
        </div></div>`).join('')}` : ''}
    <div class="note muted">${esc(pb.blind_spot)}</div>
  </div>`));
}

/* ─────────────────────────────── роутер ─────────────────────────────── */

/* Каждая строка: какая вкладка подсвечивается, как узнать свой адрес, что рисовать.
   Раньше это была цепочка if с четырьмя булевыми переменными — при пятой вкладке
   она начала врать о подсветке. */
const ROUTES = [
  ['queue',    h => h === '#/queue',              () => viewQueue()],
  ['channels', h => h === '#/channels',           () => viewChannels()],
  ['channels', h => h.startsWith('#/channel/'),   h  => viewChannel(decodeURIComponent(h.slice(10)))],
  ['keys',     h => h === '#/keys',               () => viewKeys()],
  ['presets',  h => h === '#/presets',            () => viewPresets()],
  ['admin',    h => h === '#/admin',              () => viewAdmin()],
  ['releases', h => h.startsWith('#/release/'),   h  => viewRelease(decodeURIComponent(h.slice(10)))],
  ['releases', h => h === '#/new',                () => viewNew()],
  ['releases', () => true,                        () => viewReleases()],
];

async function render(){
  if (!ME){
    try{ ME = await api('/ui/me'); }
    catch(e){ return viewLogin(e instanceof NeedLogin ? '' : e.message); }
  }
  document.querySelector('nav').style.visibility = '';
  showWho();
  const h = location.hash || '#/releases';
  const hit = ROUTES.find(r => r[1](h));
  for (const id of ['releases', 'channels', 'queue', 'keys', 'presets', 'admin'])
    document.getElementById('tab-' + id).classList.toggle('on', hit[0] === id);
  try{ await hit[2](h); }
  catch(e){
    // Сессия могла истечь посреди работы: это не ошибка экрана, а «войдите снова».
    if (e instanceof NeedLogin){ ME = null; return viewLogin(''); }
    fail(e);
  }
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
