<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Облик «Монтажная» (выбор владельца 22.09.2026): пульт как монтажный стол.
     Графитовые панели без оттенка, хром отступает; цвет появляется только там, где он
     значит состояние, — как цвет клипа на дорожке. Действие — светлая «кость» без
     оттенка: её нельзя спутать ни с одним состоянием. Состояния различимы и без
     цвета: готово — тихий тон с ✓, идёт — бегущая штриховка, ждёт — неподвижная
     штриховка в контуре, ошибка — единственная сплошная яркая заливка с «!»,
     не начато — пустой контур. */
  :root{
    --bg:#26272b;            /* зазор между панелями */
    --card:#2f3035;          /* панель */
    --card-2:#383a3f;        /* приподнятое: наведение, всплывающее */
    --well:#212226;          /* колодец поля ввода */
    --strip:#2a2b30;         /* полоса заголовка панели */
    --line:#393b40;
    --line-2:#4b4d53;
    --ink:#dcdde0;           /* основной текст */
    --ink-hi:#f4f4f5;        /* заголовки и активное */
    --muted:#a3a5ac;         /* 5.35:1 на панели */
    --acc:#e6e2d8;           /* кость: действие и текущее место */
    --acc-hi:#f4f2ec;
    --acc-dim:rgba(230,226,216,.13);
    --on-acc:#1b1c1f;
    --ok:#8ddba6;   --ok-bg:rgba(141,219,166,.14);
    --run:#93c6f6;  --run-bg:rgba(147,198,246,.14);  --run-clip:#35698f;
    --wait:#efc063; --wait-bg:rgba(239,192,99,.14);
    --bad:#ff9483;  --bad-bg:rgba(255,148,131,.15);  --bad-clip:#e8604d;
    --off:#a9abb2;  --off-bg:rgba(169,171,178,.12);
    --surface:var(--card); --border:var(--line);
    --r:10px;                /* панели, всплывающее */
    --r-sm:7px;              /* кнопки, поля, сегменты */
    --r-xs:5px;              /* теги, клипы, чипы */
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  ::selection{background:var(--acc);color:var(--on-acc)}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",
            Inter,Roboto,system-ui,sans-serif;
       font-weight:450;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  a{color:var(--acc-hi);text-decoration:none}
  a:hover{color:var(--ink-hi)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  header{background:rgba(13,11,18,.86);backdrop-filter:saturate(160%) blur(12px);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav{display:flex;gap:2px;align-items:center;padding:0 20px;max-width:1180px;margin:0 auto;
      flex-wrap:wrap}
  nav .brand{font-weight:800;margin-right:22px;padding:15px 0;letter-spacing:-.02em;
             font-size:17px;color:var(--ink-hi)}
  nav .brand b{color:var(--acc-hi)}
  nav a.tab{padding:15px 13px;color:var(--muted);text-decoration:none;font-weight:550;
            border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
  nav a.tab:hover{color:var(--ink)}
  nav a.tab.on{color:var(--ink-hi);border-bottom-color:var(--acc)}
  nav span.soon{padding:15px 13px;color:var(--off);cursor:not-allowed;white-space:nowrap}
  nav span.soon::after{content:" скоро";font-size:11px;opacity:.8}
  /* Имя человека — вход в профиль (20.09.2026), отдельной вкладки «Профиль» больше нет:
     поэтому `margin-left:auto` переехал сюда с неё. Вертикальные отступы сняты со span и
     остались у вкладки внутри — иначе они сложились бы и шапка стала бы вдвое выше. */
  nav .who{margin-left:auto;display:flex;align-items:center;gap:12px;
           color:var(--muted);white-space:nowrap}
  /* Размер имени — как у остальных вкладок (15px, из body): оно теперь такая же
     вкладка. Мелким остаётся только «выйти» — это не раздел, а действие. */
  /* «Выйти» — значок, а не слово (владелец 24.09.2026): это действие, и в ряду
     разделов слово читалось как ещё один раздел. Ровняется по центру строки, как
     имя рядом. */
  nav .who a.out{color:var(--muted);text-decoration:none;display:inline-flex;
                 align-items:center;justify-content:center;width:30px;height:30px;
                 border-radius:8px;margin-left:4px}
  nav .who a.out svg{width:18px;height:18px;display:block}
  nav .who a.out:hover{color:var(--ink);background:rgba(255,255,255,.06)}

  main{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
  h1{font-size:26px;margin:0 0 5px;font-weight:750;letter-spacing:-.02em;color:var(--ink-hi)}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  /* Заголовок, у которого подзаголовок уехал под знак вопроса, сам держит отступ до
     первой карточки: иначе экран начинался вплотную к ней. */
  h1:last-child{margin-bottom:17px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

  select,input,textarea,button{font:inherit;color:inherit}
  select,input,textarea{background:var(--card-2);border:1px solid var(--line-2);
                        border-radius:9px;padding:9px 11px;color:var(--ink)}
  select:focus,input:focus,textarea:focus{outline:0;border-color:var(--acc);
                                          box-shadow:0 0 0 3px var(--acc-dim)}
  textarea{width:100%;min-height:120px;resize:vertical;
           font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px}
  button{background:var(--acc);color:var(--on-acc);border:0;border-radius:9px;padding:9px 16px;
         cursor:pointer;font-weight:650;letter-spacing:-.01em;transition:background .15s}
  button:hover{background:var(--acc-hi)}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
  button.ghost:hover{background:var(--card-2);color:var(--ink-hi)}
  button:disabled{opacity:.45;cursor:default}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line)}
  td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  tr.row:hover,tr[data-job]:hover{background:var(--card-2);cursor:pointer}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;
        font-weight:650;letter-spacing:-.01em}
  .s-done{background:var(--ok-bg);color:var(--ok)}
  .s-running{background:var(--run-bg);color:var(--run)}
  .s-queued{background:var(--wait-bg);color:var(--wait)}
  .s-error{background:var(--bad-bg);color:var(--bad)}
  .s-idle{background:var(--off-bg);color:var(--off)}
  .s-off{background:transparent;color:var(--off);border:1px dashed var(--line-2)}
  .muted{color:var(--muted)}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px}
  .bar{height:5px;background:var(--card-2);border-radius:4px;overflow:hidden;margin-top:8px;
       max-width:230px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc-hi))}
  /* Полоска по этапам: семь отрезков вместо одной шкалы «сколько процентов».
     Процент по выпуску — выдумка: этапы разной длины и часть из них необязательна. */
  .segs{display:flex;gap:3px;margin-top:7px;max-width:260px}
  .segs i{flex:1;height:5px;border-radius:2px;background:var(--off-bg);cursor:default}
  .segs i.done{background:var(--ok)}
  .segs i.running{background:linear-gradient(90deg,var(--acc),var(--acc-hi));
                  animation:pulse 1.6s ease-in-out infinite}
  .segs i.queued{background:var(--wait);opacity:.55}
  .segs i.error{background:var(--bad)}
  .segs i.off{background:transparent;border:1px dashed var(--line-2)}
  /* Переделать один кадр — ТЗ §14. Кнопка появляется на самой миниатюре: искать
     номер сцены в отдельном поле человек не станет, он смотрит на картинку. */
  /* Просмотр картинки на месте. Раньше миниатюра вела <a target="_blank"> — то есть
     смотреть кадры означало открыть двадцать вкладок и потерять, где ты был. */
  dialog.lb{border:0;background:transparent;padding:0;max-width:96vw;max-height:96vh}
  dialog.lb::backdrop{background:rgba(0,0,0,.86)}
  dialog.lb img{max-width:96vw;max-height:86vh;display:block;border-radius:8px;
                margin:0 auto;object-fit:contain}
  dialog.lb .lbbar{display:flex;align-items:center;gap:14px;justify-content:center;
                   padding:10px 4px 0;color:#cfc9da;font-size:13px}
  dialog.lb .lbbar button{background:rgba(255,255,255,.08);color:#fff;border:0;
                   border-radius:7px;padding:6px 13px;cursor:pointer;font-size:14px}
  dialog.lb .lbbar button:hover{background:rgba(255,255,255,.16)}
  dialog.lb .lbname{max-width:46vw;overflow:hidden;text-overflow:ellipsis;
                    white-space:nowrap;opacity:.8}
  /* Плеер: у встроенного в браузер вид чужой и разный в каждом браузере. */
  .pl{display:flex;align-items:center;gap:11px;padding:9px 12px;margin-top:6px;
      border:1px solid var(--line);border-radius:9px;background:var(--card-2,rgba(255,255,255,.03))}
  /* Глиф ▶ внутри круга смотрится съехавшим: у него своя внутренняя пустота слева.
     Поэтому кнопка — flex-контейнер, а сам знак рисуется рамками, без шрифта. */
  .pl button{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
             background:var(--acc,#8b7bf0);display:flex;align-items:center;
             justify-content:center;padding:0}
  .pl button i{display:block;width:0;height:0;border-style:solid;
               border-width:6px 0 6px 10px;border-color:transparent transparent
               transparent #fff;margin-left:2px}
  .pl button.on i{width:10px;height:11px;border:0;margin:0;
                  background:linear-gradient(to right,#fff 0 3px,transparent 3px 7px,#fff 7px 10px)}
  .pl .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.13);
           position:relative;cursor:pointer}
  .pl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;
             background:var(--acc,#8b7bf0);width:0}
  .pl .t{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:12px;opacity:.75}
  .thumb{position:relative;display:inline-block;line-height:0}
  .thumb img{display:block;border-radius:5px;border:1px solid var(--line)}
  /* 21.09.2026: у вертикального формата 9:16 миниатюра уже кнопки, и «переделать»
     вылезала за левый край карточки на два десятка пикселей. Ширину ограничиваем
     самой миниатюрой; длинная подпись обрезается многоточием, а не ломает вёрстку. */
  .thumb .again{position:absolute;right:3px;bottom:3px;opacity:0;transition:opacity .12s;
                max-width:calc(100% - 6px);overflow:hidden;text-overflow:ellipsis;
                white-space:nowrap;
                background:rgba(13,11,18,.82);color:#fff;border:0;border-radius:5px;
                padding:2px 7px;font-size:11px;font-weight:650;cursor:pointer;line-height:1.5}
  .thumb:hover .again{opacity:1}
  .thumb .again:hover{background:var(--acc)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .stage{display:flex;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .stage:last-child{border-bottom:0}
  .stage .dot{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;
              font-size:12px;font-weight:800;margin-top:1px}
  .stage .body{flex:1;min-width:0}
  .stage .name{font-weight:650;color:var(--ink-hi)}
  .stage.off .name{color:var(--off)}
  .facts{color:var(--muted);font-size:13.5px;margin-top:3px}
  .note{margin-top:4px;font-size:13px;color:var(--muted)}
  .note.bad{color:var(--bad)}
  /* Причина остановки словами (block_reasons, 03.10.2026): чья беда — цветом метки. */
  .blktag{display:inline-block;border-radius:var(--r-xs);padding:1px 7px;margin-right:7px;
    font-size:11.5px;font-weight:600;vertical-align:1px}
  .blktag.donor{background:var(--wait-bg);color:var(--wait)}
  .blktag.channel{background:var(--run-bg);color:var(--run)}
  /* Сбой студии — наша беда: красная метка; обложка — нейтральная (04.10.2026). */
  .blktag.studio{background:var(--bad-bg);color:var(--bad)}
  /* Вход в Google, профиль AdsPower, прокси — своя сторона (09.10.2026). */
  .blktag.access{background:var(--run-bg);color:var(--ink-hi)}
  .blk.access{border-left-color:var(--run)}
  /* «!» — нужны люди (09.10.2026): на вкладке верхней панели, на карточке и на канале. */
  /* 11.10.2026: «неявный» — белое на светло-розовом --bad сливалось с тёмной панелью.
     Насыщенный красный, крупнее и с ободком под цвет фона: читается с первого взгляда. */
  .attn{display:inline-flex;align-items:center;justify-content:center;min-width:19px;
    height:19px;padding:0 5px;margin-left:6px;border-radius:10px;background:var(--bad-clip);
    color:#fff;font-size:13px;font-weight:800;line-height:1;vertical-align:1px;
    box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--bad-clip),0 0 10px rgba(232,96,77,.55)}
  /* На карточке канала — в правом верхнем углу, поверх рамки (11.10.2026). */
  .chcard{position:relative}
  .attn.corner{position:absolute;top:-8px;right:-8px;margin:0;z-index:1}
  .attn.whytip,.pill.whytip{text-decoration:none}
  .attnbar{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin:0 0 14px;
    padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--line);
    border-left:3px solid var(--bad);background:var(--bad-bg);font-size:13.5px}
  .attnbar b{color:var(--bad)}
  /* Календарь периода сводки (04.10.2026). Всплывает поверх страницы, в тех же цветах,
     что карточки: подложка карточки, выбранный отрезок — приглушённым акцентом, края
     отрезка — акцентом, сегодня — обводкой. */
  .pp-btn{display:inline-flex;align-items:center;gap:8px}
  .pp-ico{font-size:13px;color:var(--muted)}
  .pp-car{font-size:11px;color:var(--muted)}
  .pp-pop{position:absolute;z-index:45;display:flex;gap:6px;padding:12px;
    background:var(--card);border:1px solid var(--line-2);
    box-shadow:0 18px 44px -16px rgba(0,0,0,.75)}
  .pp-presets{display:flex;flex-direction:column;gap:2px;padding-right:10px;
    border-right:1px solid var(--line);min-width:128px}
  .pp-preset{background:transparent;color:var(--ink);text-align:left;font-weight:500;
    padding:7px 10px;border-radius:var(--r-xs)}
  .pp-preset:hover,.pp-preset:focus-visible{background:var(--card-2);color:var(--ink-hi)}
  .pp-preset.on{background:var(--acc-dim);color:var(--ink-hi)}
  .pp-cal{padding-left:8px;width:300px}
  .pp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .pp-nav b{font-weight:650;color:var(--ink-hi)}
  .pp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .pp-wd{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0}
  .pp-day{background:transparent;color:var(--ink);padding:0;height:34px;font-weight:500;
    border-radius:var(--r-xs);font-variant-numeric:tabular-nums;border:1px solid transparent}
  .pp-day:hover{background:var(--card-2);color:var(--ink-hi)}
  .pp-day.out{color:var(--off)}
  /* «now», а не «today»: глобальный .today — это пунктирная черта «сейчас» на ленте
     канала (height:0; border-top), и она резала клетку сегодняшнего дня. */
  .pp-day.now{box-shadow:inset 0 0 0 1px var(--line-2)}
  .pp-day.in{background:var(--acc-dim);color:var(--ink-hi);border-radius:0}
  .pp-day.lo,.pp-day.hi{background:var(--acc);color:var(--on-acc);font-weight:700}
  .pp-day.lo{border-radius:var(--r-xs) 0 0 var(--r-xs)}
  .pp-day.hi{border-radius:0 var(--r-xs) var(--r-xs) 0}
  .pp-day.lo.hi{border-radius:var(--r-xs)}
  .pp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
  .pp-foot button{padding:6px 12px}
  .pp-foot .pp-sel{flex:1;min-width:0}
  .pp-foot>span:last-child{display:flex;gap:6px;flex:none}
  @media (max-width:640px){
    .pp-pop{flex-direction:column;left:8px!important;right:8px;width:auto}
    .pp-presets{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);
      padding:0 0 8px;min-width:0}
    .pp-cal{width:auto;padding-left:0}
  }
  .blktag.cover{background:var(--acc-dim);color:var(--ink-hi)}
  /* Ролик, возможно, уже на канале — нужен взгляд человека (09.10.2026). */
  .blktag.check{background:var(--wait-bg);color:var(--ink-hi)}
  .blk.check{border-left-color:var(--wait)}
  /* Причина остановки с полным объяснением при наведении (09.10.2026). */
  .whytip{cursor:help;text-decoration:underline dotted;text-underline-offset:3px;
    text-decoration-color:var(--line-2)}
  .qbox.wide{max-width:min(460px,calc(100vw - 16px));white-space:pre-line}
  .blk{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);
    border-left:3px solid var(--bad);background:var(--well);color:var(--ink);font-weight:400}
  .blk.donor{border-left-color:var(--wait)}
  .blk.channel{border-left-color:var(--run)}
  .blk.cover{border-left-color:var(--muted)}
  .cvr{display:flex;gap:16px;align-items:flex-start;margin-top:10px;flex-wrap:wrap}
  .cvr-img img{display:block;width:320px;max-width:100%;border-radius:var(--r-sm);
    border:1px solid var(--line)}
  .cvr-body{flex:1;min-width:220px}
  .cvr-notes{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
  .blk .blkhead{font-weight:600;color:var(--ink-hi)}
  .blk p{margin:6px 0 0;font-size:13.5px;line-height:1.45}
  .blk .blkacts{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  /* Строка поиска и отборов над списком каналов. */
  .sieve-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sieve .secbody{padding:14px 18px}
  /* Строка чисел под названием канала. */
  .topline{margin:-4px 0 14px;font-size:14px;color:var(--fg)}
  .topline .sep{margin:0 10px;color:var(--off)}
  /* Канал в цифрах: три числа в ряд, на узком экране — в столбик. */
  .statgrid{display:flex;gap:38px;flex-wrap:wrap}
  .statgrid>div{min-width:170px}
  .statnum{font-size:26px;line-height:1.15;letter-spacing:-.01em}
  .delta{font-weight:600}
  .delta.up{color:var(--ok)}
  .delta.down{color:var(--bad)}
  /* Предупреждение при успехе (рерайт отдаёт «текст короче цели»): работа сделана,
     но смотреть на неё стоит. Красный тут соврал бы про отказ, серый — промолчал. */
  .note.warn{color:var(--wait)}
  /* Что происходит с задачей СЕЙЧАС — стадия и сколько уже идёт, строкой под именем.
     Перенос по словам разрешён: фразы соседа бывают длинными («ru: старт — 1 частей»,
     «идёт 12 мин, ждала очереди 4 мин»), а колонка очереди не резиновая. */
  .qnow{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:0;
        border-bottom:1px solid var(--line)}
  .grid div{padding:14px 18px;border-right:1px solid var(--line)}
  .grid div:last-child{border-right:0}
  .grid .k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
           font-weight:700;margin-bottom:4px}
  .sec{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;
       color:var(--ink-hi);letter-spacing:-.01em}
  .ev{display:flex;gap:13px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
  .ev:last-child{border-bottom:0}
  .ev time{color:var(--muted);flex:0 0 112px;font-variant-numeric:tabular-nums}
  .ev .step{flex:0 0 112px;color:var(--muted)}
  /* Текст строки ленты занимает остаток и переносится даже без пробелов: ответ заливщика
     — это длинный JSON одной «строкой», и он растягивал карточку и всю страницу вбок
     (04.10.2026, «текст ошибки разъезжается»). */
  .ev>div:last-child{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
  .stage .facts,.stage .note{overflow-wrap:anywhere}
  .empty{padding:44px 18px;text-align:center;color:var(--muted)}
  .empty .why{color:var(--ink);font-size:14.5px}
  .empty .means{margin-top:5px;font-size:13px;max-width:52ch;
                margin-left:auto;margin-right:auto}
  .empty .act{margin-top:13px;font-size:13.5px}
  /* «Не знаем» не имеет права выглядеть как «пусто»: свой цвет и своя рамка. */
  .empty.unknown{background:var(--bad-bg);border-radius:9px}
  .empty.unknown .why{color:var(--bad);font-weight:600}

  .chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
  .chcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--off);
          border-radius:var(--r);padding:16px 17px;cursor:pointer;transition:border-color .15s}
  .chcard:hover{border-color:var(--line-2);border-left-color:var(--acc)}
  .chcard.active{border-left-color:var(--ok)}
  .chcard.paused{border-left-color:var(--off);opacity:.65}
  .chcard.problem{border-left-color:var(--bad)}
  .chcard h3{margin:0 0 4px;font-size:16px;font-weight:700;color:var(--ink-hi)}
  .chcard .meta{color:var(--muted);font-size:13px}

  /* Режим выбора. Отметка — внутри карточки, слева: снаружи она уехала бы в зазор
     сетки и на узком экране слиплась бы с соседней карточкой. Отступ снизу у сетки —
     чтобы прибитая к низу строка действий не накрыла последний ряд. */
  .chgrid.picking{padding-bottom:112px}
  .chgrid.picking .chcard{padding-left:44px;position:relative}
  .chmark{position:absolute;left:15px;top:17px;width:19px;height:19px;border-radius:50%;
          border:2px solid var(--line-2);display:grid;place-items:center;font-size:12px;
          line-height:1;color:transparent}
  .chcard.on{border-left-color:var(--acc);background:var(--card-2)}
  .chcard.on .chmark{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
  /* Строка действий не уезжает при прокрутке: выбор идёт по всему списку, и кнопка,
     до которой надо доскроллить, превращает выбор в две работы вместо одной. */
  .bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card-2);
           border-top:1px solid var(--line-2);padding:11px 18px}
  .bulkbar[hidden]{display:none}
  .bulkrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
           max-width:1180px;margin:0 auto}
  .bulkbar #b-count{font-weight:700;color:var(--ink-hi)}
  .bulkbar .bnote{max-width:1180px;margin:7px auto 0;font-size:12.5px}
  .bulksep{flex:1 1 0;min-width:0}

  .cal{display:flex;gap:13px;padding:11px 18px;border-bottom:1px solid var(--line);
       align-items:flex-start}
  .cal:last-child{border-bottom:0}
  .cal.past{background:rgba(255,255,255,.02)}
  .cal time{flex:0 0 136px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .cal .dot{flex:0 0 21px;height:21px;border-radius:50%;display:grid;place-items:center;
            font-size:11px;font-weight:800;margin-top:1px}
  .cal .what{flex:1;min-width:0}
  .cal.miss .what{color:var(--bad)}
  .cal.clickable{cursor:pointer}
  .cal.clickable:hover{background:rgba(255,255,255,.03)}
  .cal.clickable:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .today{height:0;border-top:2px dashed var(--acc);position:relative;margin:0 18px}
  .today span{position:absolute;top:-9px;left:0;background:var(--card);padding:0 9px;
              font-size:11px;color:var(--acc-hi);font-weight:700}

  .err{background:var(--bad-bg);color:var(--bad);padding:12px 15px;border-radius:9px;
       margin-bottom:14px;border:1px solid rgba(248,113,113,.25)}
  .res{margin-top:15px}
  .res h3{font-size:11px;margin:0 0 7px;text-transform:uppercase;letter-spacing:.07em;
          color:var(--muted);font-weight:700}
  .res ul{margin:0 0 14px;padding-left:20px}
  .upsteps{display:flex;align-items:center;gap:5px;margin:5px 0 3px}
  .upstep{width:26px;height:3px;border-radius:2px;background:var(--line-2)}
  .upstep.on{background:var(--acc)}
  /* Врезка-вопрос висит НАД содержимым, а не стоит в потоке рядом с кнопкой. В потоке
     она была ещё одним элементом flex-шапки: от одного нажатия «Создать» заголовок
     сужался, кнопка уезжала влево, а страница вырастала на полторы сотни пикселей
     (жалоба владельца 21.09.2026 «всё съезжает»). Координаты ставит `inlineBox` от
     самой кнопки — иначе врезка открывалась бы в углу карточки, далеко от нажатого.
     Тень обязательна: поверх чужого текста одной рамки мало, чтобы отделить врезку
     от того, что под ней.
     Ширина — по содержимому, а предел — от экрана, не от контейнера: абсолютный блок
     браузер иначе ужимает до ширины родителя, и в ячейке «×» шириной 64 px вопрос
     складывался в столбик по одному слову. */
  .inline-ask{position:absolute;z-index:30;display:inline-flex;gap:6px;align-items:center;
              flex-wrap:wrap;white-space:normal;width:max-content;
              max-width:min(440px,calc(100vw - 32px));
              padding:4px 8px;background:var(--card-2);border:1px solid var(--line-2);
              border-radius:8px;font-size:13px;
              box-shadow:0 16px 40px -14px rgba(0,0,0,.7)}
  .inline-ask .ask-in{width:210px}
  /* Подпись поля и её знак вопроса — соседи, а не матрёшка: кнопка внутри <label>
     недопустима по HTML и дописывает весь текст подсказки к имени поля — читалка
     объявляла бы «Тема, вопрос, <абзац руководства>» на каждом заходе в поле. */
  .lh{display:inline-flex;align-items:center;gap:6px}
  div.lh>label,span.lh>label{margin:0}
  .fldrow>.lh:first-child{min-width:175px}
  .fldrow>.lh:first-child>label{color:var(--muted);font-size:12.5px;font-weight:550}
  /* Знак вопроса у подписи. Руководство «за что отвечает это поле» раскрывается по нему,
     а не стоит под каждым полем постоянной строкой: сплошной текст под формой человек
     перестаёт читать целиком, и вместе с ним перестаёт видеть предупреждения про деньги
     и необратимое. Те остаются открытым текстом и под знак вопроса не убираются. */
  /* Знак подсказки скакал относительно текста в заголовках (жалоба владельца
     24.09.2026): при разных размерах шрифта `vertical-align:1px` смещал кружок
     по-разному. Ровняем по середине строчных букв — тогда он стоит одинаково и у
     заголовка экрана, и в полосе карточки. */
  .q{display:inline-flex;align-items:center;justify-content:center;
     width:16px;height:16px;padding:0;margin-left:6px;vertical-align:middle;
     position:relative;top:-1px;
     background:transparent;border:1px solid var(--line-2);border-radius:50%;
     color:var(--muted);font-size:11px;font-weight:700;line-height:1;cursor:help;
     transition:color .12s,border-color .12s,background .12s}
  .q:hover,.q:focus-visible{background:var(--acc-dim);border-color:var(--acc);
                            color:var(--ink-hi);outline:0}
  /* Сама подсказка лежит в <body>, а не рядом со знаком: у карточек есть рамки и
     собственная прокрутка, и внутри них подсказка обрезалась бы по краю карточки.
     Координаты считает `hintShow` — от кнопки, как у врезок `inlineBox`. */
  .qbox{position:absolute;z-index:40;max-width:min(330px,calc(100vw - 16px));
        padding:9px 12px;background:var(--card-2);border:1px solid var(--line-2);
        border-radius:9px;font-size:13px;line-height:1.5;color:var(--ink);
        box-shadow:0 16px 40px -14px rgba(0,0,0,.7)}
  /* Значок вместо слова в колонке действий (жалоба владельца 20.09.2026: «в очереди
     огромные кнопки повторить и убрать, экран съезжает»). Слово задавало колонке свою
     ширину, и таблица ехала вбок на каждой строке, где действие вообще было. У значка
     ширина постоянная; смысл слова остаётся в `title` и `aria-label`. */
  .iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;
           background:transparent;border:1px solid var(--line-2);border-radius:8px;
           color:var(--muted);cursor:pointer;line-height:0;vertical-align:middle}
  .iconbtn + .iconbtn{margin-left:6px}
  .iconbtn svg{width:16px;height:16px;display:block}
  .iconbtn:hover{background:var(--card-2);color:var(--ink-hi)}
  /* Необратимое — красным на наведении: «убрать» и «отменить» не переигрываются. */
  .iconbtn.bad:hover{color:var(--bad);border-color:rgba(248,113,113,.45)}
  .iconbtn:disabled{opacity:.45;cursor:default}
  /* Свёрнутая группа одинаковых причин: сорок строк про один упавший ключ — одна
     строка с числом (30.09.2026). Подложка отличает заголовок группы от строки
     задачи, отступ у раскрытых — говорит, что они внутри него, а не рядом. */
  tr.grp>td{background:var(--card-2)}
  .grphead{display:flex;gap:10px;align-items:flex-start}
  /* 04.10.2026, владелец: «везде, где текст ошибки, оно немного разъезжается». Кнопка
     свёртки — 30 px, строка текста — 20 px, а ячейки таблицы прижаты к верху: значок
     сидел ниже текста, плашка вида в соседней ячейке — выше. Первая строка текста
     теперь по центру кнопки (5 px сверху), ячейки строки группы — по центру. */
  .grphead>div{padding-top:5px;line-height:20px}
  .grphead .pill{vertical-align:1px}
  tr.grp>td{vertical-align:middle}
  .grphead .grpsum{font-size:13.5px}
  .grphead .why{color:var(--bad)}
  .iconbtn.fold svg{transition:transform .12s}
  .iconbtn.fold.open svg{transform:rotate(180deg)}
  tr.grp-item>td:first-child{padding-left:30px}
  /* Выпуски одной причины — отдельной карточкой (владелец 03.10.2026: «проблемные и
     нормальные слеплены, кажется, что у тех, что снизу, те же проблемы»). Цвет кромки —
     чья беда: донор, настройка канала, прочая остановка, ожидание. */
  .grpcard{margin-bottom:12px;border-left:3px solid var(--bad);overflow:hidden}
  .grpcard.donor{border-left-color:var(--wait)}
  .grpcard.channel{border-left-color:var(--run)}
  .grpcard.cover{border-left-color:var(--muted)}
  .grpcard.pending{border-left-color:var(--wait)}
  .grpcard>.grpbar{padding:12px 16px;background:var(--card-2)}
  .grpcard.pending .grphead .why{color:var(--wait)}
  .grpcard tr.grp-item>td:first-child{padding-left:16px}
  .qgbar{display:flex;align-items:center;gap:10px}
  .qgbar>.grphead{flex:1;min-width:0}
  .restcap{padding:12px 16px 4px;font-size:13px;color:var(--muted)}
  /* Колонка действий одной ширины во всех строках: иначе «в работе» (есть кнопка) и
     «готово» (кнопки нет) двигали бы таблицу друг относительно друга при каждом
     обновлении очереди. */
  th.acts,td.acts{width:104px;white-space:nowrap;text-align:right}
  .subtabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line)}
  .subtabs a{padding:8px 14px;color:var(--muted);text-decoration:none;font-weight:550;
             font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .subtabs a:hover{color:var(--ink)}
  .subtabs a.on{color:var(--ink-hi);border-bottom-color:var(--acc)}
  /* Число у вкладки — это КОЛИЧЕСТВО файлов, а не номер запуска. Владелец 21.09 прочёл
     «Озвучка 2» как «вторая озвучка» и пошёл искать первую: цифра, стоящая рядом со
     словом, читается порядковым номером. Цифра в кружке так не читается — кружок-счётчик
     везде означает «сколько», и номера в него не пишут. Что именно сосчитано, говорит
     подпись значка и сама вкладка, когда на неё зайти. */
  .subtabs .cnt{display:inline-flex;align-items:center;justify-content:center;
                min-width:19px;height:19px;margin-left:7px;padding:0 6px;
                border:1px solid var(--line-2);border-radius:999px;
                background:var(--card-2);color:var(--muted);
                font-size:11px;font-weight:700;line-height:1;
                font-variant-numeric:tabular-nums;vertical-align:1px}
  .subtabs a.on .cnt{background:var(--acc-dim);border-color:var(--acc);color:var(--ink-hi)}

  /* Месяцы рядом, а не в столбик: канал с расписанием на квартал должен читаться
     одним взглядом, без прокрутки. */
  #months{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px;
          padding:12px 14px 14px}
  .mname{font-weight:650;margin-bottom:8px;text-transform:capitalize;font-size:13px}
  .dow,.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .dow span{font-size:10px;color:var(--muted);text-align:center;padding-bottom:3px}
  .day{position:relative;height:34px;border:1px solid var(--line);border-radius:6px;
       padding:3px 5px;font-size:11px}
  /* Дня без выхода нет в расписании — у него нет рамки, но число читается: прежняя
     прозрачность .32 давала 1.78:1, и дату было не разобрать. */
  .day.out{border-color:transparent}
  .day.out .n{color:#9a9ca3}
  .day.miss{border-color:rgba(255,148,131,.45)}
  .day.blocked{border-color:var(--bad)}
  .day .n{color:var(--muted)}
  .day .cnt{position:absolute;top:2px;right:4px;font-weight:700;font-size:11px;
            color:var(--ok)}
  .day .cnt.run{color:var(--run)}
  .day .cnt.plan{color:var(--wait)}
  .day .cnt.bad{color:var(--bad)}
  /* .fields — сетка полей формы (пресет, настройки проекта/канала). Боковой отступ
     18px и нижний 16px — в тон заголовку .sec (пункт 7 ТЗ, отступы): без него поля
     упирались прямо в рамку карточки, потому что у .card своего отступа нет, а .sec
     заголовку он даёт. */
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
          gap:22px 20px;padding:16px 18px 18px}
  /* Общий отступ для содержимого карточки сразу после заголовка .sec — тем же
     числом 18/16, что и у .fields выше (пункт 7 ТЗ). Не общее правило по всей
     карточке: строчные компоненты со своим отступом на каждую строку (таблицы,
     .stage, .ev, .cal, .grid, .chgrid — уже «от края до края» по замыслу) этот
     класс не получают и не должны — им и так хорошо. */
  .secbody{padding:16px 18px 18px}
  /* Ритм страницы (17.09.2026): соседние блоки экрана — карточки, панель «Сохранить»,
     формы — всегда на 16px друг от друга. Раньше отступ ставил каждый экран сам
     (inline margin-bottom), и там, где его забыли, блоки слипались. Вертикальные
     margin соседей схлопываются, поэтому старые inline-отступы 16px не удваиваются. */
  #app > * + *{margin-top:16px}
  form > .card + .card{margin-top:16px}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;
             line-height:1.3}
  .fld input,.fld select{width:100%;padding:8px 10px}
  .fld input[readonly]{opacity:.55}
  .fld .note{margin-top:6px;line-height:1.45}
  .sec .mklink{float:right;font-weight:500;font-size:12px;text-transform:none;
               letter-spacing:0;color:var(--acc-hi);text-decoration:none}
  .sec .mklink:hover{text-decoration:underline}
  /* Заголовок карточки настроек этапа — он же строка действия: «Начать» стоит там, где
     человек только что правил поля. Отдельной карточки «Действие» на одну кнопку больше
     нет — рамка и заголовок занимали ~130 px над настройками и не сообщали ничего. */
  .sec.stage-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px}
  .sec.stage-head .grow{flex:1 1 auto}
  .sec.stage-head .note{margin:0;font-weight:500;letter-spacing:0}
  /* Подвал той же карточки: как прошла запись и чем её откатить. Появляется, только
     когда есть что сказать, — иначе это была бы пустая строка с линией над ней. */
  .stage-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
              padding:11px 18px;border-top:1px solid var(--line)}
  /* Свой display сильнее браузерного [hidden]{display:none} — без этой строки подвал
     с атрибутом `hidden` так и остался бы на экране пустой полосой (та же ловушка,
     что у #tx-keep-row на вкладке «Сценарий»). */
  .stage-foot[hidden]{display:none}
  /* Свёрнутые настройки этапа: остаётся строка заголовка с «Начать». Правилом по
     детям карточки, а не `hidden` на каждом: у полосы пресета свой display, и он
     сильнее атрибута (см. выше). Подвал записи НЕ сворачивается: «не сохранено» и
     «Повторить» обязаны оставаться на виду, а пустой подвал прячет себя сам. */
  .card.folded>:not(.sec):not(.stage-foot){display:none}
  .card.folded>.sec{border-radius:var(--r)}
  .stage-foot .note{margin:0}
  .back{display:inline-block;margin-bottom:13px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--ink-hi)}
  button.small{padding:6px 13px;border-radius:8px;font-size:13px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .head h1{margin-bottom:5px}
  .head > button{margin-top:3px;flex:0 0 auto}   /* по верхней строке заголовка */
  .head-acts{display:flex;gap:8px;flex:0 0 auto;margin-top:3px;flex-wrap:wrap;
             justify-content:flex-end}
  .head-acts .bad{color:var(--bad);border-color:var(--bad)}
  /* Строка пресета: название и факты в одну строку, факты гаснут многоточием, а не
     переносятся — длинный список моделей не должен раздувать каждую строку. */
  .pitem .pline{display:flex;gap:10px;align-items:baseline;min-width:0}
  .pitem .pline .name{flex:0 0 auto}
  .pitem .ptag{font-size:11px;padding:1px 7px;font-weight:500}
  .pitem .pline .facts{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
                       white-space:nowrap;margin:0}
  .pitem .body{min-width:0}
  .pitem .pacts{white-space:nowrap;align-self:center;display:flex;gap:2px}
  #paidline{margin-top:6px}
  /* Счёт и знак подсказки в полосе свёрнутой карточки: «52 профиля» рядом с названием,
     но тише его; без отступов название, «?» и счёт слипались в одно слово (жалоба
     владельца 24.09.2026). */
  /* Сворачивание превращает полосу заголовка в `.sec.stage-head`, а у неё своё правило
     `.note{margin:0}` — оно и съедало отступ счёта. Поэтому правило счёта не менее
     точное, иначе «Тревоги в телеграм» и «горит 2» слипались в одно слово. */
  .sec .refcount,.sec.stage-head .refcount{margin:0 0 0 9px;font-weight:400;display:inline}
  .sec .q{margin-left:7px}
  /* Подписки для текста (22.09.2026): форма добавления встаёт в саму карточку, под
     полосой заголовка, — отдельного экрана на одно поле не нужно. */
  .subform,.srvkey-form{border-bottom:1px solid var(--line);display:grid;gap:10px}
  .subform[hidden],.srvkey-form[hidden]{display:none}
  /* Форма замены ключа живёт внутри карточки и раньше начиналась у самой рамки
     (жалоба владельца 24.09.2026): `hidden` снимался, а отступы `secbody` перебивались
     собственным `display:grid`. Задаём их явно. */
  .srvkey-form{padding:12px 14px 14px}
  .subform ol{margin:0;padding-left:20px;line-height:1.55}
  .subform code{font-family:var(--mono);font-size:12px;background:var(--well);
                padding:1px 5px;border-radius:var(--r-xs)}
  .subform textarea{width:100%;font-size:12px;min-height:110px}
  .subform .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .subform input.secret{width:min(460px,100%);font-family:var(--mono);font-size:12px}
  .subrow .ptag{font-size:11px;padding:1px 7px;font-weight:500}

  /* Тосты: ошибка действия видна там, где смотрит глаз, и не перекрывает работу.
     Раньше это был alert() — он останавливает страницу и требует нажать «ОК». */
  /* Модальное окно (18.09.2026). Это НЕ браузерный попап: `alert`/`confirm`/`prompt`
     останавливают страницу и не дают сравнить два поля. Здесь обычный <dialog> —
     закрывается Esc и кликом по фону, внутри живёт нормальная форма. */
  dialog.modal{border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);
               color:var(--fg);padding:0;max-width:720px;width:calc(100% - 32px)}
  dialog.modal::backdrop{background:rgba(0,0,0,.55)}
  dialog.modal .sec{display:flex;align-items:center;justify-content:space-between}
  dialog.modal .mbody{padding:16px 18px 18px;max-height:70vh;overflow:auto}
  dialog.modal .mfoot{display:flex;gap:10px;align-items:center;
                      padding:0 18px 18px}
  dialog.modal .x{background:transparent;border:0;color:var(--muted);font-size:18px;
                  cursor:pointer;padding:0 4px}
  #toasts{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;
          gap:9px;max-width:min(420px,calc(100vw - 32px));pointer-events:none}
  #toasts .toast{pointer-events:auto;background:var(--card);border:1px solid var(--line-2);
          border-left:3px solid var(--acc);border-radius:9px;padding:11px 14px;font-size:13px;
          box-shadow:0 16px 40px -14px rgba(0,0,0,.7);cursor:pointer;
          animation:toast-in .18s ease-out}
  #toasts .toast.bad{border-left-color:var(--bad);color:var(--bad)}
  #toasts .toast.ok{border-left-color:var(--ok)}
  /* Пачка ушла, но не вся: зелёное «готово» здесь врёт, красное «не сработало» — тоже.
     Янтарный — «часть требует внимания», числа и причина в самом тексте. */
  #toasts .toast.warn{border-left-color:var(--wait)}
  #toasts .toast.out{opacity:0;transform:translateX(12px);transition:opacity .2s,transform .2s}
  @keyframes toast-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

  .login{max-width:380px;margin:14vh auto;background:var(--card);
         border:1px solid var(--line);border-radius:16px;padding:34px 32px;
         box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
  .login .logo{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--ink-hi);
               margin-bottom:6px}
  .login .logo b{color:var(--acc-hi)}
  .login h1{font-size:19px;margin:0 0 22px;font-weight:650;color:var(--ink)}
  .login input{width:100%;margin-top:11px;padding:11px 13px}
  .login button{width:100%;margin-top:18px;padding:11px}

  .langs{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;max-height:140px;overflow:auto;
         border:1px solid var(--line-2);border-radius:10px;padding:10px}
  .langs label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
               border:1px solid var(--line-2);border-radius:16px;padding:4px 10px;
               cursor:pointer;transition:all .12s}
  .langs label:hover{border-color:var(--acc)}
  .langs label.on{background:var(--acc-dim);border-color:var(--acc);color:var(--acc-hi)}
  /* Выбор языков одной строкой: кнопка с итогом, список с поиском — по нажатию. */
  .lpick{margin-top:6px}
  .lpick-btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lpick-btn::after{content:" ▾";opacity:.7}
  .lpick-btn[aria-expanded="true"]::after{content:" ▴"}
  .lpick-pop{margin-top:8px}
  .lpick-pop[hidden]{display:none}
  .lpick-q{width:min(260px,100%)}
  .lpick-pop .langs{max-height:240px}
  /* Своя кнопка выбора файла (заявка владельца 20.09.2026: «а файл сделать кастомную
     кнопку upload как в муи, а не дефолтную»). Сам <input type=file> остаётся и
     остаётся достижимым с клавиатуры: он не display:none, а сведён в точку —
     display:none выкинул бы его из обхода Tab, и файл нельзя было бы выбрать без
     мыши. Рамку фокуса за невидимый input рисует видимая кнопка (:focus-within). */
  .filepick{display:inline-flex;align-items:center;position:relative}
  .filepick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;padding:0;
         border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .filepick .pickbtn{display:inline-block;background:transparent;color:var(--ink);
         border:1px solid var(--line-2);border-radius:8px;padding:6px 13px;font-size:13px;
         font-weight:650;letter-spacing:-.01em;cursor:pointer;transition:background .15s}
  .filepick:hover .pickbtn{background:var(--card-2);color:var(--ink-hi)}
  .filepick:focus-within .pickbtn{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-dim)}
  .modes{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
  .modes button{background:transparent;color:var(--muted);border:1px solid var(--line-2)}
  .modes button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}

  /* Виды пресетов — один раскрывающийся список вместо одиннадцати кнопок в строке.
     Строкой они занимали всю ширину шапки и читались как одиннадцать действий, хотя
     это один выбор; выбранное теперь написано на самой кнопке. Список висит поверх
     страницы по тому же правилу, что и `.inline-ask`: раскрытие фильтра не должно
     двигать список, ради которого его и открыли. */
  .pf-pick{position:relative}
  .pf-menu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;min-width:212px;
           padding:6px;background:var(--card-2);border:1px solid var(--line-2);
           border-radius:10px;box-shadow:0 16px 40px -14px rgba(0,0,0,.7)}
  .pf-menu[hidden]{display:none}
  .pf-item{display:block;width:100%;text-align:left;font-weight:500;
           background:transparent;color:var(--muted);border:1px solid transparent}
  .pf-item:hover{color:var(--ink-hi);background:var(--card)}
  .pf-item.on{color:var(--ink-hi);background:var(--acc-dim);border-color:var(--acc)}
  /* Черта отделяет виды пресетов производства от «Каналов» и «Озвучки Lumean»: это
     не части одного ролика, а другие сущности, и выбор их сразу убирает производство
     с экрана. Без черты набор читается как один плоский список равного. */
  .pf-sep{height:1px;background:var(--line);margin:5px 6px}
  .fldrow{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .fldrow>label:first-child{min-width:175px;color:var(--muted);font-size:12.5px;font-weight:550}

  @media (max-width:640px){ .grid{grid-template-columns:1fr 1fr} .ev time{flex-basis:76px} }
  /* ═══════════ Облик «Монтажная» — компоненты ═══════════
     Стоит последним, чтобы при равной специфичности выигрывать у базовых правил выше.
     Базовые правила оставлены как есть: они описывают раскладку, а здесь — облик. */
  body{font:14px/1.5 "Golos Text",-apple-system,"Segoe UI",system-ui,sans-serif;
       font-weight:420;letter-spacing:0;font-feature-settings:"tnum" 1}
  a{color:var(--ink-hi);text-decoration:underline;text-decoration-color:rgba(244,244,245,.28);
    text-underline-offset:3px;text-decoration-thickness:1px}
  a:hover{color:var(--ink-hi);text-decoration-color:var(--ink-hi)}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  ::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}

  /* шапка: верхняя строка монтажки, тёмная и тихая */
  header{background:#1e1f22;backdrop-filter:none;border-bottom:1px solid #17181a}
  nav,main{max-width:1240px}
  nav .brand{font-size:15px;font-weight:700;letter-spacing:-.01em;padding:11px 0;margin-right:26px}
  nav .brand b{color:var(--muted)}
  nav a.tab{padding:11px 12px;font-size:13.5px;font-weight:500;color:var(--muted);
            text-decoration:none;border-bottom-width:2px}
  nav a.tab.on{color:var(--ink-hi);border-bottom-color:var(--acc)}
  nav .who{font-size:13.5px}
  nav .who a{text-decoration:none}

  main{padding:22px 20px 70px}
  h1{font-size:23px;line-height:1.2;font-weight:650;letter-spacing:-.015em}
  .sub{font-size:13px;margin-bottom:14px}
  .back{font-size:13px;text-decoration:none;margin-bottom:10px}
  .mono,textarea{font-family:var(--mono)}
  .mono{font-size:11.5px}

  /* панели: без рамок, тоном; заголовок — полоса, как у панели монтажки */
  .card{background:var(--card);border:0;border-radius:var(--r)}
  .sec{background:var(--strip);border-bottom:0;padding:8px 14px;font-size:12.5px;
       font-weight:600;color:var(--ink);letter-spacing:0;border-radius:var(--r) var(--r) 0 0}
  .card > .sec:not(:first-child){border-radius:0}
  .sec.stage-head{padding:6px 8px 6px 14px}
  .secbody{padding:12px 14px 14px}
  .fields{padding:12px 14px 14px;gap:16px 18px}

  /* таблицы: заголовки строчными, линии едва заметны */
  th{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;color:var(--muted);
     padding:8px 14px;border-bottom:1px solid var(--line)}
  td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.045)}
  tr.row:hover,tr[data-job]:hover{background:#34363b}
  td.muted{font-size:13px}
  td.st + td.muted{white-space:nowrap}      /* время создания в очереди — одной строкой */

  /* кнопки: действие — кость, остальное — контур */
  button{border-radius:var(--r-sm);padding:7px 14px;font-weight:600;font-size:13.5px;letter-spacing:0}
  button:hover{background:var(--acc-hi)}
  button:disabled{opacity:1;background:transparent;color:#7d7f86;
                  box-shadow:inset 0 0 0 1px var(--line-2);cursor:not-allowed}
  button.ghost{background:transparent;color:var(--ink);border:0;
               box-shadow:inset 0 0 0 1px var(--line-2)}
  button.ghost:hover{background:var(--card-2);color:var(--ink-hi)}
  button.ghost:disabled{color:#7d7f86;box-shadow:none;background:transparent}
  button.small{padding:5px 11px;font-size:12.5px;border-radius:var(--r-sm)}
  input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
  select,input,textarea{background:var(--well);border:1px solid var(--line);border-radius:var(--r-sm);
                        padding:7px 10px;font-size:13.5px}
  /* Стрелка списка прижималась к правой рамке (жалоба владельца 24.09.2026, дважды).
     Отступом её не сдвинуть: браузер рисует свою стрелку у самого края независимо от
     padding. Поэтому браузерную убираем совсем и рисуем свою — фоновой картинкой,
     на честном расстоянии от рамки. Картинка в самом файле: внешних запросов у пульта
     нет и быть не должно. */
  select{appearance:none;-webkit-appearance:none;padding-right:30px;
         background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239a9ca3'%3E%3Cpath d='M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z'/%3E%3C/svg%3E");
         background-repeat:no-repeat;background-position:right 9px center;
         background-size:15px 15px}
  /* ── длинный список: та же строка, но с поиском (владелец 30.09.2026) ──
     Родной <select> остаётся на месте и остаётся источником правды — он просто не виден.
     Поэтому весь код, который читает .value и слушает change, продолжает работать, а
     сорок три места вызова трогать не пришлось. */
  .sfind{position:relative;display:inline-block;vertical-align:middle}
  .sfind > select{position:absolute;inset:0;opacity:0;pointer-events:none}
  .sfind > button{width:100%;text-align:left;font:inherit;color:var(--fg);
                  background:var(--card);border:1px solid var(--line);
                  border-radius:var(--r-sm);padding:8px 30px 8px 10px;cursor:pointer;
                  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239a9ca3'%3E%3Cpath d='M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z'/%3E%3C/svg%3E");
                  background-repeat:no-repeat;background-position:right 9px center;
                  background-size:15px 15px}
  .sfind > button:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-dim);
                        outline:none}
  .sfind > button[disabled]{opacity:.55;cursor:default}
  .sfind-pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);
             border-radius:var(--r);box-shadow:0 12px 34px rgba(0,0,0,.45);
             padding:8px;display:flex;flex-direction:column;gap:6px}
  .sfind-pop input{width:100%;padding:7px 9px}
  .sfind-list{overflow:auto;max-height:260px;margin:0;padding:0;list-style:none}
  .sfind-list li{padding:7px 9px;border-radius:var(--r-xs);cursor:pointer;
                 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sfind-list li.on{background:var(--acc-dim)}
  .sfind-list li.cur{font-weight:600}
  .sfind-list li[aria-disabled="true"]{opacity:.5;cursor:default}
  .sfind-none{padding:7px 9px;color:var(--off);font-size:13px}
  /* Множественный выбор рисуется списком, а не строкой: стрелка ему не нужна. */
  select[multiple]{background-image:none;padding-right:10px}
  select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-dim)}
  .fld label{font-size:12px}

  /* Значки-кнопки — как IconButton в MUI (просьба владельца 22.09.2026: «иконки вместо
     слов, как в муи нативные»): круглые, без рамки, подсветка кругом по наведению.
     Слово — в `title` и `aria-label`; необратимое краснеет на наведении. */
  .iconbtn{width:32px;height:32px;border:0;border-radius:50%;background:transparent;
           color:var(--muted);box-shadow:none;padding:0}
  .iconbtn svg{width:20px;height:20px}
  /* Два листа у «копии» заполняют квадрат целиком и рядом с корзиной выглядят крупнее,
     хотя размер тот же (жалоба владельца 24.09.2026). Уравниваем зрительно, а не по
     числу: у остальных значков внутри есть воздух. */
  .iconbtn.pcopy svg{width:18px;height:18px}
  .iconbtn + .iconbtn{margin-left:2px}
  /* Пока экран грузится, человек не должен гадать, нажалось ли (жалоба владельца
     24.09.2026: «тыкаю на вкладку каналы и сижу на старой с мыслью что ничего не
     произошло»). Полоса сверху и приглушённый старый экран: вкладка уже подсвечена,
     а содержимое ещё старое — без этого переход выглядит как «не сработало».
     Появляется не сразу: быстрый переход не должен мигать. */
  #busy{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:var(--line);
        overflow:hidden}
  #busy[hidden]{display:none}
  #busy i{display:block;height:100%;width:40%;background:var(--acc);
          animation:busy-slide 1.1s ease-in-out infinite}
  @keyframes busy-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  body.loading #app{opacity:.45;transition:opacity .12s}
  /* Колесо посреди страницы. Полосы сверху владельцу оказалось мало: глаз смотрит в
     содержимое, а не на край экрана (жалоба 24.09.2026). Поверх приглушённого старого
     экрана, по центру области содержимого. */
  #busy-spin{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:61;
             display:flex;flex-direction:column;align-items:center;gap:10px;
             padding:18px 22px;background:var(--card-2);border-radius:var(--r);
             box-shadow:0 18px 44px -16px rgba(0,0,0,.75);color:var(--muted);
             font-size:13px;pointer-events:none}
  #busy-spin[hidden]{display:none}
  #busy-spin i{width:26px;height:26px;border-radius:50%;display:block;
                border:2.5px solid var(--line-2);border-top-color:var(--acc);
                animation:busy-spin .8s linear infinite}
  @keyframes busy-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ #busy-spin i{animation-duration:2.4s} }
  /* Клики по старому экрану во время загрузки уводили бы не туда: он вот-вот исчезнет. */
  body.loading #app{pointer-events:none}
  @media (prefers-reduced-motion:reduce){ #busy i{animation:none;width:100%} }
  .iconbtn:hover{background:rgba(255,255,255,.08);color:var(--ink-hi)}
  .iconbtn.bad:hover{background:var(--bad-bg);color:var(--bad);border-color:transparent}
  .iconbtn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .iconbtn:disabled{background:transparent;box-shadow:none;opacity:.4}

  /* теги состояния: прямоугольник с тоном, слово внутри */
  .pill{border-radius:var(--r-xs);padding:2px 8px;font-size:12px;font-weight:600;letter-spacing:0}
  .s-done{background:var(--ok-bg);color:var(--ok)}
  .s-running{background:var(--run-bg);color:var(--run)}
  .s-queued{background:var(--wait-bg);color:var(--wait)}
  .s-error{background:var(--bad-bg);color:var(--bad)}
  .s-idle{background:var(--off-bg);color:var(--off)}
  .s-off{border:1px dashed var(--line-2)}

  /* Клипы на дорожке. В списке проектов колонка «Готово» — дорожка из клипов одной
     ширины. Порядок заметности — от того, что требует внимания: идёт (яркая бегущая
     штриховка) и ждёт (штриховка в янтарном контуре) громче всего, готово — тихий тон
     с ✓, не начато — пустой контур. Сплошной яркой заливки у «готово» нет нарочно:
     иначе список из двадцати проектов становился морем зелёного и тянул взгляд туда,
     где делать нечего. */
  tr.row td:nth-child(3){white-space:nowrap}
  tr.row td:nth-child(3) .note{white-space:normal}
  tr.row td:nth-child(3) .pill{min-width:112px;margin:0 1px 2px 0;padding:3px 8px;
        border-radius:var(--r-xs);font-weight:550;text-align:left;vertical-align:top}
  tr.row td:nth-child(3) .pill.s-done::before{content:"✓ ";font-weight:700}
  tr.row td:nth-child(3) .pill.s-idle{background:transparent;color:var(--muted);
        box-shadow:inset 0 0 0 1px var(--line-2)}
  tr.row td:nth-child(3) .pill.s-running{background:var(--run-clip);color:#eef5fc;
        background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.14) 0 5px,transparent 5px 10px);
        background-size:28px 28px;animation:clip-run 1.2s linear infinite}
  tr.row td:nth-child(3) .pill.s-queued{color:var(--wait);background-color:transparent;
        background-image:repeating-linear-gradient(135deg,rgba(239,192,99,.2) 0 3px,transparent 3px 7px);
        box-shadow:inset 0 0 0 1px var(--wait)}
  tr.row td:nth-child(3) .pill.s-error{background:var(--bad-clip);color:#210b07}
  tr.row td:nth-child(3) .pill.s-error::before{content:"! ";font-weight:800}
  @keyframes clip-run{to{background-position:28px 0}}

  /* Тонкая полоса этапов (выпуски, строки очереди) — та же азбука. */
  .segs{gap:2px}
  .segs i{height:7px;border-radius:3px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
  .segs i.done{background:rgba(141,219,166,.5);box-shadow:none}
  .segs i.running{background:var(--run);box-shadow:none;
        background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.28) 0 3px,transparent 3px 6px);
        background-size:17px 17px;animation:clip-run-s 1s linear infinite}
  .segs i.queued{background-color:transparent;opacity:1;box-shadow:inset 0 0 0 1px var(--wait);
        background-image:repeating-linear-gradient(135deg,rgba(239,192,99,.45) 0 2px,transparent 2px 4px)}
  .segs i.error{background:var(--bad-clip);box-shadow:none;height:9px;margin-top:-1px}
  .segs i.off{background:transparent;border:0;box-shadow:inset 0 0 0 1px var(--line-2)}
  @keyframes clip-run-s{to{background-position:17px 0}}

  /* Шапка проекта: дорожка во всю ширину, клипы подписаны своими этапами (из `title`),
     над ней — линейка, на границе сделанного стоит плейхед. Это и есть главное место
     облика: где стоит проект, читается словами, а не шестью безымянными чёрточками. */
  .head > div:first-child{flex:1 1 auto;min-width:0}
  .head .segs{max-width:none !important;margin-top:12px !important;gap:2px;position:relative;
        padding-top:9px;
        background:repeating-linear-gradient(90deg,var(--line-2) 0 1px,transparent 1px 10px) 0 0/100% 4px no-repeat,
                   repeating-linear-gradient(90deg,#65676e 0 1px,transparent 1px 50px) 0 0/100% 7px no-repeat}
  .head .segs i{height:26px;position:relative;overflow:visible;border-radius:var(--r-xs);
        font-style:normal;font-size:12px;line-height:26px;font-weight:550;padding:0 9px;
        color:#8e9097;white-space:nowrap;text-overflow:ellipsis;margin-top:0}
  .head .segs i::after{content:attr(title);display:block;overflow:hidden;text-overflow:ellipsis}
  .head .segs i.done{background:var(--ok-bg);color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
  .head .segs i.done::after{content:"✓ " attr(title)}
  .head .segs i.running{background-color:var(--run-clip);color:#eef5fc;
        background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 6px,transparent 6px 12px);
        background-size:34px 34px;animation:clip-run-l 1.4s linear infinite;box-shadow:inset 3px 0 0 var(--run)}
  .head .segs i.queued{background-color:transparent;color:var(--wait);
        background-image:repeating-linear-gradient(135deg,rgba(239,192,99,.2) 0 4px,transparent 4px 9px);
        box-shadow:inset 0 0 0 1px var(--wait)}
  .head .segs i.error{background:var(--bad-clip);color:#210b07;box-shadow:none}
  .head .segs i.error::after{content:"! " attr(title);font-weight:700}
  @keyframes clip-run-l{to{background-position:34px 0}}
  /* плейхед: левый край первого несделанного клипа */
  .head .segs i:not(.done):not(:not(.done) ~ i)::before{content:"";position:absolute;left:-2px;
        top:-12px;bottom:-4px;width:2px;background:var(--acc);border-radius:1px;z-index:2}
  .head .segs + .note{font-size:12.5px;font-weight:550;margin-top:6px}

  /* строки-этапы и точки: квадратная метка вместо круга */
  .stage{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.045);gap:12px}
  .stage .dot,.cal .dot{border-radius:6px;flex-basis:20px;height:20px;font-size:11px}
  .stage .name{font-weight:600}
  .stage .note,.stage .facts{margin-top:1px;line-height:1.4}
  .facts{font-size:13px}
  .note{font-size:12.5px}
  .pitem:hover{background:#313237}

  /* Плашка «задачи никто не выполняет» — янтарная, с полосой слева: она про деньги и
     время (поставленное не пойдёт), и тише обычной панели ей быть нельзя. */
  .card.alert-wait{background:#332d22;box-shadow:inset 3px 0 0 var(--wait)}
  .card.alert-wait .stage{border-bottom:0;padding:11px 16px}
  .card.alert-wait .dot{display:none}
  .card.alert-wait .name{color:var(--wait)}
  .card.alert-wait .facts{color:var(--ink);max-width:96ch}

  /* вкладки проекта: переключатель страниц, как внизу монтажки */
  .subtabs{border-bottom:0;background:#232428;border-radius:var(--r);padding:3px;gap:2px;
           margin-bottom:12px;display:inline-flex;flex-wrap:wrap}
  .subtabs a{border:0;margin:0;padding:6px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;
             text-decoration:none;display:inline-flex;align-items:center}
  .subtabs a:hover{background:#2c2d32}
  .subtabs a.on{background:var(--card-2);color:var(--ink-hi);box-shadow:inset 0 -2px 0 var(--acc)}
  .subtabs .cnt{border:0;background:rgba(255,255,255,.06);color:var(--muted);min-width:18px;
                padding:0 5px;margin-left:7px;height:17px;border-radius:var(--r-xs);font-weight:500;
                font-size:11.5px;vertical-align:baseline}
  .subtabs a.on .cnt{background:rgba(255,255,255,.1);border:0;color:var(--ink)}

  /* Выбор режима — сегмент, а не кнопки: выбранный пункт светлее соседей, но НЕ цвета
     «кости». Кость — цвет платного действия («Начать», «Получить текст»), и режим,
     закрашенный ею, выглядел бы как уже нажатый заказ. */
  .modes{gap:0;background:var(--well);border-radius:9px;padding:3px;display:inline-flex}
  .modes button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font-size:13px;
                box-shadow:none}
  .modes button:hover{background:var(--card-2);color:var(--ink)}
  .modes button.on{background:var(--card-2);color:var(--ink-hi);border:0;
                   box-shadow:inset 0 0 0 1px var(--line-2),inset 0 -2px 0 var(--ink)}
  .langs{border:0;background:var(--well);border-radius:var(--r);padding:8px;gap:4px}
  .langs label{border:0;border-radius:var(--r-xs);padding:3px 9px 3px 6px;font-size:12.5px;
               background:rgba(255,255,255,.04)}
  /* Дни недели — не языки: их ровно семь, они короткие и стоят в ряд. Круглая плашка
     съедала края у понедельника и воскресенья (жалоба владельца 24.09.2026), поэтому
     у ряда дней свой вид: прямоугольные равные ячейки без общего колодца. */
  .langs.days{background:transparent;padding:0;gap:6px;flex-wrap:wrap}
  .langs.days label{border-radius:var(--r-xs);padding:6px 12px;min-width:46px;
                    justify-content:center;background:var(--well);
                    box-shadow:inset 0 0 0 1px var(--line)}
  .langs.days label:hover{background:var(--card-2)}
  .langs.days label.on{background:var(--acc-dim);color:var(--ink-hi);
                       box-shadow:inset 0 0 0 1px var(--acc)}
  /* Сама галочка внутри дня не нужна: выбранный день виден заливкой, а квадратик
     только сужает ячейку. Для читалки и клавиатуры поле остаётся на месте. */
  .langs.days input{position:absolute;opacity:0;width:1px;height:1px}
  .langs.days label{position:relative}
  .langs label:hover{background:rgba(255,255,255,.08)}
  .langs label.on{background:var(--acc-dim);color:var(--ink-hi);box-shadow:inset 0 0 0 1px var(--acc)}

  /* пакетный запуск: у каждого этапа своя колонка, без рамки */
  .bcard{border:0 !important;border-radius:var(--r-sm) !important;background:#2a2b30;padding:10px 12px !important}

  /* Нативные части (галочки, списки, плеер, подсказка поля) — тёмные: без этого
     браузер рисовал белую пустую галочку почти как отмеченную «кость». */
  :root{color-scheme:dark}
  ::placeholder{color:#94969d;opacity:1}            /* 5.4:1 на колодце поля */
  select{max-width:100%}
  /* Фокус с клавиатуры у галочек и переключателей: базовое `input:focus{outline:0}`
     гасило общее кольцо, и по списку языков Tab шёл вслепую. */
  input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{
    outline:2px solid var(--acc);outline-offset:2px;box-shadow:none}
  /* Недоступное поле (значение из пресета канала, запертая группа) — не как редактируемое. */
  select:disabled,input:disabled,textarea:disabled{background:transparent;color:var(--muted);
    border-style:dashed;cursor:not-allowed;opacity:1}
  button.ghost:disabled{box-shadow:inset 0 0 0 1px var(--line)}
  .iconbtn:disabled,.iconbtn:disabled:hover{background:transparent;color:#7d7f86;opacity:1}
  td.when{white-space:nowrap}
  .rel-below{display:block;margin:6px 0 0;white-space:nowrap}
  #pf-open::after{content:" ▾";opacity:.7}
  #pf-open[aria-expanded="true"]::after{content:" ▴"}
  /* Кнопка в полосе заголовка панели: полоса держит её в себе (плавающая кнопка
     вылезала в первую строку и сбивала её значки) и ставит по центру высоты. */
  .card > .sec{display:flow-root}
  .card > .sec.stage-head{display:flex}
  .iconbtn.fold svg{transition:transform .15s}
  .iconbtn.fold[aria-expanded="true"] svg{transform:rotate(180deg)}
  @media (prefers-reduced-motion:reduce){ .iconbtn.fold svg{transition:none} }
  /* «Сценарий»: режим и выбор файла — одной строкой; готовый текст — превью в колодце
     с затуханием, целиком — в читалке. */
  .srcrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .srcrow .modes{margin:0}
  .srcfile{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap}
  .srcfile[hidden]{display:none}
  .scn-preview{white-space:pre-line;max-height:11.5em;overflow:hidden;position:relative;
               background:var(--well);border-radius:var(--r-sm);padding:12px 14px;
               font-size:14px;line-height:1.65;color:var(--ink)}
  .scn-preview:not(.empty)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2em;
               background:linear-gradient(transparent,var(--well));pointer-events:none}
  .scn-preview.empty{color:var(--muted);max-height:none}
  .scn #src-box > summary{display:none}
  .scn #src-box[open]{margin-top:12px}
  .scn #src-text{min-height:260px}
  dialog.modal.reading{width:min(860px,94vw)}
  .reader{white-space:pre-line;max-width:68ch;max-height:68vh;overflow:auto;font-size:15px;
          line-height:1.75;color:var(--ink);padding-right:6px}
  .sec > [style*="float:right"]{margin:-4px 0}
  .sec.grp{background:transparent;color:var(--muted);padding-top:12px;border-radius:0}
  .thumb:focus-within .again,.thumb .again:focus-visible{opacity:1}
  .thumb:has(video) .again{top:3px;bottom:auto}
  dialog.lb .lbbar{color:var(--ink)}
  .chcard.paused{opacity:1}
  .chcard.paused h3{color:var(--muted)}
  .chcard:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #statusbtns{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
  /* Плашка статуса стоит в одном ряду с кнопками и была заметно ниже них (жалоба
     владельца 24.09.2026). Ровняем по высоте самих кнопок, а не по строке текста. */
  #statusbtns .pill{display:inline-flex;align-items:center;min-height:30px;
                    padding:0 12px;border-radius:var(--r-sm)}
  .grid > div{padding:14px 18px}
  .grid .k{padding:0;border:0}
  /* фаза выпуска: ошибка — единственная сплошная заливка с «!» */
  .pill.clip.s-error{background:var(--bad-clip);color:#210b07}
  .pill.clip.s-error::before{content:"! ";font-weight:800}
  /* «не участвует» — средней чертой, а не пустым контуром: иначе опубликованный выпуск
     с пропущенным шагом читался как недоделанный */
  .segs i.off{box-shadow:none;background:linear-gradient(var(--line-2),var(--line-2)) center/100% 1px no-repeat}

  /* всплывающее */
  .inline-ask,.qbox,.pf-menu{background:var(--card-2);border-color:var(--line-2);border-radius:var(--r);
        box-shadow:0 14px 34px -12px rgba(0,0,0,.6)}
  .inline-ask button.ghost:hover,.pf-menu button.ghost:hover{background:rgba(255,255,255,.08)}
  .q{border-color:var(--line-2);width:15px;height:15px;font-size:10px}
  .q:hover,.q:focus-visible{background:var(--acc-dim);border-color:var(--acc)}
  .pf-item.on{color:var(--ink-hi);background:var(--acc-dim);border-color:var(--acc)}
  .err{border-radius:var(--r);border:0;box-shadow:inset 3px 0 0 var(--bad)}
  .bar{background:var(--well);border-radius:3px;height:4px}
  .bar i{background:#8a8c93}
  .pl{border:0;border-radius:var(--r);background:var(--well)}
  .pl button{background:var(--ink)}
  .pl button:hover{background:var(--ink-hi)}
  .pl button i{border-left-color:var(--on-acc)}
  .pl button.on i{background:linear-gradient(to right,var(--on-acc) 0 3px,transparent 3px 7px,var(--on-acc) 7px 10px)}
  .pl .bar{background:rgba(255,255,255,.1)}
  .pl .bar i{background:var(--ink)}
  .thumb img{border-radius:var(--r-xs)}
  .thumb .again{background:rgba(30,31,34,.88);border-radius:var(--r-xs)}
  .thumb .again:hover{background:var(--acc);color:var(--on-acc)}
  .chcard{border:0;border-left:3px solid var(--off);border-radius:var(--r)}
  .chcard:hover{background:#33353a}
  .grid .k,.res h3{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
  .grid div{border-right-color:rgba(255,255,255,.045)}
  .grid{border-bottom-color:rgba(255,255,255,.045)}
  #toasts .toast{background:var(--card-2);border:0;border-left:3px solid var(--acc);border-radius:var(--r)}
  #toasts .toast.bad{border-left-color:var(--bad)}
  #toasts .toast.ok{border-left-color:var(--ok)}
  #toasts .toast.warn{border-left-color:var(--wait)}
  dialog.modal{border:0;border-radius:var(--r);background:var(--card);color:var(--ink)}
  .login{border:0;border-radius:6px}
  .login .logo b{color:var(--muted)}

  @media (prefers-reduced-motion:reduce){
    .segs i.running,.head .segs i.running,tr.row td:nth-child(3) .pill.s-running{animation:none}
  }
  @media (max-width:640px){
    main{padding:16px 16px 60px}
    /* таблица шире телефона листается внутри своей панели, а не тащит страницу вбок */
    .card:has(> table){overflow-x:auto}
    .head{flex-wrap:wrap}
    .head .segs i{font-size:10.5px;padding:0 5px}
    /* шесть вкладок шире телефона: меню листается само, страница вбок не едет */
    nav{overflow-x:auto;scrollbar-width:none}
    nav a.tab{padding:15px 9px;white-space:nowrap}
  }
</style>
</head>
<body>

<header>
  <nav>
    <span class="brand">Studio<b>.</b></span>
    <!-- «Сводка» стоит первой намеренно: это единственный экран, который читают
         целиком и каждый день, и с него начинается утро оператора — вход в студию
         без адреса ведёт сюда же (homeHash). Вкладка остаётся на месте и у того, кто
         убрал сводку со входа: это его единственная дорога назад. -->
    <a class="tab" href="#/digest" id="tab-digest">Сводка</a>
    <!-- «Выпуски» — своя вкладка с 03.10.2026 (владелец: «там очень удобно отслеживать
         проблемы»). Раньше список жил внутри «Каналов», и найти его можно было только
         по ссылке со страницы канала. -->
    <a class="tab" href="#/releases" id="tab-releases">Выпуски</a>
    <a class="tab" href="#/channels" id="tab-channels">Каналы</a>
    <a class="tab" href="#/projects" id="tab-projects">Проекты</a>
    <a class="tab" href="#/queue" id="tab-queue">Очередь</a>
    <a class="tab" href="#/presets" id="tab-presets">Пресеты</a>
    <!-- Вкладки «Профиль» здесь нет намеренно: в профиль ведёт имя человека справа —
         его рисует showWho(). Два входа в одно место — лишний выбор без разницы. -->
    <span class="who" id="who"></span>
  </nav>
</header>

<div id="busy" hidden aria-hidden="true"><i></i></div>
<div id="busy-spin" hidden aria-hidden="true"><i></i><span>загрузка…</span></div>
<main id="app"><div class="empty">загрузка…</div></main>

<script>
const $ = (h, ...kids) => { const e = document.createElement('div'); e.innerHTML = h; return e; };
const app = document.getElementById('app');

// Состояния по-русски и одинаковые везде — ТЗ §13. «Готово частично» и «остановлено»
// не ошибки, и красить их красным было бы враньём.
const STATE_TITLE = {done:'готово', running:'в работе', queued:'в очереди',
                     partial:'готово частично', cancelled:'остановлено',
                     blocked:'нужно действие', error:'ошибка', idle:'не начато',
                     off:'не участвует'};
const STATE_CLS = {done:'s-done', running:'s-running', queued:'s-queued',
                   partial:'s-queued', cancelled:'s-idle', blocked:'s-error',
                   error:'s-error', idle:'s-idle', off:'s-off'};
const DOT = {done:'✓', running:'◐', queued:'·', partial:'◑', cancelled:'–',
             blocked:'!', error:'!', idle:'', off:'–'};

/* Значки действий в строках таблиц — одним набором здесь, а не по месту: их четыре,
   и они обязаны выглядеть одинаково в очереди, в выпуске, в текстах и в обложках.
   `currentColor` — цвет берётся от кнопки, поэтому значок светлеет вместе с рамкой на
   наведении и гаснет вместе с ней у `disabled`. Значок без подписи понятен не всем,
   поэтому рисуется он только вместе с `title` (см. `actions()`). */
const ICON = {
  // Значки — из набора Material Icons (Apache 2.0), как в MUI: владелец попросил
  // «иконки вместо слов, как в муи нативные» (22.09.2026). Одна азбука на весь пульт.
  // перечёркнутый круг — «отменить то, что сейчас идёт»
  cancel: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c =>

function when(ts){

function size(n){
  n = Number(n || 0);
  if (n < 1048576) return (n/1024).toFixed(0) + ' КБ';
  if (n < 1073741824) return (n/1048576).toFixed(0) + ' МБ';
  return (n/1073741824).toFixed(2) + ' ГБ';

function ago(sec){
  if (sec == null) return '';
  if (sec < 60) return sec + ' с';
  if (sec < 3600) return Math.round(sec/60) + ' мин';
  if (sec < 86400) return Math.round(sec/3600) + ' ч';
  return Math.round(sec/86400) + ' дн';
}
class NeedLogin extends Error {}

// ИСПРАВЛЕНО 04.09.2026: пульт зовёт свой API абсолютным путём «/ui/…», а живёт он
// под префиксом /studio. Из браузера такой путь уходит в КОРЕНЬ платформы, то есть
// в кабинет, и возвращается 404 — включая вход, так что зайти было нельзя вообще.
// Соседям это уже чинилось; свою же страницу я проверял curl'ом сразу по полному
// адресу и потому не увидел.
// База берётся из адреса страницы, а не из настройки: одна сборка годится и под
// префиксом, и при запуске пульта отдельно.
const API = (location.pathname.match(/^\/studio(?=\/|$)/) || [''])[0];
// Адреса файлов проекта приходят от сервера путём пульта (`/ui/projects/…/file/`) —
// ему, как и `api()`, нужен префикс пульта. Кабинетные пути (`/p/…`) — как есть.
const pultUrl = path => (String(path || '').startsWith('/ui/') ? API + path : (path || ''));

// Значок вкладки браузера. Ставится здесь, а не в разметке, по той же причине, что и
// адреса запросов: страница открывается и в корне, и под префиксом. В шапке логотипа
// нет — владелец убрал его 24.09.2026, оставив только вкладку.
(function brandMarks(){
  for (const [rel, href] of [['icon', '/static/favicon-64.png'],
                             ['apple-touch-icon', '/static/logo-180.png']]){
    const link = document.createElement('link');
    link.rel = rel;
    link.href = API + href;
    document.head.append(link);
  }
})();

async function api(path, opts){
  const r = await fetch(API + path, opts);
  const body = await r.json().catch(() => ({detail:'ответ не разобран'}));
  if (r.status === 401) throw new NeedLogin(body.detail || 'нужен вход');
  if (!r.ok) throw new Error(body.detail || body.error || ('HTTP ' + r.status));
  return body;
}
async function post(path, payload){
  return api(path, {method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(payload || {})});
}
// Сообщение о неудавшемся действии. Пять секунд, потом уходит само; клик убирает
// раньше. До этого здесь был alert(): он останавливает страницу, требует нажать «ОК»
// и не даёт ни перечитать текст, ни сравнить два подряд.
const TOAST_MS = 5000;
function toast(text, kind){
  let box = document.getElementById('toasts');
  if (!box){
    box = document.createElement('div');
    box.id = 'toasts';
    document.body.append(box);
  }
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'bad');
  el.textContent = String(text || 'что-то пошло не так');
  const kill = () => {
    if (!el.isConnected) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  };
  el.onclick = kill;
  box.append(el);
  setTimeout(kill, TOAST_MS);
}
